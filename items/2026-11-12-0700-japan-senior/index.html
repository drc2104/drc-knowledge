ッグサイト【見守りナースコールシステム】 - 平和テクノシステム", "url": "https://www.youtube.com/watch?v=lpHGdamzhAc"}}, {"term": "이승(移乗)", "easy": "침대와 휠체어 사이를 옮겨 앉히는 동작.", "why": "이 동작을 돕는 로봇·리프트가 전시회 주요 품목이었고, 돌봄 종사자 허리 부담과 직결된다."}, {"term": "유마니튀드", "easy": "눈 맞춤·말·접촉으로 인지증 어르신을 돌보는 프랑스 발 돌봄 기법.", "why": "시니어 돌봄 콘텐츠의 소재로 쓸 수 있다."}, {"term": "케어매니지먼트·케어플랜", "easy": "돌봄 계획을 짜는 전문가(케어매니저)와 그가 만드는 계획서.", "why": "어떤 용구를 쓸지 정하는 데 영향력이 큰 사람들이라 일본 판매 때 설득 대상."}, {"term": "배설 케어", "easy": "배설을 돕고 기저귀·속옷을 알맞게 고르는 돌봄.", "why": "요실금팬티를 일본에 팔 때 쓰는 현장 언어."}, {"term": "골반저근 운동", "easy": "골반 아래 근육을 조였다 풀며 단련하는 운동.", "why": "배설케어 플라자 미니 세미나 주제였고, 요실금 관련 정보 콘텐츠 소재가 된다(효능 단정 없이 소개)."}, {"term": "지역공생사회", "easy": "나이·장애와 상관없이 동네에서 함께 사는 사회를 만들자는 일본 정책 방향.", "why": "일본 정책 문서와 세미나에 자주 나오는 낱말이라 자료를 읽을 때 필요."}, {"term": "은발경제(银发经济)", "easy": "노인을 위한 상품·서비스 시장을 키우자는 중국 정책 말.", "why": "중국 판로에 고령 용품을 낼 때 맞춰 쓸 정책 키워드."}, {"term": "아카이브 배신(다시보기)", "easy": "끝난 세미나를 나중에 다시 볼 수 있게 열어 두는 것(다시보기).", "why": "이번 행사 내용을 확인할 유일한 방법. 웹 전시 등록이 필요하다."}]}</script>
