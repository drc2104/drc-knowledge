<script id="item-data" type="application/json">{"id": "2026-11-06-futuring26", "date": "2026-11-06", "slot": "대표 공유", "topic": "마케팅", "type": "컨퍼런스 강연", "title": "FUTURING 26 강연 정리", "subtitle": "피처링 소셜 마케팅 컨퍼런스 · 세션 14개", "event": {"name": "FUTURING 26", "host": "피처링", "when": "2026.10.28(수) 09:30~17:30", "where": "GS타워 아모리스 역삼", "theme": "The Next Wave of Marketing"}, "headline": "인플루언서 마케팅은 이제 감이 아니라 기준과 AI 실행의 싸움이다", "hl": ["기준과", "실행의"], "summary3": [["돈이 소셜로 몰린다.", "국내 광고주 디지털 예산 중 인플루언서·소셜 비중이 6%에서 34%로(기사 기준, 2021→2026 상반기). 뷰티는 61% 이상."], ["팔로워 수는 믿을 지표가 아니다.", "14개 강연 중 5개가 같은 말을 했다. 실제 판매·광고 성과로 고르고 장기 관계(크루·N차 딜)로 키운다."], ["AI는 답이 아니라 일을 끝내는 쪽으로 간다.", "차이는 모델이 아니라 회사가 쌓은 기준과 데이터에서 난다. 사람은 판단·관계·승인을 맡는다."]], "cases": [["사례", "숫자"], ["스파오 크리에이터 크루 500명", "광고 ROAS 2,200%"], ["로레알: 평균 2,040만 회 계정의 실제 광고", "3.95만 회"], ["브이캣: 쇼핑라이브 AI 방송 vs 사람 방송", "매출 1위 vs 3위"]], "shift": {"from": "6%", "to": "34%", "cap": "국내 인플루언서·소셜 예산 비중. 피처링 백서 표기는 5~10% → 평균 30%대, 뷰티 60% 이상"}, "chart": {"t": "미국 크리에이터 광고비 (IAB 인용, 단위 조원)", "u": "조", "rows": [["2021", 18.7, "c"], ["2026", 60, "a"]]}, "keynums": [["600", "석", "좌석(참석률 88%)"], ["90", "점", "만족도"], ["83", "%", "재참석 의향"], ["34", "건", "현장 기사"]], "overviewNote": "숫자 출처: 피처링 공식 후기(11/5)·백서, 시사저널e·아시아경제. 데이터넷은 참석 약 500명으로 보도. 백서는 주최사가 직접 정리한 요약이라 자사 서비스 홍보 성격이 섞여 있습니다.", "sectionLabel": "강연", "sections": [{"tm": "09:30", "name": "장지훈", "co": "피처링 대표", "title": "The Next Wave of Marketing", "q": "답을 얼마나 빨리 말하느냐보다, 우리 일을 어디까지 완성할 수 있느냐가 중요해졌습니다.", "hl": ["완성"], "pts": ["<b>숫자는 영향력을 말해 주지 않는다.<\/b> 비슷한 육아 인플루언서 2명에게 같은 제품을 맡겼더니 팔로워가 훨씬 많은 쪽은 1개도 못 팔고, 적은 쪽이 100개 넘게 팔았다. 이 문제의식에서 가짜 팔로워를 걸러내는 '피처링 스코어'가 나왔다(2019년 출발).", "<b>판이 바뀌는 방향 3가지:<\/b> 메가 인플루언서에서 다수 인플루언서로, 국내에서 글로벌로, 브랜딩에서 커머스·성과로.", "<b>올라탈 물결 ① 버티컬 AI 에이전트:<\/b> AI로 아낀 시간의 절반이 재작업에 쓰인다. 자사 노하우대로 끝까지 해내는 전문 에이전트가 성과를 가른다.", "<b>물결 ② 소셜 데이터 관리 체계:<\/b> 소셜·자사·외부 분석 데이터를 하나로 잇고, 판단 기준·실행·결과를 회사 플레이북으로 쌓는다.", "<b>물결 ③ 크로스보더:<\/b> 해외 인플루언서 캠페인 비중이 1년여 만에 13%에서 34%로.", "<b>소비자 변화:<\/b> 포털 검색 대신 크리에이터의 신뢰·진정성을 보고 산다(아시아경제).", "<b>발표:<\/b> 피처링 AI 에이전트 첫 공개. 자연어로 인플루언서 탐색·선정·예산·운영·성과 분석·단가 협상·전자계약까지. 한국·미국·일본 우선."], "nums": [["1,800만", "", "분석 중인 인플루언서 채널"], ["4억", "건", "분석 콘텐츠"], ["60", "조원", "미국 크리에이터 광고비(IAB 인용, 5년 새 3배+)", 1], ["61", "%+", "뷰티 예산 중 인플루언서 협업 비중"]], "bars": {"t": "해외 인플루언서 캠페인 비중(피처링 고객, 약 1년)", "u": "%", "rows": [["이전", 13, "c"], ["현재", 34, "b"]]}, "shift": {"from": "6%", "to": "34%", "cap": "국내 광고주 디지털 예산 중 인플루언서·소셜 비중 (2021 → 2026 상반기, 기사 기준). 백서 표기는 '5~10% → 평균 30%대'"}, "table": null, "src": "피처링 백서 · 시사저널e · 아시아경제 · 이데일리 · 데이터넷", "grade": "확인"}, {"tm": "09:50", "name": "최화섭", "co": "피처링 기술책임자", "title": "From Insight to Action", "q": "AI를 계속 일하게 만드는 건 더 좋은 모델이 아니라, 우리 산업의 제대로 된 기준입니다.", "hl": ["기준"], "pts": ["<b>지금 AI 활용은 단편적:<\/b> '찾아줘·써줘·정리해줘'처럼 한 번 답받고 끝. 소셜 마케팅이 원하는 건 돈을 넣으면 매일 성과가 나오는 '성과 기계'.", "<b>범용 AI vs 버티컬 AI 비교 시연:<\/b> '올리브영 입점 스킨케어 브랜드의 9월 인기 콘텐츠'를 물으면 범용 AI는 검색 요약에서 멈추고, 버티컬 AI는 실제 콘텐츠를 반응순으로 보여 주고 구매 의도·브랜드 평가까지 분석해 매달 반복되는 기준으로 쌓는다.", "<b>정답은 결합:<\/b> 버티컬 AI가 산업 맥락·기준을 쥐고, 계속 좋아지는 범용 모델이 그 위에서 일한다.", "<b>범용 모델이 못 본 것:<\/b> 수십조 토큰을 학습했어도 '이 협상이 성사됐는지, 얼마에 됐는지'는 본 적이 없다. 그래서 자체 협상 데이터가 경쟁력.", "<b>시연 범위:<\/b> 계약서·콘텐츠 가이드 작성 → 댓글 구매의도 분류 → 숏폼 음성·자막 검수(핵심 메시지 언급, 공정위 광고 표기 여부)까지.", "<b>버티컬 AI 요건 4가지:<\/b> 산업 이해, 믿을 수 있는 데이터, 실행력, 제품 완성도.", "<b>마케터에게 남는 질문:<\/b> 우리 팀의 기준은 어디에 쌓이고 있는가. 노출이 전환으로 이어지는지 추적할 기준이 있는 팀이 AI 덕을 가장 크게 본다."], "nums": [["15만", "건", "실제 협상 대화 축적(성사·응답률·금액 변화)"], ["100", "개", "분석 카테고리"], ["5,000", "건+", "글로벌 브랜드 콘텐츠 주간 분석"]], "bars": null, "shift": {"from": "95만원", "to": "72만원", "cap": "AI 에이전트 단가 협상 시연: 크리에이터 제안(2차 활용 90일) → 에이전트 역제안(릴스 1 + 스토리 1, 게시일 10/2 유지)"}, "table": null, "src": "피처링 백서 · 메트로서울 · 시사저널e · 아시아경제 · 위런치", "grade": "확인"}, {"tm": "10:10", "name": "임효철", "co": "HSAD 상무", "title": "AI·데이터 시대, 풀퍼널 관점에서 인플루언서 마케팅은 어떻게 진화하는가", "q": "예측보다 대응이 중요한 시대, 화제에서 끝나지 않고 매출까지 증명해야 합니다.", "hl": ["매출까지"], "pts": ["<b>서사 설계:<\/b> 브랜드가 이야기를 들려주는 방식에서, 사람들이 스스로 반응하고 퍼뜨릴 구조를 설계하는 방식으로.", "<b>흐름:<\/b> 인사이트 발굴 → 유튜브 바이럴 콘텐츠 제작 → 잘라서 성과형 광고로 재가공 → 마이크로 인플루언서로 확산.", "<b>판매 시점 설계:<\/b> 노출량·빈도·확산 속도와 구매 전환의 관계를 분석해 매출이 오르는 집행 시점과 강도를 정한다.", "<b>채널 선택:<\/b> 팔로워 수가 아니라 구매 타깃 기준. 검증된 콘텐츠(1주 20만 회+, 반응 1만+)에만 광고비를 얹는다.", "<b>매주 점검:<\/b> 목표 대비 지표를 매주 추적, 막힌 곳이 보이면 방향 전환. 캠페인 대행이 아닌 퍼널 전체 책임 파트너."], "nums": [["20만", "회+", "부스팅할 콘텐츠 기준: 1주 조회수"], ["1만", "+", "부스팅할 콘텐츠 기준: 반응 수"]], "bars": null, "shift": null, "table": null, "src": "피처링 백서", "grade": "확인"}, {"tm": "10:40", "name": "정재원", "co": "WPP Media Korea 인플루언서 리드", "title": "From Brief to Impact: WPP Open이 바꾸는 AI 네이티브 마케팅", "q": "AI로 업무의 속도와 가능성은 넓히고, 그 다음은 사람이 검증하고 실행합니다.", "hl": ["사람이"], "pts": ["<b>성과 판단이 바뀜:<\/b> 10년 전엔 조회수·좋아요·댓글. 지금은 캠페인·인플루언서별 성과가 다음 타기팅·협업 구성·콘텐츠 전략으로 이어진다.", "<b>한 플랫폼에서 전 과정:<\/b> 시장 분석 → 전략 → 인플루언서 선정 → 콘텐츠 검수 → 운영 → 결과 보고.", "<b>타깃은 검색 여정으로 정의:<\/b> 브랜드 검색에 이르는 경로를 거꾸로 따라가 여정의 시작점을 찾고, 지점별 사람 유형에 맞춰 인플루언서 후보를 고른다.", "<b>부스팅 먼저 생각:<\/b> 인플루언서 콘텐츠는 유료 광고 소재로 쓰이므로, 광고가 잘 되는 콘텐츠 유형을 먼저 파악하고 브리프를 쓴다.", "<b>성과 데이터가 다음 브리프:<\/b> 유지할 것 · 바꿀 것 · 검증할 가설을 정한다.", "<b>좋은 지시문 5요소:<\/b> 목적 · 맥락 · 제약 · 산출물 · 검증. 기계적인 AI 말투는 상대가 바로 알아채므로 발송 전 사람이 다듬는다."], "nums": null, "bars": null, "shift": null, "table": [["AI가 맡는 일", "사람이 맡는 일"], ["자료 정리", "기준 설정"], ["대안 제시", "정확성 검증"], ["초안 작성", "관계 관리 · 실행 승인"]], "src": "피처링 백서", "grade": "확인"}, {"tm": "11:10", "name": "김정곤", "co": "CJ ENM 파트너사업개발팀장", "title": "콘텐츠 커머스 크리에이터, 콘텐츠를 넘어 비즈니스로", "q": "사람들은 광고가 아니라 사람을 보고 삽니다. 이제 크리에이터는 비즈니스가 되었습니다.", "hl": ["사람을"], "pts": ["<b>쇼핑 출발점이 SNS로:<\/b> 뷰티 소비자 상당수가 SNS·영상에서 상품을 찾는다. 크리에이터는 기존 수요를 가져오는 데 그치지 않고 새 수요를 만든다.", "<b>감을 성공 공식으로:<\/b> 가설 → 테스트 → 분석을 반복해 반복 가능한 매출 공식을 만든다.", "<b>사례 ① 패션:<\/b> 1차 테스트로 판매 가능성 확인 → 재고를 미리 확보 → 2차에서 주문 금액 확대.", "<b>사례 ② 육아:<\/b> 댓글·콘텐츠 이력·팔로워 속성·카테고리 특성을 함께 분석해 판매 전략 설계.", "<b>플랫폼과 손잡으면 팬덤이 자산:<\/b> 소싱·배송·운영을 플랫폼이 맡으면 매출 규모가 커지고, 팬덤과 만든 단독 상품 + 언어 장벽 낮은 숏폼으로 글로벌 확장."], "nums": null, "bars": {"t": "크리에이터를 보고 구매한 경험", "u": "%", "rows": [["구매 경험 있음", 60, "a"], ["그중 처음 알게 된 상품", 25, "b"]]}, "shift": null, "table": null, "src": "피처링 백서", "grade": "확인"}, {"tm": "13:00", "name": "정범진", "co": "브이캣 대표", "title": "SEO 다음은 GEO, 생성형 AI 다음은 마케팅 에이전트: 네이버쇼핑·현대차 사례", "q": "AI를 쓰는 기업은 많지만, 이제 AI로 마케팅을 운영하는 기업만 남습니다.", "hl": ["운영하는"], "pts": ["<b>더 많이 만드는데 더 안 보인다:<\/b> 만들기는 누구에게나 쉬워졌고 눈에 띄기는 더 어려워졌다. 고객은 검색 대신 AI에게 묻고 AI 답변 안에서 고른다.", "<b>GEO = AI에게도 보이는 법:<\/b> 브랜드 사이트 콘텐츠의 85~92%가 AI에게 전달되지 않는다(안 읽히고, 못 쓰고, 답할 페이지가 없음). 광고로 살 수 없는 자리라 먼저 쌓는 브랜드가 유리.", "<b>네이버 쇼핑라이브 실험:<\/b> 같은 시간에 쇼호스트 방송과 AI 방송(쇼호스트 얼굴 활용)을 내보내고 유입을 반반 나눴더니 AI 방송이 매출 1위, 사람 방송 3위. 상품 정보만 넣으면 10분 대본과 15초 장면이 자동 생성. 11월부터 이 방식 방송 예고.", "<b>현대차:<\/b> 3년째 AI 광고 제작 체계. 해외 500여 거점 소재의 일관성과 현지화를 함께 지원, 내년 기아로 확대.", "<b>다음 단계:<\/b> 시장조사 · 광고 제작 · 배포 · 성과 측정 에이전트(경쟁사 광고 수집 '애드캐치' 포함)를 연결해 AI가 일하고 사람은 결과를 검토.", "<b>인용:<\/b> \"우리는 AI를 잘 쓰는 사람이 아니라, AI에게 문제를 해결하도록 시켜야 하는 사람들\"."], "nums": [["1위", "", "AI 방송 매출 순위 (사람 진행 방송은 3위)", 1], ["85~92", "%", "브랜드 사이트 콘텐츠 중 AI에게 전달되지 않는 비율", 1], ["500", "편/연", "네이버 20여 제작팀 연간 제작량(10배 확대 검토)"], ["500", "곳+", "현대차 해외 거점 소재 제작 지원(3년째)"]], "bars": null, "shift": {"from": "30일", "to": "3일", "cap": "쇼핑라이브 방송 제작 기간 (제작비는 약 10분의 1)"}, "table": null, "src": "피처링 백서 · 테크M", "grade": "확인"}, {"tm": "13:25", "name": "김수정", "co": "Meta 클라이언트 솔루션 매니저", "title": "넥스트 크리에이터 이코노미", "q": "AI가 추천을 쏟아낼수록 사람들은 그 추천을 검증해 줄 사람을 찾습니다.", "hl": ["사람을"], "pts": ["<b>신뢰가 새 유통망:<\/b> 신뢰받는 크리에이터는 유명한 사람이 아니라 제품을 실제로 써 본 사람.", "<b>크리에이터를 '사지' 말고 묶음으로 운영:<\/b> 해외에서 크리에이터는 그 시장의 '문화 번역가'. 발굴 기준이 팔로워 수에서 브랜드 궁합 검증으로 이동.", "<b>최고의 협업 상대는 이미 우리를 말한 사람:<\/b> 외부 명단보다 브랜드를 스스로 언급한 댓글·DM에서 나온다.", "<b>표준 운영:<\/b> 데이터로 찾고 성과로 검증, 메가부터 마이크로까지 시장별 장기 파트너로.", "<b>오가닉이 곧 광고 소재:<\/b> 예전엔 계약 콘텐츠만 광고가 됐지만, 이제 제품을 태그·링크한 일반 콘텐츠 전체가 광고 소재 후보. 메타 '크리에이터 마케팅 허브' 활용 해법 소개."], "nums": [["45", "%", "크리에이터 추천이 영향을 준 구매 비율", 1], ["1위", "", "신뢰 요인: 크리에이터의 전문성"]], "bars": null, "shift": null, "table": null, "src": "피처링 백서 · 시사저널e", "grade": "확인"}, {"tm": "13:50", "name": "권윤아", "co": "에어월렉스 지사장", "title": "인플루언서 지급부터 해외 매출 수취
