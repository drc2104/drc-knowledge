험 자료를 같은 잣대로 정리", "p": "우선", "d": "같은 품목의 신제품이 충격 시험값(4kN)과 특허 출원을 앞세우고 있다. 우리 제품의 시험 성적을 같은 시험 조건으로 비교할 수 있는지 먼저 확인한다. 광고에 쓸 때는 의료기기 광고 심의 범위 안에서만 쓴다.", "r": "② 2월 공고 · ⑦ 국내 행사", "who": "3본부 · 2본부"}, {"k": "신제품은 고령친화우수제품 지정 경로를 함께 보기", "p": "검토", "d": "판매실적이 아직 부족한 신제품도 우수제품으로 지정되면 제조·수입 실적으로 신청할 수 있다. 어떤 제품이 지정 대상이 되는지 한국보건산업진흥원 기준과 지정 일정을 확인한다.", "r": "③ 절차 · ④ 7월 공고", "who": "3본부"}, {"k": "등재 뒤 가격 조정·급여 제외에 대비하기", "p": "검토", "d": "2025년 8월 고시에서 6개 품목 30개 제품이 급여에서 빠지고 3개 품목 9개 제품의 가격이 조정됐다. 제외·조정 사유를 고시 첨부에서 확인해 우리 등재 제품의 유지 조건표를 만든다. 가격협의 단계를 대비한 원가 근거 자료도 내부에 준비한다.", "r": "③ 절차 · ⑤ 고시 이력 · ⑪ 미국 입찰", "who": "3본부"}, {"k": "복지용구 사업소용 안내 자료를 새 품목 기준으로 고치기", "p": "검토", "d": "신규 품목은 고시 시행 후 복지용구사업소에서 판매·대여된다. 사업소가 수급자에게 바로 설명할 수 있게 품목 설명·이용 절차·연 한도액 안내를 한 장으로 정리한다. 한도액은 최신 고시로 다시 확인한 뒤 싣는다.", "r": "① 2차 시범 · ③ 절차", "who": "3본부"}, {"k": "일본·중국 전시는 시찰로 먼저 확인하기", "p": "검토", "d": "H.C.R.은 일본 수출 방향과 맞닿는 전시다. 2026년 실제 방문자 숫자가 나오면 다음 회차 참관을 판단한다. 상하이 SISAExpo는 11월 27~29일이라 올해는 참관 가능 여부만 살핀다.", "r": "⑩ H.C.R. · ⑫ SISAExpo · ⑧ 베이징", "who": "일본 수출 담당"}, {"k": "센서 결합형 품목은 예비급여 흐름을 계속 지켜보기", "p": "유지", "d": "낙상 알림은 시범사업을 거쳐 신규 품목이 됐다. 9월 기사 제목에는 낙상에어백·활동감지시스템이 예비급여로 나오는데 본문은 확인하지 못했다. 원문을 확보해 고관절보호대와 이어질 후보 품목이 있는지 본다.", "r": "① 2차 시범 · ⑥ 이후 일정", "who": "3본부"}], "media": {"headline": "공고라 다시보기가 없어, 제도를 설명하는 영상 5편을 붙였습니다", "videos": [{"title": "노인장기요양보험 복지용구 급여이용 안내 - 국민건강보험", "url": "https://www.youtube.com/watch?v=sgTPYM9v04I", "len": "미확인", "note": "주제 설명 영상(행사 영상 아님) · 국민건강보험 · 복지용구 이용 방법 전반"}, {"title": "국민건강보험공단 제도 총정리 (노인장기요양보험편) - 국민건강보험", "url": "https://www.youtube.com/shorts/thsvfCMPc0M", "len": "쇼츠", "note": "주제 설명 영상(행사 영상 아님) · 국민건강보험 · 장기요양 제도 속 복지용구의 위치"}, {"title": "노인장기요양보험으로 복지용구 구매하기(이용절차) - 휴체어 김팀장", "url": "https://www.youtube.com/watch?v=nqPsHWmUaxM", "len": "미확인", "note": "주제 설명 영상(행사 영상 아님) · 휴체어 김팀장(판매업체 채널, 공공기관 아님) · 구매 절차 참고용"}, {"title": "[백세톡톡] - 고령친화제품 체험홍보 공간 탐방 - 매일경제TV", "url": "https://www.youtube.com/watch?v=pmwJfPnzbEE", "len": "미확인", "note":
