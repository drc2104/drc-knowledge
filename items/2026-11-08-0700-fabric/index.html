5년 전망", 1]], "overviewNote": "원단·원사·막 소식만 모았고 완제품은 뺐습니다. 7일 안(11/1~11/8)에 새로 공개된 원단 소식은 찾지 못해 10/13~10/26 소식으로 채웠고, 중심은 10/13~14 뮌헨 퍼포먼스 데이즈 수상작입니다. 이미 다룬 소식(PFHxA·나이버·닌파스 등)은 반복하지 않았고 효성티앤씨는 새 숫자가 나온 후속으로만 넣었습니다. 원단은 견적 거래라 공개 가격이 없어 가격표 대신 원단 수치 표를 실었고, 원단 단계라 소비자 후기도 없습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 10.16", "name": "Suedwolle · UTO · The Lycra Company", "co": "독일·중국·미국 · 박람회 공동 전시 · 업계지 (전시 10.13~14 뮌헨)", "title": "메리노 울 + 재생 폴리에스터를 섞은 무봉제(심리스)용 원사", "q": "무봉제로 옷을 짜는 중국 업체가 재생·흡습 원사로 몸에 닿는 기본 층 옷을 이미 만들었다.", "hl": ["무봉제로"], "pts": ["<b>무엇이 새로운가:<\/b> 극세 메리노 울, Coolmax EcoMade(섬유 폐기물 100% 원료 재생 폴리에스터), 가는 폴리아미드 필라멘트를 섞은 원사. UTO가 무봉제 편직으로 기본 층(base layer)·요가·테니스·골프 옷을 만들었다.", "<b>숫자:<\/b> 혼용률과 재생 함량은 공개하지 않았다. Coolmax EcoMade는 흡습·속건을 내세운다(업체 주장).", "<b>마케팅:<\/b> 원사사·원료사·편직사 세 곳이 박람회에서 함께 전시. 가격·판매 수치는 없다.", "<b>고객 반응:<\/b> 원단 거래 단계라 후기 없음.", "<b>우리에게:<\/b> 속옷 용도는 밝히지 않았지만, 같은 계열 원사 샘플을 구해 요실금팬티 겉감·안감 시험 후보로 올릴 만하다. 무봉제 제작 방식도 허리·다리선 자국을 줄이는 방법으로 살펴본다."], "video": {"title": "Inside PERFORMANCE DAYS 2026 | Future of Sustainable Textiles & Performance Materials", "url": "https://www.youtube.com/watch?v=iOhfV4MBxCU"}, "src": "Innovation in Textiles (2026-10-16)", "grade": "확인"}, {"tm": "중 · 10.26", "name": "효성티앤씨", "co": "한국 · 기사 (후속)", "title": "사탕수수로 만든 바이오 스판덱스 regen BIO, 유럽 공략", "q": "사탕수수 당에서 스판덱스까지 이어지는 공급망을 베트남에 꾸렸다.", "hl": ["사탕수수"], "pts": ["<b>무엇이 새로운가:<\/b> 사탕수수 당 → 바이오 BDO → 바이오 PTMG → 바이오 스판덱스로 이어지는 공급망(베트남 생산). 렌징 TENCEL과 섞은 소량 컬렉션을 7월 뉴욕 Functional Fabric Fair에서 선보였다.", "<b>숫자:<\/b> 투자 약 10억 달러(기사 서술, 출처 표기 없음). 세계 바이오 기반 섬유 시장 2026년 62억6000만 달러 → 2035년 114억3000만 달러(연 6.91%). 생산능력·가격·혼용률은 없다.", "<b>마케팅:<\/b> 코펜하겐 글로벌 패션 서밋 메인 후원(5월), 브뤼셀 Future Fabrics Expo(6월). 업체 제공 자료를 바탕으로 한 홍보성 기사다.", "<b>고객 반응:<\/b> 해당 없음. 속옷·위생용품 언급도 없다.", "<b>우리에게:<\/b> 허리·다리선 밴드의 스판덱스를 바이오 스판덱스로 바꿀 때 회복력이 유지되는지, '바이오 스판덱스 사용' 문구를 쓸 근거를 받을 수 있는지 확인할 후보."], "bars": {"t": "세계 바이오 기반 섬유 시장 (억 달러, 비즈니스리서치인사이트 인용)", "u": "억 달러", "rows": [["2026년", 62.6, "b"], ["2035년 전망", 114.3, "a"]]}, "nums": [["약 10억", "달러", "regen BIO 투자 (기사 서술)", 1], ["6.91", "%", "연평균 성장률 전망"]], "video": {"title": "TENCEL™ | Resource-efficient production with a lower impact", "url": "https://www.youtube.com/watch?v=y4wc7pek4DE"}, "src": "아시아타임즈 (2026-10-26)", "grade": "확인"}, {"tm": "중 · 10.14", "name": "효성티앤씨 × 울마크 컴퍼니", "co": "한국·호주 · 울마크 발표 인용 기사 (후속)", "title": "메리노 울 + regen BIO 새 원단 8종·옷 6종", "q": "8월에 약속한 공동 개발이 원단 8종과 옷 6종으로 나왔다.", "hl": ["8종과"], "pts": ["<b>무엇이 새로운가:<\/b> 8월 PIS 전시에서 발표한 공동 개발의 결과물. 용도는 스포츠·일상복이고 속옷 언급은 없다.", "<b>숫자:<\/b> 메리노 울 최대 79% 함유, 원단 8종, 이를 쓴 옷 6종. 나머지 혼용률·가격·시험 수치는 없다.", "<b>마케팅:<\/b> 울마크가 발표 주체. 신축·회복·형태 유지·통기성을 내세우지만 시험 수치는 없다(업체 주장).", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 소취·체온 조절 소재를 이야기하는 방식은 참고할 만하다. 다만 울 혼방은 세탁 관리가 까다로워 여러 번 빨아 쓰는 팬티에 바로 쓰기는 어렵다(추정)."], "nums": [["79", "%", "메리노 울 최대 함유", 1], ["8", "종", "새 원단"], ["6", "종", "새 원단을 쓴 옷"]], "src": "더구루 (2026-10-14)", "grade": "확인"}, {"tm": "중 · 10.13", "name": "Pharma Foods International", "co": "일본 · 퍼포먼스 데이즈 Cellulose Award · 상품 페이지 (전시 10.13~14)", "title": "버려지는 계란 껍질 막으로 만든 소재 ovoveil", "q": "식품 공장이 버리는 계란 막을 피부에 닿는 원단으로 바꿨다.", "hl": ["계란"], "pts": ["<b>무엇이 새로운가:<\/b> 일본 식품 산업에서 나오는 계란 껍질 막으로 만든 소재. 원단 이름은 'OVO/CAS PL KNIT'.", "<b>숫자:<\/b> 200 g/㎡. 혼용률이 한 페이지에서 두 가지로 적혀 있다(항목 칸 'WS 30%·CV 70%', 본문 '캐시미어 10%·ovoveil 90%'). 버려지는 물량 연 10,000톤(업체 주장). OEKO-TEX Standard 100 Class 1.", "<b>마케팅:<\/b> '사람 대상 시험에서 피부 장벽 기능과 보습을 돕는다'는 문구를 쓴다(업체 주장, 의학 효능 표현이라 우리 광고에는 옮기지 않는다). 소취·생분해 표시.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 피부에 닿는 속옷 안감 후보로 문의할 가치가 있다. 소취 효과는 우리가 직접 시험한 뒤에만 말한다."], "nums": [["200", "g/㎡", "원단 무게"], ["10,000", "톤/년", "버려지는 계란 막 (업체 주장)", 1]], "video": {"title": "PERFORMANCE DAYS presents the Award Winners and their products", "url": "https://www.youtube.com/watch?v=plX63MfWaSI"}, "src": "퍼포먼스 데이즈 상품 페이지 68330", "grade": "확인"}, {"tm": "중 · 10.13", "name": "Paltex", "co": "대만 · 퍼포먼스 데이즈 Innovation Award (전시 10.13~14)", "title": "옥수수대 잔여물로 만든 막을 붙인 바이오 방수·투습 원단 PureCycle 2L", "q": "겉감과 방수 막 모두에 식물 원료를 넣었지만 투습은 낮은 편이다.", "hl": ["식물", "원료를"], "pts": ["<b>무엇이 새로운가:<\/b> 겉감 날실·씨실 모두 부분 바이오 폴리에스터와 바이오 스판덱스. 막은 TPEE(옥수수대 잔여물 50% 바이오).", "<b>숫자:<\/b> 175 g/㎡, 바이오 폴리에스터 86%·바이오 스판덱스 14%, 수압 5000 mm(JIS L1092 B), 투습 500 g/㎡/24h(JIS L1099 A1). 전체 바이오 함량 약 30%(업체 계산, 제3자 검증 아님).", "<b>마케팅:<\/b> 수상 설명에 'PFAS 없는 시대의 방수 투습'이라는 문구가 있지만 이 제품 설명인지 확실히 맞추지 못했고, PFAS 미사용 여부도 제품 페이지에서 확인하지 못했다(추정).", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 방수층 대안을 비교할 때 쓸 수치. 투습 500은 낮은 편이라 속옷 방수층으로 혼자 쓰기는 어렵다(추정). 우리 방수층 시험 기준과 대조해 본다."], "bars": {"t": "PureCycle 2L 겉감 혼용률 (%)", "u": "%", "rows": [["바이오 폴리에스터", 86, "a"], ["바이오 스판덱스", 14, "b"]]}, "nums": [["5,000", "mm", "수압 (JIS L1092 B)", 1], ["500", "g/㎡/24h", "투습 (JIS L1099 A1)"], ["약 30", "%", "전체 바이오 함량 (업체 계산)"]], "video": {"title": "PFAS-Free Waterproof Jackets | What It Means for You", "url": "https://www.youtube.com/watch?v=YF-RjkSJBt4"}, "src": "퍼포먼스 데이즈 상품 페이지 67329", "grade": "확인"}, {"tm": "중 · 10.13", "name": "High Fashion Garments", "co": "홍콩·중국 · 퍼포먼스 데이즈 Bodywear Award (전시 10.13~14)", "title": "실크와 그래핀 나일론을 섞은 graphene² silk", "q": "몸에 닿는 옷 부문 수상작은 실크와 그래핀 나일론을 섞은 원적외선 소재였다.", "hl": ["몸에", "닿는"], "pts": ["<b>무엇이 새로운가:<\/b> 실크 + 그래핀 나일론으로 원적외선을 내는 체온 조절 소재. 수상 부문이 'Bodywear'(몸에 닿는 옷).", "<b>숫자:<\/b> 혼용률 EA 7%·SE 48%·그래핀 나일론 45%(EA·SE 약어는 페이지에 설명 없음), 120 g/㎡. 인증 GRS, OEKO-TEX Standard 100, STeP.", "<b>마케팅:<\/b> '움직이면 작동하는 원적외선 그래핀 기술로 근육 회복'을 내세운다(업체 주장, 회복 효능 표현은 옮기지 않는다). 용도는 회복용 기본 층·스포츠 상의, 속옷 언급 없음.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 어제 다룬 국내 원적외선 원단과 같은 흐름. 원적외선 소재가 몸에 닿는 옷으로 내려오고 있다는 참고 신호."], "bars": {"t": "graphene² silk 혼용률 (%)", "u": "%", "rows": [["SE", 48, "b"], ["그래핀 나일론", 45, "a"], ["EA", 7, "c"]]}, "nums": [["120", "g/㎡", "원단 무게"]], "src": "퍼포먼스 데이즈 상품 페이지 65416", "grade": "확인"}, {"tm": "하 · 10.13", "name": "예성텍스타일", "co": "한국(서울) · 퍼포먼스 데이즈 Cotton Award (전시 10.13~14)", "title": "면 100% 3층 방수·투습 원단 ROGELIO", "q": "국내 업체가 면만으로 방수·투습 3층 원단을 만들어 상을 받았다.", "hl": ["면만으로"], "pts": ["<b>무엇이 새로운가:<\/b> 면 100% 3층(3L) 방수·투습 원단, Organic Content Standard 인증. 맥코트 같은 겉옷용.", "<b>숫자:<\/b> 230 g/㎡, 수압 3000 mm, 투습 3000 g/㎡/24h.", "<b>마케팅:<\/b> 오가닉 면 인증을 앞세운다. 가격은 없다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 속옷용은 아니다. 다만 면 기반 방수·투습 라미네이트를 만드는 국내 업체가 있다는 점에서 방수층 후보 업체 목록에 올려 둔다."], "bars": {"t": "수압과 투습 비교 (업체 수치 · 시험 조건이 같지 않아 참고만)", "u": "", "rows": [["예성 수압 (mm)", 3000, "b"], ["예성 투습 (g/㎡/24h)", 3000, "a"], ["Paltex 수압 (mm)", 5000, "b"], ["Paltex 투습 (g/㎡/24h)", 500, "c"]]}, "nums": [["230", "g/㎡", "원단 무게"], ["3,000", "g/㎡/24h", "투습", 1]], "src": "퍼포먼스 데이즈 상품 페이지 66877", "grade": "확인"}, {"tm": "하 · 10.13", "name": "Takisada (NUYARN)", "co": "일본 · 퍼포먼스 데이즈 Wool Award (전시 10.13~14)", "title": "울과 나일론을 그물 구조로 짠 New Wool Net", "q": "건조 속도 5배라는 주장이 나왔지만 시험 방법은 적혀 있지 않다.", "hl": ["5배라는"], "pts": ["<b>무엇이 새로운가:<\/b> 울+나일론을 그물 구조로 짠 편직 원단.", "<b>숫자:<\/b> 105 g/㎡, 혼용률 PA 33%·WV 67%(WV 설명 없음). '부피 35% 증가', '건조 5배 빠름', '마모 저항 8.8배'(모두 업체 주장, 시험 방법 표기 없음). Innovation in Textiles 10/26 기사에도 같은 숫자가 실렸다.", "<b>마케팅:<\/b> 배수로 표현한 성능 비교를 앞세운다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 울 소재라 바로 쓰기는 어렵다. 건조 시간 비교 시험을 할 때 '몇 배 빠른가'를 같은 방법으로 재는 기준을 세우는 참고로 쓴다."], "nums": [["5", "배", "건조 속도 (업체 주장)", 1], ["8.8", "배", "마모 저항 (업체 주장)"], ["35", "%", "부피 증가 (업체 주장)"], ["105", "g/㎡", "원단 무게"]], "src": "퍼포먼스 데이즈 상품 페이지 66735 · Innovation in Textiles (2026-10-26)", "grade": "확인"}], "flow": [{"k": "식물·재생 원료로 갈아타기 (국내·해외 같은 방향)", "d": "국내 효성 사탕수수 스판덱스, 대만 Paltex 옥수수 기반 막, 독일 Suedwolle 섬유 폐기물 재생, 일본 계란 막 — 나라는 달라도 원료를 바꾸는 쪽으로 움직인다", "who": [2, 3, 5, 1, 4]}, {"k": "몸에 닿는 층의 소재가 고급해진다", "d": "그래핀 실크, 계란 막 피부 주장, 재생 원사 무봉제 — 속옷으로 쓴다는 발표는 아직 없다", "who": [6, 4, 1]}, {"k": "방수·투습 원단도 바이오·면으로", "d": "Paltex 바이오 막, 국내 예성 면 100% 3층 — 다만 투습은 제품마다 차이가 크다", "who": [5, 7]}, {"k": "숫자는 많아졌지만 업체 주장이 대부분", "d": "혼용률 비공개·표기 충돌, 시험 방법 없는 배수 주장 — 받은 숫자는 직접 시험으로 확인해야 한다", "who": [1, 4, 8, 5]}], "flowHeadline": "원료는 식물·재생으로, 숫자는 직접 확인하는 쪽으로", "apply": [{"k": "[원단 시험] 재생·흡습 원사 샘플로 흡수·건조 시간 비교", "p": "우선", "d": "Coolmax EcoMade 계열 재생 원사 샘플을 구해 지금 쓰는 안감과 같은 조건으로 흡수 속도·건조 시간을 잰다. 11월 18~19일 상하이 퍼포먼스 데이즈 출품사 목록도 미리 확인해 샘플 요청처를 넓힌다.", "r": "① Suedwolle·UTO·Lycra", "who": "4본부"}, {"k": "[마케팅] '바이오·재생 원료' 문구는 함량 근거를 받은 뒤에만", "p": "우선", "d": "원료 업체가 혼용률·재생 함량을 공개하지 않거나 표기가 엇갈리는 일이 잦다. 함량 성적서를 받은 뒤에만 문구를 쓰고, 임상·회복 같은 효능 표현은 옮기지 않는다.", "r": "② 효성티앤씨 · ④ Pharma Foods · ⑥ High Fashion Garments", "who": "2본부 · 4본부"}, {"k": "[제품] 무봉제(심리스) 요실금팬티 가능성 검토", "p": "검토", "d": "무봉제 편직 업체가 재생·흡습 원사로 몸에 닿는 옷을 이미 만들고 있다. 꿰맨 선이 없는 구조가 허리·다리선 자국과 착용감을 얼마나 바꾸는지, 흡수층을 넣을 수 있는지 시제품 단계에서 검토한다.", "r": "① Suedwolle·UTO·Lycra", "who": "4본부 · 2본부"}, {"k": "[원단 시험] 바이오 기반 방수 막의 수압·투습·세탁 후 수치 의뢰", "p": "검토", "d": "바이오 막과 면 3층 원단의 수압·투습을 우리 방수층 시험 기준과 같은 방법으로 다시 잰다. 투습이 낮은 막은 땀이 차기 쉬우니 세탁 뒤 수치까지 함께 본다.", "r": "⑤ Paltex · ⑦ 예성텍스타일", "who": "4본부"}, {"k": "[원단 시험] 계란 막 소재 안감 샘플로 소취 시험", "p": "검토", "d": "ovoveil 원단 샘플을 문의해 소취 효과를 우리가 직접 시험한다. 업체의 피부 장벽 주장은 광고에 쓰지 않고, 시험 결과로 확인된 것만 말한다.", "r": "④ Pharma Foods", "who": "4본부"}, {"k": "[원단 시험] 바이오 스판덱스로 바꿀 때 회복력 비교", "p": "검토", "d": "허리·다리선 밴드의 스판덱스를 regen BIO 같은 바이오 스판덱스로 바꿨을 때 늘었다 돌아오는 힘이 유지되는지 비교 시험한다. 결과가 같을 때만 원료 전환을 검토한다.", "r": "② 효성티앤씨", "who": "4본부"}, {"k": "[원단 시험] '몇 배 빠른 건조' 같은 주장을 재는 내부 기준 만들기", "p": "유지", "d": "업체 배수 주장은 시험 방법이 없어 비교가 안 된다. 우리 안감 건조 시간을 재는 방법을 하나로 정해 두고, 새 원단 주장도 같은 방법으로 다시 잰다.", "r": "⑧ Takisada", "who": "4본부"}], "media": {"headline": "박람회 공식 영상 2편과 방수·텐셀 설명 영상을 붙였습니다", "videos": [{"title": "Inside PERFORMANCE DAYS 2026 | Future of Sustainable Textiles & Performance Materials", "url": "https://www.youtube.com/watch?v=iOhfV4MBxCU", "len": "길이 미확인", "note": "PERFORMANCE DAYS 공식 · 박람회 소개와 친환경 기능성 소재 흐름 (3월 전시인지 10월 전시인지 확인 못 함)"}, {"title": "PERFORMANCE DAYS presents the Award Winners and their products", "url": "https://www.youtube.com/watch?v=plX63MfWaSI", "len": "길이 미확인", "note": "PERFORMANCE DAYS 공식 · 수상작과 제품 소개 (어느 회차 수상작인지 확인 못 함)"}, {"title": "PerformanceDays Munich 2026 | My Experience at Textile Fair vlog", ts graphene² silk (퍼포먼스 데이즈 상품 페이지)", "https://www.performancedays.com/loop/marketplace/product-detail/65416.html"], ["예성텍스타일 ROGELIO (퍼포먼스 데이즈 상품 페이지)", "https://www.performancedays.com/loop/marketplace/product-detail/66877.html"], ["Takisada New Wool Net (퍼포먼스 데이즈 상품 페이지)", "https://www.performancedays.com/loop/marketplace/product-detail/66735.html"]], "numberNotes": [["가격 비교", "원단·원사는 견적 거래라 이번 소식 어디에도 단가가 없어 가격표를 만들지 않음(지어내지 않음). 대신 원단 수치 표를 실음. 같은 이유로 [가격 행사] 대응 아이디어는 넣지 않음"], ["Pharma Foods 혼용률", "상품 항목 칸 'WS 30%·CV 70%' / 본문 '캐시미어 10%·ovoveil 90%' — 한 페이지 안에서 엇갈림"], ["효성티앤씨 투자액", "아시아타임즈는 약 10억 달러(출처 표기 없음). 다른 검색 요약에는 약 1조 원으로 나왔으나 원문 확인 못 해 10억 달러만 씀"], ["Paltex 바이오 함량", "겉감 약 82%(수상 페이지 설명) / 전체 약 30%(제품 페이지, 업체 계산). PFAS 없음 문구가 이 제품 설명인지는 확실하지 않음"], ["수압·투습 비교", "Paltex는 JIS 시험 규격을 밝혔고 예성은 시험 방법 표기 없음. 같은 조건 시험이 아니라 참고만"], ["Takisada 배수 주장", "부피 35%·건조 5배·마모 8.8배 모두 업체 주장, 시험 방법 표기 없음"], ["날짜", "7일 안(11/1~11/8) 새 원단 소식 0건. 수상작 5건은 전시일(10/13~14) 기준으로 적음"], ["고객 반응", "원단 거래 단계 소식이라 소비자 후기·댓글 없음"]], "madeBy": "조사: 소넷 조사원 · 정리·판단: 오퍼스 · 작성 2026-11-08", "glossaryHeadline": "원단 소식을 읽을 때 필요한 말 11개", "glossary": [{"term": "흡습속건", "easy": "땀을 빨리 빨아들이고 빨리 말리는 성질.", "why": "속옷 안감의 기본 성능이다(소식 1).", "video": {"title": "Inside PERFORMANCE DAYS 2026 | Future of Sustainable Textiles & Performance Materials", "url": "https://www.youtube.com/watch?v=iOhfV4MBxCU"}}, {"term": "심리스 (무봉제)", "easy": "꿰맨 선 없이 옷을 한 번에 짜는 방식.", "why": "허리·다리선 자국을 줄이는 방법이 될 수 있다(소식 1).", "video": {"title": "Inside PERFORMANCE DAYS 2026 | Future of Sustainable Textiles & Performance Materials", "url": "https://www.youtube.com/watch?v=iOhfV4MBxCU"}}, {"term": "재생 폴리에스터 (Coolmax EcoMade)", "easy": "섬유 폐기물을 다시 실로 만든 폴리에스터.", "why": "'재생 원료' 문구를 쓰려면 함량 근거가 필요하다(소식 1)."}, {"term": "바이오 스판덱스", "easy": "석유 대신 식물(사탕수수 등)에서 얻은 원료로 만든 고무실.", "why": "허리·다리선 밴드 원료를 바꿀 때 회복력 비교가 필요하다(소식 2·3·5)."}, {"term": "base layer (기본 층)", "easy": "옷을 여러 겹 입을 때 피부에 바로 닿는 가장 안쪽 옷.", "why": "속옷과 가장 가까운 분야라 여기 쓰인 소재가 속옷으로 내려올 수 있다(소식 1·6)."}, {"term": "PFAS (과불화화합물)", "easy": "방수·발수에 쓰여 온, 자연에서 잘 분해되지 않는 불소 계열 화학물질.", "why": "팬티 방수층에서 규제 대응이 필요한 부분이다(소식 5).", "video": {"title": "PFAS-Free Waterproof Jackets | What It Means for You", "url": "https://www.youtube.com/watch?v=YF-RjkSJBt4"}}, {"term": "라미네이트 (2L·3L)", "easy": "원단과 방수 막을 겹쳐 붙인 것. 2층이면 2L, 3층이면 3L.", "why": "요실금팬티 방수층도 이런 구조다(소식 5·7)."}, {"term": "수압 (mm) · 투습 (g/㎡/24h)", "easy": "수압은 몇 mm 물기둥 압력까지 물이 안 새는지, 투습은 하루에 수증기가 얼마나 빠져나가는지.", "why": "방수층을 비교하는 기본 숫자. 투습이 낮으면 땀이 찬다(소식 5·7)."}, {"term": "TENCEL (텐셀)", "easy": "나무에서 얻은 원료로 만든 부드러운 섬유의 브랜드 이름(렌징).", "why": "피부에 닿는 안감 원료로 쓰이고, 효성 바이오 스판덱스와 섞은 컬렉션도 나왔다(소식 2).", "video": {"title": "TENCEL™ | Resource-efficient production with a lower impact", "url": "https://www.youtube.com/watch?v=y4wc7pek4DE"}}, {"term": "OEKO-TEX Standard 100", "easy": "원단에 해로운 물질이 기준 이하인지 시험해 주는 인증.", "why": "피부에 닿는 제품이라 원단을 고를 때 꼭 확인할 항목이다(소식 4·6)."}, {"term": "GRS (재생 원료 인증)", "easy": "재생 원료를 실제로 썼는지 확인해 주는 국제 인증.", "why": "'재생' 문구를 쓸 때의 근거 서류가 된다(소식 6)."}]}</script>
