who": "4본부 제품·출시팀"}, {"k": "[원단 시험] 세탁 12·30·50회 뒤 흡수량·샘·패드 접힘·옆선 시험", "p": "우선", "d": "시스티(패드 접힘·옆선)와 Modibodi(샘·세탁 내구)의 반복 불만을 우리 제품에서 미리 막는다. Which?는 세탁 12회, OMAPAN은 세탁 상한 50회를 기준으로 쓴다. 결과 숫자는 성적서가 나온 뒤에만 문구에 쓴다.", "r": "② 시스티 · ④ Which? · ⑤ Modibodi · ⑦ OMAPAN", "who": "4본부 제품·출시팀"}, {"k": "[가격 행사] 여러 장 계단 할인 시안 만들기", "p": "검토", "d": "Saalt는 3·5·7장 이상에 10·15·20%를 붙였다. 다회용 팬티를 '한 주기에 필요한 장수'로 묶는 계단 할인 시안을 만들고, 수익 구조를 확인한 뒤 12월 행사에 적용 여부를 정한다.", "r": "⑥ Saalt", "who": "2본부 쇼핑몰팀"}, {"k": "[가격 행사] 행사 문구는 '주력 상품 실제 ○%'를 앞에", "p": "검토", "d": "Modibodi는 배너 60%인데 생리팬티 첫 화면은 5~25%였다. 우리 행사는 주력 상품의 실제 할인율을 먼저 쓰고, 막판에 할인을 키우는 '2차 카드'(Thinx 30% → 40%)는 행사 전에 미리 정해 둔다.", "r": "③ Thinx · ⑤ Modibodi", "who": "2본부 쇼핑몰팀 · 광고·콘텐츠팀"}, {"k": "[마케팅] 상세페이지에 단점과 '착용 1회당 비용'을 먼저 공개", "p": "검토", "d": "OMAPAN은 '땀이 찬다', '건조 1~2일'을 스스로 알리고 '착용 1회당 80엔'을 계산해 보여 준다. 우리도 두께·건조 시간을 먼저 쓰고, 샘·사이즈·교환 비용 같은 해외 불만 4대 축에 숫자와 보증으로 답한다.", "r": "⑤ Modibodi · ⑦ OMAPAN", "who": "2본부 광고·콘텐츠팀"}, {"k": "[마케팅] 3분 흡수량·사이즈 진단 → 추천 → 자사몰 결제", "p": "검토", "d": "시스티는 13문항 체형 분석으로 자사몰 비중 약 90%를, 도로시와는 공동구매도 자사몰로 모아 45%를 만들었다. 요실금팬티에 흡수량·사이즈 진단 설문을 붙이고 결제는 자사몰로 모으는 흐름을 시험한다.", "r": "② 시스티 · ⑧ 도로시와", "who": "2본부 쇼핑몰팀 (자사몰)"}, {"k": "[제품] 남성용은 흡수량 mL를 크게 표기한 일체형 팬티 검토", "p": "유지", "d": "국내 수려니 남성 패드는 흡수량을 쓰지 않았고, 일본 OMAPAN은 150cc를 앞세운다. 남성용 다회용 팬티를 검토한다면 mL를 크게 적고 회식·운전·여행 같은 상황 문구로 알린다.", "r": "⑦ OMAPAN · ⑨ 수려니", "who": "4본부 제품·출시팀"}], "glossary": [{"term": "PFAS", "easy": "잘 분해되지 않고 오래 남는 불소 화학물질 묶음.", "why": "방수·발수층에 섞일 수 있고, 뉴욕주 금지 대상이다.", "video": {"title": "사라지지 않는 화학물질 '과불화화합물'!... 일상 곳곳 존재 / YTN", "url": "https://www.youtube.com/watch?v=zmeZ-DemRoM"}}, {"term": "C9~C14 PFCA", "easy": "PFAS 가운데 탄소 9~14개짜리 산 계열 물질.", "why": "Which?가 EU 한도 초과를 잡아낸 항목이라, 시험 의뢰 때 따로 넣어야 한다."}, {"term": "ppb", "easy": "10억분의 1을 나타내는 단위.", "why": "성적서의 유해물질 수치를 읽는 단위다."}, {"term": "EU REACH", "easy": "유럽의 화학물질 규제 법.", "why": "수출과 성적서 기준으로 쓰인다(PFCA 한도 260ppb)."}, {"term": "의도적 첨가", "easy": "일부러 넣은 것. 우연히 섞인 잔류와 구분한다.", "why": "뉴욕주 법 1
