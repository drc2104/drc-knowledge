 가능성과 한계, 삼성의 연구 성과.", "<b>계획의 벽:<\/b> 10Hz로 움직이는 로봇이 15분 앞을 계획하면 재귀 깊이가 10,000에 이른다.", "<b>제안:<\/b> 한 번에 끝까지 계획하지 말고 단계를 나누는 계층적 계획.", "<b>시점 진단(Hauser):<\/b> 지금의 로봇은 자율주행의 2016년 무렵이라고 비유했다."], "nums": [["10,000", "", "15분 앞 계획 시 재귀 깊이", 1], ["10", "Hz", "로봇 동작 주기"], ["15", "분", "앞을 내다보는 길이"]], "video": {"title": "[Samsung AI Forum 2026] Keynote + Track 1. AI Technology", "url": "https://www.youtube.com/watch?v=Velq-bBfX-o"}, "src": "기사(주제) · TecAce 요약(숫자·인용)", "grade": "추정"}, {"tm": "오후 · 트랙 1", "name": "이강욱 · Juan Carlos Niebles", "co": "삼성리서치 상무 · 삼성리서치 VP", "title": "지속 학습", "q": "사용자가 지우고 되돌리는 행동이 AI에게는 불만 신호가 된다.", "hl": ["불만"], "pts": ["<b>사용자 맞춤형 AI:<\/b> 새 정보를 배우되 기존 지식은 유지한다.", "<b>자가 진화 AI:<\/b> 출시 후 사용 경험과 불편을 스스로 분석한다.", "<b>불만 신호:<\/b> 삭제·취소·되돌리기를 학습 자료로 쓴다.", "<b>기술 이름:<\/b> 메모리 에이전트 TrustMem, Null-Basis LoRA."], "table": [["유형", "하는 일"], ["사용자 맞춤형 AI", "새 정보를 배우고 기존 지식은 유지"], ["자가 진화 AI", "출시 후 사용 경험·불편을 스스로 분석"]], "video": {"title": "[Samsung AI Forum 2026] Keynote + Track 1. AI Technology", "url": "https://www.youtube.com/watch?v=Velq-bBfX-o"}, "src": "인사이트코리아(핵심) · TecAce 요약(세부)", "grade": "추정"}, {"tm": "오후 · 트랙 2", "name": "Ajaz Munsiff", "co": "Dell Technologies 아시아태평양·일본 CDO", "title": "외부 AX 사례: Dell의 전환", "q": "에이전트 하나가 아니라 처음부터 끝까지 이어지는 업무 흐름을 만들고, 사람의 확인 단계를 분명히 설계하라.", "hl": ["업무", "흐름을"], "pts": ["<b>자기 회사부터:<\/b> Dell 자신을 '첫 번째 고객(Customer Zero)'으로 삼아 전환했다.", "<b>3가지 원칙:<\/b> 단순화, 표준화, 자동화.", "<b>결론:<\/b> 단일 에이전트가 아니라 끝까지 이어지는 에이전트 업무 흐름.", "<b>사람의 자리:<\/b> 사람이 확인·승인하는 단계를 처음부터 설계에 명시한다."], "nums": [["3", "가지", "단순화 · 표준화 · 자동화"]], "video": {"title": "[Samsung AI Forum 2026] Keynote + Track 2. AX Innovation", "url": "https://www.youtube.com/watch?v=6qISsYkakK4"}, "src": "TecAce 요약", "grade": "추정"}, {"tm": "오후 · 트랙 2", "name": "최상근", "co": "Anthropic 기술 리드", "title": "Putting AI to Work Safely (AI를 안전하게 일에 쓰기)", "q": "믿을 수 있게 가둬 두면 승인 요청은 줄고 위험 행동은 막힌다.", "hl": ["가둬", "막힌다."], "pts": ["<b>핵심:<\/b> 신뢰할 수 있는 AI 에이전트의 업무 적용 방식과 엔터프라이즈 AI 팩토 q": "중국의 경쟁축은 모델보다 회사 전산망에 연결되는 에이전트로 옮겨 가고 있다.", "hl": ["회사", "전산망에"], "pts": ["<b>시장 상황:<\/b> 사흘간 주 포럼 3개, 분과 포럼 120여 개, 5만㎡ 전시. 참가 기업 1,000여 곳, 연사 2,000여 명. 알리바바 클라우드 CTO가 'Agentic Cloud' 단계를 선언했다.", "<b>제품:<\/b> AI 칩 '真武 V900'(단일 칩 연산이 M890의 3배, 메모리 216GB, 2027년 1분기 양산). 음성을 한 번 글로 옮긴 뒤 지우는 비서 기기 'QwenNote A2'(목표 1,000만 대). 신제품 32종.", "<b>숫자:<\/b> 클러스터 확장 한도 50만 장, 2032년까지 세계 데이터센터 운영 규모 20GW 초과 목표.", "<b>반응:<\/b> 현장 반응은 확인하지 못했다. 행사 규모는 현지 언론으로 확인했고, 제품·목표 숫자는 증권 분석 기사 기준이다.", "<b>국내와 비교:<\/b> 삼성 한재준 발표의 '표준 커넥터로 도메인 에이전트 연결'과 같은 방향. 중국은 회사 ERP·CRM에 연결되는 에이전트를 경쟁축으로 삼았다."], "nums": [["20", "GW", "2032년 데이터센터 운영 규모 목표", 1], ["50만", "장", "클러스터 확장 한도"], ["3", "배", "V900 단일 칩 연산(M890 대비)"], ["32", "종", "발표 신제품"]], "src": "10jqka 증권 분석 기사(공식 원문 아님) · 潮新闻 2026.09.21(행사 규모·장소)", "grade": "추정"}, {"tm": "해외 · 일본", "name": "소프트뱅크", "co": "일본 · SoftBank World 2026 · 2026.07.14", "title": "손정의 'AX for Japan'", "q": "2040년 AI 경제가 세계 GDP의 약 20%가 된다는 것이 손정의의 전망이다.", "hl": ["20%가"], "pts": ["<b>시장 상황:<\/b> 강연 주제는 'AX for Japan'. 일본은 대기업 주도로 AI 에이전트 전면 도입 구호를 내걸었다.", "<b>숫자:<\/b> 2040년 AI 경제 규모 세계 GDP의 약 20%(약 7,000조 엔), AI 에이전트 100조 개, 휴머노이드 10억 대. 인터넷 시장은 세계 GDP의 약 1% 수준에 그쳤다고 비교했다.", "<b>반응:<\/b> 검색 요약으로만 확인해 기사 본문의 반응은 보지 못했다. 약 4개월 전 소식이다. 참고로 2025년 12월 야노경제연구소 조사에서 AI 에이전트 이용은 3%였다(11개월 전 자료).", "<b>국내와 비교:<\/b> 삼성 포럼이 현장 수치와 안전 설계를 다뤘다면, 소프트뱅크는 먼 미래의 규모 전망을 앞세웠다."], "bars": {"t": "세계 GDP 대비 비중 (손정의 강연 비교)", "u": "%", "rows": [["인터넷 시장", 1, "c"], ["2040년 AI 경제 전망", 20, "a"]]}, "nums": [["100조", "개", "2040년 AI 에이전트 전망", 1], ["10억", "대", "2040년 휴머노이드 전망"], ["7,000조", "엔", "2040년 AI 경제 규모(약)"]], "src": "뉴스위치 · 비즈니스네트워크 · 케이타이 워치(검색 요약만 확인)", "grade": "추정"}, {"tm": "해외 · 유럽", "name": "EU", "co": "유럽 · AI Act 디지털 옴니버스 · 합의 2026.05.06", "title": "고위험 AI 의무는 미루고, AI 고지 의무는 그대로", "q": "고위험 AI 의무는 늦춰졌지만 AI와 대화 중임을 알리는 의무는 그대로 간다.", "hl": ["알리는"], "pts": ["<b>시장 상황:<\/b> 5월 6일 합의로 고위험 AI 의무 시행일이 뒤로 밀렸다.", "<b>숫자:<\/b> 독립형(Annex III)은 2027년 12월 2일, 제품 내장형(Annex I)은 2028년 8월 2일. 규제 샌드박스 설치는 2027년 8월 2일로 1년 연기.", "<b>반응:<\/b> 정리글은 5월 27일 기준이고 정식 채택·관보 공고는 직접 확인하지 못했다. 다른 검색 결과는 8월 초 발효로 전한다.", "<b>국내와 비교:<\/b> 삼성 포럼에서 강조한 안전·통제와 같은 맥락이며, 한국 AI 기본법 대응과 비교할 기준이 된다."], "nums": [["12월 2일", "", "2027년, 독립형 고위험 AI 의무 시작", 1], ["8월 2일", "", "2028년, 제품 내장형 고위험 AI 의무 시작"]], "table": [["의무", "적용일"], ["AI 상호작용 고지 등 투명성 의무", "2026년 8월 2일 (그대로 적용)"], ["워터마킹(Art.50(2)) 기존 출시 시스템 유예", "2026년 12월 2일까지"], ["규제 샌드박스 설치", "2027년 8월 2일 (1년 연기)"], ["독립형 고위험 AI(Annex III)", "2027년 12월 2일"], ["제품 내장형 고위험 AI(Annex I)", "2028년 8월 2일"]], "src": "깁슨 던 법무법인 정리글(2026.05.27)", "grade": "확인"}], "flow": [{"k": "챗봇에서 일을 끝내는 에이전트로", "d": "국내 포럼 연사와 OpenAI·구글·알리바바가 같은 방향. 묻고 답하는 AI에서 목표를 받아 끝까지 처리하는 AI로", "who": [1, 2, 3, 5, 11, 12, 14, 15, 16]}, {"k": "안전·통제가 도입 조건", "d": "보안·거버넌스, 샌드박스, 사람 확인 단계. EU도 고지 의무는 그대로 유지", "who": [3, 11, 12, 18]}, {"k": "에이전트 하나가 아니라 업무 흐름 전체", "d": "끝까지 이어지는 흐름과 표준 커넥터. 중국도 회사 전산망 연결이 경쟁축", "who": [11, 13, 3, 15, 16]}, {"k": "기기 안으로, 몸으로", "d": "온디바이스 4가지 이유, 폰 속 에이전트, 월드 모델과 로봇", "who": [5, 8, 4, 9, 6]}, {"k": "쓰면서 배우는 AI", "d": "삭제·되돌리기까지 학습 신호로 삼는다", "who": [10, 7]}, {"k": "효과는 실측으로, 그러나 자체 수치 주의", "d": "배수와 증가율은 대부분 연사 자체 발표. 느려졌다는 실험과 부분 개선의 한계도 함께 나왔다", "who": [2, 12, 13, 15]}], "flowHeadline": "국내도 해외도 같은 곳을 가리켰다: 일은 끝까지 맡기되, 사람이 승인한다", "apply": [{"k": "AI에게 낱개 작업이 아니라 업무 흐름을 맡기기", "p": "우선", "d": "상품 등록·주문 확인·고객 문의를 '입력 → 처리 → 확인 → 기록' 흐름으로 나눠 설계한다. 흐름마다 사람이 승인할 지점을 처음부터 표시한다. 한 단계만 빨라지면 전체 절감이 작다는 계산(작업 20%를 4배 빠르게 해도 15%)을 기준으로 삼는다.", "r": "⑪ Dell · ⑬ 한재준", "who": "2본부 · 3본부"}, {"k": "되돌리기 어려운 일과 쉬운 일의 승인 단계를 나누기", "p": "우선", "d": "자료 읽기·초안 작성은 격리된 공간에서 승인 없이 돌리고, 쇼핑몰 등록·광고 집행·회계 입력처럼 되돌리기 어려운 일만 사람이 승인한다. Anthropic은 샌드박스 설계로 승인 요청을 약 84% 줄였다고 발표했다.", "r": "⑫ Anthropic · ⑪ Dell · ③ AWS", "who": "1본부 · 2본부"}, {"k": "AI 도입 효과는 우리 숫자로 다시 재기", "p": "우선", "d": "숙련 개발자 실험에서 AI를 쓴 쪽이 19% 느렸다는 결과가 함께 나왔다. 연사가 낸 배수를 그대로 믿지 말고, 영상 제작·회계 입력·상세페이지 작성마다 AI 사용 전후 소요 시간과 고쳐 쓴 횟수를 표로 쌓는다.", "r": "② OpenAI · ⑬ 한재준", "who": "2본부"}, {"k": "쇼핑몰·회계 화면을 공통 규격(MCP)으로 연결할 수 있는지 확인", "p": "검토", "d": "화면을 하나씩 조작하는 자동화는 화면이 바뀌면 멈춘다. 쇼핑몰·회계 시스템 중 공통 규격이나 공식 연결 방식을 지원하는 곳부터 옮길 수 있는지 조사한다. 삼성 DS부문의 표준 커넥터 구조와 중국 업체의 전산망 연결 경쟁이 같은 방향이다.", "r": "⑬ 한재준 · ⑯ 알리바바", "who": "2본부"}, {"k": "AI 사용료 비교표를 작업 단위로 만들기", "p": "검토", "d": "에이전트 구독이 월 200달러와 500달러 구간으로 나뉘고, 한 플랫폼에서 여러 회사 모델을 섞어 쓰는 흐름이다. 영상·문서·조사 작업별로 어떤 요금제와 모델이 싼지 비교표를 만들어 분기마다 갱신한다.", "r": "⑭ OpenAI · ⑮ Google Cloud", "who": "1본부 · 2본부"}, {"k": "사람이 고친 기록을 AI 기준으로 되돌려 넣기", "p": "유지", "d": "삼성은 삭제·취소·되돌리기를 불만 신호로 학습한다고 발표했다. 우리도 AI 결과물에서 사람이 고친 곳을 모아 채널·제품별 기준표에 반영하는 방식을 이어 간다.", "r": "⑩ 지속 학습 · ⑦ 황인철", "who": "1본부 · 2본부"}, {"k": "AI 사용 표시 규칙을 지키고, 판매 나라가 늘면 먼저 점검", "p": "유지", "d": "EU의 AI 고지 의무는 8월 2일부터 적용 중이고, 한국 AI 기본법 대응도 함께 봐야 한다. 지금의 영상 설명란 AI 사용 안내와 업로드 설정을 유지하고, 새 나라에 팔 때는 그 나라의 표시 의무를 등록 전에 확인한다.", "r": "⑱ EU", "who": "1본부 · 2본부"}], "media": {"headline": "행사 전체 다시보기 2편과 주제를 쉽게 설명하는 영상 6편을 붙였습니다", "videos": [{"title": "[Samsung AI Forum 2026] Keynote + Track 1. AI Technology", "url": "https://www.youtube.com/watch?v=Velq-bBfX-o", "len": "7:56:51", "note": "행사 다시보기 · Samsung Developer · 오전 키노트와 패널, 트랙 1(발표 ②~⑩). 구간 표시가 없어 직접 찾아야 함"}, {"title": "[Samsung AI Forum 2026] Keynote + Track 2. AX Innovation", "url": "https://www.youtube.com/watch?v=6qISsYkakK4", "len": "7:58:05", "note": "행사 다시보기 · Samsung Developer · 오전 키노트와 트랙 2(발표 ⑪~⑬). 구간 표시가 없어 직접 찾아야 함"}, {"title": "[AI·ICT 백과사전] 에이전틱 AI (Agentic AI)", "url": "https://www.youtube.com/watch?v=MQDXJudNCWA", "len": "약 2분", "note": "주제 설명 영상(행사 영상 아님) · 정보통신기획평가원 · 에이전틱 AI 개념과 기존 AI와의 차이(2026-01)"}, {"title": "[3분 IT 인사이트] CES 2025 핵심 화두! AI 에이전트란 무엇인가?", "url": "https://www.youtube.com/watch?v=4Dw9KFIF4UA", "len": "약 3분", "note": "주제 설명 영상(행사 영상 아님) · 삼성SDS · AI 에이전트 개념과 사례(2025)"}, {"title": "MCP, 대체 이게 뭘까요? 진짜 쉽게 설명해드림", "url": "https://www.youtube.com/watch?v=FWtLqzgoaxI", "len": "12:16", "note": "주제 설명 영상(행사 영상 아님) · 헬로우AI · AI와 도구를 잇는 표준 규격 MCP(2025-10)"}, {"title": "애플·삼성이 주목하는 '온디바이스 AI'의 모든 것", "url": "https://www.youtu
