 중 인력 임금 몫 (80/20 규칙)"]], "src": "Home Health Care News 2026.11.03 (CMS-2449-P는 검색 요약, 원문 미확인)", "grade": "확인"}], "flow": [{"k": "책임은 개인이 아니라 기관·지자체·국가", "d": "서면 축사, 기조강연, 두 요양보호사 증언이 같은 말을 했다", "who": [1, 2, 3, 4]}, {"k": "위험 비용을 수가에 넣어야 한다", "d": "위험 대응 비용·위험 저감 비용·보험 안 건강권 — 세 사람이 같은 결론", "who": [2, 6, 5]}, {"k": "말하면 일자리를 잃는다는 두려움", "d": "서비스가 끊길까, 쉬면 소득이 줄까 걱정해 위험을 숨긴다", "who": [4, 3, 6]}, {"k": "위험성평가가 서류 작업이 되면 안 된다", "d": "2027·2028년 의무화를 앞두고 '실제로 쓸 수 있는지' 묻는 평가로", "who": [5, 3, 7]}, {"k": "위험을 수급자 쪽 계획에서부터 관리", "d": "인정조사·이용계획서·지원계획에 안전 항목을 넣자", "who": [6, 2, 5]}, {"k": "국내·해외 모두 '돌봄 비용을 누가 내나'", "d": "한국 수가 논쟁, 일본 본인부담 확대, 독일 예산 개편, 미국 인력 임금 80% 규칙", "who": [2, 10, 11, 12]}], "flowHeadline": "모두가 같은 답을 냈다: 위험의 비용을 개인이 아니라 제도 안으로", "apply": [{"k": "기관 영업 자료에 '위험성평가 때 볼 보조기구' 안내를 넣기", "p": "우선", "d": "50명 이상 기관은 2027년, 그 외는 2028년부터 위험성평가가 의무다. 현장 요구가 '서비스 시작 전 주거 위험요인·보조기구 점검'이었으므로, 재가 기관·복지용구 사업소에 낙상·부축 위험을 줄이는 복지용구 점검표를 제품 안내와 함께 건넨다. 고관절보호대는 2027년 3월 급여 판매 시작에 맞춰 이 점검표에 넣는다.", "r": "③ 오귀자 · ⑤ 조승규", "who": "3본부(기관 영업)"}, {"k": "위험성평가 법 시행과 '안전 항목' 제도화 감시", "p": "우선", "d": "인정조사·이용계획서에 안전·환경 항목을 넣자는 제안, 위험 비용을 수가에 넣자는 제안이 실제 고시로 이어지는지 지켜본다. 이어지면 환경개선형 복지용구 수요가 생기므로, 영향 분석을 해당 본부에 바로 넘긴다.", "r": "⑥ 정진주 · ② 백도명 · ⑧ 부처 토론", "who": "3본부(급여 등재·규제)"}, {"k": "부축·목욕 부담을 덜어 주는 제품 후보 정리", "p": "검토", "d": "현장에서 위험하다고 답한 일 1·2위가 부축(54.3%)과 목욕(52.5%)이고, 연구진도 '어르신 체중을 받치는 작업 최소화'를 제안했다. 이승·목욕 보조 쪽 제품을 현재 복지용구 급여 목록과 대조해 우리가 만들 수 있는 빈자리를 찾는다. 효능 표현은 시험 근거가 있는 범위로만 쓴다.", "r": "⑤ 조승규", "who": "3본부 · 제품 기획"}, {"k": "배설 돌봄 부담을 줄이는 요실금팬티 안내를 기관용으로", "p": "검토", "d": "증언에 '분변으로 인한 위협'이 나왔다. 요양보호사가 배설 돌봄에서 겪는 부담을 줄이는 관점으로 기관·보호자용 사용 안내(교체 방법, 위생 처리)를 만든다. 성능 주장은 시험 근거 범위 안에서만 한다.", "r": "③ 오귀자", "who": "2본부(쇼핑몰·광고) · 3본부"}, {"k": "보호자용 '집 안 돌봄 안전 점검' 콘텐츠", "p": "검토", "d": "요양보호사가 일하는 곳은 어르신 집이다. 가족이 미리 욕실 미끄럼, 부축 동선, 병력·복용약 정보 공유(미공유 51.3%)를 점검하는 짧은 영상·글을 만들어 정보 채널과 자사몰에 싣는다. 요양보호사를 탓하는 말투가 아니라 '함께 지키는 안전'으로 쓴다.", "r": "⑤ 조승규 · ⑥ 정진주", "who": "1본부(유튜브) · 2본부"}, {"k": "요양보호사가 '산재
