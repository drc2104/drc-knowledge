을 존중하는 일이며, 지역사회와 소셜 비즈니스가 함께 풀 과제.", "<b>주지현:<\/b> 은퇴 후 배우자·자녀에게만 기대지 말고 '아플 때 병원에 함께 가 줄 수 있는 동네 친구' 같은 관계망을 가꿔야 한다.", "<b>최학희:<\/b> 인지 저하 전에 재산·돌봄의 뜻을 정리하지 않으면 분쟁이 생기기 쉽다 → 신탁과 가족 간 사전 대화.", "<b>이준호:<\/b> 시중은행 신탁 기준 25억 원 이상은 문턱이 높다 → 통합돌봄과 이어지는 '공적 신탁' 보완.", "<b>김범용:<\/b> 공공 거점이 퇴직 중장년을 '시니어 활동가'로 키워 일자리와 고독사 대응을 함께 잡자.", "<b>미리 정한 의제(사전 기사):<\/b> 시니어를 생산자·소비자·투자자로 보는 관점 전환 / LX 시대 시니어 비즈니스 기회 / 웰다잉·레거시 서비스의 산업화 가능성 / 중장년 생애자산을 활용한 프로젝트형 일자리·창업 모델."], "table": [["패널", "내놓은 해법"], ["주지현", "동네 안 서로 돌보는 관계망"], ["최학희", "신탁 + 가족 간 사전 대화"], ["이준호", "통합돌봄 연계형 공적 신탁"], ["김범용", "퇴직 중장년을 시니어 활동가로 양성"]], "video": {"title": "154조 '치매 머니' 살린다…정부, 후견·신탁 활성화 / KBS 2025.05.30.", "url": "https://www.youtube.com/watch?v=sWDcoPaOxGk"}, "src": "브라보마이라이프 20379 · 20288", "grade": "확인"}, {"tm": "해외 · 미국", "name": "Bank of America Institute", "co": "미국 · 보고서 · 2026년 10월", "title": "고령 소비자의 시대로 (Entering the age of the older consumer)", "q": "55세 넘는 가구의 순자산이 140조 달러에 가깝고, 65세 이상은 일하는 시간이 줄고 여가가 늘었다.", "hl": ["140조"], "pts": ["<b>시장 상황:<\/b> 60세 넘는 인구 비중이 1995~2025년 거의 10%p 늘었고, 2055년까지 5%p 더 올라 인구의 30% 가까이가 된다.", "<b>숫자:<\/b> 55세 초과 가구 순자산 2026년 2분기 약 140조 달러. 65세 이상은 하루 일하는 시간이 2.5시간 적고, 여가는 약 2시간 많다.", "<b>반응(카드 데이터):<\/b> 식료품·여행 지출 비중이 상대적으로 크고, 외식·주유·일반 상품·의류는 작다. 고정 소득 가구는 의료비 부담이 크다.", "<b>국내와 비교:<\/b> 시니어를 한 덩어리로 보지 말고 자산·소득층으로 나눠 봐야 한다는 점은 이준호 기자의 '생활 사건' 관점과 같은 방향. 한국 비교 수치는 이번에 확인하지 못했다."], "nums": [["약 140", "조 달러", "55세 초과 가구 순자산(2026년 2분기)", 1], ["30", "% 가까이", "2055년 60세 초과 인구 비중"], ["2.5", "시간", "65세 이상 하루 노동 시간 감소"]], "src": "https://institute.bankofamerica.com/economic-insights/older-consumers.html", "grade": "확인"}, {"tm": "해외 · 미국", "name": "HLTH · Best Buy Health", "co": "미국 · 업계 매체 인터뷰(AARP 통계 인용) · 2026-11-02", "title": "50세 이상이 미국 경제활동의 43%", "q": "미국은 노인 비중이 아직 낮지만, 50세 이상을 넓게 묶어 GDP의 43%를 만드는 시장으로 본다.", "hl": ["43%를"], "pts": ["<b>시장 상황:<\/b> 65세 이상 인구는 10년 새 38.6% 늘어 2020년 센서스에서 5,580만 명.", "<b>숫자:<\/b> 50세 이상이 2024년 12.5조 달러의 경제활동(GDP의 43%)을 만들었고, 2060년 24조 달러에 다가간다. 65세 이상 비중은 2025년 10.5% → 2060년 19.6%.", "<b>제품:<\/b> 기사에 제품 가격은 없음. 업계 행사 HLTH USA 2026은 11월 15~18일 라스베이거스.", "<b>국내와 비교:<\/b> 미국은 '50세 이상'으로 시장을 넓게 잡는다. 나이 기준이 나라마다 달라(60세+, 65세+, 50세+) 숫자를 바로 비교하면 안 된다."], "nums": [["12.5", "조 달러", "50세 이상 경제활동(2024)"], ["43", "%", "GDP 대비 비중", 1], ["38.6", "%", "65세 이상 인구 10년 증가율"]], "shift": {"from": "10.5%", "to": "19.6%", "cap": "미국 65세 이상 인구 비중 2025년 → 2060년"}, "src": "https://hlth.com/insights/articles/building-for-life-a-conversation-with-chemu-lang-at-of-best-buy-health (숫자는 AARP 통계 2차 인용)", "grade": "확인"}, {"tm": "해외 · 독일", "name": "독일 연방정부", "co": "독일 · 간호보험 개편안 내각 결정 · 2026-09-30", "title": "수급자 3배, 간호보험 재정 적자에 지원 대상을 조인다", "q": "수급자가 20년 새 약 3배가 되자, 경증 판정을 엄격히 하고 재가 1등급 월 131유로 지원을 없애는 안이 나왔다.", "hl": ["131유로"], "pts": ["<b>시장 상황:<\/b> 간호보험 수급자가 2005년 약 195만 명에서 2025년 약 600만 명으로 늘었다.", "<b>제도:<\/b> 일반 요율 3.6% 유지, 자녀 없는 사람의 추가 요율은 2027년 1월 1일부터 0.6% → 0.9%(총 4.5%). 소득 상한 월 6,375유로.", "<b>숫자:<\/b> 재정 적자 전망은 매체마다 다름 — Berliner Zeitung 2027년 약 76억 유로·2028년 150억 유로 이상 / ZDF 2027년 약 80억 유로·2030년 170억 유로 이상. 시설 본인부담 평균 첫해 3,245유로.", "<b>지원 축소:<\/b> 요양등급(Pflegegrad) 1~3 판정을 더 엄격하게, 재가 1등급의 월 131유로 부담경감 지원은 폐지.", "<b>국내와 비교:<\/b> 수급자가 빠르게 늘면 급여 대상을 조이는 쪽으로 간다는 사례. 한국 장기요양·복지용구 시장에도 정책 위험으로 참고할 만하다(비교는 정리자 판단)."], "bars": {"t": "독일 간호보험 재정 적자 전망 (Berliner Zeitung 기준)", "u": "억 유로", "rows": [["2027", 76, "b"], ["2028", 150, "a"]]}, "shift": {"from": "0.6%", "to": "0.9%", "cap": "자녀 없는 가입자 추가 요율 (2027년 1월 1일부터)"}, "nums": [["약 600만", "명", "간호보험 수급자(2025)", 1], ["131", "유로/월", "폐지되는 재가 1등급 지원"], ["3,245", "유로", "시설 본인부담 평균(첫해)"]], "src": "https://www.berliner-zeitung.de/article/pflegereform-2026-kinderlose-pflegegrade-10448167 · https://www.zdfheute.de/politik/deutschland/reform-pflegeversicherung-finanzen-milliarden-defizit-100.html", "grade": "확인"}, {"tm": "해외 · 일본", "name": "일본 총무성", "co": "일본 · 경로의 날 인구추계(구마모토일일신문) · 2026-09-20 공표(참고, 30일 밖)", "title": "65세 이상 3,624만 명, 인구의 29.6%로 역대 최고", "q": "일본은 노인 비중이 역대 최고이고, 일하는 노인과 혼자 사는 노인이 함께 늘고 있다.", "hl": ["역대", "최고이고,"], "pts": ["<b>시장 상황:<\/b> 65세 이상 3,624만 명, 전년보다 2만 명 늘어 총인구의 29.6%(0.2%p 상승, 역대 최고).", "<b>숫자:<\/b> 65세 이상 취업자 943만 명(22년 연속 증가). 65세 이상 혼자 사는 사람은 2025년 933만 명 넘음(후생노동성). 2045년 3,945만 명(36.3%) 전망.", "<b>국내와 비교:<\/b> 한국이 갈 길을 먼저 보여 주는 사례. 부천이 1인 가구·무연고 사망 증가에 대응한 것, 퇴직 중장년을 활동가로 키우자는 김범용 이사의 말과 같은 방향이다."], "bars": {"t": "일본 65세 이상 인구 (만 명)", "u": "만", "rows": [["2026(추계)", 3624, "b"], ["2045(전망)", 3945, "a"]]}, "nums": [["29.6", "%", "65세 이상 비중", 1], ["943만", "명", "65세 이상 취업자"], ["933만", "명+", "65세 이상 혼자 사는 사람(2025)"]], "src": "https://kumanichi.com/articles/2038037", "grade": "확인"}, {"tm": "해외 · 일본", "name": "H.C.R.2026 국제복지기기전", "co": "일본 · 전시회(도쿄 빅사이트) · 2026-10-07~09", "title": "쓰던 휠체어를 전동으로 바꾸는 키트, 돌봄 현장용 골전도 이어폰", "q": "새 장비보다 이미 가진 장비를 고쳐 쓰고, 현장 직원의 일을 덜어 주는 제품이 눈에 띄었다.", "hl": ["이미", "가진"], "pts": ["<b>제품:<\/b> 야마하발동기는 휠체어 전동화 유닛 'JWX-2'(보조식)·'JWG-1'(조이스틱식)을 전시했다. Shokz는 간병·의료 현장용 골전도 오픈이어 'OpenMeet 2' 등을 내놨다. 가격은 기사에 없음.", "<b>숫자:<\/b> 방문자 '약 12만 명'은 출전사 홍보 문구이고, '382개사(해외 44개사)', '전년 121,137명'은 검색 요약이라 확인하지 못했다(추정).", "<b>국내와 비교:<\/b> 현장 종사자 부담을 먼저 덜어 주는 에이지테크를 고르자는 이준호 기자의 도입 기준과 같은 방향."], "nums": [["약 12만", "명", "방문자(출전사 홍보 문구, 추정)"]], "src": "https://www.hokkaido-np.co.jp/article/1376431/ · https://www.techno-edge.net/release/prtimes2/20261006/24853.html", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 민정부·전국노령공작위원회", "co": "중국 · 2025년도 국가노령사업발전공보 · 2026-07-31 보도(참고)", "title": "60세 이상 3억 2,338만 명, 인구의 23%", "q": "비중은 일본보다 낮지만 65세 이상만 2억 명이 넘는 규모의 시장이다.", "hl": ["2억"], "pts": ["<b>시장 상황:<\/b> 2025년 말 60세 이상 3억 2,338만 명(총인구의 23%).", "<b>숫자:<\/b> 65세 이상 2억 2,365만 명(총인구의 15.9%).", "<b>국내와 비교:<\/b> 비중보다 절대 규모가 큰 시장. 나이 기준이 60세·65세로 섞여 있어 다른 나라와 비교할 때 주의."], "nums": [["3억 2,338만", "명", "60세 이상(23%)"], ["2억 2,365만", "명", "65세 이상(15.9%)", 1]], "src": "https://cn.chinadaily.com.cn/a/202607/31/WS6a6c632ba310d709c2fc0e6f.html", "grade": "확인"}, {"tm": "해외 · 중국", "name": "티몰(天猫)", "co": "중국 · 쇼핑몰 전용 채널 · 2026-03-18 시작(참고, 6개월 밖)", "title": "고령 친화 전용 채널 '황푸서우(黄扶手)' 개설", "q": "쇼핑몰이 직접 고령 친화 안전용품 채널을 열었고, 손잡이·욕실 용품부터 크게 늘었다.", "hl": ["손잡이·욕실"], "pts": ["<b>제품:<\/b> 침대 손잡이, 건조 방지 가스레인지, 스마트 보호 카메라 등 약 20여 개 품목. 8개 브랜드가 높낮이 조절 제품 1만 개를 기부했다.", "<b>숫자:<\/b> 4년간 고령 친화 관련 검색 사용자 연 70% 넘게 증가, 1~2월 고령 친화 욕실 품목 90% 넘게 증가, 가구 규모 2배, 승강 바구니 7배, 거래액 연 증가율 36%(모두 티몰 자체 발표). 가격은 기사에 없음.", "<b>반응:<\/b> 검색 사용자가 해마다 크게 늘었다는 것은 찾는 사람이 많아졌다는 뜻(티몰 발표 기준).", "<b>국내와 비교:<\/b> 국내 행사에서는 제품보다 서비스·신탁 이야기가 많았지만, 해외 쇼핑몰은 생활 안전용품을 한곳에 모으기 시작했다."], "nums": [["36", "%", "고령 친화 제품 거래액 연 증가율", 1], ["70", "%+", "관련 검색 사용자 연 증가(4년간)"], ["7", "배", "승강 바구니(1~2월)"], ["1만", "개", "브랜드 기부 승강형 제품"]], "src": "https://news.sina.cn/sx/2026-03-19/detail-inhrnqzu1011109.d.html", "grade": "확인"}, {"tm": "해외 · EU", "name": "Eurostat", "co": "EU · 통계 간행물 '유럽의 인구' 2026판 · 2026년 5월 중순", "title": "EU 65세 이상 9,900만 명, 인구의 22%", "q": "EU는 다섯 명 중 한 명 넘게 65세 이상이고, 중위연령이 20년 새 5.3세 올랐다.", "hl": ["5.3세"], "pts": ["<b>시장 상황:<\/b> 2025년 1월 1일 기준 65세 이상이 EU 인구의 22%, 9,900만 명. 80세 이상은 6%.", "<b>숫자:<\/b> 중위연령 2005년 39.6세 → 2025년 44.9세.", "<b>국내와 비교:<\/b> 아래 표는 이번에 확인한 나라별 숫자를 원문 그대로 모은 것. 한국 칸은 이번 조사에서 확인한 수치가 없어 비웠다."], "shift": {"from": "39.6세", "to": "44.9세", "cap": "EU 중위연령 2005년 → 2025년"}, "nums": [["9,900만", "명", "EU 65세 이상"], ["22", "%", "65세 이상 비중", 1], ["6", "%", "80세 이상 비중"]], "table": [["나라", "65세 이상 인구 · 비중 · 시장"], ["일본", "3,624만 명 · 29.6% (2026.9 추계)"], ["중국", "2억 2,365만 명 · 15.9% (2025년 말) · 은발경제 30조 위안 돌파 전망(정부)"], ["미국", "5,580만 명(2020 센서스) · 10.5%(2025) · 50세 이상 경제활동 12.5조 달러(GDP의 43%)"], ["EU", "9,900만 명 · 22% (2025.1.1)"], ["독일", "간호보험 수급자 약 195만 → 약 600만 명(2005→2025)"]], "src": "https://ec.europa.eu/eurostat/web/interactive-publications/demography-2026", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 국무원 상무회의", "co": "중국 · 신화사 보도 · 2026-02-24(참고, 6개월 밖)", "title": "은발경제 30조 위안 돌파 전망, 소비보조금과 양로 사기 단속", "q": "노인 인구가 2035년 4억 명을 넘을 것으로 보고, 소비를 키우는 동시에 양로 분야 사기를 단속한다.", "hl": ["4억"], "pts": ["<b>시장 상황:<\/b> 2025년 말 60세 이상 3.2억 명, 2035년 4억 명을 넘을 전망.", "<b>숫자:<\/b> 은발경제(시니어 경제) 규모 30조 위안 돌파 전망(정부 전망).", "<b>제도:<\/b> 소비보조금으로 새로운 업태를 키우고, 양로 분야의 허위 선전·불법 자금 모집을 단속한다.", "<b>국내와 비교:<\/b> 시장을 키우면서 '믿을 수 있는가'를 함께 챙긴다는 점이 국내 토론의 '신뢰 장치' 이야기와 같은 방향."], "shift": {"from": "3.2억", "to": "4억+", "cap": "중국 60세 이상 인구 2025년 말 → 2035년 전망"}, "nums": [["30조", "위안", "은발경제 규모 전망(정부)", 1]], "src": "https://www.news.cn/20260224/dadf82c9d52a45b58cddfbf446b21bfd/c.html", "grade": "확인"}], "flow": [{"k": "'가족 혼자'에서 '지역·공공이 함께'로", "d": "가족 밖 서비스 연계, 동네 관계망, 부천 민관 모델이 같은 말을 했다", "who": [5, 1, 4]}, {"k": "뜻을 끝까지 지켜 줄 신뢰 장치", "d": "4단계 신뢰 레일, 공적 신탁, 일본 종신지원, 중국 양로 사기 단속", "who": [3, 2, 5, 14]}, {"k": "나이가 아니라 생활 사건·자산으로 시장을 나눈다 (국내·해외 같은 방향)", "d": "퇴직·자녀 독립·면허 반납 기준(국내), 자산·소득층과 50세 이상 넓은 정의(미국)", "who": [2, 6, 7]}, {"k": "중장년·노인 본인이 일하는 사람이 된다 (국내·해외 같은 방향)", "d": "채비플래너·시민활동가(부천), 일본 65세 이상 취업자 943만 명", "who": [4, 2, 9]}, {"k": "사람이 늘수록 돌봄 재정은 조여진다", "d": "독일 수급자 3배에 경증 지원 축소, 중국·일본·EU 노인 규모 증가", "who": [8, 9, 11, 13]}, {"k": "현장 부담을 덜고 생활 안전부터", "d": "현장 종사자 우선 에이지테크, 휠체어 전동화 키트, 손잡이·욕실 용품 급증", "who": [2, 10, 12]}], "flowHeadline": "국내도 해외도 같은 방향: 혼자 지던 돌봄을 미리 정하고 함께 나눈다", "apply": [{"k": "요실금팬티 광고·상세페이지를 '생활 사건' 기준으로 다시 짜기", "p": "우선", "d": "'고령자용'이라는 나이 표현 대신 퇴직 뒤 여행, 자녀 독립 뒤 혼자 하는 외출, 운전면허 반납 뒤 대중교통 이동처럼 생활이 바뀌는 순간을 장면으로 쓴다. 한·일 5060 여성의 1인 여가 흐름에 맞춰 '혼자 다니는 하루' 문구를 시험한다.", "r": "② 이준호 · ⑥ Bank of America", "who": "2본부 · 1본부 유튜브"}, {"k": "가족 돌봄 나눔 안내를 콘텐츠로", "p": "검토", "d": "주지현 교수가 말한 '식사·복약 확인 역할 나누기, 지역 서비스 미리 알아 두기'를 가족용 체크리스트로 만든다. 복지용구 급여 이용 방법 안내를 함께 넣어 고관절보호대·요실금팬티 등재품을 자연스럽게 소개한다. 의학 효과는 단정하지 않는다.", "r": "① 주지현 · ⑤ 패널토론", "who": "1본부 · 2본부"}, {"k": "50플러스센터·노인복지관 교육 과정에 '집 안 낙상 대비' 회차 제안", "p": "검토", "d": "부천처럼 공공 거점이 웰엔딩·돌봄 교육을 운영한다. 이런 과정에 복지용구 급여 제도와 집 안 안전용품 쓰는 법을 알려 주는 회차를 제안해, 기관 영업 접점을 만든다.", "r": "④ 김범용 · ⑤ 패널토론", "who": "3본부"}, {"k": "급여 판매와 온라인 판매를 함께 키워 정책 위험 나누기", "p": "우선", "d": "독일은 수급자가 3배로 늘자 경증 지원을 줄였다. 고관절보호대 급여 판매(2027년 3월 예정)를 준비하면서도 쿠팡·스마트스토어 같은 비급여 판매 경로를 함께 유지하고, 장기요양 급여 기준 변경을 계속 감시한다.",
