: ["<b>무엇을 바꾸나:<\/b> 복지부는 의료 필요도와 요양 필요도를 함께 평가하는 통합판정체계 도입을 추진 중(쿠키뉴스).", "<b>도입 시점:<\/b> 더비즈는 정부가 \"2028년부터\" 장기요양에 통합판정체계 도입을 추진한다고 썼다. 다른 기사에는 일정이 없다.", "<b>이미 한 시범:<\/b> 복지부 2024년 4월 보도자료 기준 2차 시범사업은 13개 지역 3,000명(4~12월).", "<b>판정 3단계:<\/b> 통합판정조사 → 의료위원회 → 통합판정위원회.", "<b>제목 표기:<\/b> 소셜포커스 '추진 경과와 발전 방향' / 로이슈·간호사신문 '추진 현황 및 향후 발전 방향' — 두 가지로 실림.", "<b>한계:<\/b> 발표 속 숫자·인용은 기사 9건 어디에도 없다. 발표자료 확보 뒤 보강 예정."], "nums": [["13", "개 지역", "2차 시범사업 지역 (2024)"], ["3,000", "명", "2차 시범사업 대상 (2024)"], ["3", "단계", "조사 → 의료위원회 → 통합판정위원회", 1]], "video": {"title": "[건보인사이드] 노인장기요양보험 인정신청 절차, 건강보험공단에서 정확히 알려드립니다!", "url": "https://www.youtube.com/watch?v=C4rra31STNk"}, "src": "소셜포커스 · 로이슈 · 간호사신문 · 쿠키뉴스 · 더비즈 · 복지부 보도자료(2024.04.05)", "grade": "확인"}, {"tm": "발표 2", "name": "이혜진", "co": "분당서울대학교병원 가정의학과 교수", "title": "의료·요양 돌봄을 잇는 재택의료센터의 역할과 연계 방안", "q": "발표 본문은 기사에 없음 — 재택의료센터가 병원 의료와 집 돌봄을 잇는 고리가 되는 방법이 주제", "hl": ["잇는", "고리가"], "pts": ["<b>재택의료센터란:<\/b> 의사·간호사가 집으로 찾아오는 장기요양 재택의료 기관.", "<b>늘어나는 수(배경, 발표 아님):<\/b> 복지부가 10월 30일 제5차 장기요양위원회에서 올해 8월 463곳을 내년 500곳으로 늘리기로 의결(세계일보).", "<b>거점 재택의료센터:<\/b> 24시간 대응을 강화한 중심 센터를 따로 지정하기로 함.", "<b>발표 3과의 연결:<\/b> 임종기 구상에서 재택의료센터가 사전연명의료의향서를 조회하고 임종기 진입을 판단해 진료계획을 세우는 역할을 맡는다.", "<b>제목 표기:<\/b> 로이슈 '재택의료센터가 의료·요양 돌봄을 연결하는 역할과 연계 방안' / 소셜포커스 '의료·요양 돌봄을 잇는 재택의료센터의 역할과 연계 방안'.", "<b>한계:<\/b> 발표 속 숫자·인용은 기사에 없다."], "bars": {"t": "장기요양 재택의료센터 수 (복지부 장기요양위원회 의결, 배경 숫자)", "u": "곳", "rows": [["2026년 8월", 463, "c"], ["2027년 목표", 500, "a"]]}, "video": {"title": "의사·간호사가 안방으로...경기도 재택의료 7천 명 돌파", "url": "https://www.youtube.com/watch?v=je0oI-1rLn8"}, "src": "로이슈 · 소셜포커스 · 세계일보(배경 숫자)", "grade": "확인"}, {"tm": "발표 3", "name": "김세진", "co": "한국보건사회연구원 연구위원 · 복지부 의뢰 재가 생애말기 지원체계 연구(3월부터)", "title": "원하는 장소에서의 임종을 위한 지원체계 구축 방안", "q": "궁극적으로 누구든 임종기 대상자는 자격에 상관없이 임종기 서비스를 받을 수 있는 체계를 마련해야 한다.", "hl": ["자격에", "상관없이"], "pts": ["<b>왜 지금:<\/b> 전체 사망자 중 80세 이상이 2015년 40.8%에서 지난해 54.7%로(지난해 사망자 36만 2,968명). 장기요양 인정자는 2010년 27만 명에서 올해 3월 125만 명으로 약 4.6배.", "<b>희망과 현실:<\/b> 집에서 임종을 바라는 사람 67.5%, 실제 14.7%. (세계일보 보충 자료: 2023년 기준 의료기관 임종 72.9%)", "<b>돈의 흐름:<\/b> 사망 전 1년 급여비 중 마지막 3개월에 42.4%가 쓰인다. \"의료비가 결국에는 돌봄 비용으로 올 수밖에 없는 부분들이 있다\", 임종기 의료와 돌봄은 \"반드시 함께 가야 되는 부분\".", "<b>시기를 둘로:<\/b> 생애말기(대략 사망 전 1년, 어떤 치료·돌봄을 받을지 의논·준비)와 임종기(수일~수주 안으로 임박, 집중 지원 약 4주). 사망 뒤 가족의 절차·이별 정리도 지원 범위.", "<b>누가 무엇을:<\/b> 장기요양 급여를 처음 쓸 때 환자·가족에게 사전돌봄계획 안내 / 재택의료센터가 사전연명의료의향서 조회·임종기 판단·진료계획 / 방문요양기관이 하루 여러 번, 야간·휴일에도 방문 / 재택의료진이 가족에게 연락처와 사망 확인 절차를 미리 안내.", "<b>넓혀 가는 순서:<\/b> 재가 수급자 → 시설 입소자 → 비수급자. 생전 진료기록으로 예견된 사망을 미리 등록하는 해외 방식은 장기 과제.", "<b>아직 제안 단계:<\/b> 쿠키뉴스는 이 내용이 연구진 제안이며 \"정부의 시범사업 모형은 아직 확정되지 않았다\"고 전했다."], "bars": {"t": "어디서 임종하나 (%, 희망·실제 2023년 건보공단 조사, 의료기관 2023년 기준)", "u": "%", "rows": [["집에서 임종 희망", 67.5, "a"], ["실제 집에서", 14.7, "c"], ["실제 의료기관에서", 72.9, "b"]]}, "nums": [["42.4", "%", "사망 전 1년 급여비 중 마지막 3개월", 1], ["54.7", "%", "사망자 중 80세 이상 (2015년 40.8%)"], ["4.6", "배", "장기요양 인정자 증가 (2010 → 2026.3)"], ["4", "주", "임종기 집중 지원 기간 (안)", 1]], "shift": {"from": "40.8%", "to": "54.7%", "cap": "전체 사망자 중 80세 이상 비중 (2015년 → 지난해)"}, "video": {"title": "[자막뉴스] 90대 어머니 '집에서 임종'...'품위 있는 죽음'에 남긴 유언 (KBS 2025.04.05.)", "url": "https://www.youtube.com/watch?v=MWtcKeoMGEs"}, "src": "쿠키뉴스 · 세계일보 · 더비즈 (희망·실제 비율 출처 표기는 기사마다 다름, 숫자 메모 참고)", "grade": "확인"}, {"tm": "토론", "name": "패널토론·인사말", "co": "좌장 김지영 건강보험연구원장 · 패널 4명 · 김기형 공단 장기요양돌봄상임이사", "title": "패널토론 · 개회 인사말", "q": "초고령사회에 대응하기 위해 통합적인 돌봄체계와 존엄한 삶의 마무리를 위한 재택임종 환경 조성이 시급하다.", "hl": ["존엄한", "마무리를"], "pts": ["<b>패널:<\/b> 이용재 호서대 사회복지학부 교수, 정혜진 한국재택의료협회 이사, 장숙랑 중앙대 적십자간호대학 교수, 이용희 보건복지부 요양보험제도과 사무관.", "<b>이용희 사무관(쿠키뉴스):<\/b> 임종기 판정 → 의뢰 → 서비스 제공 → 임종 → 사후 지원까지 과정을 표준화해야 한다. 재택의료팀과 일상생활 돌봄 제공자의 협업 모델 검증이 필요하다.", "<b>언제 확정되나:<\/b> 구체 모형은 \"장기요양위원회 논의를 통해 확정할 예정\"(이용희 사무관).", "<b>함께 거론된 과제(더비즈):<\/b> 방문의료·간호·장기요양서비스 연계, 가족의 돌봄 부담 완화.", "<b>공단 계획(김기형 상임이사 인사말):<\/b> 포럼 의견으로 정책 개선안을 만들어 제도 개편을 추진.", "<b>시범 일정:<\/b> 쿠키뉴스·세계일보·더비즈는 '내년 하반기 수급자 대상 재택임종 지원 시범사업', 메디포뉴스는 '포럼 자료에서 시행 일정을 발표하지 않았다' — 출처마다 다름.", "<b>한계:<\/b> 다른 패널의 개별 발언은 기사에 없다."], "table": [["임종기 지원 단계 (이용희 사무관)", "누가 맡나 (발표 3 구상)"], ["판정", "재택의료센터가 임종기 진입 판단"], ["의뢰·서비스 제공", "재택의료팀 + 방문요양기관(야간·휴일 방문)"], ["임종", "재택의료진이 연락처·사망 확인 절차를 가족에게 미리 안내"], ["사후 지원", "가족의 절차·이별 정리 지원"]], "video": {"title": "[국민건강보험] 하루 5분 건강보험, 장기요양보험(6편)", "url": "https://www.youtube.com/watch?v=1QqlpfPgQRU"}, "src": "쿠키뉴스 · 더비즈 · 간호사신문 · 로이슈 · 메디포뉴스 · 소셜포커스 (오른쪽 칸은 발표 3 내용을 단계에 맞춰 정리한 것)", "grade": "확인"}, {"tm": "해외 · 독일", "name": "독일 연방의회", "co": "독일 · 연방의회 보도(hib 873/2026) · 2026-11-02", "title": "간호보험 개편법안(PNOG) 의회 제출", "q": "보험료를 올리고, 현금 수당과 서비스를 한 예산으로 묶어 재정을 안정시키겠다는 법안이다.", "hl": ["한", "예산으로"], "pts": ["<b>시장 상황:<\/b> 9월 30일 내각 합의, 11월 2일 의회 보도. 2027년부터 재정 안정화를 목표로 한다.", "<b>숫자:<\/b> 자녀 없는 가입자 추가 보험료 0.3%p 올려 0.9%, 보험료 소득 상한 월 300유로 인상, 미니잡(저소득 단시간 일자리)에도 보험료 부과. 행정비 정액 3.0% → 2.7%. 디지털화에 연방 16억 유로·주 4억 유로.", "<b>제도:<\/b> 현금 수당(Pflegegeld)을 '부담경감 예산'에 넣고, 2028년 예정이던 급여 인상은 없애고 2029년부터 매년 물가에 맞춰 올린다.", "<b>반응(추정):<\/b> 6월 초안은 추가 보험료 0.7%였다는 보도, 2027년 적자 약 76억 유로 전망(보험사 Allianz 자료, 원문 대조 전).", "<b>국내와 비교:<\/b> 한국 장기요양 보험료율은 2027년 0.9994%(2026년 0.9448%). 독일도 한국도 보험료를 올리며 버티는 중이고, 현금 급여(한국의 가족요양비)를 서비스와 한 예산으로 묶는 실험은 참고가 된다."], "nums": [["0.9", "%", "자녀 없는 가입자 추가 보험료 (0.3%p 인상)", 1], ["16억", "유로", "디지털화 연방 지원"], ["2.7", "%", "행정비 정액 (3.0%에서 낮춤)"]], "table": [["나라", "핵심 숫자 (원문 확인분)"], ["한국", "보험료율 2027년 0.9994%(2026년 0.9448%), 인정자 125만 명(2026.3)"], ["독일", "자녀 없는 가입자 추가 보험료 0.9%(0.3%p 인상), 개편 2027년 시행"], ["중국", "통합 보험료율 약 0.3%, 가입 약 3억 명, 수혜 330만 명 이상"], ["미국", "재가·지역사회 돌봄 이용 840만 명, 지출 2,865억 달러(2024) / 워싱턴주 평생 36,500달러"], ["네덜란드", "장기요양 지출 299억 유로(2025), 1년 새 7.6% 증가"]], "src": "https://www.bundestag.de/presse/hib/kurzmeldungen-1230676 (확인) · Allianz 자료(추정)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 당 중앙판공청·국무원 · 국가의료보장국", "co": "중국 · China Daily·인민일보 영문판 · 2026-03-26 / 2026-01-09", "title": "전국 장기요양보험 체계 구축 지침", "q": "고용 여부와 상관없이 전 국민이 드는 장기요양보험을 사회보장의 '여섯 번째 기둥'으로 세운다.", "hl": ["여섯", "번째"], "pts": ["<b>시장 상황:<\/b> 도시·농촌이 같은 기금·같은 급여를 쓰고, 통합 보험료율 약 0.3%로 출발. 중증 장애인부터 차례로 넓힌다.", "<b>숫자:<\/b> 2016년 시범 이후 330만 명 이상이 혜택, 간병비 1,000억 위안 이상 줄고 민간자본 600억 위안 이상 들어왔다. 2026년 1월 기준 가입자 약 3억 명, 지정 기관 8,800개 이상, 간호 인력 약 30만 명.", "<b>반응(추정):<\/b> 3월 보도에는 가입자 약 3.1억 명, 지정 기관 12,000개, 서비스 36종(생활 20·의료 16)으로 1월 숫자와 다르게 나온다.", "<b>국내와 비교:<\/b> 한국 보험료율(2026년 0.9448%)보다 훨씬 낮게 시작한다. 보조기기 대여·돌봄 필요도 판정 산업이 커지는 해외 시장 신호."], "nums": [["3억", "명", "가입자 (2026.1)", 1], ["330만", "명+", "2016년 시범 이후 혜택"], ["8,800", "개+", "지정 기관 (2026.1)"], ["0.3", "%", "통합 보험료율 (약)"]], "src": "https://www.chinadaily.com.cn/a/202603/26/WS69c4a38ca310d6866eb40031.html · https://en.people.cn/n3/2026/0109/c90000-20412416.html", "grade": "확인"}, {"tm": "해외 · 미국", "name": "미국 재가·지역사회 돌봄(HCBS) 업계", "co": "미국 · Home Health Care News · 2026-11", "title": "정책 혼란과 인력난에 눌리는 재가 돌봄", "q": "집 돌봄을 넓히는 데 가장 큰 걸림돌은 돈보다 일할 사람이다.", "hl": ["일할", "사람이다."], "pts": ["<b>시장 상황:<\/b> 2025년 예산법(OBBBA)으로 저소득층 의료보장(Medicaid) 예산 1조 달러 삭감, 2026년 7월 법무부의 지역사회 거주 권리(올름스테드 판결) 집행 후퇴, 6월 아이티 출신 임시보호 신분 종료로 간병 인력 감소. 8월 상원의원이 재가 돌봄 접근법 발의.", "<b>숫자:<\/b> 재가·지역사회 돌봄 이용자 약 840만 명(Brandeis 4월 보고서), 2024년 지출 2,865억 달러(절반 이상이 Medicaid).", "<b>반응(추정):<\/b> Medicaid 지급액 80%를 직접 돌봄 인력 보수로 쓰게 하는 조항(2030년 7월 발효 예정)에 하원 공화당 의원 9명이 폐지 요구 서한(2026.2).", "<b>국내와 비교:<\/b> 한국도 재택임종 구상에서 방문요양의 야간·휴일 방문이 핵심인데, 재가 요양보호사를 구하는 문제가 같은 구조로 걸린다."], "nums": [["840만", "명", "재가·지역사회 돌봄 이용자"], ["2,865억", "달러", "재가·지역사회 돌봄 지출 (2024)", 1], ["1조", "달러", "Medicaid 예산 삭감 (2025년 법)"]], "src": "https://homehealthcarenews.com/2026/11/the-state-of-hcbs-in-2026-policy-upheaval-staffing-shortages-squeeze-providers/", "grade": "확인"}, {"tm": "해외 · 미국", "name": "워싱턴주 WA Cares Fund", "co": "미국 · 워싱턴주 공식 페이지 · 2026", "title": "미국 첫 공적 장기요양보험, 주 전역 급여 시작", "q": "평생 한도 안에서 쓰는 보충형 안전망이라 한국의 등급별 월 한도와 결이 다르다.", "hl": ["평생", "한도"], "pts": ["<b>제도:<\/b> 공식 페이지에 '주 전역 급여 이용 가능' 안내. 보험료 납부 요건과 돌봄 필요 요건을 함께 채워야 받는다.", "<b>숫자:<\/b> 2026년 전액 급여는 평생 합계 36,500달러(물가 연동).", "<b>반응(추정):<\/b> 급여 2026년 7월 시작·신청 5월 개시, 서비스 40종 이상, 첫해 수급 , "flow": [{"k": "병원에서 집으로", "d": "희망 67.5%와 실제 14.7%의 간격을 재택의료센터와 방문요양이 한 팀으로 메운다", "who": [3, 2, 4]}, {"k": "의료와 요양을 한 번에 판정", "d": "의료 필요도와 요양 필요도를 함께 보는 통합판정, 임종기 판정 과정 표준화", "who": [1, 4]}, {"k": "빠르면 내년 하반기 시범, 모형은 아직 미확정", "d": "재가 수급자부터 시작, 장기요양위원회에서 확정 예정", "who": [3, 4]}, {"k": "국내·해외 같은 방향: 돌봄 지출이 빠르게 커진다", "d": "마지막 3개월에 1년 급여비 42.4% / 독일 보험료 인상 / 네덜란드 7.6% 증가 / OECD 2050년 두 배", "who": [3, 5, 9, 10]}, {"k": "국내·해외 같은 방향: 집 돌봄의 걸림돌은 사람", "d": "재택의료팀과 돌봄 제공자 협업 검증, 가족 부담 / 미국 재가 인력난", "who": [4, 7]}, {"k": "해외는 보험 대상을 넓히는 중", "d": "중국 전 국민 장기요양보험, 미국 워싱턴주 첫 공적 장기요양보험", "who": [6, 8]}], "flowHeadline": "모두가 같은 곳을 가리켰다: 집에서의 마지막, 그리고 그 비용과 사람", "apply": [{"k": "재택의료센터·방문요양기관을 기관 영업 대상에 넣는다", "p": "우선", "d": "재택의료센터는 올해 8월 463곳에서 내년 500곳으로 늘고, 임종기 구상에서 방문요양기관은 야간·휴일에도 집을 찾는다. 집에서 돌봄을 받는 수급자를 가장 먼저 만나는 곳이므로, 복지용구 급여 품목(요실금팬티 등재품, 2027년 3월 급여 판매 예정인 고관절보호대) 안내 자료를 이 기관용으로 따로 만든다.", "r": "② 이혜진 · ③ 김세진", "who": "3본부 기관 영업"}, {"k": "통합판정·임종기 모형 확정을 장기요양위원회 안건으로 감시", "p": "우선", "d": "판정 방식이 바뀌면 등급별 복지용구 한도와 이용자 규모가 함께 바뀐다. 통합판정(2028년 도입 보도는 한 곳뿐)과 재택임종 시범 모형이 장기요양위원회에서 확정되는지 매달 안건을 확인하고, 복지용구 급여 영향 분석을 해당 본부에 넘긴다.", "r": "① 한은정 · ④ 토론", "who": "3본부 급여 등재"}, {"k": "'집에서 돌보는 가족'용 복지용구 이용 안내 만들기", "p": "우선", "d": "구상은 장기요양 급여를 처음 쓸 때 가족에게 사전돌봄계획을 안내하고, 가족 돌봄 부담 완화를 과제로 꼽았다. 처음 급여를 쓰는 가족이 묻는 '복지용구는 어떻게 빌리고 사나, 본인 부담은 얼마인가'를 한 장 안내와 사업소 상담 문답으로 정리한다. 의학 효능은 쓰지 않고 제도·사용법만 다룬다.", "r": "③ 김세진 · ④ 토론", "who": "3본부 복지용구 사업소"}, {"k": "장기요양 정보 영상 주제로 '인정신청부터 집 돌봄까지'", "p": "검토", "d": "인정자가 125만 명으로 늘었고 집에서의 임종을 바라는 사람이 67.5%다. 정보 유튜브 채널에 인정신청 절차, 재택의료센터 찾는 법, 집 돌봄 때 쓰는 급여 용품을 쉽게 푸는 편을 기획한다. 임종처럼 무거운 주제는 제도 설명 중심으로, 공식 자료 출처를 화면에 표시한다.", "r": "③ 김세진 · ② 이혜진", "who": "1본부 정보 채널"}, {"k": "사업소 상담에 '방문요양 야간·휴일 방문' 변화 반영", "p": "검토", "d": "시범사업이 시작되면 재가 수급자 집에 요양보호사가 하루 여러 번 드나들게 된다. 돌보는 사람이 바뀌어도 같은 방법으로 쓸 수 있도록 우리 급여 품목(요실금팬티 등재품 등)의 사용 안내 문구를 미리 준비하되, 시범 일정은 출처마다 달라 확정 뒤 쓴다.", "r": "③ 김세진 · ④ 토론", "who": "3본부 · 2본부 상세페이지"}, {"k": "중국 전국 장기요양보험을 해외 시장 신호로 지켜보기", "p": "유지", "d": "가
