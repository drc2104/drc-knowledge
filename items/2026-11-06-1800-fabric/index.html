<script id="item-data" type="application/json">{"id": "2026-11-06-1800-fabric", "date": "2026-11-06", "slot": "18:00", "topic": "원단·소재", "type": "시장 감시", "title": "11월 6일 원단·소재 동향", "subtitle": "국내 4 · 해외 4 · 소식 8개", "event": {"name": "원단·소재 시장 감시", "host": "인터넷·SNS·블로그·카페·쇼핑몰·펀딩·해외 자료", "when": "2026-11-06 조사 (최근 7일 소식 2건 · 나머지는 2025.12~2026.09 소식, 날짜 함께 표기)", "where": "한국·일본·중국·미국·유럽", "theme": "EU가 10월 10일부터 의류 섬유의 PFHxA를 25 ppb 이상 금지했다"}, "headline": "방수 팬티 원단은 이제 PFAS 없음을 시험서로 증명해야 한다", "hl": ["시험서로", "증명해야"], "summary3": [["PFAS 규제가 섬유로 번졌다.", "EU는 2026-10-10부터 의류 섬유의 PFHxA를 25 ppb 이상 금지했고, 2027-10-10에는 그 밖의 섬유로 넓힌다. 프랑스·덴마크와 미국 여러 주도 2026~2028년에 금지한다."], ["접촉 냉감이 속옷 쪽으로 내려온다.", "휴비스는 냉감 섬유 듀라론-쿨을 이너웨어로 넓히겠다고 했고, 효성 PIS 통합 파빌리온에는 국내 원단사 18개사가 모여 상담 약 730건을 했다. Thinx는 메시 원단 반바지형 생리팬티를 56달러에 내놨다."], ["근거 없는 '무독성' 문구는 지적받는다.", "한국소비자원은 팬티형 생리대 7종을 비교해 3개 제품의 'Toxic free' 같은 근거 없는 문구에 권고했고 모두 삭제됐다. 시험서가 있는 말만 써야 한다."]], "cases": [["업체·제품", "가격 · 1장당"], ["Thinx Butterfly Shorts (다회용 생리팬티, 미국)", "56달러 · 1장 56달러"], ["리버티 일회용 팬티형 생리대 (소비자원 비교 최저)", "개당 580원"], ["쏘피 일회용 팬티형 생리대 (소비자원 비교 최고)", "개당 1,160원"]], "shift": {"from": "15만 m", "to": "40만 m", "cap": "데이진 복합 쾌적 원단 판매 목표 2027년 → 2029년까지 (업체 목표)"}, "chart": {"t": "섬유 PFAS 허용 상한 (ppb, 낮을수록 엄격)", "u": "ppb", "rows": [["EU PFHxA 및 염", 25, "a"], ["프랑스 표적 PFAS", 25, "a"], ["프랑스 PFAS 합계", 250, "b"], ["EU PFHxA 관련 물질", 1000, "c"]]}, "keynums": [["25", "ppb", "EU 의류 섬유 PFHxA 금지 기준 (2026-10-10부터)", 1], ["56", "달러", "Thinx 반바지형 생리팬티 가격"], ["730", "건", "효성 PIS 통합 파빌리온 상담(약)"], ["3", "개 제품", "'Toxic free' 등 문구 삭제 권고 (소비자원)", 1]], "overviewNote": "첫 회차입니다. 검색 도구 한계로 최근 7일 안 소식은 2건(10/6 Thinx, 10/7 EU 규제)뿐이고, 나머지는 날짜를 밝힌 그 이전 소식입니다. 블로그·카페·쇼핑몰 후기와 중국 업체 직접 소식은 이번 회차에 조회하지 못해 '고객 반응'은 비어 있습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 10.07", "name": "EU (유럽연합)", "co": "유럽·미국 · 법무법인 뉴스 알림", "title": "EU, 의류 섬유 PFHxA 제한 시행 — 프랑스·덴마크·미국 주법도 잇따라", "q": "2026년 10월 10일부터 의류용 섬유에 PFHxA를 25 ppb 이상 넣으면 EU에서 팔 수 없다.", "hl": ["25", "ppb"], "pts": ["<b>무엇이 새로운가:<\/b> 규정 (EU) 2024/2462 시행. 2026-10-10부터 의류·액세서리용 섬유·가죽·모피와 일반 소비자용 신발에 PFHxA(PFAS의 한 종류)를 제한한다. 2027-10-10부터는 그 밖의 섬유로 넓힌다. 시행일 전에 시장에 나온 제품은 제외.", "<b>숫자:<\/b> PFHxA 및 염 25 ppb 이상, PFHxA 관련 물질 1,000 ppb 이상 금지. EU 전체 PFAS 제한은 2027년 말~2028년 채택 예상.", "<b>다른 나라:<\/b> 프랑스 2026-01-01부터 소비자용 의류·신발 PFAS 금지, 덴마크 2026-07-01부터 총 불소 50 mg F/kg 이상 의류 수입·판매 금지, 미국은 주마다 2026~2028년 금지(아래 표).", "<b>속옷 포함 여부:<\/b> 기사에 속옷·방수 막 언급은 없어, '의류'에 속옷이 들어가는지는 규정 원문 확인이 필요하다(추정).", "<b>마케팅 · 고객 반응:<\/b> 해당 없음 / 수집 못함.", "<b>우리에게:<\/b> 해외 판매를 생각하면 방수층·발수 가공 원단의 'PFAS 불검출' 시험서가 필요하다. 총불소·PFHxA 시험 대상."], "nums": [["25", "ppb", "PFHxA 및 염 상한", 1], ["1,000", "ppb", "PFHxA 관련 물질 상한"], ["50", "mg F/kg", "덴마크 총 불소 상한"]], "table": [["나라·주", "시행일 · 기준"], ["EU", "2026-10-10 의류 섬유 → 2027-10-10 그 밖의 섬유"], ["프랑스", "2026-01-01 · 표적 PFAS 25 ppb, 합계 250 ppb, 폴리머 포함 50 ppm"], ["덴마크", "2026-07-01 · 총 불소 50 mg F/kg (기존 재고는 2027-01-01까지 판매)"], ["미국 메인·버몬트", "2026-01-01 금지"], ["미국 워싱턴·캘리포니아·로드아일랜드", "2027-01-01 (캘리포니아 총유기불소 100→50 ppm)"], ["미국 코네티컷·콜로라도", "2028-01-01"], ["미국 뉴욕", "준비 중 (늦어도 2027-01-01)"]], "src": "Beveridge & Diamond 뉴스 알림 (2026-10-07)", "grade": "확인"}, {"tm": "중 · 10.06", "name": "Thinx (모회사 Kimberly-Clark)", "co": "미국 · 보도자료 · Thinx.com 판매", "title": "겉옷처럼 입는 반바지형 생리팬티 'Butterfly Shorts' 출시", "q": "생리팬티가 속옷을 넘어 겉옷처럼 입는 반바지로 나왔다.", "hl": ["겉옷처럼"], "pts": ["<b>무엇이 새로운가:<\/b> 운동복처럼 겉에 입는 모양의 반바지형 생리팬티. Coolcore 통기성 메시 원단, 밤새 쓰는 흡수 부위(gusset), 사이즈 XS~4X.", "<b>숫자:<\/b> 가격 56달러. '최대 12시간 새지 않음'은 업체 주장. 탐폰 환산·ml 흡수량은 밝히지 않았다.", "<b>마케팅:<\/b> \"옷과 생리용품의 경계를 흐리는 새 범주\"라는 문구. 브랜드는 '다회용 생리팬티 판매 1위'라고 하지만 업체 주장이고 독립 검증은 없다.", "<b>고객 반응:<\/b> 수집 못함.", "<b>우리에게:<\/b> '속옷이 아니라 겉옷 겸용' 제품군이 생겼다. 메시 원단·겉옷형 디자인을 제품 기획에서 검토할 만하다."], "nums": [["56", "달러", "1장 가격", 1], ["12", "시간", "새지 않는 시간 (업체 주장)"]], "video": {"title": "Washable Period Underwear Explained | Absorbency, Layers & Materials", "url": "https://www.youtube.com/watch?v=Ybo1zniLt4k"}, "src": "PR Newswire 보도자료 (Finviz 게재, 2026-10-06)", "grade": "확인"}, {"tm": "중 · 12.30", "name": "데이진프론티어 (Teijin)", "co": "일본 · 섬유 전문지 기사 (2025-12-30, 개발 소식)", "title": "발수 실과 흡수 실을 섞은 복합 쾌적 원단 개발", "q": "안쪽에 발수 실과 흡수 실을 섞어 땀을 바깥으로 보내고 피부로 되돌리지 않는다.", "hl": ["발수", "흡수"], "pts": ["<b>무엇이 새로운가:<\/b> 심과 껍질이 다른 복합사와 꼬아 부풀린 신축사를 쓰고, 광택을 죽인 가공(full-dull). 안쪽 층은 발수성 폴리에스터사와 흡수성 폴리에스터사를 섞었다.", "<b>기능:<\/b> 땀을 바깥으로 옮기고 피부로 되돌리지 않음. 이산화티타늄을 많이 넣어 열·자외선 차단, 비침·땀자국이 적고, PFAS를 쓰지 않는다.", "<b>숫자:<\/b> 판매 목표 2027년 15만 m, 2029년까지 40만 m. 출시 2027년 봄·여름. 무게(g/㎡)·흡수율·건조 시간·혼용률은 기사에 없다.", "<b>용도:<\/b> 스포츠·아웃도어용. 속옷 언급은 기사에 없다.", "<b>참고(추정):<\/b> 데이진프론티어와 아사히카세이어드밴스가 2026-10-01 통합했다는 언급이 검색 요약에 있었으나 원문은 확인하지 못했다.", "<b>우리에게:<\/b> '발수 실+흡수 실을 섞은 안쪽 층' 구조는 팬티 흡수층 설계에 참고할 만하다."], "bars": {"t": "복합 쾌적 원단 판매 목표 (만 m, 업체 목표)", "u": "만 m", "rows": [["2027년", 15, "b"], ["2029년까지", 40, "a"]]}, "src": "TEXtalks 기사 (2025-12-30)", "grade": "확인"}, {"tm": "중 · 09.04", "name": "효성티앤씨", "co": "한국 · 전시회(PIS 2026, 코엑스 08.19~21) · 잡지 기사", "title": "국내 원단사 18곳과 통합 파빌리온, 울마크와 원단 공동 개발 약속", "q": "냉감·바이오 스판덱스 원사를 국내 원단사와 묶어 한자리에서 선보였다.", "hl": ["냉감·바이오"], "pts": ["<b>무엇이 새로운가:<\/b> 프리뷰 인 서울(PIS) 2026에서 국내 원단사와 통합 파빌리온 운영. 울마크와 리커버리 웨어(회복용 옷) 원단 공동 개발 MOU.", "<b>소재:<\/b> regen BIO Spandex(식물 유래 스판덱스), CREORA Conadu(면 감촉 스트레치 폴리에스터), CREORA EasyFlex, CREORA Coolwave(초냉감 나일론), CREORA Luchera(광택 나일론).", "<b>숫자:<\/b> 원단사 18개사, 파빌리온 576㎡, 상담 약 730건. 혼용률·무게 수치는 기사에 없다.", "<b>마케팅:<\/b> 키워드는 친환경·편안함·냉감·고급. 업체 홍보 성격의 기사.", "<b>우리에게:<\/b> 효성 원사로 만든 냉감·바이오 스판덱스 원단을 국내 원단사에 샘플로 요청해 시험해 볼 수 있다."], "nums": [["18", "개사", "참여 국내 원단사"], ["576", "㎡", "통합 파빌리온 면적"], ["730", "건", "비즈니스 상담 (약)", 1]], "src": "보그 코리아 (2026-09-04)", "grade": "확인"}, {"tm": "중 · 07.28", "name": "휴비스", "co": "한국 · 경제 신문 (보도자료 기반)", "title": "냉감 섬유 '듀라론-쿨' 의류 공략, 이너웨어로 확대 예고", "q": "닿으면 시원한 폴리에틸렌 섬유를 스포츠웨어·작업복·이너웨어로 넓히겠다고 했다.", "hl": ["이너웨어로"], "pts": ["<b>무엇이 새로운가:<\/b> 주원료 폴리에틸렌(PE). 닿는 순간 시원한 접촉 냉감, 땀을 빨아들여 빨리 마르는 기능 유지. 강도는 \"폴리에스터와 비슷한 수준\"(수치 없음).", "<b>적용:<\/b> 2026년 여름 무신사 스탠다드·엄브로 티셔츠, 내셔널지오그래픽 신발·가방. 앞으로 스포츠웨어·작업복·이너웨어로 넓힐 계획.", "<b>숫자:<\/b> 2022년 국내 최초 의류용 냉감 PE 개발. 가격·냉감 수치(Q-max)·혼용률은 기사에 없다.", "<b>고객 반응:<\/b> 수집 못함.", "<b>우리에게:<\/b> 이너웨어 적용 제품이 실제로 나오는지 다음 회차에 이어서 본다. 여름용 냉감 팬티 차별화 후보."], "nums": [["2022", "년", "국내 최초 의류용 냉감 PE 개발"]], "src": "파이낸셜뉴스 (2026-07-28)", "grade": "확인"}, {"tm": "중 · 06.14", "name": "소프엔티", "co": "한국 · 스타트업 전문 매체", "title": "PFAS를 쓰지 않는 나노 멤브레인, 일본 화학사와 공동 개발", "q": "PFAS 없이 물을 막고 숨을 쉬게 하는 국산 얇은 막이 산업용으로 나온다.", "hl": ["PFAS", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> 일본 5대 화학사 중 한 곳(이름 비공개)과 PFAS 대체 산업용 맞춤 소재를 개발, 샘플 성능 검증을 통과했고 연내 해외 공급 계획.", "<b>제품:<\/b> 회사 소개 문구에 나노 멤브레인 '비블로텍(viblotec)'이 있다.", "<b>근거 수준:<\/b> 기사 근거가 \"관련 업계에 따르면\"이라 업체 전언이다. 제목·날짜·요약만 확인했고 기사 전문은 보지 못했다.", "<b>숫자 · 고객 반응:<\/b> 공개 수치 없음 / 해당 없음.", "<b>우리에게:<\/b> 국산 PFAS-free 방수·통기 막의 후보로 적용 가능성을 물어볼 만하다. 다만 지금은 생리팬티용 제품이 아니다."], "src": "유니콘팩토리 (2026-06-14, 기업 프로필 페이지)", "grade": "추정"}, {"tm": "하 · 07.21", "name": "한국소비자원", "co": "한국 · 정부 기관 발표 · 일간지 보도", "title": "일회용 팬티형 생리대 7종 비교 — 'Toxic free' 문구 3개 제품 삭제", "q": "근거 없이 '무독성'을 내세운 문구는 권고를 받고 지워졌다.", "hl": ["근거", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> 일회용 팬티형 생리대 7종 비교. 내츄럴코튼·리버티·라엘 3개 제품이 'Toxic free' 등 근거 없는 문구를 표시해 권고를 받고 삭제했다.", "<b>숫자:<\/b> 개당 가격 리버티 580원(최저)·쏘피 1,160원(최고). 라엘 오버나이트는 흡수 시간 20초 이상(가장 김), 좋은느낌은 역류량이 가장 적음. 휘발성 유기화합물(VOCs) 10종은 전 제품 불검출.", "<b>시험 방식:<\/b> 20~40대 여성 110명이 직접 입어 보고 평가.", "<b>마케팅:<\/b> '무독성'처럼 단정하는 문구는 시험서가 없으면 지적 대상이 된다.", "<b>우리에게:<\/b> 상세페이지·광고 문구는 시험서가 있는 표현만 쓴다. 일회용 제품이라 다회용 팬티와 가격을 바로 비교할 수는 없다."], "bars": {"t": "일회용 팬티형 생리대 개당 가격 (원, 소비자원 비교 7종 중 최저·최고)", "u": "원", "rows": [["리버티 (최저)", 580, "a"], ["쏘피 (최고)", 1160, "c"]]}, "nums": [["7", "종", "비교 제품"], ["3", "개 제품", "근거 없는 문구 삭제", 1], ["110", "명", "착용 평가 참가자"], ["10", "종", "VOCs 전 제품 불검출"]], "src": "한국소비자원 발표 2026-07-21 · 세계일보 보도", "grade": "확인"}, {"tm": "하 · 03.17", "name": "렌징 (Lenzing)", "co": "오스트리아·중국 · 보도자료 · 섬유 전문지", "title": "TENCEL 라이오셀 HV100, 중국 시장 소개", "q": "나무 펄프 섬유 텐셀이 데님에서 치노·셔츠로 넓어진다.", "hl": ["텐셀이"], "pts":
