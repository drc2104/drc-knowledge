)"]], "overviewNote": "숫자 출처: 기사·행사 페이지·보도자료. 업체 주장은 그대로 표시했습니다. 11월 3~10일 안에 날짜가 확인된 제품 소식은 일본 364브라와 시스티 행사 2건뿐입니다. 검색으로 2026년 11월 신제품을 거의 찾지 못했고, 한국 기사 다수는 페이지 날짜가 실제 발행일과 어긋나 제외했습니다. 그래서 날짜를 밝힌 지난 소식 2건(momoful, 에블린)을 함께 넣었습니다. 이번 회차는 고객 후기 원문과 미국·유럽 새 소식, 원단 묶음 새 소식을 찾지 못했습니다. 다음 회차 과제: 시스티 가격·혼용률, 와디즈·쿠팡 직접 열람, 원단 묶음 별도 조사.", "sectionLabel": "소식", "sections": [{"tm": "중 · 10.27", "name": "与辉同行 (중국 라이브커머스 채널)", "co": "중국 · 21경제망 기사 (10.14 판매, 10.27 보도)", "title": "라이브 채널이 공동 기획한 생리대, 첫 판매 30만 건 완판 보도", "q": "인기 라이브 채널이 직접 기획한 상품을 첫 판매에 몰아 팔았다.", "hl": ["첫", "판매에"], "pts": ["<b>무엇이 새로운가:<\/b> 라이브 방송 채널이 일회용 생리대를 공동 기획해 올렸고, 기사는 첫 출시 30만 건이 모두 매진됐다고 적었다. 제품 구조와 가격은 기사에 없다.", "<b>숫자:<\/b> 첫 판매 30만 건 완판(보도 인용, 업체 주장 성격). 가격과 흡수량은 기사에 없다.", "<b>마케팅:<\/b> 인기 라이브 채널이 상품 기획에 직접 참여하고, 첫 판매에 수요를 몰아주는 방식이다.", "<b>고객 반응:<\/b> 후기 원문을 찾지 못해 확인하지 못했다.", "<b>속옷과의 관계:<\/b> 이 기사와 같은 매체의 11월 4일 기사 모두 속옷·월경팬티 언급이 없다. 일회용 생리대 사례로만 봐야 한다.", "<b>우리에게:<\/b> '방송 채널과 공동 기획한 한정 첫 판매' 방식은 다회용 제품 판매 구성에 참고할 수 있다. 다만 기사 한 건뿐이라 판매 건수를 단정하지 않는다."], "nums": [["30만", "건", "첫 판매 완판 (보도 인용, 업체 주장 성격)", 1]], "src": "21경제망(투자계 인용) 기사 본문 직접 열람", "grade": "확인"}, {"tm": "중 · 11.02", "name": "시스티 (SISTIE)", "co": "한국 · 29CM 브랜드 이벤트 페이지", "title": "가을·겨울 새 색상 '에스프레소' 와이어 없는 속옷, 29CM 소개와 최대 33% 행사", "q": "속옷의 무게를 뺀다는 말과 체형 데이터 숫자를 함께 앞세웠다.", "hl": ["무게를", "체형"], "pts": ["<b>무엇이 새로운가:<\/b> 가을·겨울 새 색상 '에스프레소'를 냈다. 풀라 브라렛(와이어·후크·두꺼운 패드 없음, 숏·기본 두 기장), 풀라 슬립(내장 패드가 브라 역할), 풀라 슬립 롱(압박 없는 심리스 홈웨어), 풀라 서포트핏 브라렛 2(와이어 없이 서포트 라인, 뒷밴드 한 겹, 몰드 설계), 풀라 나시탑(캡 내장)이다.", "<b>숫자:<\/b> 행사 기간 11월 2~8일, 최대 33% 할인. 쿠폰 혜택은 문구만 있고 세부 내용이 없다. 나시탑 설명에 '17만 한국 여성 체형 데이터로 설계'라는 문구가 있다(업체 주장). 가격과 혼용률은 페이지에 없고, 자사몰은 열리지 않아 확인하지 못했다.", "<b>마케팅:<\/b> 슬로건은 \"0g의 감각\", 메인 문구는 \"당신의 하루에서 속옷의 무게를 뺍니다.\", \"처음부터 우리 몸에 맞게 시스티\". 체형 데이터 숫자를 앞세운다.", "<b>고객 반응:<\/b> 확인하지 못했다.", "<b>우리에게:<\/b> '압박 없음' 메시지와 체형 데이터 숫자를 함께 쓰는 방식은 요실금팬티와 시니어층 노와이어 브라 문구에 참고할 만하다."], "nums": [["33", "%", "최대 할인 (페이지 표기 '~33%')", 1], ["17만", "명분", "나시탑 설계에 쓴 한국 여성 체
