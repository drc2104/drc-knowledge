ns": [{"tm": "온몸", "name": "온몸 버틸 힘 (노쇠)", "co": "70~84세 노쇠 7.9% · 노쇠전단계 47.0% (기준 시점, 연령·성 표준화, 2,907명)", "title": "노쇠는 나빠지기도, 좋아지기도 한다", "q": "같은 어르신을 8년 따라가 보니 절반은 그대로, 셋 중 하나는 나빠지고, 여섯 중 하나는 좋아졌다.", "hl": ["좋아졌다."], "pts": ["<b>무엇이 바뀌나:<\/b> 나이 들며 몸의 예비력이 줄어 작은 스트레스에도 기능이 크게 떨어지는 상태가 노쇠다. 낙상·장애·입원·사망 위험을 높인다.", "<b>판정 기준:<\/b> 의도치 않은 체중 감소·탈진·낮은 활동·느린 걸음·약한 근력 5가지 중 3개 이상이면 노쇠, 1~2개면 노쇠전단계, 0개면 건강.", "<b>얼마나 흔한가:<\/b> 기준 시점 노쇠 7.9%(95% 신뢰구간 6.8~8.9), 노쇠전단계 47.0%(45.1~48.8). 나이 들수록 늘어난다.", "<b>8년 변화(2016 → 2024):<\/b> 새로 노쇠가 된 사람 11.8%, 노쇠 유병률 8.8% → 14.1%. 50% 같은 상태, 33% 악화, 17% 호전. 노쇠전단계는 노쇠로 가는 것보다 건강으로 돌아오는 경우가 상대적으로 더 흔했다.", "<b>함께 나타난 요인:<\/b> 영양 위험, 근감소증, 이동 제한, 우울 증상, 여러 약을 함께 먹는 것(다약제), 낮은 사회적 자본, 낮은 신체 수행.", "<b>필요한 제품:<\/b> 노쇠전단계(조사 대상의 절반 가까이)는 예방 단계라 운동·영양 정보와 일상 보조용품의 큰 대상층이다.", "<b>급여 복지용구:<\/b> 노쇠 자체는 품목이 아니다. 장기요양 인정을 받은 뒤 필요한 용품을 급여로 쓰는 구조다.", "<b>우리 회사:<\/b> 직접 제품은 없다. 다만 노쇠가 낙상·이동 장애로 이어지는 흐름은 고관절보호대·요실금팬티 고객층과 겹친다."], "bars": {"t": "8년 사이 노쇠 상태 변화 (%, 2016 기준 vs 2024 추적)", "u": "%", "rows": [["같은 상태", 50, "c"], ["나빠짐", 33, "b"], ["좋아짐", 17, "a"]]}, "nums": [["7.9", "%", "노쇠(기준 시점, 표준화)"], ["47.0", "%", "노쇠전단계", 1], ["11.8", "%", "8년 사이 새로 노쇠가 된 사람"]], "shift": {"from": "8.8%", "to": "14.1%", "cap": "노쇠 유병률 2016 → 2024 (8년 비교, 내부 보고서 인용)"}, "video": {"title": "의학적으로 누가 노인일까요? - 노화, 노쇠, 노인의 개념과 사회적 의미 (서울아산병원 노년내과 정희원)", "url": "https://www.youtube.com/watch?v=141f6lZ56zg"}, "src": "PHWR 2026;19(Suppl 41) 장1·장4 (8년 비교는 참고문헌 7번 내부 보고서 — 기준 시점 노쇠율이 7.9%와 8.8%로 다르고 원문이 이유를 설명하지 않음)", "grade": "확인"}, {"tm": "근육", "name": "근육 (근감소증)", "co": "근감소증 17.5% (아시아 기준 AWGS 2019, 2,028명)", "title": "종아리 둘레로 근육 부족을 거른다", "q": "노쇠와 근감소증이 함께 있으면 하나만 있을 때보다 반복 낙상과 낙상 골절이 더 많았다.", "hl": ["낙상", "골절이"], "pts": ["<b>무엇이 바뀌나:<\/b> 나이 들며 근육량·근력·움직이는 기능이 함께 줄어든다(근감소증).", "<b>얼마나 흔한가:<\/b> 17.5%(아시아 근감소증 기준 AWGS 2019, 2,028명).", "<b>낙상과의 관계:<\/b> 노쇠와 근감소증이 함께 있으면 둘 중 하나만 있을 때보다 반복 낙상·낙상 골절이 더 많았다(원문에 수치 없음).", "<b>쉬운 선별:<\/b> 근육량이 낮은 사람을 거르는 종아리 둘레 기준은 남성 35cm, 여성 33cm. 한국어판 SARC-F(5문항 설문)의 타당도를 검증했고, 5회 의자 일어서기를 근력·수행의 보조 지표로 제안했다.", "<b>더 나아간 연구:<\/b> 근감소성 비만, 혈액 지표(FGF21), 기계학습 예측 모델도 연구했다.", "<b>필요한 제품:<\/b> 일어서기·걷기를 돕는 보조용품, 단백질 영양 제품. 급여 복지용구 중에는 보행 보조 쪽 품목이 닿는다(세부 기준은 공단 고시 확인).", "<b>우리 회사:<\/b> 근육 자체를 위한 제품은 빈자리. 근감소증이 낙상 골절로 이어지는 흐름에서 고관절보호대가 '넘어졌을 때를 대비하는' 자리다(효능 단정 아님)."], "bars": {"t": "근육량 낮음을 거르는 종아리 둘레 기준 (cm, KFACS)", "u": "cm", "rows": [["남성", 35, "a"], ["여성", 33, "b"]]}, "nums": [["17.5", "%", "근감소증 유병률", 1], ["5", "회", "의자 일어서기 — 근력 보조 지표"], ["5", "문항", "SARC-F 근감소증 설문"]], "video": {"title": "노년기 근감소증 관리ㅣ동아아산건강강좌", "url": "https://www.youtube.com/watch?v=nlsiOB8Ed3c"}, "src": "PHWR 장5 (참고문헌 11~19번). KBS 보도 영상은 종아리 '32cm 미만'으로 기준이 달라 숫자를 섞지 않음", "grade": "확인"}, {"tm": "걷기·낙상", "name": "걷기·균형·낙상", "co": "노쇠전단계부터 이동 장애 위험 증가 · 낙상 결과 수치는 원문에 없음", "title": "의자에서 일어나는 힘이 나중 걸음을 말해 준다", "q": "의자 일어서기 수행이 낮으면 나중에 걸음이 느려지고 일상 기능에 제한이 생겼다.", "hl": ["의자", "일어서기"], "pts": ["<b>무엇이 바뀌나:<\/b> 걸음이 느려지고 균형이 떨어지며, 2년 뒤 새로운 이동 장애·도구 쓰는 일상활동(장보기·약 챙기기 같은 일) 장애로 이어진다. 노쇠전단계도 이동 장애 위험이 늘었다(수치 없음).", "<b>검사:<\/b> SPPB(균형·4m 걷기·의자 일어서기 점수), TUG(의자에서 일어나 3m 갔다 와서 앉는 시간)는 노쇠·낮은 신체 수행을 거르는 데 쓸모 있었다.", "<b>낙상:<\/b> 설문과 검사에 낙상을 재지만, 이번 리뷰에는 낙상 발생률 숫자가 없다. 노쇠+근감소증에서 반복 낙상·골절이 더 많다는 방향만 나온다.", "<b>생활 불편:<\/b> 화장실·욕실·현관 턱처럼 일어서고 방향을 트는 순간이 불안해진다(일반 설명).", "<b>필요한 제품:<\/b> 넘어지지 않게 하는 쪽(안전손잡이·미끄럼 방지 용품·보행 보조), 넘어졌을 때를 대비하는 쪽(고관절보호대).", "<b>급여 복지용구:<\/b> 안전손잡이·미끄럼 방지 용품은 장기요양 복지용구 품목이다(세부 기준은 공단 고시 확인).", "<b>우리 회사:<\/b> 보유 — 고관절보호대(복지용구 급여 등재 합격, 2027년 3월 급여 판매 예정). 예방 쪽 용품은 빈자리."], "nums": [["3", "m", "TUG 왕복 거리"], ["4", "m", "SPPB 걷기 구간"], ["2", "년", "노쇠 → 새 이동 장애가 확인된 기간", 1]], "video": {"title": "노인에게 낙상이 일어난다면... 매우 큰 문제가 생길 수 있습니다 | 서울아산병원", "url": "https://www.youtube.com/watch?v=D8iKKMHZiIc"}, "src": "PHWR 장3·장5·장6", "grade": "확인"}, {"tm": "뇌·마음", "name": "뇌·마음 (인지·우울·수면)", "co": "인지(MMSE-KC)·우울·수면(PSQI)을 함께 측정 · 결과 숫자는 원문에 없음", "title": "느린 걸음과 기억력 저하가 같이 간다", "q": "걸음이 느린 어르신은 인지 기능, 특히 계획·판단을 맡는 전두엽 기능 저하와 관련이 있었다.", "hl": ["느린", "전두엽"], "pts": ["<b>무엇이 바뀌나:<\/b> 느린 걸음은 인지 기능 저하(특히 전두엽 관련)와 관련이 있었다. 몸과 뇌가 따로 늙지 않는다는 뜻이다.", "<b>마음의 힘:<\/b> 심리적 회복탄력성이 높은 어르신은 2년간 인지 저하가 적었다.", "<b>우울:<\/b> 우울 증상은 노쇠와 함께 나타나는 요인으로 꼽혔다.", "<b>수면:<\/b> 수면의 질(PSQI)을 재지만 이번 리뷰에 결과 숫자는 없다.", "<b>새 측정:<\/b> 목소리(음향 특성)와 얼굴 영상을 노쇠·인지장애와 연결하는 연구를 시작했다. 일찍 알아채기 위한 디지털 자료다.", "<b>필요한 제품:<\/b> 기억·복약 알림, 집 안 안부 확인 센서 쪽(해외 소식 참고).", "<b>우리 회사:<\/b> 빈자리 — 우리 제조 영역(의료기기·속옷) 밖. 정보 채널 콘텐츠 주제로는 쓸 수 있다."], "video": {"title": "65세 이상 28%가 경도인지장애…매년 10~15%는 치매로 [건강하십니까] [9시 뉴스] / KBS 2025.11.01.", "url": "https://www.youtube.com/watch?v=tx2zwVvBMXU"}, "src": "PHWR 장3·장6·장7", "grade": "확인"}, {"tm": "입·영양", "name": "입·삼킴·영양 (구강노쇠)", "co": "구강노쇠 선별 12문항 · 영양 평가(MNA) · 영양 위험은 노쇠 관련 요인", "title": "입이 약해지면 몸 전체가 약해진다", "q": "구강노쇠가 신체 노쇠나 사망 위험과 어떻게 연결되는지 확인하려면 국가 노화 연구에 구강 기능 항목이 들어가야 한다.", "hl": ["구강", "기능"], "pts": ["<b>무엇이 바뀌나:<\/b> 씹기·삼키기·침 분비 같은 입 기능이 약해진다(구강노쇠). 삼키기가 어려워지면(연하장애) 음식이 기도로 넘어가 폐렴 위험이 생긴다.", "<b>측정:<\/b> KFACS는 검진에 구강노쇠 선별 12문항, 설문에 영양 평가(MNA)와 구강 건강을 넣었다. 결과 숫자는 이번 리뷰에 없다.", "<b>영양과 노쇠:<\/b> 영양 위험은 노쇠와 함께 나타나는 요인으로 꼽혔다.", "<b>학회 목소리:<\/b> 한국노년학회 2026 전기학술대회 기획세션에서 강정현 연세대 교수가 \"구강노쇠가 신체 노쇠나 사망 위험과 어떻게 연결되는지 확인하려면 국가 차원의 노화 연구에 구강 기능 항목이 포함돼야 한다\"고 했다.", "<b>필요한 제품:<\/b> 점도를 조절한 식사(연하식), 식사 보조 식기, 구강 관리 용품.", "<b>우리 회사:<\/b> 빈자리 — 우리 제조 영역 밖."], "nums": [["12", "문항", "구강노쇠 선별 검사"]], "video": {"title": "음식물을 씹고 삼키는 것이 어려운 질환, 연하 장애(삼킴 장애) | 서울대병원 오병모 교수 #건강톡톡 Ep.293", "url": "https://www.youtube.com/watch?v=9RmPmkwGix0"}, "src": "PHWR 장3·장4 · 브라보마이라이프 19364 (노년학회 기획세션, 2026.06.01 기사)", "grade": "확인"}, {"tm": "약·병원", "name": "약·병원 (다약제·의료 이용)", "co": "다약제는 노쇠 관련 요인 · 노쇠로 나빠지면 입원일·의료비 증가(금액 없음)", "title": "노쇠가 나빠지면 병원비가 는다", "q": "2년 사이 노쇠전단계에서 노쇠로 나빠진 어르신은 건강을 유지한 어르신보다 입원일과 의료비가 더 많았다.", "hl": ["입원일과", "의료비가"], "pts": ["<b>무엇이 바뀌나:<\/b> 병이 늘며 여러 약을 함께 먹게 된다(다약제). 다약제는 노쇠와 함께 나타나는 요인으로 꼽혔다.", "<b>의료비:<\/b> 건강보험 자료와 연결해 보니, 2년 사이 노쇠전단계 → 노쇠로 나빠진 사람은 건강을 유지한 사람보다 입원일·의료비가 더 많았다. 금액은 원문에 없다.", "<b>측정:<\/b> 질병·약·장기요양 이용·의료 이용·건강 정보 이해력(건강문해력)·삶의 질을 함께 조사한다.", "<b>생활 불편:<\/b> 약 종류가 많아지면 챙겨 먹기 어렵고 부작용·상호작용 걱정이 커진다(일반 설명).", "<b>필요한 제품:<\/b> 약 정리함·복약 알림 같은 보조용품.", "<b>우리 회사:<\/b> 빈자리. 다만 '노쇠를 늦추면 의료비도 준다'는 흐름은 예방 용품 설명의 배경 근거로 쓸 수 있다(금액 없이)."], "video": {"title": "부모님 약이 너무 많아요! - 노년기 다제약물, 환자와 가족이 알면 좋은 것들(서울아산병원 노년내과와 정희원, 약제팀 이미리내)", "url": "https://www.youtube.com/watch?v=t00XUZ-Vx-c"}, "src": "PHWR 장3·장4·장6", "grade": "확인"}, {"tm": "방광·소변", "name": "방광·소변 (요실금)", "co": "이번 리뷰에 결과 숫자 없음 · 노인 배뇨관리 3자 협약(2026.10.12)", "title": "재는 항목은 있는데 숫자는 아직 없다", "q": "노쇠 연구에서 요실금은 아직 결과 숫자가 공개되지 않은 빈칸이다.", "hl": ["빈칸이다."], "pts": ["<b>무엇이 바뀌나:<\/b> 나이 들며 소변이 새는 일(요실금)이 생길 수 있다. 외출·잠·사람 만나는 일에 불편을 준다(일반 설명).", "<b>이번 리뷰:<\/b> 요실금은 측정 항목으로만 언급되고 결과 숫자는 없다. 낙상·수면·우울·영양도 마찬가지다.", "<b>국내 움직임:<\/b> 한국노인복지중앙회·대한비뇨의학회·하이제라가 2026.10.12 노인 배뇨관리 협약을 맺었다(검색 요약만 확인, 조사 결과 숫자 없음).", "<b>해외 비교:<\/b> 영국은 NHS 트러스트 110곳 중 53%가 요실금 용품 개수를 제한해, 정부가 '필요량 평가'를 확인했다(해외 소식 참고).", "<b>필요한 제품:<\/b> 요실금팬티·패드 같은 흡수 용품.", "<b>급여 복지용구:<\/b> 우리 요실금팬티 중 복지용구 등재품이 있다.", "<b>우리 회사:<\/b> 보유 — 요실금팬티(샐리브), 복지용구 등재품. 노쇠 연구가 요실금 숫자를 내면 바로 근거로 쓸 수 있게 다음 논문을 지켜본다."], "video": {"title": "그대로 따라하는 요실금 예방운동! 비뇨의학과 전문의가 알려드려요 | 서울아산병원", "url": "https://www.youtube.com/watch?v=jPvVJvf_bX4"}, "src": "PHWR 장3(측정 항목) · 트윅24 2026.10.15 협약 기사(검색 요약만, 원문 미열람)", "grade": "추정"}, {"tm": "재는 법", "name": "몸을 재는 법 (10년 추적 설계)", "co": "70~84세 3,009명 · 연구센터 10곳 · 2년마다 추적", "title": "같은 어르신을 10년째 따라간다", "q": "노쇠는 변하는 상태라 같은 사람을 오래 따라가야 알 수 있다.", "hl": ["오래"], "pts": ["<b>누구를:<\/b> 지역에 사는 70~84세(치매 진단 없음·의사소통 가능·2년 안 이사 계획 없음). 노인복지관·보건소·아파트 단지·외래에서 모집. 나이 비율 70~74 : 75~79 : 80~84 = 6:5:4.", "<b>어디서:<\/b> 연구센터 10곳(서울 3·경기 2·강원·충북·전남·경남·제주 각 1), 도시·근교·농촌 포함.", "<b>몇 명:<\/b> 2016년 1,559명 + 2017년 1,455명 = 3,014명, 중복·탈퇴 5명 빼고 3,009명 추적. 2025년까지 누적 사망 500명(표 합산).", "<b>무엇을 재나:<\/b> 악력, SPPB, TUG, 무릎 근력, 키·몸무게·허리·팔뚝·종아리 둘레, 시력·청력, 체성분, 골밀도(2024 추가), 혈액·소변, 보행 영상, 목소리·얼굴 영상.", "<b>빠짐 막기:<\/b> 센터 방문이 안 되면 가정 방문, 그것도 안 되면 전화. 본인 응답이 어려우면 배우자·동거 가족 등 대리 응답을 받는다.", "<b>다음 10년:<\/b> 2026~2027년 약 800명을 새로 모집해 10년 간격 두 세대를 비교하고, 목소리·얼굴 영상으로 고위험자를 일찍 찾는 것이 목표.", "<b>결론(원문):<\/b> \"KFACS는 국내 노쇠 연구의 주요 연구 기반으로서, 지속적인 추적조사와 자료의 활용을 통해 노쇠 예방 및 노인의 건강과 기능 유지를 위한 근거 마련에 기여할 것으로 기대된다.\""], "bars": {"t": "해마다 추적 조사를 마친 비율 (%, 표 1)", "u": "%", "rows": [["2018", 92.5, "a"], ["2019", 94.8, "a"], ["2020", 87.5, "b"], ["2021", 77.6, "c"], ["2022", 75.9, "c"], ["2023", 79.5, "c"], ["2024", 71.5, "c"], ["2025", 74.7, "c"]]}, "nums": [["3,009", "명", "추적 중인 참여자", 1], ["10", "곳", "연구센터"], ["800", "명", "2026~27년 신규 모집 계획"], ["500", "명", "누적 사망(표 1 합산)"]], "video": {"title": "노년내과에서는 근감소증과 노쇠를 어떻게 진단 할까요? (서울아산병원 노년내과 정희원)", "url": "https://www.youtube.com/watch?v=tsKJM5QdxvA"}, "src": "PHWR 장2·장3·장7·장8 (표 1~4). 초록은 '10개 대학병원', 본문은 '연구센터 10곳'으로 표기", "grade": "확인"}, {"tm": "해외 · 일본", "name": "야노경제연구소 (矢野経済研究所)", "co": "일본 · 보도자료 · 2026.11.17", "title": "돌봄 기술·로봇 시장 2025년도 약 360억 엔", "q": "시설용 지켜보기 센서는 이미 퍼지고, 집에서 쓰는 쪽은 이제 시장이 생기는 단계다.", "hl": ["집에서"], "pts": ["<b>시장 상황:<\/b> 일본 국내 돌봄 기술(로봇) 시장을 2025년도 약 360억 엔으로 추정했다.", "<b>8개 분야:<\/b> 옮겨 앉기·이동·배설·지켜보기/소통·목욕·기능 훈련·치매·식사/영양.", "<b>숫자:<\/b> 보고서 234쪽, 2026.09.29 발간, 198,000엔(세금 포함). 2026년도 이후 전망은 그래프 그림이라 숫자를 읽지 못했다.", "<b>반응:<\/b> 시설용 지켜보기는 도입이 진행 중, 재택용은 '시장 형성의 초기 단계'.", "<b>국내와 비교:<\/b> 시설에서 먼저 크고 집은 나중이라는 순서가 국내 재택·복지용구 방향에 참고가 된다. 8개 분야 중 '배설'은 요실금 용품과 맞닿는다."], "nums": [["360억", "엔", "일본 돌봄 기술(로봇) 시장 2025년도 추정", 1], ["8", "개", "분야(배설 포함)"]], "src": "https://www.yano.co.jp/press-release/show/press_id/4214", "grade": "확인"}, {"tm": "해외 · 일본", "name": "링크웨어 (Linkware)", "co": "일본 · Makuake 크라우드펀딩 · 2026.09.29", "title": "카메라 없는 레이더 지켜보기 센서 「MiraWatch Home」", "q": "카메라를 달지 않고 집 안 어르신의 움직임과 잠을 살피는 센서를 펀딩으로 먼저 판다.", "hl": ["카메라를"], "pts": ["<b>제품:<\/b> 밀리파 레이더로 방에 있는지·자세·수면 변화를 본다. 지름 70mm·두께 28mm.", "<b>숫자:<\/b> 펀딩가 1대 39,902엔부터(6개월 구독 포함), 최대 32% 할인. 기간 2026.09.29~2027.01.19, 배송 2027년 2월 예정.", "<b>원문 불일치:<\/b> 제목은 일반 판매 예정가 58,680엔(세금 별도), 본문은 48,000엔(세금 별도·본체만).", "<b>반응:<\/b> 펀딩 모금 실적은 확인하지 못했다.", "<b>국내와 비교:<\/b> '카메라 없음'으로 사생활 거부감을 낮추고, 본체+구독을 묶어 파는 가격 구조가 참고가 된다."], "bars": {"t": "MiraWatch Home 가격 (엔)", "u": "엔", "rows": [["펀딩가(6개월 구독 포함)", 39902, "a"], ["본체만(본문 표기)", 48000, "b"], ["일반 판매 예정(제목 표기)", 58680, "c"]]}, "src": "https://prtimes.jp/main/html/rd/p/000000004.000181396.html", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 민정부 등 6개 부처", "co": "중국 · 베이징일보 계열 보도 · 서명 2026.11.04, 보도 11.06", "title": "노인 용품, 사는 것보다 빌리고 체험하게", "q": "노인 용품을 대여·체험 중심으로 팔고, 약국·편의점·온라인까지 판매 자리를 넓힌다.", "hl": ["대여·체험"], "pts": ["<b>시장 상황:<\/b> 민정부·국가발전개혁위원회·공업정보화부·상무부·시장감독총국·전국노령판공실이 「노인 용품 소비 촉진 조치」를 냈다.", "<b>제도:<\/b> 지역 양로센터에 체험·대여 매장, 약국·편의점에 전용 구역, 온라인 쇼핑몰에 실버 코너. '임대로 판매를 대신'하거나 '임대와 판매를 함께' 하도록 했다. 산업 표준과 인증제도 추진.", "<b>품목:<\/b> 보행 보조, 재활 보조기구, 배변 관리 로봇, 집 안 안전 기기.", "<b>숫자:<\/b> 금액·목표 수치는 발표에 없다. 실버 경제 규모(2025년 9만억 위안 등)는 매체마다 엇갈려 추정으로만 본다.", "<b>국내와 비교:<\/b> 구매보다 대여·체험이 중심이라 국내 복지용구 대여 방식과 닮았다. 중국은 일반 소비 채널까지 넓힌 점이 다르다."], "src": "https://news.bjd.com.cn/2026/11/06/12020231.shtml", "grade": "확인"}, {"tm": "해외 · 미국", "name": "세르나 헬스케어 (Cerna Healthcare)", "co": "미국 · Medical Economics · 2026.09.15", "title": "피부에 붙이는 낙상 감지 패치 「SafePatch」", "q": "시계·목걸이형을 싫어하는 어르신에게 붙이는 낙상 감지기를 낮은 값+월 구독으로 판다.", "hl": ["붙이는"], "pts": ["<b>제품:<\/b> 방수 부착형 낙상 감지 패치, 1회 충전 약 1주일, 전용 소프트웨어(FallSoft) 연동. 10월 배송 시작.", "<b>숫자:<\/b> 본체+교체 패치 6개월분 $99(한 번), 가족 모니터링 월 $9.99, 전문 모니터링 월 $29.99.", "<b>반응:<\/b> 임상 수치·외부 반응은 없고 대표의 자체 평가만 있다. 기사는 소비자용 기기는 대체로 메디케어 원격 환자 관찰 청구 대상 밖이라고 짚었다.", "<b>국내와 비교:<\/b> 넘어짐을 '막는' 고관절보호대와 넘어짐을 '알리는' 감지기는 역할이 다르다. 함께 쓰는 묶음 안내를 생각해 볼 수 있다."], "bars": {"t": "SafePatch 가격 ($, 본체는 한 번·모니터링은 월)", "u": "$", "rows": [["본체+패치 6개월분", 99, "a"], ["전문 모니터링 월", 29.99, "b"], ["가족 모니터링 월", 9.99, "c"]]}, "src": "https://www.medicaleconomics.com/view/new-wearable-skin-patch-aims-to-detect-falls-and-alert-families-in-real-time", "grade": "확인"}, {"tm": "해외 · 영국", "name": "영국 보건사회복지부·NHS", "co": "영국 · National Health Executive · 2026.07.22", "title": "요실금 용품 개수 제한을 없애라", "q": "예산이 아니라 필요에 따라 요실금 용품을 줘야 한다고 정부가 확인했다.", "hl": ["필요에"], "pts": ["<b>시장 상황:<\/b> 시민 캠페인(End the Pad Gap)이 정보공개 청구로 NHS 트러스트(지역 병원 운영 기관)의 요실금 용품 지급 실태를 모았다.", "<b>숫자:<\/b> 110곳 중 53%가 용품 개수를 제한했고, 그중 34%는 하루 3개, 나머지는 하루 4개로 묶었다.", "<b>기준:<\/b> 영국 국립보건임상연구원(NICE)은 \"지급 개수를 제한하는 것은 적절하지 않다\"고 했고, 정부는 NICE·영국간호협회 기준으로 필요량을 평가해야 한다고 확인했다.", "<b>반응:<\/b> 대상자 수·비용은 기사에 없다.", "<b>국내와 비교:<\/b> 공공 지급제가 예산 때문에 소모품 개수를 묶는 문제다. 국내 복지용구 소모품 한도 논의에 참고가 된다."], "bars": {"t": "NHS 트러스트 110곳의 요실금 용품 개수 제한 (%)", "u": "%", "rows": [["개수 제한함", 53, "a"], ["제한한 곳 중 하루 3개", 34, "b"]]}, "src": "https://www.nationalhealthexecutive.com/articles/trusts-urged-end-continence-product-caps-ministers-say-care-must-be-based-need", "grade": "확인"}, {"tm": "해외 · EU", "name": "유럽연합 통계청 (Eurostat)", "co": "EU · Eunews 보도 · 2026.02.13 (6개월 넘은 배경 자료)", "title": "EU 65세 이상 22%, 중위연령 44.9세", "q": "유럽도 다섯 명 중 한 명 넘게 65세 이상이고, 2100년엔 32%를 넘는다.", "hl": ["32%를"], "pts": ["<b>시장 상황:<\/b> 2025.01.01 기준 EU 인구 4억 5,060만 명, 65세 이상 22%.", "<b>숫자:<\/b> 중위연령 44.9세(이탈리아 49.1세 최고, 아일랜드 39.6세 최저). 65세 이상 비중은 2100년 32% 초과 전망.", "<b>반응:<\/b> 배경 통계라 제품 반응은 해당 없음.", "<b>국내와 비교:<\/b> 한국 65세 이상은 2025년 20.3%, 2036년 30%, 2050년 40% 전망(통계청, KFACS 리뷰 인용). 지금은 비슷하지만 한국이 훨씬 빨리 늙는다."], "bars": {"t": "65세 이상 비중 (%, EU는 Eurostat · 한국은 통계청)", "u": "%", "rows": [["EU 2025", 22, "c"], ["한국 2025", 20.3, "c"], ["EU 2100", 32, "b"], ["한국 2050", 40, "a"]]}, "table": [["나라", "숫자 (원문 표기, 확인된 것만)"], ["일본", "돌봄 기술(로봇) 시장 2025년도 약 360억 엔 · MiraWatch Home 39,902엔부터(6개월 구독 포함)"], ["미국", "50세 이상 기술 지출 2025년 945억 달러($94.5 billion), 구매 비율 71%(2024년 67%), 1인 평균 $756 · SafePatch $99 + 월 $9.99~29.99"], ["영국", "NHS 트러스트 110곳 중 53%가 요실금 용품 개수 제한"], ["EU", "65세 이상 22%(2025), 2100년 32% 초과"], ["중국", "실버 경제 2025년 9만억 위안·2035년 30만억 위안 돌파(경제일보 인용) — 매체마다 엇갈려 추정"]], "src": "https://www.eunews.it/en/2026/02/13/europe-grows-older-as-median-age-reaches-45-one-retiree-for-every-three-workers/ (미국 숫자: AgeTech Collaborative 2026.01.15 블로그)", "grade": "확인"}], "flow": [{"k": "노쇠는 되돌릴 수 있다 — 일찍
