s": ["<b>검색이 AI 질문으로:<\/b> 소비자가 포털 검색 대신 AI에 묻는다. 콘텐츠는 사람 눈뿐 아니라 AI 눈에도 띄어야 한다.", "<b>만들기는 쉬워지고 눈에 띄기는 어려워졌다:<\/b> 소재를 많이 만드는 것 자체는 경쟁력이 아니다.", "<b>기준이 먼저:<\/b> 도구를 들이는 것이 AX가 아니다. 기준·KPI·목표를 먼저 세워야 한다. 예산이 움직이는 판단은 아직 사람이 한다.", "<b>역시뮬레이션:<\/b> 월 광고비 약 1억원 사례에서 사람이 소재를 바꿔야 한다고 본 경우의 80% 이상을 AI도 같게 판단했다. 잘될 소재 적중률은 사람의 약 3배, 매출 차이는 약 500만원으로 추산.", "<b>네이버 쇼핑라이브 AI 쇼호스트:<\/b> 연 500편가량(제작사·스튜디오 20여 곳)을 10배 이상으로 늘리려 AI를 검토. 제작 30일 → 3일, 비용 10분의 1 수준. 내년 쇼핑 콘텐츠 5000개 이상이 목표.", "<b>현대차:<\/b> 300페이지 디자인 가이드북을 AI에 반영해 500여 개 지사의 브랜드 표준을 맞췄다. 2024년부터 일본 진출."], "nums": [["80", "%+", "사람이 소재 교체를 판단한 경우 중 AI도 같게 본 비율"], ["3", "배", "잘될 소재 적중률(사람 대비)", 1], ["500", "만원", "역시뮬레이션 매출 차이 추산"], ["5000", "개+", "네이버 내년 쇼핑 콘텐츠 목표"]], "bars": null, "shift": {"from": "30일", "to": "3일", "cap": "네이버 쇼핑라이브 AI 쇼호스트 방송 제작 기간 (비용은 10분의 1 수준)"}, "table": null, "src": "블로터 현장 기사 (11/11)", "grade": "확인"}, {"tm": "11:00", "name": "이희숙", "co": "버블쉐어 CCO", "title": "AI는 우리 제품을 추천하고 있을까?", "q": "AI 노출을 브랜딩 지표로만 보기보다는 매출 채널로 함께 봐야 한다.", "hl": ["매출", "채널로"], "pts": ["<b>에이전틱 커머스가 국내에서도 시작:<\/b> AI가 상품을 비교해 판매처로 연결한다. 챗GPT는 아모레몰 앱과 연동해 상품 카드를 보여 준다.", "<b>엔진마다 챙길 판매 채널이 다르다:<\/b> 구글 AI 모드는 국내 커머스, 챗GPT는 브랜드 자사몰, 네이버 AI 탭은 네이버 쇼핑으로 링크가 몰린다.", "<b>국내 상세페이지의 약점:<\/b> 효능·특징을 이미지 안에 넣어 AI가 읽기 어렵다. 설화수 자음생크림은 40대 탄력 질문에서 공식몰 정보가 추천 근거가 됐다.", "<b>AI가 읽는 경로 4가지:<\/b> 크롤링 · 인플랫폼 · 피드 · 제휴.", "<b>쿠팡·네이버도 노출된다:<\/b> 일부 AI 봇은 막지만 일반 검색엔진 수집은 허용해 그 정보가 AI 답변에 쓰일 수 있다. 구글 AI 모드에 노출된 쿠팡 링크 100건 중 60건이 상품 상세페이지.", "<b>가격 비교 답변:<\/b> 챗GPT의 판매처·가격 비교 답변 38%에 네이버 검색 링크, 네이버 AI 탭 답변 48%에 가격 비교표.", "<b>최적화 효과(자체, 기준값 비공개):<\/b> 상세페이지를 고친 뒤 AI에 새로 인용된 페이지 수 20%, 질문 수 133% 증가. 인용 시작까지 약 일주일."], "nums": [["70", "%", "쇼핑 관련 AI 답변 중 구체적 제품 추천", 1], ["60", "/100건", "구글 AI 모드 속 쿠팡 링크 중 상품 상세페이지"], ["133", "%", "최적화 뒤 AI 인용 질문 수 증가"], ["1", "주", "인용이 시작되기까지 걸린 시간(약)"]], "bars": {"t": "질문 유형별 AI가 제품을 구체적으로 추천한 비율 (스킨케어, %)", "u": "%", "rows": [["비교형 · 한국", 63, "b"], ["비교형 · 미국", 61, "c"], ["조건형 · 한국", 94, "a"], ["조건형 · 미국", 95, "c"]]
