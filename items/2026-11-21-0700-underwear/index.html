프 할인율 ('최대 50%'와 대비)", 1]], "overviewNote": "숫자 출처: 파이낸셜뉴스(디펜드 맨 가드·무신사), 무신사 뉴스룸, knix.com 행사 페이지 직접 열람(11.21), PR TIMES(momoful), RKB毎日放送·Yahoo!ニュース(PlayS), 머니투데이(와이렛). 업체 보도자료 숫자는 '업체 주장'으로 표시했습니다. 비너스 와이렛은 79일 전 [지난 소식]입니다. 이번 회차도 7일 안 새 제품 소식이 적었고, 중국은 속옷 직접 소식이 없었습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.20", "name": "유한킴벌리 (디펜드)", "co": "한국 · 파이낸셜뉴스·뉴스1·이데일리·더팩트 동시 보도", "title": "남성 요실금 '속옷 부착형' 디펜드 맨 가드 — 흡수량 70mL·450mL 두 단계", "q": "'패드' 대신 '가드'라는 새 이름으로 요실금 제품의 나이·성별 범위를 넓혔다.", "hl": ["가드", "범위를"], "pts": ["<b>무엇이 새로운가:<\/b> 속옷 안쪽에 붙여 쓰는 '가드' 형태, 3중 흡수층, 인체공학적 형태(회사 설명). 입는 형태인 '디펜드 맨 언더웨어'도 함께 판다. 출시일·판매처·가격은 기사에 없다.", "<b>숫자:<\/b> 흡수량 레벨1 70mL · 레벨2 450mL. 소취는 FITI시험연구원 시험 암모니아 기준 99%(업체 주장). 2024년 40~70대 남성 1,000명 조사에서 가벼운 요실금 경험 17%(40대 5%·50대 8%·60대 15%·70대 24%). 남성용 속옷 부착형 매출 최근 2년 18% 증가.", "<b>마케팅:<\/b> 기존 '라이너·패드' 대신 '가드'라는 새 말을 쓰고, 나이별 경험률 숫자를 앞세웠다(보도자료 중심).", "<b>고객 반응:<\/b> 발표 당일이라 후기가 없다.", "<b>우리에게:<\/b> 흡수량을 두 단계 숫자로 적는 방식과 '이름 바꾸기'는 우리 요실금팬티 사양표·상품명 설계에 참고할 만하다. 남성 시장은 따로 기획할 후보다. 소취 같은 숫자는 시험 기관·조건과 함께 적어야 근거가 된다."], "bars": {"t": "남성 가벼운 요실금 경험률 (2024년 40~70대 남성 1,000명 조사, 업체 발표, 단위 %)", "u": "%", "rows": [["40대", 5, "c"], ["50대", 8, "c"], ["60대", 15, "b"], ["70대", 24, "a"]]}, "nums": [["70", "mL", "레벨1 흡수량"], ["450", "mL", "레벨2 흡수량", 1], ["18", "%", "남성용 속옷 부착형 매출 최근 2년 증가", 1], ["99", "%", "소취율 (암모니아 기준, 업체 주장)"]], "shift": {"from": "70mL", "to": "450mL", "cap": "디펜드 맨 가드 흡수량 레벨1 → 레벨2"}, "src": "파이낸셜뉴스(11.20) 직접 열람 · 인사이트 검색 목록 · 이전 회차(11/7 디펜드 맨, 11/11 속기저귀)와 다른 새 제품", "grade": "확인"}, {"tm": "중 · 11.20", "name": "momoful (MOON-X Japan) × 핫요가 loIve", "co": "일본 · PR TIMES 보도자료 · 11.20", "title": "분비물 흡수 쇼츠 '프리라이너'를 요가·코어 운동과 묶은 공동 캠페인", "q": "제품을 바꾸지 않고 '운동할 때 새는 불안'을 조사 숫자로 먼저 보여 준 뒤 증정으로 잇는다.", "hl": ["새는", "불안"], "pts": ["<b>무엇이 새로운가:<\/b> 제품 변경이 아니라 운동·자세 코어 운동과 결합한 마케팅이다. 두 브랜드 공식 인스타그램에서 추첨 증정, 상세 공지는 11/25 예정.", "<b>숫자:<\/b> 18~49세 여성 500명 조사(업체) — 67.9%가 고민, 23.6%(130명)가 재채기·운동 때 누출 경험, 누출 경험자의 72.3%가 일상 행동에 영향. 흡수 을 합친 브라", "q": "노와이어와 와이어 사이를 메우는 '중간 지지 구조' 브라가 나왔다.", "hl": ["중간", "지지"], "pts": ["<b>무엇이 새로운가:<\/b> 브라렛 디자인에 천 속에 감춘 와이어(컨실드 와이어), '소프트 티타늄 와이어', 맞춤형 볼륨 설계. 가격·판매처·출시일은 기사에 없다.", "<b>숫자:<\/b> 지난여름 자사몰 회원 가입자 전년 대비 208%, 신규 회원 중 2030세대 66%(업체 주장).", "<b>마케팅:<\/b> 가을 캠페인 '와이렛: 새로운 사랑의 시작', 트와이스 지효 모델.", "<b>고객 반응:<\/b> 기사에 없다.", "<b>우리에게:<\/b> 노와이어 브라를 기획할 때 '편하지만 받쳐 준다'는 지지력 표현의 참고 사례다."], "nums": [["208", "%", "자사몰 회원 가입자 전년 대비 (업체 주장)", 1], ["66", "%", "신규 회원 중 2030세대 (업체 주장)"]], "src": "머니투데이(09.02) 직접 열람 · 데이온 국내 생산 브라 기사(09.29)는 본문이 깨져 제외", "grade": "확인"}], "flow": [{"k": "흡수량을 단계 숫자로 나눠 판다 (국내·일본 같은 방향)", "d": "디펜드 맨 가드 70/450mL 두 단계, momoful 10~30ml, PlayS 쇼츠 4종 — 흡수량 단계가 고르는 기준이 된다", "who": [1, 2, 5]}, {"k": "요실금 고객 범위가 넓어진다 (국내·일본)", "d": "국내는 40~70대 남성(경험 17%), 일본은 18~49세 여성(누출 경험 23.6%)까지 숫자로 고객을 새로 잡는다", "who": [1, 2]}, {"k": "'새는 불안'을 운동·일상 문맥으로 말한다", "d": "momoful × 핫요가, PlayS 대학 운동부 세미나 — 생리·요실금을 운동할 때의 불안 해소로 푼다", "who": [2, 5]}, {"k": "블프는 일반 속옷에 크게, 주력 누수방지 제품은 작게", "d": "Knix 최대 50%인데 주력 누수방지 20%·브라 25%, 무신사는 12/2까지 11일 행사", "who": [3, 4]}, {"k": "와이어와 노와이어 사이 '중간 구조' 브라", "d": "비너스 와이렛 — 편안함과 지지력을 함께 내세운다", "who": [6]}], "flowHeadline": "국내도 일본도 흡수량 단계와 '새는 불안'으로 요실금 고객을 넓힌다", "apply": [{"k": "[제품] 요실금팬티 흡수량을 2~3단계로 나눠 적는 라인업 설계", "p": "우선", "d": "디펜드 맨 가드(70/450mL)와 momoful(10~30ml)은 흡수량 숫자 단계로 고르게 한다. 우리 요실금팬티도 소량·중량처럼 단계를 나누고, 각 단계의 흡수량은 시험 결과가 있는 숫자만 적는다.", "r": "① 디펜드 맨 가드 · ② momoful", "who": "4본부 제품·출시팀 · 2본부 쇼핑몰팀"}, {"k": "[마케팅] 요가·필라테스 스튜디오와 '조사 숫자 → 인스타 추첨 증정' 공동 캠페인", "p": "우선", "d": "momoful은 '운동할 때 새는 불안'을 조사 숫자로 먼저 보여 준 뒤 두 브랜드 인스타그램에서 추첨 증정을 한다. 우리도 운동 스튜디오와 짝을 지어 체험단을 모으고, 후기는 개인 이름 없이 모은다.", "r": "② momoful", "who": "2본부 광고·콘텐츠팀 (샐리브 인스타)"}, {"k": "[가격 행사] 주력 요실금·생리팬티는 소폭, 곁 상품은 크게 — 이원 할인 구조 시험", "p": "검토", "d": "Knix는 '최대 50%'를 걸면서도 주력 누수방지 제품은 20%에 묶고, 브라는 3일만 25%로 한 번에 사는 금액을 올린다. 우리 행사도 주력 제품 할인 폭과 곁 상품 할인 폭을 나눠 시험해 본다.", "r": "③ Knix", "who": "2본부 쇼핑몰팀"}, {"k": "[가격 행사] 무신사 블프 종료(12/2) 전후 국내 행사 일정 맞추기", "p": "검토", "d": "국내 큰 할인 행사가 12/2에 끝난다. 언더웨어 입점 브랜드 행사가 12/1~2 사이 공개되는지 확인하고, 우리 12월 초 행사 시점을 그 앞뒤로 비교해 정한다.", "r": "④ 무신사", "who": "2본부 쇼핑몰팀"}, {"k": "[원단 시험] 소취율 같은 항목을 샘플 시험 의뢰에 넣기", "p": "검토", "d": "디펜드 맨 가드는 시험기관 이름과 '암모니아 기준 99%'를 함께 적었다(업체 주장). 우리 샘플 시험 의뢰에도 소취 시험을 넣어, 문구를 쓸 때 시험 기관·조건을 함께 적을 수 있게 한다. 효능은 단정하지 않는다.", "r": "① 디펜드 맨 가드", "who": "4본부 제품·출시팀"}, {"k": "[마케팅] 대학·지역 방송·세미나로 '생리·재난 위생' 이야기 알리기", "p": "검토", "d": "PlayS는 대학 운동부 세미나와 지역 방송 노출로 돈을 적게 들여 알렸다. 우리도 운동부·지역 행사에 위생 교육 형식으로 참여할 수 있는지 문의한다.", "r": "⑤ PlayS", "who": "1본부 · 2본부 광고·콘텐츠팀"}, {"k": "[제품] 남성 요실금 속옷 부착형은 별도 후보로 지켜보기", "p": "유지", "d": "40~70대 남성 17%가 가벼운 요실금을 겪고, 남성용 부착형 매출이 2년 새 18% 늘었다(업체 발표). 당장 만들기보다 디펜드 맨 가드의 판매처·가격이 공개되면 다시 판단한다.", "r": "① 디펜드 맨 가드", "who": "4본부 · 2본부"}], "glossary": [{"term": "속옷 부착형 (가드)", "easy": "속옷 안쪽에 붙여 쓰는 흡수 제품.", "why": "팬티처럼 입는 형태와 달리 평소 속옷을 그대로 입는다. 디펜드 맨 가드가 이 방식이다."}, {"term": "흡수량 (mL)", "easy": "제품이 받아 내는 액체의 양.", "why": "70/450mL처럼 단계 숫자가 고르는 기준이 된다. 우리 사양표에도 시험 근거 있는 숫자로 적어야 한다."}, {"term": "소취율 99%", "easy": "냄새 성분(암모니아)이 99% 줄었다는 시험 결과.", "why": "시험 기관과 조건을 함께 받아야 광고 근거가 된다. 이번 숫자는 업체 주장이다."}, {"term": "흡수 쇼츠", "easy": "생리혈·분비물·소변을 천이 빨아들이게 만든, 빨아 쓰는 팬티(일본식 이름).", "why": "일본 시장에서 우리 생리팬티·요실금팬티와 같은 자리에 놓이는 제품군이다.", "video": {"title": "繰り返し洗ってごみ削減 ユニクロ「吸水ショーツ」(2021年8月23日)", "url": "https://www.youtube.com/watch?v=oHZsndf_0fo"}}, {"term": "누수방지 속옷", "easy": "새는 것을 막는 층을 넣은 속옷. 영어로 leakproof.", "why": "Knix·Thinx 같은 해외 경쟁사가 쓰는 말로, 해외 가격 비교의 기준 상품군이다.", "video": {"title": "Will period panties hold pee? I test out Knix underwear for incontinence", "url": "https://www.youtube.com/watch?v=mlDaloLlVz4"}}, {"term": "흡한속건", "easy": "땀을 빨아들이고 빨리 마르는 성질.", "why": "다회용 속옷의 건조 시간·쾌적함을 보여 주는 시험 항목이다.", "video": {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0"}}, {"term": "DWR (내구 발수)", "easy": "겉면에 물방울이 맺혀 굴러떨어지게 하는 가공.", "why": "누수방지 겉층 가공에 쓰이며, 불소 계열 화학물질(PFAS) 규제와 이어진다.", "video": {"title": "DWR (Durable Water Repellent Exp
