했다.", "<b>진단 기술:<\/b> 대한노인정신의학회는 치매 디지털 바이오마커와 인지중재치료를 다뤘다(사전 기사의 변기환 교수 발표는 실제 발표 여부 미확인).", "<b>간호 현장:<\/b> 한국노인간호학회는 인지장애 노인의 디지털·AI 평가·치료·관리와 독거노인 세대간 디지털 멘토링+돌봄로봇을 다뤘다.", "<b>대화 로봇:<\/b> 고정은(경희사이버대)은 한국노년학회 기획세션에서 독거노인 대화형 반려로봇의 '기억-의미 분업' 모델을 제시했다.", "<b>필요한 제품:<\/b> 소리·조작이 단순한 제품, 익숙한 모양의 용품.", "<b>우리 회사:<\/b> 직접 제품은 없음. 치매 어르신이 쓰는 제품은 설명서·포장·착용 방법을 단순하게 만드는 것이 기준이 된다."], "src": "브라보마이라이프 20314 · 간호사신문 45610 · 사전 기사 20278", "grade": "확인"}, {"tm": "08", "name": "퇴원 뒤 돌봄 연결", "co": "병원 → 요양시설·가정으로 옮기는 시기 · 기조강연과 패널·기획세션", "title": "초고령사회, 돌봄의 재설계", "q": "AI가 더 많은 돌봄을 하는 사회가 아니라, AI로 사람이 더 나은 돌봄을 하는 사회여야 한다.", "hl": ["더", "나은"], "pts": ["<b>무엇이 바뀌나:<\/b> 임재영 분당서울대병원 재활의학과 교수(기조강연)는 병원에서 요양시설·가정으로 옮기는 시기의 '정보 단절'을 가장 큰 문제로 꼽았다.", "<b>새 플랫폼:<\/b> 한국형 ARPA-H 프로젝트 '케어넷(CARE-net)', 노쇠 고령자 통합돌봄 플랫폼을 소개했다.", "<b>방향:<\/b> 이경희 연세대 간호대 교수는 \"AI로 사람이 더 나은 돌봄을 하는 사회\"를, 김홍수 서울대 보건대학원 교수는 통합의 단위가 기관이 아니라 '노인의 삶의 궤적'이고 자율성·존엄이 필수라고 했다.", "<b>법·지역:<\/b> 변웅재 강남대 특임교수는 사고 뒤 '누구 탓'보다 사전 위험 분담 설계를, 김수린(한국농촌경제연구원)은 농촌 AI 돌봄은 대면을 대체하지 않는 연결고리라고 했다.", "<b>요양시설 로봇:<\/b> 한국장기요양학회는 피지컬 AI·요양시설 돌봄로봇을 다뤘다(발표자 이름은 사후 기사에 없음).", "<b>개회사:<\/b> 조은희 회장은 고령화가 \"단순한 인구구조의 변화를 넘어\" 의료·돌봄·복지 전반의 과제라며, 기술보다 노인 건강·삶의 질과의 연결이 핵심이라고 했다.", "<b>우리 회사:<\/b> 퇴원 직후는 가족이 처음 용품을 찾는 시점이다. 고관절보호대·요실금팬티 안내 자료가 이 빈틈을 채울 수 있다."], "src": "브라보마이라이프 20314 · 간호사신문 45610", "grade": "확인"}, {"tm": "해외 · 일본", "name": "이노악코퍼레이션", "co": "일본 · 보도자료(교도통신 PR와이어) · 2026.10.07", "title": "H.C.R.2026 국제복지기기전 출전: 체압분산 매트리스와 감지 매트리스", "q": "욕창 예방 매트리스 위에 '감지 기능'을 얹는 흐름이다.", "hl": ["감지", "기능을"], "pts": ["<b>제품:<\/b> 육각 슬릿 구조의 신형 「ファセットケアマットレス」, 방수·세척이 되는 체압분산 패드 「モアサポパッド」, 참고출품으로 이탈·체동 감지 매트리스 「Whiz Pad」.", "<b>숫자:<\/b> 전시 2026년 10월 7일(수)~9일(금), 10:00~17:00, 입장 무료(사전등록). 가격·판매채널은 미공개.", "<b>반응:<\/b> 고객 반응 자료는 이번 조사에서 찾지 못함. 행사 규모도 확인하지 못했다.", "<b>국내와 비교:<\/b> 같은 달 국내 학회에서는 전자동 체위변경 매트리스가 실패하고 수동형이 환영받았다. 일본은 매트리스 자체는 단순하게 두고 감지를 덧붙이는 방향이다."], "nums": [["3", "일", "전시 기간(10.07~10.09)"]], "src": "https://kyodonewsprwire.jp/release/202610067403", "grade": "확인"}, {"tm": "해외 · 미국", "name": "Cerna Healthcare (SafePatch)", "co": "미국 · Medical Economics · 2026.09.15", "title": "피부에 붙이는 낙상 감지 패치", "q": "시계나 목걸이를 싫어하는 어르신을 위해 피부에 붙이는 감지기가 나왔다.", "hl": ["피부에"], "pts": ["<b>제품:<\/b> 피부 부착형 낙상 감지 패치. 10월 출하 예정, 가족 또는 전문 모니터링으로 알린다.", "<b>숫자:<\/b> 처음 99달러(본체+6개월분 패치), 월 9.99달러(가족)·29.99달러(전문), 한 번 충전에 1주일.", "<b>반응:<\/b> 출하 전이라 이용 후기는 아직 없다.", "<b>국내와 비교:<\/b> 국내 요양병원은 레이더 낙상 감지기를 들였지만 '경보 피로도'가 과제로 꼽혔다. 미국은 기기 판매에 구독형 모니터링을 붙여 '누가 대응하나'를 요금제로 풀었다."], "bars": {"t": "SafePatch 요금 (달러)", "u": "달러", "rows": [["처음 구입", 99, "a"], ["전문 월 요금", 29.99, "b"], ["가족 월 요금", 9.99, "c"]]}, "nums": [["1", "주일", "한 번 충전 사용 기간", 1]], "table": [["항목", "일본", "미국", "중국", "유럽"], ["대표 제품", "감지형 매트리스(참고출품)", "낙상 감지 패치 SafePatch", "스마트 의류·스마트 매트리스(수저우 사례)", "성인용 요실금 제품"], ["가격", "미공개", "99달러 + 월 9.99 / 29.99달러", "미공개", "미공개"], ["시장", "행사 규모 확인 못 함", "—", "60세 이상 3억 1천만 명+", "약 50억 달러(2025, 2차 자료)"]], "src": "https://www.medicaleconomics.com/view/new-wearable-skin-patch-aims-to-detect-falls-and-alert-families-in-real-time", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 정부(민정부 등)", "co": "중국 · 중국 정부 영문 포털 · 2026.04.29 보도(1월 정책 포함, 6개월 넘은 소식)", "title": "실버경제 로드맵: 스마트 케어와 노인 모드", "q": "정부가 스마트 케어와 전자상거래 '노인 모드'까지 직접 밀고 있다.", "hl": ["노인", "모드"], "pts": ["<b>시장 상황:<\/b> 스마트 케어·소비 촉진, 전자상거래 노인 모드를 담은 실버경제 로드맵.", "<b>숫자:<\/b> 60세 이상 \"more than 310 million\"(3억 1천만 명 넘음), 2035년 \"surpass 400 million\"(4억 명 넘음), 시범 생활권 \"nearly 6,300\"곳.", "<b>반응:<\/b> 정부 발표라 소비자 반응 자료는 없음.", "<b>국내와 비교:<\/b> 국내는 국립건강노화연구소 설립 추진 같은 연구 기반 단계, 중국은 소비·유통까지 정부가 함께 설계한다."], "bars": {"t": "중국 60세 이상 인구 (억 명, 중국 정부)", "u": "억 명", "rows": [["지금", 3.1, "b"], ["2035년 전망", 4.0, "a"]]}, "nums": [["약 6,300", "곳", "시범 생활권"]], "src": "https://english.www.gov.cn/policies/policywatch/202604/29/content_WS69f19a6bc6d00ca5f9a0ab0c.html", "grade": "확인"}, {"tm": "해외 · 중국", "name": "Daxue Consulting", "co": "중국 · 컨설팅 보고서 요약 · 2025.12.09(6개월 넘은 자료)", "title": "2026 중국 실버경제 요약", " dline": "학회와 설명 영상에 나온 어려운 말 15개", "glossary": [{"term": "노쇠(Frailty)", "easy": "늙어서 몸 여러 기능이 약해져 작은 병에도 크게 앓는 상태. 노화와 달리 되돌릴 수 있다는 설명이 많다.", "why": "복지용구·보행·침구 수요가 시작되는 출발점이다.", "video": {"title": "노화(Aging)는 피할 수 없지만, 노쇠(Frailty)는 막을 수 있다!… (KBS 2019.03.13 방송)", "url": "https://www.youtube.com/watch?v=FWYfZr7FDD0"}}, {"term": "근감소증", "easy": "근육량·힘·기능이 함께 줄어드는 질환.", "why": "넘어짐과 보행 보조기구 수요로 이어진다.", "video": {"title": "노년기 근감소증 관리ㅣ동아아산건강강좌", "url": "https://www.youtube.com/watch?v=nlsiOB8Ed3c"}}, {"term": "낙상", "easy": "넘어지는 사고.", "why": "고관절보호대·안전손잡이·미끄럼 방지·낙상 감지 제품의 배경이다.", "video": {"title": "노인 하체의 힘! 큰 사고를 예방하는 지름길!!", "url": "https://www.youtube.com/watch?v=-ObRZfutfZg"}}, {"term": "건강수명", "easy": "아프지 않고 사는 기간. 기대수명과의 격차가 약 13년이라고 국립보건연구원이 발표했다.", "why": "'아픈 채 사는 13년'이 우리 제품이 쓰이는 기간이다."}, {"term": "기쁨수명(Joyspan)", "easy": "오래 살거나 아프지 않은 것을 넘어, 기쁘게 사는 기간을 늘리자는 개념(장일영 교수 제안).", "why": "제품을 '병 관리'보다 '즐거운 일상 유지'로 설명하는 말이 될 수 있다."}, {"term": "노인포괄평가(CGA, DEEP IN 10분판)", "easy": "몸·마음·생활을 한꺼번에 점검하는 검사. 학회에서 10분판이 소개됐다.", "why": "고객 상태를 나눠 맞는 제품을 권하는 기준으로 참고할 수 있다."}, {"term": "중간 노화세포(mid-old cell)", "easy": "완전히 늙지 않고 잠자는 상태의 세포. 75세 이상 조직 상당수가 이렇다는 연구 발표가 있었다.", "why": "늙음을 늦출 수 있다는 연구 흐름을 이해하는 배경 지식이다."}, {"term": "야간뇨", "easy": "밤에 소변 때문에 자주 깨는 것.", "why": "수면 방해로 이어져 요실금팬티·방수 침구·야간 화장실 안전 수요가 생긴다.", "video": {"title": "소변이 마려워서 밭에 자주 깨신다면! 야간뇨 대처법 - 건국대병원 비뇨의학과 김아람 교수", "url": "https://www.youtube.com/watch?v=EkYLA3PVHNo"}}, {"term": "연하장애(삼킴장애)", "easy": "음식을 삼키기 어려운 상태. 사레가 잦거나 폐렴이 반복되는 것이 신호로 설명된다.", "why": "점도증진제·연하식 같은 식품 시장의 배경이다.", "video": {"title": "[경희의료원 IT재활] \"꿀꺽\" 삼킴이 안된다? 영상으로 이해하는 연하장애 (뇌졸중 편)", "url": "https://www.youtube.com/watch?v=ntL30am0RLQ"}}, {"term": "비디오 투시 연하검사(VFSS)", "easy": "엑스레이로 삼키는 모습을 보는 검사.", "why": "병원 연계 설명 자료에 나오는 말이다.", "video": {"title": "비디오 투시 연하 (삼킴) 검사 (순천향대학교병원 재활의학과 김현정)", "url": "https://www.youtube.com/watch?v=X28_QKUwwSU"}}, {"term": "점도증진제", "easy": "물·국에 타서 걸쭉하게 만드는 가루.", "why": "급식·식품 카테고리의 대표 제품이다.", "vide
