6", "title": "전국 장기요양보험 체계 구축 지침", "q": "2016년 시범으로 시작한 장기요양보험을 전국 하나의 체계로 묶습니다.", "hl": ["전국"], "pts": ["<b>시장 상황:<\/b> 2016년부터 시범 도시에서 하던 장기요양보험을 전국 통합 체계로 바꾸는 지침을 3월 25일 발표. CGTN은 2028년까지 체계를 갖춘다고 보도했다.", "<b>제도:<\/b> 기금이 생활돌봄 20가지(식사·배변·위생 등)와 의료돌봄 16가지(검진·기본 간호·재활)를 낸다(2025년 9월 서비스 목록). 정부·고용주·개인이 비용을 나누고, 현금보다 서비스로 준다(CGTN). 중증부터 단계적으로 넓힌다는 내용은 검색 요약만 확인.", "<b>숫자:<\/b> 가입자 약 3억1천만 명(신화), 혜택 받은 사람 330만 명 이상, 시범 49개 도시. 보험료는 대부분 가입자가 소득의 약 0.3%, 비용 보장은 50~70%.", "<b>국내와 비교:<\/b> 한국은 2008년부터 시행해 인정자 123만 명·보험료율 0.9448%(2026). 중국은 가입자 규모가 수억 명인 제도가 이제 막 전국으로 깔리는 단계다."], "nums": [["3억1천만", "명", "가입자(신화 보도)", 1], ["330만", "명+", "혜택 받은 사람"], ["0.3", "%", "보험료(소득 대비, 대부분 가입자)"], ["49", "개", "시범 도시(CGTN)"]], "src": "상하이시 정부 영문 사이트(신화 전재) · CGTN 2026.03.26 (신화 '3억1천만 명'과 CGTN '3억 명'은 다른 지표일 수 있어 섞지 않음)", "grade": "확인"}, {"tm": "해외 · 독일", "name": "독일 연방보건부", "co": "독일 · 연방보건부 보도자료 · 2026.09.30", "title": "간병보험 개정법(PNOG) 내각 의결", "q": "아이 없는 가입자의 가산 보험료를 2027년부터 0.9%로 올립니다.", "hl": ["0.9%로"], "pts": ["<b>시장 상황:<\/b> 연방 내각이 사회적 간병보험 개정법안을 의결했다. 아직 연방의회·상원 심의가 남은 법안 초안이다.", "<b>제도:<\/b> 2027년 1월 1일부터 무자녀 가입자 가산 보험료를 0.3%p 올려 0.9%로. 2028년 1월 1일부터 배우자 공동가입 가산 0.52%. 재가 돌봄 지원 강화와 60세 이상 검진, 지역사회 예산 월 최대 300유로, 요양시설 디지털화 16억 유로.", "<b>숫자(2차 기사, 추정):<\/b> 돌봄 등급 1~3 판정 점수를 올리고(1등급 15점·2등급 30점·3등급 50점) 기존 등급자는 유지, 정부 추정 적자 2027년 76억 유로 ~ 2030년 174억 유로.", "<b>국내와 비교:<\/b> 한국도 급여비(+9.3%)가 보험료(+4.2%)보다 빨리 는다. 독일처럼 판정 기준을 높이거나 보험료를 더 걷는 논의가 한국에도 올 수 있는 앞선 사례다. 독일 간병보험의 보조기구 목록 개정 내용은 이번에 찾지 못했다."], "shift": {"from": "0.6%", "to": "0.9%", "cap": "독일 무자녀 가입자 가산 보험료 (2027.1.1 시행 예정, 연방보건부 원문)"}, "nums": [["16억", "유로", "요양시설 디지털화"], ["300", "유로", "지역사회 예산 월 최대"], ["174억", "유로", "2030년 정부 추정 적자(2차 기사)", 1]], "table": [["바뀌는 것", "내용"], ["무자녀 가산 보험료", "0.6% → 0.9% (2027.1.1)"], ["배우자 공동가입 가산", "0.52% (2028.1.1)"], ["지역사회 예산", "월 최대 300유로"], ["돌봄 등급 1~3 판정 점수", "상향, 기존 등급자는 유지 (2차 기사)"]], "src": "독일 연방보건부 보도자료 원문 · 2차 기사 apotheken-umschau(검색 요약만)", "grade": "확인"}, {"tm": "해외 · 일본", "name": "일
