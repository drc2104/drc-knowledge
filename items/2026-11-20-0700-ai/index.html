<script id="item-data" type="application/json">{"id": "2026-11-20-0700-ai", "date": "2026-11-20", "slot": "07:00", "topic": "AI 테크", "type": "컨퍼런스 강연", "title": "금융 테크 컨퍼런스 2026 정리", "subtitle": "AI × 보안 × 금융 · 국내 발표 13개(내용 공개 9개) · 해외 6개", "event": {"name": "금융 테크 컨퍼런스 2026 – AI × Security × Finance", "host": "바이라인네트워크(IT 전문 매체)", "when": "2026.09.22(화) 08:30~17:30", "where": "서울 여의도 FKI타워 컨퍼런스센터 1층 그랜드볼룸 (참석 300여 명)", "theme": "금융 AI 도입 확대와 딥페이크·프롬프트 인젝션 같은 새 위협을 함께 본다"}, "headline": "금융 AI의 승부는 에이전트 수가 아니라 권한 통제다", "hl": ["권한", "통제다"], "summary3": [["AI 공격은 이미 현실이 됐다.", "금융보안원이 국내 금융사를 노린 AI 에이전트 공격을 처음 발견했다. 금융권 AI 레드티밍 점검은 2024년 3개 기관에서 2026년 20개 기관 24개 서비스로 늘었다."], ["에이전트 보안의 중심은 '신원과 권한'이다.", "IBM은 에이전트마다 고유 신원을 주고 자격 증명을 1~2분만 쓰게 하라고 했고, KB데이타시스템은 기업 MCP의 4대 조건(신원 전파·도구 노출 통제·쓰기 작업 사람 승인·전 호출 감사)을 내놓았다."], ["해외도 '도입은 늘지만 성과는 적다'.", "중국 신화통신이 인용한 KPMG 조사에서 기업 88%가 에이전트를 시스템에 넣었지만 투자 수익을 낸 곳은 24%뿐이다. 미국 Forrester는 기업 리더 4명 중 3명이 도입 중이라면서도 거버넌스 격차를 지적했다."]], "cases": [["사례", "숫자"], ["미래에셋증권 부서가 직접 만든 에이전트 (고석태 발표 인용)", "1000여 개 · 임직원 3700여 명"], ["우리은행 AI 에이전트 (고석태 발표 인용)", "175개 · AI 투자 880억 원"], ["베스핀글로벌 사내 에이전트 제작 → 실제 가동", "약 910개 → 121개 · 연 약 16억 원 절감(회사 주장)"], ["토스 앱인토스 미니앱 (1년)", "1만 3000개 · 월 이용자 400만 명"]], "shift": {"from": "3개 기관", "to": "20개 기관", "cap": "금융권 AI 레드티밍 점검 대상, 2024년 → 2026년(24개 서비스). 2027년부터 정식 제공 (김성웅 금융보안원)"}, "chart": {"t": "도입은 늘었지만 성과는 적다 (%, 중국 신화통신 2026.11.12 · KPMG 인용 포함)", "u": "%", "rows": [["중국 기업 에이전트 채택률 2024년 말", 17.3, "c"], ["중국 기업 에이전트 채택률 2026년 상반기", 40.3, "b"], ["에이전트를 시스템에 넣은 기업 (KPMG)", 88, "a"], ["투자 수익을 낸 기업 (KPMG)", 24, "c"]]}, "keynums": [["300", "여 개", "동시다발 공격을 받은 국내외 금융회사 (김성웅)", 1], ["20", "개 기관", "2026년 금융권 AI 레드티밍 점검 (24개 서비스)"], ["1~2", "분", "에이전트 자격 증명을 쓰는 시간 (IBM 최석재)"], ["95", "%", "뚜렷한 성과를 못 낸 생성 AI 투자 (MIT 연구 인용, 이세영)", 1]], "overviewNote": "숫자 출처: 바이라인네트워크 현장 기사 9건(발표별)과 플래티어 보도자료 기사. 연사 13명 중 양경윤(일루미오)·채준혁(인섹시큐리티)·윤희성(HCLSoftware)·박현길(소프트프릭) 4명은 발표 내용 기사를 찾지 못했습니다. 발표자료는 참석자에게 이메일로만 배포돼 공개 PDF가 없고, 세션별 시각도 공개되지 않아 발표 순서로 적었습니다.", "sectionLabel": "발표", "sections": [{"tm": "오전 · 순서 1", "name": "김성웅", "co": "금융보안원 금융AI보안연구소장", "title": "AI 보안 위협 대응을 위한 금융보안 업무 AX 혁신 전략", "q": "안타깝게도 최근에 AI에 의한 사이버공격이 우리나라 금융권에서 현실화된 사례가 발생했습니다.", "hl": ["현실화된"], "pts": ["<b>첫 발견:<\/b> 국내 금융사를 노린 AI 에이전트 공격을 금융보안원이 처음 찾았다. 딥시크 AI 에이전트로 오라클 웹로직을 훑고 → 웹쉘을 심고 → 내부 자산을 탐색했다. 2·3차 악성코드 단계에서 탐지·차단.", "<b>아직은 반자동:<\/b> 사람이 단계마다 프롬프트로 지시한 유형이라 완전히 스스로 움직이는 공격은 아니었다. 다만 고성능 '프런티어 AI'는 스스로 취약점을 찾고 공격하는 수준에 이르렀다.", "<b>책임자:<\/b> AI 보안은 정보보호 책임자만이 아니라 대표이사·이사회의 책임.", "<b>경영진 보고 지표:<\/b> 패치 안 된 서비스, 외부에 노출된 웹서버 자산, 복구 방법·시간.", "<b>우선순위:<\/b> 취약점은 하루에도 수백·수천 건이라 모두 패치할 수 없다. 공격 가능성·위험도·업무 중요도로 순서를 정하고 웹방화벽·가상 패치를 함께 쓴다.", "<b>자동화의 선:<\/b> 영향이 작은 일은 자동으로, 계정계·인증정보 DB 같은 핵심 차단은 사람이 최종 승인.", "<b>제도:<\/b> 대응 요령 6개 핵심 분야(7월 공개), 금융분야 AI 가이드라인 7대 원칙, 침해 사례를 함께 나누는 공동 방어 체계."], "bars": {"t": "금융권 AI 레드티밍 점검 기관 수", "u": "개 기관", "rows": [["2024년", 3, "c"], ["2025년 (5개 서비스)", 5, "b"], ["2026년 (24개 서비스)", 20, "a"]]}, "nums": [["300", "여 개", "동시다발 공격을 받은 국내외 금융회사", 1], ["24", "개", "2026년 점검 서비스"], ["2027", "년", "AI 레드티밍 정식 제공 시작"]], "src": "바이라인네트워크 2026.09.28 (이유지 기자) · 기사 본문은 '금융보안원', 슬라이드 설명은 '금융보안연구원'으로 표기가 다름", "grade": "확인"}, {"tm": "오전 · 순서 2", "name": "최석재", "co": "IBM 상무", "title": "Agentic AI 시대, 금융회사는 AI 에이전트를 어떻게 신뢰할 것인가?", "q": "AI 에이전트에게 나의 일을 위임할 때 그 에이전트가 어떤 권한을 갖고 일을 하게 될지 고민해야 한다", "hl": ["권한을"], "pts": ["<b>문제:<\/b> 에이전트가 사용자 권한을 그대로 빌려 쓴다. 통제 안 된 에이전트를 '그림자 행위자'라 불렀다. 원인 3가지 = 에이전트 신원 없음, 실행 중 통제 없음, 감사 추적 불가.", "<b>신원이 없을 때 실패 요인 4가지:<\/b> 예측할 수 없는 행동, 보이지 않는 위임, 실시간 집행 부재, 중앙에서 한눈에 볼 수 없음.", "<b>해법 4요소:<\/b> ① 모든 에이전트에 고유 신원 ② 늘 열린 권한 대신 쓸 때만 최소 권한 ③ 행위의 의도·목적 분명히 ④ 감사·통제 증거 기록.", "<b>기술:<\/b> 'OBO 토큰'(누가 시켰는지·누가 하는지·무슨 일·얼마 동안)을 그때그때 발급. MCP 게이트웨이가 사용자 권한을 확인. 자격 증명은 1~2분만 쓰고, 일이 끝나면 세션 종료·권한 폐기.", "<b>실제 사고 유형:<\/b> 에이전트가 지시 없이 운영 DB 데이터를 지우거나 고침, 시스템을 뚫어 인사 데이터를 조회, MS365 코파일럿 이메일 속 보이지 않는 문장 때문에 엉뚱한 작업을 실행.", "<b>제품:<\/b> IBM Verify, HashiCorp Vault."], "nums": [["4", "요소", "에이전트 신뢰 해법"], ["1~2", "분", "자격 증명 사용 시간", 1]], "src": "바이라인네트워크 2026.09.22 (김우용 기자)", "grade": "확인"}, {"tm": "오전 · 순서 3", "name": "신성석", "co": "플래티어 AX EC솔루션사업본부장 (사전 안내 표기 '신상석')", "title": "도입을 넘어 진화로 — 기술 변화와 조직 역량이 함께 성장하는 단계적 AX 전략", "q": "AI를 한 번 쓰고 마는 도구가 아니라 조직의 성숙도에 맞춰 4단계로 키워야 한다.", "hl": ["4단계로"], "pts": ["<b>4단계:<\/b> 지식 자산화(Knowledge) → 업무 실행(Agent) → 협업 자동화(Orchestration) → 스스로 진화(Self-Evolving).", "<b>플랫폼 XGEN:<\/b> 하이브리드 RAG, 하네스 엔지니어링, 말로 화면을 만드는 FloUI, API 자동 연동, 사내 서버·클라우드 모두 지원.", "<b>보안 기능:<\/b> 역할별 권한 관리, 개인정보 가리기.", "<b>사례:<\/b> 제주은행, iM캐피탈 (이름만 언급, 성과 숫자는 없음).", "<b>현장 반응:<\/b> 부스에서 망분리 환경의 보안·거버넌스 문의가 이어졌다고 회사가 밝혔다."], "nums": [["4", "단계", "AX 성숙도"], ["300", "여 명", "행사 참석"]], "src": "바이라인네트워크 2026.09.23 · 파이낸스스코프 · 벤처스퀘어 (회사 보도자료 성격)", "grade": "확인"}, {"tm": "오전 · 순서 4", "name": "정혜연", "co": "ING 한국대표", "title": "AI·디지털화와 책임 있는 거버넌스를 통한 기업금융 혁신", "q": "금융권에서 혁신은 거버넌스하고 직결됩니다.", "hl": ["거버넌스하고"], "pts": ["<b>주장:<\/b> 거버넌스가 없으면 안정성·신뢰성 문제가 생긴다. AI가 단순 업무를 대신해도 고객에게 가치를 제안하는 일은 사람 몫.", "<b>투자와 확대:<\/b> 10년간 디지털·AI 전환에 투자했고, 생성형 AI 시범 운영의 90%를 실제 업무로 넓혔다.", "<b>시범 5개 영역:<\/b> 고객센터, 초개인화, 고객 확인, 기업금융 여신, 소프트웨어 개발.", "<b>여신 회의:<\/b> 약 119장의 여신 자료와 회의 내용을 사내 생성형 AI에 넣으면 핵심과 확인할 질문을 정리해 준다.", "<b>그 밖:<\/b> 고객 확인 문서·시스템 정보 추출, ESG 문서를 분석해 금융상품 제안."], "nums": [["90", "%", "시범에서 실제 업무로 넓힌 비율", 1], ["119", "장", "AI가 요약하는 여신 자료 분량"], ["10", "년", "디지털·AI 전환 투자 기간"]], "src": "바이라인네트워크 2026.09.28 (오민선 기자)", "grade": "확인"}, {"tm": "오후 · 순서 6", "name": "이세영", "co": "베스핀글로벌 전무", "title": "AI AGENT 시대, 모두가 놓치고 있는 3가지", "q": "우리가 AI로 만들고자 하는 것은 비즈니스 결과", "hl": ["비즈니스", "결과"], "pts": ["<b>왜 성과가 없나:<\/b> 에이전트를 늘려도 성과가 없는 이유는 '오정렬'. 놓치기 쉬운 3가지 = 사람(현업이 안 씀) · 손익(투자 수익 실패) · 역량(데이터·운영 투자 부족).", "<b>AI 운영 7단계:<\/b> 인프라 → 모델 → 데이터옵스 → 온톨로지 → 에이전트 만들기 → 거버넌스·규정 준수 → 성과와 투자 수익. GPU·모델·에이전트엔 돈이 몰렸지만 데이터옵스·온톨로지는 비어 있다.", "<b>시장 숫자(기사 속 인용):<\/b> 세계 생성 AI 투자 50조 원에 육박, 미국 기업 AI 투자 350~400억 달러(약 47~54조 원), 뚜렷한 성과를 못 낸 비율 95%(MIT 연구), 매출이 늘어난 사례 5%.", "<b>에이전트 수 전망:<\/b> 포춘 500 기업  전용선·VPN, 승인된 외부 AI 경로 밖 인터넷은 차단.", "<b>가명처리:<\/b> 개인정보를 찾아 다른 값으로 바꾸고, 대응표는 메모리에만 두었다가 세션이 끝나면 지운다.", "<b>AI 게이트웨이:<\/b> 들어오는 글(인젝션·탈옥)을 막고 나가는 답(지어낸 답·소비자 보호)을 점검. 문제가 생기면 작은 모델·규칙 기반으로 바꾸는 비상 차단 장치.", "<b>기록:<\/b> 프롬프트·모델 버전·근거 문서를 고칠 수 없게 저장.", "<b>규제 일정:<\/b> AI 기본법 올해 적용(제34조), 금융보안원 평가는 내년부터. 혁신금융서비스 지정 요건 4가지."], "table": [["기업 MCP 4대 조건", "내용"], ["① 신원 전파", "통합 로그인·권한 관리로 누가 시켰는지 끝까지 전달"], ["② 도구 노출 통제", "역할에 따라 보이는 도구를 다르게"], ["③ 읽기·쓰기 분리", "상태를 바꾸는 작업은 사람이 2차 승인"], ["④ 등록부·감사", "허용 목록에 오른 도구만, 모든 호출 기록"]], "nums": [["4", "조건", "기업 MCP 도입 전제", 1]], "src": "바이라인네트워크 2026.09.29 (김원민 기자)", "grade": "확인"}, {"tm": "오후 · 순서 12", "name": "허용준", "co": "한국신용정보원 금융AI데이터부 AI개발팀장", "title": "금융권 로컬 컴퓨팅 LLM 엔진 개발 (사전 안내 'CoreLM', 기사 'MyChat.LM')", "q": "외부 전송 경로를 차단하고 내부망·보안망에서 AI를 독립적으로 실행할 수 있으며", "hl": ["독립적으로"], "pts": ["<b>장애물:<\/b> 금융권 업무망에서 AI를 못 쓰는 이유는 모델보다 보안·실행 환경.", "<b>MyChat.LM:<\/b> 외부 접속 없이 업무용 PC 안에서 모델을 돌린다. 대화 기록·설정·모델 파일도 PC 안에서 관리. 모델 압축, 메모리·CPU 최적화로 가볍게.", "<b>평가 기준:<\/b> 업무 품질(한국어 질의응답, 문서 작성·요약, 정보 추출, 코드·SQL 작성) + 실행 효율(답이 나오기 시작하는 시간, 글자 생성 속도, 메모리, 긴 글 처리).", "<b>다음 단계:<\/b> 내부 검증 → 금융권·교육기관 배포 → CPU·저사양 GPU로 돌리는 'MyChat.LM 서버' → 가명처리 안내·규정 질의응답 '에이전트'.", "<b>한계:<\/b> 성능 수치는 기사에 없다."], "src": "바이라인네트워크 2026.09.23 (이수민 기자) · 사전 안내 제품명과 기사 제품명이 달라 같은 발표인지는 기사 문맥상 추정", "grade": "확인"}, {"tm": "오후 · 순서 13", "name": "권순우", "co": "토스(비바리퍼블리카) 앱인토스 PO", "title": "금융을 넘어 일상으로: AI와 미니앱 플랫폼 앱인토스가 만드는 생태계", "q": "어떠한 코드가 동작하더라도 할 수 있는 일은 제한돼 있다", "hl": ["제한돼"], "pts": ["<b>안전장치의 핵심은 격리:<\/b> 미니앱 코드는 토스 핵심 영역·이용자 데이터에 직접 닿지 못한다. 개발 도구만 주고, API는 허용 목록 방식.", "<b>동의:<\/b> 표준 동의 화면, 권한을 거두면 바로 접근 차단.", "<b>검수 보조 '오빗(Orbit)':<\/b> 미니앱을 직접 실행·화면 캡처하고 AI가 위험 요소를 분석해 심사관을 돕는다.", "<b>성장:<\/b> 출시 1년 만에 미니앱 1만 3000개 돌파, 월 이용자 400만 명, 새 미니앱 매달 수천 개. 연말 500만~600만 명 이상 목표.", "<b>추천:<\/b> 결제·쇼핑 이력으로 이사 준비가 보이면 용달 미니앱을 추천하고, 예약·만족도 결과를 다시 추천에 쓴다."], "nums": [["1만 3000", "개", "미니앱 (출시 1년)", 1], ["400만", "명", "월 이용자"], ["500만~600만", "명+", "연말 이용자 목표"]], "src": "바이라인네트워크 20
