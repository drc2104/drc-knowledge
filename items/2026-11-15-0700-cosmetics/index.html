: null, "src": "코스모닝 53704 · CNC뉴스 11346(참고)", "grade": "확인"}, {"tm": "2일차 · 10.15", "name": "Vera Rogiers ②", "co": "벨기에 브뤼셀자유대 교수 · EU 소비자안전과학위원회(SCCS)", "title": "차세대 위해성 평가(NGRA)와 SCCS의 NAMs 활용", "q": "기술의 발전과 규제 수용은 동일한 문제가 아니라는 점을 잊어서는 안 된다.", "hl": ["규제 수용은"], "pts": ["<b>진전된 곳:<\/b> 피부·눈 자극 같은 국소 독성은 동물 없이 평가하는 방법이 자리를 잡아 간다.", "<b>한계가 남은 곳:<\/b> 반복 투여·생식·발암성 같은 전신 독성. \"복잡한 전신독성 평가에는 여전히 과학·제도 차원의 한계가 존재한다.\"(코스모닝)", "<b>돌파구:<\/b> 여러 결과를 묶어 사람 기준 위험을 계산하는 차세대 위해성 평가(NGRA).", "<b>뜻:<\/b> 시험 기술이 나와도 규제 기관이 받아들이기까지는 시간이 따로 걸린다."], "nums": null, "bars": null, "shift": {"from": "국소 독성 진전", "to": "전신 독성 한계", "cap": "동물 대체 시험이 잘 되는 곳과 아직 어려운 곳"}, "table": null, "video": {"title": "화장품 등 안전성평가를 위한 동물대체시험법 [광독성시험법]", "url": "https://www.youtube.com/watch?v=FXcFZyfyjtE"}, "src": "코스인코리아 58528 · 코스모닝 53704", "grade": "확인"}, {"tm": "해외 · 미국", "name": "미국 FDA · 한국 식약처 수출 통계", "co": "미국 · 서울경제 영문판·NatLawReview·CIRS · 2026.10.02 / 05.01 / 09.11", "title": "한국 화장품 최대 수출국, 그런데 규칙 3가지는 아직 미확정", "q": "미국은 한국 화장품 수출의 5분의 1을 차지하지만 제조 품질·향료 알레르겐 표시 규칙은 1월 기준 아직 나오지 않았습니다.", "hl": ["5분의 1을"], "pts": ["<b>시장 상황:<\/b> 1~9월 한국→미국 수출 23.5억 달러, +40.6%, 전체의 21.1%로 1위. 중국은 15.8억 달러(+0.4%, 14.2%). 3분기만 41.7억 달러로 2분기보다 +7.5%(식약처 발표).", "<b>제도:<\/b> MoCRA 시설 등록·제품 목록은 2023.12.29부터 의무. 2026.1.6 기준 시설 등록 14,299건, 제품 목록 992,907건.", "<b>미확정 3가지:<\/b> 제조 품질(GMP) 규칙, 향료 알레르겐 표시, 탈크 석면 시험(2025.11.28 제안 철회). 법률 회사 글(2026.5.1)이며 '대부분 1월 기준'이라 이후 바뀌었을 수 있다.", "<b>선크림:<\/b> FDA 최종 행정명령(2026.9.11)으로 PABA·TEA-salicylate를 활성 성분에서 뺐다. 시행 2027.9.11.", "<b>국내와 비교:<\/b> Kao Fujii 발표(②)가 말한 'MoCRA 전 과정 의무'의 현재 모습. 향료 알레르겐 규칙이 나오면 라벨·처방 변경 부담이 가장 크다."], "nums": [["23.5", "억 달러", "한국→미국 수출(1~9월)", 1], ["40.6", "%", "미국 수출 증가율"], ["14,299", "건", "MoCRA 활성 시설 등록(2026.1.6)"], ["992,907", "건", "MoCRA 제품 목록(2026.1.6)"]], "bars": null, "shift": null, "table": [["나라", "수출(1~9월) · 증감 · 제도 변화"], ["미국", "23.5억 달러 · +40.6% · 비중 21.1% · GMP·향료 알레르겐 규칙 미확정"], ["중국", "15.8억 달러 · +0.4% · 비중 14.2% · 신규 원료 규정 7.15 시행"], ["일본", "8.89억 달러 · +8.6% · 큐텐이 온라인 뷰티 약 30%"], ["영국", "4.43억 달러 · +179.3% · EU 적합 ≠ 영국 적합, 표시 전환 2027년 말"], ["네덜란드(EU)", "3.69억 달러 · +292.6% · 그린 클레임 9.27 적용"], ["캐나다", "2.85억 달러 · +124.4% · 제도 미확인"], ["전체", "111억 달러 · +31.1% · 2025년 연간(114.2억 달러)의 약 97%"]], "video": {"title": "MoCRA 모크라 Modernization of Cosmetics Regulation Act란? (MoCRA #01)", "url": "https://www.youtube.com/watch?v=LG2IvGE-2sQ"}, "src": "서울경제 영문판(식약처 발표) · NatLawReview(Foley & Lardner) · CIRS Vol.43", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 NMPA · SAMR", "co": "중국 · REACH24H·Cosmetics China Agency · 2026.06~08", "title": "수출은 제자리(+0.4%), 규제는 풀기와 조이기 동시", "q": "중국 수출이 멈춘 사이 신규 원료 '고위험' 범위가 10개에서 5개 분야로 줄었습니다.", "hl": ["10개에서", "5개"], "pts": ["<b>시장 상황:<\/b> 한국→중국 1~9월 15.8억 달러, +0.4%로 사실상 정체.", "<b>제도:<\/b> 신규 원료 등록·신고 규정 2026.6.26 발표, 7.15 시행. '고위험' 범위를 방부·자외선 차단·착색·염모·기미 제거·미백 중심 5개로 줄였다. 시장감독총국(SAMR) 광고 인용 집행 지침은 6.3.", "<b>등록 문턱(2차 출처):<\/b> NMPA 제70호(7.29)는 중국이 진짜 첫 출시 시장이면 해외 판매 증명 불필요, 저위험 품목 독성 보고 면제 가능, 비슷한 처방은 대표 제품 1개 시험 공유. 제72호(8.3)는 시험법 2종 추가. 대행사 블로그 기준이라 공고 원문 확인이 필요하다.", "<b>국내와 비교:<\/b> 한국이 2028년 평가를 강화하는 동안 중국은 일부 문턱을 낮췄다. 실제 진출을 검토할 때는 원문 공고부터 본다."], "nums": null, "bars": {"t": "중국 신규 원료 '고위험' 범위", "u": "개", "rows": [["개정 전", 10, "c"], ["개정 후(7.15 시행)", 5, "a"]]}, "shift": null, "table": null, "src": "서울경제 영문판 · REACH24H · Cosmetics China Agency(2차 출처)", "grade": "확인"}, {"tm": "해외 · EU", "name": "유럽의회 · EU 이사회", "co": "EU · 유럽의회 조사처(EPRS)·CIRS · 2026.06.16 합의 / 07.14 위원회 / 09.27 적용", "title": "CMR 물질 규제는 간소화와 강화가 섞였고, 그린 클레임은 시행", "q": "근거 없는 '자연·지속가능' 같은 표현은 9월 27일부터 EU에서 쓸 수 없습니다.", "hl": ["9월 27일부터"], "pts": ["<b>시장 상황:<\/b> 한국→네덜란드 1~9월 3.69억 달러(+292.6%), 영국 4.43억 달러(+179.3%). 유럽이 가장 빨리 크는 시장이다.", "<b>제도 진행:<\/b> 2025.7 집행위 제안 → 2026.6.16 잠정 합의 → 7.14 환경·소비자 위원회 승인(찬성 110, 반대 10, 기권 5) → 10월 본회의 표결 예정(결과 미확인).", "<b>숫자:<\/b> CMR 물질 금지 뒤 전환 기간이 제안 12·24개월에서 합의안 6·12개월(면제 신청 없을 때)로 짧아졌다. 안전 문제로 면제 거부 시 3·9개월, 대체 물질이 있어 거부 시 24·36개월. 나노 물질 사전 통지는 폐지안과 달리 유지.", "<b>표시:<\/b> 지침(EU) 2024/825 그린 클레임 규정이 2026.9.27부터 적용, 근거 없는 'natural'·'sustainable' 등 일반 표현 금지.", "<b>국내와 비교:<\/b> 영국 CTPA(③)·프랑스 COSMED(④) 발표와 같은 방향. 수출은 늘지만 EU와 영국 규칙이 각각 달라 표시 문구와 원료를 먼저 점검해야 한다."], "nums": [["110", "표", "위원회 찬성(반대 10, 기권 5)"], ["292.6", "%", "한국→네덜란드 수출 증가율", 1]], "bars": {"t": "CMR 물질 금지 뒤 전환 기간 (짧은 쪽, 개월)", "u": "개월", "rows": [["집행위 제안", 12, "c"], ["합의안(면제 신청 없음)", 6, "a"], ["합의안(안전 문제로 면제 거부)", 3, "b"]]}, "shift": null, "table": null, "src": "유럽의회 EPRS · CIRS Vol.43 · 서울경제 영문판", "grade": "확인"}, {"tm": "해외 · 일본", "name": "큐텐 재팬(이베이 재팬)", "co": "일본 · 서울경제 영문판 · 2026.10.01~10.06", "title": "시부야 샘플하우스·세븐일레븐 코너, 오프라인 체험으로 간다", "q": "샘플을 써 본 고객의 20% 이상이 실제로 샀습니다.", "hl": ["20% 이상이"], "pts": ["<b>제품·채널:<\/b> 큐텐 첫 상설 오프라인 체험 공간을 시부야에 10.1 열었다. 약 60개 뷰티 브랜드·약 100종, 그중 K-뷰티(Anua·Medicube·COSRX 등)가 90%. 샘플은 무료.", "<b>숫자:<\/b> 9.17 예약 시작, 첫 주 5,000석 당일 마감. 목표 하루 약 700명·월 약 2만 명. 샘플 고객 80% 이상 리뷰, 20% 이상 구매.", "<b>확장:<\/b> 9.26부터 전국 세븐일레븐 '큐텐 픽' 코너(8개 브랜드·전용 21종), 11.20 하라주쿠 773㎡ 상설 매장 예정.", "<b>시장 상황:<\/b> 일본 온라인 쇼핑 침투율 10.8%로 한국·미국(30% 이상)의 약 3분의 1. 뷰티가 큐텐 매출의 약 70%(회사 주장). 한국→일본 수출 1~9월 8.89억 달러, +8.6%.", "<b>반응:<\/b> 30대 방문객 \"일본 제품보다 유효 성분이 많다\".", "<b>국내와 비교:<\/b> 일본은 아직 오프라인 비중이 커서, 온라인 판매만으로는 한계가 있고 체험 채널이 구매를 끌어낸다."], "nums": [["90", "%", "샘플하우스 브랜드 중 K-뷰티"], ["20", "%+", "샘플 사용 고객 구매율", 1], ["5,000", "석", "첫 주 예약, 당일 마감"], ["773", "㎡", "하라주쿠 상설 매장(11.20 예정)"]], "bars": {"t": "온라인 쇼핑 침투율", "u": "%", "rows": [["일본(작년)", 10.8, "a"], ["한국·미국(이상)", 30, "c"]]}, "shift": null, "table": null, "src": "서울경제 영문판 2026.10.06", "grade": "확인"}, {"tm": "해외 · 일본", "name": "궁중비책", "co": "일본 · 서울경제 영문판 · 2026.06.24", "title": "선스크린이 큐텐 메가와리 매출의 약 70%", "q": "대표 상품 하나가 행사 매출의 3분의 2 이상을 만들었습니다.", "hl": ["대표 상품 하나가"], "pts": ["<b>제품:<\/b> 선케어가 6월 큐텐 메가와리(일본 최대 온라인 할인 행사)에서 이 브랜드 매출의 약 69%(기사 제목은 70%)를 차지했다.", "<b>숫자:<\/b> 한 브랜드의 수치이며 시장 전체 수치는 아니다.", "<b>반응:<\/b> 기사 검색 요약만 확인했고 본문은 직접 열어 보지 못했다(추정 등급).", "<b>국내와 비교:<\/b> 해외 행사에서는 여러 상품을 고르게 미는 것보다 대표 상품 하나에 집중하는 방식이 통한 사례다."], "nums": [["69", "%", "메가와리 매출 중 선케어 비중(제목 70%)", 1]], "bars": null, "shift": null, "table": null, "src": "서울경제 영문판 2026.06.24(검색 요약)", "grade": "추정"}], "flow": [{"k": "독이 있나보다 얼마나 닿나", "d": "유해성이 아니라 실제 사용량·노출로 위해성을 판단한다", "who": [1, 5, 6, 10, 12, 13]}, {"k": "동물실험 대체가 방향, 만능은 아님", "d": "국소 독성은 진전, 전신 독성은 한계. 기술과 규제 수용은 다른 문제", "who": [9, 10, 14, 6, 13]}, {"k": "한 나라 통과가 다른 나라 통과가 아니다", "d": "EU→영국, EU·한국→호주·뉴질랜드 모두 따로 검토. 해외 소식에서도 미국·중국·EU가 각자 다른 속도", "who": [3, 7, 2, 17, 16]}, {"k": "기획부터 출시 뒤까지 한 줄 관리", "d": "개발 초기 원료 검토에서 제품정보파일·시판 후 감시까지 이어 관리", "who": [1, 8, 5, 7, 2, 15]}, {"k": "포장·환경 표시가 새 규제 축", "d": "PFAS·포장 규정·환경 표시가 원료와 마케팅 문구까지 바꾼다. 국내 발표와 EU 그린 클레임 시행이 같은 방향", "who": [4, 7, 3, 17]}, {"k": "2028년 한국 제도가 배경", "d": "안전성 평가 제도 시행을 앞두고 국내 대응 수준을 높일 계기", "who": [1, 6, 8]}], "flowHeadline": "국내 발표와 해외 소식이 같은 곳을 가리켰다: 실제 노출로 입증하고, 나라마다 따로 맞춘다", "apply": [{"k": "제품마다 '안전 자료 서류철'을 미리 묶어 둔다", "p": "우선", "d": "화장품의 제품정보파일처럼 요실금팬티·생리팬티·고관절보호대마다 원단 사양·시험 성적서·표시 문구·허가 서류를 한 폴더로 묶는다. 출시 뒤 들어온 고객 불만·이상 사례도 같은 폴더에 이어 적어, 해외 판매나 기관 납품 때 바로 꺼낼 수 있게 한다.", "r": "① 이정표 · ⑤ Mukerji · ⑦ Liang", "who": "3본부 김등재 · 4본부"}, {"k": "원단·성분 문의에 '있다/없다' 대신 '얼마나 닿나'로 답한다", "p": "우선", "d": "생리팬티·요실금팬티는 피부에 오래 닿는 제품이다. 고객이 원단 성분을 물으면 성분 이름만 답하지 말고 시험 성적서 기준과 사용 조건을 함께 안내하는 응대 문구를 만든다. 효능·안전을 단정하는 표현은 쓰지 않고 시험 결과 그대로만 적는다.", "r": "⑥ 배옥남 · ⑩ Andres · ⑫ Choi", "who": "4본부 · 2본부 쇼핑몰팀"}, {"k": "해외 판매 규제표에 '나라별 따로' 칸을 둔다", "p": "검토", "d": "한 나라 기준을 맞췄다고 다른 나라가 자동 통과되지 않는다는 발표가 여러 개였다. 일본·미국·EU를 검토할 때 나라마다 표시 문구·원료·책임자 지정 칸을 따로 만들고, 방수·발수 원단은 공급사에 PFAS 사용 여부 확인서를 받아 둔다(우리 판단, 화장품 규제를 그대로 옮긴 것은 아님).", "r": "③ Nunez · ④ Bassoni · ⑦ Liang · ⑰ EU", "who": "3본부 김등재 · 일본 수출 담당"}, {"k": "해외 상세페이지에서 근거 없는 '친환경·자연' 표현을 뺀다", "p": "검토", "d": "EU는 9월 27일부터 근거 없는 'natural'·'sustainable' 같은 일반 표현을 금지했다. 해외 판매 상세페이지·광고 문구에 이런 말이 있는지 찾아, 시험이나 인증으로 뒷받침되는 표현만 남긴다.", "r": "④ Bassoni · ⑰ EU", "who": "2본부 광고·콘텐츠팀 · 일본 수출 담당"}, {"k": "일본 판매는 '써 보게 하는 동선'을 함께 본다", "p": "검토", "d": "큐텐 샘플하우스는 샘플을 써 본 고객의 20% 이상이 샀다. 일본은 온라인 쇼 으면 독성 걱정이 낮다고 보는 기준값.", "why": "자료가 부족한 성분도 농도를 낮춰 안전을 입증할 수 있다는 개념이다."}, {"term": "in vitro / in silico", "easy": "in vitro는 시험관 속 세포로 하는 시험, in silico는 컴퓨터로 하는 예측.", "why": "시험 성적서를 받을 때 어떤 방식의 시험인지 구분하는 말이다.", "video": {"title": "화장품 등 안전성평가를 위한 동물대체시험법 [kDPRA]", "url": "https://www.youtube.com/watch?v=8nSYLJKLcFg"}}, {"term": "AOP · IATA · WoE", "easy": "AOP는 독성이 생기는 경로, IATA는 여러 시험을 묶어 판단하는 틀, WoE는 증거를 모아 무게를 따지는 판단.", "why": "안전은 시험 한 장이 아니라 근거 묶음으로 판단한다는 뜻이다."}, {"term": "MoCRA", "easy": "미국 화장품 규제 현대화법(2022.12.29 제정). 시설 등록·제품 목록·안전성 입증·리콜을 정한다.", "why": "미국에서 화장품을 팔려면 지켜야 하는 법. 미국 판매처 확장을 검토할 때 참고한다.", "video": {"title": "MoCRA 모크라 Modernization of Cosmetics Regulation Act란? (MoCRA #01)", "url": "https://www.youtube.com/watch?v=LG2IvGE-2sQ"}}, {"term": "PIF (제품정보파일)", "easy": "처방·시험·안전성 자료를 제품별로 모아 둔 서류철.", "why": "우리 제품도 같은 방식으로 제품별 자료 폴더를 만들어 두면 해외·기관 대응이 빨라진다.", "video": {"title": "인허가 제도 최신 업데이트 '미국' - EP02. MoCRA 규정 개요", "url": "https://www.youtube.com/watch?v=jemubDJhWNo"}}, {"term": "SCCS", "easy": "EU의 소비자안전과학위원회. 성분이 안전한지 과학적 의견을 낸다.", "why": "EU 성분 규제가 왜 바뀌는지 알려면 이 위원회 의견을 보면 된다."}, {"term": "PFAS", "easy": "자연에서 잘 분해되지 않는 불소 화합물. '영원한 화학물질'이라고도 부른다.", "why": "방수·발수 원단이나 포장재 공급사에 사용 여부를 확인해 둘 항목이다."}, {"term": "CMR 물질", "easy": "암을 일으키거나(C), 유전자를 바꾸거나(M), 생식에 해를 줄(R) 수 있다고 분류된 물질.", "why": "EU가 금지 뒤 전환 기간을 줄이는 대상이라 해외 판매 원료 점검의 첫 항목이다."}, {"term": "그린 클레임", "easy": "'친환경·자연·지속가능' 같은 환경 관련 홍보 문구. EU는 근거 없는 일반 표현을 금지했다.", "why": "해외 상세페이지·광고 문구를 쓸 때 근거가 있는 표현만 남겨야 한다."}, {"term": "ASEAN 화장품 지침(ACD)", "easy": "동남아 여러 나라가 함께 쓰는 화장품 규정.", "why": "동남아로 판매를 넓힐 때 기준이 되는 규정이다."}]}</script>
