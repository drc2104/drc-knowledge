·콘텐츠팀"}, {"k": "[가격 행사] 첫 구매 '체험 구매' 구조 검토", "p": "검토", "d": "Piper는 첫 주문 1인 1장, 30일 안 환불·교환으로 처음 사는 문턱을 낮췄다. 값이 있는 다회용 팬티의 구매 장벽을 낮추는 체험 구매 조건을 검토한다.", "r": "⑤ Piper", "who": "2본부 쇼핑몰팀 · 4본부 제품·출시팀"}, {"k": "[제품] 사양표에 흡수량 mL(cc)와 두께를 함께 표기", "p": "우선", "d": "일본 순위 사이트와 베트남 캐린이 모두 흡수량을 mL로 적는다. 요실금·생리팬티 사양표와 일본 수출 상세에 흡수량 mL와 흡수층 두께를 같은 단위로 적는다. 직접 시험한 값만 쓴다.", "r": "② 캐린 · ⑥ 일본 순위", "who": "4본부 제품·출시팀 · 일본 수출 담당"}, {"k": "[원단 시험] 흡수 층 구조 3~4종 흡수량·건조 시간 시험", "p": "검토", "d": "얇은 코어로 흡수량을 지키는 것이 해외 제품의 공통 소구점이다. 흡수 층 구조 3~4종을 골라 흡수량과 건조 시간을 시험 기관에 의뢰한다(흡한속건 시험 영상 참고).", "r": "② 캐린 · ⑥ 일본 순위", "who": "4본부 제품·출시팀"}, {"k": "[마케팅] 오버나이트 생리팬티의 '밤용' 소구 자료 정리", "p": "유지", "d": "중국 쌍11에서 밤용 팬티형이 553만 건 팔렸다. 밤용 수요를 보여 주는 자료로 정리하되, 일회용 수치라는 점을 반드시 함께 적는다.", "r": "③ 티몰", "who": "4본부 · 2본부 광고·콘텐츠팀"}, {"k": "[마케팅] 방송·유명인 광고는 단계별로 투자", "p": "유지", "d": "유명인 브랜드도 방송 노출 뒤 적자를 말했다. 방송·유명인 광고는 작은 규모로 먼저 하고, 매출이 이어지는지 확인한 뒤 늘리는 기준을 둔다.", "r": "④ 송지효 브랜드", "who": "2본부 광고·콘텐츠팀"}, {"k": "[제품] 상세페이지 맨 위에 기능 문구, 착용 안내는 그림으로", "p": "검토", "d": "3,000원 균일가 팬티와 값으로 비교되지 않도록 누수 방지·흡수량을 상세페이지 맨 위에 둔다. 유한킴벌리 교육 팬티처럼 패드·흡수 부위 위치를 그림으로 보여 주는 착용 안내도 고령 고객용으로 시안을 만든다.", "r": "⑦ 롯데마트 · ⑧ 유한킴벌리", "who": "2본부 쇼핑몰팀 · 4본부 제품·출시팀"}], "glossary": [{"term": "흡수량(mL·cc)", "easy": "속옷이 한 번에 머금을 수 있는 액체의 양.", "why": "일본·베트남 제품이 mL로 비교한다. 우리도 같은 단위로 적어야 비교에 들어간다.", "video": {"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=0LNcwPHSLFc"}}, {"term": "가셋 (기저 겉감)", "easy": "팬티 가랑이 부분에 덧댄 흡수 층.", "why": "다회용 생리·요실금팬티의 핵심 부품이다.", "video": {"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=0LNcwPHSLFc"}}, {"term": "흡한속건", "easy": "땀을 빨아들이고 빨리 마르게 하는 성질.", "why": "원단 시험 의뢰 때 넣을 항목이다.", "video": {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0"}}, {"term": "투습 방수막 (라미네이트)", "easy": "물은 막고 수증기는 통과시키는 얇은 막.", "why": "팬티 맨 바깥층이다. 불소 화학물질 규제와 이어진다."}, {"term": "PFAS", "easy": "물·기름을 튕겨 내는 불소 계열 화학물질.", "why": "뉴욕주·EU 규제 대상(11.06 보고). 방수층 소재를 고를 때 확인한다."}, {"term": "심리스 (무봉제)", "easy": "봉제선 없이 짜서 만든 속옷.", "why": "브라·팬티 착용감과 겉옷에 비치지 않는 점의 기본 조건이다."}, {"term": "노와이어 브라", "easy": "철사(와이어)가 없는 브라.", "why": "국내 지그재그 행사와 리무브 신제품에서 보이는 흐름이다."}, {"term": "텐셀 라이오셀", "easy": "나무 펄프로 만든 부드러운 섬유.", "why": "면을 대신하는 속옷 안감 소재다.", "video": {"title": "The TENCEL(tm) Lyocell story - 3 of 5 The Process", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4"}}, {"term": "혼용률", "easy": "한 원단에 섞인 섬유의 비율.", "why": "상세페이지에 꼭 적어야 하는 표기 항목이다."}, {"term": "MOQ", "easy": "원단 업체가 받는 최소 주문 수량.", "why": "새 소재 견본을 요청할 때 먼저 확인한다."}, {"term": "g/㎡", "easy": "원단 1㎡의 무게.", "why": "두께·흡수 비교의 기준 숫자다."}, {"term": "오픈가격", "easy": "제조사가 소비자가를 정하지 않고 판매점이 값을 정하는 방식.", "why": "일본 다이오제지 요실금팬티가 쓰는 방식이라 수출 가격을 정할 때 참고한다."}, {"term": "쌍11", "easy": "매년 11월 11일 열리는 중국 최대 쇼핑 행사.", "why": "중국 판매 수치를 확인하는 시점이다."}, {"term": "안수이쿠 (安睡裤)", "easy": "밤에 입는 팬티 모양 생리·안심 제품(중국 이름).", "why": "쌍11 대량 품목이다. 우리 오버나이트 생리팬티의 비교 대상이다(일회용 계열로 추정)."}], "glossaryHeadline": "흡수량 단위, 누수 방지 층, 원단 시험, 중국·일본 시장에 나오는 말을 쉽게 풀었습니다", "media": {"headline": "누수 방지 속옷 구조, 흡한속건 시험, 흡수·건조 비교, 텐셀 공정, 초경량 나일론 설명 영상 6편을 붙였습니다 (제목·채널만 확인)", "videos": [{"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=0LNcwPHSLFc", "len": "길이 미확인", "note": "Little Onion Cloth · 누수 방지 속옷 층 구조를 뜯어 보여 줌(제품·제작 시기 미확인)"}, {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0", "len": "길이 미확인", "note": "KATRI시험연구원 · 흡한속건 시험 방법"}, {"title": "[품질] 스포츠 의류의 기능성, 흡습, 속건?!", "url": "https://www.youtube.com/watch?v=roj9MmUZWIQ", "len": "길이 미확인", "note": "롯데홈쇼핑 바로알기 · 흡습·속건을 쉽게 설명"}, {"title": "[아크테릭스] 페이징원단 수분 흡수건조력 테스트 - Phasic Material Water Drop", "url": "https://www.youtube.com/watch?v=3GvXW-WsYeU", "len": "길이 미확인", "note": "Arc'teryx Korea · 물방울로 흡수·건조를 보여 주는 시연(업체 영상)"}, {"title": "The TENCEL(tm) Lyocell story - 3 of 5 The Process", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4", "len
