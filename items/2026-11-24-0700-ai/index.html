다.", "r": "⑥ Agent 365 · ② 나델라", "who": "2본부 전략·숫자팀"}, {"k": "작업별로 비싼 모델과 싼 모델 나눠 쓰기", "p": "검토", "d": "기획·판단은 상위 모델, 분류·요약·번역 같은 반복 작업은 값싼 모델로 나눈다. 100만 토큰당 입력 값이 0.3달러에서 8달러까지 차이 난다. 다만 중국 모델은 고객 정보가 들어가지 않는 작업에만 시험한다.", "r": "⑭ Anthropic · ⑮ 중국 · ⑦ 모델", "who": "1본부 · 2본부"}, {"k": "제품 사양·자주 묻는 질문을 AI가 읽는 문서로 모으기", "p": "검토", "d": "Microsoft IQ의 핵심은 '회사 자료를 AI에 잇는 층'이다. 요실금팬티·고관절보호대의 사양, 사용법, 자주 묻는 질문, 급여 안내를 그림이 아닌 글자 문서로 한곳에 정리해 두면 응대·콘텐츠 에이전트가 같은 자료로 일한다. 효능 표현은 허가 범위 안의 문구만 넣는다.", "r": "⑤ Microsoft IQ · ④ Copilot", "who": "2본부 · 3본부"}, {"k": "쇼핑몰 문의 1차 분류는 에이전트, 답은 사람 승인", "p": "검토", "d": "Copilot에 고객서비스 스킬 13개가 생겼고, 국내에서도 콜센터 사례가 나왔다. 쿠팡·스마트스토어 문의를 배송·사이즈·교환·제품 질문으로 먼저 나누는 일만 에이전트에 맡기고, 답변 발송은 사람이 승인한다.", "r": "④ Copilot · ① 세일즈포스", "who": "2본부 쇼핑몰팀"}, {"k": "브라우저에서 반복하는 관리자 화면 작업 기록하기", "p": "검토", "d": "업무의 약 85%가 브라우저에서 이뤄진다는 발표처럼, 쇼핑몰 관리자 화면의 반복 작업(가격·재고 확인, 주문 내려받기)을 단계별로 적어 두면 에이전트에게 넘길 후보 목록이 된다.", "r": "⑪ Edge for Business", "who": "2본부 쇼핑몰팀"}, {"k": "새 AI 기능은 '정식 출시' 확인 뒤에 들이기", "p": "유지", "d": "발표 기능 215개 중 정식 출시는 35%다. 업체 발표만 보고 유료 계약하지 않고, 정식 출시 여부·가격·한국어 지원을 확인한 뒤 작은 시험부터 한다. 지금 하던 '시험 후 판정' 방식과 같다.", "r": "④ Copilot · ⑥ Agent 365 · ⑪ Edge", "who": "전사"}], "glossaryHeadline": "에이전트 관리 시대에 알아 둘 말 14개", "glossary": [{"term": "AI 에이전트", "easy": "시키면 여러 단계를 스스로 하는 AI 직원.", "why": "쇼핑몰 주문·고객 응대·콘텐츠 제작 자동화의 후보다.", "video": {"title": "AI 에이전트는 어떻게 작동할까? 생성형 AI가 스스로 일하는 원리", "url": "https://www.youtube.com/watch?v=m5QKxe05eho"}}, {"term": "에이전틱 AI", "easy": "답만 하는 AI가 아니라 목표를 받고 스스로 계획·실행하는 AI 방식.", "why": "Ignite 발표 대부분이 이 방식의 AI를 회사에서 어떻게 관리하느냐에 관한 것이다.", "video": {"title": "[AI·ICT 백과사전] 에이전틱 AI (Agentic AI)", "url": "https://www.youtube.com/watch?v=MQDXJudNCWA"}}, {"term": "AI 에이전트 도입", "easy": "AI에게 한 번 묻고 끝내는 대신 업무 한 과정을 통째로 맡기는 것.", "why": "맡길수록 권한·비용 관리가 필요해진다는 이번 행사의 결론과 이어진다.", "video": {"title": "AI 에이전트는 기업의 일하는 방식을 어떻게 바꾸는가? : AI·ICT Leaders", "url": "https://www.youtube.com/watch?v=A-anMNdl1Tw"}}, {"term": "Agent 365", "easy": "회사 안 AI 직원의 명부
