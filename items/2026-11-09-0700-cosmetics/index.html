<script id="item-data" type="application/json">{"id": "2026-11-09-0700-cosmetics", "date": "2026-11-09", "slot": "07:00", "topic": "화장품 시장", "type": "세미나 발표 + 해외 소식", "title": "차세대 화장품 기술·K-뷰티 혁신 전략 세미나 정리", "subtitle": "롱제비티·PDRN·필라그린, 미국 규제, 수출 경쟁 · 국내 발표 6개 · 해외 6개", "event": {"name": "차세대 화장품 기술과 글로벌 K-뷰티 혁신 전략 세미나", "host": "주최 충청북도·청주시·(재)오송바이오진흥재단 / 주관 충북화장품산업협회", "when": "2026.10.23(금), 시작·종료 시각 미공개", "where": "청주 오스코(OSCO) 컨퍼런스홀", "theme": "롱제비티·PDRN·필라그린 최신 연구, 미국 FDA OTC 대응, 바이오인캡슐레이션, 하이브리드 제형 (2026 오송화장품뷰티엑스포 연계)"}, "headline": "화장품 경쟁은 이제 유행 성분이 아니라 숫자로 증명하는 싸움이다", "hl": ["숫자로", "증명하는"], "summary3": [["원료 회사들이 모두 시험 숫자를 들고 나왔다.", "롱제비티·PDRN·필라그린 3개 발표가 모두 4주 인체 적용 시험 결과를 냈다(피부 치밀도 17.73% 증가, 눈가 주름 개선율 7.26%, 건조 부위 수분 158.9% 증가). 다만 전부 회사 자체 발표값이다."], ["제품력은 성분을 지켜 전달하는 기술과 규제 통과에서 갈린다.", "한국콜마는 스킨케어와 메이크업을 합친 제형을 핵심 흐름으로 꼽았고, 메이크업 성분 검색량이 전년보다 150% 이상 늘었다고 했다. 미국 OTC 시장은 제조·시험 단계부터 규정에 맞춰야 한다."], ["해외에서는 한국이 프랑스를 월별로 앞서기 시작했다.", "2026년 상반기 수출은 한국 약 7.9857조 원(+25.0%), 프랑스 약 9.2798조 원(-0.6%). 4월·5월은 한국이 앞섰다. 유럽은 10월 10일부터 PFHxA 합계 25 ppb 제한을 시행했다."]], "cases": [["사례(회사 자체 시험)", "숫자"], ["피세놀라임 3% 크림, 4주 인체 적용 시험", "피부 치밀도 +17.73%"], ["PDRNex Glow 1% 아이크림, 22명 4주 시험", "눈가 주름 개선율 7.26% (대조군의 1.91배)"], ["KTP1-Filagreen 1% 크림, 4주 시험", "건조 부위 수분 +158.9% · 21명 중 14명 가려움 소실"]], "shift": {"from": "프랑스", "to": "한국", "cap": "스킨케어 등(HS 330499) 월별 수출 선두. 2026년 상반기 합계는 프랑스가 272억 원 앞섰지만 4~6월은 3개월 연속 한국이 앞섰다 (아시아경제 2026.08.21)"}, "chart": {"t": "2026년 상반기 화장품 수출 (HS 3304 기준, 조 원 환산, 아시아경제 2026.08.21)", "u": "조 원", "rows": [["프랑스 (-0.6%)", 9.2798, "b"], ["한국 (+25.0%)", 7.9857, "a"]]}, "keynums": [["25.0", "%", "2026 상반기 한국 화장품 수출 증가(HS 3304)", 1], ["4", "주", "원료 3사가 공통으로 낸 인체 적용 시험 기간"], ["14,299", "곳", "미국 MoCRA 활성 시설 등록(2026.01.06)"], ["25", "ppb", "EU PFHxA 합계 상한(2026.10.10 시행)", 1]], "overviewNote": "국내 발표 숫자 출처는 코스인코리아 현장 기사(2026.10.25)입니다. 발표자료 PDF는 찾지 못했고 발표별 시각도 공개되지 않아 기사의 발표 순서로 적었습니다. 효능 수치는 모두 연사(회사) 발표값입니다. 참석은 국내외 화장품 산업 관계자 200여 명, 사회는 조현대 (주)휴리그 대표. 김홍숙 충북화장품산업협회장은 과학적 근거에 기반한 기술 혁신과 시장 신뢰 확보를, 장우성 충북도 바이오식품의약국장은 지역 기업 지속 지원을 말했습니다. 같은 기간 엑스포(10.22~24)에서는 아모레퍼시픽 부스의 AI 피부진단·맞춤형 스킨케어·5년 후 피부 변화 가상 시뮬레이션이 주목받았습니다. 해외 소식은 30일 안의 소식이 일부뿐이라 6개월까지 넓혔고 날짜를 표기했습니다.", "sectionLabel": "발표", "sections": [{"tm": "발표 1", "name": "이정노", "co": "(주)코씨드바이오팜 연구소장", "title": "화장품 트렌드, 롱제비티 뷰티", "q": "젊어 보이는 데 그치지 않고 피부 노화의 원리에 접근해 장기적인 피부 건강을 추구하는 흐름입니다.", "hl": ["장기적인", "피부"], "pts": ["<b>바뀐 초점:<\/b> 겉으로 젊어 보이게 하는 데서 나아가 피부 노화의 생물학적 원리에 접근해 오래 가는 피부 건강을 노린다.", "<b>증명 방법:<\/b> 노화 바이오마커(노화 정도를 재는 지표)와 임상 검증에 바탕을 둔 과학적 접근이 중요하다고 강조했다.", "<b>자사 원료 피세놀라임(Fisenolyme):<\/b> 라임 유래 피세틴 1,000ppm 함유. 노화 세포를 골라 없애는 세놀리틱 방식이다.", "<b>회사 시험값:<\/b> 세포 노화 지표 p21 약 43% 감소. 3% 함유 크림 4주 인체 적용 시험에서 피부 치밀도 17.73% 증가, 주름 관련 효소 MMP-1 74.3% 억제.", "<b>읽을 때 주의:<\/b> 효능 수치는 회사 발표값이며 독립 검증이 아니다."], "bars": {"t": "피세놀라임 회사 시험값 (서로 다른 지표)", "u": "%", "rows": [["MMP-1 억제", 74.3, "a"], ["p21 감소", 43, "b"], ["피부 치밀도 증가", 17.73, "c"]]}, "nums": [["1,000", "ppm", "라임 유래 피세틴 함유량"], ["4", "주", "3% 크림 인체 적용 시험 기간"]], "src": "코스인코리아 no=58573 (회사 발표값)", "grade": "확인"}, {"tm": "발표 2", "name": "배준태", "co": "(주)제이투케이바이오 연구소장", "title": "미생물 유래 PDRN, 항노화 소재로서의 가능성", "q": "연어 등 동물성 위주였던 PDRN의 한계를 미생물 유래로 넘습니다.", "hl": ["미생물"], "pts": ["<b>문제의식:<\/b> 연어 등 동물성 위주였던 PDRN의 한계를 마이크로바이옴(미생물) 유래로 넘겠다는 접근이다.", "<b>플랫폼:<\/b> 'J2K METABIOME' 플랫폼으로 프리지아 유래 유산균에서 추출한 'PDRNex Glow'(150~500bp)를 소개했다.", "<b>세포 시험값:<\/b> 노화 지표 SA-β-gal 활성 14.91% 억제, 콜라겐 발현 최대 55.08% 증가, 멜라닌 생성 최대 91.87% 억제.", "<b>사람 시험:<\/b> 30~59세 여성 22명 4주 시험에서 1% PDRN 아이크림의 눈가 주름 개선율 7.26%(대조군 대비 1.91배). 만족도 100%, 이상반응 없음.", "<b>읽을 때 주의:<\/b> 22명 소규모 시험이고 회사 발표값이다."], "bars": {"t": "PDRNex Glow 회사 시험값 (서로 다른 지표)", "u": "%", "rows": [["멜라닌 생성 억제(최대)", 91.87, "a"], ["콜라겐 발현 증가(최대)", 55.08, "b"], ["SA-β-gal 활성 억제", 14.91, "c"]]}, "nums": [["7.26", "%", "눈가 주름 개선율", 1], ["1.91", "배", "대조군 대비"], ["22", "명", "시험 참여자(30~59세 여성)"]], "src": "코스인코리아 no=58573 (회사 발표값, 22명 소규모 시험)", "grade": "확인"}, {"tm": "발표 3", "name": "함문선", "co": "(주)키프로젠 대표", "title": "세라마이드를 넘어, 필라그린까지: KTP1-Filagreen", "q": "세포 사이 지질 보강에서 나아가 수분을 지키는 핵심 단백질 필라그린에 주목합니다.", "hl": ["필라그린에"], "pts": ["<b>관점 전환:<\/b> 세포 간 지질(세라마이드)을 보강하는 데서 나아가 각질세포를 강화하고 수분을 지키는 핵심 단백질 필라그린에 주목했다.", "<b>원료 구조:<\/b> 피부 투과 도메인 KTP1을 필라그린 단편과 융합한 재조합 원료다.", "<b>실험실 값:<\/b> 일반 필라그린보다 피부 투과율 72% 향상. 아토피 유발 인공피부 모델에서 필라그린 발현 약 49.9% 회복.", "<b>사람 시험:<\/b> 1% 크림 4주 시험에서 건조 부위 수분 평균 158.9% 증가, 가려움 평균 87.3% 감소. 참여자 21명 중 14명이 가려움 완전 소실.", "<b>읽을 때 주의:<\/b> 회사 발표값이며, 화장품 원료 시험 결과를 질환 치료 효과로 읽으면 안 된다."], "bars": {"t": "KTP1-Filagreen 회사 시험값 (서로 다른 지표)", "u": "%", "rows": [["건조 부위 수분 증가", 158.9, "a"], ["가려움 감소", 87.3, "b"], ["피부 투과율 향상", 72, "c"], ["필라그린 발현 회복", 49.9, "c"]]}, "nums": [["158.9", "%", "건조 부위 수분 평균 증가", 1], ["14/21", "명", "가려움 완전 소실"]], "src": "코스인코리아 no=58573 (회사 발표값)", "grade": "확인"}, {"tm": "발표 4", "name": "Patrick C. Okoye(패트릭 C. 오코예)", "co": "카사바파마(Cassava Pharma USA) CEO", "title": "글로벌에서 미국 시장까지: FDA 요건 하에서 OTC 제품을 성공적으로 출시하는 실용 가이드", "q": "미국 FDA는 OTC 자외선 차단제와 여드름 완화 제품 등에 대해 제품 유형별로 허용되는 제형과 활성 성분, 배합 기준 등을 규정하고 있다.", "hl": ["제형과", "활성"], "pts": ["<b>기본 조건:<\/b> 미국 OTC 출시는 cGMP(현행 우수 의약품 제조·품질관리기준)와 규제 대응 전략을 지켜야 한다.", "<b>일관된 체계:<\/b> 개발·제조 단계부터 규정을 고려해 원료 관리부터 최종 품질 검증까지 하나로 이어져야 한다.", "<b>품질 시험:<\/b> 반복 첩포 시험(RIPT), 방부력 시험(PET), SPF 시험을 거친다.", "<b>출시 준비:<\/b> 시생산과 공정 검증, 가속·실온 안정성 시험으로 사용기한을 정하고 의약품 정보(Drug Facts) 표시를 맞춘다.", "<b>실무:<\/b> GMP 교육 담당 체계, 공급업체 품질계약, 적격 공급업체 선정이 필요하다.", "<b>구분:<\/b> 국제뉴스는 세미나에서 MoCRA·FDA OTC 개정 대응도 다뤘다고 요약했으나, 코스인 연사별 기사에는 MoCRA 언급이 없다."], "table": [["단계", "해야 할 일"], ["표시", "의약품 정보(Drug Facts) 라벨링"], ["안전·품질 시험", "RIPT · PET · SPF 시험"], ["생산 검증", "시생산 · 공정 검증"], ["사용기한", "가속 · 실온 안정성 시험"], ["공급망", "공급업체 품질계약 · 적격 공급업체 선정"]], "video": {"title": "MoCRA 모크라 Modernization of Cosmetics Regulation Act란? (MoCRA #01)", "url": "https://www.youtube.com/watch?v=LG2IvGE-2sQ"}, "src": "코스인코리아 no=58573 · 국제뉴스 2026.10.23(MoCRA 요약)", "grade": "확인"}, {"tm": "발표 5", "name": "지홍근", "co": "(주)에이치엔에이파마켐 CTO", "title": "화장품과 바이오인캡슐레이션", "q": "성분을 산소·수분 등 외부 환경에서 보호해 목표 부위에 전달하는 기술입니다.", "hl": ["보호해", "전달하는"], "pts": ["<b>무엇을 하나:<\/b> 성분을 산소·수분 등 외부 환경에서 보호해 목표 부위에 전달한다.", "<b>얻는 것:<\/b> 변질을 막고 성분끼리 주고받는 영향을 줄여 안정성을 유지한다.", "<b>방출 조절:<\/b> pH·온도·효소 조건에 따라 성분이 풀리는 속도와 시점을 조절한다.", "<b>운반체 종류:<\/b> 리포좀, 나노에멀션, 고체 지질 나노입자(SLN), 덴드리머, 사이클로덱스트린, 금속-유기 골격체(MOF). 캡슐 크기는 나노~마이크로.", "<b>제조 공정:<\/b> 성분 혼입, 물리화학적 고형화, 건조, 후가공 순서로 설명했다.", "<b>숫자:<\/b> 기사에 효능 수치는 없다."], "src": "코스인코리아 no=58573", "grade": "확인"}, {"tm": "발표 6", "name": "홍인기", "co": "한국콜마(주) 상무이사", "title": "하이브리드 제형을 통한 뷰티 솔루션", "q": "스킨케어와 메이크업의 경계를 허문 제형 혁신이 뷰티 제품 개발의 핵심 흐름으로 완전히 자리 잡았다.", "hl": ["경계를", "허문"], "pts": ["<b>배경 흐름:<\/b> 친환경, 뉴로코스메틱스, 리버스에이징 트렌드 속에서 스킨케어와 메이크업을 합친 하이브리드 뷰티가 핵심 흐름이다.", "<b>스킨케어:<\/b> 고농도 활성 성분 안정화, 표적 전달 기술, 캡슐 시각 효과.", "<b>메이크업:<\/b> 사용감을 분석하는 센서리 매핑, 투명 앰플 속 파운데이션을 안정화하는 '에어 드롭'.", "<b>선케어:<\/b> 광 적응형 부스터, 다중 자외선 차단.", "<b>숫자:<\/b> 메이크업 제품 내 성분 관련 검색량이 전년보다 150% 이상 급증(연사 언급, 집계 출처 미표기)."], "nums": [["150", "%+", "메이크업 성분 검색량 전년 대비 증가(집계 출처 미표기)", 1]], "table": [["분야", "한국콜마 사례"], ["스킨케어", "고농도 활성 성분 안정화 · 표적 전달 · 캡슐 시각 효과"], ["메이크업", "센서리 매핑 · 에어 드롭"], ["선케어", "광 적응형 부스터 · 다중 자외선 차단"]], "src": "코스인코리아 no=58573", "grade": "확인"}, {"tm": "해외 · 일본", "name": "야노경제연구소", "co": "일본 · 시장조사 보도자료 · 2026.10.16", "title": "일본 화장품 시장 2026: 인구가 줄어도 고부가가치로 성장", "q": "인구 감소 속 성장은 주로 고부가가치화 덕분입니다.", "hl": ["고부가가치화"], "pts": ["<b>시장 상황:<\/b> 2025년도 일본 화장품 시장은 제조사 출하금액 기준 2조 6,430억 엔(전년도 대비 102.4%). 2030년도 전망은 2조 7,450억 엔(2025년도 대비 103.9%).", "<b>성장 요인:<\/b> 성분·효과 중시, 기능성과 사용감을 함께 맞추는 처방 기술, 원재료비 상승에 따른 가격 개정, 방일객 수요 회복.", "<b>숫자:<\/b> 스킨케어 46.2%(1조 2,220억 엔), 메이크업 19.7%(5,210억 엔), 헤어케어 19.5%(5,150억 엔), 남성 5.1%(1,360억 엔), 향수 1.6%(430억 엔).", "<b>반응:<\/b> 방일라보(訪日ラボ)는 2030년 키워드 6개로 롱제비티, 스키니피케이션, 더마코스메, 에포트리스, 기후적응형 화장품, 뉴로코스메틱스를 소개했다.", "<b>국내와 비교:<\/b> 일본도 롱제비티가 2030 키워드로 오송 발표 1과 같은 방향이다. 다만 시장 자체는 전년도 대비 2.4% 성장, 2030년까지 5년을 합쳐도 3.9% 성장 전망이라 상반기 수출이 25.0% 늘어난 한국과 달리 느린 시장이다. 오송 엑스포에서는 일본 마루이그룹·이토요카도 등이 참가기업과 1대1 수출상담회를 열었다."], "bars": {"t": "일본 화장품 시장 카테고리 비중 (2025년도)", "u": "%", "rows": [["스킨케어", 46.2, "a"], ["메이크업", 19.7, "b"], ["헤어케어", 19.5, "b"], ["남성", 5.1, "c"], ["향수", 1.6, "c"]]}, "nums": [["2조 6,430억", "엔", "2025년도 시장(전년도 대비 102.4%)", 1], ["2조 7,450억", "엔", "2030년도 전망(2025년도 대비 103.9%)"]], "src": "야노경제연구소 보도자료 press_id 4207 · 방일라보 2026.10.28(2차 소개)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "미국 FDA · MoCRA", "co": "미국 · Foley & Lardner 해설 · 2026.03.12 (수치 기준 2026.01.06)", "title": "MoCRA 시행 현황: 시설 1만 4천여 곳, 제품 99만여 건 등록", "q": "미국에 팔려면 시설 등록과 제품 목록 제출이 기본입니다.", "hl": ["시설", "등록과"], "pts": ["<b>시장 상황:<\/b> 시설 등록·제품 목록이 의무다. 시설 등록은 2023.12.29부터 적용되고 2년마다 갱신한다. FDA에 리콜 명령권이 생겼고 이상반응 보고·안전성 기록 보관도 의무다.", "<b>숫자:<\/b> 고유 활성 시설 등록 14,299곳, 고유 활성 제품 목록 992,907건(2026.01.06 기준).", "<b>남은 규칙:<\/b> 2025.12.29 FDA PFAS 평가 보고서는 안전성 판단을 내리지 못했다. GMP 최종 규칙·향료 알레르겐 규칙은 해설 시점에 미발표였고 이후 상태는 확인하지 못했다.", "<b>반응:<\/b> 로펌 해설을 기준으로 정리했으며 FDA 원문이 아니다. 업계 반응은 이번 조사에서 확인하지 못했다.", "<b>국내와 비교:<\/b> 국내 업체가 미국으로 팔 때 필요한 기본 등록이며, 오송 발표 4의 OTC 요건과 이어진다."], "nums": [["14,299", "곳", "고유 활성 시설 등록", 1], ["992,907", "건", "고유 활성 제품 목록"]], "video": {"title": "MoCRA 모크라 Modernization of Cosmetics Regulation Act란? (MoCRA #01)", "url": "https://www.youtube.com/watch?v=LG2IvGE-2sQ"}, "src": "Foley & Lardner 2026.03 (로펌 해설, FDA 원문 아님)", "grade": "확인"}, {"tm": "해외 · 미국·세계", "name": "올리브영 · K뷰티 수출", "co": "미국·세계 · Personal Care Insights · 2026.06.04", "title": "올리브영 미국 첫 매장과 한국 화장품 수출", "q": "해외 오프라인에서도 K뷰티 전문 매장 진출이 시작됐습니다.", "hl": ["오프라인에서도"], "pts": ["<b>시장 상황:<\/b> 2026년 1분기 한국 화장품 수출은 31억 달러로 전년 동기보다 20% 가까이 늘었다.", "<b>제품:<\/b> 올리브영 미국 첫 매장(캘리포니아 패서디나) 803㎡에 약 400개 브랜드·약 5,000개 제품.", "<b>숫자:<\/b> 2025년 수출 한국 114억 달러(세계 2위), 프랑스 243억 달러.", "<b>반응:<\/b> COSRX Ultra-Light Invisible Sunscreen SPF50+가 독일 아마존 베스트셀러(알로에 잎 물 66%). Dr. Althea 345 Relief Cream은 누적 2,600만 개 이상(회사 주장).", "<b>국내와 비교:<\/b> 해외 오프라인 K뷰티 매장 진출이 시작된 사례다. 가격 정보는 기사에 없다."], "bars": {"t": "2025년 화장품 수출", "u": "억 달러", "rows": [["프랑스", 243, "b"], ["한국", 114, "a"]]}, "nums": [["803", "㎡", "올리브영 미국 첫 매장 면적"], ["400", "개", "입점 브랜드(약)"], ["5,000", "개", "취급 제품(약)"], ["31", "억 달러", "2026 1분기 한국 수출", 1]], "src": "Personal Care Insights 2026.06.04", "grade": "확인"}, {"tm": "해외 · 프랑스", "name": "한국 vs 프랑스 수출", "co": "프랑스 비교 · 아시아경제 영문판 · 2026.08.21 (HS 3304 기준)", "title": "2026 상반기 한국 +25.0%, 프랑스 -0.6%", "q": "한국이 프랑스를 월별로 앞서는 시점이 왔습니다.", "hl": ["월별로"], "pts": ["<b>시장 상황:<\/b> 2026년 상반기 수출은 한국 약 7.9857조 원, 프랑스 약 9.2798조 원으로 프랑스가 약 1.2941조 원 앞섰다. 그러나 4월·5월은 한국이 앞섰다.", "<b>숫자:<\/b> 증감률은 한국 +25.0%, 프랑스 -0.6%.", "<b>스킨케어:<\/b> 스킨케어 등 HS 330499는 한국 약 7.4074조 원, 프랑스 약 7.4346조 원으로 차이가 272억 원이다. 4~6월 3개월 연속 한국이 앞섰다.", "<b>미국 시장:<\/b> 2025년 대미 수출은 한국 약 2.4396조 원(+13%), 프랑스 약 1.4819조 원(-20.3%).", "<b>반응:<\/b> 김경옥 대한화장품협회 글로벌협력본부장은 마스크팩·선케어 등 스킨케어가 강점이라고 말했다.", "<b>국내와 비교:<\/b> 오송 세미나가 강조한 스킨케어 원료·제형 기술이 수출 강점 분야와 겹친다."], "bars": {"t": "2025년 대미 화장품 수출 (조 원 환산)", "u": "조 원", "rows": [["한국 (+13%)", 2.4396, "a"], ["프랑스 (-20.3%)", 1.4819, "b"]]}, "nums": [["272", "억 원", "상반기 스킨케어 수출 한국·프랑스 차이", 1], ["3", "개월", "4~6월 스킨케어 수출 연속 한국 우위"]], "table": [["나라", "지표", "숫자", "기준"], ["한국", "2026 1분기 수출", "31억 달러 (20% 가까이 증가)", "2026.06.04 기사"], ["한국", "2026 상반기 HS 3304 수출", "7.9857조 원 (+25.0%)", "2026.08.21"], ["프랑스", "2026 상반기 HS 3304 수출", "9.2798조 원 (-0.6%)", "2026.08.21"], ["일본", "2025년도 국내 시장", "2조 6,430억 엔 (+2.4%)", "2026.10.16"], ["미국", "MoCRA 등록", "시설 14,299 / 제품 992,907", "2026.01.06"], ["중국", "618 전 채널 / 뷰티", "9,340억 위안(+4.0%) / 뷰티 +11.4%", "2026.06.24"], ["EU", "PFHxA 상한", "25 ppb(합계) / 1,000 ppb(관련 물질)", "2026.10.10 시행"]], "video": {"title": "프랑스 넘어 세계 1위 노린다‥강소기업이 만든 K-뷰티 르네상스 (2026.09.15/뉴스데스크/MBC)", "url": "https://www.youtube.com/watch?v=oM5Uh38IOCQ"}, "src": "아시아경제 영문판 2026.08.21 (AI 번역 기사, 환율 가정은 숫자 정리 참고)", "grade": "확인"}, {"tm": "해외 · EU", "name": "EU 집행위원회 · SCCS", "co": "유럽 · coslaw.eu · 2026.11.06 / 2026.10.20", "title": "PFHxA 제한 시행, 향료 성분 의견, 신규 CMR 8종", "q": "유럽에 팔 제품은 향료까지 포함해 성분을 다시 점검해야 합니다.", "hl": ["향료까지"], "pts": ["<b>시장 상황:<\/b> 2026.10.10부터 PFHxA와 그 염의 합계 25 ppb 이상, 또는 PFHxA 관련 물질 합계 1,000 ppb 이상이면 화장품 포함 제품을 시장에 내놓을 수 없다(EU 규정 2024/2462).", "<b>숫자:<\/b> SCCS(유럽 소비자안전과학위원회) 최종 의견은 Acetophenone 100 ppm까지 안전(성인·3세 이상 어린이), Heliotropin은 성인용 고급 향수에 한해 1.8%까지 안전.", "<b>다음 규제:<\/b> 24th ATP(2025.11.27 WTO 통보)에 티트리 오일, 헬리오트로핀 등 신규 CMR 8종이 포함됐다. CMR이면 화장품에 원칙 금지되고, SCCS가 안전하다고 보면 제한 목록에 들어갈 수 있다.", "<b>반응:<\/b> 업계 반응은 이번 조사에서 확인하지 못했다. 24th ATP 최종 확정 여부도 확인하지 못했다.", "<b>국내와 비교:<\/b> 유럽 수출 제품은 성분(향료 포함)·PFAS 점검이 필요하다. 티트리 오일은 흔한 성분이라 영향 확인 대상이다. 미국 규제를 다룬 오송 발표 4와 같이 규제가 수출의 문턱이라는 신호다."], "nums": [["25", "ppb", "PFHxA와 그 염 합계 상한", 1], ["1,000", "ppb", "PFHxA 관련 물질 합계 상한"], ["100", "ppm", "Acetophenone 안전 판단 한도"], ["1.8", "%", "Heliotropin 안전 판단 한도(성인용 고급 향수)"], ["8", "종", "24th ATP 신규 CMR"]], "src": "coslaw.eu 2026.11.06 · 2026.10.20 · 2026.01.12 (정보 사이트, 법률 자문 아님)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 618 · 쌍11", "co": "중국 · 시간주보·국태해통증권·매일경제신문 · 2026.06.23~11.05", "title": "2026 '618' 뷰티 +11.4%, 쌍11은 신규 브랜드 182개가 상위권", "q": "중국은 가격 할인이 매출을 끌고, 국산 브랜드는 틈새로 갑니다.", "hl": ["가격", "할인이"], "pts": ["<b>시장 상황:<\/b> 618(5.13~6.18) 전 채널 거래액 9,340억 위안(+4.0%), 뷰티 거래액 +11.4%(국태해통증권).", "<b>숫자:<\/b> 플랫폼별 뷰티 거래액 비중은 타오바오·티몰 44.8%, 더우인 31.9%, 징둥 10.7%(시간주보/이관분석 인용). 더우인에서 마오거핑(毛戈平) 거래액 2.77억 위안(+46.44%).", "<b>할인 구조:<\/b> 타오바오·티몰 공식 할인 8.5折에 88VIP 8.7折을 합치면 7.3折, 약 27% 할인이다(折은 정가의 몇 할에 판다는 뜻).", "<b>제품:<\/b> 티몰 뷰티 상위 20개 중 외국 브랜드가 15자리. 1~3위는 스킨수티컬즈(修丽可)·에스티로더(雅诗兰黛)·프로야(珀莱雅).", "<b>반응:<\/b> 티몰 쌍11(11월 11일 할인 행사)에서 입점 5년 미만 신규 브랜드 182개가 업종 상위 10위 안에 들었다. 개인케어에서 Off&Relax 종합 2위, 诗裴丝 18위(국산 헤어케어 1위), 函得仕 재구매 비중 40%. 최종 쌍11 뷰티 실적은 아직 없다.", "<b>국내와 비교:<\/b> 중국은 가격 할인(국가보조금 포함)이 매출을 끌고 국산 브랜드는 틈새로 간다. 한국의 대중국 비중 하락과 맞물린다."], "bars": {"t": "618 플랫폼별 뷰티 거래액 비중 (시간주보/이관분석 인용)", "u": "%", "rows": [["타오바오·티몰", 44.8, "a"], ["더우인", 31.9, "b"], ["징둥", 10.7, "c"]]}, "nums": [["9,340억", "위안", "618 전 채널 거래액(+4.0%)"], ["11.4", "%", "618 뷰티 거래액 증가", 1], ["182", "개", "쌍11 상위 10위 진입 신규 브랜드"], ["40", "%", "函得仕 재구매 비중"]], "src": "동방재부(시간주보 인용) 2026.06.23 · 국태해통증권 발췌 2026.06.24 · 매일경제신문 2026.11.05 (외부 집계 인용, 직접 검증 못 함)", "grade": "확인"}], "flow": [{"k": "과학적 근거와 시험 숫자로 증명", "d": "원료 3사가 4주 인체 적용 시험 수치를 냈고, 미국 진출에도 시험 목록이 붙는다", "who": [1, 2, 3, 4]}, {"k": "국내도 해외도 노화 관리가 키워드", "d": "오송의 롱제비티·PDRN·필라그린과 일본의 2030 키워드 롱제비티가 같은 방향", "who": [1, 2, 3, 7]}, {"k": "성분을 지켜 전달하는 기술이 제품력", "d": "바이오인캡슐레이션과 고농도 활성 성분 안정화·표적 전달은 같은 말", "who": [5, 6]}, {"k": "경계 허물기", "d": "스킨케어와 메이크업의 결합, 화장품과 의약품 규제(OTC)의 겹침", "who": [6, 4]}, {"k": "미국·유럽 규제가 수출의 문턱", "d": "FDA OTC 요건, MoCRA 등록, EU PFHxA 제한까지 국내 발표와 해외 소식이 같은 방향", "who": [4, 8, 11]}, {"k": "K뷰티 수출은 스킨케어가 끌고 간다", "d": "4~6월 스킨케어 수출 한국 우위, 해외 매장 진출, 일본 시장도 스킨케어가 46.2%", "who": [10, 9, 7]}], "flowHeadline": "국내 발표도 해외 소식도 같은 곳을 가리켰다: 근거와 규제", "apply": [{"k": "광고 속 효능 숫자에 시험 조건을 함께 적기", "p": "우선", "d": "이번 발표들은 시험 기간과 함량을 숫자와 함께 냈고, 일부는 참여자 수까지 밝혔다. 요실금팬티·생리팬티 상세페이지와 광고에 쓰는 숫자도 시험 조건과 출처를 함께 적고, 근거를 댈 수 없는 숫자는 뺀다. 의료기기·의약외품은 효능 표현을 광고 전에 규제 담당이 점검한다.", "r": "① 이정노 · ② 배준태 · ③ 함문선", "who": "2본부 · 3본부"}, {"k": "유럽 판로를 검토할 땐 원단 PFAS부터 확인", "p": "검토", "d": "EU는 10월 10일부터 PFHxA 제한을 시행했다. 요실금팬티·생리팬티의 방수 가공 원단에 불소계 물질이 쓰였는지 공급처 확인서를 받아 두고, 우리 품목이 규정 대상인지는 규정 원문으로 확인한다.", "r": "⑪ EU", "who": "3본부 · 4본부"}, {"k": "미국 판매를 검토할 땐 제품 분류와 등록부터", "p": "검토", "d": "미국에서는 선크림이 화장품이 아니라 OTC로 분류되듯 나라마다 품목 분류가 다르다. 미국 진출을 논의할 때는 품목 분류, 등록 의무, 공급업체 품질계약 순서로 먼저 점검표를 만든다.", "r": "④ 오코예 · ⑧ 미국 MoCRA", "who": "3본부"}, {"k": "일본 수출은 가격보다 고부가가치 쪽으로", "p": "검토", "d": "일본 시장은 2030년까지 5년을 합쳐 3.9% 성장 전망으로 느리게 크고, 성장은 고부가가치화에서 나온다. 큐텐재팬 상세페이지는 낮은 가격보다 기능과 착용감을 앞세우는 방향으로 시험한다.", "r": "⑦ 야노경제연구소", "who": "일본 수출 담당"}, {"k": "시니어 콘텐츠의 말을 '건강하게 나이 들기'로", "p": "검토", "d": "롱제비티는 젊어 보이기보다 오래 건강한 삶에 맞춘 말이고, 일본도 2030 키워드로 꼽았다. 유튜브·카드뉴스에서 요실금·낙상 주제를 다룰 때 숨기고 가리는 말 대신 일상을 오래 지키는 말을 시험한다. 의학적 효능처럼 읽히는 표현은 쓰지 않는다.", "r": "① 이정노 · ⑦ 야노경제연구소", "who": "1본부 · 2본부"}, {"k": "해외 K뷰티 매장·중국 할인 시장은 지켜보기", "p": "유지", "d": "올리브영의 미국 첫 매장이 후속 소식을 낼 때 건강·위생 제품을 함께 다루는지 본다. 중국은 할인이 매출을 끄는 시장이라 지금은 진입보다 동향 확 sinkorea.com/news/article.html?no=58573"], ["코스인코리아 사전 안내 (2026.09.26)", "https://www.cosinkorea.com/mobile/article.html?no=58389"], ["국제뉴스 엑스포 현장 (2026.10.23)", "https://www.gukjenews.com/news/articleView.html?idxno=3730776"], ["야노경제연구소 일본 화장품 시장 (2026.10.16)", "https://www.yano.co.jp/press-release/show/press_id/4207"], ["방일라보 야노 보고서 소개, 2차 자료 (2026.10.28)", "https://honichi.com/news/2026/10/28/cosme2025/"], ["Foley & Lardner MoCRA 해설 (2026.03, 로펌 해설)", "https://www.foley.com/insights/publications/2026/03/how-mocra-is-reshaping-fda-oversight-of-cosmetics-in-2026/"], ["Personal Care Insights 한국 수출·올리브영 (2026.06.04)", "https://www.personalcareinsights.com/news/south-korea-beauty-export.html"], ["아시아경제 영문판 한국·프랑스 수출, AI 번역 기사 (2026.08.21)", "https://view.asiae.co.kr/en/article/2026082109143820627"], ["coslaw.eu PFHxA 제한 (2026.11.06)", "https://coslaw.eu/eu-pfhxa-restriction-10-october-2026-deadline/"], ["coslaw.eu SCCS 의견 (2026.10.20)", "https://coslaw.eu/new-sccs-final-opinions-on-acetophenone-and-heliotropin/"], ["coslaw.eu 24th ATP 신규 CMR (2026.01.12)", "https://coslaw.eu/eu-introduces-new-cmr-classifications-under-the-24th-atp-to-the-clp-regulation/"], ["동방재부 시간주보/이관분석 인용, 618 플랫폼 비중 (2026.06.23)", "https://finance.eastmoney.com/a/202606233779868648.html"], ["국태해통증권 연구소 발췌, 618 결과 (2026.06.24)", "https://www.hstong.com/news/detail/26062418161393060"], ["매일경제신문 쌍11 동향 (2026.11.05)", "https://www.nbd.com.cn/articles/2026-11-05/4639731.html"]], "numberNotes": [["원료 효능 수치(발표 1~3)", "모두 연사(회사) 자체 발표값이며 독립 검증이 아니다. 발표 2는 22명, 발표 3은 21명 시험. 지표가 서로 달라 회사끼리 비교할 수 없다."], ["한국 수출 단위", "식약처 인용 기사는 달러·화장품 품목 전체, 아시아경제는 HS 3304 원화 환산이라 직접 비교하지 않는다. 환율 가정은 1달러 1,395원, 1유로 1,629.75원(8.20 기준)."], ["2025년 수출 한국·프랑스", "Personal Care Insights 표기(114억 달러·243억 달러)와 아시아경제 HS 3304 수치는 집계 범위가 다를 수 있어 따로 적었다."], ["중국 618 플랫폼 비중", "시간주보/이관분석과 국태해통증권의 비중 수치가 다르다(집계 범위 차이로 보이나 원문 설명 없음). 그래프는 시간주보 인용값만 썼다. 중국 숫자는 외부 집계 인용이라 직접 검증하지 못했다."], ["메이크업 성분 검색량 150%", "연사 언급이며 집계 출처가 표기되지 않았다."], ["엑스포 규모", "사전 기사: 246개 기업·초청 바이어 200여 명 예정 / 개막 후 충북도: 39개국 해외 바이어 200여 명."], ["주관 표기", "세미나 주관은 충북화장품산업협회. 사전 기사는 오송바이오진흥재단을 엑스포 주관으로 적었다."], ["확인하지 못한 항목", "EU 24th ATP 최종 확정, 미국 GMP·향료 알레르겐 규칙의 이후 상태, 쌍11 최종 뷰티 실적, 영상 길이·게시일."], ["해외 소식 날짜 범위", "일부는 기준일(2026.11.09)에서 30일 밖이며 6개월 안의 소식이다. 각 소식에 날짜를 표기했다."]], "madeBy": "조사: 소넷 조사원 · 정리·판단: 오퍼스 · 작성 2026-11-09", "glossaryHeadline": "이번 자료의 어려운 말 14개를 쉬운 말로 바꿨습니다", "glossary": [{"term": "롱제비티 뷰티", "easy": "오래 건강하게 사는 데 맞춘 피부관리. 젊어 보이기보다 노화 원인 자체를 겨냥한다.", "why": "고령 고객 대상 제품의 말이 '안티에이징'에서 '건강한 노화'로 옮겨 가는 신호다."}, {"term": "세놀리틱", "easy": "늙은 세포(노화 세포)만 골라 없애는 방식.", "why": "시니어 케어 원료 흐름을 파악할 때 쓰는 말이다."}, {"term": "PDRN", "easy": "연어 DNA 등에서 얻는 피부 재생 성분. 이번 발표는 미생물에서 얻은 것을 다뤘다.", "why": "시니어 스킨케어 인기 성분이고 동물성을 대체하려는 흐름을 보여 준다."}, {"term": "필라그린", "easy": "피부 겉(각질층)의 보습과 장벽을 만드는 단백질.", "why": "건조·가려움이 많은 고령층의 피부 문제와 직결된다."}, {"term": "인체 적용 시험", "easy": "사람에게 실제로 발라 효과를 재는 시험.", "why": "광고에 효능 수치를 쓰려면 근거가 필요하다. 우리 광고 문구를 점검할 때 참고한다."}, {"term": "바이오인캡슐레이션", "easy": "성분을 작은 캡슐에 싸서 보호하고 필요한 곳에서 풀리게 하는 기술.", "why": "흡수·방출 조절이라는 점에서 요실금·위생 제품의 흡수 소재와 닮은 발상이다(정리자 추정)."}, {"term": "하이브리드 제형", "easy": "스킨케어와 메이크업 기능을 한 제품에 합친 것.", "why": "한 제품에 여러 기능을 넣는 흐름을 참고할 수 있다."}, {"term": "OTC", "easy": "처방전 없이 사는 일반의약품. 미국에서 선크림은 화장품이 아니라 OTC다.", "why": "우리 제품도 미국에 수출하면 분류가 달라질 수 있다."}, {"term": "cGMP", "easy": "미국이 요구하는 현행 우수 제조·품질관리 기준.", "why": "해외 수출 때는 공장 기준까지 본다."}, {"term": "MoCRA", "easy": "2022년 미국이 만든 화장품 규제 현대화법. 시설 등록·제품 등록·부작용 보고를 요구한다.", "why": "미국에서 화장품을 팔려면 지켜야 하는 법이다.", "video": {"title": "MoCRA 모크라 Modernization of Cosmetics Regulation Act란? (MoCRA #01)", "url": "https://www.youtube.com/watch?v=LG2IvGE-2sQ"}}, {"term": "위해평가(안전성 평가)", "easy": "성분이 몸에 해로운지 따져 보는 평가.", "why": "한국은 2028년부터 안전성평가 제도를 시행할 예정이라고 안내됐다(심포지엄 안내 기사 검색 요약, 추정).", "video": {"title": "화장품 등 안전성평가를 위한 동물대체시험법 [광독성시험법]", "url": "https://www.youtube.com/watch?v=FXcFZyfyjtE"}}, {"term": "CMR 물질", "easy": "발암성·변이원성·생식독성이 있는 물질. EU는 화장품에 쓰는 것을 원칙적으로 금지한다.", "why": "유럽에 수출한다면 성분을 점검해야 한다."}, {"term": "PFAS · PFHxA", "easy": "PFAS는 잘 분해되지 않는 불소계 화학물질 묶음이고, PFHxA는 그중 하나다.", "why": "방수 가공 원단을 쓰는 제품은 유럽 판로를 검토할 때 확인 대상이다(정리자 판단)."}, {"term": "HS 3304", "easy": "수출입 통계에서 쓰는 품목 번호. 3304는 미용·메이크업·기초화장 제품 묶음이다.", "why": "수출 숫자를 볼 때 어떤 품목 범위로 집계했는지 구분하는 기준이다."}]}</script>
