<script id="item-data" type="application/json">{"id": "2026-11-20-0700-fabric", "date": "2026-11-20", "slot": "07:00", "topic": "원단·소재", "type": "시장 감시", "title": "11월 20일 원단·소재 동향", "subtitle": "국내 3 · 해외 4 · 소식 7개", "event": {"name": "원단·소재 시장 감시", "host": "인터넷·SNS·블로그·카페·쇼핑몰·펀딩·해외 자료", "when": "2026-11-13 ~ 11-20 (7일 이내 보도 · Santoni 전시는 11/20~24)", "where": "한국·유럽(이탈리아·영국)·중국·미국", "theme": "PFAS·재활용 인증 규제가 '설명회'에서 '현장 시험·인증 비용' 단계로 내려왔다. 비불소 가공으로 바꿔도 생산 중 교차오염이 생길 수 있다는 지적이 나와, 원단 시험서 요청 항목에 'PFAS 교차오염 관리'를 넣어야 한다. 새 소재 신제품은 이번 주에 거의 없었다."}, "headline": "PFAS 규제가 설명회를 넘어 원단 시험서 요구로 내려왔다", "hl": ["PFAS", "시험서"], "summary3": [["비불소 가공도 '교차오염'까지 관리해야 한다.", "11/17 화섬협회 해외기술규제 설명회(발표 3건)에서 PFAS 비불소 가공으로 바꿔도 생산 중 교차오염이 생길 수 있다는 지적이 나왔다. 새 재활용 인증 틀(MMS)은 비용·행정 부담 우려가 제기됐다."], ["해외는 재생 원사를 '어떻게 만들었나'로 경쟁한다.", "이탈리아 Fulgar는 기계 재생(Q-Nova)과 매스밸런스 방식(Q-Cycle) PA6.6 두 종으로 영국 Heist 타이츠를 만들었다. Santoni는 ITMA ASIA(11/20~24)에서 40게이지 무봉제 원단과 3D 설계 소프트웨어를 보인다."], ["원단사가 브랜드를 먼저 찾아간다.", "대구 원단업체 25곳이 서울에서 패션기업 직원 약 150명을 초청해 상담회를 열었고, 중국 柯桥에서는 23개 브랜드와 선정 원단업체 36곳이 사전 선별 매칭으로 만났다."]], "cases": [["업체·제품", "가격 · 1장당"], ["Fulgar Q-Nova (이탈리아, 기계 재생 PA6.6)", "가격 미공개 · 혼용률·g/㎡ 미표기"], ["Fulgar Q-Cycle (이탈리아, 매스밸런스 PA6.6)", "가격 미공개 · ISCC PLUS·RCS 인증(업체 기준)"], ["Santoni 40게이지 무봉제 원단 (이탈리아·중국)", "가격 미공개 · E40, 전시 시연"]], "shift": {"from": "비불소 가공", "to": "교차오염 관리", "cap": "PFAS 대응 기준의 변화 — 불소를 안 쓰는 가공으로 바꾸는 것만으로는 부족하고, 같은 공장에서 섞여 드는 PFAS까지 공급망 전체에서 관리하라는 지적(11/17 설명회 관련 기사)"}, "chart": {"t": "원단사-브랜드 직접 매칭 행사 규모 (곳)", "u": "곳", "rows": [["대구 원단업체 (서울 상담회)", 25, "a"], ["柯桥 참가 브랜드", 23, "c"], ["柯桥 선정 원단업체", 36, "b"]]}, "keynums": [["3", "건", "화섬협회 설명회 발표 (ESPR·DPP / PFAS / GRS·MMS)", 1], ["150", "명", "대구 상담회 초청 패션기업 직원 (약)"], ["40", "게이지", "Santoni 무봉제 원단 시연 (E40)", 1], ["3,700만", "lb/년", "UpCycle Fiber 헌 옷 분류 능력 (풀가동 시)"]], "overviewNote": "소식 7개 중 국내 3(화섬협회 설명회·대구 상담회·KTDI)·해외 4(이탈리아·영국·중국·미국)입니다. 상(上) 중요도 소식은 없었습니다. 원단·원사 가격을 공개한 곳이 없어 가격표에는 '미공개'와 확인된 사양만 적었습니다. 한국섬유신문은 페이지가 열리지 않아 ③ 대구 상담회는 검색 요약 기준이고, ⑤ 柯桥·⑥ UpCycle Fiber·⑦ KTDI도 본문을 열지 못해 '추정'입니다. 일본 지역 새 소식과 고객 반응은 찾지 못했습니다.", "sectionLabel": "소식", "sections": [{"tm": "중 · 11.17", "name": "한국화학섬유협회", "co": "한국 · TIN뉴스 · 기사 11/19, 행사 11/17 (경기 양주)", "title": "해외기술규제 설명회 — 비불소 가공도 '교차오염', 새 재활용 인증(MMS) 비용 우려", "q": "비불소 가공으로 바꿔도 생산 과정에서 PFAS가 섞여 들 수 있어 공급망 전체를 관리해야 한다.", "hl": ["섞여", "공급망"], "pts": ["<b>무엇이 새로운가:<\/b> 국가기술표준원 주최, 화섬협회·경기섬유산업연합회 공동 주관 '2026년 섬유패션 분야 해외기술규제 설명회'가 경기섬유종합지원센터에서 열렸다.", "<b>발표 3건:<\/b> ① EU 에코디자인 규정(ESPR)·디지털 제품 여권(DPP)·팔리지 않은 의류·신발 폐기 금지 ② PFAS·OEKO-TEX STANDARD 100 ③ GRS·RCS·CoC와 텍스타일 익스체인지 MMS 전환.", "<b>숫자:<\/b> 참석 인원은 기사에 없다. 같은 주제의 다른 기사(검색 요약)는 '단일 소재 설계·고순도 재생원료'를 권장했다.", "<b>업계 반응:<\/b> \"MMS 요건이 현장 현실을 반영하지 못하면 인증 비용·행정 부담만 커진다\"는 질의에 연사는 \"의견을 모아 개선을 검토하겠다\"고 답했다.", "<b>우리에게:<\/b> 방수층·발수 원단은 PFAS 시험서(총불소·PFHxA)와 '가공 공정 교차오염 관리 확인서'를 함께 요청한다. 재생 원사를 쓸 때는 GRS·RCS 인증서 범위를 확인한다."], "nums": [["3", "건", "발표 (ESPR·DPP / PFAS·OEKO-TEX / GRS·RCS·MMS)", 1], ["11.17", "", "설명회 개최일 (기사 11/19)"]], "table": [["발표 주제", "우리 원단과의 관계"], ["ESPR·DPP·미판매 의류 폐기 금지", "유럽 판매 시 원단 이력 자료 필요"], ["PFAS·OEKO-TEX STANDARD 100", "방수층·발수 원단 시험서"], ["GRS·RCS·CoC·MMS 전환", "재생 원사 인증 범위·비용"]], "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}, "src": "TIN뉴스 32625 (원문 열람) · 한국섬유신문 150317 (페이지 열리지 않아 검색 요약만 — 교차오염·단일 소재 권장 내용)", "grade": "확인"}, {"tm": "중 · 11.17", "name": "Fulgar × Heist", "co": "이탈리아·영국 · Knitting Industry · 2026-11-17", "title": "재생 폴리아미드 6.6 두 종(Q-Nova·Q-Cycle)으로 만든 타이츠", "q": "같은 재생 나일론이라도 기계 재생과 매스밸런스 방식은 만드는 법이 다르다.", "hl": ["기계", "매스밸런스"], "pts": ["<b>무엇이 새로운가:<\/b> 이탈리아 원사사 Fulgar의 두 원사로 영국 브랜드 Heist가 타이츠(The Thirty-Five Colours, 불투명 계열 The Sixty 등)를 구성했다. 제조는 이탈리아 Duelegs BBF Group.", "<b>제품:<\/b> Q-Nova는 생산 중 나온 폐기물(소비 전)을 기계적으로 재생한 PA6.6. Q-Cycle은 폐타이어 열분해유를 화석 원료 대신 쓴 매스밸런스 방식 PA6.6으로 ISCC PLUS·RCS 인증, OEKO-TEX Standard 100 Product Class I Annex 6.", "<b>숫자:<\/b> 기사에 혼용률·g/㎡ 표기가 없다. 'Q-Nova 79% + 엘라스탄 21%'는 예전 Heist 상품 페이지 검색 요약일 뿐 이번 컬렉션이 아니다.", "<b>마케팅:<\/b> 인증 보유와 \"가볍고 통기성·발색 좋음\"은 모두 업체·보도자료 기준이다.", "<b>우리에게:<\/b> 속옷 원단과 같은 나일론 계열이다. 바이오·재생 나일론 비교 샘플로 요청하고, 재생 방식에 따라 광고 문구가 달라지므로 표기 기준을 먼저 확인한다."], "nums": [["2", "종", "재생 PA6.6 원사 (Q-Nova·Q-Cycle)", 1]], "table": [["원사", "만드는 법 · 인증"], ["Q-Nova", "소비 전 생산 폐기물 기계 재생"], ["Q-Cycle", "폐타이어 열분해유 매스밸런스 · ISCC PLUS·RCS"]], "src": "Knitting Industry (2026-11-17, 열람) — 11/12 Fulgar Q-GEO 소식의 후속", "grade": "확인"}, {"tm": "중 · 11.19", "name": "대구 원단업체 25곳", "co": "한국 · 한국섬유신문 · 2026-11-19 (RSS 시각 기준)", "title": "대구 원단업체 25곳, 서울서 패션기업 약 150명 초청 소재 상담회", "q": "지역 원단사가 서울로 찾아가 원단 수주부터 봉제·주문까지 잇는다.", "hl": ["찾아가"], "pts": ["<b>무엇이 새로운가:<\/b> 대구 원단업체 25곳이 서울 소잉센터 17층 스카이홀에서 패션기업 직원 약 150명을 초청해 원단 수주·제품 개발 상담을 했다. 지역 순회 상담에서 쌓은 노하우로 원단→봉제→주문까지 판로를 넓히려는 목적이다.", "<b>숫자:<\/b> 25곳, 약 150명. 프리뷰 인 대구(PID) 2027은 3월 3~5일 EXCO 개최 예정이고, 2028 S/S 원단 트렌드 브리핑도 소개됐다.", "<b>확인 못 한 것:<\/b> 행사 날짜와 속옷용 원단 포함 여부.", "<b>우리에게:<\/b> 국내 원단사가 '먼저 찾아가는' 방식으로 바뀌는 신호다. 다음 상담회 초청 대상이나 PID 2027 사전 등록을 알아본다."], "nums": [["25", "곳", "참가 대구 원단업체", 1], ["150", "명", "초청 패션기업 직원 (약)"], ["3.3~5", "", "PID 2027 (EXCO)"]], "src": "한국섬유신문 150319 (원문 열리지 않음 · 검색 요약만, 날짜는 RSS 기준)", "grade": "추정"}, {"tm": "중 · 11.17", "name": "Santoni (중국 그룹: Santoni·Jingmei·Terrot)", "co": "이탈리아·중국 · Knitting Industry 11/17 · TEXtalks 11/02", "title": "ITMA ASIA(상하이 11/20~24)에서 40게이지 무봉제 + 3D 설계 소프트웨어", "q": "바늘이 촘촘한 40게이지로 얇고 매끈한 피부 접촉 원단을 짜는 무봉제 기술을 선보인다.", "hl": ["40게이지로"], "pts": ["<b>무엇이 새로운가:<\/b> 전시 주제는 \"Machines Evolved · Intelligence Delivered\". 원단·옷을 4개 분류(Performance, Outdoor & Training, Intimate, Sustainable)로 보여 주며, 속옷 같은 피부 닿는 용도를 직접 다룬다.", "<b>제품:<\/b> 40게이지 무봉제 수영복 프로젝트(얇고 매끈한 원단 시연), 무봉제 설계 소프트웨어 SWS3D(3D 시각화로 개발 기간 단축), 고리 위치를 지정하는 테리 TOP2-ST.", "<b>숫자:<\/b> 11/20~24, Hall 4.1 Booth C39, 40게이지(E40). 전시는 오늘 개막한다.", "<b>출처마다 다른 이름:<\/b> 40게이지 기계 이름이 Knitting Industry는 TOP2V, TEXtalks는 TOP2 FAST로 다르다. 어느 쪽이 맞는지는 확인하지 못했다.", "<b>우리에게:<\/b> 무봉제 원단을 외주할 때 '게이지(E40급)'로 부드러움·두께를 비교하는 기준이 생긴다. 전시 현장 사진·샘플 소식이 나오면 후속 확인한다."], "nums": [["40", "게이지", "무봉제 원단 시연 (E40)", 1], ["4", "개", "전시 분류 (Intimate 포함)"], ["5", "일", "전시 기간 (11/20~24)"]], "src": "Knitting Industry (2026-11-17, 열람) · TEXtalks (2026-11-02, 열람) — 기계 이름 차이 미해결", "grade": "확인"}, {"tm": "하 · 11.19", "name": "중국경방성 (柯桥優選 36개 업체)", "co": "중국(샤오싱) · 澎湃新闻·中国纺织报 · 2026-11-19 (RSS 기준)", "title": "柯桥 원단 대면회 — 23개 브랜드 × 36개 선정 원단업체", "q": "원단사와 브랜드를 미리 걸러 짝지어 주는 연중 매칭 행사의 마지막 회차다.", "hl": ["미리", "걸러"], "pts": ["<b>시장 상황:<\/b> 아식스·Kappa·361°·鸭鸭·坦博尔 등 23개 브랜드가 신시즌 제품 개발용 원단을 구매하러 '柯桥優選' 36개 업체와 만났다. 2026 연중 시리즈 제3회(마지막).", "<b>제품:<\/b> 스포츠 브랜드는 니트 스포츠 원단과 기능 우븐을 주로 찾았다. 속옷 원단 직접 언급은 없다.", "<b>숫자:<\/b> 23개 브랜드, 36개 업체. 거래액·계약 건수는 확인하지 못했다(2025년 행사는 21~27개 브랜드 규모였다는 검색 결과만 있다).", "<b>국내와 비교:<\/b> 대구 상담회(③)는 원단사가 직접 찾아가는 방식, 柯桥는 주최 측이 수요·공급을 사전 선별해 연결하는 방식이다.", "<b>우리에게:<\/b> 우리가 원단을 먼저 찾아 나설 때 '요구 조건을 먼저 보내고 걸러 만나는' 방식의 참고가 된다."], "bars": {"t": "柯桥 대면회 참가 규모 (곳)", "u": "곳", "rows": [["참가 브랜드", 23, "c"], ["선정 원단업체", 36, "a"]]}, "nums": [["36", "곳", "선정 원단업체", 1], ["23", "개", "참가 브랜드"], ["3", "회차", "2026 연중 시리즈 마지막"]], "src": "澎湃新闻 34503734 (검색 요약만, 원문 미열람)", "grade": "추정"}, {"tm": "하 · 11.17", "name": "UpCycle Fiber · Goodwill", "co": "미국 · Textile World · 2026-11-17", "title": "헌 옷 분류 장비 추가로 섬유→섬유 재활용 원료 확보", "q": "재생 원사의 입구인 '소재별 분류' 능력을 키우는 투자다.", "hl": ["분류"], "pts": ["<b>시장 상황:<\/b> UpCycle Fiber·Goodwill·Textile Innovation Engine 등 지역 협력사가 새 분류 장비를 들여 헌 옷을 소재별로 나눈다.", "<b>숫자:<\/b> 합계 약 4,400파운드/시간, 풀가동 시 연 3,700만 파운드(약 1.7만 톤). 자금 출처는 확인하지 못했다.", "<b>반응:<\/b> 기사 요약에 업계 반응은 없다.", "<b>국내와 비교:<\/b> 국내 설명회(①)의 '단일 소재 설계 권장'과 같은 방향이다. 나일론·스판 혼방이 많은 속옷은 분류가 어려워, 재생 원료가 늘어도 단일 소재 설계가 유리하다.", "<b>우리에게:<\/b> 참고만 한다. 장기적으로 모노 소재 속옷 설계 검토의 근거다."], "nums": [["3,700만", "lb/년", "풀가동 시 분류 능력", 1], ["4,400", "lb/시간", "합계 분류 속도 (약)"], ["1.7만", "톤/년", "연 분류 능력 톤 환산 (약)"]], "src": "Textile World (2026-11-17, 검색 요약만 · 열람 못 함)", "grade": "추정"}, {"tm": "하 · 11.17", "name": "한국섬유개발연구원 (KTDI)", "co": "한국 · 전
