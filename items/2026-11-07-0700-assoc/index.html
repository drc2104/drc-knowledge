 ["유예", "없이"], "pts": ["<b>제도:<\/b> 나스닥 글로벌 셀렉트 · 글로벌 · 캐피털 마켓 모든 상장사에 적용. 상장증권 시장가치가 5백만 달러 미만인 상태가 30영업일 연속이면 상장폐지 결정과 즉시 거래정지, 회복 기간이 없다.", "<b>숫자:<\/b> 예외는 청문위원회가 오류일 때나 제한적으로 최대 180일. 그 기간에 최초 상장 요건 전체를 맞춘다는 걸 보여야 한다. 1월 13일 처음 제안, 7월 22일 미국 증권거래위원회 승인. 시행일은 해설에 없음.", "<b>주의:<\/b> 한국 업계가 말한 '나스닥식 독립 시장'과는 별개 규정이라 섞어 읽으면 안 된다.", "<b>국내와 비교:<\/b> 한국 기준 300억 원은 대략 2~3천만 달러 수준(조사원 환율 추정)이라, 미국 하한이 훨씬 낮다. 대신 미국은 미달하면 기다려 주지 않는다."], "nums": [["5", "백만 달러", "상장 유지 하한(시장가치)", 1], ["30", "영업일", "연속 미달 시 상장폐지 결정"], ["180", "일", "청문 때 받을 수 있는 최대 예외"]], "bars": null, "shift": null, "table": null, "src": "Dorsey & Whitney 해설", "grade": "확인"}, {"tm": "해외 · 유럽연합", "name": "유럽연합 상장법(Listing Act)", "co": "유럽연합 · 로펌 해설 · 관보 2024.11.14, 핵심 조항 2026년 적용", "title": "중소 성장시장 서류 부담을 줄이는 쪽으로", "q": "유럽은 상장 문턱을 높이기보다 중소기업이 공모할 때 내는 서류를 줄였다.", "hl": ["서류를"], "pts": ["<b>제품(제도):<\/b> 공모 투자설명서 면제 한도를 800만 유로에서 1,200만 유로로 올림(회원국은 500만 유로로 낮출 수 있음). 복수의결권 구조를 허용하는 지침도 들어 있다.", "<b>숫자:<\/b> 상장 투자설명서 면제 비율 20% → 30%, 표준 투자설명서 최대 300쪽. 중소 성장시장에 18개월 넘게 상장된 같은 종류 증권을 더 팔 때는 최대 11쪽 간이문서로 대신한다.", "<b>주의:<\/b> 2026년 적용일은 해설마다 3월·6월로 달라 확정하지 못했다.", "<b>국내와 비교:<\/b> 한국 업계 요구(기술특례 보완 · 벤처 자회사 별도 심사)와 같은 '유연화' 방향. 한국 정부는 퇴출 강화 쪽, 유럽은 진입 부담 완화 쪽이라 대비가 뚜렷하다."], "nums": [["30", "%", "상장 투자설명서 면제 비율(기존 20%)"], ["300", "쪽", "표준 투자설명서 최대 분량"], ["11", "쪽", "중소 성장시장 추가 공모 간이문서 최대", 1]], "bars": {"t": "공모 투자설명서 면제 한도 (단위 만 유로)", "u": "만 유로", "rows": [["이전", 800, "c"], ["상장법 이후", 1200, "a"]]}, "shift": null, "table": null, "src": "Cleary Gottlieb 해설", "grade": "추정"}, {"tm": "해외 · 중국", "name": "중국 공업정보화부(工信部)", "co": "중국 · 人民邮电报(공업정보화부 누리집 전재) · 2026.08.31 / 샤먼 보도 2026.10.26", "title": "전문·특화 강소기업 '작은 거인'(小巨人) 육성", "q": "국가급 '작은 거인' 기업이 1.76만 개를 넘었고, 재심 때 매출 요건은 오히려 완화한다.", "hl": ["작은", "거인'"], "pts": ["<b>시장 상황:<\/b> 우수 중소기업을 단계별로 키우는 새 관리 방법을 내고 2026년 '작은 거인' 인정·재심을 시작. 재심 단계에서 매출 심사 요건을 적당히 완화하고, 중앙재정 전용 자금으로 기술 개조·연구개발을 지원한다.", "<b>숫자:<\/b> 국가급 '작은 거인' 1.76만 개사 이상. 일정 규모 이상 공업기업 기준 1~5월 이익 증가율 20% 이상, 상반기 부가가
