는 줄고, 성장은 한 자릿수", "q": "중국 최대 쇼핑 행사의 성장은 2~4.8%에 그쳤고, 즉시 배송만 33% 컸다.", "hl": ["즉시"], "pts": ["<b>시장 상황:<\/b> 星图数据 전체 거래액 1조 7,764억 위안(4.8%↑), 电数宝 1조 6,986억 위안(4.64%↑), 푸단대 소비빅데이터실험실 2%↑. 기관마다 다르다.", "<b>숫자:<\/b> 중신리옹(中信里昂) 추산 주요 5개 플랫폼 합계 3.7%↑, 즉시 소매(빠른 배송) 33%↑, 동네 공동구매 7.4%↓. 더우인 8~10%로 1위 예상, 샤오훙수 1인당 사용 횟수 최고 17.6회.", "<b>반응:<\/b> 한 여성복 브랜드는 광고 예산을 '200만'에서 '30만 안팎'으로 줄였다(판매자 인터뷰). 플랫폼 보조금은 작년과 비슷. 광고비가 매출로 이어지지 않는다는 판매자 불만도 있다(한 기사 사례).", "<b>국내와 비교:<\/b> 중국은 거래액 자랑 대신 전환 효율로 옮겨 가는 중. 톈마오는 브랜드 100만 곳·상품 7,200만 개라는 공급 규모만 공개.", "<b>한계:<\/b> 공식 결과 이미지는 못 읽었고 모두 2차 기사."], "nums": [["17,764", "억 위안", "전체 거래액(星图数据, 4.8%↑)"], ["17.6", "회", "샤오훙수 1인당 사용 횟수 최고치"]], "bars": {"t": "쌍십일 분야별 성장률 (단위 %, 중신리옹 등)", "u": "%", "rows": [["즉시 소매", 33, "a"], ["더우인(예상, 8~10% 중 최소)", 8, "b"], ["주요 5개 플랫폼 합계", 3.7, "c"], ["동네 공동구매", -7.4, "c"]]}, "shift": {"from": "200만", "to": "30만 안팎", "cap": "한 여성복 브랜드의 쌍십일 광고 투자 예산(판매자 인터뷰, 단위는 기사 표기 그대로)"}, "table": null, "src": "소후 타임라인 · 소후 기사", "grade": "확인"}, {"tm": "해외 · 미국", "name": "Meta 쇼핑 AI '뮤즈' vs 아마존", "co": "미국 · WSJ 보도(11.01 현지) · 한국 글로벌이코노믹 기사 11.02", "title": "AI가 대신 사 주면, 노출 광고는 어떻게 되나", "q": "메타 쇼핑 에이전트 뮤즈를 한 달 반 만에 1,000만 명 넘게 설정했고, 아마존은 자사몰 구매를 막았다.", "hl": ["막았다."], "pts": ["<b>시장 상황:<\/b> 메타 쇼핑 에이전트 뮤즈(2026년 9월 출시, 9월 23일 Meta Connect 소개)를 미국·캐나다에서 1,000만 명 넘게 설정. 아마존은 출시 직후 뮤즈가 자사 쇼핑몰에서 사는 것을 막았고, 월마트·쇼피파이는 메타와 손잡았다.", "<b>숫자:<\/b> 아마존 광고 매출 작년 약 700억 달러. Alexa for Shopping 최근 12개월 4억 명 이상(이 기사 표기), '숍 다이렉트' 상품 2억 5,000만 개 이상.", "<b>숫자 불일치:<\/b> Alexa for Shopping 이용자는 Stella Rising 3억 5천만 명 vs 이 기사 4억 명 이상. 출처·기간이 달라 따로 적음.", "<b>국내와 비교:<\/b> AI가 구매를 대신하면 사람이 보는 노출 광고의 힘이 줄 수 있다. 쿠팡·네이버 광고에도 같은 질문이 올 수 있다."], "nums": [["1,000", "만 명+", "뮤즈 설정 이용자(미국·캐나다, 출시 약 한 달 반)", 1], ["700", "억 달러", "아마존 광고 매출(작년, 기사 표기 '약')"], ["2.5", "억 개+", "숍 다이렉트 상품"]], "bars": null, "shift": null, "table": null, "src": "글로벌이코노믹(WSJ 인용, 한국어 2차 보도)", "grade": "확인"}], "flowHeadline": "미국·일본·유럽·중국이 같은 곳을 가리켰다: 사람은 목표와 기준을, AI는 실행을", "flow": [{"k": "광고 구매가 '화면 조작'에서 '목표 말하기'로", "d": "목표와 예산만 주면 AI가 채널·소재·입찰을 맡는다", "who": [3, 4, 5]}, {"k": "쇼핑이 대화로, 광고도 대화 안으로", "d": "쇼핑 AI 대화 사이가 새 광고 자리. 후기는 브랜드가 못 고른다", "who": [2, 8, 14]}, {"k": "측정·데이터를 누구나 말로 쓴다", "d": "자연어 지표·AMC Expert Tool·MCP로 분석 시간이 크게 준다", "who": [6, 3, 9]}, {"k": "숫자는 플랫폼이 낸 것, 믿되 검증하라", "d": "67%·29%·3시간→3.5분 모두 자발 베타·도구 회사 수치", "who": [4, 6, 5]}, {"k": "국내·해외 같은 방향: 에이전트 광고와 MCP", "d": "미국 아마존·일본 출시·독일 DMEXCO가 모두 AI가 광고 도구를 직접 다루는 쪽으로. 사람 승인이 전제", "who": [3, 9, 12, 14]}, {"k": "리테일미디어는 커지고, 효율 압박도 커진다", "d": "세계 12.3%·일본 2.2배 성장 전망 속에 중국은 거래액 대신 전환 효율을 따진다", "who": [11, 10, 13]}], "apply": [{"k": "쿠팡·네이버 '자동 캠페인'은 한 계정에서 먼저 시험", "p": "우선", "d": "아마존이 목표만 주면 AI가 맡는 방식을 밀고 있고, 국내 광고 도구도 같은 쪽으로 갈 가능성이 크다. 새 자동 기능이 나오면 전체 계정을 옮기지 말고 상품 하나·계정 하나에서 먼저 시험한 뒤 늘린다. 성수기 직전에는 새 방식으로 갈아타지 않는다.", "r": "③ Ads Agent · ④ Full-Funnel · ⑤ DVA+", "who": "2본부 광고·콘텐츠팀"}, {"k": "광고 성과 숫자는 '광고 끈 기간'과 비교해 검증", "p": "우선", "d": "플랫폼이 보여 주는 ROAS·신규 고객 숫자는 플랫폼이 채점한 값이다. 정기적으로 일부 상품의 광고를 잠시 끄거나 줄인 기간과 비교해 실제로 늘어난 판매를 따로 본다. 두 분석 모두 권한 '믿되 검증' 원칙.", "r": "④ Full-Funnel · ⑥ 측정 · ③ Ads Agent", "who": "2본부 전략·숫자팀"}, {"k": "광고 성과를 '신규 고객'과 '재구매'로 나눠 보기", "p": "검토", "d": "아마존은 즉시 매출에 신규 고객의 12개월 가치를 더한 지표를 내놨다. 요실금팬티처럼 계속 쓰는 제품은 첫 구매 고객이 중요하므로, 광고 보고에 처음 산 고객 비중과 재구매 비중을 따로 적는다.", "r": "④ Full-Funnel", "who": "2본부 광고·콘텐츠팀 · 전략·숫자팀"}, {"k": "상세페이지를 '사람과 쇼핑 AI' 두 독자용으로", "p": "우선", "d": "쇼핑 AI 대화 안에서 제품이 '용도별로' 추천되는 시대다. 상세페이지와 자사몰에 대상(가벼운 새는 양·밤용·외출용 등)별 추천, 사이즈, 자주 묻는 질문을 이미지가 아닌 글자로 적어 AI가 읽고 답할 수 있게 한다.", "r": "② Branded Conversations · ⑭ 메타 뮤즈", "who": "2본부 쇼핑몰팀"}, {"k": "후기 늘리기는 플랫폼 공식 기능으로만", "p": "유지", "d": "아마존은 브랜드가 좋은 후기를 골라 보이게 하는 것을 막고, 후기 요청도 공식 상품으로만 열었다. 우리도 쿠팡·스마트스토어 후기는 플랫폼이 허용한 요청 방식만 쓰고, 후기 선별·대가 제공은 하지 않는 원칙을 유지한다.", "r": "⑧ 질의응답", "who": "2본부 쇼핑몰팀"}, {"k": "AI 업무는 '덧붙이기'가 아니라 '처음부터 다시 짜기'", "p": "유지", "d": "패널 주장은 AI를 덧붙인 팀 효율 10~30%, 다시 설계한 팀 90% 이상이었다. 광고 보고·지표 조회처럼 반복하는 일은 사람이 하던 순서를 그대로 옮기지 말고, AI가 처음부터 끝까지 하고 사람은 기준·승인만 보는 흐름으로 짠다. 광고 도구가 MCP로 열리는 흐름도 지켜본다.", "r": "③ 패널 · ⑥ 측정 · ⑫ DMEXCO", "who": "2본부 전략·숫자팀 · 광고·콘텐츠팀"}, {"k": "일본 판매는 '온라인몰 광고' 판이 커진다는 전제로", "p": "검토", "d": "일본 리테일미디어는 2025년 6,066억 엔, 그중 약 86%가 온라인몰 광고이고 2029년 2.2배 전망이다. 큐텐재팬 판매를 키울 때 몰 안 광고를 기본 비용으로 넣고, 아마존 일본 광고 기능이 몇 달 안에 풀리는지도 함께 지켜본다.", "r": "⑩ 일본 시장 · ⑨ unBoxed Tokyo", "who": "일본 수출 담당"}], "glossaryHeadline": "아마존 광고 발표를 읽기 위한 낱말 12개", "glossary": [{"term": "리테일 미디어", "easy": "쇼핑몰이 자기 화면(검색 결과·상품 상세·장바구니)을 광고판으로 파는 것.", "why": "쿠팡 광고·스마트스토어 광고가 바로 이것이다. 우리 광고비 대부분이 들어가는 곳.", "video": {"title": "What is retail media? - FNEGE Médias", "url": "https://www.youtube.com/watch?v=az2WkpXlEkc"}}, {"term": "에이전틱 광고 · 에이전틱 커머스", "easy": "AI가 사람 대신 광고를 집행하거나, 상품을 찾아 사 주는 방식.", "why": "쿠팡·네이버 광고 담당이 앞으로 AI에게 맡길 일과 사람이 지켜볼 일을 나누는 기준이 된다.", "video": {"title": "Retail Media Rundown: AI, LLMs, and the Shift Brands Can't Ignore - Xnurta", "url": "https://www.youtube.com/watch?v=2nuEyMuLqeA"}}, {"term": "DSP", "easy": "여러 사이트의 광고 자리를 자동 경매로 사는 구매 도구.", "why": "쇼핑몰 밖 지면에 광고를 살 때 쓰는 도구. 아마존은 이걸 광고 콘솔과 하나로 합쳤다."}, {"term": "DVA+", "easy": "디스플레이·영상·오디오 광고를 한 목표·한 예산·한 캠페인으로 사는 아마존 상품.", "why": "아마존에서 팔 때만 해당. 국내 광고 도구도 여러 지면을 한 번에 사는 쪽으로 갈 수 있다는 참고."}, {"term": "Full-Funnel Campaigns", "easy": "알게 되기 → 고민하기 → 사기 전 단계를 한 목표로 묶어 AI가 운영하는 캠페인.", "why": "인지 광고와 판매 광고를 따로 보지 않고 한 흐름으로 설계할 때 참고."}, {"term": "ROAS", "easy": "광고비 1원을 썼을 때 광고로 들어온 매출이 몇 원인지 비율로 본 것.", "why": "쿠팡 광고의 '목표 ROAS'와 같은 말. 아마존의 '67% 높다'는 장기 기준 값이다."}, {"term": "Long Term Sales", "easy": "바로 난 매출에 신규 고객이 앞으로 12개월 동안 쓸 것으로 추정한 값을 더한 지표.", "why": "계속 사 쓰는 제품에 맞는 생각이지만, 아마존이 만든 예측이라 검증이 필요하다."}, {"term": "NTB (신규 브랜드 고객)", "easy": "우리 브랜드를 처음 산 사람(New-to-Brand).", "why": "광고가 새 고객을 데려왔는지, 원래 사던 사람에게 다시 판 건지 나눠 보는 기준."}, {"term": "AMC (Amazon Marketing Cloud)", "easy": "광고 노출과 구매 데이터를 개인정보 없이 합쳐 분석하는 아마존의 데이터 공간.", "why": "아마존에서 팔 때만 해당. 쇼핑몰이 광고·구매 데이터를 어디까지 보여 주는지 비교할 때 참고."}, {"term": "MCP", "easy": "AI 도구가 바깥 서비스(광고 도구·메일·문서 등)와 연결되는 표준 방식.", "why": "우리 AI 업무에서 이미 쓰는 방식이다. 광고 도구도 같은 방식으로 AI에게 열리고 있다.", "video": {"title": "Retail Media Rundown: AI, LLMs, and the Shift Brands Can't Ignore - Xnurta", "url": "https://www.youtube.com/watch?v=2nuEyMuLqeA"}}, {"term": "Branded Conversations", "easy": "쇼핑 AI와 고객의 대화 안에 브랜드가 끼어들어 제품을 설명하는 광고.", "why": "앞으로 상세페이지 글은 사람뿐 아니라 쇼핑 AI도 읽는다. 용도별 설명을 글자로 정리해 둘 이유."}, {"term": "폐쇄 루프 (closed loop)", "easy": "광고 노출부터 실제 구매까지 한 회사 안에서 모두 추적되는 구조.", "why": "쿠팡 광고 성과가 잘 보이는 이유와 같다. 대신 채점도 그 회사가 한다는 점을 기억해야 한다.", "video": {"title": "The Retail Media Maturity Gap: Leaders vs. Everyone Else - Retail Razor", "url": "https://www.youtube.com/watch?v=8hlgKvBe39o"}}], "media": {"headline": "행사 다시보기는 공개되지 않아, 리테일미디어를 설명하는 영상 5편을 붙였습니다", "videos": [{"title": "What is retail media?", "url": "https://www.youtube.com/watch?v=az2WkpXlEkc", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · FNEGE Médias · 리테일미디어가 무엇인지 입문 설명(영어)"}, {"title": "Retail Media Rundown: AI, LLMs, and the Shift Brands Can't Ignore", "url": "https://www.youtube.com/watch?v=2nuEyMuLqeA", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · Xnurta · AI가 리테일미디어를 어떻게 바꾸는지(영어)"}, {"title": "The Retail Media Maturity Gap: Leaders vs. Everyone Else", "url": "https://www.youtube.com/watch?v=8hlgKvBe39o", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · Retail Razor · 앞선 회사와 나머지의 수준 차이(영어)"}, {"title": "CES 2026 | How Retail Media Is Evolving | Instacart, TikTok & The Trade Desk", "url": "https://www.youtube.com/watch?v=39WgAuKdy60", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · LA Times Studios · 업계 패널 대담, 전문가용(영어)"}, {"title": "The Future of Retail Media Isn't Retail. It's Community", "url": "https://www.youtube.com/watch?v=-5dFldJ-JhE", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · MADFEST · 리테일미디어를 커뮤니티 관점으로(영어)"}], "checked": [["아마존 공식 요약(11개 요점)", "영상 링크 없음"], ["unBoxed 행사 페이지", "영상·다시보기 링크 못 찾음"], ["유튜브 검색 3회(unBoxed 2026 다시보기 등)", "이 행사 영상 없음"], ["아마존 광고 공식 유튜브 채널", "채널 주소만 확인, 이 행사 전용 영상 미확인"], ["한국어 설명 영상", "찾지 못함. 위 5편은 존재·제목·채널을 확인(2026-11-21), 길이·게시일은 미확인"]], "docs": [["아마존 공식 요
