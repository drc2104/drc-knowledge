 주력 가격을 150~300위안으로 낮춰 1위를 찾았고, 일본 일반 쇼츠 평균가는 1,400~2,800엔대다", "who": [8, 7]}], "flowHeadline": "국내는 겨울 한 벌 두 기능, 해외는 겸용 팬티를 더 싸게", "apply": [{"k": "[원단 시험] 흡수 속도(초)·건조 시간(시간) 시험성적 확보", "p": "우선", "d": "일회용 1등 회사가 '1초 흡수·최대 4시간 보송'을 광고 맨 앞에 둔다. 다회용 팬티도 같은 단위로 흡수 속도와 건조 시간을 시험해 성적서로 만들고, 상세페이지 맨 위에 숫자로 둔다. 시험하지 않은 숫자는 쓰지 않는다.", "r": "③ 유한킴벌리 · ① Ontex", "who": "4본부 제품·출시팀"}, {"k": "[원단 시험] 겨울 안감 후보에 모달 혼용 비교군 넣기", "p": "검토", "d": "탑텐이 모달 57%·코튼 38%를 기본 원단으로 썼다. 겨울 기모 요실금팬티 안감을 시험할 때 모달 혼용 원단을 비교군으로 함께 넣어 촉감·흡한속건을 비교한다.", "r": "② 탑텐 · ⑥ 스파오", "who": "4본부 제품·출시팀"}, {"k": "[제품] 겨울 기모 요실금팬티 라인 기획·재고 시점 점검", "p": "검토", "d": "스파오는 겨울 이너웨어 물량을 전년의 약 3배로 미리 쌓았고 최근 한 달 매출이 26% 늘었다. 겨울 라인 구성과 재고 시점이 시즌 수요보다 늦지 않은지 점검한다.", "r": "⑥ 스파오 · ⑤ 감탄", "who": "4본부 제품·출시팀 · 2본부 쇼핑몰팀"}, {"k": "[마케팅] 일회용 겸용 팬티와 비교하는 '세탁 횟수' 가격 근거", "p": "우선", "d": "Ontex가 겸용 일회용 팬티를 유통사 PB 가격으로 풀면 비교 대상이 싸진다. 다회용 1장이 몇 번 빨아 입어 일회용 몇 개를 대신하는지 계산 자료로 보여 주고, 상세페이지와 광고에 같은 기준으로 적는다.", "r": "① Ontex · ⑨ WUKA", "who": "2본부 광고·콘텐츠팀"}, {"k": "[마케팅] '속옷 + 기저귀를 한 벌로' 겸용 구도 설명 콘텐츠", "p": "검토", "d": "감탄은 브라 + 보온 내의를, Ontex는 소변·생리혈·땀을 한 제품에 합쳤다. 요실금팬티를 '속옷과 기저귀를 따로 입지 않는 한 벌'로 설명하는 비교 콘텐츠를 만든다. 의학 효능은 단정하지 않는다.", "r": "⑤ 감탄 · ① Ontex", "who": "2본부 광고·콘텐츠팀 · 1본부 유튜브팀"}, {"k": "[가격 행사] 2장 구성 입문 세트 행사", "p": "검토", "d": "WUKA는 브리프 2장에 안내책을 묶은 입문 키트로 대형 마트에 들어갔다. 처음 사는 고객을 위한 2장 구성 입문 세트를 만들어 단품 행사와 기간을 나눠 시험한다.", "r": "⑨ WUKA · ⑧ 빅토리아 시크릿", "who": "2본부 쇼핑몰팀"}, {"k": "[제품] 브라 상세에 패드 두께·무압박·비침 방지를 숫자로", "p": "검토", "d": "엣프터는 '1.8cm 볼륨 패드·와이어 없음·비침 줄인 이중 원단'으로 판다. 우리 브라 쪽 상세페이지도 패드 두께(cm)와 구조를 숫자로 적는다.", "r": "④ 엣프터", "who": "4본부 제품·출시팀 · 2본부 쇼핑몰팀"}, {"k": "[마케팅] 인플루언서 기획전 + 쿠폰 구조 시험", "p": "검토", "d": "29CM는 인플루언서 이름을 건 기획전에 쿠폰을 붙였다. 편집숍형 기획전 구조를 작은 규모로 시험해 일반 할인과 성과를 비교한다.", "r": "④ 엣프터 × 29CM", "who": "2본부 광고·콘텐츠팀 · 2본부 쇼핑몰팀"}], "glossary": [{"term": "다액체 보호", "easy": "소변·생리혈·땀을 한 제품이 함께 막는 것.", "why": "Ontex가 여성 팬티에 넣은 방향이다. 우리 겸용 제품을 설명할 때 비교 기준이 된다."}, {"term": "PB (자체상표)", "easy": "마트·유통사가 다른 회사에 만들게 해서 자기 이름으로 싸게 파는 상품
