<script id="item-data" type="application/json">{"id": "2026-11-11-0700-fabric", "date": "2026-11-11", "slot": "07:00", "topic": "원단·소재", "type": "시장 감시", "title": "11월 11일 원단·소재 동향", "subtitle": "국내 4 · 해외 6 · 소식 10개", "event": {"name": "원단·소재 시장 감시", "host": "인터넷·SNS·블로그·카페·쇼핑몰·펀딩·해외 자료", "when": "2026-10-12 ~ 11-11 (30일 · 30일을 넘긴 지난 소식 1건 포함)", "where": "한국·미국·중국(홍콩)·유럽(스위스·프랑스)", "theme": "불소 없는 방수가 막에서 가공제 단계로 번졌다. 원단을 새로 짜지 않고 가공제만 바꿔 기존 원단에 적용하는 길이 열리고 있다."}, "headline": "원단은 그대로, 가공제만 바꿔 불소·살균제를 빼는 길이 열렸다", "hl": ["가공제만", "불소·살균제를"], "summary3": [["미국 Dow가 불소를 쓰지 않는 발수·발유 가공제를 내놓았다.", "실리콘 계열 가공제를 원단 무게의 1~3%만 입히고, 세탁 20회 넘게 발수·발유가 유지되도록 설계했다고 밝혔다. 다만 원문에 'PFAS 없음'이라는 말은 없어 성적서 확인 전까지는 단정할 수 없다."], ["냄새 잡는 방식도 '약 없이'로 간다.", "스위스 Sanitized는 살균제 없는 소취 가공을, 홍콩 JY는 금속·입자 없이 세균 증식을 억제한다는 속옷용 나일론(120 g/㎡)을 냈다. 두 곳 모두 시험 수치는 공개하지 않았다."], ["국내는 신소재보다 시험·인증 쪽 소식이 많고, 수출은 얼어붙었다.", "KATRI가 중국 CTI와 중국 국가표준 시험 협약을 맺었다(10월 20일). 화섬직물·니트 수출 결제 기간은 'B/L 후 15일 이내'에서 2개월 이상으로 늘었다는 보도가 나왔다."]], "cases": [["업체·제품", "원단 수치 (가격 미공개 · 업체 입력값)"], ["Dow Dowsil IE-5619 (미국, 가공제)", "고형분 30% 농축액 · 원단 무게의 1~3% 적용 · 150°C 이상에서 1~3분 경화"], ["JY Textile Chill Shield (홍콩·중국)", "120 g/㎡ · 재생 나일론 80%·스판 20% · 폭 140 cm · 최소 주문량 미표기"], ["Derun D-TW28216 (중국)", "170 g/㎡ · 텐셀 모달 73% · 폭 60인치 · 최소 1,000야드"], ["Chan Chia Bodywear W/R (대만, 참고)", "65 g/㎡ · 재생 나일론 100%(30D) · 폭 56인치 · 최소 3,000야드"]], "shift": {"from": "15일", "to": "2개월+", "cap": "화섬직물·니트 수출 대금 결제 기간 ('B/L 후 15일 이내' → 2개월 이상, 국제섬유신문 10/29 보도)"}, "chart": {"t": "전시 출품 속옷용 원단 무게 (g/㎡, 업체 입력값 · 전시회 미검증 · 구성이 달라 직접 비교 금지)", "u": "g/㎡", "rows": [["Derun D-TW28216", 170, "c"], ["JY Chill Shield", 120, "b"], ["Chan Chia Bodywear W/R", 65, "a"]]}, "keynums": [["20", "회+", "Dow 가공제가 발수·발유를 유지하도록 설계한 세탁 횟수", 1], ["1~3", "%", "Dow 가공제 적용량 (원단 무게 대비)"], ["1,000", "야드", "Derun 텐셀 모달 니트 최소 주문량", 1], ["1억 3,500만", "유로", "Reju 화학 재생 폴리에스터 네덜란드 NIKI 프로그램"]], "overviewNote": "'상' 등급은 3건입니다. 불소 없는 발수 가공제(Dow), 속옷용 소취 나일론(JY), 살균제 없는 소취 가공(Sanitized)으로, 모두 업체 발표·업체 입력값이며 시험 수치가 공개된 것은 Dow의 세탁 20회 설계값뿐입니다. 퍼포먼스 데이즈 출품 원단은 제품 페이지에 게시일이 없어 날짜를 뮌헨 전시 개최일(10/13)로 적었습니다. 원단은 기업 간 거래라 공개 가격이 없어 가격표 대신 원단 수치 표를 실었고, 같은 이유로 가격 행사 아이디어는 넣지 않았습니다. 완제품 소식(일본 Caddireat VITAVEIL·탑텐 온에어)은 이번 묶음 규칙대로 소식에서 빼고 출처에만 남겼습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.02", "name": "Dow", "co": "미국 · 업계 매체 Innovation in Textiles", "title": "불소를 쓰지 않는 발수·발유 가공제 Dowsil IE-5619", "q": "원단을 바꾸지 않고 가공제만 바꿔 불소 없이 물·기름·피지를 튕기게 하는 길이다.", "hl": ["가공제만", "불소"], "pts": ["<b>무엇이 새로운가:<\/b> 실리콘과 유기 성분을 섞은 3세대 에멀전 가공제. 불소 계열 화학을 쓰지 않는 '불소 대체' 제품이며 천연·합성·혼방 원단 모두에 쓸 수 있다고 밝혔다.", "<b>숫자:<\/b> 고형분 30% 농축액, 원단 무게의 1~3% 적용, 150°C 이상에서 1~3분 경화. 가정 세탁 20회가 넘어도 발수·발유가 유지되도록 설계했다. 막는 것은 피지·식용유·모터오일·커피·와인·우유.", "<b>마케팅:<\/b> '불소 대체', 부드러운 촉감과 통기성 유지, 테이프·로고 접착 가능을 내세웠다. 원문에는 'PFAS 없음'이라는 말이 없고, 원단마다 성능 검증이 필요하다고 업체가 밝혔다. 속옷 언급은 없다(분류: 의류·신발).", "<b>고객 반응:<\/b> 원료사 제품이라 소비자 후기 없음.", "<b>우리에게:<\/b> 다회용 생리팬티·요실금팬티의 겉감에 피지·분비물이 번지지 않게 하는 가공 후보다. 세탁 20회는 다회용 팬티가 견뎌야 할 횟수보다 짧아 세탁 내구 시험을 따로 하고, PFAS 해당 여부는 성적서로 확인한다."], "nums": [["20", "회+", "발수·발유 유지 설계 세탁 횟수", 1], ["1~3", "%", "적용량(원단 무게 대비)"], ["30", "%", "농축액 고형분"], ["150", "°C 이상", "경화 온도(1~3분)"]], "video": {"title": "PFAS FREE FUTURE: Everyday fabrics should not threaten your health", "url": "https://www.youtube.com/watch?v=cDMUpNeS1YA"}, "src": "Innovation in Textiles (2026-11-02)", "grade": "확인"}, {"tm": "상 · 10.13", "name": "JY Textile Technology", "co": "홍콩·중국 · 퍼포먼스 데이즈 뮌헨 마켓플레이스 (게시일 없어 전시일로 표기)", "title": "속옷용 소취 나일론 + 효성 바이오 스판덱스 'Chill Shield'", "q": "은·구리 같은 금속 없이 냄새를 잡는다는 속옷 분류 원단이다.", "hl": ["금속", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> 재생 나일론(소취 나일론 PRUKEEPER·PRUTEX) 80%에 효성 regen BIO 스판덱스 20%. 업체 설명은 '금속·입자 없는 방식으로 원단 위 세균 증식을 억제'. 분류는 속옷(Bodywear Underwear).", "<b>숫자:<\/b> 120 g/㎡, 폭 140 cm, 자외선 차단 50+ 아이콘, 인증은 GRS만. 최소 주문량은 표기하지 않았다.", "<b>마케팅:<\/b> 같은 페이지에서 스판덱스를 머리말은 '바이오 원료', 설명은 '재생'으로 달리 적었고 자외선 차단 시험서도 없다. 페이지에 '공급사 입력값이며 전시회가 검증하지 않았다'는 문구가 있다.", "<b>고객 반응:<\/b> 원단 업체 제품이라 소비자 후기 없음.", "<b>우리에게:<\/b> 금속 항균 없이 소취하는 속옷 겉감 후보로 샘플을 요청한다. 상하이 퍼포먼스 데이즈(11/18~19, 부스 B18)에도 나온다. 원사가 효성 제품이라 국내 공급선과 이어질 가능성도 있다."], "nums": [["120", "g/㎡", "원단 무게(업체 값)", 1], ["140", "cm", "원단 폭"]], "bars": {"t": "Chill Shield 구성 (%, 업체 표기)", "u": "%", "rows": [["재생 나일론(소취)", 80, "a"], ["regen BIO 스판덱스", 20, "b"]]}, "src": "퍼포먼스 데이즈 제품 페이지 66694 (2026년 10월 판, 날짜는 전시회 개최일)", "grade": "확인"}, {"tm": "상 · 11.04", "name": "Sanitized", "co": "스위스 · 업계 매체 Innovation in Textiles (공식 출시는 뮌헨 10/13~14)", "title": "살균제 없는 소취 가공 Odorex EON", "q": "합성섬유가 빨아도 냄새가 남는 문제를 살균제 없이 막겠다는 가공이다.", "hl": ["살균제", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> 입는 동안 냄새 분자를 붙잡아 중화하고, 세탁 때 피지 찌꺼기가 잘 빠지도록 보호층을 만든다. 합성섬유에 냄새가 배어 빠지지 않는 '영구 냄새'를 막는다는 설명이며 '살균제 없음'을 내세웠다.", "<b>숫자:<\/b> 원문에 시험 수치·세탁 횟수·비율이 없다(업체 주장).", "<b>마케팅:<\/b> 섬유 첨가제 책임자의 말로 소개했다. 같은 기사에 독일 Rudolf의 면 발수 가공제 Ruco-Dry Eco CWS도 실렸지만 PFAS 여부 표기가 없고 속옷과의 관련은 약하다.", "<b>고객 반응:<\/b> 원료사 제품이라 소비자 후기 없음.", "<b>우리에게:<\/b> 다회용 팬티에서 '빨아도 냄새가 남는다'는 불만이 나올 수 있는 지점을 겨냥한다. 살균제를 쓰지 않으면 피부 자극과 규제 설명이 쉬워지지만, 효능 문구는 시험 성적서를 확보한 뒤에만 쓴다."], "src": "Innovation in Textiles (2026-11-04)", "grade": "확인"}, {"tm": "중 · 10.13", "name": "Guang Dong Derun Textile", "co": "중국 · 퍼포먼스 데이즈 뮌헨 마켓플레이스 (게시일 없어 전시일로 표기)", "title": "텐셀 모달 속옷용 니트 D-TW28216", "q": "피부에 닿는 안감 후보로, 최소 주문량 1,000야드부터 받는 텐셀 모달 니트다.", "hl": ["1,000야드부터"], "pts": ["<b>무엇이 새로운가:<\/b> 텐셀 모달 73%에 EA 8%·WV 19%(약어 설명 없음). 항균·보온(보풀 없는 표면 처리)에 소취·수분 관리·속건·자외선 차단 50+ 아이콘을 붙였다. 분류는 속옷.", "<b>숫자:<\/b> 170 g/㎡, 폭 60인치, 최소 주문량 1,000야드. 인증은 OEKO-TEX Made in Green·Standard 100과 Higg Index. 시험 수치는 없다.", "<b>마케팅:<\/b> 설명에는 울 원사가 들어갔다고 했지만 혼용률에는 울이 없다. 업체 입력값이다.", "<b>고객 반응:<\/b> 원단 업체 제품이라 소비자 후기 없음.", "<b>우리에게:<\/b> 피부면 안감 시제품 후보다. 최소 주문량이 낮은 편이라 소량 시험 제작에 맞고, 상하이 전시(부스 C38)에서 실물을 볼 수 있다."], "nums": [["170", "g/㎡", "원단 무게(업체 값)"], ["60", "인치", "원단 폭"], ["1,000", "야드", "최소 주문량", 1]], "bars": {"t": "D-TW28216 구성 (%, 업체 표기)", "u": "%", "rows": [["텐셀 모달", 73, "a"], ["WV", 19, "b"], ["EA", 8, "c"]]}, "src": "퍼포먼스 데이즈 제품 페이지 68085 (2026년 10월 판, 날짜는 전시회 개최일)", "grade": "확인"}, {"tm": "중 · 11.05", "name": "Reju (테크닙 에너지 계열)", "co": "프랑스 · 업계 매체 Innovation in Textiles", "title": "화학 재생 폴리에스터 직물, 편직·직조사 6곳과 협력", "q": "헌 옷을 화학적으로 되돌린 폴리에스터가 속옷 편직사까지 닿기 시작했다.", "hl": ["속옷"], "pts": ["<b>무엇이 새로운가:<\/b> 소비 후 섬유 폐기물을 화학적으로 되돌린 재생 폴리에스터로 직물을 만든다(IBM 연구소에서 시작된 기술). 협력사는 A. Sampaio, RDD Textiles, Tintex Textiles, FOV Fabrics, Utenos Trikotažas, Swisstex Direct.", "<b>숫자:<\/b> 네덜란드 NIKI 프로그램 1억 3,500만 유로, 미국 로체스터·프랑스 라크에 거점 계획. 원단 무게·재생 함량은 원문에 없다.", "<b>마케팅:<\/b> 속옷 언급은 포르투갈 Tintex가 '액티브웨어·속옷·라운지웨어'용 환편 니트를 만든다는 한 줄뿐이다(업체 주장).", "<b>고객 반응:<\/b> 원료사 소식이라 소비자 반응 없음.", "<b>우리에게:<\/b> 장기 후보다. 재생 폴리에스터 함량 표기와 인증 요구가 강해지는 흐름에 대비해 둔다."], "nums": [["1억 3,500만", "유로", "네덜란드 NIKI 프로그램", 1], ["6", "곳", "협력 편직·직조사"]], "src": "Innovation in Textiles (2026-11-05)", "grade": "확인"}, {"tm": "중 · 11.03", "name": "Americhem ← Noble Biomaterials", "co": "미국 · 업계 매체 Innovation in Textiles", "title": "항균·소취 섬유 기술 회사 인수", "q": "은 섬유 같은 항균 속옷 소재의 공급망이 다시 짜일 수 있다.", "hl": ["공급망이"], "pts": ["<b>무엇이 새로운가:<\/b> Americhem이 Ionic+, X-Static, Circuitex 기술을 가진 Noble Biomaterials를 인수했다. Noble의 Ionic+ Botanical은 최근 미국 환경보호청(EPA) 인증을 받았다.", "<b>숫자:<\/b> 인수 조건은 비공개, 지식재산은 '20년 이상' 쌓였다고 밝혔다.", "<b>마케팅:<\/b> 회사 인수 소식이라 해당 없음.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 참고 소식이다. 지금 쓰는 항균 원단의 원료가 이 계열인지 확인해 두면 공급 조건이 바뀔 때 대비할 수 있다. 원문을 다시 열어 확인하지 못해 추정 등급으로 둔다."], "nums": [["20", "년+", "Noble 지식재산 축적 기간(업체 표기)"]], "src": "Innovation in Textiles (2026-11-03, 조사원 요약 기준)", "grade": "추정"}, {"tm": "중 · 10.29", "name": "KATRI시험연구원 × 중국 CTI", "co": "한국 · 국제섬유신문 (협약 10월 20일)", "title": "중국 수출용 섬유 제품 국가표준(GB) 시험 협약", "q": "중국에 팔 섬유 제품의 GB 시험 서류를 국내에서 받을 길이 생겼다.", "hl": ["국내에서"], "pts": ["<b>무엇이 새로운가:<\/b> 중국 국가표준(GB)에 맞춘 섬유 제품 시험 지원·수행과 결과에 대한 기술 지원 협약. 범위는 앞으로 넓힐 예정이다.", "<b>숫자:<\/b> 협약일 10월 20일 말고는 수치가 없다. 같은 날 발표한 소방장비 인증 제1호(방화두건)는 속옷과 관계없다.", "<b>마케팅:<\/b> 시험기관 협약이라 해당 없음.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 중국 쇼핑몰 판매나 수출을 검토할 때 GB 시험 비용과 소요일을 KATRI에 먼저 문의할 수 있다."], "src": "국제섬유신문 (2026-10-29)", "grade": "확인"}, {"tm": "중 · 08.24", "name": "전방글로벌", "co": "한국 · 테넌트뉴스 (지난 소식, 30일 넘음)", "title": "땀을 퍼뜨려 말리는 위킹 원단 제조기술 특허결정", "q": "국산 흡한속건·항균 이너웨어 원단 공급 후보지만 시험 근거는 아직 공개되지 않았다.", "hl": ["국산"], "pts": ["<b>무엇이 새로운가:<\/b> 2026년 8월 지식재산처에서 '천연 무기 복합재료를 활용한 위킹 기능성 원단 제조기술' 특허결정을 받았다(등록 완료가 아니며 일자·번호 없음). 폐조개껍데기를 재활용한 PET 섬유 특허로 KISTI 기술가치평가도 받았다.", "<b>숫자:<\/b> 시험 수치·가격 없음. \"국가공인 기관을 통해 항균·소취·흡한속건 검증을 마쳤다\"고 했지만 기관과 방법은 밝히지 않았다(보도자료 성격).", "<b>마케팅:<\/b> 하반기에 새 이너웨어 브랜드 '이너아이콘'을 내놓을 예정이다(7월 상표 등록).", "<b>고객 반응:<\/b> 브랜드 출시 전이라 소비자 반응 없음.", "<b>우리에게:<\/b> 국산 공급 대안으로 시험성적서 공개와 샘플을 요청해 확인한다."], "video": {"title": "[품질] 스포츠 의류의 기능성, 흡습, 속건?!", "url": "https://www.youtube.com/watch?v=roj9MmUZWIQ"}, "src": "테넌트뉴스 (2026-08-24)", "grade": "확인"}, {"tm": "하 · 10.27", "name": "스탠다드올", "co": "한국 · 어패럴뉴스", "title": "열을 받으면 수축·결합해 공기층을 잡는 충전재 SNUGLITE", "q": "세탁 뒤에도 뭉치지 않는 보온 충전재지만 속옷과는 거리가 있다.", "hl": ["보온", "충전재지만"], "pts": ["<b>무엇이 새로운가:<\/b> 나노 코팅 필라멘트가 열을 받으면 수축·결합해 공기층을 유지한다. 거위털·오리털·울·케이폭·그래핀·에어로겔과 섞어 쓸 수 있고, 세탁 뒤 뭉침과 부피 손실을 줄이는 것이 목표다.", "<b>숫자:<\/b> 필파워 수치 없음. KATRI·KOTITI 시험을 거쳤고 비동물성 제품은 비건 인증을 받았다고 밝혔다(업체 주장).", "<b>마케팅:<\/b> 아우터·침구 중심이며 2027년 가을·겨울 시즌 공급을 준비한다.", "<b>고객 반응:<\/b> 출시 전이라 소비자 반응 없음.", "<b>우리에게:<\/b> 참고만 한다. 보온 속옷 충전재는 우리 제품 범위 밖이다."], "src": "어패럴뉴스 (2026-10-27)", "grade": "확인"}, {"tm": "하 · 10.21", "name": "휴비스", "co": "한국 · 어패럴뉴스 (ITMF 연차총회 10/14~15, 브라질)", "title": "화학 재생 저융점 접착섬유 Ecoever LM, ITMF 혁신·지속가능 부문 수상", "q": "재생 원료 접착섬유가 상을 받았지만 지금은 자동차 내장재용이다.", "hl": ["재생", "원료"], "pts": ["<b>무엇이 새로운가:<\/b> 세계 최초로 상용화했다는 화학 재생 저융점 접착섬유(자동차 내장재용).", "<b>숫자:<\/b> 석유계 대비 탄소 배출 약 56% 감소, 저융점 섬유 세계 점유율 1위(모두 업체 주장).", "<b>마케팅:<\/b> 국제섬유제조업자연맹(ITMF) 수상을 앞세웠다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 속옷과의 관련은 낮다. 재생 원료 접착섬유가 부직포·패드류로 넓어지면 흡수층을 붙이는 소재에 영향이 있을 수 있어 지켜본다."], "nums": [["56", "%", "석유계 대비 탄소 배출 감소(업체 주장, 약)", 1]], "src": "어패럴뉴스 (2026-10-21)", "grade": "확인"}], "flow": [{"k": "불소 없는 발수가 막에서 가공제 단계로", "d": "Dow가 불소를 쓰지 않는 가공제를 냈고, 대만 Chan Chia 원단 페이지에도 'PFC-free 화학 사용' 아이콘 문구가 붙었다(참고). 지난 회차의 막(멤브레인) 소식과 합치면 막과 가공제 양쪽이 준비되고 있다.", "who": [1]}, {"k": "살균제·금속 없이 냄새와 균을 잡는다", "d": "JY는 금속·입자 없는 방식, Sanitized는 살균제 없는 가공을 내세웠고, 항균 섬유 기술 회사의 인수로 공급망도 바뀌고 있다.", "who": [2, 3, 6]}, {"k": "재생·바이오 원료가 속옷으로 (국내·해외 같은 방향)", "d": "국내 효성의 바이오 스판덱스가 홍콩 JY 속옷 원단에 들어갔고, 프랑스 Reju의 재생 폴리에스터는 속옷 편직사에 닿았다. 국내 휴비스도 화학 재생 섬유로 상을 받았다.", "who": [2, 5, 10]}, {"k": "중국·대만 편직사가 전시회 마켓플레이스로 직접 판다", "d": "속옷 분류 원단을 최소 1,000야드부터 받는 곳이 보인다. 상하이 전시(11/18~19)에서 실물을 볼 수 있다.", "who": [2, 4]}, {"k": "국내는 시험·인증·특허 소식이 중심", "d": "속옷에 바로 쓸 신소재는 적고 시험 협약·특허결정·수상 소식이 많다. 수출 주문이 끊겼다는 보도와 함께, 국내 원단사가 내수에서 차별화를 찾을 가능성이 있다.", "who": [7, 8, 9, 10]}], "flowHeadline": "원단을 새로 짜기보다, 약품과 원료를 바꾸는 쪽으로 간다", "apply": [{"k": "[원단 시험] 불소 없는 가공제를 겉감에 입혀 세탁 20회·50회 뒤 비교", "p": "우선", "d": "Dow 가공제를 국내 가공공장에서 겉감에 입혀 피지·분비물 번짐과 세탁 20회·50회 뒤 발수·발유를 비교한다. 업체 설계값이 20회라 그 이상은 직접 확인해야 한다. PFAS 해당 여부 성적서를 함께 요구한다.", "r": "① Dow", "who": "4본부"}, {"k": "[원단 시험] 소취 나일론과 텐셀 모달 샘플을 같은 조건으로 비교", "p": "우선", "d": "JY Chill Shield와 Derun D-TW28216 샘플을 받아 세탁 전후 소취, 흡수, 건조 시간, 피부 자극을 같은 조건으로 시험한다. 두 페이지 모두 시험 수치가 없고 표기가 서로 맞지 않는 곳이 있어 혼용률 확인서도 받는다.", "r": "② JY · ④ Derun", "who": "4본부"}, {"k": "[제품] 안감을 '텐셀 모달'과 '소취 나일론' 2종으로 시제품 구성", "p": "검토", "d": "두 안감으로 시제품을 만들어 기존 요실금팬티 안감과 착용감·냄새·건조를 비교한다. 국내 겨울 내의에도 모달 57% 제품(탑텐 온에어)이 나와 있어 피부면 소재 선택지로 본다.", "r": "② JY · ④ Derun", "who": "4본부"}, {"k": "[제품] 상하이 전시 기간에 맞춰 출품사 샘플 요청", "p": "검토", "d": "상하이 퍼포먼스 데이즈(11/18~19)에 JY(부스 B18)·Derun(부스 C38)이 나온다. 방문하지 못하면 전시 기간에 맞춰 온라인으로 샘플과 최소 주문 조건을 묻는다.", "r": "② JY · ④ Derun", "who": "4본부"}, {"k": "[마케팅] '살균제 없이 냄새를 잡는' 문구는 성적서 확보 뒤에만", "p": "우선", "d": "살균제 없는 소취는 피부 자극 걱정을 덜어 주는 설명이 될 수 있지만, 효능을 단정하는 문구는 쓰지 않는다. 시험 성적서와 문구를 한 쌍으로 관리하고 공개 전 광고 문구 점검을 거친다.", "r": "③ Sanitized · ② JY", "who": "2본부 · 4본부"}, {"k": "[원단 시험] 중국 판매 대비 GB 시험 비용·소요일 문의", "p": "검토", "d": "중국 쇼핑몰 판매나 수출을 검토할 때 필요한 GB 시험을 국내에서 받을 수 있는지, 비용과 소요일을 KATRI에 묻는다.", "r": "⑦ KATRI", "who": "4본부"}
