 계속 일하고, 그만둔 사람의 절반은 건강 때문입니다.", "hl": ["30~50%가", "건강"], "pts": ["<b>시장 상황:<\/b> 주최 Global Coalition on Aging, 말레이시아 건강노화학회. 아시아태평양 60세 이상은 2050년 13억 명 가까이, 지역 인구의 약 4분의 1.", "<b>숫자:<\/b> 60세 이상 연간 소비 19조 달러 → 2036년 34조 달러.", "<b>일하는 고령자:<\/b> 고령자의 30~50%가 계속 일하고, 일을 그만둔 사람의 약 절반은 건강 문제 때문(ERIA).", "<b>건강하지 못한 기간:<\/b> 평균 10.7년, 1990년 8.8년보다 길어졌다(Lancet Public Health 2026.7 인용).", "<b>국내와 비교:<\/b> 일본 65세 이상 취업률 26.0%, 65~69세 54.5%와 같은 흐름. 오래 일하려면 몸을 지키는 생활용품이 필요해진다."], "bars": {"t": "아시아태평양 60세 이상 연간 소비 (조 달러)", "u": "조 달러", "rows": [["현재", 19, "b"], ["2036년", 34, "a"]]}, "nums": [["10.7", "년", "건강하지 못한 기간 (1990년 8.8년)", 1], ["13억", "명", "2050년 아시아태평양 60세 이상(가까이)"]], "src": "The Star 2026.11.14 (VnExpress 전재)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "미국 CMS (메디케어·메디케이드 서비스센터)", "co": "미국 · 2027 홈헬스 지급 제안 규칙 2026.07.01 · 등록 동결 조정 2026.11.12 발표", "title": "방문 돌봄 지급 2.4% 인상안과 부정 사업자 단속을 함께", "q": "지급은 조금 올리되, 신규 사업자 등록 동결과 단속은 이어 갑니다.", "hl": ["단속은"], "pts": ["<b>제도:<\/b> 2027년 기본 지급률 2.1% 인상(3.7억 달러), 홈헬스 지급 총액 2.4%(4.2억 달러) 증가안. 2020~2025년 과지급을 되돌리는 임시 조정 -3.0%가 함께 들어 있다.", "<b>지난해:<\/b> 2026년 지급은 -1.3%(2.2억 달러 감소, 2025.11.28 최종 규칙, 검색 요약).", "<b>등록 동결:<\/b> 홈헬스·호스피스 신규 메디케어 등록 동결(6개월 단위) 유지. 다만 기존 등록 기관은 2026.11.13부터 같은 주 안에서 새 사업장을 늘릴 수 있다.", "<b>숫자:<\/b> 캘리포니아 단속으로 145곳 등록 취소, 7.03억 달러 이상.", "<b>국내와 비교:<\/b> 일본 방문 개호 도산 64건처럼, 방문 돌봄은 나라마다 지급 수준과 부정 수급 단속 사이에서 흔들린다."], "bars": {"t": "미국 홈헬스 2027년 지급 인상안 (%)", "u": "%", "rows": [["2027 총액 증가안", 2.4, "a"], ["2027 기본 지급률", 2.1, "b"]]}, "nums": [["-1.3", "%", "2026년 지급 변화 (최종 규칙)"], ["-3.0", "%", "2027 과지급 되돌리기 임시 조정안"], ["4.2억", "달러", "2027 홈헬스 지급 증가안"], ["145", "곳", "캘리포니아 등록 취소", 1]], "src": "CMS 사실 자료 CMS-1844-P · Home Health Care News 2026.11.13", "grade": "확인"}, {"tm": "해외 · 유럽", "name": "Eurostat (EU 통계청)", "co": "EU · Demography of Europe 2026년판 · 2025.1.1 기준", "title": "EU 65세 이상 22%, 20년 새 17%에서 늘어", "q": "EU 인구 4억 5,100만 명 중 65세 이상은 22%, 9,900만 명입니다.", "hl": ["22%,"], "pts": ["<b>시장 상황:<\/b> EU 인구 4억 5,100만 명, 65세 이상 22%(9,900만 명). 2005년 17%에서 올랐다. 80세 이상 6%.", "<b>숫자:<\/b> 중위연령 44.9세(이탈리아 49.1세로 가장 높음), 기대수명 81.5세(2024), 합계출산율 1.34.", "<b>반응:<\/b> 출산율이 낮고 오래 사는 구조라 고령 비율이 계속 오른다.", "<b>국내와 비교:<\/b> 일본 29.6%는 EU 평균 22%보다 약 7.6%p 높다(정리자 계산). 유럽 안에서 가장 늙은 이탈리아(25.6%)보다도 높다."], "bars": {"t": "EU 65세 이상 비율 (%)", "u": "%", "rows": [["2005년", 17, "c"], ["2025년", 22, "b"], ["일본 2026", 29.6, "a"]]}, "nums": [["9,900만", "명", "EU 65세 이상"], ["44.9", "세", "EU 중위연령", 1]], "src": "Eurostat Demography of Europe 2026 edition", "grade": "확인"}], "flow": [{"k": "'역대 최고'가 이어진다", "d": "고령화율 29.6%, 취업자 943만 명, 연령별 취업률 모두 최고", "who": [1, 2, 3]}, {"k": "일본도 아시아도, 고령자는 더 오래 일한다", "d": "일본 65~69세 54.5% 취업, 아시아태평양 고령자 30~50%가 계속 일함", "who": [3, 5, 9]}, {"k": "더 나이 든 쪽으로 무게가 옮겨 간다", "d": "일본 75세 이상 1년 새 43만 명 증가, EU 80세 이상 6%, 중국 1년 새 1,307만 명 증가", "who": [1, 7, 11]}, {"k": "돌봄 공급은 버거워진다", "d": "일본 개호 사업자 도산 136건, 미국 지급 조정과 단속, 돌봄 현장 일손도 고령자", "who": [6, 10, 4]}, {"k": "보험이 먼저, 용품 시장이 뒤따른다", "d": "중국 장기요양보험 가입 3억 명 돌파, 은발경제 30조 위안 목표", "who": [7, 8]}, {"k": "여성 고령자가 더 많다", "d": "일본 여성 65세 이상 2,054만 명, 남성보다 483만 명 많음", "who": [1]}], "flowHeadline": "더 늙고, 더 오래 일하고, 돌봄 현장은 버거워진다", "apply": [{"k": "일본 수출 상세페이지에 '일하는 시니어' 장면을 넣는다", "p": "우선", "d": "일본 65~69세의 54.5%가 일하고, 일하는 사람 7명 중 1명이 65세 이상이다. 요실금팬티를 '집에서 쓰는 용품'이 아니라 '출근하고 일하는 하루를 받쳐 주는 속옷'으로 보여 준다. 큐텐재팬 상세페이지 첫 화면 문구와 사진을 이 방향으로 점검한다.", "r": "③ 고령자 취업 · ⑨ 아시아 포럼", "who": "2본부 · 일본 수출 담당"}, {"k": "일본 여성 시니어를 첫 고객으로 잡는다", "p": "우선", "d": "일본 65세 이상 여성은 2,054만 명으로 남성보다 483만 명 많다. 일본 판매용 요실금팬티는 여성 고령자와 그 딸 세대를 먼저 겨냥해 사이즈·색·문구를 맞춘다.", "r": "① 고령자 인구", "who": "2본부 · 일본 수출 담당"}, {"k": "75세 이상 급증을 고관절보호대 일본 조사의 근거로", "p": "검토", "d": "75세 이상이 1년 새 43만 명 늘었고 단카이 세대가 77~79세다. 넘어짐을 걱정하는 연령층이 빠르게 커지므로, 일본 개호보험 복지용구 제도에서 고관절보호대가 어떻게 다뤄지는지와 판매 경로를 조사한다.", "r": "① 고령자 인구", "who": "3본부 김등재 · 일본 수출 담당"}, {"k": "시설 영업 자료에 '일손을 덜어 주는 제품' 이야기를", "p": "검토", "d": "일본 개호 사업자 도산 원인에 일손 부족이 늘었고(3건 → 11건), 의료·복지에서 일하는 고령자가 122만 명이다. 한국 요양시설 영업에서도 갈아입히기 쉽고 손이 덜 가는 점을 앞세
