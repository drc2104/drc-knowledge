당 가격은 이번 회차에 확인된 것이 없어 가격표에는 확인된 수치와 '미공개'를 함께 적었습니다. 원료 단계 소식이라 고객 반응은 없습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.18", "name": "安徽保尔盈新材料科技 (保尔盈)", "co": "중국 · 과기일보(STDaily) 기사 · 2026 중국국제방직사선전람회 출품", "title": "염색된 폐옷감을 탈색 없이 재생 폴리에스터 필라멘트로 — 연 10만 톤 계획", "q": "탈색 단계를 빼고 색 있는 헌 옷감을 바로 재생 원사로 되돌린다는 것이 핵심 주장이다.", "hl": ["탈색", "바로"], "pts": ["<b>무엇이 새로운가:<\/b> 'T2T 중합체 해중합' 기술로, 기존 재생 공정이 필수로 하던 폐직물 탈색·탈염 없이 색 있는 폐직물을 재생 폴리에스터 필라멘트로 만든다고 한다. 염료 섞인 폐수를 피하고 물·에너지를 줄인다는 주장. 수집→펠릿→방적→제직을 지역 산업 클러스터로 한 줄로 엮었다.", "<b>숫자:<\/b> 총투자 10억 위안, 연 생산능력 10만 톤, 색견뢰도 4.5급 이상, 연구센터 2,800㎡ 신축, GRS 인증. 다음 단계는 탄소발자국 계산과 재생 섬유의 기능 변성.", "<b>마케팅:<\/b> '섬유→섬유 닫힌 순환'을 내세우고, 중국화학섬유공업협회가 '복제 가능한 기술 방안'이라 평가했다고 인용. 고객으로 아크테릭스·BYD를 들고, H&M·SHEIN과는 공급망 협의 중이라고 했다(기사 인용).", "<b>고객 반응:<\/b> 원료 단계 소식이라 해당 없음.", "<b>주의:<\/b> 업체 주장 + 관영 매체 보도다. 성적서·제3자 시험 수치는 기사에 없다. 영문 재게시(TV BRICS 11/19)에는 숫자가 없다.", "<b>우리에게:<\/b> 재생 폴리 안감·겉감 후보로 샘플과 시험서(색견뢰도·원사 강도·GRS 범위)를 요청할 만하다. 국내 재생 원사와 가격·품질을 비교할 기준이 하나 늘었다."], "nums": [["10만", "톤/년", "재생 폴리에스터 섬유 생산능력", 1], ["10억", "위안", "총투자"], ["4.5", "급+", "색견뢰도 (업체 주장)", 1], ["2,800", "㎡", "연구센터 신축"]], "src": "과기일보 2026-11-18 21:15 (원문 열람) · TV BRICS 2026-11-19 영문 재게시(숫자 없음)", "grade": "확인"}, {"tm": "상 · 11.19", "name": "대구 화섬직물 업계", "co": "한국 · 국제섬유신문 · 2026-11-19 19:40", "title": "\"8월 이후 신규 오더 사실상 전멸\" — 한국산 원단 가격 경쟁력 하락", "q": "한국산 원단 값이 너무 올라 예전 가격을 고집하는 해외 바이어와 상담이 안 된다.", "hl": ["가격", "상담이"], "pts": ["<b>무엇이 새로운가:<\/b> 튀르키예·모로코 수요가 무너지고 원사값·환율 영향으로 연말 휴업 우려가 나온다. 폴란드는 우크라이나 전쟁 뒤 5년간 냉각, 모로코 세관 창고는 반출이 거의 끊겼다. 중동 포멀용 일부 업체만 정상 가동.", "<b>숫자:<\/b> 8월 이후 신규 오더 '사실상 전멸', 최근 10일간 '예년의 20% 수준' 저가 원단 '두 컨테이너' 계약, 모로코 세관 창고는 '컨테이너 하나만 남기고' 반출.", "<b>업계 반응:<\/b> \"일반 폴리에스테르 직물은 상당 기간 회복을 기대하기 …\"(기사 속 업체 증언, 일반 고객 반응은 아님).", "<b>마케팅:<\/b> 해당 없음(업계 상황 기사).", "<b>우리에게:<\/b> 국내 일반 폴리 원단은 재고·납기 협상에서 사는 쪽이 유리한 시장일 수 있다(추정). 반대로 값을 받는 것은 흡습속건·재생·PFAS 없는 방수 같은 기능 소재뿐이므로, 우리 제품은 일반 직물이 아니라 기능 소재로 차별화한다."], "nums": [["20", "%", "최근 10일 저가 계약 (예년 대비 수준)", 1], ["2", "컨테이너", "최근 10일 저가 원단 계약"], ["5", "년", "폴란드 시장 냉각 (우크라이나 전쟁 뒤)"]], "src": "국제섬유신문 82301 (원문 열람)", "grade": "확인"}, {"tm": "중 · 11.19", "name": "중국 화섬사 시장", "co": "중국 · 국제섬유신문 · 2026-11-19 19:10", "title": "수입 폴리에스터사 값, 8~10월 오름세 끝나고 11월 9일부터 kg당 3센트 인하", "q": "석 달 오르던 폴리에스터 원사 값이 11월에 내림세로 돌아섰다.", "hl": ["내림세로"], "pts": ["<b>시장 상황:<\/b> 8월부터 10월까지 오르던 수입 폴리에스터사 가격이 11월 하락 반전. 기사는 미국 선거 결과·국제 유가 하락·중국 내수·수출 수요 약세를 이유로 든다. 직물·니트 수요가 약해 사 거래는 '거의 개점휴업'.", "<b>숫자:<\/b> '11월 9일부터 kg당 3센트씩 일제히 내렸다'. 절대 가격은 기사에 없다.", "<b>해석 주의:<\/b> 제목의 '수입사'가 수입 원사인지 수입업체인지 기사만으로는 완전히 가려지지 않는다(추정). 원사 가격 방향 신호로만 쓴다.", "<b>국내와 비교:<\/b> 대구 직물업계(②)의 '원사값 부담' 하소연과 맞물린다. 원사 값이 내려도 직물 주문이 먼저 살아나지는 않았다.", "<b>우리에게:<\/b> 폴리 계열 원단 발주는 하락 흐름이 이어지는 12월에 협상력이 높을 수 있다."], "nums": [["3", "센트/kg", "11월 9일부터 일제 인하", 1], ["3", "개월", "인하 전 오름세 (8~10월)"]], "src": "국제섬유신문 82289 (원문 열람 · '수입사' 해석은 추정)", "grade": "확인"}, {"tm": "중 · 11.18", "name": "영국 리즈대 LITAC", "co": "영국 · 학술지 Waste Management · Sourcing Journal(야후 재게시) 11/18 · Ecotextile 11/19", "title": "면 직물은 실이 덜 교차하는 구조일수록 재생 섬유가 길게 남는다", "q": "면 저지는 되살린 섬유의 약 60%가 다시 실로 뽑기엔 너무 짧았다.", "hl": ["저지는", "짧았다."], "pts": ["<b>제품(연구):<\/b> 버진 면으로 직물 13종(우븐 12 + 싱글 저지 1)을 만들어 실험실 파쇄기에 3회 넣고 되살린 섬유 길이를 쟀다. 트윌·새틴처럼 교차점이 적은 직물일수록 짧은 섬유가 적었다. 2합사·코밍사·초장섬 면도 길이 유지에 유리.", "<b>숫자:<\/b> 교차점 적은 직물은 되살린 섬유 질량의 '최대 70%'가 12.7mm 초과. 저지는 '약 60%'가 방적 가능 길이(12.7mm) 미만.", "<b>한계:<\/b> 새 무염색 면으로 시험했다. 염색·가공·세탁 이력이 있는 실제 폐기물은 다를 수 있고, 실제로 실을 다시 뽑지는 않았다.", "<b>국내와 비교:<\/b> 국내 소식 중에는 같은 주제의 연구가 없었다. 원단 구조(우븐·저지)에 따라 재활용 가능성이 크게 다르다는 해외 근거로 쓴다.", "<b>우리에게:<\/b> 면 속옷(저지)은 재방적 가능 비율이 낮다. '재활용 가능' 문구는 근거를 점검한 뒤에만 쓰고, 재활용을 염두에 둔다면 단일 소재·짧은 섬유가 덜 나오는 설계가 유리하다."], "nums": [["70", "%", "교차점 적은 직물, 12.7mm 초과 섬유 (최대)", 1], ["60", "%", "면 저지, 방적 가능 길이 미만 섬유 (약)", 1], ["13", "종", "시험 직물 (우븐 12 + 저지 1)"], ["12.7", "mm", "방적 가능 최소 길이"]], "src": "야후 재게시(Sourcing Journal/WWD, 원문 열람) · Ecotextile 2026-11-19 (403으로 검색 요약만)", "grade": "확인"}, {"tm": "중 · 11.19", "name": "효성티앤씨 등 섬유·소재 상장사 80곳", "co": "한국 · 표식이 있다는 것만으로 환경 성능이 증명되지는 않는다고 기사 스스로 경고했다.", "hl": ["표식이"], "pts": ["<b>제품:<\/b> 섬유에 눈에 안 보이는 분자 마커를 심고 기록으로 면 원산지·재생 함량을 확인하는 추적 기술. 디지털 제품 여권(DPP)과 연결한다.", "<b>숫자:<\/b> 2025년 12월 산업용 면 시험(기계 재생 포함), 2026년 1월 데님 재생 협력, 2026년 5월 디지털 소재 여권 플랫폼 출시. 함량·비용·효과 수치는 공개되지 않았다.", "<b>반응:<\/b> 기사가 \"표시자가 있다는 것이 환경 성능을 입증하지는 않는다\"고 경고. 업체 주장 단계.", "<b>국내와 비교:<\/b> 이번 회차 국내 소식에는 추적 기술이 없었다. 리즈대 연구(④)·CleanDye(⑥)와 함께 '친환경을 증명하라'는 흐름의 한 갈래다.", "<b>우리에게:<\/b> 유럽 디지털 제품 여권 시대를 대비하는 참고 자료. 지금은 지켜보기."], "nums": [["2025.12", "", "산업용 면 시험 (기계 재생 포함)"], ["2026.5", "", "디지털 소재 여권 플랫폼 출시", 1]], "src": "Textalks 2026-11-10 (원문 열람)", "grade": "확인"}], "flow": [{"k": "재생 원료가 '규모' 단계로 (국내·해외 같은 방향)", "d": "중국 保尔盈 연 10만 톤, 국내 효성 regen BIO·휴비스 재생 원사. 재생 소재 경쟁이 성능에서 물량·가격으로 넘어간다.", "who": [1, 5]}, {"k": "일반 폴리 직물은 밀리고 소재사는 번다", "d": "대구 직물업계 오더 전멸 vs 효성티앤씨 영업이익 +97%. 원료·소재 단과 직물 단이 갈렸고, 수출 반등도 품목별로 엇갈린다.", "who": [2, 5, 7]}, {"k": "원사 값은 내림세로", "d": "중국 폴리에스터사가 11/9부터 kg당 3센트 인하. 직물 수요가 약해 원사 거래도 멈칫하다.", "who": [3, 2]}, {"k": "'친환경'은 시험·추적·경제성 검증으로 (해외)", "d": "리즈대 재생 섬유 길이 연구, SMX 분자 마커, CleanDye 물 없는 염색 중단 — 모두 '그냥 친환경'이 아니라 근거와 비용을 따진다.", "who": [4, 9, 6]}, {"k": "정부·제도 움직임은 12월로", "d": "섬유패션산업 특별법 12/8 국회 간담회. 지원 대상이 원료~유통으로 정해지면 국산 기능성 원단 개발 지원 통로가 된다.", "who": [8]}], "flowHeadline": "재생 원료는 규모로, 일반 직물은 가격에 밀리고, 친환경은 증명을 요구받는다", "apply": [{"k": "[원단 시험] 재생 폴리 후보는 시험서부터 받는다", "p": "우선", "d": "탈색 없이 만든다는 중국 재생 폴리 같은 새 원사는 색견뢰도·인장강도·GRS 인증 범위 시험서를 먼저 받는다. 국내 재생 원사와 같은 조건으로 비교해 업체 주장과 실제 수치를 나란히 본다.", "r": "① 保尔盈", "who": "4본부"}, {"k": "[제품] 겉감·안감은 '기능 소재'로 차별화", "p": "우선", "d": "일반 폴리 직물은 가격 경쟁력을 잃고 있다. 우리 제품의 겉감·안감은 흡습속건·소취·PFAS 없는 방수처럼 시험값으로 보여 줄 수 있는 기능 소재를 기준으로 고르고, 상세페이지에도 그 시험값을 앞세운다.", "r": "② 대구 직물업계 · ⑤ 상장사 실적", "who": "4본부 · 2본부"}, {"k": "[마케팅] '재활용 가능'·'친환경' 문구 점검표 만들기", "p": "우선", "d": "면 저지는 되살린 섬유의 약 60%가 다시 실이 되기 어렵다는 연구가 나왔다. '재활용 가능'·'친환경'·'물 없는 염색' 같은 말은 근거 시험서·인증서가 있을 때만 쓰도록 문구 점검표를 만든다.", "r": "④ 리즈대 · ⑥ CleanDye · ⑨ SMX", "who": "2본부 · 4본부"}, {"k": "[가격 행사] 폴리 원단 발주는 하락 흐름을 확인하고", "p": "검토", "d": "중국 폴리에스터사 값이 내림세로 돌아섰고 국내 직물은 주문이 부족하다. 폴리 계열 원단 발주 때 납기·최소주문량·단가 조건을 넓게 협상할 수 있는지 시세 흐름을 보며 판단한다.", "r": "② 대구 직물업계 · ③ 폴리에스터사", "who": "4본부"}, {"k": "[원단 시험] 스판덱스 원료 값 흐름 지켜보기", "p": "검토", "d": "스판덱스 원사 업체의 이익이 크게 늘어 가격 결정력이 올라간 상태다. 바이오 스판덱스 원료 원가가 10~15% 오를 수 있다는 이야기도 있어, 일반·바이오 스판덱스 견적 흐름을 분기마다 비교한다.", "r": "⑤ 상장사 실적", "who": "4본부"}, {"k": "[제품] 섬유특별법 간담회 결과 확인하고 지원 사업 대비", "p": "유지", "d": "12월 8일 국회 간담회에서 지원 대상과 범위가 어떻게 정해지는지 확인한다. 국산 기능성 원단 개발 지원 통로가 열리면 신청 자료를 준비한다.", "r": "⑧ 섬유특별법", "who": "4본부"}], "media": {"headline": "원료 단계 소식이라 행사 다시보기는 없어, 흡습속건·발수·바이오 스판덱스·국내 신소재를 설명하는 영상 6편을 붙였습니다", "videos": [{"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo", "len": "길이 미확인", "note": "Dry Guy Waterproofing · 발수 가공(DWR)과 PFAS 쟁점의 기본 개념"}, {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0", "len": "길이 미확인", "note": "KATRI시험연구원(시험기관) · 흡한속건 시험 방법 (2020년 영상이라 기준일 주의)"}, {"title": "[품질] 스포츠 의류의 기능성, 흡습, 속건?!", "url": "https://www.youtube.com/watch?v=roj9MmUZWIQ", "len": "길이 미확인", "note": "롯데홈쇼핑 바로알기 · 흡습속건을 소비자 눈높이로 설명"}, {"title": "regen BIO, For a Better Tomorrow (Ep5. Comfort, Sustainability, and You)", "url": "https://www.youtube.com/watch?v=uOfmKMrnKG0", "len": "길이 미확인", "note": "Hyosung Performance Textiles(업체 채널) · 바이오 스판덱스 공식 설명 (업체 홍보, 소식 ⑤)"}, {"title": "[Made In Korea] 휴비스, 초경량 흡한속건 나일론 소재인 '휠셀(Whicel)' 선보여", "url": "https://www.youtube.com/watch?v=iuB4eDdwREc", "len": "길이 미확인", "note": "AVING NEWS · 국내 소재사 신소재 소개 방송"}, {"title": "[아크테릭스] 페이징원단 수분 흡수건조력 테스트 - Phasic Material Water Drop", "url": "https://www.youtube.com/watch?v=3GvXW-WsYeU", "len": "길이 미확인", "note": "Arc'teryx Korea · 흡수·건조 비교 시연 방식 참고 (원단 성능을 보여 주는 법)"}], "checked": [["유튜브 (oembed 확인, 2026-11-21)", "설명 영상 7편 존재·제목·채널 확인(내용은 보지 못함). 행사 다시보기 없음"], ["국제섬유신문(itnk.co.kr) 11/13~21", "있음 — ②③⑤⑦⑧ 채택"], ["TIN뉴스(tinnews.co.kr)", "있음 — ⑥ 채택 (고어텍스 50주년·심파텍스는 이전에 다룸)"], ["어패 rts/"]], "numberNotes": [["保尔盈 생산능력", "과기일보는 연 10만 톤·10억 위안. TV BRICS 영문본은 숫자 없음. 색견뢰도 4.5급은 업체 주장(제3자 시험 수치 없음)"], ["중국 폴리에스터사 인하", "'kg당 3센트'만 확인, 절대 가격 미공개. 제목의 '수입사'가 수입 원사인지 수입업체인지 불분명(추정)"], ["리즈대 연구", "야후(Sourcing Journal)는 '최대 70%·저지 약 60% 미만'. Ecotextile 원문은 403이라 검색 요약만 확인. 새 무염색 면 기준이라 실제 폐기물과 다를 수 있음"], ["대구 직물 '20%'", "'예년의 20% 수준' 저가 원단 계약이라는 업체 증언. 정확히 물량인지 가격인지 기사 표현 그대로 옮김"], ["효성 바이오 BDO 규모 (이전 회차)", "11/16 기록 2.5만 톤 / 11/19 기록 5만 톤 — 이번 회차 새 근거 없음, 공식 확인 대기"], ["가격표", "이번 회차 원단 1장당·m당 가격 확인 0건 → 확인된 수치와 '미공개'를 함께 적음"]], "madeBy": "조사: 소넷 조사원 · 정리·판단: 오퍼스 · 작성 2026-11-21", "glossaryHeadline": "원단 소식을 읽을 때 필요한 말 13개", "glossary": [{"term": "해중합", "easy": "플라스틱을 분자 조각 단위로 되돌려 다시 원료로 만드는 방법.", "why": "소식 ①의 핵심. 색 있는 헌 옷감을 새 원사처럼 되살릴 수 있는지가 여기에 달렸다."}, {"term": "텍스타일 투 텍스타일(T2T)", "easy": "헌 옷감을 새 옷감 원료로 되돌리는 순환.", "why": "재생 소재 마케팅 문구가 맞는지 따지는 기준이다(소식 ①)."}, {"term": "색견뢰도", "easy": "빨래·땀·마찰에도 색이 빠지지 않는 정도. 급수가 높을수록 잘 안 빠진다.", "why": "소식 ①은 4.5급 이상이라고 주장했다. 시험서로 확인해야 한다."}, {"term": "GRS", "easy": "재생 원료가 얼마나 들었는지와 만드는 공정을 인증하는 국제 기준.", "why": "재생 소재를 살 때 꼭 받아야 할 서류다."}, {"term": "흡한속건", "easy": "땀을 빨리 빨아들이고 빨리 말리는 성능.", "why": "속옷·생리팬티 겉감의 핵심 성능이다.", "video": {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0"}}, {"term": "DWR(발수 가공)", "easy": "겉감 표면에 물이 구슬처럼 맺혀 흘러내리게 하는 처리.", "why": "방수층 위 겉감 가공으로, PFAS 규제와 바로 이어진다.", "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "PFAS", "easy": "물·기름을 튕기게 하는 불소 화합물. 잘 분해되지 않아 규제 대상이다.", "why": "방수·발수 원단을 고를 때 시험서가 꼭 필요하다.", "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "바이오 스판덱스", "easy": "석유 대신 사탕수수 같은 식물 원료를 일부 쓴 신축 실.", "why": "속옷 신축 소재의 원가와 마케팅에 영향을 준다(소식 ⑤).", "video": {"title": "regen BIO, For a Better Tomorrow (Ep5. Comfort, Sustainability, and You)", "url": "https://www.youtube.com/watch?v=uOfmKMrnKG0"}}, {"term": "리오셀(텐셀)", "easy": "나무 펄프를 용제로 녹여 만든 부드러운 섬유.", "why": "피부에 닿는 속옷 겉감·안감 후보다.", "video": {"title": "The TENCEL™ Lyocell story - 3 of 5 The Process", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4"}}, {"term": "방적 가능 길이(12.7mm)", "easy": "되살린 섬유가 다시 실이 되려면 필요한 최소 길이.", "why": "소식 ④. 면 저지는 약 60%가 이보다 짧아 재활용이 어렵다."}, {"term": "초임계 CO₂ 염색", "easy": "물 대신 압축한 이산화탄소로 염색하는 방법.", "why": "소식 ⑥. 물 없는 염색이 비용 때문에 멈춘 사례다."}, {"term": "분자 마커·디지털 제품 여권(DPP)", "easy": "섬유에 보이지 않는 표식을 심고, 기록으로 원산지·재생 함량을 증명하는 방식과 제도.", "why": "소식 ⑨. 유럽 규제에 대비하는 참고 자료다."}, {"term": "접촉냉감", "easy": "피부에 닿는 순간 차갑게 느끼는 성질.", "why": "여름 속옷 원단을 고를 때 비교하는 성능으로, 이전 소재 소식과 이어진다."}]}</script>
