terials Matter Standard, WTO TBT 통보.", "<b>숫자:<\/b> 현장 상담 43건, 기업 상담 7건, 업계 애로 4건(TBT종합지원센터와 공동 대응), 자료 200부 배포.", "<b>연결:<\/b> 기술시험·인증 검토는 KOTITI시험연구원 등 전문기관으로 연결한다. 사업명은 '2026년 해외 기술규제 조사·분석 및 대응지원 사업'(산업부·국가기술표준원 지원).", "<b>고객 반응:<\/b> 업계 상담 건수 외에는 해당 없음.", "<b>우리에게:<\/b> 요실금·생리팬티 방수층·발수 가공 원단의 PFAS 여부와 성적서 점검을 상담할 수 있는 창구다. 해외 판매를 넓힐 때 ESPR·GRS 서류 준비도 함께 물을 수 있다."], "bars": {"t": "현장 대응 실적 (건)", "u": "건", "rows": [["현장 상담", 43, "a"], ["기업 상담", 7, "b"], ["업계 애로", 4, "c"]]}, "nums": [["43", "건", "현장 상담", 1], ["200", "부", "배포 자료"], ["5", "가지", "다룬 규제 (PFAS·ESPR·GRS·MMS·TBT)"]], "video": {"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=uzq4d-ks-G4"}, "src": "TIN뉴스 32518 (2026-11-05)", "grade": "확인"}, {"tm": "중 · 11.03", "name": "Altag Fiber Club (AltMat · Fashion for Good)", "co": "인도·네덜란드 · FashionUnited 독일판 (11/03 전후)", "title": "농업 잔재 섬유 Altag 구매 클럽에 C&A·Zalando 첫 가입", "q": "유럽 브랜드들이 '함께 사 주기로 약속'해서 신소재 대량 생산의 위험을 나눈다.", "hl": ["함께", "약속'해서"], "pts": ["<b>시장 상황:<\/b> 식용·약용 식물 등 농업 잔재로 만든 섬유 Altag. 클럽은 참여사의 자금과 최소 구매 약속을 모아 대량 생산 위험을 나눈다.", "<b>제품:<\/b> C&A·Zalando가 첫 옷을 만들기로 약속하고 기술 요건·생산 공정·소비자 기대를 공유한다. Zalando는 자체 브랜드에 쓸 계획.", "<b>숫자:<\/b> 클럽 창립 2025년 6월. 생산량·출시 시기는 공개되지 않았다. BCG·Fashion for Good 분석(2025년 2월)에서 소재가 패션 업계 배출의 91%, 제품 원가의 최대 약 30%.", "<b>반응:<\/b> 상용화 전이라 소비자 반응은 없다.", "<b>국내와 비교:<\/b> 국내에서는 이런 공동 구매 약속 방식의 원사 개발 소식이 이번 회차에 없었다. 소규모 업체끼리 원사 개발을 나눠 지는 협업 모델로 참고할 만하다."], "bars": {"t": "패션에서 소재가 차지하는 몫 (%, BCG·Fashion for Good 2025.2)", "u": "%", "rows": [["업계 배출 중 소재", 91, "a"], ["제품 원가 중 소재(최대)", 30, "b"]]}, "nums": [["91", "%", "패션 배출 중 소재 몫", 1], ["30", "%", "제품 원가 중 소재 몫(최대 약)"], ["2", "곳", "첫 가입 브랜드 (C&A·Zalando)"]], "src": "FashionUnited 독일판 (2026-11-03 전후, 정확한 일자는 추정)", "grade": "확인"}, {"tm": "하 · 11.11", "name": "제40회 섬유의 날 (산업부)", "co": "한국 · 서울경제·한국섬유신문 (기념식 11/11 서울 섬유센터)", "title": "정부 섬유 지원 방향: 첨단산업용 섬유·공급망·해외진출", "q": "정부 지원의 무게는 방산·우주 같은 첨단 소재에 실렸고, 속옷 소재 지원 언급은 없었다.", "hl": ["방산·우주"], "pts": ["<b>무엇이 새로운가:<\/b> 산업부 산업성장실장이 첨단산업용 섬유 육성, 국내 제조기반 공급망 안정, K섬유패션 해외진출 지원 의지를 밝혔다(검색 요약).", "<b>포상:<\/b> 금탑 세왕섬유 최재락 회장, 은탑 영원무역 박재용 사장, 산업포장 유니아텍스(스판덱스 커버링).", "<b>숫자:<\/b> 2월에 발표한 15개 과제 230억 원(검색 요약, 이번 행사에서 새로 나온 숫자 아님).", "<b>마케팅·고객 반응:<\/b> 정부 행사라 해당 없음.", "<b>우리에게:<\/b> 바로 쓸 곳은 없다. 지원사업 공고에서 '고부가 섬유소재 개발·수출' 항목은 원단 공동 개발 지원 근거로 참고한다.", "<b>주의:<\/b> 기사 제목만 확인했고 본문은 검색 요약이다(추정)."], "nums": [["40", "회", "섬유의 날"], ["15", "개 과제", "2월 발표 지원 과제 (검색 요약)"], ["230억", "원", "2월 발표 지원 규모 (검색 요약)"]], "src": "한국섬유신문 기사 목록 (제목 확인) · 서울경제 본문 미열람", "grade": "추정"}, {"tm": "하 · 10.27", "name": "Aimplas", "co": "스페인 · Innovation in Textiles", "title": "박테리아가 만드는 셀룰로오스로 생분해 얼굴 마스크", "q": "균이 만든 순수 나노 셀룰로오스가 물을 많이 머금고 피부 모양에 잘 맞는다는 연구다.", "hl": ["물을", "머금고"], "pts": ["<b>제품:<\/b> Komagataeibacter 균이 만드는, 리그닌·헤미셀룰로오스가 없는 나노 셀룰로오스. 생분해 하이드로겔 얼굴 마스크(보습·햇볕 뒤 관리)와 상처 드레싱·약물 패치 가능성을 소개했다.", "<b>숫자:<\/b> 기사에 수치가 없다.", "<b>반응:<\/b> 연구 단계라 소비자 반응 없음. 의학적 효과는 옮기지 않았다.", "<b>국내와 비교:<\/b> 국내에서 같은 방향 소식은 이번 회차에 없었다. 속옷 언급도 없다.", "<b>우리에게:<\/b> 바로 쓸 곳은 없고, 피부에 닿는 '수분을 머금는 소재' 흐름을 지켜보는 참고 정보로 둔다."], "video": {"title": "\"The TENCEL(tm) Lyocell story - 3 of 5 The Process\"", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4"}, "src": "Innovation in Textiles (2026-10-27)", "grade": "확인"}, {"tm": "하 · 10.27", "name": "AMANN", "co": "독일 · TEXtalks (인터뷰 10/26)", "title": "재봉실 5종 공개: 퇴비화되는 셀룰로오스 실 AeoniQ Fil·물에 녹는 Waterfil 등", "q": "원단만이 아니라 재봉실까지 '같은 소재로, 분해되게' 바뀌고 있다.", "hl": ["재봉실까지"], "pts": ["<b>제품:<\/b> ① Smart Stitch(열로 녹아 해체되는 실) ② AeoniQ Fil: 100% 셀룰로오스 재봉·자수사, Texprocess Innovation Award 2026 수상 ③ Waterfil: 물에 녹는 PVA계 임시 봉제사 ④ 반사사 2종 ⑤ 100% 재생 PET 자수사(GRS 선택).", "<b>숫자:<\/b> AeoniQ Fil은 산업 퇴비화에서 12주 안에 분해. Smart Stitch는 데카트론 약 35만 벌·베르쉬카 데님 5만 벌 적용, 해체 때 원단 최대 90% 회수(업체 주장).", "<b>반응:<\/b> 브랜드 적용 사례가 반응의 전부다(소비자 후기 없음).", "<b>국내와 비교:<\/b> 국내에서 재봉사 쪽 친환경 소식은 이번 회차에 없었다.", "<b>우리에게:<\/b> 셀룰로오스 단일 소재 팬티를 노린다면 실도 같은 소재여야 한다. 속옷 직접 언급은 없다."], "bars": {"t": "Smart Stitch 적용 벌 수 (만 벌, 업체 주장)", "u": "만 벌", "rows": [["데카트론", 35, "a"], ["베르쉬카 데님", 5, "b"]]}, "nums": [["12", "주", "AeoniQ Fil 산업 퇴비화 분해", 1], ["90", "%", "해체 때 원단 회수(최대, 업체 주장)"], ["5", "종", "새 재봉실"]], "src": "TEXtalks (2026-10-27)", "grade": "확인"}], "flow": [{"k": "셀룰로오스 + 합성섬유로 '피부 느낌과 속건'을 함께 (국내·해외 같은 방향)", "d": "쿠라레이는 큐프라에 이형단면 폴리에스터를, AMANN은 셀룰로오스 재봉실을 내놨다. 국내 원단사도 포틀랜드에서 기능성 니트·특수사로 상담을 받았다. 촉감은 셀룰로오스, 기능은 합성섬유로 나누는 조합이 공통이다.", "who": [1, 8, 3]}, {"k": "표기와 시험이 판매 근거가 된다", "d": "중국 소협은 혼용률 표기 일치와 회복률을 봤고, 국내 화섬협회는 PFAS·ESPR 서류 대응을 상담했다. '말'보다 '시험값'이 먼저다.", "who": [2, 4]}, {"k": "국내 원단사는 해외 바이어 직접 상담으로", "d": "포틀랜드 한국관 상담 213건, 샘플·견적 100건 이상. 정부도 섬유의 날에 해외진출 지원을 말했다.", "who": [3, 6]}, {"k": "유럽은 신소재를 '구매 약속 + 공동 자금'으로 키운다", "d": "Altag 클럽은 브랜드의 최소 구매 약속으로 대량 생산 위험을 나눈다. 박테리아 셀룰로오스는 아직 연구 단계다.", "who": [5, 7]}], "flowHeadline": "촉감은 셀룰로오스, 근거는 시험값으로 모인다", "apply": [{"k": "[원단 시험] 쿠라레이 큐프라 복합 원사 샘플 받기", "p": "우선", "d": "11월 18~19일 상하이 전시 부스 B38에서 샘플·혼용률·최소 주문량을 문의한다. 두 종(방적사형·필라멘트형)을 모두 받아 촉감과 흡수·건조 속도를 비교한다.", "r": "① 쿠라레이트레이딩", "who": "4본부"}, {"k": "[제품] 큐프라+폴리에스터 원단을 요실금·생리팬티 겉감 후보에 넣기", "p": "우선", "d": "샘플이 들어오면 지금 겉감 후보들과 같은 조건으로 흡수 속도(KATRI 흡한속건 시험법)를 잰다. 업체 주장인 흡방습·접촉냉감은 우리 시험값이 나온 뒤에만 판단한다.", "r": "① 쿠라레이트레이딩", "who": "4본부 · 3본부"}, {"k": "[원단 시험] 혼용률 표기 시험과 반복 신축 뒤 회복률 시험 미리 받기", "p": "우선", "d": "중국 소협이 본 두 항목이다. 쓰는 원단의 실제 혼용률이 표기와 맞는지, 여러 번 늘렸다 놓은 뒤 몇 %로 돌아오는지 성적서를 받아 둔다.", "r": "② 북경시소비자협회", "who": "4본부 · 3본부"}, {"k": "[마케팅] 상세페이지에 '혼용률 시험 일치·세탁 뒤 회복률' 수치 싣기", "p": "검토", "d": "시험 성적서가 나온 수치만 문구로 옮긴다. 해외 판매(일본 등)를 넓힐 때도 같은 근거를 쓸 수 있다. 공개 전 광고 문구 점검을 거친다.", "r": "② 북경시소비자협회", "who": "2본부"}, {"k": "[제품] 포틀랜드 한국관 14개사에 속옷용 니트·특수사 문의", "p": "검토", "d": "공개된 14개사 목록으로 속옷용 니트·특수사 보유 여부를 같은 질문지로 묻는다. 미국 샘플 요청이 몰리기 전에 샘플 순서를 잡아 둔다.", "r": "③ 포틀랜드 통합한국관", "who": "4본부"}, {"k": "[원단 시험] 화섬협회 기술규제 창구로 방수층 PFAS 상담", "p": "우선", "d": "방수층·발수 가공 원단의 PFAS 여부와 성적서 점검을 상담하고, 시험은 연결해 주는 전문기관에 의뢰한다. ESPR·GRS 서류도 같은 자리에서 묻는다.", "r": "④ 한국화학섬유협회", "who": "4본부 · 3본부"}, {"k": "[제품] 셀룰로오스 원단을 쓸 때는 재봉실까지 같은 계열로 검토
