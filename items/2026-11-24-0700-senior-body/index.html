 지역사회 치매관리율 76.4% → 84.4%. 그러나 치매관리주치의 시범사업 지속 참여율은 12.4%, 만성질환까지 묶은 통합관리 참여율은 5.3%에 그쳤다. 일본·영국·미국 사례도 소개.", "<b>새 지표 제안(최호진 한양의대):<\/b> '5년 지역사회 유지율' = 진단 뒤 5년간 사망이나 장기 입원·입소 없이 집·동네에서 사는 비율. 전국 건강보험자료로 치매 환자 약 78만 명을 분석했다.", "<b>비용 추산:<\/b> 관리 비율이 1%포인트 오르면 치매 100만 명 기준 연간 약 1,400억 원의 비용 차이가 날 수 있다고 추산(확정된 절감액 아님).", "<b>패널토의:<\/b> 박춘선(심평원), 한은정(건보공단 건강보험연구원), 최호진, 이선민, 오성일(경희의대). 토의 내용은 기사에 공개되지 않음.", "<b>제도 요구(기자간담회):<\/b> 레켐비 건보 급여는 쉽지 않고, 비급여 치료의 상담·검사 제도에 한계가 있다. 통합돌봄 예산 900억 원이 언급됐지만 치매안심센터와 연계가 부족하다. 최호진 기획이사 \"단순한 상담을 넘어 질환 교육 차원 지원이 필요하다\".", "<b>생활 불편:<\/b> 집에서 오래 지내려면 배회·넘어짐·화장실 실수 같은 일상 위험을 가족이 매일 감당해야 한다(정리자 판단, 행사에서 제품을 다루지는 않음).", "<b>필요한 제품 · 급여 복지용구:<\/b> 배회 감지, 넘어짐 대비 보호대, 배뇨 돌봄 용품. 배회감지기는 장기요양 복지용구 품목이다(제도 일반 사항, 이번 조사에서 재확인하지 않음).", "<b>우리 회사:<\/b> 고관절보호대(복지용구 급여 등재 합격, 2027년 3월 급여 판매 예정)와 요실금팬티(등재품 포함)를 보유. 배회 감지 기기는 빈자리. '집에서 사는 5년'은 우리 제품을 설명하는 정책 언어로 쓸 수 있다."], "shift": {"from": "76.4%", "to": "84.4%", "cap": "지역사회 치매관리율 목표 (제5차 치매관리종합계획)"}, "bars": {"t": "치매관리주치의 시범사업 참여율 (%, 이선민 발표)", "u": "%", "rows": [["지속 참여율", 12.4, "a"], ["만성질환 포함 통합관리 참여율", 5.3, "b"]]}, "nums": [["78만", "명", "분석한 치매 환자(건강보험자료)"], ["1,400억", "원/년", "관리 비율 1%p당 비용 차이 추산(100만 명 기준)", 1], ["900억", "원", "간담회에서 언급된 통합돌봄 예산"]], "video": {"title": "치매가 걱정될 땐, 치매안심센터", "url": "https://www.youtube.com/watch?v=VDpXmqltwwk"}, "src": "디멘시아뉴스 11276 · 데일리메디 942612 · 헬스이슈앤뉴스 45820", "grade": "확인"}, {"tm": "해외 · 일본", "name": "후지레비오(H.U.그룹)", "co": "일본 · 약사일보(薬事日報) · 2026.11.11 승인", "title": "일본 첫 혈장 pTau217 검사 시약 승인", "q": "일본도 피검사로 뇌 변화를 가늠하는 시대에 들어섰다.", "hl": ["피검사로"], "pts": ["<b>제품:<\/b> 후생노동성이 혈장 pTau217 검사 시약(루미펄스 G1200·G600II용)의 제조판매를 승인했다. 일본 첫 pTau217 체외진단약으로, 2025년 11월에 신청했다.", "<b>추가 승인:<\/b> 11월 17일 혈장 β-아밀로이드1-42 시약도 승인. 두 시약의 비율로 아밀로이드 병리 파악을 돕는다.", "<b>숫자:<\/b> 가격·판매·보험 적용은 기사에 없음.", "<b>국내와 비교:<\/b> 한국은 혈장 p-tau181이 신의료기술 승인을 받았고, 일본은 pTau217 승인으로 다른 단계다. 우리에게는 '증상 있는 사람의 확인용'이라는 학회 메시지를 알아 두는 정도."], "table": [["나라", "인지(치매) 혈액검사 상태", "낙상·돌봄 제품 숫자"], ["한국", "p-tau181 co": "미국 · Medical Economics · 2026.09.15", "title": "피부에 붙이는 낙상 감지 패치, 가족 알림 월 구독", "q": "넘어짐을 알려 주는 기기가 복지용구 밖 소비자 구독 상품으로 나왔다.", "hl": ["소비자", "구독"], "pts": ["<b>제품:<\/b> 피부에 붙이는 낙상 감지·활동 추적·긴급 알림 패치(소프트웨어 FallSoft). 방수, 한 번 충전으로 1주일. 10월 출하 시작(기사 요약문).", "<b>숫자:<\/b> 일회성 $99(본체 + 6개월분 교체 패치), 가족 알림 구독 월 $9.99, 전문 모니터링 월 $29.99. 소비자용이라 미국 공공보험(CMS) 원격 모니터링 청구 틀 밖이다.", "<b>반응:<\/b> CEO Nick Payzant \"the most advanced personal senior safety system that exists today\"(회사 측 주장).", "<b>국내와 비교:<\/b> 국내 복지용구 급여 품목이 아니라 가족이 직접 사는 구독형 모델. 넘어짐 대비 보호대와 '알림'을 묶는 방식의 참고 사례."], "bars": {"t": "SafePatch 가격 (달러, Medical Economics)", "u": "달러", "rows": [["본체+6개월 패치(1회)", 99, "a"], ["전문 모니터링(월)", 29.99, "b"], ["가족 알림(월)", 9.99, "c"]]}, "nums": [["1", "주일", "한 번 충전 사용"], ["9.99", "달러/월", "가족 알림 구독", 1]], "src": "Medical Economics 2026.09.15", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 시장감독총국 집계(인민일보 해외판)", "co": "중국 · 인민일보 해외판(광명망 게재) · 2026.08.25", "title": "고령친화(适老化) 제품 21.6만 종, 센서·웨어러블이 가장 빠르게 큰다", "q": "중국 시니어 제품 중 센서와 웨어러블이 30%대로 가장 빠르게 늘었다.", "hl": ["센서와", "웨어러블이"], "pts": ["<b>시장 상황:<\/b> 60세 이상 3억 2,338만 명, 총인구의 23.0%(2025년 말). 고령친화 제품 21.6만 종, 약 1만 개 기업(2025년 4월 말).", "<b>숫자:<\/b> 2025년 상반기 매출 증가율 스마트 돌봄 기술 서비스 +33.7%, 노인용 스마트·웨어러블 +32.6%, 건강기기 +14.7%, 재활 보조기구 +12.1%, 영양·보건식품 +6.9%. 노인용품 시장 2014년 2.6조 위안 → 2024년 5.4조 위안(연 7.3%)이라는 환구망 요약도 있다(직접 열람 안 함).", "<b>반응:<\/b> 상하이 양로원에서 밀리파 레이더 비접촉 감시, 넘어짐 감지 조명이 널리 쓰인다.", "<b>국내와 비교:<\/b> 중국은 감지 기기 쪽이 가장 빠르다. 요실금·생리팬티 같은 흡수 제품 수치는 이 기사에 없다."], "bars": {"t": "2025년 상반기 매출 증가율 (%)", "u": "%", "rows": [["스마트 돌봄 서비스", 33.7, "a"], ["스마트·웨어러블", 32.6, "a"], ["건강기기", 14.7, "b"], ["재활 보조기구", 12.1, "b"], ["영양·보건식품", 6.9, "c"]]}, "nums": [["3억 2,338만", "명", "60세 이상(총인구 23.0%)", 1], ["21.6만", "종", "고령친화 제품"], ["1만", "개", "관련 기업"]], "src": "광명망(인민일보 해외판) 2026.08.25 · 환구망(검색 요약)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "오티스·도요타·파나소닉·오므론·소니", "co": "중국 · 신화망 · 제9회 중국국제수입박람회 2026.11.07", "title": "세계 기업이 내놓은 고령친화 제품: 엘리베이터부터 넘어짐 경보까지", "q": "세계 기업들이 욕실·이동·넘어짐 경보 제품을 중국 박람회에 앞다퉈 내놨다.", "hl": ["넘어짐", "경보"], "pts": ["<b>제품:<\/b> 오티스 고령친화 엘리베이터(큰 버튼·긴 문 열림·AI 안전 경보), 도요타 승강 좌석 차량, 파나소닉 앉아서 쓰는 샤워기, 오므론 혈압계·심전도 기록기, 소니 집 안 무선 감지 넘어짐 경보 시스템 시연.", "<b>숫자:<\/b> 가격·판매 경로는 없음(전시 사진 기사).", "<b>반응:<\/b> 기사에 관람객 반응은 없음.", "<b>국내와 비교:<\/b> 넘어짐 경보와 욕실 제품이 세계 공통 관심사라는 점은 국내 고관절보호대 수요와 같은 방향이다."], "src": "신화망 2026.11.07", "grade": "확인"}], "flow": [{"k": "피검사 양성이 곧 치매는 아니다", "d": "혈액검사는 증상 있는 사람의 확인용. 한국 학회와 미국 알츠하이머협회가 같은 말을 했다(국내·해외 같은 방향)", "who": [2, 3, 7, 6]}, {"k": "약은 왔지만 완치는 아니다", "d": "진행을 늦추고 관리하는 쪽. 알츠하이머 밖의 치매에는 약이 없다", "who": [1]}, {"k": "약만으로는 부족, 생활과 돌봄이 같이", "d": "운동·영양·인지활동, 생활환경·가족 지원, 보호자 교육", "who": [3, 1, 5]}, {"k": "제도가 따라오지 못한다", "d": "주치의 지속 참여율 12.4%, 통합돌봄과 치매안심센터 연계 부족, 상담 수가 한계", "who": [5, 1]}, {"k": "성과는 '집에서 사는 시간'으로 잰다", "d": "5년 지역사회 유지율, 그리고 나이를 보는 사회의 말과 편견", "who": [5, 4]}, {"k": "집 안 위험은 감지 기기가 채운다", "d": "한국은 지역사회 유지를 목표로, 미국·중국은 낙상 감지 패치·비접촉 경보가 빠르게 성장(국내·해외 같은 방향)", "who": [5, 9, 10, 11]}], "flowHeadline": "검사는 신중하게, 돌봄은 집에서 길게 — 국내와 해외가 같은 쪽을 봤다", "apply": [{"k": "고관절보호대 안내를 '집에서 사는 5년' 언어로", "p": "우선", "d": "치매 정책의 새 성과지표가 '진단 뒤 5년간 입원·입소 없이 집에서 사는 비율'로 바뀌는 중이다. 복지용구 사업소·기관용 안내 자료에서 고관절보호대를 '집에서 오래 지내도록 돕는 생활 용품'의 자리로 설명한다. 넘어짐을 막는다는 의학적 효과는 단정하지 않는다.", "r": "⑤ 돌봄 체계", "who": "3본부"}, {"k": "시니어 광고 문구에서 '연령주의' 표현 빼기", "p": "우선", "d": "루벤 응 교수는 노화를 보는 말과 편견이 정책·건강의 문제라고 했다. 요실금팬티·고관절보호대 상세페이지와 광고에서 어르신을 약하고 불쌍하게 그리는 표현을 찾아 '스스로 고르는 생활'의 말로 바꾼다. 점검 목록을 만들어 새 광고마다 확인한다.", "r": "④ 루벤 응", "who": "2본부"}, {"k": "보호자 교육용 생활 돌봄 안내지", "p": "검토", "d": "학회는 상담을 넘어 질환 교육 지원이 필요하다고 했고, 치료 중인 가정은 병원 일정과 생활 돌봄을 함께 챙긴다. 배뇨 돌봄·넘어짐 대비 같은 생활 팁을 한 장짜리 안내지로 만들어 복지용구 사업소에서 나눠 줄 수 있는지 검토한다. 치매 치료나 예방 효과는 쓰지 않는다.", "r": "① 치료제 · ⑤ 돌봄 체계", "who": "3본부"}, {"k": "정보 채널에 '피검사 양성 = 치매 아님' 쉬운 설명", "p": "검토", "d": "증상 없는 단계의 추정 규모(약 146만 명)만큼 불안이 퍼질 수 있다. 학회 공식 입장(무증상 검진 반대, 양성이어도 단정 불가)을 그대로 인용한 쉬운 설명 영상·글을 만든다. 우리 의견이나 제품 연결은 넣지 않고 출처를 밝힌다.", "r": "② 피검사 · ③ 증상 없는 단계", "who": "1본부"}, {"k": "통합돌봄 창구·치매안심센터를 기관
