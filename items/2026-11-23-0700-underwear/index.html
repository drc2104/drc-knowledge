캐나다 · 보도자료(PR Newswire) · 11.17", "title": "남성 요실금 글로벌 캠페인 'Start Your Comeback' — 스포츠로 창피함을 줄인다", "q": "제품 기능보다 '숨기는 이유·잃는 시간'을 숫자로 먼저 말한다.", "hl": ["숨기는", "잃는"], "pts": ["<b>무엇이 새로운가:<\/b> 기존 'Keep Control' 광고 틀 위에서 스포츠 이미지로 남성 요실금의 창피함을 줄이는 글로벌 캠페인을 시작했다. 필라델피아 76ers(미국)·토론토 랩터스(캐나다)와 협업을 넓혔다. 제품 사양(사이즈·흡수량)은 이번 보도자료에 없다.", "<b>숫자:<\/b> 업체 조사 — 누수 경험 남성 10명 중 4명이 활동을 빠진 진짜 이유를 숨기거나 거짓말, 영향받는 사람의 95%가 '연 3주 넘게 일상을 잃는다', 40세 이상 누수 남성 4명 중 1명이 취미에서 조용히 물러났다. 감정은 불편 39%·답답 33%·부끄러움 33%·당황 31%.", "<b>마케팅:<\/b> '창피한 일'을 '되돌아오는(컴백) 이야기'로 바꾸는 말 틀. 프로 농구단과 묶어 남성 고객에게 말을 건다.", "<b>고객 반응:<\/b> 이번 회차에는 확보하지 못했다.", "<b>국내와 비교:<\/b> 같은 주(11/20) 국내 유한킴벌리 '디펜드 맨 가드'가 나왔다. 남성 요실금이 국내·해외에서 함께 열리고 있다.", "<b>우리에게:<\/b> 요실금팬티 광고에서 기능 설명 대신 '숨기는 이유·잃는 시간' 같은 생활 숫자를 앞세우는 문구 틀을 시험할 만하다. 숫자를 인용할 때는 '업체 조사'라고 밝힌다."], "nums": [["95", "%", "영향받는 사람 중 '연 3주 넘게 일상을 잃는다'", 1], ["4/10", "명", "활동을 빠진 진짜 이유를 숨기거나 거짓말한 누수 경험 남성"], ["1/4", "명", "취미에서 조용히 물러난 40세 이상 누수 남성"]], "bars": {"t": "누수 경험 남성이 느끼는 감정 (TENA 업체 조사, 단위 %)", "u": "%", "rows": [["불편", 39, "a"], ["답답", 33, "b"], ["부끄러움", 33, "b"], ["당황", 31, "c"]]}, "src": "PR Newswire 보도자료 11.17 (본문 일부는 요약본으로만 열람, 숫자는 부분 확인)", "grade": "확인"}, {"tm": "중 · 11.22", "name": "그리티 (감탄·원더브라·르페)", "co": "한국 · 이코노미스트 인터뷰 · 11.17~11.22 (기사 날짜 표기 불일치)", "title": "일본·미국으로 나가고, 자사몰 후기를 패턴 수정에 반영", "q": "홈쇼핑 대신 자사몰로 고객 말을 직접 듣고, 그 후기로 패턴을 고친다.", "hl": ["후기로"], "pts": ["<b>무엇이 새로운가:<\/b> 자사몰 후기·개선 요청을 패턴 수정에 반영한다(대표 사례: 어깨끈 위치·조절 방식). 홈쇼핑 비중을 줄이고 자사몰을 키운다 — 이유는 수수료, 그리고 홈쇼핑으로는 고객 반응을 직접 보기 어렵기 때문.", "<b>숫자:<\/b> 자사몰 회원 감탄 약 230만·원더브라 약 140만. 2026년 4월 20~30대 신규 브랜드 '오얏'. 일본은 지난해 라쿠텐 입점 뒤 아마존·자사몰로 넓혔고 내년 상반기 도쿄 팝업을 계획한다. 미국은 6월 실리콘투 유통망 스타일코리안으로 진출, 첫 제품은 감탄 '자세 브라'. 해외 매출 비중은 아직 크지 않다.", "<b>마케팅:<\/b> 발언 — \"한국 소비자들은 소재와 디자인, 핏을 모두 까다롭게 따진다.\"", "<b>고객 반응:<\/b> 후기를 반영한다는 업체 설명만 있고 후기 원문은 확보하지 못했다.", "<b>우리에게:<\/b> '후기 → 패턴 수정' 순환을 그대로 광고 이야기로 쓸 수 있다. 해외 판매는 일본 라쿠텐 → 미국 유통사 순서로 적은 비용부터 들어가는 길이 참고가 된다."], "nums": [["230만", "명", "감탄 자사몰 회원 (약)", 1], ["140만", "명", "원더브라 자사몰 회원 (약)"]], "bars": {"t": "그리티 자사몰 회원 수 (이코노미스트, 단위 만 명)", "u": "만", "rows": [["감탄", 230, "a"], ["원더브라", 140, "b"]]}, "src": "이코노미스트 인터뷰 (사이트 입력 표기 11.22, 주소 번호는 11.17)", "grade": "확인"}, {"tm": "중 · 11.22", "name": "VEIMIA (ヴェーミア)", "co": "일본 · 보도자료(PR TIMES)·공식 온라인스토어 · 11.22", "title": "브라와 보온 내의를 한 장으로 — '컵 달린 따뜻한 이너' 3종", "q": "겨울에는 브라와 보온 내의를 합친 한 장이 같은 값으로 나온다.", "hl": ["합친", "한"], "pts": ["<b>무엇이 새로운가:<\/b> ① 핫팩 주머니가 달린 긴 기장, 고정 컵과 W자 가슴 받침, 미세 기모 ② 떼었다 붙이는 입체 몰드 컵 브라탑(2층 신축 구조, 넓은 어깨끈) ③ 배·견갑골 둘레에 울 솜을 넣은 탱크톱, 물방울형 패드, 옆을 높게 만든 설계와 복부 압박.", "<b>숫자:<\/b> 3종 모두 4,980엔(세금 포함), 사이즈 M~3XL. 색은 보도자료 기준 ① 브라운·베이지·블랙 ②③ 블랙·라이트브라운(다른 기사는 색 표기가 다름). 보온·받침 수치와 울 혼용률은 없다.", "<b>마케팅:<\/b> 세 가지 다른 구조를 한 값에 묶어 고르기 쉽게 했다.", "<b>고객 반응:<\/b> 이번 회차에는 확보하지 못했다.", "<b>국내와 비교:<\/b> 국내 감탄 '웜에어리 히트탑'(11/12 소식)과 같은 방향이다. 겨울용 브라·내의 일체형이 일본·한국에서 함께 나온다.", "<b>우리에게:<\/b> 겨울 시즌용 보온 겸용 이너를 검토할 때 4,980엔(약 4만 원대) 한 값이 해외 기준점이다."], "nums": [["4,980", "엔", "3종 모두 같은 값 (세금 포함)", 1], ["3", "종", "핫팩 주머니 롱 · 몰드 컵 브라탑 · 울 솜 탱크톱"], ["M~3XL", "", "사이즈 범위"]], "src": "PR TIMES 보도자료 11.22 10:30(JST) · 재경(zaikei) 2차 기사 (업체 주장)", "grade": "확인"}, {"tm": "중 · 11.17", "name": "패션업계 사이즈 변화 (W컨셉·무신사·CJ온스타일)", "co": "한국 · 뉴시스 · 11.17", "title": "마운자로 열풍 속 작은 사이즈 수요 — W컨셉 민소매·브라톱 거래액 +15%", "q": "작은 사이즈와 몸매가 드러나는 옷 거래가 늘었지만, 원인은 아직 가려지지 않았다.", "hl": ["작은", "사이즈"], "pts": ["<b>무엇이 새로운가:<\/b> 쇼핑몰들이 작은 사이즈·몸에 붙는 옷의 검색과 거래가 늘었다는 숫자를 냈다. 기사는 비만 치료 주사(위고비·마운자로) 확산과 함께 다뤘지만, 업계 관계자는 인과관계를 직접 가르기 어렵다고 했다.", "<b>숫자:<\/b> W컨셉 5/1~10/31 슬림핏·33·44·XS·S 검색량 +33%, 민소매·브라톱 거래액 +15%, 애슬레저 거래액 +40%. 무신사 1/1~11/15 여성 XS·S 거래액 약 +29%. CJ온스타일 11/1~15 S·M 판매 수량 약 +4%, XL 이상 약 -4%. 위고비·마운자로 처방 점검(DUR) 올해 상반기 약 186만 건.", "<b>마케팅:<\/b> 쇼핑몰이 사이즈별 숫자를 기사로 내며 '몸매 관리' 흐름을 띄운다.", "<b>고객 반응:<\/b> 기사에 없다.", "<b>우리에게:<\/b> 속옷 쪽 직접 숫자는 브라톱 +15% 하나뿐이다(업체 취합). 작은 사이즈 브라톱·심리스 라인은 가설 단계로만 두고, 우리 판매 사이즈 비율로 먼저 확인한다."], "nums": [["+15", "%", "W컨셉 민소매·브라톱 거래액", 1], ["약 186만", "건", "위고비·마운자로 처방 점검 (올해 상반기)"]], "bars": {"t": "쇼핑몰별 사이즈 관련 변화 (뉴시스 b> 상·하반기 두 번 열리는 정례 행사라 다음 상반기 행사 일정을 미리 확인해 참여 시점을 잡을 수 있다."], "nums": [["220", "개", "참여 브랜드 (약)"], ["86", "%", "최대 할인"], ["30", "%", "단독 스토어 추가 쿠폰 (최대)"]], "bars": {"t": "지그재그 이너웨어 행사 거래액 증가율 (전년 대비, 단위 %)", "u": "%", "rows": [["지난해 11월 하반기 행사", 51, "a"], ["올해 상반기 행사 (6/8~22)", 15, "b"]]}, "src": "이뉴스투데이 11.11 09:30", "grade": "확인"}, {"tm": "하 · 10.16", "name": "동아제약 템포", "co": "한국 · 베이비뉴스 · 발표 10.16 (보도 10.19) [지난 소식]", "title": "낮에 입는 팬티형 생리대 '컬러팬티 스킨'", "q": "팬티형 생리대 경쟁이 '밤'에서 '낮'으로 넓어진다.", "hl": ["낮"], "pts": ["<b>무엇이 새로운가:<\/b> 낮용 팬티형 생리대. 59개 주름 밴드, 46cm 긴 흡수층, 일반 속옷과 비슷한 살색, 넓게 덮는 엉덩이 부분.", "<b>숫자:<\/b> 갤럽 2025년 12월 조사 — 템포 오버나이트 경험자 65%가 낮에도 입는다. 가격은 기사에 없다.", "<b>마케팅:<\/b> '속옷처럼 보이는 색'을 앞세운다. 판매처는 동아제약 디몰·스마트스토어·쿠팡·올리브영 온라인·컬리.", "<b>고객 반응:<\/b> 기사 속 조사 숫자 외에는 확보하지 못했다.", "<b>우리에게:<\/b> 다회용 생리팬티도 '낮용 얇음'처럼 시간대로 나누어 말하는 방법이 있다."], "nums": [["65", "%", "오버나이트 경험자 중 낮에도 착용 (갤럽 2025.12)", 1], ["59", "개", "주름 밴드"], ["46", "cm", "흡수층 길이"]], "src": "베이비뉴스 10.19 (다음 뉴스로 열람, 30일보다 오래된 소식)", "grade": "확인"}, {"tm": "하 · 10.05", "name": "LG유니참 쏘피", "co": "한국 · 뉴데일리·EBN · 10.05 [지난 소식]", "title": "옆을 뗐다 붙이는 탭형 팬티형 생리대 '이지웨어팬티'", "q": "입고 벗기 편한 구조가 팬티형 생리대의 새 경쟁 축이 된다.", "hl": ["입고", "벗기"], "pts": ["<b>무엇이 새로운가:<\/b> 허리밴드 양옆 '이지 탭'을 뗐다 붙이는 구조. 국내 팬티형 생리대 첫 탭 방식이라고 업체가 밝혔다. 일본·중국에서 먼저 팔았다.", "<b>숫자:<\/b> 가격·수량은 기사에 없다. 한국소비자원 시험(7/21): 3mL 흡수 시간은 내추럴코튼·리버티·순수한면·쏘피 2초대, 5mL는 내추럴코튼 3.6초, 라엘 20초 이상. 개당 가격은 리버티 580원 ~ 쏘피 1,160원. 착용 평가는 20~40대 110명.", "<b>마케팅:<\/b> '국내 최초 탭 타입'(업체 주장)을 앞세운다.", "<b>고객 반응:<\/b> 소비자원 착용 평가 외에는 확보하지 못했다.", "<b>우리에게:<\/b> 다회용 생리팬티도 세탁·입고 벗기 편의를 상세페이지에서 따로 짚어야 한다. 소비자원 시험 기준(3mL·5mL)은 흡수 시험 설계의 참고가 된다."], "nums": [["2", "초대", "3mL 흡수 시간 (4개 제품)"], ["20", "초+", "5mL 흡수 시간 (라엘)"], ["110", "명", "착용 평가 인원 (20~40대)"]], "bars": {"t": "팬티형 생리대 개당 가격 (한국소비자원 7/21, 단위 원)", "u": "원", "rows": [["쏘피 (최고)", 1160, "c"], ["리버티 (최저)", 580, "a"]]}, "src": "뉴데일리 10.05 · EBN(한국소비자원 시험 7.21)", "grade": "확인"}], "flow": [{"k": "사이즈 수와 소재 이름이 광고 문구가 된다 (국내·일본 같은 방향)", "d": "일본 HEAVEN은 50·72사이즈와 텐셀 모달을, 한국 그리티는 후기로 고친 패턴을 내세운다. 국내 쇼핑몰은 작은 사이즈 수요 숫자를 낸다", "who": [1, 3, 5]}, {"k": "남성 요실금이 국내·해외에서 함께 열린다", "d": "미국 TENA Men(11/17)은 창피함을 줄이는 광고, 국내 디펜드 맨 가드(11/20)는 속옷 부착형 제품. '숨기는 이유·잃는 시간' 숫자가 문구의 중심", "who": [2]}, {"k": "겨울엔 보온 겸용 이너만 자란다 (일본·중국·한국)", "d": "일본 VEIMIA 3종 4,980엔, 중국 보온 기초내의 +200%인데 속옷 합계 -0.1%, 국내 감탄 히트탑도 같은 방향", "who": [4, 6]}, {"k": "팬티형 생리대는 '편의성'으로 나뉜다", "d": "템포는 낮용, 쏘피는 탭형. 시간대·입고 벗기가 새 경쟁 축", "who": [8, 9]}, {"k": "플랫폼 행사가 정해진 시기가 된다", "d": "지그재그 이너웨어 행사는 상·하반기 연 2회, 무신사 블프는 11/22~12/2", "who": [7]}], "flowHeadline": "국내도 해외도 숫자(사이즈·소재·생활 시간)로 말하는 속옷이 앞선다", "apply": [{"k": "[제품] 큰 사이즈까지 같은 값으로 사이즈 폭을 넓히는 안 검토", "p": "검토", "d": "HEAVEN Japan은 50~72개 사이즈를 한 값에 팔고 사이즈 수 자체를 광고 문구로 쓴다. 우리 요실금팬티·생리팬티의 사이즈 범위를 다시 보고, 큰 사이즈에 값을 따로 받지 않는 구성이 가능한지 따져 본다.", "r": "① HEAVEN Japan", "who": "4본부 제품·출시팀 · 2본부 쇼핑몰팀"}, {"k": "[마케팅] 요실금팬티 문구를 '기능'에서 '숨기는 이유·잃는 시간'으로 바꾼 비교 시험", "p": "우선", "d": "TENA Men은 '10명 중 4명이 이유를 숨긴다', '연 3주 넘게 일상을 잃는다' 같은 생활 숫자를 앞세웠다. 메타 광고에서 기능 설명 문구와 생활 장면 문구를 나란히 걸어 반응을 비교한다. 남의 조사 숫자는 출처를 밝혀서만 쓴다.", "r": "② TENA Men", "who": "2본부 광고·콘텐츠팀"}, {"k": "[마케팅] 고객 후기로 고친 점을 공개하는 콘텐츠 틀 만들기", "p": "검토", "d": "그리티는 자사몰 후기로 어깨끈 위치·조절 방식을 고쳤다고 밝힌다. 우리도 자사몰·쿠팡 후기에서 나온 불편을 어떻게 고쳤는지 '전·후' 형태로 보여 주는 카드뉴스·쇼츠 틀을 만든다. 후기 인용에는 이름·아이디를 쓰지 않는다.", "r": "③ 그리티", "who": "2본부 광고·콘텐츠팀 · 자사몰 담당"}, {"k": "[가격 행사] 연말 플랫폼 행사와 다음 상반기 이너웨어 행사 참여 여부 정리", "p": "검토", "d": "지그재그 이너웨어 행사는 상·하반기 연 2회 정례이고 무신사 블프는 12/2까지다. 행사별 할인·쿠폰 조건을 표로 모아 두고, 일본처럼 '여러 종을 한 값'으로 묶는 구성이 행사에 맞는지 함께 본다.", "r": "⑦ 지그재그 · ④ VEIMIA", "who": "2본부 쇼핑몰팀"}, {"k": "[제품] 겨울용 보온 겸용 이너 1종 검토", "p": "검토", "d": "일본 VEIMIA·국내 감탄이 보온 겸용 이너를 함께 냈고, 중국 더우인에서는 속옷 합계가 멈춘 가운데 보온 기초내의만 +200% 이상 늘었다. 요실금·생리 기능에 보온을 더한 제품이 우리 고객층에 맞는지 먼저 수요를 확인한다.", "r": "④ VEIMIA · ⑥ 더우인 쌍11", "who": "4본부 제품·출시팀"}, {"k": "[원단 시험] 흡수량(mL)과 세탁 후 흡수 변화 성적서 확보", "p": "우선", "d": "일본은 흡수 쇼츠를 30~50mL처럼 숫자로 적어 비교하고, 소비자원은 3mL·5mL 흡수 시간을 시험했다. 상세페이지에 mL 숫자를 넣으려면 시험 성적서가 먼저다. 세탁 횟수에 따른 흡수량 변화도 함께 의뢰한다.", "r": "⑨ 쏘피(소비자원 시험) · 가격 비교표(일본 흡수 쇼츠)", "who": "4본부 제품·출시팀 · 3본부 인허가"}, {"k": "[원단 시험] 모달 혼용 원단의 흡습·건조 시간 자료 확보", "p": "검토", "d": "HEAVEN은 텐셀 모달의 흡습·방습을 '우수'라고만 쓰고 수치를 내지 않았다. 우리가 모달 혼용 원단을 쓴다면 혼용률·흡습률·건조 시간을 시험 숫자로 받아 두어 '우수' 대신 숫자로 말한다.", "r": "① HEAVEN Japan", "who": "4본부 제품·출시팀"}, {"k": "[제품] 다회용 생리팬티도 '낮용·밤용'과 '입고 벗기 편의'로 나눠 말하기", "p": "유지", "d": "일회용 팬티형 생리대가 낮용(템포)·탭형(쏘피)으로 나뉘고 있다. 생리팬티 출시 준비 때 시간대별 구분과 세탁·착탈 편의를 상세페이지 첫 화면에서 짚는다. 효능은 단정하지 않는다.", "r": "⑧ 템포 · ⑨ 쏘피", "who": "4본부 제품·출시팀"}], "glossary": [{"term": "텐셀 모달", "easy": "원사 회사 렌징이 너도밤나무 펄프로 만든 부드러운 인조섬유의 상표 이름.", "why": "HEAVEN 같은 업체가 속옷 겉감으로 내세운다. '흡습·방습 우수' 같은 문구를 쓰려면 시험 숫자가 필요하다.", "video": {"title": "TENCEL™ Modal x Micro technology: finer fibers, softer feeling", "url": "https://www.youtube.com/watch?v=XN6uRBJ2Egk"}}, {"term": "모달과 라이오셀", "easy": "둘 다 나무 펄프로 만든 섬유인데 만드는 방식과 촉감이 다르다.", "why": "원단 이름을 상세페이지에 정확히 적고 광고 문구를 정리할 때 필요하다.", "video": {"title": "Modal vs Lyocell vs Tencel: What's Actually in Your Clothes?", "url": "https://www.youtube.com/watch?v=eT2YKtsBMrE"}}, {"term": "흡수량 (mL)", "easy": "팬티 한 장이 머금는 액체의 양. 일본은 30~50mL처럼 숫자로 적는다.", "why": "우리 상세페이지 핵심 숫자가 되려면 시험 성적서가 먼저 있어야 한다.", "video": {"title": "話題の【サニタリー用吸水ショーツ】本音レビュー！「本当に吸うのか」「快適なのか」徹底検証", "url": "https://www.youtube.com/watch?v=a9IT5nJdPUs"}}, {"term": "흡수 쇼츠", "easy": "생리혈·분비물을 팬티 자체가 빨아들이게 만든 속옷의 일본식 이름.", "why": "일본에서 우리 다회용 생리팬티·요실금팬티와 같은 자리에 놓인다.", "video": {"title": "【ユニクロ吸水ショーツ】ついに出た！…開封レビュー！", "url": "https://www.youtube.com/watch?v=rE2rHwSyfcc"}}, {"term": "노와이어", "easy": "철사(와이어) 없이 컵 모양과 원단으로 받치는 브라.", "why": "우리 브라·이너 제품을 비교할 때 기준이 되는 흐름이다."}, {"term": "3D 와이어", "easy": "HEAVEN이 쓰는 이름. 철사 대신 컵 틀 구조로 받치는 방식(세부 구조는 보도자료에 없음).", "why": "와이어를 대신하는 설계를 설명하는 용어로 쓰인다."}, {"term": "4장 이음 입체 컵 (4枚はぎ)", "easy": "컵을 네 조각으로 잘라 이어 둥근 모양을 만드는 재단.", "why": "모양이 잘 잡히지만 봉제가 늘어 원가에 영향을 준다."}, {"term": "사이드본", "easy": "브라 옆선에 넣어 옆을 받쳐 주는 심. HEAVEN B09는 봉제로 고정했다.", "why": "큰 사이즈 브라에서 옆 받침을 설명하는 부품 이름이다."}, {"term": "이지 탭", "easy": "팬티 허리 옆을 뗐다 붙일 수 있게 만든 부분.", "why": "팬티형 생리대의 새 경쟁 축(입고 벗기 편의)이다."}, {"term": "속옷 부착형", "easy": "평소 입는 속옷 안쪽에 붙여 쓰는 일회용 흡수 패드.", "why": "디펜드 맨 가드 같은 남성 요실금 제품의 방식으로, 우리 '입는 팬티형'과 경쟁한다.", "video": {"title": "[디펜드] 써보면 아는 차이, 디펜드 스타일 라이너", "url": "https://www.youtube.com/watch?v=7qUqi4m3tr8"}}, {"term": "창피함 줄이기 광고", "easy": "숨기고 싶은 문제를 흔한 일·되돌아오는 이야기로 바꿔 말하는 광고(영어로 stigma 마케팅).", "why": "TENA Men 캠페인 방식이다. 요실금팬티 광고 문구 틀로 참고한다."}, {"term": "보온 기초내의 (保暖打底衣)", "easy": "중국에서 겉옷 안에 입는 얇은 보온 내의.", "why": "더우인 쌍11에서 +200% 이상 늘어난 품목이다."}, {"term": "누수방지 팬티", "easy": "생리혈·소변이 겉으로 새지 않게 만든 팬티의 영어권 이름(leakproof underwear).", "why": "해외에서 우리 생리팬티·요실금팬티가 불리는 이름이다.", "video": {"title": "DOES PERIOD UNDERWEAR WORK? KNIX LEAKPROOF UNDERWEAR REVIEW | Hemali Mistry", "url": "https://www.youtube.com/watch?v=mekEZpxxpP8"}}], "glossaryHeadline": "원단(텐셀 모달)·브라 구조·흡수량·남성 요실금 광고 용어를 쉽게 풀었습니다", "media": {"headline": "시장 감시라 행사 다시보기는 없어, 해외·일본 흡수 팬티 후기와 요실금 라이너·텐셀 모달 원단 설명 영상 6편을 붙였습니다 (존재·제목·채널만 확인)", "videos": [{"title": "DOES PERIOD UNDERWEAR WORK? KNIX LEAKPROOF UNDERWEAR REVIEW | Hemali Mistry", "url": "https://www.youtube.com/watch?v=mekEZpxxpP8", "len": "길이 미확인", "note": "Hemali Mistry · 미국 Knix 누수방지 팬티 사용 후기(개인 후기라 판매 근거 아님)"}, {"title": "【ユニクロ吸水ショーツ】ついに出た！…開封レビュー！", "url": "https://www.youtube.com/watch?v=rE2rHwSyfcc", "len": "길이 미확인", "note": "女性ホルモン大学 · 일본 유니클로 흡수 쇼츠 발매 초기 개봉 후기(개인 후기)"}, {"title": "話題の【サニタリー用吸水ショーツ】本音レビュー！「本当に吸うのか」「快適なのか」徹底検証", "url": "https://www.youtube.com/watch?v=a9IT5nJdPUs", "len": "길이 미확인", "note": "LALA*CHANNEL · 일본 흡수 쇼츠가 정말 흡수하는지·편한지 직접 시험한 후기"}, {"title": "[디펜드] 써보면 아는 차이, 디펜드 스타일 라이너", "url": "https://www.youtube.com/watch?v=7qUqi4m3tr8", "len": "길이 미확인", "note": "디펜드(유한킴벌리 공식) · 속옷 부착형 요실금 라이너 광고(업체 광고라 판매 근거 아님)"}, {"title": "TENCEL™ Modal x Micro technology: finer fibers, softer feeling", "url": "https://www.youtube.com/watch?v=XN6uRBJ2Egk", "len": "길이 미확인", "note": "Lenzing Group(원사 회사 공식) · 텐셀 모달 가는 섬유 기술과 촉감 설명"}, {"title": "Modal vs Lyocell vs Tencel:
