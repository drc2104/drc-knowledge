<script id="item-data" type="application/json">{"id": "2026-11-23-0700-cosmetics", "date": "2026-11-23", "slot": "07:00", "topic": "화장품 시장", "type": "컨퍼런스 강연", "title": "K-Beauty Summit 2026 정리", "subtitle": "K뷰티 글로벌 진출 컨퍼런스 · 국내 발표 8개 · 해외 5개", "event": {"name": "K-Beauty Summit 2026 – Go Global Day", "host": "이벤터스", "when": "2026.09.15(화) · 세션별 시각 비공개", "where": "서울 삼성동 가빈아트홀", "theme": "K뷰티 해외 진출 첫걸음부터 확장(채널·결제·법인)까지"}, "headline": "K뷰티 해외 진출, 한 채널 올인 대신 데이터로 실험하고 넓힌다", "hl": ["데이터로", "실험하고"], "summary3": [["아마존은 매출 채널이 아니라 실험 채널이다.", "리필드는 하루 10달러 자동 광고로 시작해 첫 달 매출 약 1,300달러에 광고비 약 1,200달러를 썼다. 3~6개월 반복해 월매출 약 1,000달러를 10만 달러 수준으로 키웠다."], ["소수의 영상이 매출을 만든다. 그래서 많이 시도하고 이긴 것만 반복한다.", "미국 틱톡샵 상위 20개 상품 모두 상위 5개 영상이 매출의 30~80%. 훅 하나를 검증하려면 콘텐츠 100~200개가 필요하다는 발표."], ["해외: 미국 틱톡샵 뷰티는 커지지만 성장 속도는 줄고, 유럽이 새로 뜬다.", "미국 틱톡샵 뷰티·퍼스널케어 3분기 9억 9,290만 달러(+39%)로 성장률이 1분기 96%에서 39%로 둔화. 서유럽 K뷰티 매출은 58% 늘었다(NIQ)."]], "cases": [["사례", "숫자"], ["리필드 아마존 월매출 (3~6개월 반복 실험)", "약 1,000달러 → 약 10만 달러"], ["메디큐브 틱톡샵 태깅 영상", "6천 편+, 매출 대부분은 상위 4편"], ["바이어 응답 중 5번째 연락 이후에 온 몫 (아웃컴)", "27.7%"], ["해외: 아모레퍼시픽 EMEA 매출 (2023 → 2025)", "518억 → 2,410억 원 (영문판 환산)"]], "shift": {"from": "월 약 1,000달러", "to": "월 약 10만 달러", "cap": "리필드 아마존 월매출. 하루 10달러 자동 광고로 검색어를 찾고 3~6개월 반복한 결과 (키노트)"}, "chart": {"t": "미국 틱톡샵 뷰티 매출, 작년 1분기 vs 4분기 (올세일 발표, 단위 억 달러)", "u": "억 달러", "rows": [["1분기", 5, "c"], ["4분기", 13.2, "a"]]}, "keynums": [["300", "명+", "참석한 뷰티 브랜드·유통·수출 실무자"], ["4.5", "점", "만족도(5점 만점)"], ["8", "개", "발표(키노트 1 + 세션 7)"], ["151", "억 달러", "미국 틱톡샵 작년 매출(전년 90억 달러, +68%)", 1]], "overviewNote": "숫자 출처: 이벤터스 공식 정리 블로그 3편(2026.09.30)과 벤처스퀘어 현장 기사(09.17). 세션별 시각은 어느 자료에도 없어 '키노트·세션 번호'로 적었습니다. 해외 소식은 최근 30일 기사를 우선했고, 프랑스 기사(2026.02)는 오래된 참고 자료입니다.", "sectionLabel": "발표", "sections": [{"tm": "키노트", "name": "정근식", "co": "리필드 대표", "title": "아마존 1위, 얼타뷰티 600개 매장까지: 리필드의 글로벌 진출 전 과정", "q": "아마존은 매출 채널이 아니라 실험 채널이었어요.", "hl": ["실험"], "pts": ["<b>시작:<\/b> 하루 10달러(약 15,000원) 자동 광고(오토 캠페인). 처음 목표는 매출·광고 효율이 아니라 '고객이 어떤 검  브랜드 1위). 상위 5개 인디 브랜드가 판매량의 절반 이상. 헤어케어 +118%. 상반기 뷰티 라이브 상위 10개 판매자 합계 8,300만 달러 이상(1위 메디큐브 1,940만 달러).", "<b>반응:<\/b> 작년 블랙프라이데이·사이버먼데이 뷰티 매출 1억 900만 달러(+55%). 올해 행사는 11.11~11.30로 알려져 있다(검색 요약, 추정).", "<b>국내와 비교:<\/b> 세션 3의 '소수 영상·소수 브랜드 집중'과 같은 방향. 다만 성장률이 꺾여 늦게 들어가는 브랜드는 더 많은 콘텐츠와 광고비를 감당해야 한다(Tubefilter 요지)."], "nums": [["9.93", "억 달러", "2026 3분기 뷰티·퍼스널케어 매출(+39%)", 1], ["6,280", "만 달러", "메디큐브 2분기 매출(GMV)"], ["50", "%+", "상위 5개 인디 브랜드의 판매량 몫"], ["118", "%", "헤어케어 성장"]], "bars": {"t": "미국 틱톡샵 뷰티 성장률, 2026년 분기별 (단위 %)", "u": "%", "rows": [["1분기", 96, "c"], ["2분기", 82, "b"], ["3분기", 39, "a"]]}, "table": [["나라 · 지표", "숫자 · 날짜"], ["미국 · 틱톡샵 뷰티 3분기 매출", "9억 9,290만 달러(+39%) · 2026.10.14"], ["영국·EMEA · 아모레퍼시픽 매출 2025", "2,410억 원(영문판 환산), 비중 5.7% · 2026.11.01"], ["서유럽 · K뷰티 금액 성장", "+58% · 2026.07.15 NIQ"], ["프랑스 · 대미 화장품 수출", "-25%(4분기 기준) · 2026.02.10"], ["중국 · 상반기 화장품 시장", "5,189.1억 위안(+4.6%) · 2026.11.05"], ["일본 · 한국산 화장품 수입 1~9월", "9억 9,122만 달러 · 2026.10.27"]], "src": "Beauty Independent(10.14) · Tubefilter(07.29) · beBOLD(07.22, 광고 대행사 블로그)", "grade": "확인"}, {"tm": "해외 · 영국·유럽", "name": "아모레퍼시픽 · NIQ", "co": "영국·서유럽 · 머니투데이 영문판·NIQ · 2026.11.01", "title": "영국을 유럽 거점으로, 매장 안 K뷰티 전용 구역", "q": "유럽에서는 대형 매장 안의 K뷰티 전용 구역이 판매 창구가 됐다.", "hl": ["전용"], "pts": ["<b>제품:<\/b> 아모레퍼시픽은 영국을 유럽 거점으로 Boots·Space NK·Sephora·Harrods에 들어갔다. 라네즈 립 슬리핑 마스크·립 글로우 밤, 에스트라 아토베리어365 크림부터 소개. Space NK는 라네즈를 매장 중앙과 크리스마스 어드벤트 캘린더에 놓았고, Boots·Sephora 매장엔 K뷰티 전용 구역이 있다. 온라인은 Lookfantastic·ASOS·Amazon. 가격은 기사에 없다.", "<b>숫자:<\/b> 아모레 EMEA 매출 518억 원(2023) → 1,703억 원(2024) → 2,410억 원(2025), 전체 비중 3.7% → 5.7%. 영문 자동 번역판 숫자를 억 원으로 바꾼 값이라 한글 원문 대조가 필요하다.", "<b>반응:<\/b> NIQ 조사로 글로벌 K뷰티 금액 매출은 1년 53%, 2년 131% 늘었다. 서유럽 58%, 유럽 온라인 스킨케어의 약 10%가 K뷰티(이탈리아·스페인·프랑스는 15~20%). 영국·미국·스페인·독일 틱톡샵 K뷰티는 430% 성장.", "<b>국내와 비교:<\/b> 세션 5에서 '유럽 대화량 최다'라 한 것과 같은 방향. 미국이 온라인 영상 중심이라면 유럽은 오프라인 매장 구역이 함께 움직인다."], "nums": [["53", "%", "글로벌 K뷰티 금액 매출 성장(2년 131%)"], ["58", "%", "서유럽 K뷰티 성장"], ["430", "%", "영·미·스페인·독일 틱톡샵 K뷰티 성장", 1], ["10", "%", "유럽 온라인 스킨케어 중 K뷰티 몫(약)"]], "bars": {"t": "아모레퍼시픽 EMEA 매출 (영문판 환산, 단위 억 원)", "u": "억 원", "rows": [["2023", 518, "c"], ["2024", 1703, "b"], ["2025", 2410, "a"]]}, "src": "머니투데이 영문판(11.01·11.02, AI 번역) · NIQ(07.15)", "grade": "확인"}, {"tm": "해외 · 프랑스", "name": "Personal Care Insights", "co": "프랑스·미국 · 업계 매체 · 2026.02.10(9개월 전 참고 자료)", "title": "프랑스 화장품 대미 수출 25% 감소, 빈자리를 한국이 채웠다", "q": "미국 관세 뒤 프랑스가 값을 내려도 수요가 줄었고, 한국이 미국 최대 화장품 수출국이 됐다.", "hl": ["한국이"], "pts": ["<b>시장 상황:<\/b> 2025년 8월 미국 새 관세 이후 프랑스 향수·화장품의 대미 수출이 2008년 이후 처음 줄었다.", "<b>숫자:<\/b> 대미 수출 -25%(2024년 4분기 → 2025년 4분기), 2025년 손실 5억 4,100만 유로(6억 4,400만 달러). 수출 가격을 약 20% 내렸는데도 수요가 줄었다.", "<b>반응:<\/b> 한국은 2025년 미국 최대 화장품 수출국(약 22억 달러, 15.1% 증가).", "<b>국내와 비교:<\/b> 미국에서 한국 제품이 가격 경쟁력으로 수요를 흡수했다. 관세는 바뀔 수 있어 오래 기대기는 어렵다. 9개월 전 기사라 참고용."], "nums": [["-25", "%", "프랑스 대미 화장품 수출(4분기 기준)", 1], ["5.41", "억 유로", "프랑스 2025년 손실"], ["22", "억 달러", "한국의 2025년 대미 화장품 수출(약, +15.1%)"]], "src": "Personal Care Insights (2026.02.10)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "자연당(自然堂) · 第一财经", "co": "중국 · 경제 매체(업체 발표 성격) · 2026.11.05", "title": "2026 쌍11 뷰티: 시장 전체는 4%대, 중국 브랜드는 약진", "q": "중국 화장품 시장은 4%대로 천천히 크고, 그 안에서 중국 브랜드가 커진다.", "hl": ["중국"], "pts": ["<b>시장 상황:<\/b> 2026년 상반기 중국 화장품 시장 5,189.1억 위안(+4.6%).", "<b>제품:<\/b> 중국 브랜드 자연당은 쌍11 행사 매출이 티몰 +46%, 더우인 +55%, 징둥 +158%라고 밝혔다(10.23 기준 중간 숫자, 업체 주장).", "<b>숫자:<\/b> 쌍11 전체 1조 7,764억 위안(+4.8%), 화장품·개인용품 약 1,376.78억 위안(+3.7%), 티몰 스킨케어 1위는 중국 브랜드 프로야(珀莱雅)로 알려졌다(검색 요약, 원문 미열람 — 추정). 한국 브랜드 숫자는 찾지 못했다.", "<b>국내와 비교:<\/b> 한국 화장품의 중국 수출은 2026 상반기 10.1억 달러(-6.6%)로 줄어드는 흐름(Personal Care Insights, 기사 안 숫자 오류 가능성 있어 추정). 한국 수출의 중심이 미국으로 옮겨 가는 이유."], "nums": [["5,189.1", "억 위안", "2026 상반기 중국 화장품 시장(+4.6%)", 1], ["-6.6", "%", "한국의 대중국 화장품 수출 상반기(추정)"]], "bars": {"t": "자연당 쌍11 플랫폼별 매출 성장 (업체 발표, 단위 %)", "u": "%", "rows": [["티몰", 46, "c"], ["더우인", 55, "b"], ["징둥", 158, "a"]]}, "src": "第一财经(11.05, 홍보성) · Personal Care Insights(10.06, 내부 오류 의심)", "grade": "확인"}, {"tm": "
