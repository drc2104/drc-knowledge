<script id="item-data" type="application/json">{"id": "2026-11-27-0700-fabric", "date": "2026-11-27", "slot": "07:00", "topic": "원단·소재", "type": "시장 감시", "title": "11월 27일 원단·소재 동향", "subtitle": "국내 3 · 해외 6 · 소식 9개", "event": {"name": "원단·소재 시장 감시", "host": "인터넷·SNS·블로그·카페·쇼핑몰·펀딩·해외 자료", "when": "2026-11-19 ~ 11-26 (게시일 기준)", "where": "한국·일본·중국·유럽(EU·스위스)", "theme": "'항균'·'PFAS 없음'·'재활용'을 말로만 쓰기 어려워졌고, 원료값은 일본 폴리에스터 인상과 중국 나일론 하락으로 갈렸다."}, "headline": "'항균'·'PFAS 없음'·'재활용', 이제 말만으로는 못 쓴다", "hl": ["말만으로는", "못"], "summary3": [["광고 문구에 근거를 요구하는 규칙이 국내·일본에서 같이 나왔다.", "국내는 섬유제품에 살생물 효과를 직접 주장하는 '항균'·'안티바이러스'·균 이름 광고가 금지된다는 기준이 11/25 설명회에서 다시 안내됐다. 일본은 재활용·바이오 섬유 규격 4건(11/20)을 만들고 함유율을 같은 위치·같은 글자 크기로 함께 적게 했다."], ["유럽은 PFAS 퇴출이 규제와 시장 검사 양쪽에서 진행된다.", "EU 사회경제분석위원회가 11/19 용도별 예외를 둔 EU 전역 제한을 지지했다(아직 법 아님). 스위스 그린피스 검사에서는 방수 재킷 23벌 중 14벌에서 PFAS가 나왔고 5벌은 법정 한도를 넘었다(최대 230배)."], ["원료값은 일본은 오르고 중국은 내렸다.", "일본 TA프론티어는 11/24 출하분부터 폴리에스터 섬유 kg당 30엔 이상, 원단 m당 30~50엔을 올렸다. 중국 나일론 DTY 기준가는 톤당 17,920위안(11/05)에서 16,500위안(11/26)으로 약 7.9% 내렸고, 스판덱스는 29,000위안으로 제자리다."]], "cases": [["업체·제품", "가격 · 단위당 (원단 1장당 가격은 해당 없음)"], ["TA프론티어 폴리에스터 섬유·방적사", "+30엔/kg 이상 (11/24 출하분)"], ["TA프론티어 폴리에스터 원단", "+30~50엔/m (11/24 출하분)"], ["중국 나일론 DTY (生意社 기준가)", "16,500위안/톤 (11/05 17,920)"], ["중국 스판덱스 (生意社 기준가)", "29,000위안/톤 (10/19부터 같음)"], ["중국 폴리에스터 DTY (生意社 기준가)", "10,142.5위안/톤 (11/26)"], ["중국 면사 32수 (生意社 기준가)", "24,000위안/톤 (월초 24,500 대비 -2.04%, 全球纺织网)"]], "shift": {"from": "'항균'·균 이름을 내세운 광고", "to": "살생물 효과 직접 주장 금지", "cap": "섬유·의류용 살생물처리제품 표시·광고 기준이 올해 1월부터 적용 중. 제품 보호 목적을 넘는 '항균'·'안티바이러스'·특정 균주명 표현은 쓸 수 없다(11/25 설명회, TIN뉴스)"}, "chart": {"t": "중국 원사 기준가 (위안/톤, 生意社 11/25~26)", "u": "위안", "rows": [["스판덱스", 29000, "a"], ["면사 32수", 24000, "b"], ["나일론 DTY", 16500, "b"], ["폴리에스터 DTY", 10142.5, "c"]]}, "keynums": [["230", "배", "스위스 검사 방수 재킷 PFAS 최대 한도 초과", 1], ["30~50", "엔/m", "TA프론티어 폴리에스터 원단 인상", 1], ["-7.9", "%", "중국 나일론 DTY 기준가 (11/05 대비, 계산값)"], ["2029", "년 말", "섬유·의류용 살생물제품 승인 유예 만료"]], "overviewNote": "소식 9개 중 국내 3(섬유 '항균' 광고 기준 설명회·단국대 초발수 코팅·국가기술표준원 해외직구 조사), 해외 6(일본 TA프론티어·JIS 규격, EU PFAS 위원회 의견·SAFEST 연구, 스위스 그린피스 검사, 중국 원사 기준가)입니다. 국내에서 최근 7일 안에 새 원단·원사 출시 소식은 찾지 못해 국내 3건은 규제·연구·안전조사입니다. EU 위원회 의견과 일본 JIS는 원문이 아닌 보도로 확인했고, SAFEST는 요약 사이트만 봐서 '추정'입니다. 원단·규제 소식이라 고객 후기는 대상이 아닙니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.26", "name": "한국섬유산업연합회 · 기후에너지환경부", "co": "한국 · TIN뉴스 · 2026-11-26 (설명회 11/25 서울 섬유센터)", "title": "섬유 '항균' 광고 표현 금지 기준·살생물제 가이드라인 설명회", "q": "살생물 효과를 직접 주장하는 '항균'·균 이름 광고는 섬유제품에서 쓸 수 없다.", "hl": ["쓸", "없다"], "pts": ["<b>무엇이 새로운가:<\/b> 섬유제품의 항균·보존 처리는 화학제품안전법(2019년 1월 시행) 관리 대상이다. 원문: \"올해 1월부터는 섬유·의류용 살생물처리제품에 대한 표시·광고 기준이 적용되고 있다.\" 제품 보호 목적을 넘어 '항균'·'안티바이러스' 같은 살생물 효과를 직접 주장하거나 특정 균주명을 언급하는 광고는 금지된다.", "<b>숫자:<\/b> 승인 유예기간 만료는 섬유·의류용 살생물제품 2029-12-31, 살생물처리제품 관련 2031-12-31(시행 예정). 설명회 참석 90여 명. 한국소비자원 섬유 중소기업 세미나(11/24)에서도 같은 가이드라인을 안내했다.", "<b>마케팅:<\/b> 대체 표현은 설명회에서 다뤘다고만 나오고 구체 문구는 기사에 없다.", "<b>고객 반응:<\/b> 해당 없음(규제 소식).", "<b>우리에게:<\/b> 요실금·생리팬티 상세페이지·썸네일·광고에서 '항균'·균 이름 표현을 지금 점검한다. 의약외품(생리팬티 허가 품목)은 약사법 쪽 기준이 따로 적용될 수 있어(이번에 확인 안 함) 인허가 담당 확인 뒤 문구를 정한다."], "nums": [["2029", "년 말", "섬유·의류용 살생물제품 승인 유예 만료", 1], ["2031", "년 말", "살생물처리제품 관련 유예 만료"], ["90", "여 명", "설명회 참석"]], "shift": {"from": "'항균'·균 이름 광고", "to": "살생물 효과 주장 금지", "cap": "섬유·의류용 살생물처리제품 표시·광고 기준, 올해 1월부터 적용"}, "src": "TIN뉴스 2026-11-26 · 글로벌뉴스통신 2026-11-25 (원문 열람)", "grade": "확인"}, {"tm": "상 · 11.26", "name": "TA프론티어 (옛 데이진 프론티어)", "co": "일본 · ゴムタイムス · 2026-11-26 (발표 11/24) · 11/26 소식의 후속", "title": "폴리에스터 섬유·원단 추가 인상 폭 확인 — 원단 m당 30~50엔", "q": "어제 제목만 봤던 추가 인상의 폭이 나왔다: 원단 m당 30~50엔, 11/24 출하분부터.", "hl": ["30~50엔"], "pts": ["<b>무엇이 새로운가:<\/b> 11/26 소식에서 폭을 확인하지 못한 추가 인상의 숫자가 나왔다. 장섬유·단섬유를 모두 포함하고 11/24 출하분부터 적용한다. 앞으로도 순차적으로 가격을 고친다고 했다.", "<b>숫자:<\/b> 폴리에스터 섬유·방적사 kg당 30엔 이상, 부직포 kg당 30엔 이상, 텍스타일(원단) m당 30~50엔.", "<b>마케팅:<\/b> 해당 없음(원료 가격 소식). 업체가 든 이유는 중동 정세에 따른 원료·에너지값, 물류비, 인건비, 엔저, 포장재 등 부자재 급등이다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 같은 기간 중국 나일론사는 내렸다(소식 ⑥). 원료별로 방향이 갈린다.", "<b>우리에게:<\/b> 일본산 폴리에스터 원단·부직포(흡수층 후보)가 들어간 견적은 인상분을 반영한다. 국내 원단 견적도 유효기간을 확인한다."], "nums": [["30", "엔/kg+", "폴리에스터 섬유·방적사 인상", 1], ["30", "엔/kg+", "부직포 인상"], ["30~50", "엔/m", "텍스타일(원단) 인상", 1]], "bars": {"t": "폴리에스터 원단 인상 폭 (엔/m)", "u": "엔", "rows": [["최소", 30, "b"], ["최대", 50, "a"]]}, "src": "ゴムタイムス 2026-11-26 (원문 열람)", "grade": "확인"}, {"tm": "상 · 11.19", "name": "유럽화학물질청 사회경제분석위원회(SEAC)", "co": "EU · Refindustry · 2026-11-24 (의견 채택 11/19)", "title": "PFAS EU 전역 제한을 지지하는 최종 의견", "q": "용도별 예외를 둔 EU 전역 PFAS 제한에 위원회가 찬성했다. 아직 법은 아니다.", "hl": ["찬성했다"], "pts": ["<b>무엇이 새로운가:<\/b> 용도별 예외를 둔 EU 전역 금지(\"EU-wide ban with use-specific derogations\")를 지지했고, 일부 부문은 기간을 정한 예외를 둔다. 다음은 위해성평가위원회(RAC) 의견과 함께 EU 집행위 제출 → 집행위 법안 → 회원국 표결 순서다. 시행일은 없다.", "<b>숫자:<\/b> 섬유·의류의 전환기간·한도 수치는 기사에 없다. 업계 단체(EFCTC) 11/06 글은 초안 기준 발효 뒤 일반 전환기간 18개월, 집행위 개정안은 2026/2027년 전환기로 전망했다(업계 단체 전망). 의류 PFHxA 25ppb 제한은 이미 2026-10-10 시행.", "<b>마케팅:<\/b> 해당 없음.", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 국내는 같은 주에 PFAS가 아닌 '항균' 살생물제 광고 기준을 다시 안내했다(소식 ①). 방향은 같다 — 가공제 근거를 요구한다.", "<b>우리에게:<\/b> 방수층·발수 가공은 처음부터 PFAS 없는 것으로 고르고 총유기불소(TOF) 시험서를 같이 받는다."], "nums": [["18", "개월", "발효 뒤 일반 전환기간 (초안 기준, 업계 단체 전망)", 1], ["25", "ppb", "의류 PFHxA 제한 (2026-10-10 시행)"]], "src": "Refindustry 2026-11-24 · EFCTC(fluorocarbons.org) 11/06 (2차 보도, ECHA 원문은 접속 차단)", "grade": "확인"}, {"tm": "중 · 11.20", "name": "일본산업규격(JIS)", "co": "일본 · TIN뉴스 · 2026-11-26 (제정 11/20)", "title": "재활용·바이오 화학섬유, 재활용 면·울 방적사 규격 4건 제정", "q": "'재활용' 섬유는 함유율을 같은 위치에 같은 글자 크기로 함께 적어야 한다.", "hl": ["같은", "글자"], "pts": ["<b>무엇이 새로운가:<\/b> 재활용·바이오 기반 화학섬유와 재활용 면·울 방적사의 최소 함유율과 표시 방법을 정했다. 원문: \"화학 섬유의 종류와 재활용 소재 함유율(또는 바이오 기반도)을 동일한 위치에 같은 글자 크기로 함께 표기하도록 규칙화\". 국제표준은 ISO/TC38에서 국제표준안(DIS) 단계다.", "<b>숫자:<\/b> JIS L 2901-1 재활용 화학섬유 = 재활용 재료 10% 이상, L 2901-2 바이오 기반 화학섬유 = 바이오 기반도 10% 이상(측정은 ISO 16220 시리즈), L 2911 재활용 면 방적사 = 10% 이상, L 2912 재활용 울 방적사 = 5% 이상(서큘러 울 방적사는 5% 이상 + 대상 원료 2종 이상), 울 혼용률 30% 이상.", "<b>마케팅:<\/b> 비율 숫자 없이 '재활용'만 크게 쓰는 표시를 막는 규칙이다. 시행일·벌칙은 기사에 없고, 기사 표기에 오기로 보이는 곳이 있어 규격번호는 원문 재확인이 필요하다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 국내 '항균' 광고 기준(소식 ①)과 같이, 소재 효과·성분 주장에 근거를 붙이게 하는 흐름이다.", "<b>우리에게:<\/b> '재활용 원사' 문구를 쓸 때 비율 숫자를 같은 크기로 함께 적는 방식을 우리 표시 기준으로 삼고 원사 함유율 증명을 받는다. 일본에 팔 때는 직접 적용되는 기준이다."], "nums": [["4", "건", "새 규격", 1], ["10", "%+", "재활용·바이오 화학섬유, 재활용 면 최소 함유율"], ["30", "%+", "재활용 울 방적사의 울 혼용률"]], "bars": {"t": "규격별 최소 함유율 (%)", "u": "%", "rows": [["재활용 화학섬유", 10, "a"], ["바이오 기반 화학섬유", 10, "a"], ["재활용 면 방적사", 10, "b"], ["재활용 울 방적사", 5, "c"]]}, "src": "TIN뉴스 2026-11-26 (국내 전문지 보도 열람 · JIS 원문 미열람)", "grade": "확인"}, {"tm": "중 · 11.26", "name": "그린피스 스위스(Greenpeace Switzerland)", "co": "스위스 · 보도자료·보고서 · 2026-11-26", "title": "방수 재킷 23벌 검사 — 14벌에서 PFAS, 5벌 법정 한도 초과", "q": "PFAS를 쓰지 않겠다고 약속한 브랜드 제품에서도 PFAS가 나왔다.", "hl": ["약속한"], "pts": ["<b>무엇이 새로운가:<\/b> 성인·아동용 방수 재킷 23벌을 검사했다. 한도를 넘은 제품의 판매처는 Shein·Temu·H&M·Zara·Manor다. PFAS를 안 쓰겠다고 약속한 H&M·Zara·C&A 제품에서도 검출됐다.", "<b>숫자:<\/b> 23벌 중 14벌 검출, 5벌 한도 초과, 최대 230배(Manor 사이트에서 판 Trespass 우비). 검사 물질 35종. 한도 수치(ppb)는 보도자료에 없다.", "<b>마케팅:<\/b> 해당 없음. 시민단체가 의뢰한 검사이며 실험실 이름은 적혀 있지 않다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 국내에서도 국가기술표준원이 해외직구 제품의 유해물질을 조사했다(소식 ⑧). 다만 PFAS 항목은 아니다.", "<b>우리에게:<\/b> '불소 없음'은 원단업체 말이 아니라 로트별 시험서로 확인한다. 약속한 브랜드에서도 검출됐다."], "nums": [["230", "배", "최대 한도 초과", 1], ["35", "종", "검사한 PFAS 물질"]], "bars": {"t": "방수 재킷 검사 결과 (벌)", "u": "벌", "rows": [["검사", 23, "c"], ["PFAS 검출", 14, "b"], ["법정 한도 초과", 5, "a"]]}, "src": "Greenpeace Switzerland 보도자료 2026-11-26 (원문 열람, 보고서 PDF 본문은 추출 못 함)", "grade": "확인"}, {"tm": "중 · 11.26", "name": "生意社(100ppi) 기준가", "co": "중국 · 生意社 · 2026-11-26", "title": "나일론사 값 하락, 스판덱스 기준가는 5주 넘게 제자리", "q": "중국 나일론 DTY는 3주 만에 약 7.9% 내렸고, 스판덱스는 움직이지 않았다.", "hl": ["7.9%"], "pts": ["<b>무엇이 새로운가:<\/b> 나일론 DTY 기준가가 11월 들어 계속 내렸다. 스판덱스 기준가는 10/19부터 11/26까지 같은 값이다. 11/23에는 원료인 순벤젠이 톤당 300위안 내렸다.", "<b>숫자:<\/b> 나일론 DTY 톤당 17,920위안(11/05) → 16,900위안(11/20) → 16,500위안(11/23~26). 11/05 대비 약 -7.9%, 11/
