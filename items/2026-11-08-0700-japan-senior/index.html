과회에서 나온 주요 의견", "q": "전국 평균 이익률만 보고 안정적이라 판단하면 안 됩니다. 규모·입지·형태별로 봐야 합니다.", "hl": ["전국", "평균"], "pts": ["<b>평균의 함정:<\/b> 수지차율 평균 9.6%(2024년도)만으로 판단하지 말고 사업소 규모·입지·사업 형태별로 나눠 분석하자는 의견.", "<b>경영 악화 신호:<\/b> 방문개호 사업자 도산 건수가 3년 연속 늘었다. 인원을 채우면 인건비가 늘어 적자로 돌아설 수 있다는 지적(요지).", "<b>같은 건물 문제:<\/b> 같은 건물 이용자 비율이 높은 사업소일수록 수지가 좋은 경향 → 공정한 평가 방식 검토 요구. 동일건물 감산 '없음' 사업소가 약 7할.", "<b>안전:<\/b> 사이타마현 가와구치시 사건을 들어 두 명이 함께 방문할 때 얹는 가산을 새로 만들자는 요구.", "<b>인력 소개 수수료:<\/b> 인재 소개료가 경영을 압박 → 상한을 두자는 요구.", "<b>업계 단체 요망:<\/b> 헬퍼 단체들은 기본 보수 인상, 전국개호사업자연맹은 기본 보수 대폭 인상을 요구하고, 동일건물 감산 확대에는 신중하자는 입장."], "nums": [["9.6", "%", "방문개호 평균 수지차율(2024년도)"], ["3", "년 연속", "방문개호 사업자 도산 증가", 1], ["약 7", "할", "동일건물 감산 '없음' 사업소"]], "src": "후생노동성 資料1 訪問介護 p3~6", "grade": "확인"}, {"tm": "자료1 · 22~24쪽", "name": "제2장 지역 협력", "co": "후생노동성 · 논점①", "title": "지역이 함께 서비스 체계를 만드는 방법", "q": "일손이 모자라는 만큼 지역 자원과 손잡고 재택 생활을 지탱해야 합니다.", "hl": ["일손이", "지역"], "pts": ["<b>인력 부족 실태(하마긴종합연구소 속보, 516곳):<\/b> '다소 부족' 48.8% + '크게 부족' 23.4% = 72.2%. '대체로 확보' 27.7%.", "<b>가산 받기 어려운 이유 1위:<\/b> 가래 흡인이 필요하거나 임종기 이용자를 맡을 직원 확보·양성 55.2%, 다음은 '요개호 4·5 비율 21% 이상' 요건 53.3%.", "<b>외부 협력은 아직 멀다:<\/b> '협력 중' 7.9%, '앞으로 협력' 18.6%, '협력은 어렵다' 73.4%. 협력처 후보는 사회복지협의회 42.1%, 실버인재센터 35.4%, 지역포괄지원센터 34.0%, NPO 등 32.5%.", "<b>책임자의 부담:<\/b> 서비스제공책임자 곤란 1위 '헬퍼가 없어 책임자가 직접 방문' 74.2%, 사무 부담 58.5%.", "<b>제도 변화:<\/b> 2027년도부터 24시간 정기순회·수시대응형과 야간대응형 방문개호가 하나로 합쳐질 전망.", "<b>대응안:<\/b> 다른 법인의 정기순회 서비스와 연계해 낮 시간 수시 방문을 하면 평가. 첫 방문 가산(현재 산정률 52.0%)을 '첫 서비스 동행'에서 '새 계획을 세우려고 책임자가 방문·평가한 경우'로 넓히고 온라인 면담도 인정하는 안.", "<b>홍보도 보수로:<\/b> 방문개호의 가치·전문성을 알리는 활동을 보수로 평가할지 검토."], "bars": {"t": "방문개호 사업소 채용 충족도 (%, 516곳, 하마긴종합연구소 속보)", "u": "%", "rows": [["다소 부족", 48.8, "a"], ["대체로 확보", 27.7, "c"], ["크게 부족", 23.4, "b"]]}, "nums": [["72.2", "%", "인력이 부족한 사업소", 1], ["74.2", "%", "책임자가 직접 방문하는 곤란"], ["73.4", "%", "외부 단체와 협력은 어렵다"], ["52.0", "%", "첫 방문 가산 산정률"]], "src": "후생노동성 資料1 訪問介護 p22~24", "grade": "확인"}, {"tm": "자료1 · 25쪽", "name": "제3장 산간 지역 경영", "co": "후생노동성 · 논점②", "title": "지역·경영 사정에 맞춘 보수 평가", "q": "산간·인구 감소 지역은 이동 부담과 갑작스런 취소로 1년 경영을 내다보기 어렵습니다.", "hl": ["이동", "부담과"], "pts": ["<b>무엇이 문제인가:<\/b> 산간·인구 감소 지역에서 집집마다 찾아가는 사업소는 급한 취소와 이동 부담 때문에 연간 경영이 불안정하다.", "<b>대응안:<\/b> 이동 비용까지 포함해 경영을 미리 내다볼 수 있게 하는 '포괄적 평가' 방식의 보수를 검토.", "<b>현장 숫자:<\/b> 방문했더니 이용자가 없는 '부재' 경험 44.6%, 장거리·험한 길·눈길 운전 부담 38.6%.", "<b>다음 일정:<\/b> 인구 감소와 서비스 수요 변화에 맞춘 체계는 별도 분과회에서 설명·논의할 예정."], "nums": [["44.6", "%", "방문했는데 부재"], ["38.6", "%", "장거리·험한 길·눈길 운전 부담"]], "src": "후생노동성 資料1 訪問介護 p25", "grade": "확인"}, {"tm": "자료1 · 27~43쪽", "name": "제4장 사는 곳별 보수", "co": "후생노동성 · 논점③ · 이번 회의 최대 쟁점", "title": "주거 형태에 맞춘 방문개호 보수", "q": "지금의 감산 대신, 이동 비용과 실제 서비스 모습을 더 정확히 반영하는 보수 구분을 검토합니다.", "hl": ["이동", "비용과"], "pts": ["<b>현행 제도(2024년 개정):<\/b> 같은 건물 거주자를 방문하면 보수를 10%·15%·10%·12% 깎는다. 전체 방문 중 같은 부지 거주자가 90% 이상이면 12%.", "<b>대응안:<\/b> 감산 방식 대신 사업소 규모, 1회당 이동 비용이 낮은 점, 제공 횟수가 많은 점에 착안해 보수 구분 자체를 다시 짜는 안.", "<b>이동 수단(NTT데이터경영연구소 속보, 2026년 7월분):<\/b> 단독주택 이용자는 자동차 방문 82.1%, 집합주택은 도보 46.4%·자동차 34.4%. 월 방문 횟수 중앙값은 도보 55.0회 vs 자동차 9.0회.", "<b>두 갈래로 나뉜 사업소(675곳):<\/b> 도보 이용자 0~5% 미만 사업소 69.5%, 95~100% 사업소 19.1% — 두 무리가 전체의 9할.", "<b>도보 위주 사업소의 모습:<\/b> 이용자는 유료노인홈 58.9%, 서비스형 고령자주택 29.5%, 같은·옆 부지 거주 83.9%. 야간·이른 아침 가산 47.8%, 심야 가산 24.1%.", "<b>위원 의견:<\/b> 헬퍼의 이동 시간을 어떻게 평가하느냐가 핵심. 감산을 완화할지 더 엄격히 할지 방향부터 확인하자는 요구.", "<b>읽을 때 주의:<\/b> 속보값이며 최종치가 아니다."], "bars": {"t": "방문개호 동일건물 감산 구간별 수지차율 (%, 2024년도 결산)", "u": "%", "rows": [["감산 10% 구간 (109곳)", 11.5, "a"], ["감산 없음 (453곳)", 10.0, "b"], ["방문개호 전체", 9.6, "b"], ["감산 12% 구간 (62곳)", 7.7, "c"]]}, "shift": {"from": "3,339단위", "to": "15,027단위", "cap": "월 청구 단위 중앙값 — 비교군 → 도보 이용자 95~100% 사업소 (약 4.5배)"}, "table": [["중앙값", "도보 이용자 95~100% 사업소", "비교군"], ["월 방문 시간", "1,350분", "480분 (약 2.8배 차이)"], ["월 청구 단위", "15,027.0단위", "3,339.0단위 (약 4.5배 차이)"], ["편도 이동 거리", "0.1km", "3.1km"], ["월 방문 횟수", "66.0회", "—"]], "nums": [["83.9", "%", "도보 위주 사업소 이용자 중 같은·옆 부지 거주", 1], ["19.1", "%", "도보 이용자 95~100% 사업소 비율"], ["82.1", "%", "단독주택 이용자 자동차 방문"]], "src": "후생노동성 資料1 訪問介護 p27~43 (수지차율: 경영조사위원회 2025.11.26 자료 인용)", "grade": "확인"}, {"tm": "자료1 · 44~55쪽", "name": "제5장 현황과 논점 총정리", "co": "후생노동성 · 참고자료·현상과 과제", "title": "방문개호 지금 모습과 남은 논점", "q": "가산이 너무 많고 복잡해졌습니다. 산정률이 낮은 가산과 높은 가산을 어떻게 볼지 정리해야 합니다.", "hl": ["복잡해졌습니다."], "pts": ["<b>규모:<\/b> 청구 사업소 35,497곳(2025년 4월 심사분, 2013년 30,272곳), 이용자 약 111만 명(요개호 1·2가 약 60%), 비용 2023년도 약 1.2조 엔, 사업소당 평균 이용자 31.3명.", "<b>이익률 흐름:<\/b> 수지차율 2022년도 7.8% → 2023년도 11.1% → 2024년도 9.6%.", "<b>가산 산정률:<\/b> 특정사업소 가산 Ⅰ 10.6%·Ⅱ 33.9%·Ⅲ 0.4%·Ⅳ 0.3%·없음 54.8%. 야간·이른 아침 가산 62.1%, 첫 방문 가산 52.0%, 처우개선 가산 Ⅰ·Ⅱ 합계 73.1%(36.4%+36.7%).", "<b>감산 받는 사업소:<\/b> 동일건물 감산 10% 15.6%, 15% 1.7%, 12% 11.6%.", "<b>기본 보수(단위):<\/b> 신체 돌봄 20분 미만 163, 20~30분 244, 30분~1시간 387, 1시간 이상 567 + 30분마다 82. 생활 지원 20~45분 179, 45분 이상 220. 병원 오갈 때 승하차 도움 97.", "<b>총정리 논점:<\/b> 전국 평균의 많고 적음만이 아니라 입지·규모·사업 형태로 보자. 복잡해진 가산 체계를 어떻게 단순화할지."], "bars": {"t": "방문개호 수지차율 추이 (%, 연도별 결산)", "u": "%", "rows": [["2022년도", 7.8, "c"], ["2023년도", 11.1, "a"], ["2024년도", 9.6, "b"]]}, "nums": [["35,497", "곳", "청구 사업소(2025년 4월)"], ["111만", "명", "방문개호 이용자", 1], ["1.2조", "엔", "방문개호 비용(2023년도)"], ["54.8", "%", "특정사업소 가산 없음"]], "src": "후생노동성 資料1 訪問介護 p44~55 (처우개선 가산 합계 73.1%는 조사원이 두 값을 더한 것)", "grade": "확인"}, {"tm": "해외 · 독일", "name": "독일 연방정부", "co": "독일 · 아포테켄 움샤우(dpa) · 2026.10.23", "title": "간병보험 개혁안 내각 결정, 2027년 7월 시행 목표", "q": "간병보험료율을 당분간 3.6%로 묶어 두면서 급여 구조를 손봅니다.", "hl": ["3.6%로"], "pts": ["<b>시장 상황:<\/b> 2026.09.30 내각 결정, 연방의회 심의는 아직 진행 중. 장관 발언으로 시행 시기는 2027년 7월 1일.", "<b>숫자:<\/b> 보험료율 3.6% 유지 목표, 무자녀 가산 0.3%, 보험료 산정 상한 300유로 인상(지금 월 5,812.50유로), 2028년 1월부터 배우자 동반 가산 0.52%, 디지털화에 16억 유로.", "<b>제도 변화:<\/b> 간병 등급 2·3 신규자도 간병 수당 전액 지급, 등급 1의 부담 경감 예산 폐지, 2029년부터 급여를 핵심 물가에 연동.", "<b>반응:<\/b> 등급 2·3 전액 지급은 SPD 요구가 반영된 것. 적자 규모는 보도마다 달라(12억 유로 vs 60억·76억 유로) 원문 확인이 필요하다.", "<b>국내와 비교:<\/b> 한국도 장기요양위원회(10.30)에서 보험료율·수가를 논의 — 고령화 비용을 보험료와 본인 부담으로 나누는 문제는 같다. 이 기사에는 복지용구(간병 보조기구) 이야기는 없다."], "nums": [["3.6", "%", "간병보험료율 유지 목표", 1], ["0.3", "%", "무자녀 가산"], ["16억", "유로", "디지털화 투입"]], "src": "Apotheken Umschau (dpa) 2026.10.23 갱신", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 정부(8개 부처 등)", "co": "중국 · 정부 영문 사이트·신화망 · 2026.01~04", "title": "실버경제·노인 친화 정책, 노인용 의류·화장품까지 장려", "q": "실버경제가 2035년 30조 위안을 넘을 것으로 보고 제품·유통을 함께 키웁니다.", "hl": ["30조", "위안을"], "pts": ["<b>시장 상황:<\/b> 60세 이상 인구는 2024년 말 3.1억 명, 2035년 4억 명을 넘을 전망. 실버경제 규모는 2035년 30조 위안(4.3조 달러) 돌파 전망.", "<b>제품:<\/b> 뇌-컴퓨터 연결 기술·착용형 보조 로봇에 더해 노인용 화장품, 저당·고단백 식품, 안전·보온·위치 확인 기능 의류를 장려.", "<b>유통:<\/b> 온라인 쇼핑몰 '시니어 모드', 집 개조 보조금, 현(縣) 단위 제품 전시·대여·판매 거점.", "<b>국내와 비교:<\/b> 의류·화장품이 정책 대상에 직접 들어간 점이 우리 시니어 의류·이너웨어 분야와 겹친다. 가격·판매 순위는 확인하지 못했다.", "<b>읽을 때 주의:<\/b> 2026.01 지침과 01.28 해설이 기준. 04.29 로드맵은 6개월이 넘은 참고 자료, 9월 부처 의견(노인용 제품 인증 제도)은 원문 미확인."], "shift": {"from": "3.1억 명", "to": "4억 명+", "cap": "중국 60세 이상 인구 — 2024년 말 → 2035년 전망"}, "nums": [["30조", "위안", "2035년 실버경제 전망", 1], ["3.1억", "명", "60세 이상(2024년 말)"]], "src": "China Daily(중국서비스정보) 2026.01.15 · 중국 정부 영문 사이트 2026.04.29 · 신화망 2026.01.28", "grade": "확인"}, {"tm": "해외 · 미국", "name": "AARP", "co": "미국 · 협력 단체 게시글(보도자료 재인용) · 2026.06.02", "title": "50세 이상이 미국 경제의 43%를 만든다", "q": "시니어를 비용이 아니라 소비와 경제의 주체로 숫자로 보여 줍니다.", "hl": ["소비와", "경제의"], "pts": ["<b>시장 상황:<\/b> 2024년 50세 이상이 미국 GDP의 43%, 12.5조 달러를 만들었다(나라로 치면 세계 3위 규모).", "<b>숫자:<\/b> 무급 돌봄·봉사 가치 1.2조 달러. 50세 이상 인구 1억 2,300만 명(2024) → 2060년 약 1억 5,800만 명. 일하는 50세 이상 약 5,700만 명.", "<b>국내와 비교:<\/b> 시니어를 소비 주체로 계량하는 틀. 한국은 같은 방식의 수치를 확인하지 못했다.", "<b>읽을 때 주의:<\/b> AARP 원문 사이트가 막혀 2차 게시글로만 확인한 숫자다."], "bars": {"t": "미국 50세 이상 인구 (만 명)", "u": "만", "rows": [["2024년", 12300, "b"], ["2060년 전망", 15800, "a"]]}, "nums": [["43", "%", "50세 이상의 GDP 기여", 1], ["12.5조", "달러", "50세 이상이 만든 경제 규모"], ["1.2조", "달러", "무급 돌봄·봉사 가치"]], "src": "MA Healthy Aging Collaborative 2026.06.03 게시(AARP 보도자료 재인용)", "grade": "추정"}, {"tm": "해외 · 싱가포르", "name": "싱가포르 보건부", "co": "싱가포르 · 장관 연설문 · 2026.05.07", "title": "지역사회 돌봄, 공통 평가 도구와 1인 1 돌봄 계획", "q": "어르신마다 같은 도구로 평가하고 돌봄 계획 하나로 지역에서 이어 봅니다.", "hl": ["돌봄", "계획"], "pts
