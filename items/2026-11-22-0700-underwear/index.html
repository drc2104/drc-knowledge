대쪽 사례다.", "<b>우리에게:<\/b> 수출·해외 생산 원단을 쓸 때 pH·섬유 성분 표기 같은 강제 표준 시험 성적서를 확인 항목에 넣는다."], "src": "구글뉴스 목록에서 证券之星 제목만 확인(원문 주소 못 엶)", "grade": "추정"}], "flow": [{"k": "'최대 ○%'는 크게, 주력 상품은 20~30%로", "d": "WUKA 최대 40%·확인 상품 20~30%, Knix 최대 50%·주력 20% — 블프에도 핵심 상품은 덜 깎는다", "who": [1]}, {"k": "양은 줄고 기능성·고급화로 간다 (국내·중국 같은 방향)", "d": "국내 언더웨어 -1.9%, BYC 영업이익 약 -40%, 중국 보온 내의 판매량 -16.7%인데 건당 가격 +11.44%", "who": [4, 5]}, {"k": "흡수량을 숫자로 보여 주는 쪽이 비교에서 앞선다 (국내·일본)", "d": "일본 순위는 mL와 가격을 한 표에, 디펜드는 경험률·흡수량 숫자를 앞세운다. 담덕원은 숫자 없이 수상만", "who": [2, 3, 6]}, {"k": "요실금 속옷의 고객이 넓어진다", "d": "남성(디펜드 맨 가드)·시니어(담덕원), 일본은 분비물용 흡수 쇼츠까지 — 붙이는 일회용과 입는 형태가 경쟁한다", "who": [3, 6, 2]}, {"k": "근거 없는 주장과 표준 미달은 신뢰를 잃는다", "d": "디펜드 기사끼리 경험률 숫자가 다르고, 都市丽人은 강제 표준 불부합 투소 — 시험 성적서가 방어선", "who": [3, 7]}], "flowHeadline": "국내도 해외도 속옷 양은 줄고, 숫자로 증명하는 기능성 제품 쪽으로 간다", "apply": [{"k": "[가격 행사] 블프 '최대 ○%' 옆에 대표 상품의 실제 할인율을 함께 적기", "p": "우선", "d": "WUKA와 Knix는 '최대 40~50%'를 걸면서 주력 상품은 20~30%만 깎았다. 우리 행사 화면에는 큰 숫자만 쓰지 말고 대표 상품 1~2개의 실제 할인율을 나란히 적어 믿음을 얻는다.", "r": "① WUKA", "who": "2본부 쇼핑몰팀"}, {"k": "[제품] 상세페이지에 흡수량(mL)과 1장당 가격을 같은 표로 공개", "p": "우선", "d": "일본 순위 사이트는 mL와 가격을 한 표에 놓고 비교한다. 우리 요실금팬티·생리팬티 사양표에 흡수량과 1장당 가격 칸을 만들고, 흡수량은 시험 결과가 있는 숫자만 적는다. 일본 판매 상세페이지에도 같은 표를 쓴다.", "r": "② 일본 흡수 쇼츠 순위", "who": "4본부 제품·출시팀 · 2본부 쇼핑몰팀 · 일본 수출 담당"}, {"k": "[마케팅] 나이별 요실금 경험률은 출처를 밝혀 인용하고, '붙이는 일회용 vs 빨아 입는 팬티'를 비교", "p": "검토", "d": "40대 5%~70대 24% 숫자는 '유한킴벌리 2024년 조사'로 출처를 적어야 쓸 수 있다. 기사끼리 숫자가 달라 원문 기준 하나만 쓴다. 일회용 부착형과 빨아 입는 팬티의 교체·비용·환경 차이를 쉬운 표로 보여 준다.", "r": "③ 디펜드 맨 가드", "who": "2본부 광고·콘텐츠팀"}, {"k": "[원단 시험] 세탁 횟수별 흡수 유지 시험을 의뢰해 '수상' 대신 숫자로 차별화", "p": "검토", "d": "담덕원은 수치 없이 수상 이력을 앞세웠다. 우리는 세탁 몇 회 뒤에도 흡수량이 얼마나 남는지 시험 숫자를 받아 상세페이지 근거로 쓴다. 효능은 단정하지 않는다.", "r": "⑥ 담덕원", "who": "4본부 제품·출시팀"}, {"k": "[원단 시험] 소취율·pH·섬유 성분 표기를 시험 의뢰서 확인 항목에 추가", "p": "검토", "d": "디펜드의 '99% 소취'는 업체 주장이고, 중국 都市丽人은 강제 표준 불부합으로 투소됐다. 소취 시험과 pH·섬유 성분 시험 성적서를 원단·완제품 의뢰서에 넣어 문구 근거와 해외 판매 서류를 함께 준비한다.", "r": "③ 디펜드 맨 가드 · ⑦ 都市丽人", "who": "4본부 제품·출시팀 · 3본부 인허가
