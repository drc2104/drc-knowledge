mph는 가격 표시 없음).", "<b>주의:<\/b> 페이지 글자가 깨져 있어 이 순위가 쇼츠(팬티)만인지 란제리 전체인지는 주소 구조로만 판단했다(추정). 엔화는 환율을 확인하지 않아 원으로 바꾸지 않았다.", "<b>고객 반응:<\/b> 순위 페이지라 후기가 없다.", "<b>국내와 비교:<\/b> 국내는 3,000원 균일가부터 4만 원대까지 벌어졌고, 일본 상위 평균가는 좁은 범위에 모여 있다.", "<b>우리에게:<\/b> 일본 수출 가격 기준점으로 쓰되, 흡수 쇼츠는 순위 사이트에서 따로 본다."], "bars": {"t": "브랜드별 평균 가격 (카카쿠 11.13, 단위 엔)", "u": "엔", "rows": [["GENDER (1위)", 2787, "a"], ["Calvin Klein (2위)", 6909, "c"], ["wacoal (3위)", 2462, "b"], ["gunze (4위)", 1934, "b"], ["MULBERRY (5위)", 5242, "c"], ["Tratani (7위)", 2085, "c"]]}, "nums": [["2,787", "엔", "1위 GENDER 평균가", 1], ["2", "엔", "직전 회차 대비 1위 평균가 변화"]], "src": "카카쿠닷컴 쇼츠 브랜드 순위 직접 열람 (11.13 갱신, 분류는 주소로 판단)", "grade": "추정"}], "flow": [{"k": "국내 브라는 와이어·후크 없는 초경량 심리스 경쟁", "d": "리무브 15D·패드 1.3/3cm, 미언더 무봉제 원사이즈, 위뜨·베리시 애슬레저·플래그십. 모두 '착용감 + 구조 이름'을 앞세운다", "who": [1, 6, 7, 8]}, {"k": "가격은 양쪽으로 갈린다", "d": "롯데마트 3,000~5,000원 균일가 ↔ 리무브 약 4만 원. 안다르는 6~10개 묶음으로 장당 값을 끌어내린다", "who": [3, 1, 5]}, {"k": "속옷을 팬덤·이야기로 판다", "d": "Knix는 소설 협업(4개 스타일 12시간 품절, 업체 주장), Piper는 창업자 이야기와 옥외광고 구상", "who": [2, 4]}, {"k": "생리와 요실금의 경계가 흐려진다", "d": "Piper가 가벼운 방광 누출 여성까지 대상으로 소개. 지난 회차 Ontex 다액체 팬티와 같은 방향이다", "who": [4]}, {"k": "입어 보게 하는 체험·오프라인 확장", "d": "국내 베리시 플래그십·위뜨 최대 매장, 해외 Knix 뉴욕 팝업·공개 체험일. 국내와 해외가 같은 방향이다", "who": [7, 8, 2]}], "flowHeadline": "국내는 가볍고 편한 브라를 두 가격대로, 해외는 누수 방지 속옷을 이야기로", "apply": [{"k": "[가격 행사] 3,000원 팬티 옆에서 보이는 '1회 입는 값' 문구", "p": "우선", "d": "롯데마트 3,000원 팬티·5,000원 심리스 브라가 가격 기준점을 끌어내렸다. 다회용 요실금·생리팬티는 몇 번 빨아 입는지로 나눈 1회 값을 상세페이지와 광고 맨 위에 같은 기준으로 적는다. 세탁 횟수는 시험한 값만 쓴다.", "r": "③ 롯데마트 · ① 리무브", "who": "2본부 쇼핑몰팀 · 2본부 광고·콘텐츠팀"}, {"k": "[가격 행사] 5+5·3+3 묶음 장당 가격표 만들기", "p": "검토", "d": "안다르는 브라+팬티를 6~10개 묶음으로, 리무브는 2~3장 묶음으로 판다. 우리도 묶음 구성별 장당 가격표를 만들어 단색 세트·안다르 묶음과 나란히 비교하고, 단품 행사와 기간을 나눠 시험한다.", "r": "⑤ 안다르 · ① 리무브", "who": "2본부 쇼핑몰팀"}, {"k": "[제품] 생리팬티·요실금팬티를 한 브랜드의 '흡수 등급'으로 묶기", "p": "우선", "d": "Piper는 생리팬티를 가벼운 방광 누출까지 겸하는 제품으로 소개하고, 자체 시험 이름(FlowGrade)으로 흡수 등급을 보여 준다. 우리 두 제품을 한 브랜드 안의 등급 체계로 묶는 안을 검토한다. 의학 효능은 단정하지 않
