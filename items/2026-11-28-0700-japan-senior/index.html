<script id="item-data" type="application/json">{"id": "2026-11-28-0700-japan-senior", "date": "2026-11-28", "slot": "07:00", "topic": "일본 시니어", "type": "정부 회의 발표", "title": "제139회 일본 개호보험부회 정리", "subtitle": "65세 이상 보험료·이용자 2할 부담 · 국내(일본) 발표 6개 · 해외 5개", "event": {"name": "제139회 사회보장심의회 개호보험부회 (第139回 社会保障審議会 介護保険部会)", "host": "후생노동성 노건국 (厚生労働省 老健局)", "when": "2026.11.26(목) 10:00~12:30", "where": "일본 도쿄 · 이번 회차 장소는 공식 페이지에 적혀 있지 않음", "theme": "65세 이상 보험료의 바람직한 방향 · 지속가능성 확보(급부와 부담)"}, "headline": "일본 개호보험, 보험료는 소득 따라 다시 나누고 2할 확대는 미뤘다", "hl": ["소득", "미뤘다"], "summary3": [["65세 이상 보험료 단계 재편은 '대체로 이해'로 정리됐다.", "현행 13단계(배율 0.285~2.4), 전국 평균 월 6,225엔. 개정 뒤 단계와 배율은 65세 이상 인구 분포를 보고 나중에 정한다. 비과세에서 과세로 바뀌는 사람의 상승 폭을 절반쯤 줄이는 특별감액은 2028년도부터."], ["이용자 2할 부담 확대는 결론을 내지 못하고 계속 심의한다.", "현행 2할 대상은 65세 이상 상위 약 20%(단독 연소득 280만 엔 이상). 9월 회의 검토안은 대상을 25~30%로 넓히면 13만~35만 명이 2할로 바뀐다. 다만 일부 방송은 '부담 인상 방침 양해'로 보도해 보도가 엇갈린다."], ["해외도 돌봄 보험의 '돈 문제'부터 손본다.", "독일은 무자녀 가입자 부가보험료를 0.6%에서 0.9%로(2027.1~) 올리는 개편안을 내각이 의결했고, 중국은 장애 노인 돌봄 소비권(월 최대 800위안)을 246만 명 이상에게 나눠 서비스 소비를 끌어내고 있다."]], "cases": [["나라 · 제도", "숫자"], ["일본 65세 이상 개호보험료 (제9기 전국 평균)", "월 6,225엔 · 13단계"], ["독일 무자녀 가입자 부가보험료 (개편안)", "0.6% → 0.9% (2027.1.1~)"], ["중국 노인돌봄 소비권 (2026.1~12월 말)", "월 최대 800위안 · 246만 명 이상"]], "shift": {"from": "2,911엔", "to": "6,225엔", "cap": "일본 65세 이상 월 개호보험료 전국 평균 (개호보험 시작 때 → 현행 제9기, LIMO 2026.11.27)"}, "chart": {"t": "2할 부담 대상 비율 — 현행과 9월 회의 검토안 4개 (65세 이상 중, GemMed 2026.9.23)", "u": "%", "rows": [["현행 (280만 엔)", 20, "c"], ["안1 (260만 엔)", 25, "b"], ["안2 (250만 엔)", 26, "b"], ["안3 (240만 엔)", 28, "b"], ["안4 (230만 엔)", 30, "a"]]}, "keynums": [["6,225", "엔", "65세 이상 월 보험료 전국 평균 (제9기)", 1], ["2.4", "배", "가장 높은 13단계 배율 (가장 낮은 1단계 0.285배)"], ["35만", "명", "2할 대상 최대 검토안(안4)에서 새로 2할이 되는 사람", 1], ["2028", "년도", "특별감액 실시 예정"]], "overviewNote": "숫자 출처: 通所ケア研究会(11.26)·LIMO(11.27) 기사, 9월 제136회 회의를 다룬 GemMed 기사(9.23). 후생노동성 공식 자료 PDF는 본문을 읽지 못해 제목·주소만 확인했습니다. 위원 개별 발언·의사록·회의 영상은 11/28 기준 아직 공개되지 않았습니다.", "sectionLabel": "발표", "sections": [{"tm": "자료1", "name": "후생노동성 노건국", "co": "자료1 · 보고 안건", "title": "제1호 보험료(65세 이상 보험료)의 바람직한 방향", "q": "보험료 단계 재편은 대체로 이해, 단계와 배율은 인구 분포를 보고 나중에 정한다.", "hl": ["대체로", "이해"], "pts": ["<b>결과:<\/b> 보험료 단계 재편 방향은 '대체로 이해(おおむね了承)'. 각 단계의 65세 이상 인구 분포를 보고 개정 뒤 단계 구분과 배율은 이후에 정한다.", "<b>근거 자료:<\/b> 2024년 전국가계구조조사 특별집계를 바탕으로 했다.", "<b>신중론:<\/b> 제7·제8단계 경계 부근 고령자의 부담이 어떻게 바뀌는지 검증해 달라는 요구가 나왔다.", "<b>방향(9월 제136회 자료 기준):<\/b> 고소득자 표준 배율 재검토, 과세 전환에 따른 상승을 줄이는 표준 단계 재검토, 중장기로는 계단 방식을 없애고 '수입의 몇 %'로 매기는 방식 검토. 이번 자료1과 같은 내용인지는 PDF 본문을 읽지 못해 단정하지 않는다.", "<b>한국과 다른 점:<\/b> 한국 장기요양보험료는 건강보험료에 비율을 곱하지만, 일본은 소득 단계별 배율을 곱한다.", "<b>우리에게:<\/b> 일본 고령자는 소득에 따라 보험료가 크게 다르다. 일본 판매 문구는 '누구나 같은 형편'이 아니라 비용에 민감한 층과 여유 있는 층을 나눠 쓰는 것이 맞다."], "src": "通所ケア研究会 2026.11.26 · LIMO 2026.11.27 · GemMed 2026.9.23(제136회) · 자료1 PDF는 제목·주소만 확인", "grade": "확인", "video": {"title": "よくわかる介護保険～サービスの利用開始まで～", "url": "https://www.youtube.com/watch?v=VzphVe5cAmU"}}, {"tm": "해설", "name": "현행 13단계 표와 특별감액", "co": "LIMO 해설 · 2026.11.27", "title": "65세 이상 보험료 13단계와 2028년도 특별감액", "q": "비과세에서 과세로 바뀌는 사람의 보험료 상승 폭을 절반쯤으로 줄인다.", "hl": ["절반쯤으로"], "pts": ["<b>기준액:<\/b> 현행 제9기(2024~2026년도) 전국 평균 기준액 월 6,225엔. 개호보험 시작 때는 2,911엔이었다.", "<b>13단계:<\/b> 1단계 배율 0.285(약 1,774엔)부터 13단계 2.4(14,940엔)까지. 5단계(1.0)가 기준액.", "<b>특별감액:<\/b> 주민세 비과세에서 과세로 바뀌는 사람의 단계 상승 폭을 절반쯤으로 억제(늘어나는 배율의 절반 감액). 2028년도부터 실시 예정, 그다음다음 해부터 일반 보험료로 돌아간다.", "<b>예시:<\/b> 3단계에서 6단계로 오르면 월 약 3,206엔, 연 약 38,000엔이 늘어난다.", "<b>적용 범위:<\/b> 2024.4.1 기준 표준 13단계를 쓰는 보험자 76.0%.", "<b>주의:<\/b> 이 표는 현행 제도의 표다. 이번 회의에서 새 배율 숫자는 나오지 않았다.", "<b>우리에게:<\/b> 일본 65세 이상은 보험료만 월 약 1,800~15,000엔을 낸다. 큐텐재팬 판매 때 '1장당·하루당 비용'처럼 부담을 작게 나눠 보여 주는 가격 설명이 통할 바탕이다."], "bars": {"t": "단계별 월 보험료 (엔, 기준액 6,225엔 기준 현행표)", "u": "엔", "rows": [["1단계 (0.285)", 1774, "c"], ["3단계 (0.685)", 4264, "c"], ["5단계 (1.0)", 6225, "b"], ["7단계 (1.3)", 8092, "b"], ["9단계 (1.7)", 10582, "b"], ["11단계 (2.1)", 13072, "a"], ["13단계 (2.4)", 14940, "a"]]}, "nums": [["3,206", "엔/월", "3단계 → 6단계 이동 때 늘어나는 보험료"], ["76.0", "%", "표준 13단계를 쓰는 보험자 (2024.4.1)"]], "shift": {"from": "2,911엔", "to": "6,225엔", "cap": "월 기준액: 개호보험 시작 때 → 제9기 전국 평균"}, "src": "LIMO 2026.11.27 (https://limo.media/articles/-/149109) · 특별감액 2028년도는 通所ケア研究会 기사와도 일치", "grade": "확인"}, {"tm": "자료2", "name": "후생노동성 노건국", "co": "자료2 · 지속가능성 확보(급부와 부담)", "title": "이용자 2할 부담 대상 확대", "q": "2할 부담 확대는 결론을 내지 않고 추가 자료를 받아 계속 심의한다.", "hl": ["계속", "심의한다."], "pts": ["<b>11/26 결과:<\/b> 2할 부담 대상 확대는 결론 보류, 추가 자료를 받아 계속 심의. 표본 수가 줄어드는 통계 문제도 언급됐다.", "<b>보도 불일치:<\/b> 通所ケア研究会 기사는 '계속 심의', TV아사히 계열 보도는 '일부 고령자 부담 인상 방침을 부회가 양해'. 보험료만 양해인지 2할도 포함인지 확인되지 않아 '계속 심의'를 기본으로 적는다.", "<b>현행 기준(9월 회의):<\/b> 단독 연금+기타 합계소득 280만 엔 이상, 부부 346만 엔 이상. 65세 이상 상위 약 20%.", "<b>검토안 4개(9월 회의):<\/b> 안1 260만 엔(약 25%, 약 13만 명) / 안2 250만 엔(약 26%, 약 21만 명) / 안3 240만 엔(약 28%, 약 28만 명) / 안4 230만 엔(약 30%, 약 35만 명). 11/26에도 같은 안이었는지는 확인되지 않았다.", "<b>배려 조치안:<\/b> ① 당분간 부담 증가 상한 월 7,000엔 ② 예금 500만 엔 이하면 1할 유지(자기 신고, 금융기관 조회·허위 신고 벌칙 검토). ②를 쓰면 늘어나는 인원이 13만 명에서 약 8만 명으로 준다(안1 기준).", "<b>일정:<\/b> 제10기는 2027년도부터 3년. '일정 이상 소득' 기준은 제10기 시작 전에 결론 내는 것이 적절하다는 흐름.", "<b>우리에게:<\/b> 한국 장기요양 본인부담 논의에서도 일본 2할·배려 조치가 비교 사례로 쓰일 수 있다. 본인부담이 오르면 급여 복지용구(고관절보호대) 구매 망설임이 커질 수 있어 3본부가 논의 흐름을 지켜본다."], "bars": {"t": "검토안별 새로 2할이 되는 사람 (만 명, 9월 회의 자료)", "u": "만 명", "rows": [["안1 (260만 엔)", 13, "c"], ["안2 (250만 엔)", 21, "b"], ["안3 (240만 엔)", 28, "b"], ["안4 (230만 엔)", 35, "a"]]}, "nums": [["7,000", "엔/월", "배려 조치 ① 부담 증가 상한"], ["500만", "엔", "배려 조치 ② 이 예금 이하면 1할 유지", 1]], "src": "通所ケア研究会 2026.11.26 · LIMO 2026.11.27 · 배경 숫자는 GemMed 2026.9.23(제136회) · 자료2 PDF는 제목·주소만 확인", "grade": "확인", "video": {"title": "介護給付費分科会の議論開始！【2027介護保険法改正】テーマと論点を整理します", "url": "https://www.youtube.com/watch?v=KnnQyPFqkGk"}}, {"tm": "제출자료", "name": "이시다 위원", "co": "위원 제출자료 (575KB PDF)", "title": "이시다 위원 제출자료 (石田委員提出資料)", "q": "위원 한 명이 따로 자료를 냈지만, 내용은 의사록 공개 뒤에야 알 수 있다.", "hl": ["의사록"], "pts": ["<b>확인된 것:<\/b> 공식 페이지에 '石田委員提出資料'(575KB PDF) 제목과 주소가 올라와 있다.", "<b>확인 못 한 것:<\/b> 위원 소속과 자료 내용. PDF 본문과 위원 명단 PDF를 읽지 못했다.", "<b>다음 확인:<\/b> 의사록이 공개되면 발언 요지와 함께 다시 정리한다.", "<b>우리에게:<\/b> 지금은 할 일 없음. 의사록이 나오면 이 위원이 복지용구·이용자 부담에 어떤 입장인지 확인해 일본 진출 자료에 반영한다."], "src": "후생노동성 제139회 자료 페이지 (https://www.mhlw.go.jp/content/12300000/001772490.pdf, 제목·주소만 확인)", "grade": "확인"}, {"tm": "맥락", "name": "위원 의견 구도", "co": "제136회(2026.9.18) 회의 기준 · 이번 회차 아님", "title": "2할 확대를 두고 갈린 위원들", "q": "현역 세대 부담이 한계라는 쪽과, 이용을 줄여 몸이 더 나빠진다는 쪽이 맞선다.", "hl": ["현역", "세대"], "pts": ["<b>확대 찬성·속도:<\/b> 전국건강보험협회는 현역 세대 부담이 한계라며 속도를 내자고 했고, 일본경제단체연합회·일본상공회의소는 확대와 배려 조치를 함께 구체화하자고 했다.", "<b>신중:<\/b> 민간개호사업추진위원회, 렌고(노동조합 총연합), 전국노인보건시설협회, 인지증개호연구연수 도쿄센터, UA젠센 일본개호크래프트유니온, 일본의사회.", "<b>기타 의견:<\/b> 히토쓰바시대 위원은 마이넘버·계좌 연결로 금융소득·자산 파악을, 도쿄대 위원은 세대 단위·개인 단위 정리를 제안. 전국시장회·전국정촌회는 배려 조치 ②안 편중에 반대하고 자치단체 부담을 고려하라고 했다.", "<b>주의:<\/b> 11/26 회의의 발언자별 입장은 확보하지 못했다. 이 구도가 이어졌는지는 추정이다.", "<b>우리에게:<\/b> 시설·의료·노조가 '이용 억제'를 걱정한다는 것은 현장에서 비용이 구매를 가른다는 뜻이다. 일본 시설용 제안서에는 비용 부담을 줄이는 근거를 앞에 둔다."], "src": "GemMed 2026.9.23 (제136회 회의 기사)", "grade": "확인"}, {"tm": "참고", "name": "유료노인홈 등록제", "co": "제138회(2026.11.9) 회의 · 보고 안건", "title": "유료노인홈 신고제에서 등록제로", "q": "유료노인홈을 신고만 하면 되던 것에서 등록해야 하는 시설로 바꾼다.", "hl": ["등록해야"], "pts": ["<b>의제:<\/b> 특정지역 기준안, 특정지역 재택서비스 등 사업, 유료노인홈 등록제 시행 대응(모두 보고).", "<b>법:<\/b> 2026.6.25 공포된 사회복지법 등 일부개정법에 따른 등록제 시행 준비(검색 요약 기준).", "<b>안 단계 내용:<\/b> 거실은 원칙 개인실·1인당 13㎡ 이상, 함께 운영하는 개호사업소 이용을 계약 조건으로 거는 것 금지, 정령·성령은 연내 공포 예정. 확정 여부는 확인되지 않았다.", "<b>자료 상태:<\/b> 자료 3건 제목·주소만 확인, 본문 PDF와 위원 발언 기사는 찾지 못했다.", "<b>우리에게:<\/b> 일본 시설에 제품을 넣을 때 시설 운영 규칙이 바뀌는 중이다. 시설 영업을 검토하게 되면 등록제 확정 내용을 먼저 확인한다."], "nums": [["13", "㎡", "1인당 거실 최소 면적 (안 단계)"]], "src": "후생노동성 제138회 개최 안내 (https://www.mhlw.go.jp/stf/newpage_77153.html) · 자료3 내용은 검색 요약", "grade": "추정"}, {"tm": "해외 · 중국", "name": "민정부·재정부", "co": "중국 · 신화망·인민일보 · 2026.10.08", "title": "노인돌봄 소비권 246만 명 이상", "q": "다음 달이면 사라지는 바우처로 노인 돌봄 서비스 소비를 바로 끌어낸다.", "hl": ["사라지는", "바우처로"], "pts": ["<b>시장 상황:<\/b> 2026.1.1부터 전국에서 중등도 이상 장애 노인에게 돌봄 서비스 소비 보조. 지역사회·재가 서비스는 50%, 기관 서비스는 40%를 깎아 준다.", "<b>숫자:<\/b> 1인 월 최대 800위안, 그달 안에 써야 하고 다음 달 소멸, 평가 비용 최대 100위안 공제. 10월 7일 기준 246만 명 이상 혜택. 양로기관·시설 38.8만 곳(6월 말, 그중 지역사회 35만 곳). 시행은 2026년 12월 말까지.", "<b>반응:<\/b> 지방 채널 해설(11.2)이 이어지고 있다. 수혜자 수는 보도마다 달라(3월 보도 89.2만 명) 시점 차이로 본다.", "<b>국내와 비교:<\/b> 한국은 장기요양 등급에 따라 급여로 지원하고, 중국은 한 달 쓰고 사라지는 바우처로 단기 소비를 끌어낸다. 12월 말 이후 연장 여부가 시장 변수.", "<b>우리에게:<\/b> 당장 중국 판매 계획은 없지만, '정부 보조가 생기면 돌봄 용품 소비가 바로 붙는다'는 사례다. 연장 여부만 감시 명단에 둔다."], "nums": [["246만", "명+", "소비권 혜택 노인 (10.7 기준)", 1], ["800", "위안/월", "1인 최대 보조"], ["38.8만", "곳", "양로기관·시설 (6월 말)"]], "bars": {"t": "서비스 종류별 공제율 (%)", "u": "%", "rows": [["지역사회·재가", 50, "a"], ["기관", 40, "b"]]}, "src": "신화망 2026.10.08 · 신랑재경 2026.11.02 (지방 채널 해설)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "민정부 등", "co": "중국 · 정부 영문 포털 · 2026.04.29", "title": "실버 경제 로드맵", "q": "재가 중심에서 시장 중심으로, 2035년 실버 산업을 주력 산업으로 키운다.", "hl": ["시장", "중심으로"], "pts": ["<b>시장 상황:<\/b> 재가 돌봄 중심에서 시장 중심으로 전환하고 2035년 주력 산업화를 목표로 한다(7개월 전 소식).", "<b>숫자:<\/b> 중국 공업정보화부 추정 시장 15.8조 위안(약 2.2조 달러). 언론 해설 재인용이라 추정치다.", "<b>반응:<\/b> 원문은 이번에 다시 열어 보지 못했다.", "<b>국내와 비교:<\/b> 한국도 시니어 산업을 성장 산업으로 보지만, 중국은 정부가 시장 규모 목표를 직접 걸었다.", "<b>우리에게:<\/b> 중국 시니어 시장은 크지만 진출 계획은 없다. 일본 다음 시장 후보로만 기록한다."], "src": "중국 정부 영문 포털 (이전 회차 확인 주소, 이번 미열람) · CGTN 해설 재인용", "grade": "추정"}, {"tm": "해외 · 독일", "name": "독일 연방내각", "co": "독일 · Euronews·The Local · 2026.09.30", "title": "개호보험 개편안 내각 의결", "q": "서비스 개편은 위원회로 미루고, 보험료와 재원부터 고친다.", "hl": ["보험료와", "재원부터"], "pts": ["<b>시장 상황:<\/b> 보건장관이 낸 개호보험 개편법(Pflegeneuordnungsgesetz) 초안을 내각이 승인. 의회 통과 전이라 바뀔 수 있다.", "<b>숫자:<\/b> 무자녀 가입자 부가보험료 0.6% → 0.9%(2027.1.1부터), 보험료 산정 상한 300유로 인상(현재 월 5,812.50유로), 미니잡 보험료 도입(연 약 14억 유로), 기본 보험료율 3.6%, 재정 부족 약 80억 유로.", "<b>그 밖:<\/b> 가족 돌봄자 연금보험료 계속 지급, 배우자·생활동반자 추가 부담은 2028년부터(Euronews, The Local은 시점 미표기). 구조개혁위원회 제안 기한 2027년 1월.", "<b>국내와 비교:<\/b> 재원 구조를 먼저 고치고 서비스 개편은 뒤로 미룬다. 한국 장기요양 재정 논쟁, 일본 2할 논의와 같은 방향이다.", "<b>우리에게:<\/b> 일본·독일 모두 보험 재정이 빠듯해 이용자 부담이 오르는 쪽이다. 급여 제품도 '보험 밖에서 내 돈 주고 살 이유'를 상세페이지에 함께 준비한다."], "bars": {"t": "무자녀 가입자 부가보험료 (%)", "u": "%", "rows": [["현행", 0.6, "c"], ["2027.1.1~ (안)", 0.9, "a"]]}, "nums": [["80억", "유로", "개호보험 재정 부족 (The Local)", 1], ["3.6", "%", "기본 보험료율"]], "src": "Euronews 독일어판 2026.09.30 · The Local 2026.10.01 (후반부 유료로 일부만 열람)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "AARP 리서치", "co": "미국 · AARP·AgeTech Collaborative · 2026", "title": "50세 이상 기술 이용 동향 2026", "q": "50세 이상 10명 중 7명이 기술 제품을 산다.", "hl": ["10명", "7명이"], "pts": ["<b>시장 상황:<\/b> 50세 이상의 기술 제품 구매 경험이 2024년 67%에서 2025년 71%로 늘었다. 5명 중 2명이 2026년 구매를 계획.", "<b>숫자:<\/b> 생성형 AI 사용은 2025년 30%(블로그 인용). 도입을 망설이는 이유로 약 절반이 신뢰·개인정보를 꼽았다.", "<b>반응:<\/b> 후속으로 'Applied AgeTech in Real Life'(2026.6), 'AI and Independence'(2026.8) 보고서가 이어졌다. 원문은 접속이 막혀 검색 요약 기준이다.", "<b>국내와 비교:<\/b> 미국 시니어의 기술 구매는 이미 70%대. 한국 에이지테크 시장을 가늠할 때 참고치로 쓰되, 인용 전에 원문을 확인한다.", "<b>우리에게:<\/b> 시니어도 온라인으로 산다는 근거다. 다만 '신뢰·개인정보' 걱정이 크므로 자사몰·스마트스토어 구매 화면에 인증·후기·반품 안내를 분명히 둔다."], "bars": {"t": "50세 이상 기술 제품 구매 경험 (%)", "u": "%", "rows": [["2024", 67, "c"], ["2025", 71, "a"]]}, "src": "AARP 2026 Tech Trends (원문 접속 막힘, 검색 요약) · AgeTech Collaborative 보고서", "grade": "추정"}, {"tm": "해외 · 미국", "name": "CMS (메디케어·메디케이드 서비스 센터)", "co": "미국 · 정책 분석 요약 · 2026.02.25", "title": "의료용품 공급자 신규 등록 6개월 중단", "q": "일부 의료용품 공급업체의 신규 메디케어 등록을 전국에서 6개월 멈췄다.", "hl": ["6개월"], "pts": ["<b>제품:<\/b> 내구성 의료용품·보조기·보철·소모품(DMEPOS) 공급업체 일부의 신규 메디케어 등록을 6개월 중단. 기존 업체는 계속 영업.", "<b>숫자:<\/b> 중단 기간 6개월(9개월 전 소식).", "<b>반응:<\/b> 원문 주소를 확보하지 못해 정책 분석 요약 기준이다.", "<b>국내와 비교:<\/b> 보험 급여 용품 공급자의 진입을 정부가 직접 조이는 사례. 한국 복지용구 사업소 지정 기준과 비교할 만하다.", "<b>우리에게:<\/b> 급여 시장은 공급자 자격이 언제든 엄격해질 수 있다. 고관절보호대 급여 판매를 앞두고 사업소 지정·관리 기준 변화도 3본부 감시 항목에 넣는다."], "nums": [["6", "개월", "신규 등록 중단 기간"]], "src": "정책 분석 요약 (원문 주소 미확보)", "grade": "추정"}], "flow": [{"k": "현역 세대 부담과 이용 억제 걱정이 평행선", "d": "보험·경제단체는 확대, 시설·노조·의료는 신중. 11/26도 결론 없이 계속 심의", "who": [3, 5]}, {"k": "소득에 따라 다시 나누는 보험료", "d": "고소득 배율 상향 검토, 과세 전환자 특별감액(2028년도~)", "who": [1, 2]}, {"k": "근거 숫자의 신뢰가 반복 쟁점", "d": "가계조사 특별집계, 줄어드는 표본 수, 예금을 어떻게 파악하나", "who": [1, 3, 5]}, {"k": "일본·독일 모두 돈 문제부터 고친다", "d": "일본 2할 확대·보험료 재편, 독일 무자녀 부가보험료 0.9% — 서비스 개편보다 재원이 먼저", "who": [1, 3, 9]}, {"k": "공급자·시설 관리가 엄격해진다", "d": "일본 유료노인홈 등록제, 미국 의료용품 공급자 신규 등록 중단", "who": [6, 11]}, {"k": "보조금이 생기면 소비가 바로 붙는다", "d": "중국 월 소멸 바우처 246만 명 이상, 미국 50세 이상 기술 구매 71%", "who": [7, 10]}], "flowHeadline": "일본도 독일도, 늘어나는 돌봄 비용을 누가 낼지부터 다툰다", "apply": [{"k": "한국 장기요양 본인부담 논의에 일본 2할 사례 대비", "p": "우선", "d": "일본은 2할 대상을 상위 20%에서 최대 30%까지 넓히는 안과 예금 500만 엔 이하 1할 유지 같은 배려 조치를 논의 중이다. 한국에서 비슷한 논의가 나오면 급여 복지용구 본인부담에 영향이 있다. 3본부가 국내 고시·회의 자료에서 '본인부담'·'일본 사례' 언급을 감시하고, 나오면 영향 정리를 바로 만든다.", "r": "③ 자료2 · ⑤ 위원 의견 구도", "who": "3본부 (급여 등재·규제)"}, {"k": "일본 판매 가격 설명은 '작게 나눈 비용'으로", "p": "우선", "d": "일본 65세 이상은 소득에 따라 보험료가 월 약 1,800~15,000엔으로 크게 다르고, 이용자 부담도 오르는 흐름이다. 큐텐재팬 상세페이지에 1장당·하루당 비용과 오래 쓰는 정도를 함께 보여 줘 비용에 민감한 층을 겨냥한다.", "r": "② 13단계 표 · ③ 자료2", "who": "일본 수출 담당 · 2본부"}, {"k": "일본 복지용구 대여·구입 구조 확인", "p": "검토", "d": "일본은 2024년 4월부터 지팡이·보행기 등을 빌릴지 살지 고르는 선택제를 시행했고, 특정복지용구는 구입 때 자기부담 구조가 따로 있다. 우리 제품 같은 품목이 일본 개호보험 대여·구입 목록 어디에 들어가는지 공공 해설 영상과 자료로 먼저 확인한다.", "r": "① 자료1 (용어 풀이 · 설명 영상)", "who": "일본 수출 담당 · 3본부"}, {"k": "급여 제품도 '보험 밖 구매 이유' 문구를 준비", "p": "검토", "d": "일본·독일 모두 보험 재정이 빠듯해 이용자 부담이 오르는 쪽이다. 고관절보호대 급여 판매를 준비하면서, 급여를 못 받는 사람이나 가족이 직접 살 때 필요한 설명(낙상 걱정을 덜어 주는 생활 장면 중심, 효능 단정 없이)을 자사몰·스마트스토어용으로 함께 만든다.", "r": "③ 자료2 · ⑨ 독일 개편안", "who": "2본부 · 3본부"}, {"k": "온라인 구매 화면에 '믿을 근거'를 먼저", "p": "검토", "d": "미국 50세 이상 71%가 기술 제품을 사지만 약 절반이 신뢰·개인정보를 걱정한다. 시니어·가족 고객이 보는 구매 화면 첫 부분에 인증·실제 후기·반품 안내를 배치한다.", "r": "⑩ AARP", "who": "2본부 쇼핑몰"}, {"k": "급여 공급자 자격 변화 감시", "p": "유지", "d": "미국은 의료용품 공급자 신규 등록을 6개월 멈췄고, 일본은 유료노인홈을 등록제로 바꾼다. 한국 복지용구 사업소 지정·관리 기준 변화도 3본부 정기 감시 항목에 넣는다.", "r": "⑥ 유료노인홈 등록제 · ⑪ 미국 CMS", "who": "3본부"}, {"k": "정보 채널 소재: '일본 65세 보험료 월 6,225엔'", "p": "유지", "d": "개호보험 시작 때 2,911엔에서 지금 6,225엔으로 두 배 넘게 오른 숫자는 한국 시청자에게도 비교 소재가 된다. 의사록 공개 뒤 확정 내용으로 정보 채널용 설명 영상 소재 후보에 올린다.", "r": "② 13단계 표", "who": "1본부"}], "media": {"headline": "회의 다시보기는 아직 없어, 일본 개호보험을 쉽게
