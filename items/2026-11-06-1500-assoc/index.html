 변화:<\/b> AI가 화면 속 대화를 넘어 공장에서 몸을 쓰는 '피지컬 AI' 시대.", "<b>약속:<\/b> '피지컬 AI 확산을 위해 재경부가 관계부처와 원팀이 되어 재정·세제·금융·규제를 하나로 묶겠다.'", "<b>의미:<\/b> 지원 수단 4가지(재정·세제·금융·규제)를 한 묶음으로 내겠다는 신호. 정책토론회는 재정경제부가 공동 주최했다."], "nums": [["4", "가지", "한데 묶을 지원 수단(재정·세제·금융·규제)"]], "video": {"title": "[AI·ICT가 좋다] 현실 세계로 나온 AI, 피지컬 AI란?", "url": "https://www.youtube.com/watch?v=3UZspRBlum0"}, "src": "매일신문 · 매일일보", "grade": "확인"}, {"tm": "10.21", "name": "박영선", "co": "재정경제부 전략경제자문단 위원장(전 중기부 장관) · 기조연설", "title": "AI의 2막, 중소기업의 미래를 바꾸다", "q": "앞으로 모든 기업은 두 개의 공장을 가져야 합니다. 하나는 제품을 만들고, 다른 하나는 지능을 만드는 공장입니다.", "hl": ["두", "지능을"], "pts": ["<b>AI의 3막:<\/b> 1막 생성형(글·그림을 만드는 AI) → 2막 에이전틱(목표를 주면 스스로 일을 끝내는 AI) → 3막 피지컬(로봇에 에이전트가 하나씩 들어가 스스로 일하는 AI). '피지컬 AI는 스마트팩토리와 다르다.'", "<b>조직부터 바꿔라:<\/b> '회사가 수직적인 이상 AI를 도입해 봤자 100% 효과를 볼 수 없다. AI가 보고서를 5분 만에 만들어도 보고하는 데 하루가 걸린다면 AI를 쓸 이유가 없다.'", "<b>두 개의 공장:<\/b> 제품을 만드는 공장과 데이터를 넣어 지능을 뽑아내는 'AI 공장'을 함께 가져야 한다.", "<b>중소기업은 반복 업무부터:<\/b> 큰 플랫폼보다 견적서·회의록 작성, 납기·재고 확인, 매출·품질 보고서 작성부터 AI를 쓴다.", "<b>피지컬 AI 4대 분야:<\/b> 품질검사, 물류·운반, 생산·가공, 설비 관리. 고르는 기준은 반복성·위험도, 인력난, 불량 비용, 투자 대비 효과.", "<b>업종별 버티컬 AI:<\/b> 중소기업은 AI 공장을 따로 갖추기 어려우니 중기중앙회·협동조합이 업종별로 데이터를 모으고, 정부가 연구개발 자금을 대자.", "<b>K-온톨로지:<\/b> 데이터의 뜻과 관계를 이어 주는 한국형 산업별 표준. 국방·제조·의료 시범, 데이터 모델러·지식그래프 인력 양성 제안. 예) '제주도에 비가 온다'를 듣고 사람은 가뭄 해갈·우산 매출을 떠올리지만 AI는 데이터를 이어 주지 않으면 못 떠올린다.", "<b>사람의 역할:<\/b> 'AI의 목표를 정하고, AI가 제대로 일하는지 검증하고 책임지는 것.'"], "nums": [["5", "분", "AI가 보고서를 만드는 시간(예시)"], ["1", "일", "보고에 하루 걸리면 AI 효과 없음", 1], ["4", "대 분야", "피지컬 AI 적용: 품질검사·물류·생산·설비"]], "shift": {"from": "생성형", "to": "피지컬", "cap": "AI 1막 → 3막 (2막은 에이전틱)"}, "table": [["AI의 막", "무엇을 하나"], ["1막 생성형", "질문에 답하고 글·그림을 만든다"], ["2막 에이전틱", "목표를 주면 계획을 세워 일을 끝까지 한다"], ["3막 피지컬", "로봇마다 에이전트가 들어가 현실에서 스스로 일한다"]], "video": {"title": "[AI·ICT 백과사전] 에이전틱 AI (Agentic AI)", "url": "https://www.youtube.com/watch?v=MQDXJudNCWA"}, "src": "한국경제 · 파이낸셜뉴스 · 뉴스토마토 · 매일일보 · 열린정책뉴스", "grade": "확인"}, {"tm": "10.21", "name": "김준하", "co": "GIST(광주과학기술원) AI정책전략대학원장 · 토론",
