 규정의 적용일이 2026년 8월에서 2027년 12월로 밀린다.", "hl": ["2027년"], "pts": ["<b>시장 상황:<\/b> EU가 AI 규제법의 무거운 의무를 늦추는 개정에 잠정 합의했다. 중소기업 면제도 중견기업(small mid-cap)까지 넓힌다.", "<b>숫자:<\/b> 독립형 고위험 AI 2026-08-02 → 2027-12-02, 제품 내장형(의료기기 등) 2027-08-02 → 2028-08-02. 2026-12-02부터 AI로 만든 아동 성착취물·동의 없는 친밀 콘텐츠 생성 시스템 금지(신규). 생성형 AI 콘텐츠 워터마킹 의무 유예는 2026-12-02까지.", "<b>반응:<\/b> 근거는 로펌 해설(Sidley Austin·CMS)이며 EU 공식 문서가 아니다. 6월 22일 기준 이사회 최종 채택을 기다리는 중이었고, 11월 8일 기준 최종 채택·관보 게재는 확인하지 못했다.", "<b>국내와 비교:<\/b> 한국 AI 기본법과 함께 보면, 유럽에 수출할 때 무거운 의무가 걸리는 시점이 뒤로 밀린 셈이다. AI로 만든 영상·이미지의 워터마킹 유예 종료(12/2)는 가깝다."], "nums": null, "bars": null, "shift": {"from": "2026.08.02", "to": "2027.12.02", "cap": "독립형 고위험 AI(채용·고용 등) 규정 적용일. 잠정 합의 내용이며 최종 채택은 11/8 기준 미확인"}, "table": [["구분", "기존 → 변경"], ["독립형 고위험 AI(채용·고용 등)", "2026-08-02 → 2027-12-02"], ["제품 내장형 고위험 AI(의료기기 등)", "2027-08-02 → 2028-08-02"], ["생성형 AI 콘텐츠 워터마킹 의무", "2026-12-02까지 유예"], ["AI 아동 성착취물·동의 없는 친밀 콘텐츠 생성 시스템", "2026-12-02부터 금지(신규)"]], "src": "Sidley Austin 해설(6/22) · CMS 해설", "grade": "추정"}, {"tm": "해외 · 일본", "name": "PwC Japan", "co": "일본(6개국 비교) · 생성 AI 실태조사 2026 봄 · 설명회 2026.06.10, 기사 06.11·06.25", "title": "생성 AI, 쓰는 회사는 87%인데 기대 이상은 9%", "q": "일본 대기업의 87%가 생성 AI를 쓰거나 추진 중이지만, 기대를 크게 웃돌았다는 곳은 9%로 6개국 중 가장 낮다.", "hl": ["9%로"], "pts": ["<b>시장 상황:<\/b> 매출 500억 엔 이상 기업의 과장급 이상 약 3천 명(일본·미국·영국·중국·독일·한국)을 2~3월에 조사했다.", "<b>숫자:<\/b> 일본 활용·추진 87%, 미착수·포기 4%(전년의 절반), '기대만큼' 47%. '기대를 크게 웃돌았다'는 미국 38%·영국 32%·일본 9%, 한국·중국·독일은 10%대(정확치 미공개).", "<b>돈으로 돌려준 비율:<\/b> 성과를 임금 인상·가격 인하 같은 재무 환원으로 연결한 곳은 일본 40%(가장 낮음), 미국·영국은 70% 넘음. '환원 없음'은 일본 19%.", "<b>반응:<\/b> 일본 IT 매체(Impress Cloud Watch)와 교도통신 계열 지역지가 보도했다. 한국의 정확한 수치는 PwC 원 보도자료를 열지 못해 확인하지 못했다.", "<b>국내와 비교:<\/b> 6개국 모두 활용·추진은 90% 안팎으로 비슷하다. 하지만 '기대 이상' 성과는 한국·일본 모두 10%대 이하. 국내 행사에서 성과 숫자를 낸 곳이 몇 안 되는 것과 같은 모습이다."], "nums": [["87", "%", "일본 활용·추진 중"], ["9", "%", "일본 '기대를 크게 웃돌았다'(6개국 최저)", 1], ["47", "%", "일본 '기대만큼'"], ["19", "%", "일본 '재무 환원 없음'"]], "bars": {"t": "생성 AI 성과가 '기대를 크게 웃돌았다' (단위 %, 한·중·독은 10%대
