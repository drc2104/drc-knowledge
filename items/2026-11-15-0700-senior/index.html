"}, {"k": "사는 사람은 자녀: 자녀가 읽는 문구와 광고 대상", "p": "우선", "d": "노동연령층에서 344.9조 원이 유년·노년층으로 넘어간다. 시니어 용품을 실제로 고르고 결제하는 사람은 30~50대 자녀일 수 있다. 메타 광고와 상세페이지에 '부모님께 보내기'·정기배송 문구를 넣고 자녀 나이대 대상 광고를 따로 시험한다.", "r": "⑤ 이전 · ③ 나이 집단별", "who": "2본부 광고·콘텐츠팀"}, {"k": "고관절보호대 급여 판매 준비의 근거 숫자로 쓰기", "p": "우선", "d": "노년층 적자의 약 78%를 이전(연금·복지 같은 공공이전과 자녀 용돈 같은 민간이전)이 채운다. 공공 쪽 길인 장기요양 복지용구 급여와 자녀가 대신 사 주는 길을 함께 준비해야 한다는 뜻이다(공공·민간 나눈 몫은 이번 자료로 확인 못 함). 2027년 3월 급여 판매에 앞서 복지용구 사업소 안내 자료에 '본인부담'을 쉽게 풀어 넣는다.", "r": "⑤ 이전 · ④ 노년층 소비", "who": "3본부"}, {"k": "'일하는 60대'를 고객 묶음으로 따로 보기", "p": "검토", "d": "한국은 61세까지 흑자, 일본은 일하는 60대가 40·50대보다 옷에 더 쓴다. 출근·외출·운동 같은 활동 장면으로 요실금팬티 영상·사진을 만들고, '아픈 어르신' 말고 '바쁜 60대' 모습으로 보여 준다.", "r": "② 1인당 생애주기 · ⑩ 일본", "who": "1본부 · 2본부 광고·콘텐츠팀"}, {"k": "일본 역직구 상품 문구에 '일하는 시니어' 넣기", "p": "검토", "d": "일본 시니어 관련 시장은 주요 분야가 모두 성장했고, 일하는 60대의 지출이 크다. 큐텐재팬 상품명·설명에 일하는 시니어가 쓰는 장면을 넣어 시험한다.", "r": "⑩ 일본", "who": "일본 수출 담당"}, {"k": "정보 채널 소재: '61세부터 적자'와 '연금 중간값'", "p": "검토", "d": "61세 적자 재진입, 연금 평균과 중간값 차이는 시청자가 자기 일로 느끼는 숫자다. 정보 채널에서 노후 돈 흐름을 쉽게 풀고, 숫자는 2024년분 공식 발표만 쓴다.", "r": "② 1인당 생애주기 · ⑦ 연금통계", "who": "1본부"}, {"k": "낙상 예방 제품군을 '집에서 오래 살기'로 묶어 지켜보기", "p": "유지", "d": "해외 전시의 중심은 낙상·가스·인지 저하를 막는 센서·AI 제품이다. 고관절보호대 옆에 붙일 수 있는 제품(낙상 알림 등)이 국내 급여·판매로 들어오는지 지켜본다.", "r": "⑫ CES 2026", "who": "3본부"}], "glossary": [{"term": "국민이전계정", "easy": "나이별로 얼마 벌고 얼마 쓰는지 보고, 그 차이를 누가 채우는지 보는 통계.", "why": "시니어 용품 시장이 얼마나 클지 가늠하는 바탕 숫자다.", "video": {"title": "“한국인 노동 소득 45살 정점, 61살부터 적자” / KBS 2025.09.25.", "url": "https://www.youtube.com/watch?v=f9RH4s-wzpM"}}, {"term": "생애주기적자", "easy": "소비에서 노동소득을 뺀 금액. 쓰는 돈이 버는 돈보다 많으면 적자.", "why": "노년층 적자 188.9조 원은 노년층이 일해서 번 돈 말고 다른 돈으로 쓰는 시장의 크기다.", "video": {"title": "100세 시대인데...한국인 61세부터 적자 전환 [앵커리포트] / YTN", "url": "https://www.youtube.com/watch?v=ZrKw0-0ulvw"}}, {"term": "노동연령층", "easy": "15~64세. 일해서 돈을 버는 나이 집단.", "why": "시니어 비용을 대는 층이자, 부모님 용품을 대신 사는 자녀가 여기 있다."}, {"term": "유년층·노년층", "easy": "14세 이하가 유년층, 65세 이상이 노년층.", "why": "우리 제품을 쓰는 사람은 노년층, 사는 사람은 노동연령층일 수 있다."}, {"term": "이전 (공공·민간)", "easy": "대가 없이 오가는 돈. 연금·복지는 공공이전, 용돈·상속은 민간이전.", "why": "복지용구 급여(공공)와 자녀가 사 주는 선물(민간) 두 길이 모두 여기에 들어간다."}, {"term": "자산재배분", "easy": "집·예금 같은 자산에서 생긴 소득에서 저축을 뺀 몫.", "why": "자산이 있는 시니어는 지원 없이도 직접 살 힘이 있다."}, {"term": "순유출·순유입", "easy": "내보낸 돈에서 들어온 돈을 뺀 값이 플러스면 순유출, 반대면 순유입.", "why": "노동연령층 344.9조 원 순유출 같은 숫자를 읽는 법이다."}, {"term": "노동소득", "easy": "일해서 번 돈. 월급(임금)과 자영업 소득을 합친 것.", "why": "고령자의 노동소득이 늘수록 스스로 살 수 있는 힘이 커진다.", "video": {"title": "'1천만 명 돌파' 진격의 노인 소득 취업 (자막뉴스) / SBS", "url": "https://www.youtube.com/watch?v=8mFmfVz8ZuI"}}, {"term": "평균과 중간값", "easy": "평균은 모두 더해 사람 수로 나눈 값, 중간값은 줄 세웠을 때 한가운데 사람의 값.", "why": "연금 평균 73.7만 원보다 중간값 49.7만 원이 실제 고객 대부분의 사정에 가깝다. 가격을 정할 때 중간값을 본다."}, {"term": "국민시간이전계정", "easy": "돈 대신 집안일·돌봄 시간이 누구에게서 누구에게 가는지 보는 같은 틀의 통계(2026.06.23 따로 발표).", "why": "가족이 쓰는 돌봄 시간은 돌봄 용품 수요와 이어질 수 있다(추정)."}, {"term": "에이지테크", "easy": "나이 든 사람의 생활·건강·돌봄을 돕는 기술과 제품.", "why": "복지용구와 돌봄 제품이 여기에 들어가고, 해외 전시의 중심 분야다.", "video": {"title": "새로운 시니어, 새로운 산업: 에이지 테크 #김영선 교수", "url": "https://www.youtube.com/watch?v=x9-mYAa2Rd0"}}, {"term": "소득공백", "easy": "은퇴부터 연금을 받기 시작할 때까지 들어오는 돈이 없는 기간.", "why": "이 구간의 시니어는 값에 민감할 수 있다(추정)."}], "glossaryHeadline": "숫자를 읽는 데 필요한 말 12개", "media": {"headline": "이번 발표 영상은 없어, 같은 통계의 지난 발표 뉴스와 시니어 시장 설명 영상 6편을 붙였습니다", "videos": [{"title": "“한국인 노동 소득 45살 정점, 61살부터 적자” / KBS 2025.09.25.", "url": "https://www.youtube.com/watch?v=f9RH4s-wzpM", "len": "길이 미확인", "note": "KBS News · 같은 통계의 전년(2023년분) 발표 뉴스. 1인당 생애주기 개념 설명용, 숫자는 이번과 다름"}, {"title": "100세 시대인데...한국인 61세부터 적자 전환 [앵커리포트] / YTN", "url": "https://www.youtube.com/watch?v=ZrKw0-0ulvw", "len": "길이 미확인", "note": "YTN · 61세 적자 전환을 쉽게 설명. 몇 년분 자료인지 미확인이라 개념 설명용"}, {"title": "최근 5년간 시니어 연령층 소비 '가파른 증가' / SBS", "url": "https://www.youtube.com/watch?v=9S_ZZ3JSI7A", "len": "길이 미확인", "note": "SBS 뉴스 · 카드 소비로 본 시니어 소비 증가"}, {"title": "노인인구 천만 시대, 노인 소비층 'GG' 소비 '큰손' 부상/[+PICK]/한국경제TV뉴스", "url": "https://www.youtube.com/watch?v=v-kR_7qi-AA
