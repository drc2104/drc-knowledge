": "상 · 11.16", "name": "코오롱스포츠 (코오롱인더스트리 FnC부문)", "co": "한국 · 중소기업신문 · 2026-11-16 11:00", "title": "윈드체이서 재킷에 'PFAS 없는 ePE 필름' 적용", "q": "국내 아웃도어 브랜드 제품에 불소를 쓰지 않는 방수·투습 막이 실제로 들어갔다.", "hl": ["불소를", "실제로"], "pts": ["<b>무엇이 새로운가:<\/b> 기사 원문은 \"최근 제품에는 고어텍스 2레이어 소재와 PFAS를 사용하지 않는 ePE 필름이 적용됐다\"고 적었다. 불소 대체 기술로 옮겨 가는 사례로 소개됐다.", "<b>숫자:<\/b> 신세계백화점 1~10월 아웃도어 매출이 전년 같은 기간보다 약 13% 늘었다(이 제품의 직접 숫자는 아님). 가격·출시일·막의 수압·투습도는 기사에 없다.", "<b>마케팅:<\/b> 기사는 방수·방풍·투습을 아웃도어 소재 경쟁의 핵심으로 짚었다.", "<b>고객 반응:<\/b> 기사에서 확인되지 않음.", "<b>우리에게:<\/b> 팬티 방수층은 겉옷 막만큼 두껍지 않지만, 거래처가 'PFAS 없는 방수층' 성적서를 요구할 때를 대비해 방수층 후보 업체에 PFAS 시험서를 미리 받아 둘 근거가 된다."], "nums": [["13", "%", "신세계백화점 1~10월 아웃도어 매출 증가 (약, 간접 숫자)", 1], ["2", "레이어", "함께 쓰인 고어텍스 소재 구성"]], "src": "중소기업신문 2026-11-16 (원문 열람)", "grade": "확인"}, {"tm": "상 · 10.22", "name": "에너에버배터리솔루션", "co": "한국 · 전자신문 · 2026-10-22 09:32 · 지난 소식(32일 전)", "title": "[지난 소식] PFAS 없는 'WET-PE' 투습방수 막, 2027년 하반기 국내 최초 양산 예고", "q": "고어텍스류 불소계 막을 국산 폴리에틸렌 막으로 대체하겠다는 계획이다.", "hl": ["국산"], "pts": ["<b>무엇이 새로운가:<\/b> 습식 폴리에틸렌(초고분자량 폴리올레핀을 압출·연신한 다공막) 막으로, 기사는 'PFAS-프리, 불소 미사용'이라고 설명했다. 2027년 하반기 양산 시작, 2028년 본격 공급 예정이고 인증용 샘플이 대형 아웃도어 브랜드에 가 있다(업체 주장).", "<b>숫자:<\/b> 막 두께 5~25㎛(기사 그림 설명). 완주 공장 2차 원단 라인이 내년 2분기 가동하면 연 1억 6,000만㎡, 코팅 라인 4개→7개. 수압·투습도 수치는 기사에 없다.", "<b>회사 계획:<\/b> 매출 20억 원(작년)→62억 원(올해), 2030년 목표 1,149억 원·영업이익률 26.3%. 독일·인도·미국 조지아에 슬리팅 거점 계획. 보도자료 성격이 강하다.", "<b>고객 반응:<\/b> 양산 전이라 해당 없음.", "<b>우리에게:<\/b> 2027년 하반기 이후 국산 PFAS 없는 막이 방수층 후보가 된다. 지금은 샘플과 수압·투습·세탁 내구성 시험 요청만 가능하고 가격 정보는 없다."], "bars": {"t": "에너에버 매출 (억 원, 2030년은 업체 목표)", "u": "억 원", "rows": [["작년", 20, "c"], ["올해", 62, "b"], ["2030 목표", 1149, "a"]]}, "nums": [["5~25", "㎛", "막 두께", 1], ["1억 6,000만", "㎡", "2차 원단 라인 연 생산 (내년 2분기 가동 시)"], ["4→7", "개", "코팅 라인"], ["26.3", "%", "2030년 목표 영업이익률 (업체 목표)"]], "src": "전자신문 2026-10-22 (다음 뉴스 원문 열람)", "grade": "확인"}, {"tm": "중 · 11.19", "name": "南山智尚 (난산즈상)", "co": "중국 · 上海证券报·中国证券网 · 2026-11-19", "title": "양모·아마·재조합 거미실 단백질 원색 원단 '蛛络', 상하이 기능성 섬유 전시회 지속가능 적용상", "q": "거미줄 단백질을 섞은 신섬유 원단이 중국 원단사 전시에서 상을 받았다.", "hl": ["거미줄"], "pts": ["<b>무엇이 새로운가:<\/b> 원단 蛛络은 양모·아마·재조합 거미실 단백질을 섞은 원색(염색하지 않은) 원단으로, '优秀可持续应用奖(우수 지속가능 적용상)'을 받았다. 이 회사는 이 전시회에 처음 참가했다.", "<b>제품:<\/b> 호주산 메리노 양모에 나일론 장섬유·UHMWPE(초고분자량 폴리에틸렌)를 섞은 운동·아웃도어 원단 라인도 함께 소개했다.", "<b>숫자:<\/b> 혼용률·중량·시험 수치는 기사에 없다. 전시회는 11월 18~19일 상하이 세계박람회 전시장에서 열렸다.", "<b>고객 반응:<\/b> 전시 단계라 해당 없음. 수상 목록 공식 페이지는 찾지 못했다.", "<b>우리에게:<\/b> 직접 경쟁은 아니지만 단백질계 신섬유가 원단 전시에 올라온 신호다. 피부 친화 소재 감시 목록에 올린다."], "nums": [["3", "종", "섞은 섬유 (양모·아마·재조합 거미실 단백질)", 1], ["2", "일", "상하이 기능성 섬유 전시회 (11/18~19)"]], "src": "上海证券报·中国证券网 2026-11-19 (원문 열람) · 전시 일정은 공식 사이트 공지(열람)", "grade": "확인"}, {"tm": "중 · 11.18", "name": "케이비엘러먼트", "co": "한국 · 헬로티 · 2026-11-18 14:47", "title": "그래핀 마스터배치를 섬유에도 — 공정 30단계를 5단계로", "q": "그래핀을 싸게 많이 만들어 섬유·플라스틱에 섞겠다는 업체 계획이다.", "hl": ["그래핀을", "싸게"], "pts": ["<b>무엇이 새로운가:<\/b> 상압 플라즈마 박리로 그래핀 제조 공정을 30단계에서 5단계로 줄였다고 한다. 섬유·플라스틱에 섞는 알갱이(마스터배치)로 공급하고, 신발 소재는 글로벌 스포츠 브랜드와 내년 제품이 예정돼 있다.", "<b>숫자:<\/b> 연 최대 21톤 양산 기반, 공급가 '최대 10분의 1 수준' 목표, 등록 특허 약 55건, 시리즈 B 140억 원, 해양 부표 무게 약 20% 감소.", "<b>마케팅:<\/b> 그래핀 냉감·항균 원단은 청호나이스 매트리스(8월)처럼 침구에서 먼저 쓰이고 있다.", "<b>고객 반응:<\/b> 속옷 적용 사례·시험서는 없다. 모두 업체 주장이다.", "<b>우리에게:<\/b> 냉감·항균 광고 문구 경쟁이 그래핀으로 번질 수 있다. 소재 업체에 항균(KS K 0693 등) 시험 성적서를 먼저 요구하는 기준을 정해 둔다."], "bars": {"t": "그래핀 제조 공정 단계 수 (업체 주장)", "u": "단계", "rows": [["기존", 30, "c"], ["새 공정", 5, "a"]]}, "nums": [["21", "톤", "연 최대 양산 기반", 1], ["55", "건", "등록 특허 (약)"], ["140", "억 원", "시리즈 B 투자"], ["20", "%", "해양 부표 무게 감소 (약)"]], "src": "헬로티 2026-11-18 (원문 열람)", "grade": "확인"}, {"tm": "중 · 11.17", "name": "BCI (Better Cotton)", "co": "국제 · TEXtalks · 2026-11-17 발표 · 11-19 보도", "title": "추적 가능한 BCI 면 2025-26년 33,000톤, 전년보다 43.5% 증가", "q": "면화가 어디서 왔는지 따라갈 수 있는 면이 2023년 11월 90톤에서 시작해 33,000톤이 됐다.", "hl": ["따라갈", "33,000톤이"], "pts": ["<b>무엇이 새로운가:<\/b> 추적 프로그램은 2023년 11월 90톤으로 시작해 지금 16개국, 브랜드·리테일러 92곳이 쓴다. 2025년 10월 도입한 소비자용 면 라벨은 17개 회원·9개국이 쓰고 제품 단위 주장 154건이 승인됐다.", "<b>숫자:<\/b> 2025-26년 33,000톤, 전년 약 "r": "① 코오롱스포츠 · ② 에너에버", "who": "4본부"}, {"k": "[마케팅] 항균·냉감 문구는 시험 성적서 있는 것만", "p": "우선", "d": "상세페이지·광고의 항균·냉감 문구는 시험 성적서(항균 KS K 0693 등)가 있는 것만 쓴다. 그래핀 같은 신소재 이름은 근거를 확보한 뒤에만 넣는다.", "r": "④ 케이비엘러먼트", "who": "2본부 · 4본부"}, {"k": "[제품] 야간용 안감에 온도 조절 소재 후보 문의", "p": "검토", "d": "수면·야간용 요실금·생리팬티 안감에 쓸 수 있는 온도 조절 소재를 알아본다. 공급 가능 여부와 세탁 내구성부터 묻고, 효과 문구는 시험값이 나온 뒤에만 쓴다.", "r": "⑦ 이브자리", "who": "4본부"}, {"k": "[원단 시험] 발수 원사 사양서·PFAS 문구 문의", "p": "검토", "d": "Unifi Resist2O Pro의 사양서와 PFAS 관련 문구를 문의한다. 얇은 방수층 안감 후보로만 감시하고, 사양이 나오기 전엔 시험하지 않는다.", "r": "⑥ Unifi", "who": "4본부"}, {"k": "[마케팅] '추적 가능한 면' 문구 사용 가능성 확인", "p": "검토", "d": "면 원단 공급처에 BCI 추적 참여 여부를 확인한다. 참여하고 있으면 상세페이지에 원산지 추적 문구를 쓸 수 있는지 근거 자료를 받는다.", "r": "⑤ BCI", "who": "2본부 · 4본부"}, {"k": "[원단 시험] 11/25 소싱데이·11/26~27 나우 인 대구에서 니트 샘플 받기", "p": "우선", "d": "두 행사에서 대구 원단·봉제 업체 연락처를 모으고 속옷용 니트 샘플을 요청한다. 받은 샘플은 같은 조건으로 흡수 시간·수축률을 시험해 후보표에 올린다.", "r": "⑩ KTDI", "who": "4본부"}, {"k": "[가격 행사] 원단 견적은 여러 곳 비교", "p": "유지", "d": "대구 직물업 침체(11/21 소식)로 협상 여지가 있으니 면사·재생 폴리 원단 견적을 여러 곳에서 받아 비교한다. 원료 시세는 견적 시점마다 다시 확인한다.", "r": "⑩ KTDI · 가격표 참고", "who": "4본부"}], "media": {"headline": "소재 발표 단계라 행사 다시보기는 없어, 흡한속건·발수·라이오셀·바이오 스판덱스·흡수 시험을 설명하는 영상 7편을 붙였습니다", "videos": [{"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo", "len": "길이 미확인", "note": "Dry Guy Waterproofing · 발수 가공(DWR)이 무엇인지 (소식 ①②⑥ 이해용)"}, {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0", "len": "길이 미확인", "note": "KATRI시험연구원(시험기관) · 흡한속건 시험 방법 (2020년 기준)"}, {"title": "[품질] 스포츠 의류의 기능성, 흡습, 속건?!", "url": "https://www.youtube.com/watch?v=roj9MmUZWIQ", "len": "길이 미확인", "note": "롯데홈쇼핑 바로알기 · 흡습속건을 소비자 눈높이로 설명"}, {"title": "[Made In Korea] 휴비스, 초경량 흡한속건 나일론 소재인 '휘젤(Whicel)' 선보여", "url": "https://www.youtube.com/watch?v=iuB4eDdwREc", "len": "길이 미확인", "note": "AVING NEWS · 국내 초경량 흡한속건 나일론 소개"}, {"title": "[아크테릭스] 페이징원단 수분 흡수건조력 테스트 - Phasic Material Water Drop", "url": "https: ", "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "흡한속건", "easy": "땀을 빨리 빨아들이고 빨리 마르는 성능.", "why": "속옷·팬티 겉감의 기본 기능이다(소식 ⑩ 샘플 요청 대상).", "video": {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0"}}, {"term": "마스터배치", "easy": "첨가물을 진하게 섞은 알갱이. 섬유·플라스틱을 만들 때 넣는다.", "why": "그래핀을 섬유에 넣는 방식이다(소식 ④)."}, {"term": "이중수축사(BSY)", "easy": "열을 받으면 수축 정도가 달라 부풀어 오르는 실.", "why": "부드럽고 폭신한 촉감을 낸다(소식 ⑧)."}, {"term": "재조합 거미실 단백질", "easy": "거미줄 단백질을 미생물로 만들어 섬유에 쓰는 것.", "why": "피부 친화 신소재로 감시할 대상이다(소식 ③)."}, {"term": "추적 가능한 면(Traceable BCI Cotton)", "easy": "면화가 어디서 났는지 단계별로 따라갈 수 있는 면.", "why": "'원산지 추적' 문구를 쓸 근거가 된다(소식 ⑤)."}, {"term": "열 흡수·방출 소재", "easy": "체온이 높으면 열을 저장하고 낮으면 내놓는 소재.", "why": "야간용 안감 차별 포인트 후보다(소식 ⑦)."}, {"term": "라이오셀(텐셀)", "easy": "나무 펄프로 만든 부드러운 셀룰로오스 섬유.", "why": "속옷 안감·피부 친화 소재다.", "video": {"title": "The TENCEL(tm) Lyocell story - 3 of 5 The Process", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4"}}, {"term": "바이오 스판덱스(regen BIO)", "easy": "사탕수수 원료를 쓴 신축 소재.", "why": "속옷 허리·다리 밴드의 신축 소재 후보다.", "video": {"title": "regen BIO, For a Better Tomorrow (Ep5. Comfort, Sustainability, and You)", "url": "https://www.youtube.com/watch?v=uOfmKMrnKG0"}}]}</script>
