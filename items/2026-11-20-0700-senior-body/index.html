<script id="item-data" type="application/json">{"id": "2026-11-20-0700-senior-body", "date": "2026-11-20", "slot": "07:00", "topic": "시니어 건강·몸", "type": "학회 기자간담회", "title": "대한이과학회 노인 난청 기자간담회 정리", "subtitle": "시니어 건강·몸 · 노인 난청·보청기 지원 · 국내 발표 5개 · 해외 5개", "event": {"name": "대한이과학회 기자간담회 — 노인 보청기 급여 확대·지원 시범사업 촉구", "host": "대한이과학회 (보충: 서울시의회 행정사무감사, 메디푸드연구회 심포지엄)", "when": "2026.11.06(금) (시작·종료 시각 비공개)", "where": "서울드래곤시티 · 해외: 미국·캐나다·네덜란드·중국·일본", "theme": "난청은 흔한데 보청기는 비싸다, 작은 시범사업부터"}, "headline": "노인 난청은 흔한데 보청기 착용률은 4.7%에 그친다", "hl": ["흔한데", "4.7%에"], "summary3": [["난청은 흔한데 보청기는 드물다.", "학회 자료로 중등도 이상 난청은 70대 26.3%, 80대 52.8%. 보청기 착용률은 2012년 약 2.1%에서 2022년 약 4.7%로 늘었을 뿐이고, 사지 않는 가장 큰 이유는 비용이다."], ["장애 등록 기준 60dB 아래가 지원 사각지대다.", "학회는 1~2년 안에 작은 시범사업부터 시작하자고 했다. 서울은 구로·강서·양천구만 자체 지원하고, 난청 여성의 낙상 경험률은 10.7%로 난청 없는 여성 4.3%보다 높았다."], ["해외는 값을 낮추거나 보조로 문턱을 낮춘다.", "미국은 메디케어가 보청기를 빼는 대신 처방 없이 사는 제품이 $297부터 나왔고, 네덜란드는 보청기 사용자 82%가 환급을 받았고 93%가 삶의 질이 나아졌다고 답했다. 중국 60세 이상 착용률은 10% 미만."]], "cases": [["계통", "필요 제품", "우리 보유 여부"], ["귀·듣기 (노인성 난청)", "보청기, 청각 보조 이어폰, 청력검사 연계", "빈자리 — 보청기는 의료기기라 다루려면 허가·유통 요건부터 확인"], ["균형·낙상 (난청과 함께 나타남)", "고관절보호대, 미끄럼 방지 용품, 안전손잡이", "보유 — 고관절보호대(복지용구 급여 등재 합격, 2027년 3월 급여 판매 예정)"], ["삼킴 (연하곤란)", "점도증진제, 삼키기 쉬운 연하식", "빈자리 — 우리 제조 영역(의료기기·속옷) 밖"]], "shift": {"from": "2.1%", "to": "4.7%", "cap": "보청기 착용률 2012년 약 2.1% → 2022년 약 4.7% (대한이과학회 자료) — 늘었지만 80대 절반 넘게 중등도 이상 난청인 것에 비하면 아주 낮다"}, "chart": {"t": "난청은 흔한데 보청기는 드물다 (%, 대한이과학회 자료)", "u": "%", "rows": [["80대 중등도 이상 난청", 52.8, "a"], ["70대 중등도 이상 난청", 26.3, "b"], ["보청기 착용률(2022)", 4.7, "c"]]}, "keynums": [["52.8", "%", "80대 중등도 이상 난청(학회 자료)"], ["4.7", "%", "보청기 착용률(2022, 2012년 약 2.1%)", 1], ["10.7", "%", "난청 여성 낙상 경험률(난청 없는 여성 4.3%)", 1], ["60", "dB", "청각장애 등록 기준 — 이 아래는 지원 사각"]], "overviewNote": "숫자 출처: 의학신문 간담회 기사(11.06)와 뉴스핌 서울시의회 행정사무감사 기사(11.12). 간담회 발표자료·다시보기 영상은 찾지 못해 기사 기준입니다. 삼킴 계통은 같은 날 열린 메디푸드 심포지엄의 사전 안내 기사로만 정리했습니다. 기사 본문의 행사명 표기('제35차 폴리처학회 기자간담회')는 원문 오타로 보여 대한이과학회 기자간담회로 적었습니다.", "sectionLabel": "몸의 변화", "sections": [{"tm": "귀·듣기", "name": "귀·듣기 (노인성 난청)", "co": "중등도 이상 난청 70대 26.3% · 80대 52.8% (학회 자료)", "title": "난청은 흔한데 보청기는 드물다", "q": "중등도 이상 난청은 80대의 절반이 넘지만 보청기 착용률은 4.7%에 그친다.", "hl": ["4.7%에"], "pts": ["<b>무엇이 바뀌나:<\/b> 나이 들며 양쪽 귀가 서서히 잘 안 들린다(노인성 난청). 질병관리청 분류로 청력역치 26~40dB은 경도, 41~55dB은 중등도이고, 41dB 이상을 중등도 이상으로 본다.", "<b>얼마나 흔한가:<\/b> 학회 자료로 중등도 이상 난청은 70대 26.3%, 80대 52.8%. 질병관리청 자료(서울시의회 인용)로는 70대 이상 남성 52.9%·여성 40.7% — 집단·기준이 달라 직접 비교는 안 된다.", "<b>보청기 착용:<\/b> 2012년 약 2.1% → 2022년 약 4.7%. 최병윤 공보이사는 \"그동안 혜택을 충분히 받지 못했던 노인들을 위해 정부의 보청기 지원 등을 확대하려는 노력을 기울이고 있다\"고 했다.", "<b>생활 불편:<\/b> 대화가 어려워지고, 간담회·행정사무감사 모두 난청을 낙상·치매·우울과 이어진 건강 문제로 다뤘다.", "<b>필요한 제품:<\/b> 보청기, 보청기로 안 되는 고도 난청엔 인공와우. 최병윤 공보이사는 첨단 치료(인공와우·유전자치료)와 함께 기존 보청기·인공와우 혜택을 더 많은 환자에게 넓히자고 했다.", "<b>급여 복지용구:<\/b> 장기요양 복지용구 품목이 아니다. 청각장애 등록 기준(60dB)에 들어야 보조기기 지원을 받는다.", "<b>우리 회사:<\/b> 빈자리 — 보청기는 의료기기라 다루려면 허가·유통 요건부터 확인해야 한다."], "bars": {"t": "중등도 이상 난청과 보청기 착용률 (%, 대한이과학회 자료)", "u": "%", "rows": [["80대 난청", 52.8, "a"], ["70대 난청", 26.3, "b"], ["보청기 착용 2022", 4.7, "c"], ["보청기 착용 2012", 2.1, "c"]]}, "nums": [["26.3", "%", "70대 중등도 이상 난청"], ["52.8", "%", "80대 중등도 이상 난청", 1], ["4.7", "%", "보청기 착용률(2022)", 1]], "video": {"title": "치매와 난청, 보청기에서 인공와우까지_서울아산병원 박홍주 교수", "url": "https://www.youtube.com/watch?v=HUfVpdsO31I"}, "src": "의학신문 11.06 (최병윤 공보이사 발언·학회 자료) · 뉴스핌 11.12 (질병관리청 자료 인용) · 질병관리청 국가건강정보포털(난청 분류)", "grade": "확인"}, {"tm": "귀·듣기", "name": "귀·듣기 (보청기 지원의 사각)", "co": "장애등록 기준 60dB 미만 · 저소득 난청 노인", "title": "작은 시범사업부터 시작하자", "q": "1~2년 안에 작은 규모로나마 시작된다면 이후에는 널리 확산될 수 있을 것입니다.", "hl": ["작은", "규모로나마"], "pts": ["<b>가장 큰 벽:<\/b> 보청기를 사지 않는 가장 큰 이유는 비용이다(문인석 관리이사).", "<b>사각지대:<\/b> 장애등록 기준 60dB에 못 미치는 경도·중등도 난청은 지원 밖이다. 김경우 서울시의회 보건복지위원장은 저소득 난청 노인이 지원 사각에 놓였다고 짚었다.", "<b>학회 제안(박시내 회장):<\/b> 소규모 시범사업이라도 1~2년 안에 시작하고, 재원은 다각도로 찾자. 올해 2월 국회 정책토론회, 9월 제60회 귀의 날 포럼에서도 같은 요구를 했다.", "<b>대상 정하기(문인석 관리이사):<\/b> \"보청기 지원 대상과 규모를 정하기 위해 사회적 공감대와 학문적 근거가 함께 마련돼야 한다\". 비용효율성 검토와 함께 국가건강검진·통합돌봄에 청력검사를 잇자고 제안했다.", "<b>지역 격차:<\/b> 서울은 구로·강서·양천구만 자체 지원한다. \"같은 서울시민임에도 어느 자치구에 거주하느냐에 따라 지원 여부가 달라지는 것은 형평성의 문제\"(김경우 위원장). 서울시 복지실장은 65세 이상 기초생활수급자·차상위 난청 진단 어르신을 대상으로 내년 통합돌봄 특화사업비 활용을 검토한다고 답했다.", "<b>진료 기반(구자원 이사장):<\/b> 전공의 수련시간 단축과 지도전문의 감소로 이과 분야 기반이 약해진다고 우려했다. \"선수층이 두꺼워야 학문이 발전하는데 지금은 그 층이 상당히 얇아졌다\".", "<b>우리 회사:<\/b> 직접 제품은 없다. 다만 '시범사업 → 확대'로 새 지원이 열리는 경로는 고관절보호대 급여 등재처럼 지켜볼 자리다."], "shift": {"from": "주 80시간", "to": "주 72시간", "cap": "전공의 수련시간 단축(구자원 이사장) — 이과 진료·교육 기반 약화 우려"}, "nums": [["60", "dB", "청각장애 등록 기준"], ["3", "곳", "서울 자체 지원 자치구(구로·강서·양천)", 1], ["1~2", "년", "학회가 바란 시범사업 시작 시점"]], "video": {"title": "난청 환자의 청각재활 ㅣ비온뒤뜨는한양", "url": "https://www.youtube.com/watch?v=9P9E-NzHbvY"}, "src": "의학신문 11.06 (박시내·문인석·구자원 발언) · 뉴스핌 11.12 (서울시의회 행정사무감사, 11.09 추정)", "grade": "확인"}, {"tm": "균형·낙상", "name": "균형·낙상 (난청과 함께 나타남)", "co": "난청 여성 낙상 경험률 10.7% · 난청 없는 여성 4.3% (질병관리청 자료 인용)", "title": "잘 안 들리는 어르신이 넘어진 경험도 많았다", "q": "난청이 있는 여성은 넘어진 경험이 난청 없는 여성의 두 배를 넘었다.", "hl": ["넘어진", "경험이"], "pts": ["<b>숫자:<\/b> 서울시의회 행정사무감사에서 김경우 위원장이 질병관리청 자료를 인용했다. 난청 여성 낙상 경험률 10.7%, 난청 없는 여성 4.3%.", "<b>읽는 법:<\/b> 함께 나타난다는 숫자(연관)이고, 난청이 낙상의 원인이라고 단정한 것은 아니다.", "<b>생활 불편:<\/b> 주변 소리를 잘 못 들으면 위험을 늦게 알아챌 수 있다(일반 설명, 이번 기사에 원인 설명은 없음).", "<b>필요한 제품:<\/b> 넘어지지 않게 하는 쪽(미끄럼 방지 용품·안전손잡이), 넘어졌을 때를 대비하는 쪽(고관절보호대).", "<b>급여 복지용구:<\/b> 미끄럼 방지 용품·안전손잡이는 장기요양 복지용구 품목이다(세부 기준은 공단 고시 확인).", "<b>우리 회사:<\/b> 보유 — 고관절보호대(복지용구 급여 등재 합격, 2027년 3월 급여 판매 예정). 예방 쪽 용품은 빈자리."], "bars": {"t": "여성 낙상 경험률 (%, 질병관리청 자료 인용)", "u": "%", "rows": [["난청 있음", 10.7, "a"], ["난청 없음", 4.3, "c"]]}, "nums": [["10.7", "%", "난청 여성 낙상 경험률", 1], ["4.3", "%", "난청 없는 여성 낙상 경험률"]], "src": "뉴스핌 11.12 (서울시의회 행정사무감사, 질병관리청 자료 인용)", "grade": "확인"}, {"tm": "뇌·기억", "name": "뇌·기억 (난청과 치매·우울)", "co": "학회·시의원 모두 난청을 치매·우울과 이어진 문제로 다룸 (이번 조사에 숫자 없음)", "title": "듣기와 기억·마음의 연결", "q": "난청은 귀만의 문제가 아니라 고립·우울·치매와 함께 연구되는 문제다.", "hl": ["고립·우울·치매와"], "pts": ["<b>무엇이 다뤄졌나:<\/b> 간담회·행정사무감사 기사에서 난청은 낙상·치매·우울과 이어지는 건강 문제로 다뤄졌다. 치매 연구는 숫자 없이 언급만 됐다.", "<b>주의:<\/b> '보청기가 치매를 막는다'고 단정할 수 없다. 설명 영상 제목에서도 질문형으로 다룬다.", "<b>생활 불편:<\/b> 대화가 어려워 모임·통화를 피하게 되고 혼자 지내는 시간이 늘 수 있다(일반 설명).", "<b>필요한 것:<\/b> 청력검사로 일찍 알아채기, 보청기·인공와우 같은 청각 재활.", "<b>급여 복지용구:<\/b> 해당 품목 없음.", "<b>우리 회사:<\/b> 빈자리 — 제품보다 정보 콘텐츠(유튜브 정보 채널·블로그)로 다룰 수 있는 주제."], "video": {"title": "난청 치료를 위한 보청기가 치매를 예방한다고? (feat. 보청기 & 인공와우 & 중이임플란트) ㅣ이비인후과 문인석 교수", "url": "https://www.youtube.com/watch?v=bJftdw9KPWw"}, "src": "의학신문 11.06 · 뉴스핌 11.12 · 설명 영상(서울아산병원·강남세브란스병원·헬스조선)", "grade": "추정"}, {"tm": "삼킴", "name": "삼킴 (연하곤란)", "co": "65세 이상 3명 중 1명꼴 (분당서울대병원 연구를 사전 기사가 인용, 원 연구 연도 미확인)", "title": "2026 메디푸드 심포지엄이 다룬 삼킴 문제", "q": "삼키는 힘이 약해지면 음식의 되기(물성)를 맞춘 식사가 필요해진다.", "hl": ["되기(물성)를"], "pts": ["<b>행사:<\/b> 2026.11.06 메디푸드연구회(위원장 손문기 경희대 교수)의 첫 학술행사. 발표 6건, 참석 200여 명(사전 기사 기준).", "<b>세션 1 (좌장 신원선 한양대 교수):<\/b> 연하곤란 식이 관리(최수진 한양대병원 재활의학과), 국내 연구 동향(이현정 경운대), 일본 연하조정식 정책(시미즈 아키오 미에대 부속병원).", "<b>세션 2 (좌장 김범근 한국식품연구원):<\/b> 물성 기준(김연정 케어푸드과학기술연구소), 3D 푸드프린팅(구송이 KIST 강릉분원), 케어푸드 규격(유코 나카가와).", "<b>무엇이 바뀌나:<\/b> 음식·물이 잘 안 넘어가거나 기도로 들어간다. 가장 큰 합병증은 흡인성 폐렴.", "<b>필요한 제품:<\/b> 물·음료를 걸쭉하게 하는 점도증진제, 삼키기 쉬운 연하식(케어푸드).", "<b>급여 복지용구:<\/b> 식품이라 복지용구 품목이 아니다.", "<b>우리 회사:<\/b> 빈자리 — 우리 제조 영역(의료기기·속옷) 밖. 발표 내용이 담긴 후기 기사는 아직 없다."], "nums": [["6", "건", "심포지엄 발표"], ["200", "여 명", "참석(사전 기사)"]], "video": {"title": "삼킴장애(연하장애) 관련 / 가천대 길병원 재활의학과 이주강 교수", "url": "https://www.youtube.com/watch?v=jFGm0CusOkI"}, "src": "푸드투데이 11.05 (사전 기사) · 질병관리청 국가건강정보포털(삼킴장애)", "grade": "추정"}, {"tm": "해외 · 미국", "name": "미국 메디케어·OTC 보청기", "co": "미국 · Miami Herald 기사(Yahoo 게재) · 2026.07.01", "title": "메디케어는 여전히 보청기를 빼고, 처방 없이 사는 제품이 빈자리를 채운다", "q": "공공 급여가 없는 자리를 처방 없이 사는 보청기가 채운다.", "hl": ["처방", "없이"], "pts": ["<b>시장 상황:<\/b> 기본 메디케어(Part A·B)는 보청기를 아예 빼고 있다. 2026.01.01 시작을 목표로 한 보청기 급여 법안(Medicare Hearing Aid Coverage Act of 2025)은 2026년 중반까지 통과되지 않았다.", "<b>제품:<\/b> FDA가 2022년 10월 처방 없이 사는(OTC) 보청기 범주를 만들었다. 스스로 경도~중등도 난청이라고 느끼는 18세 이상 대상.", "<b>숫자:<\/b> 처방형은 2026년 한 쌍 평균 $2,694(기사에 출처 미표기).
