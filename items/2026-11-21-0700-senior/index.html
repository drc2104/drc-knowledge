 "https://www.youtube.com/watch?v=24UdXpbdeo0"}}, {"term": "경제활동참가율", "easy": "인구 가운데 일하거나 일을 찾는 사람의 비율. 이번 자료 60.9%.", "why": "시니어가 얼마나 사회 활동을 이어 가는지 보여 준다."}, {"term": "고용률", "easy": "인구 가운데 실제로 일하는 사람의 비율. 이번 자료 59.5%.", "why": "나이대별로 일하는 비율을 비교할 때 쓴다(55~64세 71.5%, 65~79세 47.8%)."}, {"term": "주된 일자리", "easy": "살면서 가장 오래 다닌 일자리.", "why": "언제, 왜 퇴직했는지 보는 기준이라 고객의 생활 변화 시점을 읽을 수 있다."}, {"term": "소득 절벽", "easy": "퇴직은 했는데 연금은 아직 안 나와 소득이 끊기는 기간(기사 표현 '소득 단절').", "why": "이 시기 시니어는 아껴 쓰는 소비를 하므로 가격 구성에 신경 써야 한다.", "video": {"title": "[자막뉴스] 소득도 연금도 '제로'...절반 이상이 휘청 / YTN", "url": "https://www.youtube.com/watch?v=86OOvRPxUy4"}}, {"term": "완전노령연금", "easy": "국민연금에 20년 이상 가입해 받는 노령연금.", "why": "연금 금액 구간이 곧 시니어의 지갑 크기다."}, {"term": "비자발적 이직", "easy": "본인 뜻과 상관없이 일자리를 그만둔 것.", "why": "재취업·교육 수요가 크고, 갑작스러운 생활 변화로 씀씀이가 줄 수 있다."}, {"term": "희망 근로 연령", "easy": "몇 살까지 일하고 싶은지의 평균. 이번 자료 73.6세.", "why": "일하는 시니어용 제품·메시지(근무 중 안심 등)의 근거가 된다."}, {"term": "에이지테크", "easy": "나이 든 사람의 생활·건강·돌봄을 돕는 기술과 제품.", "why": "우리 시니어 제품·서비스가 속한 영역이다.", "video": {"title": "新성장동력 에이지테크…생태계 조성 급선무 [초고령사회 이후 ⑬] / 머니투데이방송", "url": "https://www.youtube.com/watch?v=ym7pJ8FdqU8"}}, {"term": "은발경제", "easy": "중국에서 시니어를 위한 상품·서비스 산업 전체를 부르는 말(실버 경제).", "why": "중국은 이 이름으로 시니어 전용 매대·인증을 만든다. 중국 판로를 볼 때의 기준어다."}, {"term": "메디케어 어드밴티지", "easy": "미국 65세 이상 공공 건강보험(메디케어)을 민영 보험사가 대신 운영하는 상품.", "why": "미국 시니어 건강 시장의 절반 가까이를 민영 보험이 맡는 구조라, 한국과 판로가 다르다."}]}</script>
