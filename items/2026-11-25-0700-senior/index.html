 ⑩ 중국 국가표준", "who": "3본부(급여 등재·규제)"}, {"k": "시니어 주거 정보 콘텐츠로 유튜브 소재 넓히기", "p": "검토", "d": "주택연금·실버스테이·고령자복지주택 입주 자격처럼 시니어와 가족이 궁금해하는 주거 정보를 정보 채널 소재 후보로 올린다. 설명 영상(주택금융공사·LH·EBS)을 근거로 쓰고, 영상 끝에 집 안 안전 용품을 자연스럽게 잇는다.", "r": "① 박미선 · ⑤ 정부", "who": "1본부"}, {"k": "해외 연속 케어 단지를 수출 다음 판로 조사 목록에", "p": "유지", "d": "중국 타이캉(약 660단위, 대만구 약 5,000병상 계획)처럼 단지 하나에 고령자가 많이 모이는 곳은 소모품 수요가 한곳에 쌓인다. 당장 진출은 아니지만 일본 다음 해외 판로를 볼 때 이런 단지 운영사를 조사 대상으로 둔다.", "r": "⑨ 중국 타이캉", "who": "해외 판매 담당"}], "media": {"headline": "세미나 다시보기는 아직 없어, 시니어 주거를 쉽게 설명하는 영상 6편을 붙였습니다", "videos": [{"title": "[주택연금] 주택연금에 대한 궁금증, 해결해드립니다!(주택연금 오해와 진실)", "url": "https://www.youtube.com/watch?v=70wkRRjxrLg", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · 한국주택금융공사 · 주택연금에 대한 오해와 정확한 정보"}, {"title": "[HF 인사이트] 더 단단해진 노후의 버팀목, 우리나라 주택연금의 진화", "url": "https://www.youtube.com/watch?v=n46GgeAs57I", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · 한국주택금융공사 · 주택연금 제도가 어떻게 바뀌어 왔나"}, {"title": "[#LH한국토지주택공사ㅣLH게 1분만] LH, 초고령사회 대비! 실버스테이 도입", "url": "https://www.youtube.com/watch?v=n7y8G7RiECk", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · LH 한국토지주택공사 · 실버스테이(시니어주택 한 갈래) 소개"}, {"title": "\"노후 걱정 없어요\" 월 10만 원이면 무료로 밥까지 차려주는 노인 아파트 … 고령자 복지주택의 입주 자격 … 건축탐구 집", "url": "https://www.youtube.com/watch?v=3c38Y7aopLY", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · EBS 다큐 · 고령자복지주택의 구조와 입주 자격"}, {"title": "초고령 사회 대응 나선 정부, '시니어 레지던스' 공급 확대 / YTN 사이언스", "url": "https://www.youtube.com/watch?v=PlukSfTw9Dk", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · YTN 사이언스 투데이 · 정부의 시니어 레지던스 공급 확대"}, {"title": "\"문턱 낮추고 안전장치\"…남동구, 취약계층 주거 환경 개선 [인천]", "url": "https://www.youtube.com/watch?v=cUJfHWNJO0I", "len": "길이 미확인", "note": "주제 설명 영상(행사 영상 아님) · B tv 뉴스 · 문턱 없애기 등 주택 개조 사례"}], "checked": [["유튜브 검색 4회(행사명·날짜·의원 3명 이름·유튜브 한정)", "이 세미나 영상 없음 (11/25 기준)"], ["국토매일·이코노믹리뷰 기사 2건", "영상·발표자료·시간표 링크 없음"], ["국회방송·한국주택협회·의원실 채널", "직접 열어보지 못함, 다음 회차에 다시 확인"], ["CCRC·AIP 한국어 설명 영상", "믿을 만한 채널 영상 못 찾음(미국·일본 영상뿐)"]], "docs": [["국토매일 세미나 기사(2026.11.23)", "ht
