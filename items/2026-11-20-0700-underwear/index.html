시간용 언더웨어 흡수량 (자사 성인 기저귀 중 최대)"]], "overviewNote": "숫자 출처: 중앙인민방송·21경제 기사 직접 열람, 단색 자사몰 직접 열람(11.20), PR TIMES 피치존 보도자료(11.19), 파이낸셜투데이·폴리뉴스(라이프리), 신랑(징둥), 일간투데이(브랜드평판), 봉황망(都市丽人), openclassactions(캐어프리 소송). 플래텀 단색 기사는 원문이 막혀(403) 요약만 보았습니다. 캐어프리 소송(38일 전)·라이프리 출시(78일 전)는 [지난 소식]입니다. 이번 회차도 7일 안 국내 신제품 소식은 단색 외 거의 없었습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.19", "name": "중국 속옷 업계 전반", "co": "중국 · 21경제(10.31)·신랑(11.17)·중앙인민방송(11.19) 기사", "title": "속옷 '항균 A 등급' 숫자 경쟁 — 강제 표준 없음, 최고 3A인데 100A까지 표기", "q": "상품 페이지의 '10A·100A' 항균 등급은 국가 강제 표준이 없는 협회·회사 자체 숫자였다.", "hl": ["100A", "자체"], "pts": ["<b>시장 상황:<\/b> 전자상거래 속옷 상품 페이지에 '5A·7A·10A·16A·100A' 같은 항균 등급이 붙었다. 기자가 따져 보니 국가표준 GB/T 20944·GB/T 31713-2015에는 'A 등급'이 없고, 업계표준 FZ/T 73023-2006은 A·AA·AAA(최고 3A)뿐이다. 5A 이상은 단체표준(T/…)·기업표준(Q/…)에서 나온다.", "<b>숫자:<\/b> 등급은 '몇 번 빨아도 항균이 남는가'로 나눈다 — A 10회, 2A 20회, 3A 50회. 새 개정 표준은 4A·5A를 더하되 세탁 50회 기준(2028년 시행). 7A·10A·100A는 어떤 표준에도 없다. 100A를 적은 단체표준 T/CTCA 27-2025는 찾았지만 해당 상품이 이 표준을 쓰는지는 확인하지 못했다고 보도.", "<b>마케팅:<\/b> 'A가 많을수록 좋다'는 숫자 과시 광고가 문제가 됐다. 일부 상품 페이지는 근거 표준 자체를 보여 주지 않는다.", "<b>반응:<\/b> 전문가는 '높은 등급을 쫓을 필요 없이 국가 기본 안전 기준에 맞는 합격품을 자주 빨아 말리면 된다'고 조언했다. 소비자 후기 데이터는 기사에 없다.", "<b>국내와 비교:<\/b> 국내도 11/9 회차에 한국소비자원 요청으로 문구가 삭제된 사례가 있었다. 나라는 달라도 '문구 뒤에 시험 근거를 보여라'는 같은 방향이다.", "<b>우리에게:<\/b> 항균 문구를 쓸 때 시험 방법·세탁 횟수·시험 기관을 함께 적는다. 효능은 단정하지 않는다."], "bars": {"t": "중국 업계표준 항균 등급별 기준 세탁 횟수 (단위 회)", "u": "회", "rows": [["A", 10, "c"], ["2A", 20, "b"], ["3A (업계표준 최고)", 50, "a"]]}, "nums": [["3", "A", "업계표준 최고 등급"], ["100", "A", "일부 상품 페이지 표기 (표준 근거 확인 안 됨)", 1], ["50", "회", "3A 등급 기준 세탁 횟수"], ["2028", "년", "4A·5A 추가 개정 표준 시행"]], "shift": {"from": "3A", "to": "100A", "cap": "업계표준 최고 등급 → 상품 페이지 최고 표기"}, "src": "중앙인민방송(cnr.cn, 11.19, 본문 글자 일부 깨짐) · 21경제(10.31) 직접 열람 · 신랑(11.17)은 검색 요약", "grade": "확인"}, {"tm": "상 · 11.19", "name": "단색 (씨엔티테크)", "co": "한국 · 플래텀 기사(11.19) · 자사몰 dansaek.co (열람 11.20)", "title": "'생리팬티 → 성장기 → 요실금' 평생 라인 공개, 블프 중인데 베스트 8종 전부 품절", "q": "같은 고객이 첫 생리부터 중장년 요실금까지 한 브랜드를 쓰게 만드는 구성이다.", "hl": ["첫", "요실금까지"], "pts": ["<b>무엇이 새로운가:<\/b> 생리팬티(브리프·하이웨스트·오버나이트)와 생리 전후 라이너, 성장기 주니어 브라 1~3단계와 첫 생리용 구성, 중장년기 요실금 팬티로 나눴다. 국내 자체 생산, 공식 온라인몰에서 세 제품군을 따로 판다. 기사에는 가격·판매량·매출이 없다.", "<b>숫자:<\/b> 블랙프라이데이 11/2~11/30 전 품목 최대 92%, 무제한 5% 쿠폰, 신규 가입 2만 원 쿠폰팩. 브리프 32,500 → 30,875원, 오버나이트 39,500 → 37,525원, 오버나이트 3 + 브리프 3 세트 158,000 → 150,100원(1장당 약 25,017원), 주니어 브라탑(1·2단계) 29,500 → 28,025원, 하이틴 브라탑(3단계) 32,000 → 30,400원.", "<b>마케팅:<\/b> 최대 92% + 5% 쿠폰 + 가입 쿠폰을 겹쳐 걸고, 제품군을 생애 단계로 나눠 '평생 단골' 구조를 만든다. 베스트 8종이 모두 '품절' 표시라 할인보다 품절이 인기 신호로 보인다(11/11 회차와 같은 상태).", "<b>고객 반응:<\/b> 검색에 잡힌 후기 — \"나이트 타입은 데일리 타입보다 세탁 후 건조하는 데 시간이 조금 오래 걸리니\"(원문 페이지 미열람). 칭찬은 착용감·화학성분 적음, 불만은 세탁·건조 번거로움과 양 많은 날 새는 느낌.", "<b>우리에게:<\/b> 요실금 쪽 강점에 '청소년·생리' 입문 라인을 이을지 검토한다. 세트 1장당 값이 낱장 정가 합보다 약 27% 낮은 구조가 가격 비교 기준이 된다. 건조 시간 불만은 빨리 마르는 원단으로 답할 자리다."], "bars": {"t": "단색 베스트 상품 최적할인가 (자사몰 11.20, 단위 원, 전부 품절 표시)", "u": "원", "rows": [["오버나이트 3 + 브리프 3 세트", 150100, "a"], ["오버나이트", 37525, "b"], ["하이틴 브라탑 (3단계)", 30400, "c"], ["브리프", 30875, "b"], ["웜 핏 주니어 브라탑 (1·2단계)", 28025, "c"], ["메쉬 라이너 위생팬티", 21375, "c"]]}, "nums": [["92", "%", "블랙프라이데이 최대 할인 (11/2~11/30)"], ["8", "종", "베스트 상품 전부 '품절' 표시", 1], ["25,017", "원", "세트 1장당 최적할인가 (150,100 ÷ 6)", 1], ["3", "단계", "주니어 브라 성장 단계 구성"]], "video": {"title": "입기만 하면 되는 생리팬티! 단색 논샘팬티 언박싱 & 사용후기", "url": "https://www.youtube.com/watch?v=CdQjwKJ4S4o"}, "src": "단색 자사몰 직접 열람(11.20, 업체 판매 페이지) · 플래텀 '스타트업 모닝커피 1441회'(원문 403, 보조 경로 요약)", "grade": "확인"}, {"tm": "상 · 10.13 (지난 소식)", "name": "Edgewell · Essity · Johnson & Johnson · Kenvue 등", "co": "미국 · 로스앤젤레스 카운티 고등법원 소장(10.11) · openclassactions 기사(10.13)", "title": "캐어프리 팬티라이너 PFAS 소송 — Modibodi·Knix를 가진 Essity도 피고", "q": "수백 명이 팬티라이너에서 PFOA가 나왔다며 소송을 냈고, 생리팬티 PFAS 문제도 함께 다시 불려 나왔다.", "hl": ["PFOA가", "생리팬티"], "pts": ["<b>시장 상황:<\/b> 수백 명의 여성이 팬티라이너에서 PFOA(PFAS의 하나) 검출을 주장하며 개별 피해 소송을 냈다(집단소송 아님). 시험 수치는 기사에 없고 원고·환경단체 시험 인용이며, 법원은 아직 검토 전이다. 피고 누구도 책임이 확정되지 않았다.", "<b>숫자:<\/b> 노트르담 대학 100여 개 제품 선별검사에서 불소(PFAS 지표) 약 절반 검출. 2025년 재사용 제품 59개 연구에서 약 30%가 '의도적 사용' 수준(생리팬티·재사용 패드에 많음). Thinx 합의금 500만 달러, Knix 140만 달러(둘 다 잘못 인정 없이 합의).", "<b>규제:<\/b> 캘리포니아 AB 2515가 생리팬티를 포함해 의도적으로 넣은 PFAS를 금지(2025-01-01 시작). 11/6 회차의 뉴욕 A1502(12월 시행)·EU(12/19)와 같은 방향이다.", "<b>반응:<\/b> 기사 안 소비자 반응 수치는 없다.", "<b>국내와 비교:<\/b> 국내 이번 회차에는 생리팬티 PFAS 관련 새 기사가 없었다. 수출을 생각하면 미국·EU 기준이 먼저 걸린다.", "<b>우리에게:<\/b> 방수·발수층의 PFAS 불검출과 총불소(TOF) 성적서를 갖춰 '불소 무첨가' 문구의 근거로 쓴다."], "bars": {"t": "생리팬티 업체 PFAS 관련 합의금 (잘못 인정 없는 합의, 단위 만 달러)", "u": "만 달러", "rows": [["Thinx", 500, "a"], ["Knix", 140, "b"]]}, "nums": [["약 절반", "", "노트르담 대학 100여 개 제품 선별검사 불소 검출"], ["30", "%", "2025년 재사용 제품 59개 중 의도적 사용 수준 (약)", 1], ["2025", "년", "캘리포니아 생리팬티 PFAS 금지 시작"]], "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}, "src": "openclassactions.com 기사 직접 열람(10.13, 소장 내용 정리)", "grade": "확인"}, {"tm": "중 · 11.19", "name": "피치존 (PEACH JOHN, 와코루 계열)", "co": "일본 · PR TIMES 보도자료 · 11.19 (발매 11.18, 공식 몰 단독)", "title": "'노와이어 감각' 미라클브라 신작 글리터레이스 — 시리즈 누적 306만 장", "q": "한 가지 구조를 10년 동안 디자인만 바꿔 팔며 누적 306만 장을 쌓았다.", "hl": ["10년", "306만"], "pts": ["<b>제품:<\/b> 직경 1~2mm 작은 스팽글을 짜 넣은 레이스로 연말 디자인. 자체 '미라클 검 와이어'로 노와이어 같은 착용감을 내세운다(구조 설명 없음). B~F컵, 밑가슴 65·70·75, 색 3종(블랙·애시핑크·그린). 소재 혼용률은 적혀 있지 않다.", "<b>숫자:<\/b> 브라 4,490엔(세금 빼면 4,082엔), 쇼츠 1,890엔, 소그(T팬티) 1,890엔 — 세트가가 아니라 따로 판다. 시리즈 누적 306만 장(2016-10-05 ~ 2026-09-11 집계, 쇼츠 포함, 업체 주장).", "<b>반응:<\/b> 보도자료라 고객 반응은 없다.", "<b>국내와 비교:<\/b> 국내 단색이 제품군을 생애 단계로 넓히는 반면, 피치존은 한 구조를 시즌 디자인으로 오래 끌고 간다. 둘 다 '한 고객을 오래 붙잡는' 방향이다."], "bars": {"t": "피치존 미라클브라 글리터레이스 가격 (세금 포함, 단위 엔)", "u": "엔", "rows": [["브라", 4490, "a"], ["쇼츠", 1890, "b"], ["소그", 1890, "c"]]}, "nums": [["306만", "장", "시리즈 누적 (2016~2026, 업체 주장)", 1], ["4,490", "엔", "브라 1개 가격 (세금 포함)"], ["3", "색", "블랙·애시핑크·그린"]], "src": "PR TIMES 보도자료 직접 열람(업체 발표, 11.19)", "grade": "확인"}, {"tm": "중 · 11.19 (지난 소식)", "name": "LG유니참 (라이프리)", "co": "한국 · 파이낸셜투데이(9.03)·폴리뉴스(10.05) · 조선비즈 재보도(11.19, 제목만)", "title": "라이프리 '안심흡수언더웨어' — 신축 허리밴드·전면 신축 소재로 '속옷처럼'", "q": "일회용 요실금 속옷이 흡수량에 '속옷처럼 올리고 내리는' 착용감을 더해 다회용 자리로 온다.", "hl": ["속옷처럼"], "pts": ["<b>무엇이 새로운가:<\/b> 허리밴드 신축성을 높이고 앞면 전체를 신축 소재로 했다. 옆 샘 방지막, 냄새 줄임 기능. 쏘피 안심숙면팬티·이지웨어팬티도 '쓰는 상황별'로 함께 정리됐다. 출시 보도는 9/3이고 11/19 조선비즈가 다시 다뤘다(제목만 확인).", "<b>숫자:<\/b> 슬림언더웨어 500ml, 일반용 920ml, 장시간용 1,350ml(자사 성인 기저귀 중 최대). 가격·판매처·사용 평가 수치는 확인한 기사에 없다. 앞선 검색 요약의 '만족 93%'는 원문에서 찾지 못해 쓰지 않았다.", "<b>마케팅:<\/b> 흡수량 단계와 '쓰는 상황'(외출·수면·장시간)으로 고르게 한다.", "<b>고객 반응:<\/b> 기사에 없다.", "<b>우리에게:<\/b> 일회용과 같은 줄에서 비교되므로, 다회용은 흡수량 대신 착용감·경제성·세탁 뒤 성능으로 비교 자료를 만든다."], "bars": {"t": "라이프리 안심흡수언더웨어 흡수량 (업체 표기, 단위 ml)", "u": "ml", "rows": [["장시간용", 1350, "a"], ["일반용", 920, "b"], ["슬림언더웨어", 500, "c"]]}, "nums": [["1,350", "ml", "장시간용 흡수량 (자사 성인 기저귀 중 최대)", 1], ["3", "종", "흡수량 단계"]], "src": "파이낸셜투데이(9.03)·폴리뉴스(10.05) 직접 열람 · 조선비즈(11.19)는 제목만", "grade": "확인"}, {"tm": "중 · 11.01", "name": "징둥 (JD.com)", "co": "중국 · 신랑과학/이방동력 기사 · 11.01", "title": "쌍11 전반전 — 속옷·잠옷 70여 브랜드 두 자릿수 이상 성장, 일회용 속옷도 두 자릿수", "q": "중국 쌍11 속옷 성장은 일회용 속옷과 새로 들어온 상가 쪽에 몰렸다.", "hl": ["일회용", "상가"], "pts": ["<b>시장 상황:<\/b> 쌍11(10/12 20시 시작) 전반전 집계. 빅토리아 시크릿·蕉内·ubras·全棉时代·松山棉店·MUJI 등 70여 브랜드가 두 자릿수 이상 성장했다. 잠옷·홈웨어·일회용 속옷·내복도 두 자릿수 성장.", "<b>숫자:<\/b> 입점 1년이 안 된 신규 상가 70여 곳의 거래액 2배. 속옷 부분은 통계 기간이 따로 적혀 있지 않고, 티몰 속옷 전체 숫자는 아직 없다.", "<b>반응:<\/b> 기사에 소비자 반응은 없다.", "<b>국내와 비교:<\/b> 국내에서도 라이프리 같은 일회용 언더웨어가 '속옷처럼'을 내세운다. 일회용 대 다회용이 같은 자리에서 맞붙는 흐름이 두 나라에서 함께 보인다."], "nums": [["70", "여 곳", "입점 1년 미만 신규 상가 (거래액 2배)"], ["2", "배", "신규 상가 거래액", 1], ["70", "여 개", "두 자릿수 이상 성장한 속옷·잠옷 브랜드"]], "src": "신랑 재경(finance.sina.com.cn, 11.01) 직접 열람", "grade": "확인"}, {"tm": "하 · 11.04", "name": "한국기업평판연구소", "co": "한국 · 일간투데이 · 11.04 (분석 기간 10/4~11/4)", "title": "생리대 브랜드평판 11월 — 1위 시크릿데이, 4위 순수한면만 크게 올라", "q": "생리대 관심 키워드가 '유기농 커버·순면 커버'로 모였다.", "hl": ["유기농", "순면"], "pts": ["<b>무엇이 새로운가:<\/b> 28개 생리대 브랜드의 온라인 글·댓글·검색 데이터를 분석한 인기 점수. 소비자 반응 키워드는 '유기농 커버·순면 커버'.", "<b>숫자:<\/b> 데이터 3,831,829건(전월 4,676,583건보다 18.06% 감소). 1위 시크릿데이 933,034(전월비 14.79% 하락), 2위 라엘 644,473(27.61% 하락), 3위 좋은느낌 447,243(43.96% 하락), 4위 순수한면 332,330(38.36% 상승), 5위 화이트 286,865(24.26% 하락). 시크릿데이 긍정 비율 93.67%.", "<b>마케팅:<\/b> 상위 5개 중 순수한면만 올랐다. '면'을 이름에 건 브랜드다.", "<b>한계:<\/b> 일회용 생리대 중심이고 팬티형·다회용 순위가 아니다. 판매량 근거로 쓸 수 없다.", "<b>우리에게:<\/b> 다회용 소재 소개에서 '피부에 닿는 면' 설명을 앞에 둔다."], "bars": {"t": "생리대 브랜드평판지수 2026년 11월 상위 5 (단위 점)", "u": "점", "rows": [["시크릿데이", 933034, "a"], ["라엘", 644473, "c"], ["좋은느낌", 447243, "c"], ["순수한면 (38.36% 상승)", 332330, "b"], ["화이트", 286865, "c"]]}, "nums": [["38.36", "%", "순수한면 전월비 상승 (상위 5개 중 유일)", 1], ["93.67", "%", "시크릿데이 긍정 비율"], ["18.06", "%", "전체 데이터 전월비 감소"]], "video": {"title": "생리대 ✖️ 생리컵 8개월 사용해 본 후기", "url": "https://www.youtube.com/watch?v=iV12ARPlpOs"}, "src": "일간투데이 기사 직접 열람(11.04)", "grade": "확인"}, {"tm": "하 · 11.16", "name": "都市丽人 (Cosmo Lady)", "co": "중국 · 봉황망 · 11.16 (광고성 기사, 업체 주장)", "title": "'국민 내의' — 외교관 부인 모임에 거위털 보온내의 증정", "q": "속옷 회사가 외교 행사·노벨상 학자 협업으로 '기능 근거' 이야기를 만든다.", "hl": ["외교", "노벨상"], "pts": ["<b>제품:<\/b> 캐나다 북위 49° 흰 거위털을 넣은 보온 내의. 노벨상 수상 물리학자 안드레 가임 팀과 소재 응용 협업을 내세운다.", "<b>숫자:<\/b> 연구 28년, 아시아 여성 가슴 형태 데이터베이스 약 3,200만, 특허 561건, 9년 연속 판매 1위(2017~2025), 신뢰 소비자 6,300만 명 — 모두 업체 주장. 다른 기사의 2025년 온라인 거래액 숫자는 확인하지 못해 옮기지 않았다.", "<b>반응:<\/b> 광고성 기사라 고객 반응은 없다.", "<b>국내와 비교:<\/b> 국내 단색은 생애 단계 구성으로, Cosmo Lady는 국가·학자 이미지로 신뢰를 만든다. 방식만 참고하고 숫자는 근거로 쓰지 않는다."], "nums": [["3,200만", "", "아시아 여성 가슴 형태 데이터 (업체 주장)"], ["561", "건", "특허 (업체 주장)"], ["6,300만", "명", "신뢰 소비자 (업체 주장)"]], "src": "봉황망(baby.ifeng.com) 직접 열람 · 광고 성격 기사라 숫자는 전부 업체 주장", "grade": "확인"}], "flow": [{"k": "'숫자 근거' 요구가 커진다 (국내·해외 같은 방향)", "d": "중국 항균 등급 보도, 미국 PFAS 소송·주 법, 국내 11/9 회차 한국소비자원 문구 삭제 — 모두 '문구 뒤에 시험 근거를 보여라'", "who": [1, 3]}, {"k": "한 고객을 오래 붙잡는다 (국내·일본)", "d": "단색은 생리 → 성장기 → 요실금 생애 라인, 피치존은 한 구조를 10년 동안 시즌 디자인으로 바꿔 누적 306만 장", "who": [2, 4]}, {"k": "일회용과 다회용이 같은 자리에서 맞붙는다 (국내·중국)", "d": "라이프리 '속옷처럼' 신축 일회용 언더웨어, 징둥 쌍11 일회용 속옷 두 자릿수 성장. 다회용은 착용감·경제성으로 답해야 한다", "who": [5, 6]}, {"k": "블랙프라이데이 속 품절이 신호가 된다", "d": "단색 최대 92% 행사 중 베스트 8종 품절 표시. 할인율보다 재고 상태가 인기를 보여 준다", "who": [2]}, {"k": "피부에 닿는 '면'이 관심 키워드", "d": "생리대 평판 상위 5개 중 순수한면만 38.36% 상승, 키워드 '유기농·순면 커버'", "who": [7]}], "flowHeadline": "국내도 해외도 '근거 있는 숫자'와 '오래 쓰는 고객'으로 간다", "apply": [{"k": "[마케팅] 항균·흡수 문구마다 시험 방법·세탁 횟수·시험 기관을 함께 적기", "p": "우선", "d": "중국에서는 근거 없는 '10A·100A' 항균 표기가 기사로 지적됐다. 우리 요실금팬티·생리팬티 상세페이지의 항균·흡수 문구 옆에 시험 방법, 몇 번 세탁 뒤 결과인지, 시험 기관을 적는다. 효능은 단정하지 않는다.", "r": "① 중국 항균 등급 · ③ PFAS 소송", "who": "2본부 광고·콘텐츠팀 · 쇼핑몰팀"}, {"k": "[원단 시험] PFAS 불검출·총불소(TOF) 성적서와 세탁 뒤 항균 재시험", "p": "우선", "d": "미국 소송과 주 법, 뉴욕·EU 규제가 같은 방향이다. 방수·발수층의 PFAS 불검출과 총불소 성적서를 받고, 항균 시험은 여러 번 세탁한 뒤 다시 시험해 달라고 의뢰한다.", "r": "③ PFAS 소송 · ① 중국 항균 등급", "who": "4본부 제품·출시팀"}, {"k": "[제품] 요실금 라인에 '생리 입문' 라인을 잇는 생애 구성 검토", "p": "검토", "d": "단색은 첫 생리 → 성장기 브라 → 요실금 팬티를 한 브랜드로 묶었다. 우리 요실금팬티 강점은 그대로 두고, 허가 준비 중인 생리팬티와 한 브랜드 안에서 이어지는 구성이 맞는지 검토한다.", "r": "② 단색", "who": "4본부 · 2본부 쇼핑몰팀"}, {"k": "[가격 행사] 6장 세트 1장당 값을 낱장 정가와 나란히 보여 주기", "p": "검토", "d": "단색 세트는 1장당 약 25,017원으로 낱장 정가로 6장 살 때보다 약 27% 낮다. 우리 묶음 상품도 1장당 값을 상세페이지에 글자로 적어 비교하기 쉽게 한다.", "r": "② 단색", "who": "2본부 쇼핑몰팀"}, {"k": "[마케팅] 일회용 요실금 언더웨어와 다회용 비교 자료 만들기", "p": "검토", "d": "라이프리가 '속옷처럼 입는' 일회용을 1,350ml까지 낸다. 흡수량 숫자로 맞서기보다 착용감, 한 달 비용, 세탁 뒤 성능을 같은 표로 비교하는 자료를 만든다. 숫자는 시험 근거가 있는 것만 쓴다.", "r": "⑤ 라이프리 · ⑥ 징둥", "who": "2본부 광고·콘텐츠팀"}, {"k": "[제품] 한 구조를 오래 두고 시즌 색·소재만 바꾸는 시리즈 운영", "p": "검토", "d": "피치존은 한 브라 구조를 10년 동안 디자인만 바꿔 누적 306만 장을 쌓았다(업체 주장). 우리 요실금팬티도 본체 구조는 고정하고 색·겉감만 바꿔 새 상품을 내는 방식을 검토한다.", "r": "④ 피치존", "who": "4본부 제품·출시팀"}, {"k": "[원단 시험] 빨리 마르는 성질(흡한속건) 시험으로 건조 시간 불만에 답하기", "p": "검토", "d": "다회용 생리팬티 후기의 대표 불만이 '세탁 뒤 건조가 오래 걸린다'다. 우리 원단의 흡한속건 시험 결과를 받아 두고, 결과가 좋으면 상세페이지 근거로 쓴다.", "r": "② 단색", "who": "4본부 제품·출시팀"}, {"k": "[마케팅] 피부에 닿는 면 소재 설명을 앞쪽에", "p": "유지", "d": "생리대 평판에서 '순면' 브랜드만 크게 올랐고 관심 키워드가 '유기농·순면 커버'였다. 피부에 닿는 면의 소재 설명을 상세페이지 앞쪽에 둔다. 평판 점수는 판매량이 아니므로 사실 근거로 인용하지 않는다.", "r": "⑦ 브랜드평판", "who": "2본부 광고·콘텐츠팀"}], "glossary": [{"term": "항균 A·2A·3A 등급", "easy": "항균 성능이 '몇 번 빨아도 남는가'로 나눈 중국 등급. A는 10회, 2A는 20회, 3A는 50회.", "why": "숫자가 높다고 균을 더 세게 없앤다는 뜻이 아니다. 우리 항균 문구도 세탁 횟수를 같이 적어야 한다."}, {"term": "GB/T · FZ/T 표준", "easy": "중국 국가표준(GB/T)과 섬유 업계표준(FZ/T)의 번호 앞글자.", "why": "중국 시장 문구를 비교할 때 어떤 표준을 근거로 했는지 보는 기준이다."}, {"term": "단체표준·기업표준", "easy": "나라가 아니라 협회(T/…)나 회사(Q/…)가 스스로 만든 기준.", "why": "'10A·100A' 같은 숫자의 출처라 근거가 약하다."}, {"term": "PFAS (과불화화합물)", "easy": "물·기름을 튕겨 내고 잘 분해되지 않는 불소 계열 화학물질. '영원한 화학물질'로 불린다.", "why": "팬티 방수층에 쓰이면 소송·판매 금지 위험이 있다.", "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "TOF (총불소)", "easy": "시료 속 불소를 모두 합쳐 재는 시험.", "why": "'PFAS 불검출'을 말할 때 먼저 갖출 근거다."}, {"term": "DWR (내구 발수)", "easy": "겉면에 물방울이 맺혀 굴러떨어지게 하는 가공.", "why": "방수층이 아닌 겉면 가공이라도 PFAS를 썼는지 확인해야 한다.", "video": {"title": "DWR (Durable Water Repellent Explained)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "흡한속건", "easy": "땀을 빨아들이고 빨리 마르는 성질.", "why": "다회용 팬티의 '건조가 오래 걸린다' 불만을 줄이는 원단 성질이다.", "video": {"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0"}}, {"term": "흡수량 (ml)", "easy": "팬티가 받아 내는 액체의 양.", "why": "일회용은 920·1,350ml를 내세운다. 다회용은 같은 숫자로 맞서기 어려워 다른 비교 기준이 필요하다."}, {"term": "세탁 내구성", "easy": "여러 번 빤 뒤에도 성능이 남아 있는 정도.", "why": "다회용 팬티의 핵심 약속이라 시험으로 보여 줘야 한다."}, {"term": "브랜드평판지수", "easy": "온라인 글·댓글·검색 수로 만든 인기 점수.", "why": "판매량이 아니므로 사실 근거로 쓰지 않고 관심 키워드만 참고한다."}, {"term": "노와이어", "easy": "철심 없이 모양을 잡는 브라.", "why": "브라 라인 확장 때 나오는 핵심 말이다. 피치존이 '노와이어 같은 착용감'을 내세웠다."}, {"term": "생애주기 라인업", "easy": "한 고객이 나이에 따라 계속 쓸 수 있게 단계별로 짠 제품 구성.", "why": "단색이 첫 생리 → 성장기 → 요실금으로 묶었다. 우리 제품 구성 검토의 비교 대상이다."}, {"term": "쌍11", "easy": "중국의 11월 11일 전후 최대 온라인 할인 행사.", "why": "중국 속옷 수요가 어디로 몰리는지 보는 연례 숫자다."}], "glossaryHeadline": "항균 등급, 불소 시험, 흡수·건조 성질에 나오는 말을 쉽게 풀었습니다", "media": {"headline": "시장 감시라 행사 다시보기는 없어, 경쟁 제품 후기·요실금 겸용 시험·시험 방법·발수 가공 설명 영상 6편을 붙였습니다 (존재·제목·채널만 확인)", "videos": [{"title": "입기만 하면 되는 생리팬티! 단색 논샘팬티
