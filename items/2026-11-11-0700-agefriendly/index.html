"a"]]}, "nums": [["22.0", "%", "EU 65세 이상", 1], ["34.5", "%", "노년부양비"], ["44.9", "세", "중위연령"]], "src": "https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Population_structure_and_ageing", "grade": "확인"}, {"tm": "해외 · 일본", "name": "성남 고령친화기업 10곳", "co": "일본 · 아시아경제 · 2026.10.07~09 박람회(기사 10.14)", "title": "한국 기업이 도쿄 홈케어·재활박람회에서 상담 266건", "q": "같은 일본 박람회에 한국 기업이 공동관으로 나가 실제 계약까지 냈습니다.", "hl": ["공동관으로"], "pts": ["<b>시장 상황:<\/b> 성남 고령친화기업 10곳이 도쿄 홈케어·재활박람회(위 H.C.R.2026 항목)에 참가.", "<b>숫자:<\/b> 상담 266건·428억원, 현장 계약 2건·13억원, 후속 상담 172건(164억원), 추가 협의 92건(251억원). 428억원은 상담 금액이지 수출 실적이 아니다.", "<b>반응:<\/b> 검색 요약만 보았고 기사 본문은 열지 못했다.", "<b>국내와 비교:<\/b> 지자체 공동관이 일본 진출의 실제 선례다. 우리 일본 수출의 오프라인 경로 후보."], "nums": [["266", "건", "현장 상담"], ["2", "건", "현장 계약(13억원)", 1]], "src": "https://view.asiae.co.kr/article/2026101406432707996 (검색 요약만)", "grade": "추정"}], "flow": [{"k": "시장은 크지만 기술은 아직 덜 들어갔다", "d": "81조8000억원 대부분이 금융·요양·의약품이고 2024년에 줄었다. 성장은 기술 기반 전환 속도에 달림", "who": [2, 5]}, {"k": "같은 기술이 위험마다 반대로 움직인다", "d": "낙상 예방은 간병 청구를 줄이고 연금 장수리스크는 키운다. 효과 수치를 제품 효과로 옮기지 말라는 경고", "who": [4, 8]}, {"k": "수요층은 이미 준비됐다 (국내·해외 같은 방향)", "d": "한국 55세 이상 정보화 71.8%·순자산 1.04배, 중국 쇼핑몰 활성 사용자 23.91%가 은발족", "who": [3, 11]}, {"k": "접점과 데이터를 쥔 쪽이 이긴다 (국내·해외 같은 방향)", "d": "테크기업이 판매 접점을 잡으면 보험사는 하청으로 밀린다. 해외 보험사 4곳 모두 접점·데이터 확보형, 중국 결제자 74.89%는 자녀 세대", "who": [6, 7, 11]}, {"k": "낙상·목욕·배설이 제품 공통 주제", "d": "배설케어로봇·낙상 감지 센서(보고서), 배변관리 로봇(중국 문건), 좌식 샤워기·낙상 경보(수입박람회), 개호침대(일본)", "who": [5, 10, 12, 13]}, {"k": "정부가 표준·인증·가격의 틀을 짠다", "d": "중국 노인용품 표준·인증, 일본 대여가격 상한, 미국 입찰·매년 인증", "who": [10, 14, 15]}], "flowHeadline": "국내 보고서와 해외 현장이 같은 곳을 가리켰다: 접점과 데이터", "apply": [{"k": "상세페이지·광고를 '자녀 세대가 고르는 화면'으로 점검", "p": "우선", "d": "중국 쇼핑몰에서 은발 상품 결제의 74.89%는 은발족이 아닌 사람이 했다. 요실금팬티·고관절보호대 상세페이지 첫 화면이 '부모님께 사 드리는 자녀'에게도 답하는지(사이즈 고르는 법·착용 도움·배송) 점검한다. 한국 결제자 구성은 자사몰·스토어 주문 데이터로 따로 확인한다.", "r": "⑪ 타오바오·톈마오 · ③ 성장 배경", "who": "2본부 쇼핑몰팀"}, {"k": "낙상 관련 문구는 '효과 수치' 없이 생활 안전 언어로", "p": "우선", "d": "보고서는 운동의 낙상 감소는 확인했지만 센서·앱 효과는 검증하지 않았고, 이 수치를 제품 효과로 옮기지 말라고 했다. 고관절보호대 광고에 남의 연구 숫자(예: 낙상 23% 감소)를 끌어 쓰지 않고, 의료기기 광고 사전심의 기준으로 문구를 다시 본다.", "r": "④ 보험산업의 딜레마", "who": "2본부 광고·콘텐츠팀 · 3본부 급여등재·인허가팀"}, {"k": "보험사·인슈어테크를 B2B 제휴 후보로 검토", "p": "검토", "d": "간병·장기요양 담보는 낙상 예방으로 청구가 줄 수 있어 보험사가 관심을 가진다. 미국 Assured Allies처럼 계약자에게 주택 개조·낙상위험 저감 용품을 제공하는 모델에 고관절보호대·안전용품을 묶어 제안할 수 있는지 검토한다. 효과 약속이 아니라 용품 공급·교육 묶음으로.", "r": "④ 딜레마 · ⑥ 가치사슬 · ⑦ 해외 4가지 대응", "who": "3본부 기관 영업"}, {"k": "진흥원 사용성 평가·리빙랩과 고령친화우수제품 지정 일정 챙기기", "p": "검토", "d": "에이지테크 종합지원센터 5곳이 사용성 평가·생활 실증을 해 준다. 고령친화우수제품 2026년 1차 지정 공고가 7월에 있었으니 다음 공고와 고시 개정 내용을 확인해 우리 제품이 신청 대상인지 본다. 중국도 노인용품 인증제를 만드는 중이라 인증 표시의 무게가 커질 수 있다.", "r": "⑩ 중국 6개 부처 · 용어: 고령친화우수제품·사용성 평가", "who": "3본부 급여등재·인허가팀"}, {"k": "일본 진출은 박람회 공동관과 '회수·규격' 제안서로", "p": "검토", "d": "성남 고령친화기업 10곳이 H.C.R.2026 공동관에서 상담 266건·현장 계약 2건을 냈다. 일본 온라인 판매 다음 단계로 지자체·진흥원 공동관 모집을 확인하고, 일본 제조사처럼 회수·재활용·규격 설명을 넣은 일본어 제안서를 준비한다. 대여 급여 품목은 신상품 대여가격 상한 구조를 먼저 확인한다.", "r": "⑬ H.C.R.2026 · ⑰ 성남 기업 · ⑭ 후생노동성", "who": "일본 수출 담당"}, {"k": "용품 하나가 아니라 '묶음'으로 파는 길 찾기", "p": "유지", "d": "보고서는 은퇴 설계·사기 방지·재가케어·신탁을 한 범주로 묶어 보라고 했다. 복지용구 사업소·통합돌봄 창구에 낙상·배설·목욕 용품을 한 꾸러미로 안내하는 자료를 만들 수 있는지 지켜본다.", "r": "⑤ 서비스 확장 · ⑧ 결론", "who": "3본부 기관 영업"}, {"k": "중국 박람회·문건은 소싱과 경쟁 감시용으로", "p": "유지", "d": "충칭 박람회는 4만㎡·약 700곳, 수입박람회엔 일본 대기업의 목욕·낙상 제품이 나왔다. 재활보조기구·목욕용품 공급사 정보와 중국 노인용품 표준 지침 후속 발표를 분기마다 확인한다.", "r": "⑨ 충칭 박람회 · ⑩ 6개 부처 · ⑫ 수입박람회", "who": "3본부 · 4본부"}], "media": {"headline": "보고서 설명 영상은 없어, 주제를 쉽게 설명하는 영상 6편과 참고 포럼 다시보기 1편을 붙였습니다", "videos": [{"title": "노인장기요양보험 복지용구 급여이용 안내", "url": "https://www.youtube.com/watch?v=sgTPYM9v04I", "len": "3:44", "note": "주제 설명 영상(보고서 영상 아님) · 국민건강보험 · 복지용구 종류, 구입·대여 이용 방법과 유의사항(2024-09)"}, {"title": "장기요양보험제도 급여 이용 설명", "url": "https://www.youtube.com/watch?v=hEquZiaL4XA", "len": "13:28", "note": "주제 설명 영상(보고서 영상 아님) · 국민건강보험 · 장기요양 제도 전반, 재가·시설급여, 복지용구급여확인서(2023-03, 급여한도·품목은 최신 고시와 대조 필요)"}, {"title": "'에이지테크'로 실버 경제 집중 육성…'AI 돌봄로봇' 주목 [9시 뉴스] / KBS 2025.03.11.", "url": "https:/
