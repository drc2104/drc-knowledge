티·브라' 묶음에서 다룹니다. ⑤ 뷰티 이너웨어 기고는 본문을 열지 못해 '추정'입니다. 상하이 PERFORMANCE DAYS 결과는 아직 공개 전입니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.17", "name": "효성티앤씨", "co": "한국 · 국제섬유신문(11/16 입력)·TIN뉴스(11/17)·9/18 기사", "title": "바이오 BDO 공장 '연 5만 톤' 상업 가동 — 이전 기록 2.5만 톤과 다른 숫자", "q": "베트남 바이오 BDO 공장이 연 5만 톤 규모로 9월부터 상업 가동 중이라는 기사가 나왔다.", "hl": ["5만", "상업"], "pts": ["<b>무엇이 새로운가:<\/b> 베트남 바리아붕따우 푸미2 산업단지의 바이오 BDO(스판덱스 원료) 공장이 연 5만 톤 규모로 상업 가동 중이다. 미국 제노(Geno)와 기술 제휴, 원료는 브라질산 사탕수수.", "<b>숫자:<\/b> 총 투자 10억 달러(약 1조 원으로 적은 매체도 있음), 수요에 따라 연 20만 톤까지 넓힐 기반. 사탕수수 농장(약 6,000ha)·원당 공장(하루 약 3,000톤)은 검토 단계이고 투자 결정이 아니다.", "<b>출처마다 다른 숫자:<\/b> 11/16 회차는 TIN뉴스 기준 '2만5,000톤', 이번 국제섬유신문은 '연 5만 톤, 9월 상업 가동'. 단계별 증설인지 특정 제품 몫인지는 확인되지 않았다.", "<b>마케팅:<\/b> TIN뉴스(11/17)는 regen BIO를 '사탕수수 당을 발효해 만든 스판덱스'로 소개하고, 10월 출범한 유럽 바이오 기반 연합(BEA)을 언급했다. 바이오 함량 %는 기사에 없다.", "<b>고객 반응:<\/b> 원료 단계라 소비자 반응은 없다. 가격은 공개되지 않았다.", "<b>우리에게:<\/b> 속옷 신축 원단에 regen BIO를 쓴 편직물 샘플과 바이오 함량 서류(ISCC PLUS는 2027년 1분기 예정)를 먼저 요청한다. 공장 규모는 효성 공식 보도자료로 다시 확인한다."], "shift": {"from": "2.5만 톤", "to": "5만 톤", "cap": "바이오 BDO 연산 표기 (이전 기록 → 이번 기사, 기준 차이 미확인)"}, "bars": {"t": "바이오 BDO 연산 규모 표기 (만 톤)", "u": "만 톤", "rows": [["이전 기록", 2.5, "c"], ["이번 기사", 5, "a"], ["확장 기반", 20, "b"]]}, "nums": [["5만", "톤", "연산 (9월 상업 가동)", 1], ["10억", "달러", "총 투자"], ["20만", "톤", "수요에 따른 확장 기반"], ["6,000", "ha", "사탕수수 농장 (검토 단계)"]], "video": {"title": "regen BIO, For a Better Tomorrow (Ep5. Comfort, Sustainability, and You)", "url": "https://www.youtube.com/watch?v=uOfmKMrnKG0"}, "src": "국제섬유신문 82257 (열람) · TIN뉴스 32601 (열람) · 아시아타임즈 2026-09-18 (검색 요약만) — 2.5만/5만 톤 차이 이유는 미확인", "grade": "확인"}, {"tm": "중 · 11.17", "name": "프랑스 정부 (Ecobalyse)", "co": "프랑스 · Innovation in Textiles · 2026-11-17", "title": "의류 '환경비용' 점수, 브랜드 동의 없이 제3자도 게시 — 초고속 패션 부과금 최대 1벌당 12유로", "q": "프랑스에서 파는 옷은 이제 남이 매긴 환경 점수가 붙을 수 있고, 점수가 낮으면 부과금이 붙는다.", "hl": ["환경", "부과금이"], "pts": ["<b>무엇이 새로운가:<\/b> 2026-10-01부터 NGO·유통사·비교 플랫폼이 브랜드 동의 없이도 프랑스에서 파는 의류의 환경비용(옛 Eco-Score, 방법론 Ecobalyse) 점수를 계산·게시할 수 있다. 자료가 부족하면 보수적 기본값을 쓴다.", "<b>숫자:<\/b> 초고속 패션법(Law 2026-602)에서 Ecobalyse 지속성 점수 0.8 이하 제품은 추가 부과금, 2026년 최대 1벌당 12유로, 상한은 세전 판매가의 50%.", "<b>마케팅:<\/b> 다른 환경 광고를 하는 브랜드는 점수 공개가 의무다. '친환경' 문구를 쓰면 숫자도 함께 보여야 한다.", "<b>고객 반응:<\/b> 기사에 없다.", "<b>우리에게:<\/b> 국내 직접 규제는 아니지만 원단 혼용률·내구성이 점수에 들어간다. 해외 판매에 대비해 제품별 세탁 내구성·혼용률 자료를 정리해 둔다."], "nums": [["12", "유로/벌", "부과금 상한 (2026)", 1], ["0.8", "점 이하", "부과금 대상 지속성 점수"], ["50", "%", "부과금 상한 (세전 판매가 대비)"], ["10.01", "", "제3자 점수 게시 시작 (이미 시행)"]], "src": "Innovation in Textiles (2026-11-17, 열람)", "grade": "확인"}, {"tm": "중 · 10.27", "name": "중국 생태환경부 · 국가시장감독관리총국", "co": "중국 · TIN뉴스 · 2026-10-27 (표준 공표 2026-06)", "title": "섬유 폐수 배출 표준 GB 4287-2026 — 신규 시설 9월 1일 시행", "q": "염색·가공 폐수 기준이 하나로 묶이고, 물고기 알 독성 시험이 새로 들어갔다.", "hl": ["물고기", "독성"], "pts": ["<b>무엇이 새로운가:<\/b> 2012년의 4개 표준(염색·가공, 견, 모, 마)을 하나로 묶고 화학섬유 직조·산업용 섬유까지 넓혔다.", "<b>숫자:<\/b> 신규·개조·증설 시설 2026-09-01, 기존 시설 2028-01-01(지방정부 승인 시 앞당김). 물고기 알(제브라피시 배아) 독성 시험은 폐수를 6분의 1로 묽혀 26℃에서 48시간, 배아 90% 이상 생존해야 한다.", "<b>감시:<\/b> 가장 엄격히 관리하는 시설은 연 2회 이상, 그 밖은 연 1회 이상 점검한다.", "<b>고객 반응:<\/b> 기사에 없다. 가격 영향 숫자도 없다.", "<b>우리에게:<\/b> 중국 염색·가공 단가와 납기가 흔들릴 수 있다(추정). 중국산 원단을 받을 때 가공 공장의 새 기준 준수 여부를 함께 묻는다."], "table": [["대상", "시행일"], ["신규·개조·증설 시설", "2026-09-01"], ["기존 시설", "2028-01-01 (지방정부 승인 시 앞당김)"]], "nums": [["90", "%+", "물고기 알 생존 기준", 1], ["48", "시간", "독성 시험 시간 (26℃)"], ["1/6", "", "폐수 희석 비율"], ["4", "개 → 1개", "통합된 2012년 표준 수"]], "src": "TIN뉴스 32437 (2026-10-27, 열람)", "grade": "확인"}, {"tm": "중 · 11.18", "name": "휴비스", "co": "한국 · TIN뉴스 · 2026-11-18", "title": "듀라론·에코에버 LM 세계일류상품 선정, 듀라론-쿨 국내 냉감 섬유 약 70%", "q": "냉감 폴리에틸렌 섬유 듀라론-쿨이 국내 냉감 섬유 시장의 약 70%를 차지한다고 업체가 밝혔다.", "hl": ["냉감", "70%를"], "pts": ["<b>무엇이 새로운가:<\/b> 산업통상자원부 세계일류상품(KOTRA 운영)에 고성능 PE 섬유 듀라론과 화학재생 저융점 섬유 에코에버 LM이 뽑혔다.", "<b>숫자:<\/b> 듀라론은 2025년 세계 점유 약 12%로 1위, 에코에버 LM은 탄소 약 56% 감소, 듀라론-쿨은 침구·의류에 쓰이며 국내 냉감 섬유 시장 약 70%(모두 업체 주장). 휴비스 세계일류상품은 17개(현재 10 + 차세대 7).", "<b>마케팅:<\/b> 정부 인증을 신뢰 근거로 내세운다. 속옷 용도는 이번 기사에 직접 언
