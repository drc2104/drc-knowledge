ections": [{"tm": "01", "name": "온몸의 예비력(노쇠)", "co": "기대수명 83.7세 · 건강수명 65.5년 · 약 18년 차이(2024년 생명표)", "title": "노쇠에 대한 질문: 막을 수도 되돌릴 수도", "q": "노쇠는 병 하나가 아니라 몸의 예비력이 줄어든 상태다.", "hl": ["예비력이"], "pts": ["<b>무엇이 바뀌나:<\/b> 몸의 예비력이 줄어 작은 감염, 낙상, 입원 같은 자극에도 일상 기능이 크게 흔들린다(학회 기사 설명). 큰 병이 없어도 버티는 힘이 바닥난 상태를 가리킨다.", "<b>세션:<\/b> 좌장 김대열·허연. 근골격계 노쇠를 다뤘고, 노쇠에 관한 5가지 질문 가운데 '막을 수도 되돌릴 수도'가 소개됐다.", "<b>연구 투자:<\/b> 분당서울대병원 'DEF-H' 과제 사업비 175억 원(노쇠 예방 AI), 고려대 'Frailty Zero' 착수. 일찍 가려내려는 흐름이다.", "<b>생활 불편:<\/b> 입원 뒤 급격히 약해지는 부모를 보고 가족이 처음 용품을 찾기 시작한다. 5가지 이상 약을 먹는 다약제도 함께 살필 대상으로 다뤄졌다.", "<b>필요한 제품:<\/b> 약 정리·복약 용품, 보행 보조 용품 등 계통별 제품으로 나뉜다.", "<b>급여 복지용구:<\/b> 이번 조사에서 확인하지 않음.", "<b>우리 회사:<\/b> 노쇠 전용 제품은 없음(빈자리). 건강수명 뒤 약 18년이 제품 수요가 생기는 구간이라는 점을 가족 대상 콘텐츠의 출발점으로 쓸 수 있다."], "bars": {"t": "기대수명과 건강수명 (2024년 생명표, 기사 기준)", "u": "년", "rows": [["기대수명", 83.7, "b"], ["건강수명", 65.5, "a"]]}, "nums": [["약 18", "년", "기대수명과 건강수명의 차이", 1], ["175", "억 원", "DEF-H 과제 사업비(노쇠 예방 AI)"], ["5", "가지+", "다약제로 보는 약 가짓수"]], "video": {"title": "노년기 근감소증 관리ㅣ동아아산건강강좌", "url": "https://www.youtube.com/watch?v=nlsiOB8Ed3c"}, "src": "코메디닷컴 2821045 · 2813964 (요약본 경유, 원문 대조 전)", "grade": "확인"}, {"tm": "02", "name": "근육(근감소증)", "co": "시작 나이·유병률 숫자는 공개 자료에 없음 · 31일 오전 세션", "title": "노쇠와 근감소증의 평가와 중재", "q": "종아리 둘레가 32cm 미만이면 근감소증을 의심해 보라는 기준이 소개됐다.", "hl": ["32cm"], "pts": ["<b>무엇이 바뀌나:<\/b> 나이가 들며 근육량과 힘이 줄어든다. 걷기·일어서기 같은 일상 동작에 불편이 생길 수 있다.", "<b>세션:<\/b> 좌장 원장원(경희대병원 가정의학과). 임정선이 외래 포괄적 노인평가 선별, 최정연이 근거 기반 도움 방법, 신명준이 낙상 예방을 맡았다. 발표자 소속은 기사에 없다.", "<b>손쉬운 기준:<\/b> 종아리 둘레 32cm 미만이면 근감소증을 의심하라는 내용이 원장원 연구로 소개됐다. 의심해 볼 기준일 뿐 진단은 아니다.", "<b>지난 학회(참고):<\/b> 2025년 12월 제76차 추계에서 임재영(서울대)·신원철(경희대)·백은미(가톨릭대)가 근감소증 디지털 도움 방법, AI 불면증 치료, 돌봄로봇 인지 개선을 다뤘다.", "<b>필요한 제품:<\/b> 보행 보조, 근력·단백질 제품.", "<b>급여 복지용구:<\/b> 이번 조사에서 확인하지 않음.", "<b>우리 회사:<\/b> 근육 쪽 제품은 없음(빈자리). 종아리 둘레 재기는 복지용구 사업소 상담이나 콘텐츠 소재로 쓸 수 있다."], "nums": [["32", "cm", "종아리 둘레 의심 기준(미만)", 1]], "video": {"title": "근육 노화와 근감소증을 예방하는 근력 운동 | 서울대학교병원 강남센터 | 임재영 교수님", "
