le": "복지용구 대여·판매 선택제, 가격 상한, 한도, 상담원, 서류 간소화", "q": "한도 초과 실적이 적은 것이 필요가 충족됐다는 뜻은 아니다.", "hl": ["필요가", "충족됐다는"], "pts": ["<b>선택제 품목은 그대로:<\/b> 2024년도에 고정용 슬로프·보행기(보행차 제외)·단점 지팡이·다점 지팡이에 대여·구입 선택제를 넣었고, 관련 급여액은 대체로 보합. 2027년도에는 품목을 추가하지 않고 영향 분석을 이어 간다.", "<b>자료가 부족하다:<\/b> 판매 자료는 국보련에 청구를 맡기는 499개 보험자(31.7%) 분뿐. 전 보험자의 판매 실적을 모으는 체계를 만든다.", "<b>대여 가격 상한:<\/b> 3년마다 재검토하는 원칙 유지, 물가와 대여가 설정을 계속 검증. 월평균 대여 100건 미만 상품은 상한가를 재검토하지 않고 동결(사업자 사무 부담 경감).", "<b>지급 한도:<\/b> 특정복지용구 구입 같은 연도 10만 엔, 주택개수 원칙 평생 20만 엔. 한도 초과 실적이 적다는 이유로 인상안은 내지 않고, 물가 영향을 계속 조사.", "<b>전문상담원 담당 상한:<\/b> 1인 담당 이용자 평균 81명 남짓·중앙값 56명 남짓·최대 800명. 경과조치 뒤 담당 상한을 두고, 선택제 밖 대여 품목도 최소 6개월에 1번 이상 점검. 사고 위험 높은 용구부터 안전 확인 항목 표준화 검토.", "<b>서류 간소화:<\/b> 선택제 뒤 업무가 늘었다 55.4%, 늘어난 일 1위는 이용자에게 선택제 설명(90.6%). 이용자용 설명자료·점검 표준 양식을 만들어 공유한다.", "<b>위원 반응:<\/b> 가족회 시다 위원은 구입하면 이후 돌봄 관리가 끊긴다며 품목 추가에 신중, 이용자 상당수가 80세 이상·인지증이라 대면 설명을 강조. 건강보험조합연합회 이토 위원은 비용 면에서 선택제 확대 지지. 다나카 위원의 '담당 인원과 사고의 인과 근거' 질문에 후생노동성은 직접 인과는 파악 못 했다고 답했다."], "bars": {"t": "전문상담원 1인 담당 이용자 수 (명, 남짓 값)", "u": "명", "rows": [["중앙값", 56, "c"], ["평균", 81, "b"], ["최대", 800, "a"]]}, "nums": [["499", "개", "판매 자료가 있는 보험자 (전체의 31.7%)"], ["100", "건 미만", "월 대여가 이보다 적으면 상한가 동결"], ["6", "개월", "최소 점검 주기(안)", 1], ["90.6", "%", "늘어난 업무 1위 = 선택제 설명", 1]], "table": [["논점", "사무국 방향"], ["① 선택제 대상", "2027년도 품목 추가 없음, 자료 체계 정비"], ["② 대여 가격 상한", "3년 재검토 유지, 월 100건 미만 상품 동결"], ["③ 지급 한도", "10만 엔·20만 엔 유지, 물가 영향 조사"], ["④ 서비스 질", "상담원 담당 상한, 6개월 1회 점검, 안전 확인 표준화"], ["⑤ 서류·절차", "설명자료·점검 양식 표준화, 가격 인하 시 서면 안내"]], "video": {"title": "福祉用具選択制導入について解説！令和6年度制度改定 - ケアマネ専門チャンネル DiversiTV", "url": "https://www.youtube.com/watch?v=cUD_lWsk3hw"}, "src": "社会保険研究所 2026.11.24 · GemMed 2026.11.25 (자료1 PDF 본문 미열람)", "grade": "확인"}, {"tm": "자료 2", "name": "협력의료기관 3요건", "co": "후생노동성 노건국 노인보건과 (堀裕行 과장)", "title": "의료·개호 연계: 협력의료기관이 없으면 기본보수 감산", "q": "경과조치를 연장하지 않고, 준비기간 뒤 3요건을 채운 협력병원이 없으면 감산한다.", "hl": ["감산한다."], "pts": ["<b>배경:<\/b> 2024년 개정에서 개호보험시설에 3요건(급변 시 의사 상담, 진료 요청 시 진료, 입원 필요 시 원칙 수용)을 채운 협력의료기관을 정하도록 의무화. 경과조치는 2027년 3월 말까지.", "<b>사무국안:<\/b> 경과조치 연장 없음. 준비기간 뒤 미설정 시설은 기본보수 감산. 근처에 의료기관이 없거나 협의 중이면 유예. 특정시설·그룹홈은 노력의무 유지.", "<b>설정률(2026년 8월까지):<\/b> 노인보건시설 94.6%, 개호의료원 93.8%, 특별양호노인홈 90.7%, 양호노인홈 86.0%. 미설정 중 '아직 검토 안 함' 6.6~13.8%.", "<b>감염 대비는 약하다:<\/b> 신흥감염증 대응체제 확보 개호의료원 50.8%·노건 41.5%·특양 25.0%. 자치단체 중 협정 병원 목록을 시설에 준 곳 36.2%, 감염 연수 실시 12.8%.", "<b>위원 반응:<\/b> 노인보건시설협회 히가시 회장은 폐지 불가피, 일본의사회 에자와 위원은 감산은 불가피하나 준비기간을 충분히, 노인복지시설협의회 고이즈미 위원은 시설 책임이 아닌 미설정은 감산 제외를 요구."], "bars": {"t": "3요건 충족 협력의료기관 설정률 (%, 2026년 8월까지)", "u": "%", "rows": [["노인보건시설", 94.6, "a"], ["개호의료원", 93.8, "a"], ["특별양호노인홈", 90.7, "b"], ["양호노인홈", 86.0, "b"], ["특정시설", 84.1, "c"], ["인지증 그룹홈", 80.7, "c"], ["경비노인홈", 73.3, "c"]]}, "nums": [["36.2", "%", "협정 병원 목록을 시설에 준 자치단체"], ["12.8", "%", "감염 연수를 한 자치단체", 1]], "src": "GemMed 2026.11.20", "grade": "확인"}, {"tm": "자료 4", "name": "경영실태조사 결과", "co": "후생노동성 노인보건과 (堀裕行 과장) · 11/16 경영조사위원회 논의 뒤 보고", "title": "2025년도 결산: 시설 이익률 0%대, 절반이 적자", "q": "가동률 90%에도 적자라면 보수 설정의 문제다.", "hl": ["보수", "설정의"], "pts": ["<b>전체:<\/b> 수지차율(이익률) +4.3%, 전년도보다 0.4포인트 악화.", "<b>시설별:<\/b> 특별양호노인홈 1.4% → 0.7%, 개호의료원 3.5% → 2.3%, 노인보건시설 0.6% → 0.8%(소폭 상승).", "<b>방문개호 11.3%:<\/b> 좋아 보이지만 지역·규모·같은 건물 감산 여부에 따라 편차가 크다.", "<b>시설 쪽 위원:<\/b> 물가·인건비 상승을 2024년 개정이 흡수하지 못해 시설 이익률 중앙값이 0% 안팎, 절반이 적자. 기본보수 대폭 인상 요구. 에자와 위원은 2년 연속 적자면 융자 중단 위험을 경고.", "<b>노조·개호복지사회:<\/b> '율'만 보지 말고 '액'을 보라, 방문개호는 흑자여도 폭이 매우 작다.", "<b>보험자 쪽(이토 위원):<\/b> 전체는 전년 수준 플러스. 보수 인상은 이용자·현역 세대 보험료 부담이므로 강약을 둔 대응, 돌봄 기술과 인원배치 유연화를 함께."], "bars": {"t": "수지차율 2024년도 → 2025년도 (%)", "u": "%", "rows": [["특양 2024", 1.4, "c"], ["특양 2025", 0.7, "a"], ["개호의료원 2024", 3.5, "c"], ["개호의료원 2025", 2.3, "a"], ["노건 2024", 0.6, "c"], ["노건 2025", 0.8, "b"]]}, "shift": {"from": "1.4%", "to": "0.7%", "cap": "특별양호노인홈 이익률 2024 → 2025년도"}, "nums": [["4.3", "%", "전체 이익률 (0.4포인트 악화)"], ["11.3", "%", "방문개호 이익률 (편차 큼)"]], "video": {"title": "2027年の介護報酬改定はどうなる？首相の提唱から考える介護の未来 - 介護のコミミ", "url": "https://www.youtube.com/watch?v=XqTKXCVtbZY"}, "src": "GemMed 2026.11.24", "grade": "확인"}, {"tm": "자료 5", "name": "처우상황 등 조사 결과", "co": "후생노동성 · 2026년 7월 조사, 유효응답 9,219곳(55.0%)", "title": "개호종사자 평균 급여 359,710엔, 1년 새 4.9% 올라", "q": "4.9% 증가는 평가하지만 수당·일시금이 섞여 있어 기본급 인상을 따로 봐야 한다.", "hl": ["기본급"], "pts": ["<b>조사 범위:<\/b> 16,769개 시설·사업소 대상, 유효응답 9,219곳(55.0%). 이번부터 방문간호·방문재활 추가.", "<b>숫자:<\/b> 처우개선가산 취득 시설 개호종사자 평균 343,000엔(2025.7) → 359,710엔(2026.7), +16,710엔(+4.9%). 개호직원 332,000 → 348,690엔(+5.0%). 기본급 등은 +4.1%(종사자)·+4.4%(개호직원).", "<b>직종별:<\/b> 전 직종 4% 이상. 조리원 6.5%, 영양사 5.2%, 개호지원전문원·사무 5.0%, 생활상담원 4.9%, 간호직원 4.2%, 재활 직종 4.0%.", "<b>가산을 못 받는 이유:<\/b> 1위 '사무작업이 번잡'(약 4할). 임금 올린 방법은 베이스업 49.2%, 상여 40.7%, 정기승급 39.6%.", "<b>위원 반응:<\/b> 와세다대 노구치 위원은 기본급 같은 항구적 인상을 봐야 한다, 일본간호협회는 타 산업과 격차가 커 인재 유출이 이어진다고 지적. 보험자 쪽은 미취득 사업소 지원과 절차 간소화를 주문."], "bars": {"t": "처우개선가산 취득률 (%)", "u": "%", "rows": [["종전 대상 서비스", 96.1, "a"], ["거택개호지원", 74.0, "b"], ["신규 대상 전체", 70.9, "b"], ["방문간호", 69.7, "c"], ["방문재활", 54.8, "c"]]}, "nums": [["359,710", "엔", "개호종사자 평균 월급 (2026.7)", 1], ["16,710", "엔", "1년 새 오른 금액 (+4.9%)"], ["4할", "", "가산 미취득 이유 1위 '사무 번잡'"]], "video": {"title": "2027年も介護職は賃上げ！｜他産業と遜色ない処遇の実現へ - ハッピーアクトの介護チャンネル", "url": "https://www.youtube.com/watch?v=pOZ5DtpwH34"}, "src": "社会保険研究所 2026.11.16 · GemMed 2026.11.24", "grade": "확인"}, {"tm": "자료 2", "name": "마지막 시기 의사결정(ACP)·임종 돌봄", "co": "후생노동성 노인보건과 (堀裕行 과장)", "title": "특양·노건에도 모든 입소자 의사결정 지원 요구", "q": "85세 이상 비율이 오르면서 의료와 돌봄이 겹치는 마지막 시기 지원을 시설 전체로 넓힌다.", "hl": ["85세", "이상"], "pts": ["<b>배경:<\/b> 2040년경까지 고령자 수는 크게 늘지 않지만, 의료·돌봄이 함께 필요한 85세 이상 비율이 오른다.", "<b>시설 확대:<\/b> 개호의료원처럼 특별양호노인홈·노인보건시설도 원칙적으로 모든 입소자에게 ACP 지침에 따른 의사결정 지원을 하도록.", "<b>새 가산:<\/b> 개호의료원 터미널케어가산 신설(사망 퇴소 55.6%로 최다), 의료 단기입소에 임종 연계 평가 신설.", "<b>낮추거나 바꾸는 것:<\/b> 특정시설 임종개호가산(Ⅱ) 단위 인하 검토. 터미널케어매니지먼트가산 요건을 '사망일·사망 전 14일 안 2일 이상 방문'에서 '동의한 이용자 집 최소 1번 방문'으로.", "<b>위원 반응:<\/b> 특양 의무화는 인력난을 감안해 단계적으로(고이즈미). 특정시설 가산 인하는 간호 배치를 평가하는 것이라 부적절(간호협회·민간사업자·의사회)."], "nums": [["55.6", "%", "개호의료원 사망 퇴소 비율", 1], ["14", "일
