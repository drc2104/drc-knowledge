": ["선택할"], "pts": ["<b>참석:<\/b> 좌장 김경선 인구보건복지협회 회장, 김익용 원주연세의료원 교수, 오상환 건양대 교수와 발표자 4명.", "<b>정년 연장 논쟁:<\/b> 65세로 한꺼번에 늘리면 노조 없는 중소기업이 더 힘들고 청년 일자리가 줄 수 있다.", "<b>일본의 길:<\/b> 정년 연장·폐지·재고용 가운데 기업이 고르게 했다. 한국경영자총협회도 3월 일본 현지 조사를 근거로 노사 협의 방식을 요구.", "<b>한국 현실:<\/b> 실제 퇴직은 50세 전후.", "<b>인프라:<\/b> 보건·의료·요양·주거 시설의 지역 격차. 실버주택 수요는 자택 선호가 강해 불확실하다.", "<b>조용범:<\/b> \"우리나라는 자택 수요가 강해 가지고 있는 집을 증여하고 실버주택에 들어오는 것이 쉽지 않다.\"", "<b>김경선 마무리:<\/b> \"한국과 일본이 함께해 시너지를 내면 좋겠다.\""], "nums": [["50", "세 전후", "한국 실제 퇴직 나이", 1]], "video": {"title": "[글로벌K] 초고령사회 일본, 촉탁 채용하고 정년 늘리고...\"계속 일해 주세요\" / KBS 2024.01.16.", "url": "https://www.youtube.com/watch?v=knSgUIgjdiA"}, "src": "파이낸셜뉴스 현장 기사 (202611121844056151 · 202611121444376984 · 202611121844102172)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "민정부 등 6개 부처", "co": "중국 · 정부 문서(신화망 보도) · 2026.11.06", "title": "노인용품 소비를 키우는 14개 조치", "q": "임대로 판매를 대신하는 방식까지 노인용품 소비 정책에 넣었다.", "hl": ["임대로"], "pts": ["<b>제품·정책:<\/b> 11월 4일 서명, 6일 보도. 소비 장면 확대 / 공급 강화 / 서비스 혁신 / 소비 지원 4분야 14개 조치.", "<b>팔 곳 넓히기:<\/b> 노년층 전용 쇼핑몰, 약국·편의점 안 전용 구역, 온라인 노년층 소비관.", "<b>새 기술:<\/b> 몸에 입는 보조 장치(외골격), 뇌-컴퓨터 연결, 대형언어모델 응용.", "<b>파는 방식:<\/b> '임대로 판매를 대신(以租代售)', 임대와 판매를 함께. 노인용품 산업 표준과 제품 인증 제도도 검토.", "<b>숫자(검색 요약, 원문 미열람):<\/b> 민정부 관계자 발언으로 노년층 경제 2025년 9조 위안 → 2035년 30조 위안 돌파, 2026년 1월 1일부터 중등도 이상 장애 노인 요양 소비 보조 월 최대 800위안.", "<b>국내와 비교:<\/b> 한국은 복지용구 급여 고시가 중심인데, 중국은 일반 소비·임대·인증을 한 문서에 묶었다. 대여 방식과 인증 표시는 참고할 만하다."], "nums": [["14", "개", "소비 촉진 조치", 1], ["4", "분야", "장면·공급·서비스·소비 지원"], ["800", "위안/월", "요양 소비 보조 최대 (검색 요약)"]], "src": "신화망 (news.cn 2026.11.06) — 14개 조치 확인 / 시장 숫자·보조금은 중국신문망 검색 요약", "grade": "확인"}, {"tm": "해외 · 일본", "name": "다이셀", "co": "일본 · 요미우리신문 · 2026.11.18", "title": "넘어질 때 부푸는 '입는 에어백'", "q": "몸이 크게 기울면 0.1초 안에 부풀도록 만든 조끼형 에어백이다.", "hl": ["0.1초"], "pts": ["<b>제품:<\/b> 허리까지 오는 조끼형. 센서가 몸이 크게 기운 것을 알아채면 0.1초 안에 약 8cm 두께로 부풀어, 넘어질 때 충격을 줄이도록 만들었다.", "<b>숫자:<\/b> 2027년도 중 발매 목표, 히로시마대와 2026년 5월부터 임상연구. 가격·임상 결과 숫자는 기사에 없다.", "<b>반응:<\/b> 의료기관·개호시설에 먼저 공급할 계획, 넘어짐 알림 기능도 넣을 예정.", "<b>국내와 비교:<\/b> 고관절 보호(낙상 대비) 용품 영역의 '부푸는' 방식 제품. 가격이 나오면 국내 고관절보호대·낙상 대비 용품과 가격·착용 방식을 비교할 수 있다."], "nums": [["0.1", "초 안", "부푸는 시간", 1], ["8", "cm", "부푼 두께 (약)"], ["2027", "년도", "발매 목표"]], "src": "요미우리신문 (infoseek 게재, 2026.11.18)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "AARP", "co": "미국 · 보고서 발표 · 2026.06.02", "title": "2026 장수 경제 전망 (Longevity Economy Outlook)", "q": "50세 이상이 움직이는 경제가 2060년 24조 달러로 커진다.", "hl": ["24조"], "pts": ["<b>시장 상황:<\/b> 미국 50세 이상 인구의 경제활동 규모가 2024년 12.5조 달러로, 2018년보다 2조 달러 넘게 늘었다.", "<b>숫자:<\/b> 2060년 24조 달러 전망. 50세 이상 가구 소비 10.7조 달러(2차 해설), 의료 지출은 2060년까지 2배 이상, 통신·전자 지출은 2018년 이후 62% 증가.", "<b>한계:<\/b> AARP 원문 페이지가 열리지 않아(403) 검색 요약으로만 확인했다.", "<b>국내와 비교:<\/b> 한국 2030년 200조~241조 원 추정과 규모 차이가 크지만 정의가 다르다(미국은 50세 이상 전체 경제활동). 50세 이상 소비자 숫자를 해마다 내는 체계가 한국엔 약하다."], "bars": {"t": "미국 50세 이상이 움직이는 경제 규모 (조 달러)", "u": "조 달러", "rows": [["2024년", 12.5, "b"], ["2060년 전망", 24, "a"]]}, "nums": [["62", "%", "통신·전자 지출 증가 (2018년 이후)"]], "src": "AARP 보도자료 (2026.06.02, 403으로 검색 요약만)", "grade": "추정"}, {"tm": "해외 · 독일", "name": "독일 연방의회", "co": "독일 · 연방의회 1차 심의 · 2026.11.05", "title": "장기요양보험 개혁법(PNOG) 첫 심의", "q": "2027년 약 80억 유로 적자를 메우려 급여를 손보는 개혁안이 의회에 올랐다.", "hl": ["80억"], "pts": ["<b>시장 상황:<\/b> 2027년 장기요양보험 예상 적자 약 80억 유로를 메우고 보험료를 안정시키는 것이 목표. 수급자는 600만 명 이상(2030년 예상치 350만의 두 배 가까이).", "<b>숫자:<\/b> 보험료 부과 상한 월 300유로 인상, 자녀 없는 사람 할증 0.9%, 요양등급 1의 월 최대 131유로 부담 완화 수당 폐지, 2028년 급여 인상 취소·2029년부터 물가 연동.", "<b>바뀌는 구조:<\/b> 현금급여를 '부담경감 예산'에 넣고, 시설 디지털화에 연방 16억·주 4억 유로, 60세 이상 건강 위험 평가 청구권 신설.", "<b>반응:<\/b> 법안 3건 모두 보건위원회로 넘어갔고 아직 확정 아님. 여당도 수정을 약속했다.", "<b>국내와 비교:<\/b> 한국도 2027년 보험료율·수가를 정하는 중. 독일은 재정 위기로 급여를 줄이는 쪽이라 요양 용품 월 한도 같은 항목이 바뀔 수 있다."], "bars": {"t": "시설 디지털화 지원 (억 유로)", "u": "억 유로", "rows": [["연방", 16, "a"], ["주", 4, "c"]]}, "nums": [["80억", "유로", "2027년 예상 적자 (약)", 1], ["600만", "명+", "장기요양 수급자"], ["131", "유로/월", "폐지 대상 부담 완화 수당 (요양등급 1)"]], "src": "독일 연방의회 기록 (bundestag.de, 2026 kw45)", "grade": "확인"}], "flow": [{"k": "소득이 먼저, 그다음 산업", "d": "시니어가 쓸 돈이 있어야 시장이 큰다. 일본 고령 부부 월 13.3만 엔 부족", "who": [5, 4, 3, 10]}, {"k": "시설보다 살던 집", "d": "69.4%·80.4%·87.2%, 조사마다 대상은 달라도 방향은 하나", "who": [7, 8, 3, 10]}, {"k": "나이 말고 고객이 원하는 것부터", "d": "삶의 변화가 소비를 만든다. 일본 제품 그대로 수입 금지", "who": [4, 8, 7]}, {"k": "돈·규제 장벽, 국내도 해외도 손질 중", "d": "국내는 400억~600억 자기 자본·87% 인건비, 독일은 80억 유로 적자로 급여 조정", "who": [2, 9, 3, 14]}, {"k": "낙상 대비 기술, 국내·해외 같은 방향", "d": "국내 시설은 낙상 감지 센서부터, 일본은 입는 에어백, 중국은 새 기술 응용을 정책에", "who": [7, 12, 11]}, {"k": "일본이 먼저 겪은 시행착오", "d": "일본은 고용 방식을 기업이 고르게 했고, 한국은 그 실패와 성공을 함께 본다", "who": [1, 4, 5, 10]}], "flowHeadline": "모두가 같은 곳을 가리켰다: 살던 집, 그리고 그곳을 받칠 돈", "apply": [{"k": "요실금팬티 상세페이지를 '나이'가 아니라 '삶의 사건' 기준으로", "p": "우선", "d": "무라타 교수는 퇴직·입원·부모 돌봄 같은 사건이 새 소비를 만든다고 했고, 일본은 영유아 기저귀를 성인용 속옷형으로 넓혔다. 상세페이지·광고 묶음을 '퇴원 뒤', '부모 돌봄을 시작한 자녀' 같은 상황별로 나눠 문구와 사진을 다시 짠다.", "r": "④ 무라타", "who": "2본부"}, {"k": "'살던 집에서 오래 살기' 정보 영상 시리즈", "p": "우선", "d": "열에 아홉이 살던 집을 원하지만 이 개념을 아는 사람은 적다(김종훈). 정보 채널에서 집 안 낙상 대비·화장실·속옷 관리와 복지용구 급여 이용법을 쉬운 말로 묶어 낸다. 효능 단정 없이 사용법·제도 안내 중심으로.", "r": "⑧ 김종훈 · ⑦ 조용범", "who": "1본부"}, {"k": "고관절보호대 안내에 '낙상 대비 기술 지도'를 함께", "p": "우선", "d": "국내 시설은 낙상 감지 센서부터 들이고, 일본 다이셀은 입는 에어백을 의료기관·시설용으로 준비 중이다. 2027년 3월 급여 판매 전에 센서(알림)·에어백(부푸는 방식)·보호대(입는 방식)를 착용 방식과 쓰는 곳으로만 비교한 안내 자료를 만든다. 효과 비교·단정은 하지 않는다.", "r": "⑦ 조용범 · ⑫ 다이셀", "who": "3본부"}, {"k": "체인형 요양 운영사 대상 묶음 제안", "p": "검토", "d": "소유·운영 분리 논의가 커지면 여러 시설을 함께 운영하는 곳이 늘 수 있다(박준). 보험·금융 계열 운영사가 이미 정원 수백 명 단위로 시설을 늘리는 중. 여러 시설에 같이 들어가는 요실금팬티·고관절보호대 묶음 제안서 틀을 미리 만든다.", "r": "⑨ 박준 · ② 이만희 · ⑦ 조용범", "who": "3본부"}, {"k": "시설용 제품은 '치매 입소자·근처 보호자'를 기준으로", "p": "검토", "d": "한 운영사 입소자의 70%가 치매, 보호자 약 70%가 시설 근처에 산다. 시설 납품용 요실금팬티는 갈아입히기 쉬운 점을, 보호자용 안내지는 면회 때 바로 볼 수 있는 내용을 따로 만든다.", "r": "⑦ 조용범", "who": "3본부"}, {"k": "일본 판매는 '그대로 옮기기' 대신 상황별 구성", "p": "검토", "d": "일본 시니어 시장은 쪼개져 있고 연금에 기대는 가구는 쓰는 순서가 뚜렷하다. 큐텐재팬 상품 구성을 연령대가 아니라 상황(돌봄 시작·외출용 등)과 가격대로 나눠 시험한다.", "r": "④ 무라타 · ⑤ 김명중", "who": "일본 수출 담당 · 2본부"}, {"k": "해외 제도 변화 감시: 중국 임대·인증, 독일 용품 한도", "p":
