"], ["1,300", "야드", "최소 주문량", 1]], "bars": {"t": "TERNURA-T2T-D 구성 (%, 업체 표기)", "u": "%", "rows": [["울", 50, "a"], ["재생 폴리에스터", 50, "b"]]}, "src": "PERFORMANCE DAYS 제품 페이지 66786 (게시일 표기 없음)", "grade": "확인"}, {"tm": "중 · 11.05", "name": "Spinnova × Outlast Technologies", "co": "핀란드·독일 · TEXtalks 11/06 · Just-style 11/11", "title": "온도를 조절하는 셀룰로오스 섬유 공동 개발 의향서", "q": "나무 섬유에 온도 조절 물질을 더하는 시도지만 아직 시제품 전 단계다.", "hl": ["온도", "조절"], "pts": ["<b>무엇이 새로운가:<\/b> 구속력 없는 의향서. SPINNOVA 섬유에 Outlast의 상변화물질(온도 조절)과 AERSULATE 에어로젤 단열을 결합해 시험한다.", "<b>숫자:<\/b> Outlast 특허 50건 이상(업체 주장). Spinnova 공법은 녹이는 화학물질을 쓰지 않는 기계식이며, Woodspin 시험 가동은 2026년 4월부터다.", "<b>주의:<\/b> 상용 제품·물량·출시 일정은 발표하지 않았다. 다음 단계는 시제품과 세탁 내구성·열 성능 검증이다.", "<b>고객 반응:<\/b> 개발 협약이라 해당 없음.", "<b>우리에게:<\/b> 냉온감 속옷의 장기 후보다. 상품화 전이라 지금은 지켜본다."], "nums": [["50", "건+", "Outlast 특허(업체 주장)", 1]], "src": "TEXtalks (2026-11-06) · Just-style (2026-11-11)", "grade": "확인"}, {"tm": "중 · 11.11", "name": "W. L. Gore 등 (Textiles Intelligence 보고서)", "co": "미국 · Just-style", "title": "PFAS 규제로 방수투습 막이 불소 없는 쪽으로 이동", "q": "물은 막고 습기는 내보내는 막이 규제 때문에 불소 없는 재료로 옮겨 가고 있다.", "hl": ["불소", "없는"], "pts": ["<b>무엇이 새로운가:<\/b> 보고서 「Waterproof breathable fabrics: changing legislation is driving innovation」. 제조사들이 바이오 폴리우레탄·불소 없는 막으로 옮겨 가고, Gore는 불소계 ePTFE 대신 폴리에틸렌계 ePE 막을 도입했다.", "<b>숫자:<\/b> 기사에 규제 날짜·시장 수치는 없다. 겉옷 중심 기사이며 보고서 원문은 열람하지 못했다(기사 2차 요약).", "<b>마케팅:<\/b> '규제가 혁신을 이끈다'는 업계 보고서 메시지다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 요실금·흡수팬티의 방수층(폴리우레탄 필름·막)도 같은 흐름 안에 있다. 방수층 공급선에 'PFAS·PFHxA 없음' 시험성적서를 요구할 근거가 된다."], "video": {"title": "Waterproof Tech Talk with Paul | When To Wear Your Waterproof Jacket", "url": "https://www.youtube.com/watch?v=0LNcwPHSLFc"}, "src": "Just-style (2026-11-11, 보고서 원문 미열람)", "grade": "확인"}, {"tm": "중 · 11.09", "name": "Bioworks", "co": "일본 · PR TIMES (출자 실행 10/23)", "title": "식물 유래 합성섬유 PlaX에 1억 엔 넘는 출자 유치", "q": "옥수수 같은 식물에서 얻은 PLA 섬유가 투자를 받으며 의류 소재 후보로 커지고 있다.", "hl": ["PLA", "섬유가"], "pts": ["<b>무엇이 새로운가:<\/b> PLA 계열 식물 유래 섬유 PlaX에 KKT합동회사가 1억 엔 넘게 출자했다. 용도는 스포츠웨어·유니폼·팀웨어·생활용품·산업자재이며 속옷 용도 언급은 없다.", "<b>숫자:<\/b> 폴리에스터 대비 이산화탄소 장섬유 70%·단섬유 50% 감소, 면 대비 물 사용 92% 감소(원사 생산까지, 업체 주장).", "<b>마케팅:<\/b> 환경 부담 감소 수치를 앞세운 보도자료다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 앞서 대만 Men-Chuen이 재생 폴리에스터 50%·PLA 50%(152 g/㎡) 니트에 '소취·항균'을 표기한 바 있다. PLA가 속옷 소재 후보로 늘고 있다는 신호로 참고한다."], "bars": {"t": "PlaX 환경 부담 감소율 (%, 업체 주장 · 원사 생산까지)", "u": "%", "rows": [["물 사용(면 대비)", 92, "a"], ["CO₂ 장섬유(폴리에스터 대비)", 70, "b"], ["CO₂ 단섬유(폴리에스터 대비)", 50, "c"]]}, "nums": [["1억", "엔+", "출자 규모", 1]], "src": "PR TIMES (2026-11-09)", "grade": "확인"}, {"tm": "중 · 11.11", "name": "Circulose", "co": "스웨덴 · Innovation in Textiles 11/11 (Textile World·TEXtalks 11/10~11은 제목만 확인)", "title": "헌 면 옷을 되살리는 화학적 재생 공장 가동 재개", "q": "멈췄던 재생 셀룰로오스 공장이 다시 돌며 16개 브랜드가 물량을 약속했다.", "hl": ["16개", "브랜드가"], "pts": ["<b>무엇이 새로운가:<\/b> 순스발 Ortviken 공장이 상업 생산을 다시 시작했다. 16개 협력 브랜드가 물량을 약속했고, 최고경영자가 바뀌어 재무책임자 Amanda Geijer가 임시로 맡았다.", "<b>숫자:<\/b> 협력 브랜드 16개. 공장 규모 '연 60,000톤'은 Textile World·TEXtalks 제목 쪽 정보이고 Innovation in Textiles 본문에는 톤수가 없어 확인하지 못했다.", "<b>마케팅:<\/b> 브랜드 물량 약속을 앞세운 재가동 발표다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 헌 면 옷을 되살린 재생 셀룰로오스 원사가 다시 공급되는지 지켜본다. 국내로 들어오는 경로는 아직 확인하지 못했다."], "nums": [["16", "개", "물량 약속 브랜드", 1]], "src": "Innovation in Textiles (2026-11-11)", "grade": "확인"}, {"tm": "하 · 10.27", "name": "한국섬유개발연구원(KTDI)", "co": "한국 · 스마트텍스크루 재게시 (원출처 한국섬유경제신문, 연도 표기 없음)", "title": "폐현수막을 재생 폴리에스터 원사로 되돌리는 지역 순환 사업", "q": "버려진 현수막을 화학적으로 되살려 다시 실로 만드는 공급망이 지역 단위로 돌고 있다.", "hl": ["현수막을"], "pts": ["<b>무엇이 새로운가:<\/b> 경주시가 폐현수막을 모으고 → SK케미칼이 화학적으로 재생 → KTDI가 원사 제조·품질 확인 → 대한미디어·리앤생이 직조·인쇄 → 한국원자력환경공단이 구매한다. 안정적으로 공급할 원사 업체를 협의 중이다.", "<b>숫자:<\/b> 2024년 폐현수막 약 5,400톤, 재활용 33.3%. 혼용률·단가는 없다.", "<b>주의:<\/b> 재게시본 날짜가 '10월 27일'로만 적혀 있어 2026년으로 추정했다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 속옷 용도는 아니다. 화학적 재생 페트 공급망이 국내 지역 단위로 돈다는 참고 정보다."], "nums": [["5,400", "톤", "2024년 폐현수막(약)"], ["33.3", "%", "폐현수막 재활용률", 1]], "src": "스마트텍스크루 재게시 (원출처 한국섬유경제신문, 10/27 · 연도 추정)", "grade": "추정"}, {"tm": "하 · 10.29", "name": "다이텍연구원", "co": "한국 · 국제섬유신문 (지난 소식, 14일 전)", "title": "소재 실험 데이터 17,134세트와 AI 예측 모델 10개 공개", "q": "가공 레시피를 미리 예측하는 국내 연구원의 데이터와 모델을 시험 의뢰 때 써 볼 수 있다.", "hl": ["예측하는"], "pts": ["<b>무엇이 새로운가:<\/b> '2026 섬유연구자×소재데이터 아이디어 경진대회'(부산 벡스코)를 열어 16건을 받아 5건을 뽑았다. 1위는 건국대 팀의 가공제 에멀션 입자 크기 분포 연구.", "<b>숫자:<\/b> 소재 실험 데이터 17,134세트, AI 예측·최적화 모델 10개, 총상금 400만 원(연구원 발표). 서비스 주소 ai.dyetec.or.kr.", "<b>마케팅:<\/b> 연구원의 데이터 공개 행사다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 발수·흡수 가공 조건을 고를 때 이 예측 모델을 쓸 수 있는지 시험 의뢰 때 함께 묻는다."], "nums": [["17,134", "세트", "소재 실험 데이터", 1], ["10", "개", "AI 예측·최적화 모델"], ["16", "건", "경진대회 접수(5건 선정)"]], "src": "국제섬유신문 (2026-10-29)", "grade": "확인"}], "flow": [{"k": "합성섬유가 바이오·재생 원료의 '기능 원사'로 바뀐다", "d": "Fulgar Q-GEO(바이오 나일론, 흡습 강조), 일본 Bioworks PlaX(PLA), 대만 Men-Chuen PLA 혼방, Raco 바이오 나일론 니트가 같은 방향이다.", "who": [1, 7]}, {"k": "천연섬유 + 기능사 혼방 속옷 겉감", "d": "Utenos는 텐셀과 37.5 폴리에스터, BHF는 울과 재생 폴리에스터를 섞었다. 둘 다 최소 주문량을 공개해 소량 시제품 판단이 쉬워졌다.", "who": [2, 4]}, {"k": "PFAS 규제로 불소 없는 방수가 업계 표준 이야기로", "d": "Gore의 폴리에틸렌계 막과 업계 보고서가 같은 방향을 가리킨다. 앞선 회차에서 다룬 EU PFHxA 규제·불소 없는 가공제 소식과 이어진다.", "who": [6]}, {"k": "재생 원료 공급망이 다시 돈다 (국내·해외 같은 방향)", "d": "스웨덴 Circulose가 재생 셀룰로오스 공장을 다시 돌렸고, 국내에서는 KTDI·SK케미칼이 폐현수막을 재생 원사로 되돌리는 순환 사업을 돌린다.", "who": [8, 9]}, {"k": "냉온감 섬유는 아직 연구 단계", "d": "Spinnova×Outlast는 구속력 없는 의향서 수준이고 상용 일정이 없다.", "who": [5]}, {"k": "국내는 신소재보다 공급 기반·연구 소식", "d": "스판덱스 니트 수출 업체의 수상, 연구원의 소재 데이터 공개처럼 속옷에 바로 쓸 신소재보다 공급처·시험 기반 소식이 많았다.", "who": [3, 10]}], "flowHeadline": "원료를 바꾸면서 기능까지 얹는 쪽으로 간다", "apply": [{"k": "[원단 시험] 바이오 나일론 Q-GEO 샘플 요청과 '흡습 50%' 시험법 확인", "p": "우선", "d": "Fulgar에 Q-GEO 샘플을 요청하고, 흡습 50%를 어떤 표준 시험법으로 쟀는지 먼저 확인한다. 기존 나일론 겉감과 같은 조건으로 흡수 속도·건조 시간을 비교한다.", "r": "① Fulgar", "who": "4본부"}, {"k": "[원단 시험] 텐셀 혼방·울 혼방 니트를 같은 조건으로 비교", "p": "우선", "d": "Utenos 36352와 BHF TERNURA-T2T-D 샘플로 건조 시간, 세탁 후 수축, 피부 촉감을 비교한다. 두 페이지 모두 시험 수치가 없어 시험성적서와 혼용률 확인서를 함께 받는다. 상하이 전시(11/18~19) 기간에 맞춰 요청한다.", "r": "② Utenos · ④ BHF", "who": "4본부"}, {"k": "[원단 시험] 방수층에 'PFAS·PFHxA 없음' 시험성적서 요구", "p": "우선", "d": "규제로 방수 막이 불소 없는 쪽으로 옮겨 가는 흐름에 맞춰, 팬티 방수층 공급선에 PFAS·PFHxA 불검출 성적서를 요구하고 제품별로 보관한다.", "r": "⑥ Gore·보고서", "who": "4본부 · 3본부"}, {"k": "[마케팅] '불소 없는 방수층'·'흡습' 문구는 성적서가 있을 때만", "p": "우선", "d": "원료사 주장을 그대로 옮겨 쓰지 않는다. 시험성적서와 문구를 한 쌍으로 관리하고, 공개 전 광고 문구 점검을 거친다. '바이오'를 '생분해'로 바꿔 말하지 않는다.", "r": "① Fulgar · ⑥ Gore", "who": "2본부 · 4본부"}, {"k": "[제품] 면 스판덱스 니트 국내 공급 가능성 확인", "p": "검토", "d": "면 스판덱스 니트를 해외로 수출하는 국내 업체가 있다는 것이 확인됐다. 국내에서 소량으로 받을 수 있는지, 혼용률·원단 무게 자료를 받을 수 있는지 알아본다.", "r": "③ 유니아텍스", "who": "4본부"}, {"k": "[제품] PLA 혼방 원단을 소취 겉감 후보로 검토", "p": "검토", "d": "PLA 섬유가 투자를 받으며 커지고, 대만 업체는 PLA 혼방 니트에 소취·항균을 표기했다. 샘플을 받아 세탁 전후 냄새와 촉감을 보고, 효능 문구는 성적서 확보 뒤에만 쓴다.", "r": "⑦ Bioworks", "who": "4본부"}, {"k": "[원단 시험] 가공 조건 예측 모델 활용 문의", "p": "유지", "d": "발수·흡수 가공 조건을 고를 때 다이텍연구원의 AI 예측 모델을 쓸 수 있는지 시험 의뢰 때 함께 묻는다.", "r": "⑩ 다이텍연구원", "who": "4본부"}], "media": {"headline": "흡습속건 시험·누수방지 속옷 구조·텐셀·불소 없는 방수를 설명하는 영상 6편을 붙였습니다", "videos": [{"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0", "len": "길이 미확인", "note": "KATRI시험연구원(국내 시험기관) · 흡수·건조 속도를 재는 시험법"}, {"title": "[품질] 스포츠 의류의 기능성, 흡습, 속건?!", "url": "https://www.youtube.com/watch?v=roj9MmUZWIQ", "len": "길이 미확인", "note": "롯데홈쇼핑 바로알기 · 흡습·속건 원리를 쉽게 설명"}, {"title": "[아크테릭스] 페이징원단 수분 흡수건조력 테스트 - Phasic Material Water Drop", "url": "https://www.youtube.com/watch?v=3GvXW-WsYeU", "len": "길이 미확인", "note": "Arc'teryx Korea(의류 브랜드) · 물방울이 흡수·확산·건조되는 모습 시연"}, {"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=uzq4d-ks-G4", "len": "길이 미확인", "note": "Little Onion Cloth · 누수방지 속옷의 겹 구조를 뜯어 보여 줌"}, {"title": "The TENCEL(tm) Lyocell story - 3 of 5 The Process", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4", "len": "길이 미확인", "note": "Home Lenz(렌징 공식 채널인지는 확인 못 함) · 텐셀 리요셀을 만드는 공정"}, {"title": "Waterproof Tech Talk with Paul | When To Wear Your Waterproo 의해야 한다."}, {"term": "PFAS(과불화화합물)", "easy": "물과 기름을 튕기지만 자연에서 잘 분해되지 않는 불소계 화학물질 묶음.", "why": "방수층·발수 가공이 규제 대상이라 '없음'을 증명할 성적서가 필요하다(소식 ⑥).", "video": {"title": "Waterproof Tech Talk with Paul | When To Wear Your Waterproof Jacket", "url": "https://www.youtube.com/watch?v=0LNcwPHSLFc"}}, {"term": "ePTFE 막 · ePE 막", "easy": "아주 작은 구멍이 나 있어 물은 막고 습기는 내보내는 필름. ePTFE는 불소계, ePE는 폴리에틸렌계.", "why": "팬티 방수층 재료 선택지가 바뀌는 흐름이다(소식 ⑥)."}, {"term": "흡수·방수 겹 구조", "easy": "겉감·흡수층·방수층을 겹쳐 새지 않게 만든 속옷 구조.", "why": "요실금·생리팬티의 기본 구조라 원단마다 어느 겹에 쓸지 정해야 한다.", "video": {"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=uzq4d-ks-G4"}}, {"term": "상변화물질(PCM)", "easy": "열을 저장했다가 내놓아 온도를 맞추는 물질.", "why": "소식 ⑤ Outlast의 기술로, 냉온감 속옷의 장기 후보다."}, {"term": "37.5", "easy": "폴리에스터에 활성 입자를 넣어 체온·습기 조절을 내세우는 상표 기술.", "why": "소식 ② Utenos 니트의 62%가 이 소재다."}, {"term": "리요셀(텐셀)", "easy": "나무 펄프를 녹이는 용제를 다시 쓰는 방식으로 만든 부드러운 셀룰로오스 섬유.", "why": "피부에 닿는 속옷 겉감 후보다(소식 ②).", "video": {"title": "The TENCEL(tm) Lyocell story - 3 of 5 The Process", "url": "https://www.youtube.com/watch?v=Mc7K4U8y6z4"}}, {"term": "화학적 재생", "easy": "헌 섬유나 페트를 분자 단위로 녹여 다시 원료로 만드는 방식.", "why": "소식 ⑧ Circulose와 ⑨ KTDI·SK케미칼 사업이 이 방식이다."}, {"term": "스판덱스 커버링 원사", "easy": "고무줄처럼 늘어나는 실 주위를 다른 실로 감싼 원사.", "why": "면 스판덱스 니트의 기본 구조다(소식 ③)."}, {"term": "전과정평가(LCA)", "easy": "원료부터 생산·사용·폐기까지 환경 부담을 모두 따져 보는 평가.", "why": "소식 ① Fulgar의 '기후 영향 45% 낮음'이 이 평가에서 나온 업체 수치다."}, {"term": "최소 주문량(MOQ)", "easy": "업체가 한 번에 받는 최소 주문 길이나 수량.", "why": "Utenos 400 m, BHF 1,300야드처럼 소량 시제품이 가능한지 가른다."}, {"term": "g/㎡", "easy": "원단 1㎡의 무게. 두께와 보온감을 짐작하는 기준.", "why": "속옷 겉감 후보를 비교할 때 쓰는 기본 단위다."}]}</script>
