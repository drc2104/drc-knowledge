: 보도자료 기반 해설 기사·상품 페이지·검색 요약. 업체 주장은 그대로 표시했습니다. 이번 회차는 7일 안 속옷 제품 새 소식이 0건입니다(7일 안 자료는 쌍11 전체 시장 기사 1건뿐이고 속옷 언급은 없음). 그래서 30일 안 소식과 날짜를 밝힌 지난 소식 2건을 함께 넣었습니다. 일본·중국 11월 신제품은 검색으로 거의 찾지 못했고, 쿠팡은 자동 열람이 막혀 순위·후기를 읽지 못했습니다. 다음 회차 과제: 11월 12일 이후 쌍11 속옷 품목 결과, 다이오제지 원문의 실제 판매 가격, 쿠팡 순위·리뷰 수.", "sectionLabel": "소식", "sections": [{"tm": "상 · 10.21", "name": "다이오제지 × 와코루", "co": "일본 · 전국 드럭스토어·공식몰, 보도자료", "title": "속옷 회사와 함께 만든 일회용 요실금 팬티 「アテント 極うす吸水パンツ」 전국 발매", "q": "속옷처럼 보이는 일회용 요실금 팬티가 일본 전국에 나왔다.", "hl": ["속옷처럼"], "pts": ["<b>무엇이 새로운가:<\/b> 속옷 회사 와코루와 공동 개발한 여성용 팬티(엘레간트 핑크베이지)와 남성용 복서 팬티(라이트 그레이). 흡수체는 아텐트 제품 중 가장 얇다고 밝혔고, 이중 소취(W소취)와 전면 통기를 내세운다. 빨아 입는 제품이 아니라 일회용이다.", "<b>숫자:<\/b> 흡수량 140cc(두 제품 공통). M(60~95cm) 4장, L(80~110cm) 4장, 복서형은 L(80~125cm). 가격은 오픈가격으로 금액을 밝히지 않았다. 발표 9월 9일, 발매 10월 21일.", "<b>마케팅:<\/b> \"속옷처럼 보이면서 평소 행동에 안심을 더하는 새로운 선택지\"를 내세운다. 와코루 담당자는 '입어야만 하는 것'이 아니라 '스스로 고르고 싶어지는 것'을 목표로 했다는 취지로 말했다(업체 주장).", "<b>고객 반응:<\/b> 발매 3주째라 후기를 찾지 못했다.", "<b>우리에게:<\/b> 속옷 회사가 참여한 '남이 보기에 속옷' 디자인이 경쟁 기준이 된다. 샐리브는 빨아 입는 다회용이라는 차이로 맞서고, 레이스·색 같은 디자인과 남성용 라인을 검토할 근거다."], "nums": [["140", "cc", "흡수량(두 제품 공통, 업체 발표)", 1], ["4", "장", "M·L 포장 단위"]], "shift": {"from": "입어야만 하는 것", "to": "스스로 고르고 싶은 것", "cap": "와코루 담당자 발언 취지(업체 주장)"}, "src": "베스트캘린더(PR TIMES 보도자료 기반 해설 기사). 다이오제지 원문은 열람하지 못해 수치는 업체 발표 인용", "grade": "확인"}, {"tm": "중 · 10.27", "name": "그리티 감탄", "co": "한국 · 자사몰·어패럴뉴스", "title": "2026 FW 에어스윙 골프브라, 구조 이름과 원단 수치를 앞세우다", "q": "브라는 구조 이름과 원단 수치로 기능을 뜯어 보여 주는 것이 마케팅이다.", "hl": ["구조", "원단"], "pts": ["<b>무엇이 새로운가:<\/b> KLPGA 선수 10여 명과 10개월 이상 협업했다. '다이내믹 백 서포트' 구조와 라이크라 핏센스로 두꺼운 패드 없이 지지한다고 밝혔다. 등 메시와 통기 구멍을 넣었고, 함께 나온 롱팬티는 무봉제 퓨징에 안감 면 100%다.", "<b>숫자:<\/b> 원단은 라이크라 나일론 20D, 스판 19%이고 땀 흡수·건조를 내세운다. 가격은 기사에 없다. 할인은 최대 35%이며 행사 기간 날짜는 표기되지 않았다.", "<b>마케팅:<\/b> '브라데이' 행사, 20만 원 이상 구매 시 블루 파자마 팬츠 증정. 선수 협업을 근거로 내세운다(업체 보도자료).", "<b>고객 반응:<\/b> 기사에 없다.", "<b>우리에게:<\/b> 원단 혼용률과 핏 기술 이름을 상세페이지에 그대로 쓰는 방식을 참고할 만하다."], "nums": [["19", "%", "원단의 스판 비율"], ["20", "D", "라이크라 나일론 굵기"], ["35", "%", "최대 할인(기간 미표기)", 1], ["10", "개월+", "KLPGA 선수 협업 기간"]], "video": {"title": "The difference between Warp Knitting Seamless (WKS) and Weft Knitting Seamless (Santoni machines)", "url": "https://www.youtube.com/watch?v=g4P6R0zTAw0"}, "src": "어패럴뉴스(그리티 보도자료 기반이라 업체 주장)", "grade": "확인"}, {"tm": "중 · 11.09", "name": "쿠팡 판매자", "co": "한국 · 쿠팡 상품 페이지 (게시일 불명, 11.09 조회)", "title": "여성 레이스 요실금 안심팬티 4종, 21,900원이 가격 기준점", "q": "일반 팬티처럼 보이는 레이스 요실금팬티가 21,900원에 팔린다.", "hl": ["21,900원에"], "pts": ["<b>무엇이 새로운가:<\/b> 신제품 소식이 아니라 국내 가격 기준을 확인한 항목이다. '4종'이 4장 묶음인지 4가지 디자인인지 확인하지 못해 1장당 가격은 계산하지 않았다.", "<b>숫자:<\/b> 21,900원, '한 달간 200명 이상 구매' 표시. 검색 화면에 나온 내용만 확인했다.", "<b>마케팅:<\/b> 일반 팬티처럼 보이는 레이스 디자인을 내세운다(판매자 문구).", "<b>고객 반응:<\/b> 쿠팡 페이지가 자동 열람을 막아 리뷰 본문을 읽지 못했다. 해외 비슷한 제품 후기에서는 '사이즈가 작다', '많이 새면 못 잡는다'가 반복된다.", "<b>복지용구 참고:<\/b> 요실금 팬티는 복지용구 구매품목이며 연 최대 4개, 사이즈 M95·L100·XL105, 세탁은 손세탁 권장(케어링 블로그 설명).", "<b>우리에게:<\/b> 2만 원 안팎이 국내 다회용 요실금팬티의 가격 중심으로 보인다. 다만 상품 1건 기준이라 순위·리뷰 수를 확인한 뒤 판단해야 한다."], "nums": [["21,900", "원", "판매가(장수 불명)", 1], ["200", "명+", "한 달간 구매 표시"]], "src": "쿠팡 상품 페이지 검색 요약(본문 미열람)", "grade": "추정"}, {"tm": "중 · 10.06", "name": "Thinx", "co": "미국 · 공식몰·NBC Select 10월 신제품 목록", "title": "버터플라이 쇼츠, 출시 뒤 신제품 소개 목록에 오르다", "q": "생리팬티를 속옷이 아니라 운동복·겉옷으로 파는 시도다.", "hl": ["운동복·겉옷으로"], "pts": ["<b>무엇이 새로운가:<\/b> 10월 6일 출시 소식의 후속이다. NBC Select의 2026년 10월 신제품 목록에 포함됐다. Coolcore 메시에 흡수 크로치를 붙였고, 성인판에 앞서 십대판이 먼저 나왔다. Kimberly-Clark 산하 브랜드다.", "<b>숫자:<\/b> 가격 56달러, 사이즈 XS~4X, 12시간 누수 방지(업체 주장).", "<b>마케팅:<\/b> 생리팬티를 속옷이 아니라 운동복·겉옷으로 소개하고, 언론 신제품 목록으로 소개가 넓어지고 있다.", "<b>고객 반응:<\/b> 후기 집계 사이트에서 사이즈 일관성 부족, 잔여 냄새, 많은 양 흡수의 한계, 고무줄·솔기 내구성이 지적된다.", "<b>우리에게:<\/b> 사이즈를 4X까지 넓힌 점은 시니어·체형 다양화를 검토할 근거다."], "nums": [["56", "달러", "버터플라이 쇼츠 가격", 1], ["12", "시간", "누수 방지(업체 주장)"]], "video": {"title": "The ULTIMATE PERIOD UNDERWEAR REVIEW (pt 1 Thinx, Modibodi, Knix, and more!)", "url": "https://www.youtube.com/watch?v=tpBLSt0i5TY"}, "src": "PR Newswire 보도자료(검색 요약으로 확인) · NBC Select
