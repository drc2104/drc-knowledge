부 쇼핑몰팀"}, {"k": "고객 문의 AI 응대는 '기억'부터 준비", "p": "검토", "d": "한샘은 고객 응대 90% 이상을 AI가 처리한다. 쇼핑몰별 반복 문의(사이즈·사용법·배송·교환)와 답변 기록을 먼저 정리하고, 일본 판매 문의에도 같은 자료를 쓴다. 건강·효능 질문은 사람에게 넘기는 규칙을 둔다.", "r": "⑫ 센드버드", "who": "2본부 쇼핑몰팀"}, {"k": "자동 작업에 '멈춤 감지' 목표 숫자 세우기", "p": "검토", "d": "삼성은 10분 안 장애 감지 99%, 사람 개입 20% 미만을 목표로 잡았다. 매일 도는 자동 작업마다 '몇 시간 안에 멈춤을 알아챈다'는 목표를 정하고, 감시 작업 하나가 전체를 점검하는 구조를 유지한다.", "r": "⑩ 삼성전자 · ⑪ 야놀자·요기요", "who": "2본부 전략·숫자팀"}, {"k": "AI 도구별 계정·권한·월 사용 한도 장부", "p": "우선", "d": "구글은 에이전트에 자기 계정과 지출 상한을 주고, 메가존은 거버넌스·비용 통제를 함께 설계하라고 했다. 자동화용 계정은 사람 계정과 나누고, 도구마다 담당자·월 한도·접근 범위를 한 장부에 적는다. API 키는 파일에 쓰지 않는 현재 규칙을 유지한다.", "r": "㉑ Google · ⑬ 메가존 · ⑮ 당근", "who": "2본부 전략·숫자팀 · 전 본부"}, {"k": "프로그램 개발 지시는 '요구사항 → 설계 → 할 일' 세 장으로", "p": "유지", "d": "AWS 발표에서 개발 일 중 코딩은 약 20%였다. 사내 프로그램을 맡길 때 세 문서를 먼저 쓰게 하고, 완료 전에는 사람이 실제 데이터로 확인한다. 올리브영처럼 한꺼번에 갈아엎지 않고 한 업무씩 바꾼다.", "r": "⑯ AWS 전략 · ⑧ 윤석찬 · ④ 올리브영", "who": "1본부 · 전 본부 개발 담당"}, {"k": "AI 도구는 구독형 위주로, 큰 행사 발표 뒤 비용 다시 비교", "p": "검토", "d": "NVIDIA 데이터센터 매출이 전년 대비 110% 늘 만큼 AI 인프라 비용 판이 커지고 있다. 영상 생성·자동화 도구는 큰 초기 투자보다 구독형을 쓰고, re:Invent(12월 초) 요금 발표 뒤 지금 도구와 비용을 비교한다.", "r": "⑱ NVIDIA · ㉒ re:Invent", "who": "2본부 전략·숫자팀"}], "glossaryHeadline": "발표를 읽기 전에 알아 둘 말 12개", "glossary": [{"term": "AI 에이전트", "easy": "질문에 답만 하지 않고 계획을 세워 도구를 써서 일을 끝내 주는 AI.", "why": "쇼핑몰 주문·재고 확인, 자료 조사 자동화에 쓰는 방식이다.", "video": {"title": "AX 시대, 기업을 위한 AI Agent 플랫폼 │ 삼성SDS FabriX", "url": "https://www.youtube.com/watch?v=hE1O1hs2QsA"}}, {"term": "에이전틱 AI", "easy": "AI 에이전트가 스스로 판단하고 실행하는 방식 전체를 부르는 말.", "why": "영상 제작 흐름(조사 → 대본 → 검수) 자동화의 후보 방식이다.", "video": {"title": "기업을 위한 AI Agent 플랫폼, 삼성SDS FabriX", "url": "https://www.youtube.com/watch?v=gcEb5LWrpOk"}}, {"term": "AgentCore (Bedrock AgentCore)", "easy": "AWS가 에이전트를 안전하게 돌리게 해 주는 실행 환경.", "why": "우리가 직접 쓸 일은 적고, 삼성·야놀자 사례를 이해하는 데 필요하다."}, {"term": "AI-DLC", "easy": "AI가 계획·코드를 맡고 사람이 검증하는 개발 방식(AWS가 붙인 이름).", "why": "사내 프로그램 개발에서 AI와 사람의 분업 기준으로 참고한다."}, {"term": "Kiro", "easy": "AWS의 에이전트형 코딩 도구. 요구사항 → 설계 → 할 일 순서로 문서를 먼저 쓴다.", "why": "지금 쓰는 코딩 도구와 비교할 대상이다."}, {"term": "피지컬 AI", "easy": "로봇·기계처럼 현실 세계에서 몸을 움직이는 AI.", "why": "물류·제조 자동화 참고용이며 우리 일과 직접 관련은 적다.", "video": {"title": "[AI·ICT가 좋다] 현실 세계로 나온 AI, 피지컬 AI란?", "url": "https://www.youtube.com/watch?v=3UZspRBlum0"}}, {"term": "AIOps", "easy": "AI로 서버 장애를 알아채고 원인을 찾고 복구하는 일.", "why": "매일 도는 자동 작업 점검을 더 빨리 하는 방법의 참고가 된다."}, {"term": "마이크로서비스", "easy": "큰 프로그램을 작은 서비스 여러 개로 쪼개 따로 운영하는 방식.", "why": "올리브영 사례처럼 시스템을 한 번에 갈아엎지 않고 나눠 바꾸는 방법이다."}, {"term": "MTTR", "easy": "장애가 난 뒤 복구될 때까지 걸리는 평균 시간.", "why": "삼성의 '장애 복구 시간 단축' 숫자를 읽을 때 쓰는 기준이다."}, {"term": "거버넌스", "easy": "누가 무엇을 쓸 수 있는지, 얼마까지 쓸 수 있는지 정한 규칙과 통제.", "why": "AI 도구에 권한·지출 상한을 줄 때 필요하다."}, {"term": "하네스 엔지니어링", "easy": "AI가 실수하지 않게 틀과 검증 장치를 둘러 만드는 설계.", "why": "우리가 운영하는 검수 관문 구조와 같은 생각이다."}, {"term": "온디맨드", "easy": "행사가 끝난 뒤 원하는 때 다시 보는 방식.", "why": "이 행사 다시보기는 온디맨드 등록·로그인이 있어야 볼 수 있다."}], "media": {"headline": "기조연설 다시보기는 등록이 필요해, 행사 영상과 주제 설명 영상을 붙였습니다", "videos": [{"title": "AWS Summit Seoul 2026 이노베이션 찌릿지, The Cloud Arena – Battle of the Best(BoB)에 참여하세요!", "url": "https://www.youtube.com/watch?v=EtWKnwedEmM", "len": "길이 미확인", "note": "Amazon Web Services Korea · 행사 공식 채널의 현장 챌린지 안내 영상(기조연설 아님)"}, {"title": "2026 AWS Summit Seoul 강연 스케치", "url": "https://www.youtube.com/shorts/2m8Fkesz14o", "len": "쇼츠", "note": "동방TV · 행사 강연 현장 스케치(비공식)"}, {"title": "[AI·ICT가 좋다] 현실 세계로 나온 AI, 피지컬 AI란?", "url": "https://www.youtube.com/watch?v=3UZspRBlum0", "len": "길이 미확인", "note": "정보통신기획평가원(IITP) · 주제 설명 영상, 피지컬 AI를 산업용 로봇과 비교해 설명"}, {"title": "AX 시대, 기업을 위한 AI Agent 플랫폼 │ 삼성SDS FabriX", "url": "https://www.youtube.com/watch?v=hE1O1hs2QsA", "len": "길이 미확인", "note": "삼성SDS · 주제 설명 영상, 기업용 AI 에이전트 플랫폼과 도입"}, {"title": "기업을 위한 AI Agent 플랫폼, 삼성SDS FabriX", "url": "https://www.youtube.com/watch?v=gcEb5LWrpOk", "len": "길이 미확인", "note": "삼성SDS AX · 주제 설명 영상, 에이전트를 만들고 공유하고 실행하는 흐름"}, {"title": "[웨비나] 고보안 환경을 위한 AI 클라우드 아키텍처 전략 │ 삼성SDS Cloud Talk", "url": "https://www.youtu
