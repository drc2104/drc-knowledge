, "co": "싱가포르·필리핀 · 보도자료 기사·전시", "title": "PFAS 없는 나노섬유 방수·투습 라미네이트 NUSPUN, 4분기 공급 시작", "q": "섬유를 쌓아 만든 얇은 막으로 PFAS 없이 물은 막고 수증기는 내보낸다.", "hl": ["PFAS", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> 전기방사로 만든 3D 나노섬유 막. 필름을 늘려 만드는 기존 막과 달리 섬유를 쌓아 올린다. 플랫폼 3종 — Arcus(극한 환경), Ventus(방풍·내수), Stratos(고강도 운동, 통기). 싱가포르 법인, 생산·연구는 필리핀, 2019년 한국인 형제가 세웠다.", "<b>숫자:<\/b> 섬유 지름 약 450 nm, 막 무게 3~14 g/㎡, 막 단독 내수압 3,000 mmH₂O 초과, 라미네이트 10,000 mmH₂O 초과, Stratos 공기 투과 1 CFM 초과, 수증기 저항 RET 1까지 낮음(회사 주장). 시리즈 A 1,100만 달러 넘게 유치(2026-08 기사).", "<b>공급:<\/b> 2026년 4분기부터 선별한 브랜드에 공급, 첫 제품은 2027년 가을·겨울 겉옷.", "<b>근거 수준:<\/b> PFAS는 '제조 과정에서 의도적으로 넣지 않는다'는 표현이다. 무검출 시험 결과·시험 규격(JIS·ISO)·제3자 검증은 나오지 않았다.", "<b>마케팅:<\/b> 'Active Comfort'라는 원료 브랜드로 판다. BASF가 TPU를 대고, CHINAPLAS 2026(상하이)에 시제품 재킷을 전시했다.", "<b>고객 반응 · 우리에게:<\/b> 아직 제품이 없어 후기 없음. 기사 대상은 트레일 러닝·사이클링·스키·겉옷이고 속옷 언급은 없다. 그래도 얇은 막(3~14 g/㎡)이라 요실금·생리팬티 흡수 패드 아래 방수층 후보로 샘플 시험해 볼 만하다."], "nums": [["10,000", "mmH₂O+", "라미네이트 내수압 (업체 발표)", 1], ["3~14", "g/㎡", "막 무게"], ["450", "nm", "섬유 지름 (약)"], ["1,100만", "달러+", "시리즈 A 투자 유치"]], "video": {"title": "【TORAY】Dermizax™ PFAS Free Variations", "url": "https://www.youtube.com/watch?v=4mcjP7o0XfE"}, "src": "스페셜타임스 (2026-10-15, 뉴스와이어 보도자료) · Innovation News Network (2026-08-11)", "grade": "확인"}, {"tm": "중 · 09.29", "name": "클라레트레이딩 (Kuraray 그룹)", "co": "일본 · 회사 뉴스 · 전시 (지난 소식)", "title": "흡방습·접촉냉감 심초 복합섬유 닌파스(ニンファス), 용도에 인너 명시", "q": "겉은 나일론, 속은 폴리에스터인 한 올의 실이 흡습과 속건을 나눠 맡는다.", "hl": ["한", "올의"], "pts": ["<b>무엇이 새로운가:<\/b> 심은 폴리에스터, 초(겉껍질)는 나일론인 심초 복합섬유. 독자 특수 단면으로 심과 초가 벗겨지지 않게 했다. 나일론 쪽이 흡방습·접촉냉감, 폴리에스터 쪽이 속건·치수 안정을 맡는다.", "<b>숫자:<\/b> 흡방습·접촉냉감 수치와 시험 규격은 원문에 없다(정성 표현만). 판매 시기도 없다.", "<b>용도:<\/b> 원문에 '스포츠웨어, 아웃도어웨어, 인너 등'이라고 속옷 용도를 적었다.", "<b>마케팅:<\/b> 타이베이 TITAS(10월 6~8일, 종료)에 이어 상하이 FUNCTIONAL TEXTILES SHANGHAI by PERFORMANCE DAYS(11월 18~19일, Hall4.1-B38)에 나온다. 주최 사이트에 다른 날짜도 함께 보여 공식 사이트 재확인이 필요하다.", "<b>고객 반응:<\/b> 개발 단계라 없음.", "<b>우리에게:<\/b> 속옷 안감용 샘플을 받아 흡수 속도·건조 시간을 지금 쓰는 원단과 같은 조건으로 비교해 볼 후보."], "tabl DM 계열 소재 법인 · 어패럴뉴스", "title": "기후 대응 소재 '제이노바' 쿨·히트·울 혼방 3개 라인", "q": "냉감 원단을 시험 기관 숫자(Qmax 0.169)로 내세웠다.", "hl": ["Qmax"], "pts": ["<b>무엇이 새로운가:<\/b> 쿨(접촉냉감·흡습속건), 히트(광발열·보온), 더블유(울 혼방, 흡습속건·항균·소취 강화) 3개 라인.", "<b>숫자:<\/b> 냉감 편물 JY-KN209 접촉냉감 Qmax 0.169 W/㎠(FITI시험연구원). 골프 브랜드 등 8~9개 주요 브랜드에 납품. 혼용률·무게·가격은 없다.", "<b>마케팅:<\/b> 시험 기관 이름과 수치를 함께 내세운다. 대상은 골프·러닝·아웃도어이고 속옷 언급은 없다.", "<b>고객 반응:<\/b> 수집 못함.", "<b>우리에게:<\/b> 냉감 의류에서 Qmax 같은 숫자로 겨루는 흐름이 속옷으로 올 수 있다. 우리 원단도 접촉냉감·흡수 수치를 같은 기관에서 재 둔다."], "nums": [["0.169", "W/㎠", "접촉냉감 Qmax (FITI)", 1], ["8~9", "개", "납품 주요 브랜드"], ["3", "개 라인", "쿨·히트·울 혼방"]], "src": "어패럴뉴스 (2026-10-20)", "grade": "확인"}, {"tm": "하 · 11.03", "name": "워싱턴대 세인트루이스 (WashU)", "co": "미국 · 학술지 Matter · phys.org 보도", "title": "리그닌·지방산으로 만든 불소 없는 초발수 코팅 SLIP", "q": "불소 없는 발수가 식물 성분 쪽으로도 길을 내고 있다.", "hl": ["식물"], "pts": ["<b>무엇이 새로운가:<\/b> 리그닌에 지방산을 붙이고 PLA 바인더를 더한 초발수 코팅. 식물의 수베린을 본떴고, 곰팡이로 분해되는지 시험했다.", "<b>숫자:<\/b> 접촉각·세탁 내구성 수치는 없다. 기름·불 저항은 아직 안 된다.", "<b>용도:<\/b> 포장·건축 코팅 대상이고 섬유·옷 적용 언급은 없다. 사업화 전 연구 단계.", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 당장 쓸 수는 없는 참고 소식. 불소 없는 발수가 바이오 원료로도 열린다는 신호."], "video": {"title": "PFAS: The secret toxins in your body", "url": "https://www.youtube.com/watch?v=lVcOxZZGrBc"}, "src": "phys.org (2026-11-03)", "grade": "확인"}], "flow": [{"k": "PFAS 없는 방수·발수가 세 갈래로 퍼진다", "d": "스타트업 막(나이버), 연구원 코팅(한국기계연구원), 대학 바이오 코팅(WashU). 국내와 해외가 같은 방향이고, 어제 다룬 EU PFHxA 시행과도 같은 흐름", "who": [1, 3, 8]}, {"k": "흡습·냉감을 한 섬유 안에 합친다", "d": "클라레 심초 구조, 제이노바 쿨 라인 — 속건+냉감이 속옷 쪽으로 내려오는 중", "who": [2, 7]}, {"k": "재생·바이오 원료는 '무엇 기준 숫자인지'를 밝힌다", "d": "도레이 원사 기준 93%, 렌징 HV100 확산, 리그닌 코팅", "who": [6, 4, 8]}, {"k": "기능을 원료 브랜드로 판다", "d": "나이버 'Active Comfort', 더와이 기능성 원단 — 원료 단계에서 이름을 붙여 완제품에 연결", "who": [1, 5]}], "flowHeadline": "방수층은 불소를 빼고, 숫자는 기준을 밝히는 쪽으로", "apply": [{"k": "[원단 시험] 방수층 원단의 PFAS 시험 성적서 확보", "p": "우선", "d": "요실금·생리팬티 방수층 원단 공급사에 '의도적으로 넣지 않았다'는 설명 대신 PFAS 시험 성적서를 받는다. EU 의류 섬유 PFHxA 25 ppb 기준을 넘는지부터 확인한다. 새 소재 후보도 같은 기준으로 성적서를 요구한다.",
