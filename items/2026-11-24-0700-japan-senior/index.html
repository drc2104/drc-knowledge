"}, "src": "shaho 처우개선 편 · ヒトケア (2026년도 기중 개정 숫자)", "grade": "확인"}, {"tm": "의제1 · 논점 3", "name": "일부를 기본 가격에 넣기", "co": "후생노동성 자료1 · 처우개선 (검토)", "title": "처우개선가산 일부를 기본보수에 편입", "q": "가산을 기본 가격에 넣으면 임금 재원은 안정되지만, 이용자의 월 한도가 더 빨리 찹니다.", "hl": ["월", "한도가"], "pts": ["<b>장점:<\/b> 가산을 받느냐 못 받느냐에 덜 흔들리는 임금 재원, 사무 부담 감소.", "<b>조건:<\/b> 들어온 돈이 확실히 임금 개선에 쓰이는 장치. 2027년도 새 개선분은 기본급 등에 쓰는 것이 기본. 기존 요건은 가산Ⅳ 상당액의 1/2 이상을 기본급 또는 매월 정해진 수당에 쓰는 것.", "<b>핵심 쟁점 — 이용자 부담:<\/b> 지금 가산은 월 한도(구분지급한도기준액) 관리 밖이다. 기본보수에 넣으면 같은 서비스를 써도 한도 계산상 점수가 늘어난다.", "<b>위원 우려:<\/b> 지자체 국보련 위원(나카쓰 시장)은 필요한 서비스를 못 쓰거나 이용자 부담이 급증하지 않게 한도 완화를, 건강보험조합연합회·경단련은 보험료·이용자 부담을 충분히 고려하라고 했다.", "<b>임금이 오를까:<\/b> 인지증 당사자·가족회 위원은 기본보수가 되면 경영자 재량이 돼 임금 인상이 불확실해질까 걱정했고, 노동조합 위원은 일시금이 아닌 기본급 중심의 지속적 인상 장치를 요구했다."], "bars": {"t": "월 급여 (만 엔, 2025 임금구조기본통계조사)", "u": "만", "rows": [["노인복지·개호 사업", 31.9, "a"], ["전 산업 평균", 39.6, "c"]]}, "nums": [["7만 7,000", "엔", "개호와 전 산업 월급 차이", 1], ["1/2", "이상", "가산Ⅳ 상당액 중 기본급·매월 수당에 쓸 몫(현행)"]], "video": {"title": "令和8年度　処遇改善加算の簡単解説！【前編】 - 社会保険労務士法人エンジー", "url": "https://www.youtube.com/watch?v=PZR1zkX7Nis"}, "src": "shaho 처우개선 편 2026.11.17 (위원 발언은 보도 요약)", "grade": "확인"}, {"tm": "의제1 · 논점 4", "name": "가산 구분 줄이기", "co": "후생노동성 자료1 · 처우개선", "title": "요건을 떼어 낸 뒤 남는 구분을 합친다", "q": "요건을 떼어 낸 뒤 남는 것을 정리해 가산 구분 수를 줄입니다.", "hl": ["줄입니다."], "pts": ["<b>무엇을:<\/b> 요건 분리 뒤 남는 요건을 정리해 가산 구분을 줄이는 안.", "<b>지금 구조:<\/b> 기존 대상 서비스는 6구분. 2024년도에 가산 3개를 하나로 묶었고, 2026년도에 상위 구분을 새로 만들었다.", "<b>왜:<\/b> 구분이 많을수록 사업소가 계산·신고하기 어렵다. 다음 논점(사무 부담 경감)과 이어진다."], "nums": [["6", "구분", "현행 기존 서비스 처우개선가산 구분"]], "src": "shaho 처우개선 편 · ヒトケア", "grade": "확인"}, {"tm": "의제1 · 논점 5", "name": "서류 부담 줄이기", "co": "후생노동성 자료1 · 처우개선", "title": "계획서·실적보고서 사무 부담 경감", "q": "임금이 올랐는지 확인하는 취지는 지키되, 서류와 계산은 줄입니다.", "hl": ["서류와"], "pts": ["<b>무엇을:<\/b> 임금 개선 확인 취지는 유지하고 확인 사항·계산 방법·제출 서류를 정리한다.", "<b>왜 필요한가:<\/b> 거택개호지원 사업소의 처우개선 신고율은 74.0%. 신고하지 않은 이유 1위가 '사무가 번잡해서'(44.7%), 2위 '요건을 못 채워서'(27.3%).", "<b>취득률 차이:<\/b> 기존 대상 서비스 96.1%, 새로 대상이 된 서비스 70.9%.", "<b>위원 요구:<\/b> 노인복지시설협의회 위원은 기본보수화 때 상여·할증 임금 영향 계산도 간단하게 해 달라고 했다."], "bars": {"t": "거택개호지원 처우개선 미신고 이유 (%)", "u": "%", "rows": [["사무가 번잡", 44.7, "a"], ["요건 불충족", 27.3, "b"]]}, "nums": [["74.0", "%", "거택개호지원 신고율"], ["70.9", "%", "새 대상 서비스 가산 취득률", 1]], "src": "shaho 처우개선 편 · ヒトケア (처우상황조사 결과안, 11/16 경영조사위원회)", "grade": "확인"}, {"tm": "의제1 · 논점 6", "name": "체제강화가산 요건 손질", "co": "후생노동성 자료1 · 처우개선", "title": "근속연수 요건을 없애고 육성·환경 노력으로", "q": "오래 근무한 사람 수 대신, 사람을 키우고 일하기 좋게 만드는 노력을 봅니다.", "hl": ["키우고"], "pts": ["<b>배치 비율 조정:<\/b> 개호복지사 배치 비율 요건을 서비스별 실태에 맞춘다. 많은 서비스에서 실제 비율이 하위 구분 수준보다 평균적으로 높다(구체 숫자는 그림으로만 제시).", "<b>특례:<\/b> 개호복지사 수를 유지한 채 무자격 직원을 늘린 경우, 일정 조건에서 이전 구분을 유지하는 특례를 검토.", "<b>근속연수 요건 폐지:<\/b> 대신 인재 육성·직장 환경 정비의 구체적인 노력을 요건으로.", "<b>위원 요구:<\/b> 노인복지시설협의회는 대신할 요건에 객관 기준을, 인지증 가족회는 새 요건의 의미 설명을, 만성기의료협회는 기능실습생을 받아 개호복지사 비율이 떨어져 평가를 잃는 일이 없게 하라고 했다.", "<b>육아·간병 휴업:<\/b> 만성기의료협회 위원은 제도를 만들었는지뿐 아니라 실제로 쓸 수 있는지를 평가하라고 했다."], "video": {"title": "【令和8年度改定】対象が全介護従事者に拡大！新しい「処遇改善加算」と「賃上げ補助金」のポイントを徹底解説 - ケアの生産性向上ラボ", "url": "https://www.youtube.com/watch?v=Cj5CuH1QURY"}, "src": "shaho 처우개선 편 2026.11.17", "grade": "확인"}, {"tm": "의제2 · 논점 1", "name": "업무 개선 위원회", "co": "후생노동성 자료2 · 생산성 향상", "title": "방문·통소·거택개호지원에도 위원회 의무화 안", "q": "직원 1~2명 사업소에서는 위원회를 여는 것 자체가 생산성을 떨어뜨릴 수 있습니다.", "hl": ["자체가"], "pts": ["<b>지금:<\/b> 입소·숙박·거주 시설은 2024년도 개정에서 위원회 설치·정기 개최가 의무가 됐다(경과 기간 3년).", "<b>후생노동성 안:<\/b> 방문·통소·거택개호지원 사업소에도 안전·돌봄 질·직원 부담 경감을 논의하는 위원회 설치·개최를 의무화(소규모 사업소 배려).", "<b>유연하게:<\/b> 생산성 향상 추진체제가산의 위원회는 현행 '원칙 3개월에 1회 이상'을 없애고 사업소 판단으로 수시 개최, 온라인 회의 가능. 디지털 중핵 인재 참여는 유효하다고 적되 새로 뽑으라는 의무는 아니다.", "<b>반대·신중:<\/b> 노인복지시설협의회 위원은 방문·통소 의무화에 명확히 반대했고, 의사회 위원은 소규모를 뺀 일정 규모 이상만, 개호지원전문원협회 위원은 공동 운영·상담센터·연수 같은 대체 방식을 폭넓게 인정하자고 했다.", "<b>찬성:<\/b> 건강보험조합연합회 위원은 의무화에 이의가 없다면서도 형식만 남지 않게 일정 규칙을 두라고 했다. 만성기의료협회 위원은 채팅 회의도 기록이 남으면 인정하자고 했다."], "nums": [["3", "개월에 1회", "현행 원칙 → 수시 개최로"], ["1~2", "명", "직원 수가 이 정도인 거택개호지원 사업소도 있음(위원 발언)", 1]], "video": {"title": "介護現場における生産性向上について - NTTデータ経営研究所", "url": "https://www.youtube.com/watch?v=JqXdTr5ORyk"}, "src": "社会保険研究所(shaho) 생산성 편 2026.11.17 (위원 발언은 보도 요약)", "grade": "확인"}, {"tm": "의제2 · 논점 2", "name": "재택 사업소 새 평가", "co": "후생노동성 자료2 · 생산성 향상 (검토)", "title": "기기를 들이고 개선을 이어 가는 방문·통소 사업소를 새로 평가", "q": "방문하는 모든 직원에게 단말을 주되, 개인 스마트폰과 통신비에 기대지 말아야 합니다.", "hl": ["모든", "직원에게"], "pts": ["<b>조건:<\/b> 위원회 개최·안전 대책을 갖추고, 업무 효율·질 향상·부담 경감에 쓰이는 기기를 들여 생산성 향상 지침에 따라 개선을 계속하는 사업소.", "<b>대상 기기 예:<\/b> 아래 표 4종. 가산 점수는 아직 제시되지 않았다.", "<b>기록 소프트 보급:<\/b> 개호기록 소프트 등 도입 38.8%, 미도입 44.5%(2026.4 말, 경영실태조사 참고).", "<b>위원 반응:<\/b> 노동조합 위원은 등록 헬퍼까지 전원 단말 배치를, 개호복지사회 위원은 도입비뿐 아니라 이용료·유지·갱신·연수까지 계속 지원을 요구했다. 만성기의료협회 위원은 재택 지켜보기 기기도 평가 대상에 넣자고 했다."], "table": [["대상 기기 예 (후생노동성 안)", "무엇에 쓰나"], ["개호기록 소프트·스마트폰 등 ICT", "기록·정보 공유"], ["케어플랜 데이터 연계 시스템", "케어매니저와 사업소 간 계획서 주고받기"], ["AI 등 문서 작성 보조 도구", "서류 작성 시간 줄이기"], ["방문하는 전 직원 태블릿 등 (방문·거택개호지원)", "현장에서 바로 기록"]], "nums": [["38.8", "%", "개호기록 소프트 등 도입 (2026.4 말)"], ["44.5", "%", "미도입", 1]], "video": {"title": "介護テクノロジー利用の重点分野　９分野・16項目のご紹介 - 厚生労働省 / Ministry of Health, Labour and Welfare", "url": "https://www.youtube.com/watch?v=VB14lUS3Dsc"}, "src": "shaho 생산성 편 · 경영실태조사 숫자는 shaho 처우개선 편(기정리 회의와 겹쳐 참고)", "grade": "확인"}, {"tm": "의제2 · 논점 3", "name": "시설 생산성 가산 손질", "co": "후생노동성 자료2 · 입소·숙박·거주 시설", "title": "AI 문서 보조를 대상 기기에, 시간 재기 조사는 간소화", "q": "개호 기술을 적극 쓰는 시설은 한 달에 30~40만 엔이 계속 듭니다.", "hl": ["30~40만"], "pts": ["<b>대상 기기 추가:<\/b> AI 문서 작성 보조를 생산성 향상 추진체제가산 대상 기기에 넣는다.", "<b>가산(Ⅰ):<\/b> 업무 시간을 직접 재는 조사(타임스터디) 보고 필수를 해제. 삶의 질·총 업무 시간·초과근무·연차 변화는 그대로 파악하고, 위원회 회의록·업무 개선 계획서 같은 과정 기록을 요구.", "<b>가산(Ⅱ):<\/b> 업무 분담 명확화, 개호 조수 활용, 간접 업무 공동 실시·외부 위탁 등을 요건으로 요구하는 안. 타임스터디는 큰 항목 중심으로 간소화, 전자 앱 데이터 허용.", "<b>비용 문제:<\/b> 노인보건시설협회 위원은 월 30~40만 엔의 운영비 사례를 들며 클라우드 이용료·갱신비 지원과 가산 평가 충실을 요구했다.", "<b>질 지키기:<\/b> 간호협회 위원은 식사·청결·배설·이동 같은 직접 돌봄을 제대로 하는지 확인하라고 했고, 노인복지시설협의회 위원은 개호 조수·외부 위탁은 지역에 따라 구하기 어려우니 필수 말고 선택지로 하자고 했다."], "nums": [["30~40만", "엔/월", "기술 적극 활용 시설 운영비 (위원 발언)", 1]], "video": {"title": "介護現場におけるロボット・ICT導入支援・補助金説明について（講師：厚生労働省高齢支援課） - [公式]全国老人福祉施設協議会", "url": "https://www.youtube.com/watch?v=JUYbbp9dKrk"}, "src": "shaho 생산성 편 2026.11.17", "grade": "확인"}, {"tm": "의제2 · 논점 4", "name": "케어플랜 데이터 연계", "co": "후생노동성 자료2 · 거택개호지원", "title": "연계 시스템 보급과 케어플랜 작성 AI 연구", "q": "케어플랜을 AI가 만들 때, 개인정보가 밖으로 새지 않는 환경부터 갖춰야 합니다.", "hl": ["개인정보가"], "pts": ["<b>보급:<\/b> 케어플랜 데이터 연계 시스템 도입률 61.3%(2026.10 말, 후생노동성 보고). 보급을 더 넓힌다.", "<b>AI 연구:<\/b> 케어플랜 작성 지원 AI 활용을 조사연구한 뒤 추진 방안을 검토.", "<b>위원 의견:<\/b> 분과회장 대리(후쿠오카 국제의료복지대학 학장)는 생성 AI를 쓸 때 외부로의 개인정보 유출 위험, 소규모 사업소도 안전하게 쓸 환경, AI가 참고하는 정보·지시문의 표준화 연구를 요구했다.", "<b>비교 조사 요구:<\/b> 고령사회를 좋게 하는 여성회 위원은 케어매니저가 AI로 만든 플랜과 이용자 본인이 AI로 만든 셀프 플랜을 비교 조사하라고 했다. 의사회 위원은 AI 과의존을 경계했다."], "nums": [["61.3", "%", "케어플랜 데이터 연계 시스템 도입률 (2026.10 말)", 1]], "video": {"title": "【厚労省に直撃】ケアプラン連携システムはどれくらい使われているのか？【対談前編】 - 介護のコミミ", "url": "https://www.youtube.com/watch?v=WhHZFumXV4w"}, "src": "shaho 생산성 편 2026.11.17", "grade": "확인"}, {"tm": "의제2 · 논점 5", "name": "야간 배치 기준 완화", "co": "후생노동성 자료2 · 노인보건시설", "title": "지켜보기 기기를 조건으로 야간 직원 기준을 낮춘다", "q": "지켜보기 기기를 모든 이용자에게 단 시설은 야간 직원 1인당 돌봄·순회 시간이 32.1% 줄었습니다.", "hl": ["32.1%"], "pts": ["<b>조건(안):<\/b> ① 이용자 움직임을 감지하는 지켜보기 기기를 모든 이용자에게 ② 야간 직원 전원이 인컴(무선 통화) 등 ICT 기기 사용 ③ 안전 체제(위원회, 충분한 휴식, 기기 정기 점검, 직원 교육, 야간 방문이 필요한 이용자 개별 대응).", "<b>기준(안):<\/b> 이용자 41명 이상은 '2명 이상' → '1.6명 이상', 20명 늘 때마다 '1명 이상' → '0.6명 이상'. 40명 이하는 '1명 이상' 유지. 인원 배치 특례 완화와 같이 쓰면 0.8명.", "<b>이미 있는 제도:<\/b> 특별양호노인홈 야간직원배치가산(2021년도), 그룹홈 야간지원체제가산(2024년도).", "<b>근거의 한계:<\/b> 노동조합 위원은 도입률 0%(18건)와 100%(11건)로 한정된 데이터라고 지적했다.", "<b>신중론:<\/b> 인지증 가족회 위원은 기기 고장 때 적은 인원으로 대응 못 할 우려를, 개호복지사회 위원은 인지증 증상·긴급 대응을 검증하라고 했다. 의사회 위원은 시설은 생활의 장이니 불필요한 카메라 상시 감시는 심리적 부담이라고 했다."], "shift": {"from": "2명 이상", "to": "1.6명 이상", "cap": "이용자 41명 이상 야간 직원 기준(안)"}, "bars": {"t": "노인보건시설 야간 직원 기준 (명, 이용자 41명 이상)", "u": "명", "rows": [["현행", 2, "c"], ["기기 도입 시 (안)", 1.6, "b"], ["특례 완화와 같이 쓸 때 (안)", 0.8, "a"]]}, "nums": [["32.1", "%", "야간 직원 1인당 돌봄+순회·이동 시간 감소", 1], ["18 / 11", "건", "도입률 0% / 100% 시설 데이터 수"]], "video": {"title": "介護テクノロジー利用の重点分野　９分野・16項目のご紹介 - 厚生労働省 / Ministry of Health, Labour and Welfare", "url": "https://www.youtube.com/watch?v=VB14lUS3Dsc"}, "src": "shaho 생산성 편 · 日本通所ケア研究会 2026.11.17 · ヒトケア", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 민정부 등 6개 부처", "co": "중국 · 民政部·发展改革委·工业和信息化部·商务部·市场监管总局·全国老龄办 · 문서 2026.11.04, 게재 11.06", "title": "노인용품 소비 촉진 14개 조치 — '판매 대신 대여'", "q": "노인용 가구·재활 보조기구·스마트 돌봄 기기를 빌려 쓰게 해 어르신 비용을 낮춥니다.", "hl": ["빌려"], "pts": ["<b>제품:<\/b> '다양한 장면을 키워 노인용품 소비를 촉진하는 조치' 14조, 4부(소비 장면 확대·공급 강화·소비 서비스 혁신·소비 지원).", "<b>대여 조항(제9조):<\/b> '판매 대신 대여(以租代售)', '대여·판매 결합' 같은 유연한 대여 방식을 넓혀 노인용 가구·재활 보조기구·스마트 돌봄 기기 대여를 이끈다.", "<b>목록·표준:<\/b> 매년 국가 노인친화 제품·서비스 보급 목록(제7조), 노인용품 산업 표준 체계 지침과 실버 제품 인증 제도 모색(제13조).", "<b>숫자:<\/b> 2025년 말 60세 이상 3.2억 명, 2035년 4억 명 넘을 전망, 실버 경제 규모 30조 위안 돌파 가능(2026.02 국무원 상무회의). 이번 문서에는 수치 목표·금액이 없다.", "<b>국내와 비교:<\/b> 일본이 기기 도입을 가산으로 미는 것처럼, 중국은 용품을 '빌려 쓰기'로 보급하려 한다. 복지용구 대여·재사용과 같은 방향(정리자 해석)."], "nums": [["3.2억", "명", "60세 이상 (2025년 말)"], ["4억", "명+", "2035년 전망", 1], ["14", "개 조", "노인용품 소비 촉진 조치"]], "table": [["나라", "고령 지표 · 제도 변화 (날짜)"], ["중국", "60세 이상 3.2억 명 · 노인용품 대여 확대 14개 조치 (2026.11.04)"], ["독일", "개호보험료율 3.6% 유지 · 자녀 없는 가입자 가산 0.9% (2026.09.30 각의 결정)"], ["미국", "민간 메디케어 플랜 지급 +2.48% · 약 280만 명 플랜 사라짐 (2027)"], ["유럽연합", "65세 이상 22% · 중위 연령 44.9세 (2025.1.1)"], ["싱가포르", "65세 이상 시민 5명 중 1명 넘어 초고령사회 (2026.10.30)"]], "src": "北京日报 2026.11.06 · 科技日报 2026.11.06 · 新华网 2026.02.24 (배경 숫자)", "grade": "확인"}, {"tm": "해외 · 독일", "name": "독일 연방정부", "co": "독일 · 각의 결정 · 2026.09.30", "title": "개호개혁법(PNOG): 보험료율 3.6% 유지, 자녀 없는 가입자 더 부담", "q": "재정이 빠듯해지자 보험료율은 묶고, 가산으로 부담을 나누는 길을 택했습니다.", "hl": ["가산으로"], "pts": ["<b>시장 상황:<\/b> 연방정부가 개호개혁법(Pflegeneuordnungsgesetz)을 각의 결정. 연방의회·연방참사원 심의 전(10.23 기사까지 표결 소식 없음).", "<b>숫자:<\/b> 보험료율 3.6% 유지, 자녀 없는 가입자 가산 +0.3%p로 0.9%(2027.1.1), 무료 동반가입 배우자 가산 0.52%p(2028.1.1), 보험료 산정 상한 월 300유로 인상(처음 안은 1,000유로).", "<b>반응:<\/b> 유지 기간 표현이 매체마다 다르다('내년'·'앞으로 몇 년'·'당분간'). 적자 숫자도 출처마다 달라(2026년 약 44억 유로·2027년 76억 유로 등) 같은 항목인지 확인되지 않았다.", "<b>국내와 비교:<\/b> 일본이 처우개선 일부를 기본 가격에 넣을 때 보험료·이용자 부담을 걱정하는 것과 같은 구조 — 재정 압박 속 부담 조정(정리자 해석)."], "nums": [["3.6", "%", "개호보험료율 유지"], ["0.9", "%", "자녀 없는 가입자 가산 (2027.1.1)", 1], ["0.52", "%p", "무료 동반가입 배우자 가산 (2028.1.1)"]], "src": "Ärzteblatt · Apotheken Umschau · beck-aktuell (2026.09.30 전후)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "미국 CMS (메디케어·메디케이드 서비스센터)", "co": "미국 · Home Health Care News 2026.04.06 · Oliver Wyman 2026.11", "title": "민간 메디케어 플랜 지급 2.48% 올려도 약 280만 명 플랜이 사라진다", "q": "지급은 올랐지만, 일반 가입자 13%가 쓰던 플랜이 2027년엔 없습니다.", "hl": ["13%가"], "pts": ["<b>시장 상황:<\/b> CMS가 2027년 메디케어 어드밴티지(민간 보험사가 운영하는 노인 의료보험) 지급을 평균 2.48%(약 130억 달러) 올리기로 확정. 위험점수 추세를 넣으면 4.98%, 1월 제안은 0.09%였다.", "<b>숫자:<\/b> 일반 가입자 약 280만 명(2026 가입자의 13%)이 2027년 제공되지 않는 플랜에 있다. PPO 179만 명(20.8%), HMO 103만 명(8.0%).", "<b>반응:<\/b> 남는 플랜도 혜택이 바뀌고 본인 부담이 늘어난다(Oliver Wyman). 가입 기간 10.15~12.07.", "<b>국내와 비교:<\/b> 미국은 민간 플랜이 혜택을 줄이는 쪽, 일본은 공공 보험이 가산으로 재가 사업소를 받치는 쪽(정리자 해석)."], "bars": {"t": "2027년 플랜이 사라지는 일반 가입자 (만 명)", "u": "만", "rows": [["PPO", 179, "a"], ["HMO", 103, "b"]]}, "nums": [["2.48", "%", "2027 지급 평균 인상 (약 130억 달러)"], ["280만", "명", "플랜이 사라지는 가입자 (13%)", 1]], "src": "Home Health Care News 2026.04 · Oliver Wyman 2026.11", "grade": "확인"}, {"tm": "해외 · 유럽", "name": "유럽연합 통계청 (Eurostat)", "co": "유럽연합 · Eunews 경유 · 2026.02.13 (기준 2025.1.1, 6개월 넘은 자료)", "title": "65세 이상 22%, 중위 연령 44.9세", "q": "일하는 사람 3명당 은퇴자 1명인 유럽입니다.", "hl": ["3명당"], "pts": ["<b>시장 상황:<\/b> EU 인구 4억 5,060만 명 중 65세 이상 22%.", "<b>숫자:<\/b> 중위 연령 44.9세(10년 새 +2.1세). 가장 높은 이탈리아 49.1세, 가장 낮은 아일랜드 39.6세.", "<b>반응:<\/b> 보도는 '일하는 사람 3명당 은퇴자 1명'으로 표현. 노령 부양비 정확값은 Eurostat 원문을 못 읽어 확인하지 못했다.", "<b>국내와 비교:<\/b> 유럽 22%는 일본보다 낮아 비교 기준선으로 쓸 만하다(정리자 해석)."], "bars": {"t": "중위 연령 (세, 2025.1.1)", "u": "세", "rows": [["이탈리아", 49.1, "a"], ["EU 평균", 44.9, "b"], ["아일랜드", 39.6, "c"]]}, "nums": [["22", "%", "EU 65세 이상 비율", 1], ["+2.1", "세", "10년간 중위 연령 상승"]], "src": "Eunews 2026
