 · 2본부 쇼핑몰팀"}, {"k": "[제품] 심리스·얇은 끈 라인을 속옷 후보로 수요부터 확인", "p": "검토", "d": "지그재그에서 심리스 +34%, 얇은 끈 브라 +386%로 늘었다. 근거가 한 플랫폼 숫자뿐이라 바로 정하지 않고, 우리 판매 경로의 검색·후기 반응으로 먼저 수요를 확인한다.", "r": "① 속옷 세대교체", "who": "4본부 제품·출시팀"}, {"k": "[마케팅] 펨테크 지원 사업·데모데이 참여 기업 동향 추적", "p": "유지", "d": "K-펨테크 육성 첫해 데모데이에 생리팬티 업체가 참여했다. 같은 지원 사업 공고와 참여 기업의 투자·제품 움직임을 정기적으로 기록한다.", "r": "⑥ 펨테크 데모데이", "who": "4본부 제품·출시팀"}], "glossary": [{"term": "펨테크", "easy": "여성의 건강과 몸에 관한 기술·제품 사업(Femtech).", "why": "정부 지원 사업과 데모데이 대상이고, 생리팬티 업체가 이 안에 들어 있다."}, {"term": "국민행복카드 바우처", "easy": "정부가 청소년이 생리용품을 살 돈을 카드로 지원하는 제도.", "why": "올리브영이 결제를 받기 시작했다. 다회용 생리팬티가 대상인지 확인이 필요하다."}, {"term": "누수방지 속옷", "easy": "새지 않게 막는 층이 들어 있어 패드 없이 입는 속옷(영어로 leakproof).", "why": "Frank's Pants·Knix 같은 해외 업체가 우리 생리팬티·요실금팬티와 같은 자리에서 쓰는 이름이다.", "video": {"title": "DOES PERIOD UNDERWEAR WORK? KNIX LEAKPROOF UNDERWEAR REVIEW | Hemali Mistry", "url": "https://www.youtube.com/watch?v=mekEZpxxpP8"}}, {"term": "흡수 쇼츠", "easy": "생리혈·분비물을 팬티 자체가 빨아들이게 만든 속옷의 일본식 이름.", "why": "일본 시장에서 우리 제품을 비교할 때 기준이 되는 이름이다.", "video": {"title": "話題の【サニタリー用吸水ショーツ】本音レビュー!「本当に吸うのか」「快適なのか」徹底検証", "url": "https://www.youtube.com/watch?v=a9IT5nJdPUs"}}, {"term": "PFAS", "easy": "물과 기름을 튕기게 하는, 잘 분해되지 않는 화학물질 묶음('영원한 화학물질').", "why": "방수층·흡수층 원단을 고를 때 규제를 받을 수 있다."}, {"term": "ECHA·SEAC", "easy": "EU 화학물질청과, 그 안에서 규제의 경제·사회 영향을 따지는 위원회.", "why": "EU 규제 일정이 어디까지 왔는지 판단하는 기준이다."}, {"term": "흡수량 (mL)", "easy": "속옷 한 장이 담을 수 있는 액체의 양.", "why": "일회용 920·1,350mL와 다회용 제품을 같은 단위로 비교해야 한다."}, {"term": "노와이어", "easy": "철사(와이어) 없이 컵 모양과 원단으로 받치는 브라.", "why": "지그재그에서 +25% 늘어난 품목이다."}, {"term": "심리스", "easy": "꿰맨 선을 줄이거나 없애 겉으로 자국이 덜 나는 속옷.", "why": "지그재그에서 +34% 늘어난 품목으로 속옷 후보 라인이다."}, {"term": "거래액", "easy": "플랫폼에서 일어난 판매 금액의 합계(영어로 GMV).", "why": "지그재그 +15% 같은 숫자가 매출이 아니라 거래액 기준이라는 점을 구분해야 한다."}, {"term": "자사몰", "easy": "브랜드가 직접 운영하는 쇼핑몰.", "why": "그리티 자사몰 +17.1%처럼 후기를 직접 받는 판매 경로가 커지고 있다."}, {"term": "얼리 블랙프라이데이", "easy": "본 블랙프라이데이보다 먼저 여는 할인 행사.", "why": "빅토리아 시크릿이 11/18
