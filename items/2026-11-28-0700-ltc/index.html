<script id="item-data" type="application/json">{"id": "2026-11-28-0700-ltc", "date": "2026-11-28", "slot": "07:00", "topic": "장기요양급여", "type": "연구보고서·정책 브리핑", "title": "KDI 요양시설 간호인력 보고서 정리", "subtitle": "요양시설 숙련 간호인력 · 국내 발표 4개 · 해외 8개", "event": {"name": "KDI FOCUS 「노인요양시설의 숙련 간호인력 확충 효과와 정책 방향」", "host": "KDI(한국개발연구원) · 권정현 연구위원", "when": "2026.11.03(화) 발간 · 같은 날 정책브리핑에 발표 속기록 게재", "where": "온라인 발간(발표 장소·시각 공개 안 됨)", "theme": "요양시설 간호사 비중이 수급자 의료 이용과 건강보험 진료비에 주는 효과"}, "headline": "요양원 간호사 비중이 늘면 건강보험 진료비가 7.7% 준다", "hl": ["간호사", "7.7%"], "summary3": [["간호사 비중 10%p가 진료비 7.7%를 줄인다.", "요양시설 2,890곳, 8년치(2016~2023) 수급자-월 자료 1,084만여 건 분석. 총내원일수 0.33%, 입원일수 0.49%, 건강보험 진료비 7.7% 감소."], ["비용이 간호사를 밀어내고, 규칙은 2008년 그대로다.", "최저임금 인상 뒤 간호인력 중 간호사 비중이 4.25%p 떨어졌다. 기준은 '25명당 간호사 또는 간호조무사 1명'뿐이고, 간호사가 근무하는 시설은 24.7%."], ["해외는 방향이 갈렸다.", "미국은 너싱홈 최소 간호인력 기준을 2034년까지 집행하지 않기로 했고(추정), 독일은 2026년 1월부터 간호사 권한을 넓혔다. 영국은 공정임금협약에 5억 파운드를 넣는다."]], "cases": [["사례", "숫자"], ["간호사가 근무하는 요양시설", "전체의 24.7%"], ["간호인력 배치 기준(2008년 도입 뒤 사실상 그대로)", "입소자 25명당 간호사 또는 간호조무사 1명"], ["요양보호사 배치 기준", "2.5명당 1명(2022.10) → 2.1명당 1명(2025.1)"], ["전문요양실 시범사업 요구 간호사 비중", "60% 이상"]], "shift": {"from": "+10%p", "to": "-7.7%", "cap": "요양시설 간호인력 중 간호사 비중이 10%p 늘 때 수급자 건강보험 진료비 변화 (KDI 권정현, 장 Ⅲ)"}, "chart": {"t": "숙련 간호인력(간호사) 비중 10%p 증가 시 수급자 의료 이용 감소율 (KDI, 2016~2023 요양시설 2,890곳)", "u": "%", "rows": [["건강보험 진료비", 7.7, "a"], ["입원일수", 0.49, "b"], ["총내원일수", 0.33, "c"]]}, "keynums": [["7.7", "%", "간호사 비중 10%p↑ 때 건강보험 진료비 감소", 1], ["24.7", "%", "간호사가 근무하는 요양시설 비율", 1], ["4.25", "%p", "최저임금 인상 뒤 간호사 비중 하락"], ["2,890", "곳", "분석한 요양시설(2016~2023)"]], "overviewNote": "숫자 출처: KDI 보고서 요약 페이지, 정책브리핑 발표 속기록, 아이뉴스24·SBS Biz 기사. 보고서 원문 PDF와 그림 1·표 1·2는 열지 못해 숫자를 대조하지 못했습니다. 해외 소식 중 원문을 직접 열지 못한 곳은 '추정'으로 표시했습니다.", "sectionLabel": "장", "sections": [{"tm": "장 Ⅰ", "name": "권정현", "co": "KDI 연구위원 · 들어가며", "title": "왜 요양시설의 간호 '숙련'을 봐야 하나", "q": "요양시설의 일상 건강관리는 사실상 간호인력이 맡습니다.", "hl": ["간호인력이"], "pts": ["<b>문제 제기:<\/b> 노인돌봄 수요가 느는 만큼 사람 수(양)뿐 아니라 전문성(질)도 늘려야 한다.", "<b>의료 공백:<\/b> 요양시설엔 촉탁의 제도가 있지만 월 2회 수준 방문으로는 상시 의료 수요를 감당하기 어렵다.", "<b>병원으로 가는 사람들:<\/b> 2022년 장기요양실태조사에서 인정을 받고도 서비스를 쓰지 않는 사람 중 20% 이상이 병원 서비스를 택했다. 1·2등급은 병원 입원이 미이용 사유 1위.", "<b>해외 흐름:<\/b> 미국은 코로나19 뒤 너싱홈 간호사 업무 범위를 넓히고 주 7일 24시간 간호사 배치를 규정했다(2025년 말 최소 인력 기준 폐지 발표 — 해외 소식 참고). 독일은 2026년부터 간호권한확대법을 시행했다.", "<b>저자 인용:<\/b> 의료·요양 통합 논의가 재가서비스 중심인데 \"요양시설에서도 함께 논의돼야 한다\"(아이뉴스24).", "<b>우리에게:<\/b> 시설 안 건강관리를 간호인력이 떠안는 구조라, 요양시설 영업 때는 '간호·요양 인력의 관리 일손을 덜어 주는 용품'이라는 설명이 먹힌다. 효능 단정 없이 관리 편의로 말한다."], "nums": [["20", "%+", "인정받고 미이용자 중 병원 선택", 1], ["2", "회/월", "촉탁의 방문 수준"]], "video": {"title": "노인은 늘어나는데 간호 인력은 부족하다? 요양원의 불편한 현실", "url": "https://www.youtube.com/watch?v=dUMwp1wF0LY"}, "src": "KDI 보고서 요약 페이지 · 아이뉴스24", "grade": "확인"}, {"tm": "장 Ⅱ", "name": "권정현", "co": "KDI 연구위원 · 제도적 배경", "title": "인력 배치 기준과 고용 비용의 상승", "q": "간호사와 간호조무사를 구분하지 않고 총량만 정한 기준이 2008년 이후 그대로입니다.", "hl": ["총량만", "2008년"], "pts": ["<b>현행 기준:<\/b> 입소자 30명 이상 시설은 입소자 25명당 간호사 또는 간호조무사 1명. 둘을 구분하지 않는다.", "<b>간호사 있는 곳은 넷 중 하나:<\/b> 간호사가 근무하는 요양시설은 전체의 24.7%(노용균 외, 2024).", "<b>요양보호사 기준은 강화:<\/b> 입소자 2.5명당 1명(2022.10) → 2.1명당 1명(2025.1). 간호인력 기준은 2008년 도입 이후 실질적으로 바뀌지 않았다.", "<b>비용 압력:<\/b> 2018년 이후 요양보호사 임금은 급등했지만 고용량은 거의 그대로. 간호조무사 임금은 최저임금에 가까워 시설은 비용이 낮은 간호조무사 중심으로 재편할 유인이 있다.", "<b>저자 인용:<\/b> \"분절적으로 평가하면 비용 때문에 장기요양 투자가 늘어날 수 없다\"(아이뉴스24).", "<b>우리에게:<\/b> 요양시설 고객은 인건비 압박을 받고 있어 제품 제안도 '사람 손이 덜 가는가'가 기준이 된다. 기관 영업 자료에 착용·교체에 드는 시간과 손이 얼마나 덜 가는지를 먼저 보여 준다."], "bars": {"t": "인력 배치 기준: 입소자 몇 명당 1명인가 (작을수록 촘촘)", "u": "명", "rows": [["간호인력(2008~ 현재)", 25, "a"], ["요양보호사(2022.10)", 2.5, "c"], ["요양보호사(2025.1)", 2.1, "b"]]}, "nums": [["24.7", "%", "간호사가 근무하는 요양시설", 1], ["25", "명당 1명", "간호사 또는 간호조무사 기준"]], "video": {"title": "요양원에는 간호사가 단 1명도 없어도 된다는 현실 #뉴스", "url": "https://www.youtube.com/watch?v=NX2GWVFADk4"}, "src": "KDI 보고서 요약 페이지 · 아이뉴스24 https://www.inews24.com/view/2022028", "grade": "확인"}, {"tm": "장 Ⅲ", "name": "권정현", "co": "KDI 연구위원 · 분석 결과", "title": "간호인력 숙련 구성의 변화와 수급자의 의료서비스 이용", "q": "숙련 간호사 비중이 10%p 늘면 건강보험 진료비가 7.7% 줄어듭니다.", "hl": ["10%p", "7.7%"], "pts": ["<b>자료와 방법:<\/b> 2016~2023년 계속 운영한 요양시설 2,890곳, 장기요양 청구와 건강보험 명세서를 개인 단위로 이은 수급자-월 자료 10,841,626건. 2018년 최저임금 급등을 외부 충격으로 삼은 도구변수(2SLS) 분석.", "<b>1단계 — 비용이 숙련을 밀어냈다:<\/b> 최저임금 인상으로 간호인력 중 간호사 비중이 4.25%p 하락. 시설 단위로 간호사 고용 2.1% 감소, 간호조무사 고용 6.0% 증가.", "<b>설립 주체 차이:<\/b> 개인 시설보다 국공립·지자체 시설은 간호사 비중이 37.8%p, 법인 시설은 6.3%p 높다.", "<b>2단계 — 건강 효과:<\/b> 간호사 비중 10%p 증가 시 총내원일수 0.33%, 입원일수 0.49%, 건강보험 진료비 7.7% 감소.", "<b>질환별:<\/b> 욕창으로 인한 의료 이용 0.1%, 요로감염 0.03% 감소(SBS Biz). 인플루엔자·폐렴 등 감염성 질환과 치매도 감소(KDI). 암·우울증·당뇨·고혈압은 일부 늘어난 값이 나와 신중히 해석해야 한다.", "<b>방법상 주의:<\/b> 건강이 나쁜 수급자가 간호사 많은 시설을 고르는 경향 탓에, 이를 걸러 내지 않으면 입원일수가 오히려 늘어 보인다. 중증(1·2등급) 비율이 높을수록 간호사 비중도 높았다.", "<b>우리에게:<\/b> 욕창·요로감염이 '간호 관리로 줄어드는 질환'으로 공식 연구에 잡혔다. 요실금팬티·위생용품은 시설의 피부·위생 관리 업무와 이어지지만, 질환 예방 효과로 광고하면 안 되고 '관리가 편한 제품'으로만 말한다."], "bars": {"t": "개인 시설 대비 간호사 비중이 얼마나 높은가 (%p)", "u": "%p", "rows": [["국공립·지자체", 37.8, "a"], ["법인", 6.3, "b"], ["개인(기준)", 0, "c"]]}, "nums": [["7.7", "%", "건강보험 진료비 감소(10%p당)", 1], ["4.25", "%p", "최저임금 뒤 간호사 비중 하락", 1], ["6.0", "%", "간호조무사 고용 증가"], ["2.1", "%", "간호사 고용 감소"]], "src": "KDI 보고서 요약 페이지 · 정책브리핑 속기록 https://www.korea.kr/briefing/policyBriefingView.do?newsId=156787752 · SBS Biz", "grade": "확인"}, {"tm": "장 Ⅳ", "name": "권정현", "co": "KDI 연구위원 · 결론 및 정책 대응", "title": "간호사 비중 요건, 재정 통합 평가, 수가 연동", "q": "장기요양에는 비용이지만 건강보험에는 절감이니, 두 재정을 함께 봐야 합니다.", "hl": ["함께"], "pts": ["<b>제안 ① 배치 기준 개선:<\/b> 간호사 비중 요건을 명시하는 방안 검토. 선례는 간호사 비중 60% 이상을 요구하는 노인요양시설 '전문요양실' 시범사업. 현재 수가의 간호사 배치 가산은 충분하지 않다고 봤다.", "<b>제안 ② 재정 평가 방식:<\/b> 간호 기능 강화는 장기요양보험엔 비용이지만 건강보험 진료비 절감으로 이어질 수 있어 두 재정을 함께 평가해야 한다.", "<b>제안 ③ 수가 보완:<\/b> 고용 비용이 크게 변하면 장기요양 수가와 가산 체계를 함께 조정해 숙련 인력 고용을 유지한다.", "<b>언론 요약:<\/b> 간호사와 간호조무사를 구분하지 않고 총량만 보는 현재 배치를 고쳐야 한다(SBS Biz, 기자 요약).", "<b>우리에게:<\/b> 배치 기준·전문요양실·수가 가산이 바뀌면 시설의 운영비 구조와 구매 품목이 달라진다. 급여·고시 감시 목록에 '요양시설 간호인력 기준'과 '전문요양실 시범사업'을 넣는다."], "nums": [["60", "%+", "전문요양실 시범 간호사 비중 요건", 1], ["3", "개", "정책 제안"]], "video": {"title": "요양원 4곳 중 1곳만 간호사 근무…\"의무배치 기준 필요\"", "url": "https://www.youtube.com/watch?v=kkAAOQTjSk4"}, "src": "KDI 보고서 요약 페이지 · SBS Biz https://biz.sbs.co.kr/amp/article/20000343918", "grade": "확인"}, {"tm": "해외 · 미국", "name": "CMS(미국 메디케어·메디케이드 서비스센터)", "co": "미국 · 연방관보 임시최종규칙 · 공표 2025-12-03, 시행 2026-02-02", "title": "너싱홈 최소 간호인력 기준 폐지", "q": "2024년에 만든 너싱홈 최소 인력 기준을 없애고 2016년 요건으로 되돌렸습니다.", "hl": ["되돌렸습니다."], "pts": ["<b>시장 상황:<\/b> 2024-05-10 최종규칙의 최소 인력 기준을 폐지하는 임시최종규칙. 2016-10-04 규칙의 인력 요건으로 복귀. 시설 평가 강화와 지불 투명성 규정은 남겼다.", "<b>숫자:<\/b> 2025년 예산법(Public Law 119-21) Section 71111이 2034-09-30까지 2024년 기준 시행·집행을 금지. 2024년 규칙이 내세운 편익은 '연 13,000명 생명 구제'였다.", "<b>반응:<\/b> 캘리포니아 등 주 법무장관 연합이 2026-02-02경 반대 의견서를 냈다. 2026년 중반 이후 소송 상태는 확인하지 못했다.", "<b>국내와 비교:<\/b> 미국은 연방 최소 기준이 사라져 시설 재량이 커졌고, 한국은 비율 규제는 있지만 간호사 배치 시설이 24.7%뿐. KDI 결론(간호사 비중 요건 명시)과 반대 방향이다.", "<b>우리에게:<\/b> 인력 규제가 풀리는 쪽이든 조이는 쪽이든 시설은 적은 인원으로 돌봐야 한다. 일손을 덜어 주는 용품이라는 메시지는 두 방향 모두에서 통한다."], "nums": [["2034", "년 9월", "2024년 기준 집행 금지 시한", 1], ["13,000", "명/년", "2024년 규칙이 내세운 생명 구제 추정"]], "table": [["나라 · 항목", "숫자 (원문 확인된 것만)"], ["독일 · 간호보험 적자 전망", "2027년 약 76억 유로, 2028년 150억 유로 초과"], ["독일 · 일반 보험료율 목표", "3.6% 유지"], ["중국 · 장기요양보험 가입(2016 시범 이후)", "약 3.1억 명"], ["중국 · 수혜자", "330만 명 이상"], ["영국 · 공정임금협약 투입", "5억 파운드"], ["한국(비교) · 간호사 근무 요양시설", "24.7%"]], "src": "미국 연방관보 2025-21792 · HHS 보도자료 (두 곳 모두 직접 열지 못해 조사원 보고 기준)", "grade": "추정"}, {"tm": "해외 · 독일", "name": "독일 연방정부", "co": "독일 · 연방정부 발표 · 2026-01-01 시행", "title": "간호권한확대법 시행과 간호보조직 통일", "q": "간호전문인력이 의사 지시 없이 만성질환 관리 등 일부 의사 업무를 맡습니다.", "hl": ["의사", "지시"], "pts": ["<b>제도:<\/b> 연방의회 2025-11-06 통과, 연방참사원 2025-12-19 승인, 2026-01-01 시행. 간호전문인력이 만성질환 관리 등 기존 의사 업무 일부를 직접 수행.", "<b>숫자:<\/b> 간호보조전문인력 통일 직업 신설법은 연방참사원 2025-10-17 동의, 대부분 2027-01-01 시행, 교육은 보통 풀타임 18개월.", "<b>반응:<\/b> KDI 보고서가 촉탁의·외부 의사 의존을 줄인 사례로 직접 인용했다.", "<b>국내와 비교:<\/b> 독일은 간호사 권한 확대와 보조직 통일, 한국은 간호조무사까지 묶은 총량 규제 단계.", "<b>우리에게:<\/b> 간호 인력의 역할이 커지는 흐름은 시설 안 건강관리 용품을 '간호 인력이 고르는' 구조를 만든다. 기관 영업 대상에 시설 간호 책임자를 넣을 근거가 된다."], "nums": [["18", "개월", "간호보조전문인력 교육 기간(풀타임)"]], "src": "독일 연방정부 https://www.bundesregierung.de/breg-de/schwerpunkte/wirksam-regieren/befugnisse-pflegekraefte-2376966 (조사원 보고 기준)", "grade": "추정"}, {"tm": "해외 · 독일", "name": "독일 연방정부", "co": "독일 · 내각 의결 · 2026-09-30", "title": "간호보험 재정 개편(PNOG) 내각 의결", "q": "개혁이 없으면 2028년 간호보험 적자가 150억 유로를 넘습니다.", "hl": ["150억"], "pts": ["<b>시장 상황:<\/b> 간호보험 재정 개편안을 내각이 의결. 아직 법이 아니라 입법 초기 단계.", "<b>숫자:<\/b> 개혁 없으면 적자 2027년 약 76억 유로, 2028년 150억 유로 초과. 일반 보험료율은 3.6% 유지가 목표.", "<b>일정:<\/b> 구조개혁은 전문가위원회로 넘겨 2027년 1월 말까지 제안, 후속 개혁 시행 목표 2027-07-01. 무자녀 가산 0.6%→0.9%(2027-01-01)는 독일 언론 보도뿐이라 확인 전.", "<b>국내와 비교:<\/b> 독일은 보험료율을 묶고 부담자를 차등하는 길을 택했다. 한국은 2027년 장기요양 보험료율이 0.9994%로 5.78% 오른다(지식창고 앞선 정리 기준).", "<b>우리에게:<\/b> 장기요양 재정 압박은 한국·독일 모두 같다. 급여 품목 단가·한도 조정 소식이 나올 수 있으니 복지용구 급여 가격 변동을 계속 지켜본다."], "bars": {"t": "독일 간호보험 적자 전망 (개혁이 없을 때, 억 유로)", "u": "억 유로", "rows": [["2027년", 76, "b"], ["2028년", 150, "a"]]}, "nums": [["3.6", "%", "일반 보험료율 유지 목표", 1]], "src": "독일 연방정부 https://www.bundesregierung.de/breg-de/aktuelles/pflegeneuordnungsgesetz-2454862", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 중공 중앙판공청·국무원 판공청", "co": "중국 · 정부 지침 · 2026-03-25", "title": "전국 장기요양보험 제도 구축 지침", "q": "시범 10년 만에 장기요양보험을 전국 제도로 만듭니다.", "hl": ["전국"], "pts": ["<b>제도:<\/b> 장기요양보험 시행을 서두르는 지침 발표. 2016년 시범 시작 뒤 전국 단일 제도로 가는 단계.", "<b>숫자:<\/b> 가입 약 3.1억 명, 수혜 330만 명 이상(상하이시 정부 영문 페이지). 2025년 9월 서비스 목록 발표 — 생활돌봄 20종, 의료돌봄 16종.", "<b>확인 전:<\/b> 시범 도시 수(49곳, CGTN은 92곳으로 확대라 엇갈림), 재가·시설 비용 50~70% 보장, 2028년 전국 적용(SCMP)은 검색 요약 수준.", "<b>국내와 비교:<\/b> 한국은 2008년부터 전 국민 사회보험, 중국은 이제 전국 단일 제도로 가는 길.", "<b>우리에게:<\/b> 수혜자 330만 명 규모의 돌봄 시장이 제도로 커진다. 당장 진출 대상은 아니지만 일본 다음 수출 후보로 복지용구 급여 품목 구조를 지켜본다."], "nums": [["3.1억", "명", "장기요양보험 가입", 1], ["330만", "명+", "수혜자"], ["36", "종", "보장 서비스(생활 20 + 의료 16)"]], "src": "상하이시 정부 https://english.shanghai.gov.cn/en-Latest-WhatsNew/20260326/4b11be81f33b4b5988749f1b13620b67.html · CGTN", "grade 인력 배치 기준", "easy": "입소자 몇 명당 간호사·간호조무사가 몇 명 있어야 하는지 정한 규칙(지금은 25명당 1명).", "why": "기준이 바뀌면 시설 고객의 인건비·운영비가 달라진다.", "video": {"title": "요양원 4곳 중 1곳만 간호사 근무…\"의무배치 기준 필요\"", "url": "https://www.youtube.com/watch?v=kkAAOQTjSk4"}}, {"term": "숙련 간호인력 비율", "easy": "시설 간호인력 가운데 간호사가 차지하는 비중(이 보고서의 정의).", "why": "시설의 돌봄 질을 비교하는 지표로, 국공립·법인 시설이 더 높다.", "video": {"title": "노인은 늘어나는데 간호 인력은 부족하다? 요양원의 불편한 현실", "url": "https://www.youtube.com/watch?v=dUMwp1wF0LY"}}, {"term": "도구변수(2SLS)", "easy": "최저임금 인상처럼 시설이 고를 수 없는 바깥 변화를 이용해, 간호사 비중의 효과만 떼어 내는 통계 방법.", "why": "7.7%라는 숫자가 단순 비교가 아니라는 근거라, 숫자를 인용할 때 믿을 만한 정도를 판단하게 해 준다."}, {"term": "내생성", "easy": "건강이 나쁜 사람이 간호사 많은 시설을 골라 효과가 가려지거나 거꾸로 보이는 문제.", "why": "연구 숫자를 과장해 쓰지 않아야 하는 이유다."}, {"term": "%p(퍼센트포인트)", "easy": "비율끼리의 차이. 10%에서 20%가 되면 10%p 오른 것.", "why": "보고서의 '간호사 비중 10%p'와 '진료비 7.7%'를 헷갈리지 않게 한다."}, {"term": "건강보험 진료비", "easy": "건강보험이 병원에 내주는 돈.", "why": "장기요양에 돈을 더 쓰면 건강보험 돈이 줄 수 있다는, 두 재정이 이어진 구조를 보여 준다."}, {"term": "수가·가산", "easy": "서비스 한 건에 정해진 값 / 인력을 더 두는 등 조건을 맞추면 더 얹어 주는 돈.", "why": "시설의 수입 구조라 구매 여력과 바로 이어진다."}, {"term": "전문요양실 시범사업", "easy": "간호사 비중 60% 이상을 요구하는 요양시설 안 특화 공간 시범사업.", "why": "의료 필요가 큰 입소자가 모이는 곳이라 새 급여 품목·영업 대상이 생길 수 있다."}]}</script>
