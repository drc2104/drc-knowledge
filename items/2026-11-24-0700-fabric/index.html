"효성티앤씨 × 산토니(Santoni)", "co": "한국·이탈리아 · TIN뉴스 · 2026-11-23 21:49 · 11/18 소식의 후속", "title": "사탕수수 바이오 스판덱스로 만든 무봉제 컬렉션 — 기존 공정에 '그대로 넣는' 소재", "q": "바이오 스판덱스가 무봉제 기계의 공정을 크게 바꾸지 않고 그대로 들어가는 소재로 공개됐다.", "hl": ["그대로"], "pts": ["<b>무엇이 새로운가:<\/b> 11/18 보도에 없던 내용이 새로 나왔다. regen BIO 스판덱스는 사탕수수에서 얻은 재생 원료가 약 70%이고, 베트남에서 상업 생산을 시작한 뒤 이뤄진 협업이다. 공개는 이탈리아 베네치아 지속가능 패션 포럼(VSFF, 11월 5~6일).", "<b>숫자:<\/b> 바이오 원료 약 70%(업체). 산토니 환편기 SM8-TOP2ST의 특허 '선택적 테리' 기술로 특정 부위에만 쿠션감을 준다. 가격·시험 수치는 기사에 없다.", "<b>마케팅:<\/b> 국제 지속가능 패션 포럼에서 공개해 유럽 브랜드와의 접점을 넓혔다. 기존 무봉제 공정을 크게 바꾸지 않는 '드롭인' 소재라는 점을 내세웠다(업체 주장).", "<b>고객 반응:<\/b> 원사·원단 단계라 소비자 후기는 없다.", "<b>우리에게:<\/b> 무봉제 속옷·요실금팬티 겉감에 바이오 스판덱스를 넣을 수 있는지 샘플과 바이오 함량 시험서를 요청할 근거다. '선택적 테리'는 흡수층을 특정 부위에만 두껍게 짜는 구조 아이디어로 이어진다."], "nums": [["70", "%", "사탕수수 재생 원료 비중 (약, 업체)", 1], ["2", "일", "베네치아 지속가능 패션 포럼 공개 (11/5~6)"]], "src": "TIN뉴스 2026-11-23 (원문 열람, 업체 주장 포함)", "grade": "확인"}, {"tm": "중 · 11.23", "name": "앰피코(Amphico) × 올메텍스(Olmetex) × 아쿠아필(Aquafil)", "co": "영국·이탈리아 · TIN뉴스 · 2026-11-23 22:27", "title": "'염색에서 직조로' — 습식 염색 없이 짜면서 색을 만든다", "q": "실을 만들 때 넣은 색 6가지를 조합해, 염색 공정 없이 직조만으로 5,000가지 이상 색을 낸다.", "hl": ["염색", "공정", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> '앰피컬러(Amphicolor)'는 원착사(염료를 실 만들 때 넣은 실)와 색 예측 소프트웨어를 묶어 염색 없이 직조만으로 색을 구현한다. 40데니어 시연 조끼는 검정·초록·빨강 원착사 조합으로 갈색을 냈다.", "<b>숫자:<\/b> 기본 원사 6색으로 5,000가지 이상 검증 색상. 올메텍스와 2027/28 F/W 시즌용 직물 약 200종을 40데니어 나일론6(ECONYL 재생 나일론)으로 만든다. 색 개발 기간 6~12주 → 2~4주(업체 주장).", "<b>마케팅:<\/b> 시즌 컬렉션을 앞세운 기업 간 소재 공개다.", "<b>고객 반응:<\/b> 소재 단계라 해당 없음.", "<b>국내와 비교:<\/b> 같은 날 국내에서는 대구염색산단 배출기준 강화 소식이 나왔다. 염색 공정이 해외에서는 기술로, 국내에서는 규제로 동시에 압박받는다.", "<b>우리에게:<\/b> 색 개발이 짧아지면 스킨톤 여러 색을 소량으로 개발하기 쉬워질 수 있다. 다만 속옷용 40데니어 이하 얇은 나일론의 색 균일성·견뢰도는 시험이 필요하다."], "bars": {"t": "색 개발 기간 (주, 업체 주장 · 범위의 최대값)", "u": "주", "rows": [["기존 염색", 12, "c"], ["앰피컬러", 4, "a"]]}, "nums": [["5,000", "색+", "검증 색상 (기본 원사 6색 조합)", 1], ["200", "종", "2027/28 F/W 직물 컬렉션 (약)"], ["40", "데니어", "재생 나일론6 원사 굵기"], ["6", "색", "기본 원착사"]], "src": "TIN뉴스 2026-11-23 (원문 열람, 업체 주장)", "grade": "확인"}, {"tm": "중 · 11.21", "name": "유엔환경계획(UNEP)", "co": "국제(제네바) · UNEP 보도자료 11/21 · phys.org(AFP) 11/23 · 한국섬유신문 11/23", "title": "글로벌 화학물질 프레임워크 첫 국제회의 — 섬유 포함 업종 참여 프로그램 채택", "q": "건설·전자·보건·섬유 업종을 함께 묶은 산업 참여 프로그램이 채택됐다.", "hl": ["섬유"], "pts": ["<b>무엇이 새로운가:<\/b> 제네바 제1차 국제회의에서 '건설·전자·보건·섬유' 업종을 아우르는 산업 참여 프로그램을 채택했다. 섬유만의 규정이 아니라 큰 틀 안의 한 부분이다.", "<b>숫자:<\/b> 110개국이 프레임워크 채택, 회의 참석 140개국, 목표 28개(대부분 2030년까지), 기금 연장 2035년, 다음 모임 2029년 몰타. 섬유 전용 수치는 기사에 없다.", "<b>마케팅:<\/b> 해당 없음(국제기구 회의).", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 11/17 ZDHC MRSL 4.0, 11/20 화섬협회 설명회에 이어 화학물질 관리가 원단 단계로 내려오는 흐름이다.", "<b>우리에게:<\/b> 구속력 있는 규제는 아니지만 PFAS·염료·가공제 정보 요구가 브랜드 거래처에서 먼저 올 수 있다. 원단사에 화학물질 정보를 받아 두는 습관을 만든다."], "bars": {"t": "글로벌 화학물질 프레임워크 (나라 수)", "u": "개국", "rows": [["회의 참석", 140, "c"], ["프레임워크 채택", 110, "a"]]}, "nums": [["28", "개", "목표 (대부분 2030년까지)", 1], ["2035", "년", "기금 연장"], ["2029", "년", "다음 모임 (몰타)"]], "src": "phys.org 2026-11-23 (원문 열람) · UNEP 보도자료(원문 403, 검색 요약) · 한국섬유신문(제목만)", "grade": "확인"}, {"tm": "중 · 11.23", "name": "대구염색산업단지관리공단 · 대구시", "co": "한국 · TIN뉴스 · 2026-11-23 15:53", "title": "배출허용기준 강화, \"속도 조절 필요\" — 시행 2028년 1월 1일 계획", "q": "대구시가 염색산단 냄새·물질 배출 기준을 2028년부터 두 단계로 강화하려 하고, 공단은 속도 조절을 요구했다.", "hl": ["두", "단계로"], "pts": ["<b>무엇이 새로운가:<\/b> 대구시 계획은 2028년 1월 1일부터 배출구 750ppm 이하·부지경계선 17ppm 이하, 2029년부터 배출구 500ppm·경계선 15ppm이다. 공단은 시설 교체 부담을 들어 속도 조절을 요구했다.", "<b>숫자:<\/b> 대상 면적 84만 9,684㎡. 노후 대기방지시설 교체에 약 650억 원. 2023~2025년 악취 429건 중 34건이 기준 초과. 1~10월 증기 공급 101만 3,327톤(-4.3%), 폐수 유입 1,239만 2,663㎥(-3.4%).", "<b>일정:<\/b> 의견수렴 12월 4일까지, 조례 개정 2027년 3월(예정).", "<b>고객 반응:<\/b> 해당 없음(규제 소식).", "<b>우리에게:<\/b> 염색 비용이 오르면 국내 염색 원단 단가에 반영될 수 있다. 11/21 대구 화섬직물 신규 주문 급감 소식과 합치면 국내 원단사와의 협상 여지는 있지만, 공장 가동률 저하는 납기 위험이 된다."], "bars": {"t": "증기 공급·폐수 유입 증감 (1~10월, 전년 대비 %)", "u": "%", "rows": [["증기 공급", -4.3, "b"], ["폐수 유입", -3.4, "c"]]}, "nums": [["650", "억 원", "노후 대기방지시설 교체 비용 (약)", 1], ["34", "건", "악취 기준 초과 (2023~2025년 429건 중)"], ["84만 9,684", "㎡", "대상 면적"], ["12.4", "까지", "대구시 의견수렴 마감"]], "table": [["시행 시기 (계획)", "배출구 · 부지경계선"], ["2028년 1월 1일부터", "750ppm 이하 · 17ppm 이하"], ["2029년부터", "500ppm · 15ppm"]], "src": "TIN뉴스 2026-11-23 (원문 열람)", "grade": "확인"}, {"tm": "중 · 11.23", "name": "한국생산기술연구원 · 세종대 연구팀", "co": "한국 · TIN뉴스 · 2026-11-23 18:20 · 논문 Advanced Materials 11/5 온라인 게재", "title": "실크 나노섬유 항균·생분해 필터 (마스크용)", "q": "천연 실크 나노섬유에 항균 성분을 붙여, LED 빛을 3시간 쬐면 균이 약 99.99% 줄어드는 필터를 만들었다.", "hl": ["99.99%"], "pts": ["<b>무엇이 새로운가:<\/b> 천연 실크 나노섬유에 소듐 구리 클로로필린(SCC)과 4급 암모늄 화합물(QAC)을 결합한 항균 필터다. 연구 단계다.", "<b>숫자:<\/b> 가시광 4시간 조사 시 활성산소 생성이 SCC 단독보다 약 33% 증가. 황색포도상구균은 PP 필터 대비 빛 없이 3시간 약 94.8%, LED 3시간 약 99.99% 감소. IPA 증기 24시간 노출 뒤 포집효율 감소는 상용 KF94 31.2%, 개발 섬유 1.8%. 토양 매립 약 7주 시험에서 구조 상당 부분이 무너졌다.", "<b>마케팅:<\/b> 해당 없음(연구 발표).", "<b>고객 반응:<\/b> 해당 없음.", "<b>우리에게:<\/b> 속옷 원단이 아니라 마스크 필터라 직접 적용은 어렵다. 다만 항균 시험 수치를 적는 방식(균 종류·시간·빛 조건)은 우리 항균 원단 시험 의뢰서에 그대로 참고할 만하다."], "bars": {"t": "IPA 증기 24시간 뒤 포집효율 감소 (%)", "u": "%", "rows": [["상용 KF94", 31.2, "c"], ["개발 섬유", 1.8, "a"]]}, "nums": [["99.99", "%", "황색포도상구균 감소 (LED 3시간, 약)", 1], ["94.8", "%", "황색포도상구균 감소 (빛 없이 3시간, 약)"], ["33", "%", "활성산소 생성 증가 (SCC 단독 대비, 약)"], ["7", "주", "토양 매립 생분해 시험 (약)"]], "src": "TIN뉴스 2026-11-23 (원문 열람)", "grade": "확인"}, {"tm": "중 · 11.19", "name": "Norrøna × Uluu", "co": "노르웨이·호주 · Just Style 2026-11-19 · Knitting Trade Journal 제목 11/17", "title": "해초에서 얻은 PHA로 방적한 섬유 — 아웃도어 폴리·나일론 대체 목표", "q": "해초 당을 발효해 만든 생분해 플라스틱으로 실을 뽑았고, 아웃도어 브랜드가 성능 시험에 들어간다.", "hl": ["해초", "생분해"], "pts": ["<b>무엇이 새로운가:<\/b> 호주 Uluu가 해초 당을 발효해 만든 생분해 폴리머(PHA)를 핵심 성분으로 이미 섬유를 방적했고, 노르웨이 Norrøna가 내구성·성능 시험을 진행할 계획이다. 방수·방풍 소재까지 노린다는 별도 보도도 있다(미확인).", "<b>숫자:<\/b> 가격·시험 수치는 기사에 없다. 상업화 일정 미공개, 성능 기준을 통과해야 제품에 쓴다.", "<b>마케팅:<\/b> 폴리에스터·나일론을 대체할 생분해 섬유라는 점을 앞세웠다.", "<b>고객 반응:<\/b> 시험 전이라 해당 없음.", "<b>국내와 비교:<\/b> 국내에는 같은 시기 생분해 합성섬유 소식이 없었다.", "<b>우리에게:<\/b> 'PFAS 없는 방수 + 생분해'를 노리는 유럽 흐름을 확인하는 정도다. 단기 적용은 어려워 샘플 문의 대상이 아니고 감시 명단에 둔다."], "src": "Just Style 2026-11-19 (원문 열람) · Textile Today 본문 미열람", "grade": "확인"}, {"tm": "하 · 11.23", "name": "렌징(Lenzing) × TreeToTextile", "co": "오스트리아·스웨덴 · EuropaWire 보도자료 · 2026-11-23", "title": "스웨덴 시범 공장 방문 — 차세대 셀룰로오스 섬유, EU 첫 대형 공장 계획 단계", "q": "텐셀을 만드는 렌징이 최대주주가 된 스웨덴 신섬유 회사가 대형 공장 계획으로 넘어간다.", "hl": ["대형", "공장"], "pts": ["<b>무엇이 새로운가:<\/b> 렌징 경영진이 TreeToTextile의 스웨덴 시범 공장(Nymölla)을 찾았다. 다음 단계는 EU 첫 대형 공장 계획이다.", "<b>숫자:<\/b> 렌징은 2025년 2월 첫 투자, 2026년 2월부터 최대주주. 시범 공장은 2024년 초부터 가동. EU LIFE TreeTex 보조금 협약 2022년, 사업 기간 2028년 말까지. 용량·비용 숫자는 없다.", "<b>마케팅:<\/b> 업체 보도자료다.", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 국내에는 셀룰로오스 신섬유 생산 소식이 없었다.", "<b>우리에게:<\/b> 텐셀·모달 계열 공급 구조가 바뀔 가능성을 감시한다. 지금 가격·품질 영향은 없다."], "nums": [["2026", "년 2월", "렌징 최대주주 전환", 1], ["2024", "년 초", "시범 공장 가동 시작"], ["2028", "년 말", "EU LIFE TreeTex 사업 종료"]], "src": "EuropaWire 2026-11-23 (원문 열람, 업체 보도자료)", "grade": "확인"}, {"tm": "하 · 11.16", "name": "丝丽雅(Silliya 그룹) × 中乔体育(중팅체육)", "co": "중국 · 澎湃(The Paper) · 2026-11-16 (행사 11/12 이빈)", "title": "생물기반 신섬유 '雅赛尔(Yasell)'로 스포츠 의류 확대", "q": "중국 셀룰로오스계 신섬유가 스포츠 브랜드 옷으로 29개 지역에 팔리고 있다.", "hl": ["29개"], "pts": ["<b>무엇이 새로운가:<\/b> 2025년 6월 협력을 시작해 2026년 10월까지 2개 시즌 공동 상품을 냈다. 아이템은 캐주얼 바지·맨투맨·폴로·카라 티 4종이다.", "<b>숫자:<\/b> 판매 29개 지역, 2개 시즌, 4종. 섬유 특징은 업체가 '강하다·수축 적다·통기성·보풀 적음'으로 설명했고 시험값은 없다.", "<b>마케팅:<\/b> 소재 이름(Yasell)을 브랜드 옷과 함께 소비자에게 내보낸다. 2세대(마 느낌·저탄소 라인)를 개발 중이다.", "<b>고객 반응:<\/b> 기사에서 확인되지 않음.", "<b>국내와 비교:<\/b> 국내에는 신섬유를 브랜드와 공동으로 내놓은 소식이 없었다.", "<b>우리에게:<\/b> 중국 신섬유가 소비자에게 나가는 속도를 확인하는 정도다. 속옷 적용 정보는 없다."], "nums": [["29", "개 지역", "판매 지역", 1], ["2", "시즌", "공동 상품 (2025.6 ~ 2026.10)"], ["4", "종", "아이템"]], "src": "澎湃 2026-11-16 (원문 열람, 업체 제공 자료)", "grade": "확인"}, {"tm": "하 · 11.23", "name": "이벤트패브릭스(eVent fabrics) · 공급 지오앤다나", "co": "한국 · 어패럴뉴스 · 2026-11-23", "title": "아웃도어 하이킹 행사 협찬으로 소재 브랜딩", "q": "원단 소재 회사가 소비자 행사를 협찬해 소재 이름을 직접 알린다.", "hl": ["소재", "이름을"], "pts": ["<b>무엇이 새로운가:<\/b> 하이킹 행사 'OTT(On the Trail)'를 협찬했다. 독자 기술 '다이렉트 벤팅'은 미세다공성 막으로 안쪽 습기를 밖으로 내보낸다.", "<b>숫자:<\/b> 행사는 2015년 4월 시작. 방수
