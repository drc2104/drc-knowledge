iewNote": "소식 9개 중 국내 3(KTI 국산소재포럼·나우 인 대구·한국섬유소재연구원)·해외 6(일본 TA프론티어·베넥스·도레이×코쿠요, 영국 Francis Moore, 호주·미국 Zhik×eVent, 중국 ITMA ASIA·CITME)입니다. 원단 완성 가격(1m당·1장당)은 이번에도 확인된 것이 없어 원료·원사 가격 변동으로 대신했습니다. 일본 소식 2건(TA프론티어·베넥스)과 경기도 지원 소식은 본문을 열지 못해 '추정'으로 표시했습니다. 원단·원사 소식이라 고객 후기는 대상이 아닙니다.", "sectionLabel": "소식", "sections": [{"tm": "중 · 11.24", "name": "TA프론티어 (옛 데이진 프론티어·아사히카세이 어드밴스 통합)", "co": "일본 · Fashionsnap(구글뉴스 경유) · 2026-11-24", "title": "폴리에스터 섬유 추가 가격 인상 보도", "q": "제조 비용 상승이 멈추지 않아 폴리에스터를 다시 올린다는 보도가 나왔다.", "hl": ["다시"], "pts": ["<b>무엇이 새로운가:<\/b> 기사 제목은 제조 비용 상승에 제동이 걸리지 않는다는 취지로 폴리에스터 섬유 등을 추가로 올린다는 내용이다. 인상 폭·시행일·품목은 본문을 열지 못해 확인하지 못했다. 10/01 통합으로 회사 이름은 TA프론티어다.", "<b>숫자:<\/b> 앞선 인상(별도 출처, 검색 요약만 봄): 데이진 프론티어 4/7 출하분부터 폴리에스터 섬유 20% 이상·원단 15~25%(중동 정세로 인한 원유 공급 불안), 도레이 4월 폴리·나일론 일부 kg당 20~110엔 이상, 쿠라레이트레이딩 5/1 출하분부터 10~15%.", "<b>마케팅:<\/b> 해당 없음(원료 가격 소식).", "<b>고객 반응:<\/b> 해당 없음.", "<b>국내와 비교:<\/b> 국내도 코오롱 PET 칩 시장가가 1월 톤당 970달러에서 9월 1,372달러로 41.4% 올라(11/20 보도) 같은 방향이다.", "<b>우리에게:<\/b> 원단 견적·가격 행사 계획에 원가 상승 여유를 넣는다. 원단 발주 전 견적 유효기간을 확인한다."], "nums": [["20", "%+", "데이진 프론티어 폴리에스터 섬유 4월 인상 (검색 요약)", 1], ["15~25", "%", "같은 회사 원단 4월 인상 (검색 요약)"], ["10~15", "%", "쿠라레이트레이딩 5월 인상 (검색 요약)"]], "bars": {"t": "국내 PET 칩 시장가 (달러/톤, 같은 방향 참고)", "u": "달러", "rows": [["2026년 1월", 970, "c"], ["2026년 9월", 1372, "a"]]}, "src": "Fashionsnap 11/24 기사 제목(구글뉴스 RSS) · 4월 인상은 Fashionsnap 4/8 기사 검색 결과 요약 (본문 미열람)", "grade": "추정"}, {"tm": "중 · 11.25", "name": "KTI(Korea Textile Initiative) 국산소재포럼", "co": "한국 · 어패럴뉴스 · 2026-11-25 (포럼 11/23, KOTITI시험연구원 과천 사옥)", "title": "\"한국을 다시 소싱 허브로\" — 연구기관·원단사가 특허·소재 공유", "q": "국내 연구기관과 원단·원사 기업이 함께 국산 소재를 알리는 네트워크를 만들었다.", "hl": ["함께"], "pts": ["<b>무엇이 새로운가:<\/b> 강태진 서울대 명예교수가 주축인 산·학·연 네트워크다. KOTITI시험연구원·DYETEC연구원·한국섬유개발연구원과 영원무역·휴비스·벤텍스·삼일방이 보유 특허·소재를 공유했다.", "<b>숫자:<\/b> KOTITI 'KOLORi'는 염색 시간을 50%에서 최대 70%까지 줄인다고 설명했다(기관 주장). 휴비스는 세계일류상품 10개 + 차세대 7개 = 17개 보유. 벤텍스는 유럽·중국·일본 대형 패션기업과 파트너십을 맺고 2027년부터 상품화한다(업체 주장).", "<b>마케팅:<\/b> 삼일방은 코어실·쿨·
