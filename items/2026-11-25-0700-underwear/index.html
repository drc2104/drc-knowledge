"숫자 출처: PR TIMES 다이오제지 발표문(원문 직접 열람), 에너지경제·싱글리스트(그리티), 더쎈뉴스(소나버스), Yahoo/The Cool Down(뉴저지 법안, 법안 원문은 열기 실패), PR Newswire(Vanity Fair), 新欧洲(温州日报 전재), 대한경제(29CM), 베이비뉴스(유한킴벌리), Stock Titan(빅토리아 시크릿 공시 요약). 업체 숫자는 업체 주장입니다. 쿠팡·네이버·와디즈·샤오훙수는 열리지 않아 고객 후기 원문은 확보하지 못했습니다. 통화가 달라 원화로 바꾸지 않았습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.19", "name": "다이오제지(大王製紙) 아텐트", "co": "일본 · PR TIMES 발표문 · 발표 09.09 · 발매 10.21 · 時事通信 재보도 11.19 [지난 소식]", "title": "와코루와 공동개발한 '극박 흡수팬티'·'스마트 박서팬티' — 흡수 140cc 요실금 속옷", "q": "일회용 요실금 팬티가 속옷 업체의 손을 빌려 '속옷처럼 얇고 예쁜' 쪽으로 왔다.", "hl": ["속옷처럼"], "pts": ["<b>무엇이 새로운가:<\/b> 와코루 인간과학연구개발센터와 함께 만든 쇼츠형 일회용 흡수팬티. 박형 흡수체는 '아텐트 사상 가장 얇음'(2025-12 자사 조사), 보이쇼츠형은 기존 제품보다 밑위가 20mm 짧다. 색은 '엘레강트 핑크 베이지'.", "<b>숫자:<\/b> 흡수량 두 제품 모두 140cc. 각 2상품 구성, M(60~95cm) 4장 · L(80~110cm, 보이쇼츠는 80~125cm) 4장. 개발 기간 6년. 가격은 오픈가격(금액 없음).", "<b>기능:<\/b> W소취(암모니아·아세트산 냄새 대상), 전면 통기 시트.", "<b>마케팅:<\/b> 'ワコールとの共同開発(와코루와 공동개발)' 문구를 전면에 둔다. 업체는 국내 성인용 기저귀 시장에서 와코루 공동개발 제품이 처음이라고 주장(2026-07 자사 조사). 가격 행사는 없다.", "<b>고객 반응:<\/b> 후기 사이트를 열지 못해 확인하지 못했다.", "<b>우리에게:<\/b> '속옷처럼 얇은' 요실금 속옷 비교표에 두께·색·흡수량 기준으로 넣고, 국내 디펜드·라이프리와 같은 줄에서 비교한다."], "nums": [["140", "cc", "흡수량 (두 제품 모두, 업체 주장)", 1], ["20", "mm", "보이쇼츠형 밑위 단축 (기존 제품 대비)"], ["6", "년", "개발 기간 (업체 주장)"], ["4", "장", "1팩 구성 (M·L 각각)"]], "table": [["사이즈", "허리 둘레", "구성"], ["M", "60~95cm", "4장"], ["L", "80~110cm (보이쇼츠형 80~125cm)", "4장"]], "src": "PR TIMES 다이오제지 발표문 (원문 직접 열람) · 時事通信 11.19는 제목만 확인 (30일 넘긴 지난 소식)", "grade": "확인"}, {"tm": "중 · 11.24", "name": "그리티 '감탄'", "co": "한국 · 공식 온라인몰 · 에너지경제·싱글리스트 11.24", "title": "손예진 레드·블랙 레이스 홀리데이 에디션 + 블랙프라이데이 앵콜 최대 75%", "q": "블프가 끝나기 전에 '연말 커플 선물 세트'로 갈아탄다.", "hl": ["커플"], "pts": ["<b>무엇이 새로운가:<\/b> 여성 브라·팬티와 남성 드로즈를 같은 소재·색으로 맞춘 커플 구성. 브라는 겉감·안감 모두 모달+실크 혼방, 봉제선 대신 '젤리 퓨징'으로 붙였고 팬티·드로즈는 무봉제, 팬티는 반 하이웨스트.", "<b>숫자:<\/b> 블프 앵콜 주요 제품 최대 75% 할인(업체 발표), 행사는 12/1까지. 개별 제품 가격과 모달 혼용률은 기사에 없다.", "<b>마케팅:<\/b> 브랜드 모델 손예진, '특별한 겨울엔, 특별한 레드' 콘셉트, 커플 언더웨어, 블프 앵콜.", "<b>고객 반응:<\/b> 확인하지 못했다.", "<b>우리에게:<\/b> 블프 뒤 12월에 브라·팬티 선물 세트를 붙이는 구성을 참고한다. 모달+실크와 접합(퓨징)이 노와이어·무봉제 브라의 표준 표기가 되어 가고 있다."], "nums": [["75", "%", "블프 앵콜 최대 할인 (주요 제품)", 1], ["12/1", "까지", "앵콜 행사 마감"]], "src": "에너지경제 11.24 (다음 뉴스) · 싱글리스트 11.24", "grade": "확인"}, {"tm": "중 · 11.24", "name": "소나버스 '보듬'", "co": "한국 · 약국 플랫폼 '편한가'·자사몰·스마트스토어·쿠팡 · 더쎈뉴스 11.24", "title": "성인용 팬티형 기저귀, 약국 플랫폼으로 전국 37곳 이상 오프라인 입점", "q": "요실금 제품이 쿠팡을 넘어 '약국에서 상담하고 사는' 길을 연다.", "hl": ["약국에서"], "pts": ["<b>무엇이 새로운가:<\/b> 시니어테크 스타트업 소나버스가 약국 플랫폼 '편한가'로 전국 37곳 이상 약국에 들어갔다. 현직 요양보호사와 함께 개발했다고 소개. 제품은 팬티형 기저귀·속기저귀·위생 깔개매트.", "<b>숫자:<\/b> 주력 팬티형 흡수력 2,000mL(업체 주장). 가격은 기사에 없다. 쿠팡 검색 화면에 '보듬 남녀공용 팬티형' 36,500원이 보였으나 같은 제품인지 확인하지 못했다(리뷰 0건 표시).", "<b>마케팅:<\/b> 대면 상담이 되는 약국 채널을 확보. 고령층뿐 아니라 산모와 요실금 관리가 필요한 성인도 대상이라고 소개한다.", "<b>고객 반응:<\/b> 확인하지 못했다.", "<b>우리에게:<\/b> 요실금팬티도 약국 플랫폼 입점이 가능한지 알아볼 근거다."], "nums": [["37", "곳+", "입점 약국", 1], ["2,000", "mL", "주력 팬티형 흡수력 (업체 주장)"]], "src": "더쎈뉴스 11.24 · 쿠팡 가격은 검색 화면 일부만 봐서 추정", "grade": "확인"}, {"tm": "중 · 10.19", "name": "미국 뉴저지주 상원 법안 S2266", "co": "미국 · 법안·Yahoo(The Cool Down) 10.19 · NewsBreak 재게시 11.23 [지난 소식]", "title": "생리팬티를 포함한 생리용품 PFAS 금지 법안 — 통과하면 8번째 주", "q": "물을 튕기는 화학물질(PFAS) 규제가 재사용 생리용품, 곧 생리팬티까지 이름을 올렸다.", "hl": ["생리팬티까지"], "pts": ["<b>무엇이 새로운가:<\/b> 의도적으로 PFAS를 넣은 생리용품(탐폰·패드·컵·생리용 속옷)의 판매를 재사용·일회용 모두 금지하는 안. 주 환경보호국(DEP) 관리 체계의 시험소에서 PFAS 검사를 하도록 한다.", "<b>숫자:<\/b> 통과하면 이런 법을 둔 8번째 주가 된다. 메인·미네소타 입법 뒤 '생리용품의 96%에서 의도적 PFAS가 나오지 않았다'(단체 Clean Water Action 인용).", "<b>진행 상황:<\/b> 법안 단계로 시행일은 정해지지 않았다. 상원 상무위원회가 10/05 수정 통과시켰다는 내용은 검색 요약으로만 봤고, 법안 원문은 접속이 거부돼 정의 조항을 직접 확인하지 못했다.", "<b>국내와 비교:<\/b> 국내 쪽 같은 내용의 규제 발표는 이번 조사에서 찾지 못했다. 앞선 회차의 EU PFAS 제한안 의견 채택과 같은 방향이다.", "<b>우리에게:<\/b> 방수·흡수층에 쓰는 가공제·막의 PFAS 시험서를 원단 협력업체에 미리 받아 두면, 미국 직구·수출 판매 때 바로 쓸 수 있다."], "nums": [["8", "번째 주", "통과 시 미국 내 순번", 1], ["96", "%", "메인·미네소타 입법 뒤 의도적 PFAS 불검출 생리용품 비율 (단체 인용)"]], "src": "Yahoo/The Cool Down 10.19 (기사 직접 열람) · 뉴저지 의회 법안 PDF 열기 실패 · 위원회 통과는 검색 요약", "grade": "추정"}, {"tm": "중 · 11.02", "name": "Vanity Fair Lingerie (Fruit of the Loom 계열)", "co": "미국 · PR Newswire 11.02 · 뉴욕 체험 행사 11.05", "title": "'플로리스리 스무스' 와이어 브라 — Cosmopolitan과 피팅 체험 행사로 출시", "q": "브라는 '입어 보고 움직여 보게 하는' 체험으로 판다.", "hl": ["체험으로"], "pts": ["<b>제품:<\/b> 'Flawless Flex' 컵이 자연스러운 사이즈 변화에 맞춰 늘어나는 '어댑티브 핏', 옆·등 라인을 정리하는 4방향 신축 원단, 자리가 고정된 어깨끈. 노와이어가 아닌 와이어 브라다.", "<b>숫자:<\/b> 가격·사이즈 범위·혼용률은 발표문에 없다. 온라인 선판매 뒤 2027년 2월 매장 판매로 넓힐 예정.", "<b>마케팅:<\/b> Cosmopolitan과 함께 'Made to Be Smooth' 행사(피팅·움직임 코칭·맞춤 체험), 크리에이터 초청.", "<b>반응:<\/b> 확인하지 못했다.", "<b>국내와 비교:<\/b> 국내도 브라를 매장·체험에서 입어 보게 하는 방향이다(그리티 르페 매장 등).", "<b>우리에게:<\/b> 브라 쪽은 소규모 체험단·피팅 행사형 마케팅만 참고한다."], "nums": [["4", "방향", "신축 원단 (옆·등 라인 정리)"], ["2027.02", "", "오프라인 매장 확대 예정", 1]], "src": "PR Newswire 11.02 (일부 구간은 요약 추출본이라 세부는 추정)", "grade": "확인"}, {"tm": "중 · 11.12", "name": "绅门·舒尔丹·卓顿·诚华 등 창난(苍南)·이산(宜山) 니트 내의 업체", "co": "중국 저장성 · 温州日报 → 新欧洲 전재 · 11.12", "title": "보온 대신 '10A 항균' 4계절 면 세트 — 100장부터 주문, 7일 샘플", "q": "중국은 '항균 10A' 같은 숫자 표기가 곧 상품 이름이 되고, 공장은 소량을 빠르게 만든다.", "hl": ["10A"], "pts": ["<b>시장 상황:<\/b> 따뜻한 겨울에 맞춰 보온 일변도에서 10A 항균·무봉제·통기·땀 배출 기능 세트로 바꿨다. 이산진 여러 라이브 방송에서 '10A 항균 4계절 면감 세트' 주문이 늘어 임시 추가 주문이 생겼다(업체 주장).", "<b>숫자:<\/b> 100장부터 주문, 7일 샘플. 택배비 건당 약 3위안 → 1.4위안(물류비 거의 절반). 이산진 니트 사업체 약 3,000곳, 총생산액 70억 위안 이상. 10A 제품 주문량·가격 숫자는 없다.", "<b>마케팅:<\/b> 공장 직영 라이브 방송과 항균 등급 숫자 강조. '10A'는 강제 표준이 아닌 업체 표기다.", "<b>반응:<\/b> 확인하지 못했다.", "<b>국내와 비교:<\/b> 국내 그리티는 '모달+실크·젤리 퓨징' 같은 소재·접합 방식으로, 중국은 항균 등급 숫자로 차별을 말한다.", "<b>우리에게:<\/b> 근거 없는 숫자 경쟁에 끌려가지 말고 시험 성적서(KS 등)에 근거한 표기를 쓴다. 100장·7일 샘플 체계는 시제품 주기와 비교해 볼 기준이다."], "nums": [["100", "장", "최소 주문 수량", 1], ["7", "일", "샘플 제작 기간"], ["3,000", "곳", "이산진 니트 사업체 (약)"], ["70억", "위안+", "이산진 니트 총생산액"]], "shift": {"from": "3위안", "to": "1.4위안", "cap": "택배비 건당 (약, 물류비 거의 절반)"}, "src": "新欧洲 11.12 (温州日报 전재, 조사원 열람)", "grade": "확인"}, {"tm": "하 · 11.23", "name": "29CM '겨울 이구위크'", "co": "한국 · 대한경제 11.23 (행사 11.09~11.19)", "title": "거래액 1,749억 원, 역대 최대 — 마지막 날 하루 248억 원", "q": "11월 플랫폼 행사가 일찍 끝나, 12월 초 막판 행사로 수요가 지 않는다.", "r": "⑤ Vanity Fair Lingerie", "who": "2본부 광고·콘텐츠팀 · 4본부"}, {"k": "[가격 행사] 12월 초 막판 행사 결과를 보고 연말 행사 시기 결정", "p": "유지", "d": "29CM 겨울 이구위크가 11/19에 역대 최대로 끝났고, 무신사는 12/2까지 이어진다. 막판 행사에서 이너웨어 노출과 할인율을 확인하고, 12/3 빅토리아 시크릿 실적의 할인 수준과 함께 보고 우리 연말 행사 시기를 정한다.", "r": "⑦ 29CM · ⑨ 빅토리아 시크릿", "who": "2본부 쇼핑몰팀"}], "glossary": [{"term": "흡수량 (cc·mL)", "easy": "속옷 한 장이 머금을 수 있는 액체의 양. 1cc는 1mL와 같다.", "why": "아텐트 140cc, 보듬 2,000mL처럼 제품 비교의 기본 숫자다. 시험법이 다르면 직접 비교할 수 없다.", "video": {"title": "[디펜드] 써보면 아는 차이, 디펜드 스타일 라이너", "url": "https://www.youtube.com/watch?v=7qUqi4m3tr8"}}, {"term": "오픈가격", "easy": "제조사가 값을 정하지 않고 파는 가게가 정하는 방식(일본에서 흔함).", "why": "아텐트 새 제품 가격을 다른 제품과 비교할 수 없는 이유다."}, {"term": "박형 흡수체", "easy": "얇게 만든 흡수 층.", "why": "기저귀가 아니라 속옷처럼 보이게 하는 핵심 부품이다."}, {"term": "성인용 팬티형 기저귀", "easy": "속옷처럼 올려 입는 일회용 성인 기저귀.", "why": "다회용 요실금팬티와 같은 고객을 두고 경쟁하는 제품이다."}, {"term": "젤리 퓨징", "easy": "바느질 대신 열과 접착으로 원단을 붙이는 방식.", "why": "그리티 감탄 브라의 접합 방식으로, 무봉제 브라 표기에 쓰인다."}, {"term": "모달·텐셀 모달", "easy": "너도밤나무 펄프로 만든 부드러운 섬유. 텐셀은 원사사 상표 이름.", "why": "그리티 등 여러 속옷 업체가 브라·팬티 소재로 쓴다.", "video": {"title": "TENCEL™ Modal x Micro technology: finer fibers, softer feeling", "url": "https://www.youtube.com/watch?v=XN6uRBJ2Egk"}}, {"term": "PFAS", "easy": "물과 기름을 튕기게 하는, 잘 분해되지 않는 화학물질 묶음('영원한 화학물질').", "why": "방수층 가공제에 쓰일 수 있어 미국 주·EU 규제가 넓어지고 있다.", "video": {"title": "DWR(발수 가공) 설명 영상 (원제목 미확인)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "노와이어·심리스", "easy": "노와이어는 철심 없는 브라, 심리스는 봉제선을 없앤 속옷.", "why": "지그재그에서 노와이어 +25%, 심리스 +34% 늘어난 품목이다."}, {"term": "10A 항균", "easy": "중국 업체가 쓰는 항균 등급 표기. 강제 표준은 없다.", "why": "근거 없는 숫자 경쟁에 휘말리지 않고 시험 성적서로 표기해야 하는 이유다."}, {"term": "소단쾌반(小单快反)", "easy": "적은 수량을 주문받아 빠르게 만드는 생산 방식.", "why": "중국 업체는 100장부터 주문, 7일 샘플로 움직인다. 시제품 주기 비교 기준이다."}, {"term": "흡한속건", "easy": "땀을 빨아들이고 빨리 마르는 성질.", "why": "속옷 원단 시험 항목 가운데 하나다.", "video": {"title": "KATRI 흡한속건 시험 설명 영상 (원제목 미확인)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0"}}, {"term": "블랙프라
