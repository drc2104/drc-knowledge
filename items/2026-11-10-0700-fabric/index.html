<script id="item-data" type="application/json">{"id": "2026-11-10-0700-fabric", "date": "2026-11-10", "slot": "07:00", "topic": "원단·소재", "type": "시장 감시", "title": "11월 10일 원단·소재 동향", "subtitle": "국내 3 · 해외 6 · 소식 9개", "event": {"name": "원단·소재 시장 감시", "host": "인터넷·SNS·블로그·카페·쇼핑몰·펀딩·해외 자료", "when": "2026-10-11 ~ 11-10 (30일 · 7일 안 새 소식은 국내 2건뿐이라 범위를 넓힘 · 지난 소식 1건 포함)", "where": "한국·미국·대만·중국·일본 (유럽 업체 소식은 없음)", "theme": "불소 없는 발수를 내세운 원단이 뮌헨 전시에 나왔고 국내는 법·마케팅 소식이 중심이다. 속옷에 쓴다고 밝힌 신소재는 오늘도 없다."}, "headline": "불소 없는 발수 원단이 전시에 나왔고, 국내는 법과 마케팅이 먼저다", "hl": ["불소", "법과"], "summary3": [["불소 없는 발수를 내세운 얇은 원단이 전시 제품으로 나왔다.", "미국 Dryfiber 506은 100 g/㎡에 불소 없는 발수·발유 코팅을 표기했다. 다만 막이 아니라 겉 코팅이고, 전시회가 검증하지 않은 업체 값이다."], ["해외 원단은 재생 원료와 기능을 한 장에 묶는다.", "대만 Ray-Fabrics는 재생 폴리에스터 40%·재생 스판 25%에 땀 자국을 가리는 기능을, Taiwan Taffeta는 재생 폴리에스터 52%에 습기 반응 짜임(87 g/㎡)을 내세웠다. 속옷 용도를 밝힌 곳은 없다."], ["국내는 정책과 소비자 마케팅이 먼저 움직였다.", "내수 시장 수입 비중 57.1%, 생산능력은 2005년 대비 절반 수준이라는 숫자를 배경으로 섬유패션 특별법이 11월 4일 발의됐다. 효성티앤씨는 약 15,000명이 참가한 러닝 행사로 원사 이름을 알리고 있다."]], "cases": [["업체·소재", "원단 수치 (가격 미공개 · 업체 제공값)"], ["Ray-Fabrics DISAPPEAR 205814 (대만)", "270 g/㎡ · 폴리아미드 35%·재생 폴리에스터 40%·재생 스판 25% · 최소 1,000야드"], ["Dryfiber 506 (미국)", "100 g/㎡ · 폴리아미드 89%·다이니마 11% · 불소 없는 발수·발유 표기 · 최소 주문량 미표기"], ["Taiwan Taffeta 41A010 (대만)", "87 g/㎡ · 재생 폴리에스터 52%·AquaBreath 48% · 최소 주문량 미표기"], ["Leaf Bio BioFleax Micro (중국)", "PEF 100% 30D 실 · 무게·최소 주문량 미표기"], ["Chori PP Microporus 3L (일본)", "내수압 20,000 mm · 투습 70,000 g/㎡/24h · 구성 표기와 설명이 서로 다름"]], "shift": {"from": "2005년 수준", "to": "절반 수준", "cap": "국내 섬유 생산능력 변화 (△49.8%, 특별법 보도 기사의 숫자 그대로)"}, "chart": {"t": "전시 출품 원단 무게 (g/㎡, 업체 제공값 · 전시회 미검증 · 용도가 달라 직접 비교 금지)", "u": "g/㎡", "rows": [["Ray-Fabrics DISAPPEAR", 270, "c"], ["Dryfiber 506", 100, "b"], ["Taiwan Taffeta 41A010", 87, "a"]]}, "keynums": [["57.1", "%", "내수 시장 수입 비중 (2024년)", 1], ["49.8", "%", "2005년 대비 국내 생산능력 감소", 1], ["100", "g/㎡", "Dryfiber 506 무게 (불소 없는 코팅 표기, 업체 값)"], ["1,000", "야드", "Ray-Fabrics 최소 주문량 (이번 표에서 유일하게 공개)"]], "overviewNote": "오늘은 '상' 등급 소식이 없습니다. 속옷 용도를 밝혔거나 판매 급증·가격 변동의 근거가 있는 소식이 없었기 때문입니다. 최근 7일(11/3~11/10) 안의 새 소식은 국내 2건뿐이어서 범위를 30일로 넓혔고, 해외 소식 대부분은 10/13~14 뮌헨 퍼포먼스 데이즈 출품작입니다. 제품 페이지에 게시일이 없어 날짜는 전시회 개최일로 적었고, 수치는 모두 전시회가 검증하지 않은 업체 제공값입니다. 라이크라 소식은 30일을 넘긴 지난 소식입니다. 원단은 공개 가격이 없어 가격표 대신 원단 수치 표를 실었고, 같은 이유로 가격 행사 아이디어는 넣지 않았습니다.", "sectionLabel": "소식", "sections": [{"tm": "중 · 11.04", "name": "송재봉 의원 외 12명", "co": "한국 · 법안 발의 (보도 11.06, 국제섬유신문)", "title": "섬유패션산업 특별법 발의, 원료부터 유통까지 전 단계 지원", "q": "국내 생산 기반이 절반으로 줄자 전 단계를 지원하는 특별법이 발의됐다.", "hl": ["특별법이"], "pts": ["<b>무엇이 새로운가:<\/b> 「섬유패션산업의 경쟁력 강화 및 지원에 관한 특별법안」. 원료·원사·원단·염색가공·봉제·디자인·유통 전 단계를 지원한다. 사라질 위험이 있는 공정을 '핵심기반공정'으로 지정하고, 공동폐수처리장 같은 공동 시설을 지원하며, '공공필수섬유제품'은 공공기관 우선구매를 권고한다(품목은 시행령에서 정함).", "<b>숫자:<\/b> 사업체 289,000곳·종사자 691,000명(2024년), 국내 생산능력은 2005년 대비 절반 수준(△49.8%), 내수 시장 수입 비중 57.1%(2024년).", "<b>업계 반응:<\/b> 최병오 섬유산업연합회장은 \"개별 기업의 노력만으로는 약화되는 생산기반을 지키기 어려운 상황\"이라고 말했다.", "<b>마케팅·고객 반응:<\/b> 법안이라 해당 없음.", "<b>우리에게:<\/b> 국내 원단 공급처가 줄고 수입 비중이 높다는 점은 국내와 해외 샘플을 함께 보아야 한다는 근거다. 발의 단계라 시행 시점과 지원 범위는 아직 알 수 없다."], "nums": [["57.1", "%", "내수 시장 수입 비중(2024년)", 1], ["49.8", "%", "2005년 대비 생산능력 감소", 1], ["289,000", "곳", "섬유패션 사업체(2024년)"], ["691,000", "명", "종사자(2024년)"]], "src": "국제섬유신문 (2026-11-06 보도, 11-07 수정)", "grade": "확인"}, {"tm": "중 · 10.22", "name": "태광산업·대한화섬", "co": "한국 · 기사 (국제섬유신문)", "title": "친환경 원사 브랜드 ACEPORA-ECO 중심으로 확대", "q": "두 회사가 친환경 원사를 키운다지만 아직은 검토 단계이고 출시 제품은 없다.", "hl": ["검토", "단계이고"], "pts": ["<b>무엇이 새로운가:<\/b> 친환경 원사 브랜드 ACEPORA-ECO(에이스포라-에코) 중심의 경쟁력 강화. 대한화섬은 바이오 기반 Bio PET 소재 개발 가능성을 검토하고, 두 회사 모두 폐섬유를 새 섬유로 되돌리는 T2T 소재를 검토 중이다.", "<b>숫자:<\/b> 기사에 원단 무게·재생 비율·인증 숫자가 없다. 검토 단계라 출시 제품도 없다(업체 주장).", "<b>마케팅:<\/b> 브랜드 중심 확대를 밝힌 수준이고 속옷 언급은 없다.", "<b>고객 반응:<\/b> 이번 조사에서 확인된 소비자 반응 없음.", "<b>우리에게:<\/b> 태광산업은 기사에서 국내 유일의 나일론 원사 생산 기반으로 소개됐다. 요실금·생리팬티 안감용 원사 후보로 볼 수 있지만 사양은 직접 물어야 한다."], "src": "국제섬유신문 (2026-10-22)", "grade": "확인"}, {"tm": "중 · 10.13", "name": "DRYFIBER", "co": "미국(생산 벨기에·일본·영국·미국) · 퍼포먼스 데이즈 뮌헨 출품 (게시일 없어 전시일로 표기)", "title": "불소 없는 발수·발유 코팅을 입힌 얇은 원단 Dryfiber 506", "q": "새 코팅으로 불소 없이 물과 기름을 튕긴다고 표기한 100 g/㎡ 원단이다.", "hl": ["불소", "없이"], "pts": ["<b>무엇이 새로운가:<\/b> 업체는 '새로 시장에 나온 코팅 기술, PFAS 없는 발수·발유'라고 소개했다. 폴리아미드 89%에 다이니마 11%를 섞은 원단이며 인증 표기는 없다.", "<b>숫자:<\/b> 100 g/㎡, 발유 시험 ISO 14419 1급 표기. 폭과 최소 주문량은 없다. '1급'은 등급 표기일 뿐이니 성능이 높다는 뜻으로 읽지 말고 시험 기준표로 확인해야 한다.", "<b>마케팅:<\/b> 전시 제품 페이지 소개가 전부이고 속옷 언급은 없다. 수치는 전시회가 검증하지 않은 업체 값이다.", "<b>고객 반응:<\/b> 이번 조사에서 확인된 소비자 반응 없음.", "<b>우리에게:<\/b> 막이 아니라 겉 코팅이어서 방수층을 대신할 수는 없고, 생리팬티 겉감의 발수 가공을 대신할 후보다. 세탁 20회 뒤에도 발수가 유지되는지 시험한다."], "nums": [["100", "g/㎡", "원단 무게(업체 값)", 1]], "bars": {"t": "Dryfiber 506 구성 (%, 업체 표기)", "u": "%", "rows": [["폴리아미드", 89, "a"], ["다이니마", 11, "c"]]}, "video": {"title": "PFAS FREE FUTURE: Everyday fabrics should not threaten your health", "url": "https://www.youtube.com/watch?v=cDMUpNeS1YA"}, "src": "퍼포먼스 데이즈 제품 페이지 68007 (날짜는 전시회 개최일)", "grade": "확인"}, {"tm": "중 · 10.13", "name": "Ray-Fabrics", "co": "대만(생산 대만) · 퍼포먼스 데이즈 뮌헨 출품 (게시일 없어 전시일로 표기)", "title": "땀 자국이 사라진다는 재생 혼방 니트 DISAPPEAR", "q": "발수 가공과 흡습을 합쳐 땀 자국을 없앤다고 내세운 재생 혼방 니트다.", "hl": ["땀", "자국을"], "pts": ["<b>무엇이 새로운가:<\/b> 업체 문구는 'Vanishing Sweat', 겉은 발수 가공을 하고 땀은 흡수하는 원단이다. GRS 인증과 자외선 차단 50+ 아이콘을 표기했다.", "<b>숫자:<\/b> 폴리아미드 35%·재생 폴리에스터 40%·재생 스판 25%, 270 g/㎡, 폭 57인치, 최소 1,000야드.", "<b>마케팅:<\/b> 발수 가공의 PFAS 여부는 페이지에 없다. 항균·소취는 일반 아이콘 설명일 뿐 제품 주장이 아니고, 시험값과 속옷 언급도 없다.", "<b>고객 반응:<\/b> 이번 조사에서 확인된 소비자 반응 없음.", "<b>우리에게:<\/b> 이번 표에서 최소 주문량을 밝힌 유일한 원단이라 샘플 문의부터 시작하기 쉽다. 샘플과 함께 발수제 종류와 PFAS 성적서를 요구한다."], "nums": [["270", "g/㎡", "원단 무게(업체 값)"], ["57", "인치", "원단 폭"], ["1,000", "야드", "최소 주문량", 1]], "bars": {"t": "DISAPPEAR 구성 (%, 업체 표기)", "u": "%", "rows": [["재생 폴리에스터", 40, "a"], ["폴리아미드", 35, "c"], ["재생 스판", 25, "b"]]}, "video": {"title": "Inside PERFORMANCE DAYS 2026 | Future of Sustainable Textiles & Performance Materials", "url": "https://www.youtube.com/watch?v=iOhfV4MBxCU"}, "src": "퍼포먼스 데이즈 제품 페이지 67506 (날짜는 전시회 개최일)  "멤브레인(막)", "easy": "물은 막고 습기는 지나가게 하는 얇은 막.", "why": "흡수층 아래 방수층에 해당한다."}, {"term": "내수압(mm)", "easy": "물이 새기 시작하는 압력. 높을수록 방수가 잘 된다.", "why": "소식 ⑧의 원단은 20,000 mm로 표기했다."}, {"term": "투습도(g/㎡/24h)", "easy": "하루 동안 원단을 통해 빠져나가는 습기의 양.", "why": "소식 ⑧의 원단은 70,000으로 표기했다. 착용 때 답답함과 관련된다."}, {"term": "g/㎡", "easy": "원단 1㎡의 무게. 작을수록 얇고 가볍다.", "why": "소식 ④는 270, ⑤는 87이다. 겉감 후보를 고를 때 먼저 본다."}, {"term": "최소 주문량(MOQ)", "easy": "한 번에 주문해야 하는 최소 길이나 수량.", "why": "소식 ④ Ray-Fabrics는 1,000야드다. 시험 제작 규모를 정할 때 필요하다."}, {"term": "GRS", "easy": "재생 원료를 썼는지 확인하는 국제 인증.", "why": "재생 원단이라는 주장의 근거가 된다."}, {"term": "OEKO-TEX 100", "easy": "피부에 닿는 섬유의 유해물질을 검사하는 인증.", "why": "속옷 원단을 고를 때 꼭 확인할 항목이다."}, {"term": "ISO 14419", "easy": "기름을 튕기는 성능(발유)을 재는 시험 표준.", "why": "소식 ③이 1급으로 표기했다. 등급의 뜻은 시험 기준표로 확인해야 한다."}, {"term": "T2T", "easy": "헌 옷을 새 섬유로 되돌리는 재활용 방식(Textile to Textile).", "why": "소식 ②에서 태광산업·대한화섬이 검토 중이다."}, {"term": "PEF", "easy": "식물 유래 원료로 만드는 폴리에스터 계열 소재.", "why": "소식 ⑦의 원료다. 석유계 폴리에스터의 대안으로 지켜볼 소재다."}, {"term": "무봉제(심리스)", "easy": "박음질 없이 짜거나 붙여서 만든 옷.", "why": "봉제선이 없어 피부 자극이 적은 팬티 구조와 관련된다.", "video": {"title": "Seamless underwear process", "url": "https://www.youtube.com/watch?v=Cc0MFTxy8d0"}}, {"term": "광학 가림(CloakFX)", "easy": "섬유가 빛을 퍼뜨려 젖은 자국이 덜 보이게 하는 방식.", "why": "소식 ⑨의 기술이다. 연한 색 팬티의 젖은 자국 문제와 방향이 같다."}]}</script>
