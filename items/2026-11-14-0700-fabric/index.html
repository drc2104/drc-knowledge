owHeadline": "새 소재보다 '증명할 서류'가 먼저 바뀌고 있다", "apply": [{"k": "[원단 시험] 쓰는 원단·후보 원단의 PFAS 시험과 재생 원료 증명서 목록 만들기", "p": "우선", "d": "방수층·발수 가공 원단부터 총불소(PFAS) 시험을 의뢰하고, 재생 원사 원단은 재생 원료 증명서·검증서를 받을 수 있는지 원단사별로 묻는다. EU 기준안의 5개 영역(원료·공정·품질·품질보증·서류)을 요청 목록의 틀로 쓴다.", "r": "① EU JRC · ② 다이텍연구원", "who": "4본부 · 3본부"}, {"k": "[원단 시험] 11월 18일 다이텍 포럼 자료 받기와 상하이 전시 출품사 확인", "p": "우선", "d": "PFAS 규제 강연 자료를 요청하고 시험 의뢰 창구를 확보한다. 같은 주 상하이 퍼포먼스 데이즈(11/18~19) 출품사 목록에서 속옷용 원단사를 골라 둔다.", "r": "② 다이텍연구원", "who": "4본부"}, {"k": "[원단 시험] 숯사 니트와 냉감 니트를 같은 조건으로 비교", "p": "우선", "d": "Dern Lin CT207ECO(155 g/㎡)와 LifeLabs CoolLife-RecPA(100 g/㎡) 샘플을 받아 흡수량·건조 시간·세탁 뒤 냄새를 직접 비교한다. 업체 주장 대신 우리 시험값으로 판단한다.", "r": "③ Dern Lin · ④ LifeLabs", "who": "4본부"}, {"k": "[제품] 겨울 보온 팬티 겉감을 울 혼방 3종으로 비교", "p": "검토", "d": "Sampaio 메리노 니트, Texanda 대나무 레이온·울 저지, Nuyarn×Takisada 오픈 넷 울을 겨울용 요실금·생리팬티 겉감 후보로 놓고 촉감·두께·건조를 본다. 흡수·방수 층은 따로 구성한다.", "r": "⑤ Sampaio · ⑥ Texanda · ⑨ Nuyarn", "who": "4본부"}, {"k": "[제품] 최소 주문량이 큰 원단은 소량 조건부터 묻기", "p": "검토", "d": "3,000m·3,500야드처럼 큰 최소 주문량은 소량 시제품에 부담이 된다. 원단사 재고분·소량 조건을 묻는 공통 문의 양식을 만들어 후보마다 같은 질문을 보낸다.", "r": "④ LifeLabs · ⑥ Texanda", "who": "4본부"}, {"k": "[마케팅] '재생 원료'·'불소 없음' 문구는 근거 서류가 있을 때만", "p": "우선", "d": "원단사가 계산한 환경 점수(Higg MSI 등)는 소비자 문구로 옮기지 않는다. 시험성적서·증명서와 문구를 한 쌍으로 보관하고, 공개 전 광고 문구 점검을 거친다.", "r": "① EU JRC · ③~⑥ 전시 원단", "who": "2본부 · 4본부"}, {"k": "[가격 행사] 연말 행사 가격은 원가보다 시장 흐름으로 판단", "p": "유지", "d": "면 원료 시세에 급변 신호가 없어 원가 급등 위험은 낮은 편이다(추정). 연말 행사 가격은 경쟁사 행사 흐름을 기준으로 보고, 원단 견적은 어느 면화 지수를 근거로 삼았는지 확인한다.", "r": "⑦ 면화 시세", "who": "2본부"}, {"k": "[원단 시험] 연말 샘플 염색 일정을 미리 협의", "p": "유지", "d": "대구염색산단은 연간으로 아직 작년보다 덜 돌고 있어 일정 여유가 있을 수 있다(추정). 연말 소량 샘플 염색 일정을 일찍 잡아 둔다.", "r": "⑧ 대구염색산단", "who": "4본부"}], "media": {"headline": "행사 다시보기는 없어, 흡습속건 시험·누수방지 속옷 구조·텐셀·국내 신소재를 설명하는 영상 6편을 붙였습니다", "videos": [{"title": "KATRI가 알려드립니다 _ 흡한속건 시험 (2020.08 기준)", "url": "https://www.youtube.com/watch?v=r6YcWwyIxR0", "len": "길이 미확인", "note": "KATRI시험연구원(국내 시험기관) · 흡수·건조 속도를 재는 시험법 (2020년 기준 자료)
