5, "a"]]}, "src": "AARP 보도자료(원문 접근 차단, 검색 요약 기준) · Pulse", "grade": "추정"}, {"tm": "해외 · 중국", "name": "중국 국무원 상무회의", "co": "중국 · 제일재경(Yicai) 보도 · 2026.02.26", "title": "소비 보조금으로 노인 소비를 키운다", "q": "정부가 소비 보조금으로 노인 소비 수요를 직접 밀어 줍니다.", "hl": ["소비", "보조금으로"], "pts": ["<b>시장 상황:<\/b> 2026년 2월 24일 회의에서 소비 보조금 등으로 노인 소비 수요를 키우고 새 소비 장면과 업태를 만들기로 했다. 제15차 5개년 계획 방향은 양로 서비스 체계 구축과 실버 기술 확대.", "<b>숫자:<\/b> 실버경제 2024년 약 7조 위안(1조 200억 달러), GDP의 6%(실버경제 청서 인용). 60세 이상이 지난해 말 3억 2천만 명을 넘었고 2035년 4억 명을 넘을 전망.", "<b>반응:<\/b> 정부 방침 보도여서 소비자 반응은 없다.", "<b>국내와 비교:<\/b> 인구 규모가 달라 직접 비교는 어렵다. 다만 정부가 소비 보조금으로 시니어 소비를 민다는 점은 우리 급여 외 판매 전략에 참고가 된다."], "nums": [["7조", "위안", "중국 실버경제(2024, 약 1조 200억 달러)", 1], ["6", "%", "GDP 중 비중"]], "bars": {"t": "중국 60세 이상 인구", "u": "억 명", "rows": [["지난해 말(3.2억 이상)", 3.2, "b"], ["2035 전망(4억 초과)", 4, "a"]]}, "src": "Yicai Global", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 민정부 계획", "co": "중국 · 정부 영문사이트 · 2026.04.29 (계획 발표 1월)", "title": "동네 생활권·식당·쇼핑몰까지 묶은 노인 소비 정책", "q": "집 앞 생활권과 쇼핑 플랫폼까지 노인에게 맞춰 고치는 정책 묶음입니다.", "hl": ["생활권과", "쇼핑"], "pts": ["<b>제품:<\/b> 휴머노이드 로봇·건강 모니터·재활 보조기기를 우선 보급한다. 쑤저우 사례는 활력징후 모니터링 스마트 의류, 수면 추적 매트리스, 낙상 감지, 복약 알림. 가격과 판매 채널은 원문에 없다.", "<b>숫자:<\/b> 60세 이상 3억 1천만 명 이상, 2035년 4억 명 초과 전망. 15분 편리생활권 시범 약 6,300곳, 주민 1억 2,900만 명. 톈진 지역 식당 1,800곳 이상.", "<b>시장 상황:<\/b> 저장성 노인 친화 상권 행사 매출 1억 위안 이상(1,465만 달러). 공업정보화부는 인기 쇼핑 플랫폼 10여 곳의 접근성을 개선했다.", "<b>반응:<\/b> 정부 자료여서 소비자 반응은 원문에 없다.", "<b>국내와 비교:<\/b> 주택 개조 보조금·노인 쇼핑 시즌·플랫폼 접근성 개선이 한 묶음이다. 한국 쇼핑몰의 큰 글씨·간편 결제 개선 사례로 참고할 만하다."], "nums": [["6,300", "곳", "15분 편리생활권 시범 지역", 1], ["1억 2,900만", "명", "시범 지역 주민"], ["1,800", "곳+", "톈진 지역 식당"]], "src": "중국 정부 영문사이트(english.www.gov.cn)", "grade": "확인"}, {"tm": "해외 · 유럽", "name": "Eurostat", "co": "EU · 통계 설명 자료 · 2026.02.02 추출본", "title": "EU 65세 이상 22.0%, 한국과 비슷하지만 속도는 다르다", "q": "EU 고령 비중 22.0%는 한국과 비슷하지만, 한국은 2036년 30.9%로 더 빠르게 오릅니다.", "hl": ["22.0%는", "빠르게"], "pts": ["<b>시장 상황:<\/b> 2025년 1월 1일 기준 EU 인구 4억 5,060만 명, 65세 이상 22.0%(0.4%p 증가).", "<b>숫자:<\/b> 노년부양비 34.5%. 80세 이상 비중은 2025년 6%에서 2100년 16%로 오를 전망.", "<b>반응:<\/b> 통계 자료여서 반응은 해당 없음. 페이지를 직접 읽지 못해 검색 요약 기준이다.", "<b>국내와 비교:<\/b> 한국 21.6%(2026)는 EU 22.0%(2025)와 비슷하지만 2036년 30.9% 전망으로 오르는 속도가 더 빠르다."], "bars": {"t": "EU 80세 이상 비중 전망", "u": "%", "rows": [["2025", 6, "c"], ["2100", 16, "a"]]}, "table": [["나라", "65세 이상 비중", "고령 인구", "시장·제도 숫자", "기준 · 등급"], ["한국", "21.6%", "1,112만 5천 명", "소비 128조 원 추산(K-AgeTech 발표)", "2026.10 · 확인"], ["일본", "29.6%", "3,624만 명", "취업 고령자 943만 명", "2026.09 · 추정"], ["EU", "22.0%", "해당 없음", "노년부양비 34.5%", "2025.01.01 · 추정"], ["미국", "해당 없음", "해당 없음", "50세 이상 경제 활동 12조 5천억 달러(GDP 43%)", "2024 기준 · 추정"], ["중국", "해당 없음", "60세 이상 3억 2천만 명(국무원) / 3억 1천만 명(민정부)", "실버경제 7조 위안, GDP 6%(2024)", "2026.02·04 · 확인"], ["아시아 태평양", "해당 없음", "해당 없음", "실버경제 4조 5,600억 달러(주최 측)", "2026.04 · 추정"]], "src": "Eurostat 통계 설명 자료(검색 요약 기준)", "grade": "추정"}, {"tm": "해외 · 일본", "name": "총무성 통계국 · 후생노동성", "co": "일본 · 공표 자료 · 2026.09.20", "title": "일본 65세 이상 29.6%, 복지용구 가격 관리도 바뀐다", "q": "일본은 65세 이상이 29.6%로 한국보다 8%p 높고, 일하는 고령자도 22년째 늘고 있습니다.", "hl": ["29.6%로", "22년째"], "pts": ["<b>시장 상황:<\/b> 65세 이상 3,624만 명(전년보다 2만 명 증가), 총인구의 29.6%로 역대 최고.", "<b>제품:<\/b> 후생노동성이 복지용구 취급을 개정했다(2026.10.26 통지, 2027.02.01 적용). 통신 기능이 있는 복지용구 중 월평균 100건 이상 대여된 제품은 통신비 포함 가격을 청취할 예정. 신제품 전국 평균 대여가격과 상한은 2026년 10월 대여분부터 적용. 검색 요약 기준이다.", "<b>숫자:<\/b> 65세 이상 취업자 943만 명으로 22년 연속 증가, 역대 최다.", "<b>반응:<\/b> 현장 반응은 이번 조사에서 찾지 못했다.", "<b>국내와 비교:<\/b> 한국(21.6%)보다 8%p 높아 조사자는 한국의 10~15년 뒤 모습으로 본다. 통신 기능 용구의 가격 관리는 한국 복지용구 급여가 어떻게 바뀔지 먼저 보여 주는 사례다."], "nums": [["3,624만", "명", "일본 65세 이상"], ["943만", "명", "일본 65세 이상 취업자", 1], ["22", "년", "취업자 연속 증가"]], "bars": {"t": "65세 이상 인구 비중 비교", "u": "%", "rows": [["일본", 29.6, "a"], ["EU", 22.0, "b"], ["한국", 21.6, "c"]]}, "src": "일본 뉴스 영상 제목(제목만 확인) · 시마네현 게재 통지 PDF(판독 못 함, 검색 요약 기준)", "grade": "추정"}, {"tm": "해외 · 싱가포르", "name": "World Ageing Festival 2026", "co": "싱가포르 · 마리나베이샌즈 · 2026.04.14~15", "title": "아시아 태평양 실버경제 4조 5,600억 달러 제시", "q": "주최 측은 아시아 태평양 실버경제를 4조 5,600억 달러로 제시했습니다.", "hl": ["4조", "5,600억"], "pts": ["<b>시장 상황:<\/b> 주최 측이 「Asia Pacific Silver Economy Business Opportunities Report 2026–2030」 5판을 발표했다.", "<b>숫자:<\/b> 참가 8,300명 이상, 전시 약 200개, 연사 130명 이상(40개국 이상). 아시아 태평양 실버경제 4조 5,600억 달러는 주최 측 숫자다.", "<b>반응:<\/b> 현장 평가는 이번 조사에서 찾지 못했다. 행사 소개 자료의 검색 요약 기준이다.", "<b>국내와 비교:<\/b> 한국 숫자와 바로 견줄 자료는 아직 없다. 보고서 원문을 볼 수 있는지 다음 회차에 확인한다."], "nums": [["8,300", "명+", "참가자", 1], ["200", "개", "전시(약)"], ["130", "명+", "연사(40개국 이상)"]], "src": "Visit Singapore 행사 안내 · ARCO 행사 안내(검색 요약 기준)", "grade": "추정"}], "flow": [{"k": "혼자 서는 노인이 늘어난다", "d": "생활비 본인·배우자 마련 74.7%, 취업자 414만 7천 명, 노후 준비 64.4%. 일본도 취업 고령자 943만 명", "who": [3, 4, 8, 13]}, {"k": "돈은 부동산에 묶여 있다", "d": "순자산 4억 9,279만 원 중 부동산 79.9%, 주택연금 가입률 약 2%", "who": [3, 6]}, {"k": "관계는 얇아진다", "d": "아플 때 도움 1.4%p, 우울할 때 도움 1.3%p 감소. 1인가구 38.0%, 삶 만족 33.7%", "who": [1, 5, 7]}, {"k": "디지털 이용이 크게 늘고, 쇼핑도 노인에게 맞춘다", "d": "인터넷 이용 79.2%, 카카오톡 99.5%. 중국은 쇼핑 플랫폼 10여 곳 접근성 개선", "who": [5, 6, 11]}, {"k": "'함께 책임' 의식으로 옮겨 간다", "d": "부모 부양 '가족·정부·사회가 함께' 53.4%", "who": [8]}, {"k": "국내와 해외 모두 집과 안전으로 돈이 향한다", "d": "주택 개량 지원 필요 20.6%, 미국 주택 지출은 개조·안전 쪽으로, 중국은 주택 개조 보조금과 낙상 감지 보급", "who": [6, 9, 11]}], "flowHeadline": "국내 통계와 해외 움직임이 같은 쪽을 가리킨다: 스스로 사는 노년, 안전한 집", "apply": [{"k": "복지용구 안내를 80세 전후 어르신과 가족 기준으로 다시 쓰기", "p": "우선", "d": "80세 이상의 32.9%, 65세 이상의 11.2%가 장기요양 인정자이고 2038년부터 75세 이상이 더 많아질 전망이다. 복지용구 사업소 안내 자료와 상담 문구를 80세 전후 어르신과 돌보는 가족 기준으로 고친다. 요실금팬티 등재품과 고관절보호대의 급여 안내를 한 자료에 묶는다.", "r": "② 건강 · ① 인구·가구", "who": "3본부"}, {"k": "혼자 사는 고객이 혼자 주문하고 혼자 쓸 수 있게", "p": "우선", "d": "고령자 가구의 38.0%가 1인가구이고 아플 때 부탁할 사람이 있다는 응답은 줄었다(72.5%). 상세페이지와 포장에 혼자 입고 벗는 순서, 혼자 주문·반품하는 방법을 큰 글씨로 넣는다. 가족이 대신 사 준다는 전제를 빼고 다시 읽어 본다.", "r": "① 인구·가구 · ⑤ 사회참여·관계", "who": "2본부"}, {"k": "카카오톡과 짧은 영상으로 안내하기", "p": "우선", "d": "고령자 인터넷 이용 79.2%, 이용자의 메신저 사용 96.0%, 카카오톡 99.5%, 주말 여가 동영상 시청 80.3%다. 제품 사용법을 1분 영상으로 만들어 카카오톡 채널 안내와 유튜브 채널에 함께 올린다. 설명서를 읽지 않아도 되는 구성을 기본으로 한다.", "r": "⑤ 사회참여·관계", "who": "1본부 · 2본부"}, {
