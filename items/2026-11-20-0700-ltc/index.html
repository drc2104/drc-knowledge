rc": "연합뉴스(서플 전재) 2026.11.17 · 세계일보 2026.11.18", "grade": "확인"}, {"tm": "3편", "name": "이윤경", "co": "한국보건사회연구원 선임연구위원 · 기관 영역", "title": "노인장기요양기관 운영 현황 및 정책적 시사점", "q": "기관 수를 무작정 늘리기보다 급여 유형별·지역별로 적정하게 공급을 관리해야 합니다.", "hl": ["적정하게"], "pts": ["<b>무엇이 문제인가:<\/b> 기관은 계속 늘었지만 급여 유형별 공급 불균형과 민간·개인 중심 공급 구조가 그대로다.", "<b>이용자 변화:<\/b> 중증 어르신과 치매 비율이 늘어 전문 서비스 요구가 커졌다.", "<b>현장 부담:<\/b> 병원 동행·야간 방문·임종 돌봄 등 새 서비스를 하지만 추가 인력과 운영 부담이 따른다.", "<b>제언 ①:<\/b> 전체 공급량 확대보다 유형별·지역별 적정 공급 관리.", "<b>제언 ②:<\/b> 욕구에 맞춘 서비스에 적정한 보상과 인력 지원.", "<b>제언 ③:<\/b> 국가와 보험자(건강보험공단)가 공급과 품질을 함께 관리.", "<b>숫자:<\/b> 보도자료에 이 글의 숫자는 실리지 않았다."], "src": "한국보건사회연구원 보도자료 2026.11.17 (PDF 4쪽)", "grade": "확인"}, {"tm": "4편", "name": "강은나", "co": "한국보건사회연구원 연구위원 · 요양요원 영역", "title": "장기요양요원의 근로 현황 및 개선 과제", "q": "처우 개선의 1순위는 여전히 임금입니다.", "hl": ["임금입니다."], "pts": ["<b>나아진 점:<\/b> 근로 여건이 일부 개선됐고, 이용자·가족의 부당행위 경험도 2022년보다 줄었다.", "<b>남은 위험:<\/b> 언어적 부당대우 15.6%, 신체적 위협 10.5%.", "<b>1순위 요구:<\/b> 임금수준 개선.", "<b>재가 종사자:<\/b> 기관 사이 임금 격차 축소, 이용자 교육, 부당대우 대응을 더 원한다.", "<b>시설 종사자:<\/b> 법정수당·휴게시간 보장, 업무를 돕는 장비 지원을 더 원한다.", "<b>제언:<\/b> 임금 올리기를 중심에 두고 안전·권익 보호, 급여 유형별 맞춤 근로환경."], "bars": {"t": "요양요원이 겪은 이용자·가족 부당대우 (%)", "u": "%", "rows": [["언어적 부당대우", 15.6, "a"], ["신체적 위협", 10.5, "b"]]}, "src": "한국보건사회연구원 보도자료 2026.11.17 (PDF 4쪽)", "grade": "확인"}, {"tm": "보충 · 11.16", "name": "건강보험연구원", "co": "국민건강보험공단 산하 연구원 · 별도 보고서 (세계일보 보도)", "title": "노인장기요양보험 비급여 운영현황과 관리방안", "q": "비급여는 미리 설명하고 동의받고, 계약서에 적도록 법으로 정해야 합니다.", "hl": ["계약서에"], "pts": ["<b>시설 비용의 절반 이상이 비급여:<\/b> 시설 입소자 640명의 월평균 본인부담금 71만 6,600원 = 비급여 38만 5,491원(53.8%) + 급여 본인부담 33만 1,109원(46.2%).", "<b>비급여 내용:<\/b> 식사재료비 74.3%(월 30만 6,126원), 기타 실비 16%, 상급침실료 9.7%(추가 월 40만 3,839원, 최대 303만 8,000원).", "<b>누가 내나:<\/b> 가족보호자 1,061명 중 혼자 전액 부담 56%, 나눠 부담 44%(평균 3.2명). 어르신 본인 재원은 기초연금 64%, 공적연금 16.9%, 저축 12.2%, 민간 치매·간병보험 0%.", "<b>부담 체감:<\/b> 본인부담금이 부담된다 59.1%.", "<b>가족이 원하는 장치:<\/b> 계약서에 비급여 명시 90.7%, 사전 설명·동의 88.3%, 기관별 비급여 비교 시스템 77.9%.", "<b>제언:<\/b> 비급여 사전 설명·동의와 계약서 명시를 법으로 의무화, 저소득 수급자 비급여 지원.", "<b>같은 기사 참고:<\/b> 장기요양위원회가 10월 30일 재가급여 월 한도액 상향을 의결(1등급 3시간 방문요양 월 최대 48회, 2등급 45회). 11월 6일 정리한 「2027년 장기요양 제도개선」과 같은 건."], "bars": {"t": "시설 비급여 구성 (%, 시설 입소자 640명)", "u": "%", "rows": [["식사재료비", 74.3, "a"], ["기타 실비", 16, "b"], ["상급침실료", 9.7, "c"]]}, "nums": [["71만 6,600", "원", "월평균 본인부담금", 1], ["53.8", "%", "그중 비급여 비중", 1], ["90.7", "%", "계약서에 비급여 명시 원함"], ["0", "%", "민간 치매·간병보험으로 내는 어르신"]], "src": "세계일보 2026.11.18 (보고서 11.16 공개, 원문은 열람하지 못함)", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 국가의료보장국", "co": "중국 · China Daily 보도 · 2026.03.26 / 2026.07.10", "title": "3년 안에 전국 통합 장기요양보험", "q": "한국이 2008년에 시작한 제도를 중국이 이제 전국으로 넓힌다.", "hl": ["전국으로"], "pts": ["<b>시장 상황:<\/b> 2026년 3월 중앙위·국무원이 3년 안에 전국 통합 장기요양보험을 만드는 지침을 냈다. 17개 성급 지역이 시행안을 발표.", "<b>숫자:<\/b> 가입 3억 2천만 명, 2026년 1~5월 수급 약 137만 명, 시범 이후 장애인 330만 명 이상 보장, 간병비 1,000억 위안 이상 절감. 통합 보험료율 약 0.3%, 인증 간병인 3만 명 이상.", "<b>반응:<\/b> 아직 전면 시행 전의 초기 단계.", "<b>국내와 비교:<\/b> 한국보다 늦게 출발했지만 규모가 매우 크다. 요양 서비스·용품 수요가 커질 시장으로 지켜볼 만하다."], "nums": [["3.2억", "명", "장기요양보험 가입", 1], ["137만", "명", "2026년 1~5월 수급"], ["0.3", "%", "통합 보험료율(약)"]], "table": [["나라", "제도 단계", "재원·요율", "규모", "최근 변화"], ["중국", "2026.03 전국 통합 지침, 3년 안에 구축", "통합 보험료율 약 0.3%", "가입 3억 2천만 명", "17개 성급 시행안, 인증 간병인 3만+"], ["독일", "요양보험 개편안 내각 의결(2026.09.30)", "일반 3.6%, 무자녀 0.6→0.9%", "요양 필요 600만 명 가까이", "2027년 부족 약 80억 유로, 재가 지원 131→175유로"], ["미국", "Medicaid 선택 서비스(주별)", "연방·주 예산", "대기 649,900명, 평균 34개월", "대기자 전년 +7%"], ["일본", "개호보험, 3년 주기 개정", "공공:보험료 50:50, 본인 10~30%", "사업자 파산 176건(2025)", "2026.06 개호보수 +2.03% 임시 개정"]], "src": "China Daily 2026.07.10 · China Daily Asia 2026.03.26", "grade": "확인"}, {"tm": "해외 · 독일", "name": "독일 연방내각", "co": "독일 · beck-aktuell·ZDFheute 보도 · 2026.09.30", "title": "요양보험 개편안(Pflegeneuordnungsgesetz) 의결", "q": "돈이 모자라자 보험료를 올리고 재가 지원을 지역 예산으로 바꾼다.", "hl": ["지역"], "pts": ["<b>제도:<\/b> 일반 보험료율 3.6%는 유지, 무자녀 할증 0.6%에서 0.9%로(2027.1.1), 배우자 공동보험 할증 0.52% 신설(2028.1.1, 예외 있음).", "<b>재가 지원:<\/b> 월 131유로 지원금(Entlastungsbetrag)을 없애고 지역 예산(Sozialraumbudget) 월 175유로로(25세 미만 300유로). 2차 단계 목표 시행 2027년 7월 1일.", "<b>숫자:<\/b> 2027년 부족 약 80억 유로, 2030년 170억 유로 이상(ZDF). 개편으로 2027년 부담 62억 5천만 유로 완화(beck). 요양이 필요한 사람 600만 명 가까이, 시설 자기부담 평균(1년차) 3,245유로.", "<b>반응:<\/b> 두 언론의 숫자는 '부족액'과 '완화액'으로 서로 다른 지표다.", "<b>국내와 비교:<\/b> 재원 부족 → 보험료 인상 + 급여 재편, 그리고 시설 자기부담이 큰 점까지 한국과 같은 압력. 재가 지원을 지역 예산으로 묶는 방식은 한국 재가 확대 논의의 비교 사례."], "shift": {"from": "131유로", "to": "175유로", "cap": "재가 지원 월액: 지원금 폐지 → 지역 예산 (독일 개편안)"}, "nums": [["0.9", "%", "무자녀 할증 (0.6%에서)", 1], ["80억", "유로", "2027년 재정 부족(약)"], ["3,245", "유로", "시설 자기부담 평균(1년차)"]], "src": "beck-aktuell 2026.09.30 · ZDFheute (장관 이름은 확인하지 못해 싣지 않음)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "KFF", "co": "미국 · 보건 연구기관 보고서 · 2026.10.05", "title": "Medicaid 재가·지역사회 돌봄(HCBS) 대기자 명단 2016~2026", "q": "예산이 정해진 미국은 재가 돌봄을 받으려면 평균 3년 가까이 기다린다.", "hl": ["기다린다."], "pts": ["<b>시장 상황:<\/b> 40개 주가 대기자 명단을 두고 있고, 32개 주에서 대기자가 늘었다. Medicaid 재가 돌봄 이용자는 500만 명 이상.", "<b>숫자:<\/b> 대기자 649,900명(약 65만 명), 전년 대비 약 7% 증가. 평균 대기 34개월(2025년 32개월).", "<b>반응:<\/b> 2025년 예산조정법으로 연방 지출이 줄 것으로 예상돼 대기가 더 길어질 수 있다.", "<b>국내와 비교:<\/b> 한국은 등급이 나오면 바로 재가급여를 쓰는 구조라 대기가 없다. 반대로 재원이 흔들리면 급여가 줄 수 있다는 경고이기도 하다."], "bars": {"t": "Medicaid 재가 돌봄 평균 대기 기간 (개월)", "u": "개월", "rows": [["2025", 32, "c"], ["2026", 34, "a"]]}, "nums": [["649,900", "명", "재가 돌봄 대기자", 1], ["7", "%", "전년 대비 증가(약)"]], "src": "KFF 2026.10.05", "grade": "확인"}, {"tm": "해외 · 일본", "name": "일본 개호보수 임시 개정", "co": "일본 · ISVD·JCER 민간 연구소 해설 · 2026.05 (참고, 자세한 건 '일본 시니어' 묶음)", "title": "개호보수 +2.03% 임시 개정", "q": "정기 개정을 1년 앞당겨야 할 만큼 돌봄 사업자가 버티기 힘들다.", "hl": ["1년"], "pts": ["<b>제도:<\/b> 2026년 6월 개호보수(돌봄 서비스 값) +2.03% 임시 개정. 원래 2027년 4월 정기 개정을 1년 앞당겼다. 국가 추가 지출 518억 엔.", "<b>숫자:<\/b> 처우개선 가산 최대 월 19,000엔(6.3%). 2025년 개호 사업자 파산 176건, 그중 인력 부족 파산 29건(+45.0%).", "<b>부담 구조:<\/b> 공공 재원과 보험료가 50:50, 본인부담은 보통 10%, 소득 기준을 넘으면 20~30%.", "<b>반응:<\/b> 본인부담 20% 확대안은 '검토할 수 있는 선택지'로만 언급되고 결정 여부는 확인하지 못했다.", "<b>국내와 비교:<\/b> 사업자 파산과 임금 가산은 한국 요양요원 처우 논의(4편, 임금
