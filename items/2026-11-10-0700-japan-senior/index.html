노동성 목록에 자료가 있다는 사실뿐이며 본문은 읽지 못했다.", "<b>제출자:<\/b> 2025년 12월 1일 회의 기사에 나오는 伊藤悦郎 위원(건강보험조합연합회 상무이사)과 같은 사람인지는 확인하지 못했다.", "<b>과거 발언:<\/b> 그 회의에서 이토 위원은 케어매니지먼트 이용자 부담 도입을 지지한 쪽으로 보도됐다. 현재 케어플랜 작성은 전액 보험이고 유료화는 찬반이 갈린다.", "<b>시한(추정):<\/b> 2할 대상·케어플랜 이용자 부담·경도자 급여는 제10기 개호보험사업계획(2027년도~) 시작 전에 결론을 낼 과제로 보도됐다. 유료 기사 앞부분만 읽은 내용이다."], "src": "후생노동성 자료 목록 · GemMed 2025-12-02 · 고령자주택신문 11.4(유료 기사 앞부분)", "grade": "추정"}, {"tm": "해외 · 독일", "name": "독일 연방 내각", "co": "독일 · aroundhome·euronews · 2026.09.30", "title": "간호보험 개혁법(Pflegeneuordnungsgesetz) 각료회의 의결", "q": "자녀 유무와 가족 형태에 따라 보험료를 더 나누는 쪽으로 움직였습니다.", "hl": ["자녀", "유무와"], "pts": ["<b>시장 상황:<\/b> 긴 논쟁 끝에 내각이 개혁안을 의결했다. 일반 보험료율은 내년에 유지하고, 구조개혁은 전문가위원회로 넘겨 2027년 1월까지 제안을 받는다.", "<b>숫자:<\/b> 자녀 없는 가입자 추가 요율 0.6%에서 0.9%로(2027.1.1부터). 보험료 산정 상한 300유로 인상. 급여는 2029년부터 핵심 물가상승률에 연동. 적자 규모는 80억 유로로 언급.", "<b>추가 요율:<\/b> 배우자·생활동반자 무료 가족보험에 0.52% 추가 요율(2028년부터). 이 내용은 aroundhome에만 있다.", "<b>반응:<\/b> 여론·업계 반응은 이번 조사에서 확인하지 못했다.", "<b>국내와 비교:<\/b> 한국 장기요양 2027 보험료율 논의와 같은 '재정 압박에서 부담 분담으로' 구도다. 일본이 금융소득을 보는 것과 달리 독일은 가입 형태(자녀·배우자)별로 요율을 나눈다."], "shift": {"from": "0.6%", "to": "0.9%", "cap": "자녀 없는 가입자 추가 요율 (2027년 1월 1일부터)"}, "nums": [["300", "유로", "보험료 산정 상한 인상폭"], ["0.52", "%", "무료 가족보험 추가 요율 (2028년부터)"], ["80억", "유로", "언급된 적자 규모", 1]], "src": "aroundhome · euronews 2026-09-30", "grade": "확인"}, {"tm": "해외 · 중국", "name": "중국 민정부", "co": "중국 · 중국일보(CCTV 앱 경유) · 2026.07.31 보도", "title": "2025년도 국가노령사업발전공보", "q": "60세 이상이 3억 명을 넘었고, 정책의 무게는 시장 키우기에 실렸습니다.", "hl": ["시장", "키우기에"], "pts": ["<b>시장 상황:<\/b> 민정부·전국노령사업위 공보. 60세 이상 32,338만 명(23%), 65세 이상 22,365만 명(15.9%).", "<b>숫자:<\/b> 노인 부양비 23.1%, 평균 기대수명 79.25세.", "<b>정책·시장(추정):<\/b> 2026년 1월 양로 서비스 주체 육성과 은발경제 촉진 조치. 2035년 은발경제 30조 위안 전망, 고령 친화 제품 신규 2.87만 종(2025년 1~4월, 255.2% 증가), 노인용품 시장 5조 위안 초과(원문 표기 5만억). 2025~2026년 초 자료이며 정책 문서 원문은 읽지 못했다.", "<b>반응:<\/b> 2026년 11월 쌍11 고령 친화 제품 매출은 검색에서 찾지 못했다.", "<b>국내와 비교:<\/b> 고령 인구 규모 자체가 한국 전체 인구보다 크다. 정책이 소비·서비스 주체 등 시장 육성에 방점을 둔다."], "nums": [["2
