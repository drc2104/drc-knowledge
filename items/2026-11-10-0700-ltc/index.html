업소의 인건비 논쟁과 이어진다."}, {"term": "장기근속장려금", "easy": "오래 일한 종사자에게 주는 장려금. 2026년 대상이 14.9%에서 37.6%로 넓어졌다는 보도가 있다.", "why": "사업소의 인력 유지 비용에 영향을 준다."}, {"term": "본인부담금", "easy": "수급자가 직접 내는 몫. 복지용구는 15% 등이며 감경 대상은 별도다(이번에 새로 확인하지 않음).", "why": "수가가 오르면 본인부담도 같이 오를 수 있다."}, {"term": "돌봄통합지원(통합돌봄)", "easy": "의료·요양·돌봄을 지역에서 묶어 주는 사업. 2026년 3월 전국 시행.", "why": "사업소가 지자체·병원과 연결되는 새 통로다.", "video": {"title": "(26.3.5. 자막) 지역사회 통합돌봄 추진 로드맵 | 보건복지부 브리핑 - KTV 모두 온", "url": "https://www.youtube.com/watch?v=idwWEXdGIA8"}}, {"term": "장기요양위원회", "easy": "보험료율·수가·제도개선을 결정하는 정부 위원회.", "why": "11월 2일 정리한 제5차 위원회 결정이 여기서 나왔다."}, {"term": "개호보험", "easy": "일본의 노인 돌봄 보험. 한국 노인장기요양보험과 비슷한 제도다.", "why": "본인부담 논의가 한국 복지용구 가격대 전략의 참고가 된다."}, {"term": "간호등급(Pflegegrad)", "easy": "독일에서 돌봄이 얼마나 필요한지 정하는 등급. 한국의 장기요양 등급과 비슷한 역할을 한다.", "why": "등급 판정을 강화하는 흐름은 한국의 등급·소모품 급여 관리 강화 가능성을 보는 신호다."}, {"term": "경쟁입찰(미국 의료용품)", "easy": "공급자끼리 입찰로 경쟁시켜 보험 지급가를 정하는 방식.", "why": "한국에 비슷한 가격 경쟁이 오면 소규모 사업소는 서비스로 차별화해야 한다."}], "glossaryHeadline": "수가·원가·가산, 이 토론회를 읽는 낱말 15개", "sources": [["국회도서관 자료집 서지 (행사명·일시·장소·주최·토론자 명단)", "https://dl.nanet.go.kr/detail/PAMP10000000081275"], ["한국일보 사전 안내 (주관·좌장·협회장 발언·참석 예정)", "https://www.hankookilbo.com/news/article/A2026091015540005628"], ["전국인력신문 사후 기사 (발제 숫자, 재가공 기사)", "https://www.kjob.news/news/525841"], ["파이낸스투데이 (검색 요약만 확인, 본문 접속 차단)", "https://www.fntoday.co.kr/news/articleView.html?idxno=393735"], ["KDI FOCUS 노인돌봄서비스 인력의 전망과 정책방향 (참고)", "https://www.kdi.re.kr/research/focusView?pub_no=19161"], ["한의신문 KDI 보고서 보도 (참고)", "https://www.akomnews.com/bbs/board.php?bo_table=news&wr_id=66980"], ["일본 개호보험부회 제136회 보도", "https://www.pt-ot-st.net/index.php/topics/detail/2009"], ["일본 후생노동성 제273회 분과회 공지", "https://www.mhlw.go.jp/stf/newpage_76901.html"], ["독일 Apotheken Umschau 개혁법 정리", "https://www.apotheken-umschau.de/gesundheitspolitik/pflegereform-2027-was-sich-fuer-versicherte-durch-pflegeneuordnungsgesetz-aendert-1532941.html"], ["독일 apotheke adhoc 보조기구 정액", "https://www.apothek
