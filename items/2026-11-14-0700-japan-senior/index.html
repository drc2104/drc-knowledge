<script id="item-data" type="application/json">{"id": "2026-11-14-0700-japan-senior", "date": "2026-11-14", "slot": "07:00", "topic": "일본 시니어", "type": "정부 심의회 자료·논의", "title": "일본 개호급여비분과회 제274회 정리", "subtitle": "2027년도 개호보수 개정 · 인구 감소 지역 대응 · 국내 발표 7개 · 해외 5개", "event": {"name": "사회보장심의회 개호급여비분과회 제274회", "host": "일본 후생노동성 노건국", "when": "2026.11.06(금) 14:00~17:00", "where": "온라인 회의 + 후생노동성 전용 제14회의실(방청 없음)", "theme": "2027년도 개호보수 개정 — 인구 감소 대응·학대 방지·안전·재해 대비·하라스먼트 대책"}, "headline": "일본은 사람이 줄어드는 지역부터 돌봄 기준을 풀기 시작했다", "hl": ["줄어드는", "기준을"], "summary3": [["인구 감소 지역에만 쓰는 '특정지역서비스'를 새로 만든다.", "지역 전체가 벽지 특례 대상인 299개 시정촌 가운데 방문개호 사업소가 0곳인 곳이 39곳, 1곳뿐인 곳이 164곳. 직원 배치 기준을 풀고 방문개호에 월 정액 보수를 고를 수 있게 하는 안이 나왔다."], ["기준을 풀어 주는 대신 의무와 감산은 넓힌다.", "신체 구속 줄이기는 통소 서비스까지, 사고 방지 의무는 거택·통소 사업소까지 넓히는 안. 거택·통소 사업소의 안전 위원회 운영률은 40.8%에 그친다. 특정복지용구판매도 학대 방지 미실시 감산 대상에 넣는 안이 있다(전문지 요약)."], ["해외도 같은 방향, 중국은 장기요양보험을 2028년 말까지 전국에 편다.", "중국 시범 지역은 2016년 15곳에서 2025년 말 92곳, 3.08억 명이 대상. 독일은 무자녀 간호보험료율을 4.2%에서 4.5%로 올리고 요양등급 진입 점수를 높인다."]], "cases": [["나라 · 지표", "값"], ["중국 장기요양보험 시범 대상 인구(2025년 말, 92곳)", "3.08억 명"], ["미국 메디케어 재가 건강 지급액(2027년)", "+2.4% · 약 4억 1,500만 달러"], ["독일 무자녀 간호보험료율(2027.1)", "4.2% → 4.5%"], ["싱가포르 CareShield Life 지급액 연 증가율(2026~)", "2% → 4%"]], "shift": {"from": "15곳", "to": "92곳", "cap": "중국 장기요양보험 시범 지역 (2016년 → 2025년 말, 국가의료보장국)"}, "chart": {"t": "일본 거택·통소 사업소의 안전 관리 실시율 (사업소 단독, 자료 3 · 전문지 요약)", "u": "%", "rows": [["연수", 56.6, "b"], ["지침", 54.5, "b"], ["담당자", 52.0, "b"], ["위원회", 40.8, "a"]]}, "keynums": [["39", "곳", "방문개호 사업소가 0곳인 시정촌", 1], ["164", "곳", "방문개호 사업소가 1곳뿐인 시정촌"], ["350만", "엔/년", "방문 예정 없는 날도 직원을 둬야 하는 인건비(시마네현 오치군)"], ["3.08억", "명", "중국 장기요양보험 시범 대상 인구", 1]], "overviewNote": "자료 1-1(25쪽)은 공식 PDF 본문을 직접 읽었고, 자료 1-2~5는 사회보험연구소·통소 뉴스·히토리CM 요약으로 확인했습니다. 요약으로만 본 내용은 '추정'으로 표시했고, 모두 확정안이 아닌 검토 단계 안입니다.", "sectionLabel": "발표", "sections": [{"tm": "자료 1-1", "name": "후생노동성 노건국(사무국)", "co": "자료 1-1 · 25쪽 · 공식 PDF 본문 확인", "title": "인구 감소·수요 변화에 맞춘 서비스 제공체제 — 전제와 지금까지 의견", "q": "인재 확보 대책을 다 한 뒤에도 불가피할 때만 쓰는 특례로 둔다.", "hl": ["불가피할"], "pts": ["<b>지역 3유형:<\/b> 중산간·인구 감소 지역(고령자와 수요가 줄어듦) / 대도시(2040년까지 수요 급증) / 일반 시(늘다가 줄어드는 쪽으로 전환)로 나눠 대응한다(p.8).", "<b>특정지역서비스:<\/b> 도도부현이 정한 지역에서만 쓰는 특례. 대상은 방문개호·방문입욕·통소개호·단기입소·특정시설, 시설(특양·노건·개호의료원), 거택개호지원(p.10).", "<b>사업소 공백:<\/b> 지역 전체가 벽지 특례 대상인 299개 시정촌의 사업소는 방문개호 534, 방문입욕 36, 통소개호 352, 단기입소 371곳. 방문개호 사업소가 0곳인 시정촌 39, 1곳인 시정촌 164(p.11).", "<b>보수 수준:<\/b> 국가가 일반 지정서비스보다 높은 수준으로 정한 금액을 기준으로 시정촌이 보수를 정할 수 있다(p.10).", "<b>도입 시기:<\/b> 꼭 2027년 4월 1일이 아니어도 되고, 제10기 계획 중간이나 제11기 초도 가능(p.16).", "<b>위원 우려:<\/b> \"처음부터 정의를 느슨하게 하지 말라, 모르는 사이에 넓어지면 안 된다\"(요지). ICT로 배치를 완화하는 기존 보수 구조는 거의 쓰이지 않는다는 현장 의견도 실렸다(p.19).", "<b>현장 요구:<\/b> 일본 케어테크협회는 생성AI·로봇을 쓰면 배치 기준을 유연하게 해 달라고, 시마네현 오치군은 방문 예정이 없는 날도 직원을 둬야 해 연 약 350만 엔이 든다고 호소(p.22). 월 정액 보수는 이용 실적이 계획의 50% 미만인 상태가 이어지면 자치체가 사정을 묻는 감시안(p.24)."], "bars": {"t": "지역 전체가 벽지 특례 대상인 299개 시정촌의 사업소 수 (2026년 2월 제공분 집계, p.11)", "u": "곳", "rows": [["방문개호", 534, "a"], ["단기입소", 371, "b"], ["통소개호", 352, "b"], ["방문입욕", 36, "c"]]}, "nums": [["39", "곳", "방문개호 사업소 0곳인 시정촌", 1], ["164", "곳", "방문개호 사업소 1곳뿐인 시정촌"], ["350만", "엔/년", "방문 없는 날도 두는 직원 인건비"], ["50", "%", "월 정액 보수 감시 기준(이용 실적/계획 미만)"]], "src": "자료 1-1 공식 PDF 본문(p.8~24)", "grade": "확인"}, {"tm": "자료 1-2", "name": "후생노동성 노건국(사무국)", "co": "자료 1-2 · 공식 본문 미확인, 사회보험연구소 요약(11.09)", "title": "특정지역서비스 — 논점과 대응안", "q": "방문개호에 건별 보수 말고 월 정액 보수를 사업소가 고를 수 있게 한다.", "hl": ["월", "정액"], "pts": ["<b>누가 정하나:<\/b> 특정 지역은 도도부현이 시정촌과 협의해 정하고, 대상 사업소는 시정촌에 미리 등록한다.", "<b>시설:<\/b> 정원 30인 이하 특양에 있던 병설 사업소 직원 겸무 특례를 단기입소·통소개호·소규모다기능으로 넓히고, 영양사·개호지원전문원·간호직원 배치 요건을 완화. 결원 감산 특례도 다시 본다.", "<b>재택:<\/b> 방문입욕은 ICT로 간호직원에게 상담할 수 있는 체제를 전제로 개호직원만으로 제공 가능(지금은 간호직원 상근 1명 이상). 서비스제공책임자의 정해진 보조 업무를 방문개호원이 나눠 맡는다.", "<b>질 확보:<\/b> '특정지역 운영추진회의'(가칭) 신설. 시설은 2개월에 1회 정도, 그 외는 6개월에 1회 이상(세 매체 일치).", "<b>보수:<\/b> 방문개호는 건별 보수에 더해 월 단위 정액 보수를 사업소가 선택. 요개호도·서비스 내용·이용 빈도로 구분하고, 응급·여러 명 방문은 건별로 더한다. 방문입욕·통소·거택개호지원에는 이동 시간·거리·겨울철 이동 부담을 평가하는 새 가산.", "<b>엇갈린 해설:<\/b> 보수 수준을 '일반보다 높게'(사회보험연구소)와 '같은 수준'(히토리CM)으로 다르게 썼다. 자료 1-1 p.10 문구는 '높은 수준 기준' 쪽과 일치."], "nums": [["2", "개월", "시설 운영추진회의 주기(1회 정도)"], ["6", "개월", "그 외 서비스 주기(1회 이상)"], ["30", "인 이하", "겸무 특례가 있던 특양 정원"]], "src": "사회보험연구소 2026.11.09 기사 · 히토리CM (공식 PDF 본문은 읽지 못함)", "grade": "추정"}, {"tm": "자료 2", "name": "후생노동성 노건국(사무국)", "co": "자료 2 · 공식 본문 미확인, 사회보험연구소 요약", "title": "중산간 지역 가산 · 지역 맞춤 효율화 · 사업자·종사자 부족 대응", "q": "벽지 가산 대상에 통소 서비스를 새로 넣는다.", "hl": ["통소"], "pts": ["<b>가산 확대:<\/b> '특별지역가산'과 '중산간 지역 소규모 사업소 가산' 대상에 통소계 서비스를 추가. 이유는 송영 거리·차량비·기름값 부담, 중산간 통소개호의 수익 비율이 전국 평균 이하라는 조사.", "<b>구역 밖 서비스:<\/b> 소규모다기능·정기순회 등이 담당 구역 밖으로 서비스하면 '종합매니지먼트 체제강화가산'의 선택 요건으로 인정(일률 의무는 아님).", "<b>소규모다기능:<\/b> 낮 시간 방문 직원 배치를 유연하게.", "<b>거택개호지원 위성 사업소:<\/b> 제도로 넣고 운영 체제를 평가하는 가산 신설. 사무실 없이 임대 회의실·재택근무 허용, 이용자 정보는 클라우드로 본체에 보관. 긴급 시 본체 대응과 도도부현 경계를 넘는 설치 제한은 더 검토.", "<b>위원 발언:<\/b> 전국노인복지시설협의회는 통소 추가에 찬성, 인지증 당사자와 가족회는 직원이 바빠 방문을 부탁하지 못한 사례를 들며 완화 전 수요 파악을 요구, 일본의사회는 구역 밖 평가 요건을 '명백한 수요'로 하라고 요구."], "src": "사회보험연구소 요약 (공식 PDF 본문은 읽지 못함)", "grade": "추정"}, {"tm": "자료 3", "name": "후생노동성 노건국(사무국)", "co": "자료 3 · 공식 본문 미확인, 히토리CM·통소 뉴스 요약", "title": "고령자 학대 방지 · 돌봄 현장 안전 · 위험 관리", "q": "거택·통소 사업소에도 사고 방지 의무를 지우되, 위원회 일률 의무화는 하지 않는다.", "hl": ["사고", "방지"], "pts": ["<b>학대 방지:<\/b> 특정복지용구판매를 학대 방지 조치 미실시 감산 대상에 추가하는 안(각 조치 실시율 약 90%). 거택요양관리지도는 감산 대상에서 빼는 안(연수·위원회·지침 실시율 약 60%). 경과조치가 끝나는 2027년 3월 말 뒤 일정 실적이 있는 사업소는 의무 대상.", "<b>신체 구속 줄이기:<\/b> 통소개호·지역밀착형 통소·인지증 대응형 통소·통소 재활에 위원회·지침·연수를 의무화, 안 하면 기본 보수 감산(경과조치 있음, 두 매체 일치).", "<b>안전 관리:<\/b> 지금은 개호보험 시설만 있는 사고 방지 의무를 거택·통소 사업소로 넓힌다. 위원회는 일률 의무화하지 않고 지침·사고 보고와 개선책 공유·연수(다른 사업소와 공동 가능)·담당자 지정, 1년 경과조치.", "<b>현재 실시율:<\/b> 거택·통소 사업소 단독 기준 지침 54.5%, 담당자 52.0%, 위원회 40.8%, 연수 56.6%.", "<b>주의:<\/b> 모두 검토 단계 안이며 확정 전이다."], "bars": {"t": "거택·통소 사업소 안전 관리 실시율 (%)", "u": "%", "rows": [["연수", 56.6, "b"], ["지침", 54.5, "b"], ["담당자", 52.0, "b"], ["위원회", 40.8, "a"]]}, "nums": [["90", "%", "특정복지용구판매 학대 방지 조치 실시율(약)", 1], ["60", "%", "거택요양관리지도 실시율(약)"], ["1", "년", "안전 관리 의무
