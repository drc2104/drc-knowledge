병관리청 보도자료 3건(8.10 근감소증·악력, 8.20 국립보건연구원 KURE 코호트, 10.25 노인 생활기능)과 9.30 국민건강영양조사(보충)를 신체 계통별로 다시 묶었습니다. 8.20 건은 보도자료 전문을 봤고, 8.10·10.25 건은 보도자료 PDF 글자를 읽을 수 없어 기사 여러 건으로 교차 확인했습니다. 배뇨는 이번 발표에 숫자가 없어 설명 영상과 해외 소식으로만 보강했습니다. 이 자료는 몸의 변화를 이해하기 위한 것이며 제품의 의학적 효능을 말하지 않습니다.", "sectionLabel": "몸의 변화", "sections": [{"tm": "01", "name": "근육(근감소증)", "co": "65세 이상 9.4% · 80세 이상 26.9%(4명 중 1명) · 질병관리청 8.10", "title": "80세 이상 4명 중 1명 근감소증", "q": "근감소증은 나이 들면 당연한 일이 아니라, 근육량·힘·기능이 함께 줄어드는 노인성 질환이다.", "hl": ["노인성", "질환이다."], "pts": ["<b>무엇이 바뀌나:<\/b> 근육량·힘·기능이 함께 줄어든다. 65세 이상 전체 9.4%, 65~69세 4.4% → 70~74세 7.5% → 75~79세 9.4% → 80세 이상 26.9%로 80세에서 크게 뛴다.", "<b>남녀 차이:<\/b> 65~69세는 여자 5.8%·남자 2.6%로 여자가 높지만, 70대부터는 남자가 더 높다. 80세 이상은 남자 28.9%·여자 25.6%.", "<b>숫자 읽는 법:<\/b> 8.20 보도자료는 2022년 국민건강영양조사 기준으로 65세 이상 7.9%, 80세 이상 20.0%라고 적었다. 분석 연도와 방식이 달라 생긴 차이다(8.10 발표는 2022~2024년 합산 약 1만 명 표본으로 보도됨).", "<b>생활 불편:<\/b> 걷기·일어서기 같은 일상 동작이 힘들어진다. 질병관리청은 체중이 갑자기 줄거나 자주 넘어지면 병원 진료를 받으라고 권했다.", "<b>필요한 제품:<\/b> 보행 보조, 안전손잡이, 단백질 보강 식품.", "<b>급여 복지용구:<\/b> 이번 조사에서 확인하지 않음.", "<b>우리 회사:<\/b> 근육 전용 제품은 없음(빈자리). '자주 넘어짐'이 병원에 갈 신호로 꼽힌 만큼, 고관절보호대 고객층과 겹치는 지점이다."], "bars": {"t": "나이별 근감소증 비율 (%, 질병관리청 8.10)", "u": "%", "rows": [["65~69세", 4.4, "c"], ["70~74세", 7.5, "c"], ["75~79세", 9.4, "b"], ["80세 이상", 26.9, "a"]]}, "nums": [["9.4", "%", "65세 이상 전체 근감소증"], ["26.9", "%", "80세 이상 근감소증", 1]], "video": {"title": "근감소증, 미리 알면 예방할 수 있다! 증상과 치료법은? | 양진규 교수", "url": "https://www.youtube.com/watch?v=6OoGyokUFmE"}, "src": "질병관리청 8.10 보도자료(기사로 확인: 브라보마이라이프 19806 · 코메디닷컴 2844488 · 한겨레 기사 전재) · 8.20 보도자료 배경 숫자", "grade": "확인"}, {"tm": "02", "name": "손 힘(악력)", "co": "악력 저하 65~69세 8.0% → 80세 이상 39.7% · 질병관리청 8.10", "title": "손으로 쥐는 힘으로 보는 노쇠 신호", "q": "손으로 쥐는 힘이 약해지는 것은 여러 노쇠 위험이 함께 나타나는 신호다.", "hl": ["쥐는", "신호다."], "pts": ["<b>무엇이 바뀌나:<\/b> 손으로 쥐는 힘(악력)이 약해진다. 저하 비율은 65~69세 8.0%, 70~74세 12.7%, 75~79세 20.4%, 80세 이상 39.7%(여자 41.5%·남자 36.8%).", "<b>기준:<\/b> 남자 28kg, 여자 18kg 미만이면 악력 저하로 본다(8.20 보도자료 평가 기준).", "<b>근감소증과 겹침:<\/b> 악력 저하군의 85.0%가 근감소증을 함께 가졌다. 다만 근감소증 판정 기준에 악력이 들어 있어 '손힘이 약하면 85% 확률로 근감소증'으로 읽으면 안 된다(코메디닷컴 지적).", "<b>전문가:<\/b> 박기수 경상국립대 교수는 악력 저하를 여러 노쇠 위험 요인이 함께 나타나는 신호로 봤다.", "<b>집에서 확인:<\/b> 악력계로 재는 것이 가장 좋고, 집에서는 손 맞잡기·병뚜껑 열기·수건 짜기로 변화를 볼 수 있다. 한국형 노인노쇠 진단척도(K-FRAIL) 활용도 권했다.", "<b>생활 불편·필요한 제품:<\/b> 병뚜껑·지퍼·단추처럼 손끝 힘이 드는 일이 어려워진다. 손힘이 약해도 입고 벗기 쉬운 허리·여밈 설계가 필요하다. 급여 복지용구 여부는 확인하지 않음.", "<b>우리 회사:<\/b> 요실금팬티·고관절보호대는 손으로 끌어올리고 여미는 제품이다. 여자 18kg 미만의 손힘으로도 혼자 입고 벗을 수 있는지가 점검 기준이 된다."], "bars": {"t": "나이별 악력 저하 비율 (%, 질병관리청 8.10)", "u": "%", "rows": [["65~69세", 8.0, "c"], ["70~74세", 12.7, "c"], ["75~79세", 20.4, "b"], ["80세 이상", 39.7, "a"]]}, "nums": [["39.7", "%", "80세 이상 악력 저하", 1], ["41.5", "%", "80세 이상 여자 악력 저하"], ["18", "kg 미만", "여자 악력 저하 기준"]], "video": {"title": "[건강 알고리즘]근육 나이, 근감소증 알려주는 '악력'의 비밀", "url": "https://www.youtube.com/watch?v=xyoeBIspbtA"}, "src": "질병관리청 8.10 보도자료(기사로 확인: 브라보마이라이프 19806 · 코메디닷컴 2844488 · 한겨레 기사 전재) · 기준 kg은 8.20 보도자료", "grade": "확인"}, {"tm": "03", "name": "심장·혈관", "co": "KURE 65세 이상 2,997명 중 기능성 근감소증 7% · 심혈관질환 위험 1.92배 · 국립보건연구원 8.20", "title": "근력과 신체기능 저하, 심혈관질환 예방의 새 관리 지표", "q": "근육량만이 아니라 근력과 신체기능 같은 실제 근육 기능을 함께 봐야 한다.", "hl": ["실제", "근육"], "pts": ["<b>연구:<\/b> 심혈관 고위험군 코호트 KURE의 65세 이상 2,997명을 건강보험 청구자료·통계청 사망자료와 이어 봤다. 추적 기간 중앙값은 심혈관질환 9.5년, 사망 9.6년. 논문은 Scientific Reports(2026.07.16 온라인 게재).", "<b>평가 방법:<\/b> 악력(남자 28kg·여자 18kg 미만)과 '의자에서 일어나 3m 걷고 돌아와 앉기' 12초 이상으로 봤다.", "<b>처음 상태:<\/b> 근감소증 없음 70%, 가능 단계 23%, 기능성 근감소증 7%.", "<b>결과:<\/b> 기능성 근감소증은 없는 사람보다 심혈관질환 위험 1.92배, 전체 사망 1.45배.", "<b>4년 뒤:<\/b> 다시 조사한 1,990명 중 근감소증이 새로 생긴 사람은 심혈관질환 1.56배·사망 1.67배, 계속 이어진 사람은 약 1.65배. 좋아진 사람은 뚜렷한 연관이 없었다(표본이 작음). 근육량은 재지 않은 것이 한계.", "<b>권고:<\/b> 김민주 보건연구사는 실제 근육 기능을 함께 봐야 한다고 했고, 김원호 만성질환융복합연구부장은 걷기 같은 신체활동과 근력·균형 운동을 규칙적으로 하고 악력과 보행·이동 기능 변화를 주기적으로 확인하라고 했다.", "<b>우리 회사:<\/b> 심장 관련 제품은 없음. 위험비는 '병이 생길 가능성이 몇 배인지'일 뿐이라 광고·상세 문구에서 제품 효과처럼 쓰면 안 된다."], "bars": {"t": "근감소증 상태별 위험 (배, 근감소증 없는 사람 = 1)", "u": "배", "rows": [["기능성 근감소증 · 심혈관질환"
