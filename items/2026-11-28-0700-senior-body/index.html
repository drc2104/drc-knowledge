abel": "몸의 변화", "sections": [{"tm": "01", "name": "약을 처리하는 몸 · 다제약물", "co": "노인 환자 41.9%가 5개 이상, 13.9%가 10개 이상(심평원 2021년 연구, 90일 기준)", "title": "고령사회의 의약품 사용의 문제점 — 김동숙 국립공주대 보건행정학과 교수", "q": "제일 문제는 부적절한 다약제다. 나이가 아니라 환자 한 사람 기준으로 먹는 약 전체를 봐야 한다.", "hl": ["부적절한", "다약제다."], "pts": ["<b>무엇이 바뀌나:<\/b> 같은 65세 이상이라도 노쇠 정도와 신장 기능이 다르다. 여러 병원에서 처방을 받고 남은 약까지 있어 복용 기간이 겹친다(청구자료를 어떻게 세느냐에 따라 결과도 달라진다).", "<b>숫자:<\/b> 90일 기준 5개 이상이 다약제, 10개 이상이 과도한 다약제. 입원 비율은 과도한 다약제군 31.1% 대 다약제 아닌 쪽 17.0%, 응급실 방문은 17.8% 대 8.8%.", "<b>생활 불편:<\/b> 수면제·진정제처럼 졸리거나 어지러운 약은 넘어짐으로, 넘어짐은 골절로 이어질 수 있다.", "<b>제도의 빈틈:<\/b> 처방 때 뜨는 의약품안전사용서비스(DUR) 노인주의 알림은 처방을 막지 못하고, 경고가 너무 자주 뜬다는 현장 의견이 있다. 평소 건강·처방 이력을 계속 보는 주치의 체계가 과제로 꼽혔다.", "<b>필요한 제품 · 급여 복지용구 · 우리 회사:<\/b> 약 개수·중복·상호작용·낙상 위험을 한 사람 기준으로 점검하는 체계가 필요하다고 했다. 약 정리함·복약 알림은 우리 제품이 없다(빈자리). 급여 복지용구와의 연결은 이번 자료에 없다.", "<b>우리에게:<\/b> 졸림·어지럼 약을 드시는 어르신은 넘어짐이 걱정되는 층이다. 고관절보호대 안내 자료에 이 발표를 출처로 '약을 여러 개 드시는 분'을 대상 설명에 넣을 수 있다. 약이나 보호대의 의학적 효과는 쓰지 않는다."], "bars": {"t": "약 개수별 입원·응급실 비율 (%, 심평원 2021년 연구)", "u": "%", "rows": [["입원 · 10개 이상", 31.1, "a"], ["입원 · 다약제 아님", 17.0, "c"], ["응급실 · 10개 이상", 17.8, "b"], ["응급실 · 다약제 아님", 8.8, "c"]]}, "nums": [["41.9", "%", "노인 환자 다약제(5개 이상)", 1], ["13.9", "%", "과도한 다약제(10개 이상)"], ["90", "일", "약 개수를 세는 기준 기간"]], "video": {"title": "부모님 약이 너무 많아요! - 노년기 다제약물, 환자와 가족이 알면 좋은 것들(서울아산병원 노년내과 정희원, 약제팀 이미리내)", "url": "https://www.youtube.com/watch?v=t00XUZ-Vx-c"}, "src": "브라보마이라이프 20629 (2026.11.27 현장 기사)", "grade": "확인"}, {"tm": "02", "name": "약을 처리하는 몸 · 집에서 약 점검(방문약료)", "co": "통합돌봄 선도사업 현장(충북 한 군) · 이용 규모 숫자는 공개 안 됨", "title": "노인 의약품 사용 지원·관리: 통합돌봄 선도사업과 다제약물 관리사업 — 박은자 한국보건사회연구원 연구위원", "q": "약사가 현장에서 실제로 먹는 약과 문제를 확인하고, 처방 조정이 필요하면 의사와 정보를 나누는 지역 협업 체계가 필요하다.", "hl": ["지역", "협업"], "pts": ["<b>무엇이 바뀌나:<\/b> 지역사회 통합돌봄에 방문약료(약사가 집에 와서 먹는 약을 점검)를 붙인다. 지자체 통합돌봄 전담부서가 지역 약사회·보건소와 연계해 제공한다.", "<b>현장 문제(충북 한 군 선도사업):<\/b> 상담 전에 약사가 복용약 정보를 받지 못했다. 상담이 경로당에서 이뤄져 집에 누워 있는 환자는 이용하기 어려웠다. 약사 1인 약국이 많아 방문 인력이 모자랐다.", "<b>생활 불편:<\/b> 거동이 일 5개 이상)과 같다.", "<b>우리에게:<\/b> 제품 영향은 없다. 약 점검 주제 콘텐츠를 만들 때 원문을 직접 확인한 뒤에만 인용한다."], "nums": [["1", "회/년", "65세 이상 약 점검 권고"], ["5", "개+", "우선 점검 대상 복용 개수", 1], ["100", "개+", "근거 임상시험"]], "src": "McGill 보도자료 2026.06.03 (본문 열람 실패, 검색 요약)", "grade": "추정"}, {"tm": "해외 · 영국", "name": "스코틀랜드 정부 최고의료책임자(CMO)", "co": "영국(스코틀랜드) · 정부 지침 · 2026.03.02", "title": "다제약물 지침 2026~2029: 7단계 약물 검토", "q": "스코틀랜드는 3년마다 다제약물 지침을 새로 고치고, 7단계로 약을 검토하게 한다.", "hl": ["7단계로"], "pts": ["<b>시장 상황:<\/b> 「Polypharmacy Guidance 2026-2029」가 나왔다. 적절한 처방으로 약을 안전하고 효과 있게 쓰자는 지침이다.", "<b>숫자:<\/b> 약물 검토를 7단계(7-Steps)로 나눈다. 지침은 2026~2029년, 3년 주기다.", "<b>반응:<\/b> 정부 공식 지침이라 처방 현장 기준이 된다. 부록 페이지만 열람해 세부 단계 내용은 확인하지 못했다.", "<b>국내와 비교:<\/b> 한국은 처방 때 알림(DUR)을 띄우지만 처방을 막지 못한다는 지적이 나왔다(①). 스코틀랜드는 정해진 순서로 약을 검토하는 틀을 갖췄다.", "<b>우리에게:<\/b> 제품 영향은 없다. 정보 콘텐츠의 해외 비교 자료로만 쓴다."], "nums": [["7", "단계", "약물 검토 순서", 1], ["3", "년", "지침 갱신 주기(2026~2029)"]], "src": "gov.scot Polypharmacy Guidance 2026-2029 (부록 페이지 열람)", "grade": "확인"}, {"tm": "해외 · 일본", "name": "후생노동성", "co": "일본 · 정부 지침 · 2026.03.31 확정, 07.31 보급자료 통지", "title": "고령자의 의약품 적정사용 지침: 약국이 한곳에서 관리", "q": "일본은 약국이 어르신의 조제와 약 정보를 한곳에서 관리하고 주치의가 점검하는 구조를 문서로 정했다.", "hl": ["한곳에서"], "pts": ["<b>시장 상황:<\/b> 「고령자의 의약품 적정사용 지침」 총론·각론을 2026년 3월 31일 확정하고, 7월 31일 보급자료를 통지했다.", "<b>제품:<\/b> 약국이 조제·정보를 일원 관리하고 주치의가 점검하는 구조. PDF 글자를 뽑지 못해 검색 요약 기준이다.", "<b>숫자:<\/b> 확정일 2026.03.31, 보급자료 통지 2026.07.31 외에 이번 조사에서 확인된 숫자는 없다.", "<b>국내와 비교:<\/b> 한국은 약사 방문약료와 의사 협업이 논의 단계다(②). 일본은 약국 일원 관리를 지침으로 문서화했다.", "<b>우리에게:<\/b> 일본 수출 담당은 약국이 어르신 정보를 모으는 구조를 참고만 한다. 약국 판로 가능성은 원문 확인 뒤 판단한다."], "src": "후생노동성 PDF (텍스트 추출 실패, 검색 요약)", "grade": "추정"}, {"tm": "해외 · 중국", "name": "민정부 등 6개 부문", "co": "중국 · 정부 정책 · 2026.11.04 발표(11.06 보도)", "title": "고령친화 용품 소비를 늘리는 14개 조치", "q": "중국은 고령친화 용품을 직접 써 보고 빌릴 수 있는 매장과 온라인 전용 코너를 늘린다.", "hl": ["써", "보고"], "pts": ["<b>시장 상황:<\/b> 「다양한 장면을 키워 고령친화 용품 소비를 촉진하는 몇 가지 조치」 14개 조치를 발표했다.", "<b>제품:<\/b> 양로시설·커뮤니티에 체험·임대 매장, 전자상거래에 시니어(은발) 섹션, 편의점·약국의 보행 보조 제품 확대.", "<b>숫자:<\/b> 조치 14개. 판매·보급 숫자 목표는 없다. 60세 이상 인구 3.1억 명(2024년 말, 신화통신 보도 검색 요약)은 추정값이다.", "<b>국내와 비교:<\/b> 써 보고 빌리는 방향이 한국 복지용구 대여·사업소 모델과 비슷하다.", "<b>우리에게:<\/b> 당장 중국 판로는 아니다. 해외 수출 담당은 약국·편의점 보행 보조 진열이 실제로 늘어나는지 지켜본다."], "nums": [["14", "개", "고령친화 용품 소비 조치", 1], ["6", "개 부문", "함께 발표한 정부 부문"], ["3.1억", "명", "60세 이상(2024년 말, 추정)"]], "src": "베이징일보 2026.11.06 · 인구는 신화통신 검색 요약(추정)", "grade": "확인"}, {"tm": "해외 · 미국", "name": "Cerna Healthcare SafePatch", "co": "미국 · 의료 경제 매체 · 2026.09.15(출고 10월 예정)", "title": "피부에 붙이는 넘어짐 감지 패치, 본체에 월 요금", "q": "넘어지면 가족에게 바로 알리는 패치를 기기값과 월 모니터링 요금으로 판다.", "hl": ["월", "모니터링"], "pts": ["<b>제품:<\/b> 피부에 붙이는 넘어짐 감지 패치. 넘어짐·배터리 부족·SOS 알림, 방수, 한 번 충전으로 1주.", "<b>숫자:<\/b> 본체 $99(6개월분 패치 포함), 가족 모니터링 월 $9.99, 전문 모니터링 월 $29.99.", "<b>반응:<\/b> 10월 출고 예정이었고, 판매처는 기사에 없다. 실제 사용 후기는 확인하지 못했다.", "<b>국내와 비교:<\/b> 국내 낙상 센서도 기기값에 월정액을 붙이는 구조를 참고할 만하다.", "<b>우리에게:<\/b> 고관절보호대(보호)와 감지 기기(알림)를 함께 쓰는 묶음 사례로 3본부·2본부가 지켜본다. 함께 판다면 각 제품 효과를 과장하지 않는 것이 전제다."], "bars": {"t": "SafePatch 가격 (달러)", "u": "달러", "rows": [["본체(6개월분 패치 포함)", 99, "a"], ["전문 모니터링 / 월", 29.99, "b"], ["가족 모니터링 / 월", 9.99, "c"]]}, "nums": [["1", "주", "한 번 충전으로 쓰는 기간"]], "src": "Medical Economics 2026.09.15", "grade": "확인"}, {"tm": "해외 · 미국", "name": "JAGS(미국노인병학회지) 리뷰", "co": "미국 · 학술지 리뷰(코메디닷컴 2026.11.19 인용) · 2026.11.16 온라인", "title": "입 건강과 몸 전체 노화: 구강 노쇠", "q": "씹고 삼키는 힘이 약해진 사람은 근감소증·영양불량·노쇠를 함께 가진 경우가 많았다.", "hl": ["씹고", "삼키는"], "pts": ["<b>시장 상황:<\/b> 리뷰 「The Oral-Systemic Interface in Healthy Longevity」가 입 건강과 몸 전체 노화의 관계를 정리했다.", "<b>숫자:<\/b> 2025년 메타분석(연구 23개, 2만 7,585명)에서 구강 노쇠가 있으면 근감소증 동반 2.01배, 영양불량 2.18배, 신체 노쇠 1.78배.", "<b>반응:<\/b> 국내 건강 매체(코메디닷컴)가 소개했다. 리뷰 원문은 열지 않은 2차 인용이다.", "<b>국내와 비교:<\/b> 이번 국내 학술대회에는 입·삼킴을 다룬 발표가 없었다. 노쇠를 '사람 전체'로 보자는 방향은 같다.", "<b>우리에게:<\/b> 우리 제품 계통은 아니라 빈자리로만 표시한다. 시니어 정보 콘텐츠에서 입 건강을 다룰 때 '관련이 있다' 수준으로만 쓴다."], "bars": {"t": "구강 노쇠가 있을 때 함께 나타날 가능성 (배, 2025 메타분석 23개 연구)", "u": "배", "rows": [["영양불량", 2.18, "a"], ["근감소증", 2.01, "b"], ["신체 노쇠", 1.78, "c
