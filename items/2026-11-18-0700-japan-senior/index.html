[{"k": "일본용 상세페이지는 '집에서 받는 돌봄' 장면으로", "p": "우선", "d": "일본 개호보험 급여비는 거택 서비스(5조 4,407억 엔)가 시설(3조 3,722억 엔)보다 크다. 큐텐재팬 요실금팬티 상세페이지와 광고 그림을 시설보다 집에서 가족이 돌보는 장면 중심으로 다시 짠다.", "r": "④ 급여비", "who": "2본부 · 일본 수출 담당"}, {"k": "일본 수요는 '65세 인구'보다 '인정자 수'로 잰다", "p": "우선", "d": "65세 이상 가입자는 5만 명 줄었지만 돌봄 필요 인정자는 721만 명으로 과거 최다다. 일본 판매 목표·광고 대상 규모를 잡을 때 인정자 수와 급여비를 기준 지표로 쓰고, 매년 8월 연보가 나오면 갱신한다.", "r": "① 가입자 · ② 인정자", "who": "2본부 · 일본 수출 담당"}, {"k": "고관절보호대 일본 진출 전 개호보험 복지용구 품목 확인", "p": "검토", "d": "일본 거택 서비스에는 복지용구 대여·판매가 연결돼 있다. 고관절보호대가 일본 개호보험 복지용구 대상이 될 수 있는지, 아니면 일반 판매로 가야 하는지 다음 조사에서 후생노동성 품목 기준으로 확인한다.", "r": "④ 급여비", "who": "3본부"}, {"k": "한국 급여 판매 준비에 미국의 '지급 대 감시' 구도 참고", "p": "검토", "d": "미국 CMS는 재택건강 지급을 약 2.4% 올리면서 부정수급 관리를 강화했다. 2027년 3월 고관절보호대 급여 판매를 앞두고 청구 서류·사업소 안내 자료를 처음부터 점검 기준에 맞춰 만든다.", "r": "⑦ 미국 CMS", "who": "3본부"}, {"k": "중국 '보호 의류' 정책 품목을 지켜보기", "p": "유지", "d": "중국 8개 부처 지침에 보호 의류·고령친화 상품이 품목으로 들어갔다. 요실금팬티 같은 기능성 속옷이 중국 정책 지원 품목에 해당하는지 다음 해외 조사 과제로 넣는다. 당장 진출 판단은 하지 않는다.", "r": "⑥ 중국 8개 부처", "who": "2본부 · 4본부"}, {"k": "숫자 해설 영상 소재로: '일본 돌봄 돈 11조 엔'", "p": "검토", "d": "가입자는 줄고 돌봄 돈은 과거 최고라는 대비는 숫자 해설 채널 소재로 쓰기 좋다. 1장·2장·4장 숫자만으로 쇼츠 1편을 만들 수 있고, 출처는 후생노동성 연보로 단다.", "r": "① · ② · ④", "who": "1본부"}], "glossary": [{"term": "개호보험", "easy": "일본의 노인 돌봄 보험(2000년 시작). 한국 노인장기요양보험과 비슷하다.", "why": "한국 장기요양과 비교하는 기준이며, 일본 시니어 용품 시장의 바탕이다.", "video": {"title": "介護保険制度の全体概要 / 動画でわかる障がい者福祉制度・サービス", "url": "https://www.youtube.com/watch?v=crWLvrRqC7Q"}}, {"term": "제1호 피보험자", "easy": "개호보험에 가입한 65세 이상.", "why": "일본 시니어 시장의 인구 크기를 보여 준다."}, {"term": "요개호·요지원 인정", "easy": "돌봄이 얼마나 필요한지 등급을 매기는 판정. 등급을 받아야 보험 돌봄을 쓴다.", "why": "복지용구를 쓸 수 있는 사람의 규모가 된다."}, {"term": "급여비", "easy": "보험이 대신 내 준 돌봄 비용(본인부담 제외).", "why": "일본 돌봄 시장 크기를 재는 대표 숫자다."}, {"term": "비용액", "easy": "급여비에 이용자 본인부담을 더한, 돌봄에 실제 쓰인 전체 돈.", "why": "실제 지출 규모를 볼 때 쓴다."}, {"term": "거택 서비스", "easy": "집에서 받는 돌봄(방문 돌봄·주간 보호·복지용구 대여 등).", "why": "복지용구 대여·판매와 이어지는 영역으로, 시설보다 돈이 더 많이 간다.", "video": {"title": "介護保険制度の概要", "url"
