테크42 현장 기사(6.17, 제목만) · KDI 경제정보센터 식약처 정책설명회 안내(11.10)", "grade": "추정"}, {"tm": "해외 · 미국", "name": "Numerator", "co": "미국 · 소비자 구매 패널 보도자료 · 2026.07.28", "title": "미국 K-뷰티 판매 20억 달러 돌파", "q": "미국 가구 4곳 중 1곳이 K-뷰티를 사 봤고, 다시 사는 사람이 거의 두 배가 됐다.", "hl": ["두", "배가"], "pts": ["<b>시장 상황:<\/b> 미국 K-뷰티 판매가 20억 달러를 넘었다. K-뷰티 스킨케어는 2026년 1분기까지 12개월 동안 51% 성장.", "<b>숫자:<\/b> 구매 경험 가구 25%(2020년 8%), 재구매율 26% → 48%. 소비 비중 아마존 44%·세포라 24%·얼타 11%. 증가율 아마존 +62%, 틱톡숍 +223%.", "<b>반응:<\/b> 상위 브랜드는 메디큐브·라네즈·글로우레시피·코스알엑스·바이오던스.", "<b>국내와 비교:<\/b> 올리브영·한진이 말한 '미국이 다음 거점, 온라인부터'와 같은 방향. 다만 가구 패널 기준 숫자라 한국 수출액과는 성격이 다르다."], "bars": {"t": "미국 K-뷰티 소비가 일어나는 곳 (%, Numerator)", "u": "%", "rows": [["아마존", 44, "a"], ["세포라", 24, "b"], ["얼타", 11, "c"]]}, "shift": {"from": "26%", "to": "48%", "cap": "미국 K-뷰티 재구매율 (Numerator)"}, "nums": [["51", "%", "K-뷰티 스킨케어 12개월 성장"], ["25", "%", "구매 경험 가구 (2020년 8%)"], ["223", "%", "틱톡숍 증가율", 1]], "table": [["나라", "시장·성장", "제도·상황", "한국 수출·점유"], ["한국(기준)", "1~10월 수출 124억4669만 달러, +32.3%", "식약처 1~9월 111억 달러(+31.1%)", "2025년 연간 114억 달러"], ["미국", "K-뷰티 20억 달러 이상, 스킨케어 +51%", "아마존 44%·세포라 24%·얼타 11%", "1~10월 26억6003만 달러(+43.1%), 1위 *"], ["중국", "2025년 1.1조 위안, +2.8% / 쌍11 +4.8%", "강제 안전표준 2028.01.01 시행", "1~10월 17억7458만 달러(+2.7%), 비중 14.3% *"], ["일본", "한국 코스메 1,798억 엔(2025), +23.1%", "일본 화장품의 6.1%", "1~9월 9억9122만 달러(3위)"], ["유럽", "전체 숫자 없음", "CMR 성분 규제(Omnibus VI) 의회 통과", "영·네·폴 합계 12억7407만 달러, 비중 10.2%"]], "src": "Numerator 보도자료(2026.07.28) · 비교표: 전자신문(11.24)·산업통상부 통계 등. * 표시 미국·중국 1~10월 수출은 조사원 보고 기준, 원문 재대조 안 함", "grade": "확인"}, {"tm": "해외 · 유럽", "name": "유럽의회 · 한국 수출 통계", "co": "유럽 · Personal Care Insights · 2026.10.26 / 전자신문 · 2026.11.24", "title": "유럽, 한국 화장품이 가장 빨리 느는 곳에 성분 규제가 겹친다", "q": "네덜란드 수출이 네 배 가까이 뛰는 사이, 유럽은 발암·생식독성 성분 규제를 손봤다.", "hl": ["네", "배"], "pts": ["<b>제도:<\/b> 10월 22일 유럽의회가 'Omnibus VI'를 찬성 477·반대 59·기권 41로 채택. 발암·변이·생식독성(CMR) 성분 금지에 유예를 두되, 면제 신청을 안 하면 6개월 안에 판매 중단, 12개월 안에 재고 소진. 이사회 정식 채택·관보 게재가 남았고 시행일은 원문에 없다.", "<b>숫자:<\/b> 2026년 1~10월 한국 화장품 수출 영국 5억272만 달러(+182.2%), 네덜란드 4억2415만 달러(+294.8%), 폴란드 3억4719만 달러(+54.6%). 세 나라 합계 12억7407만 달러, 전체 수출의 10.2%.", "<b>반응:<\/b> 유럽은 한국 화장품 수출이 가장 빠르게 느는 곳이지만, 들어가려면 성분 규제 확인이 먼저.", "<b>국내와 비교:<\/b> 에이피알이 말한 '수출 시장이 미국·유럽으로 넓어졌다'를 숫자로 확인. 한진이 강조한 '규제 정보를 빨리 아는 물류'의 중요성과 같은 이야기."], "bars": {"t": "한국 화장품 유럽 3국 수출 (만 달러, 2026년 1~10월)", "u": "만 달러", "rows": [["영국", 50272, "a"], ["네덜란드", 42415, "a"], ["폴란드", 34719, "b"]]}, "nums": [["294.8", "%", "네덜란드 수출 증가율", 1], ["10.2", "%", "유럽 3국이 전체 수출에서 차지하는 비중"], ["477", "표", "Omnibus VI 유럽의회 찬성"]], "src": "Personal Care Insights(2026.10.26) · 전자신문(2026.11.24)", "grade": "확인"}, {"tm": "해외 · 일본", "name": "@cosme · 플라자", "co": "일본 · 헤럴드경제 · 2026.10.27", "title": "일본 매장 순위 위에 올라선 K뷰티 에센스·크림·선크림", "q": "일본에서 K뷰티는 에센스·크림·선크림으로 순위 맨 위에 올랐다.", "hl": ["에센스·크림·선크림으로"], "pts": ["<b>시장 상황:<\/b> 2026년 1~9월 한국 화장품의 일본 수출 9억9122만 달러(한국화장품산업연구원 인용), 미국·중국에 이어 3위.", "<b>제품:<\/b> @cosme 상반기 에센스 1위 아누아, 페이스 크림 2위 이니스프리. 오사카 매장 선크림 1위 달바, 페이스 크림 1위 에스트라. 플라자 오사카 스킨케어 매대에 메디큐브·달바.", "<b>숫자(참고, 범위 밖):<\/b> 일본 조사회사 TPC마케팅리서치는 2025년 일본 안 한국 화장품을 1,798억 엔(+23.1%), 일본 화장품 전체의 6.1%로 봤다(표본·방법 공개 없음).", "<b>국내와 비교:<\/b> 점유율은 늘지만 수출 증가율은 미국보다 낮아 성장은 느린 편. 한진은 일본 역직구를 '인천공항 입고 후 다음 비행기'로 풀었다."], "table": [["매장·부문", "K뷰티 순위"], ["@cosme 상반기 에센스", "1위 아누아"], ["@cosme 상반기 페이스 크림", "2위 이니스프리"], ["오사카 선크림", "1위 달바"], ["오사카 페이스 크림", "1위 에스트라"]], "nums": [["9억9122만", "달러", "1~9월 일본 수출 (3위)", 1], ["6.1", "%", "일본 화장품 중 한국 화장품 비중(2025, TPC)"]], "src": "헤럴드경제(2026.10.27) · 드림뉴스 TPC마케팅리서치 보도(2026.04.30, 범위 밖 참고)", "grade": "확인"}, {"tm": "해외 · 일본", "name": "큐텐 재팬", "co": "일본 · 아시아경제 영문판 · 2026.04.14 (범위 밖 참고)", "title": "일본 온라인 뷰티 30%를 쥔 큐텐, 그래도 오프라인을 본다", "q": "새로 발굴한 200개 브랜드 중 188개가 K-뷰티였다.", "hl": ["188개가"], "pts": ["<b>시장 상황:<\/b> 일본 화장품 시장에서 온라인 비중은 10% 미만, 드럭스토어·백화점이 중심.", "<b>숫자:<\/b> 큐텐 재팬 지난해 매출 684억 원(+56.3%), 흑자 전환. 일본 온라인 뷰티의 30% 이상을 차지. 신규 발굴 200개 브랜드 중 188개가 K-뷰티.", "<b>반응:<\/b> 2027년 상반기 도쿄에 대형 매장(플래그십)을 열 계획. 온라인만으로는 한계가 있다는 판단.", "<b>국내와 비교:<\/b> 올리브영
