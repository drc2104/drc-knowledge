, "pts": ["<b>무엇이 새로운가:<\/b> 마리떼 언더웨어가 첫 앰버서더를 세웠다(제목 기준).", "<b>숫자:<\/b> 가격·행사는 확인하지 못했다. 검색에서 이 라인의 첫 출시가 2025-11-13(여성 브라·힙스터 등 8가지 스타일, 공식 스토어 최대 10% 할인)이라는 기사가 나왔으나, 이번 소식과의 연결은 확인하지 못했다.", "<b>마케팅:<\/b> 패션 브랜드 이름값 + 앰버서더.", "<b>고객 반응:<\/b> 확인하지 못했다.", "<b>우리에게:<\/b> 패션 브랜드의 언더웨어 진출 흐름으로 참고만 한다."], "src": "패션포스트 11.22 — 구글뉴스 RSS 제목만 확인", "grade": "추정"}, {"tm": "하 · 11.23", "name": "Z세대 '컴포트 패션'", "co": "한국 · 쿠키뉴스 11.23 (RSS 제목)", "title": "\"옷도 속옷도 불편하면 안 입는다\"", "q": "젊은 고객은 속옷을 편안함으로 고른다.", "hl": ["편안함으로"], "pts": ["<b>무엇이 새로운가:<\/b> Z세대가 옷과 속옷 모두 편한 것을 고른다는 기사(제목 기준).", "<b>숫자:<\/b> 본문·수치는 확인하지 못했다. 같은 방향의 앞 회차 소식으로 지그재그 노와이어 +25%(11/23), 속옷 세대교체 기사가 있었다.", "<b>마케팅:<\/b> '편안함'을 내세우는 흐름.", "<b>고객 반응:<\/b> 확인하지 못했다.", "<b>우리에게:<\/b> '편하다'는 말만 쓰지 말고 사이즈 폭·소재 정보와 함께 구체적으로 쓴다."], "src": "쿠키뉴스 11.23 — 구글뉴스 RSS 제목만 확인", "grade": "추정"}], "flow": [{"k": "'최대 ○%' 문구와 실제 할인의 차이 (미국·캐나다)", "d": "Knix는 '최대 50%'를 걸었지만 주력 누수방지 속옷은 20~25%, Skims는 전 상품 30%를 '드문 행사'로 포장한다. 앞 회차 WUKA·Modibodi도 같은 구조였다", "who": [1, 3]}, {"k": "남성 요실금 제품이 이어서 나온다 (국내)", "d": "11/21 유한킴벌리 디펜드 맨 가드에 이어 11/25 수려니 맨 프로텍트. 남성 요실금 쪽에 경쟁 업체가 늘고 있다", "who": [2]}, {"k": "수상·인증·연예인으로 믿음 쌓기 (한국·일본·중국 같은 방향)", "d": "일본 와코루는 마더스 셀렉션 수상, Mieloa는 연예인 프로듀스, 중국 Ubras는 배우 사진, 국내 동아제약은 유튜브 수상, 마리떼는 첫 앰버서더. 단 중국에서는 몸 비교에 대한 반발도 나왔다", "who": [4, 5, 6, 7, 8]}, {"k": "편안함과 사이즈 폭 (한국·일본 같은 방향)", "d": "일본 나이트브라는 20사이즈, 국내는 Z세대 '불편하면 안 입는다'. 편안함을 사이즈·소재 정보로 보여 주는 쪽으로 간다", "who": [5, 9]}], "flowHeadline": "할인은 문구보다 작고, 남성 요실금은 넓어지고, 믿음은 수상·얼굴로 쌓는다", "apply": [{"k": "[가격 행사] 행사 문구에 '주력 제품 할인율'을 먼저 쓰기", "p": "우선", "d": "Knix는 '최대 50%'를 걸었지만 주력 누수방지 속옷은 20~25%였다. 우리 행사는 주력 제품 할인율을 먼저 쓰고, 최대 할인 제품은 따로 표기해 문구와 실제가 같게 만든다. 별표 조건을 숨기지 않는다.", "r": "① Knix · ③ Skims", "who": "2본부 쇼핑몰팀 · 광고·콘텐츠팀"}, {"k": "[가격 행사] 블프 뒤 12월에 해외 누수방지 속옷 실제 할인율 표를 주 1회 갱신", "p": "검토", "d": "Knix·Modibodi·Skims의 정가·행사가·할인율을 같은 칸으로 매주 기록한다. '최대' 문구와 실제 할인율을 나란히 적어 행사 수준을 판단하는 기준으로 쓴다.", "r": "① Knix · ③ Skims", "who": "2본부 쇼핑몰팀"}, {"k": "[제품] 남성 요실금 제품 비교표 만들기", "p": "우선", "d": "디펜드 맨 가드와 수려니 맨 프로텍트의 흡수량·가격·형태(패드·속옷 일체형)를 확인해 한 표로 정리하고, 다회용 남성 요실금 속옷이 들어갈 자리가 있는지 판단한다.", "r": "② 수려니", "who": "4본부 제품·출시팀 · 2본부 쇼핑몰팀"}, {"k": "[마케팅] 수상·인증·시험 성적서를 쓰는 '증빙형 문구' 정리", "p": "검토", "d": "와코루는 마더스 셀렉션 수상, 동아제약은 유튜브 수상을 앞세운다. 우리는 의료기기·복지용구 등재, 시험 성적서처럼 실제 증빙이 있는 것만 문구로 쓰는 규칙을 만든다. 의학 효능처럼 읽히는 표현은 쓰지 않는다.", "r": "④ 와코루 · ⑦ 동아제약", "who": "2본부 광고·콘텐츠팀 · 3본부 인허가"}, {"k": "[마케팅] 생리·요실금 정보 영상 기획", "p": "검토", "d": "동아제약 '무해한 제작소'처럼 제품 광고보다 정보를 먼저 주는 영상으로 믿음을 쌓는다. 사이즈 고르는 법, 세탁·건조법, 흡수량 읽는 법 같은 주제부터 시험한다.", "r": "⑦ 동아제약", "who": "1본부 유튜브팀 · 2본부 광고·콘텐츠팀"}, {"k": "[제품] 사이즈 폭 점검 — 요실금팬티·브라 사이즈표 비교", "p": "검토", "d": "일본 나이트브라는 20사이즈까지 낸다. 우리 요실금팬티·브라 사이즈표를 경쟁 제품과 나란히 놓고 빈 사이즈가 있는지 본다. '편하다'는 말은 사이즈·소재 정보와 함께 쓴다.", "r": "⑤ Mieloa · ⑨ 컴포트 패션", "who": "4본부 제품·출시팀"}, {"k": "[마케팅] 몸 비교를 부르는 광고 피하기", "p": "유지", "d": "중국 Ubras 사례에서 배우 속옷 사진에 '몸 비교하지 말자'는 반응이 붙었다. 광고는 몸매 대비보다 실사용 장면과 후기 중심으로 간다. 후기 인용에는 이름·아이디를 쓰지 않는다.", "r": "⑥ Ubras · ⑧ 마리떼", "who": "2본부 광고·콘텐츠팀"}, {"k": "[원단 시험] 텐셀 모달·흡한속건 나일론 흡수·건조 시간 비교 시험 설계", "p": "검토", "d": "앞 회차에서 후보로 오른 텐셀 모달과 흡한속건 나일론을 같은 조건에서 흡수 속도와 건조 시간으로 비교하는 시험 항목을 정한다. 결과 숫자는 성적서가 나온 뒤에만 문구에 쓴다.", "r": "용어·영상 참고 (오늘 소식 근거 아님)", "who": "4본부 제품·출시팀"}], "glossary": [{"term": "흡수쇼츠 (吸水ショーツ)", "easy": "일본에서 생리·분비물을 흡수하는 속옷을 부르는 이름.", "why": "일본 시장을 조사하거나 큐텐재팬에 올릴 때 쓰는 검색어다.", "video": {"title": "【ユニクロ吸水ショーツ】ついに出た！エアリズム生理用吸水ショーツ 開封レビュー", "url": "https://www.youtube.com/watch?v=rE2rHwSyfcc"}}, {"term": "누수방지 (leakproof)", "easy": "새지 않게 막는 층이 들어간 속옷.", "why": "Knix·Modibodi가 가장 앞에 쓰는 말이다. 우리 생리팬티·요실금팬티 비교 기준이 된다.", "video": {"title": "DOES PERIOD UNDERWEAR WORK? KNIX LEAKPROOF UNDERWEAR REVIEW", "url": "https://www.youtube.com/watch?v=mekEZpxxpP8"}}, {"term": "흡수량 (mL·cc)", "easy": "속옷 한 장이 담을 수 있는 액체의 양. 1cc는 1mL와 같다.", "why": "일본은 mL, 국내는 '4시간' 같은 시간 표기가 많아 비교 기준을 맞춰야 한다."}, {"term": "오리모노 (おりもの)", "easy": "질 분비물을 뜻하는 일본 말.", "why": "일본 흡수쇼츠가 생리 외에 새로 내세우는 쓰임새다.", "video": {"title": "話題の【サニタリー用吸水ショーツ】本音レビュー！「本当に吸うのか」「快適なのか」徹底検証", "url": "https://www.youtube.com/watch?v=a9IT5nJdPUs"}}, {"term": "노와이어", "easy": "철심이 없는 브라.", "why": "앞 회차 지그재그 노와이어 +25%처럼 국내 수요가 늘고 있다."}, {"term": "심리스 (무봉제)", "easy": "솔기(바느질선)가 없는 속옷.", "why": "몸에 자국이 남지 않는다는 점이 마케팅 문구로 쓰인다."}, {"term": "텐셀 모달", "easy": "나무에서 얻은 부드러운 섬유. 텐셀은 원사 회사의 상표 이름이다.", "why": "여러 속옷 업체가 쓰는 소재로, 우리 원단 후보이기도 하다.", "video": {"title": "TENCEL™ Modal x Micro technology: finer fibers, softer feeling", "url": "https://www.youtube.com/watch?v=XN6uRBJ2Egk"}}, {"term": "흡한속건", "easy": "땀을 빨아들이고 빨리 마르는 성질.", "why": "생리팬티 겉감·안감 성능을 말할 때 쓰는 시험 항목이다.", "video": {"title": "[Made In Korea] 휴비스, 초경량 흡한속건 나일론 소재 '휘셀(Whicel)' 선보여", "url": "https://www.youtube.com/watch?v=iuB4eDdwREc"}}, {"term": "DWR (내구 발수)", "easy": "물이 스며들지 않고 방울로 맺혀 흘러내리게 하는 가공.", "why": "방수층 위에 쓰는 가공이라, 불소 화학물질(PFAS) 없는 대체 가공이 규제 쟁점이다.", "video": {"title": "DWR(발수 가공) 설명 영상 · Dry Guy Waterproofing (원제목 미확인)", "url": "https://www.youtube.com/watch?v=F3yM2nGNlIo"}}, {"term": "PFAS", "easy": "잘 분해되지 않고 오래 남는 불소계 화학물질 묶음.", "why": "미국 일부 주는 생리용품에서 금지, EU도 제한을 추진한다. 원단 시험서와 바로 이어진다."}, {"term": "나이트브라", "easy": "잘 때 입는 편한 브라.", "why": "일본에서 인기 있는 품목으로, Mieloa처럼 사이즈를 넓게 낸다."}, {"term": "별표(*) 할인 조건", "easy": "'최대 70%*'처럼 숫자 뒤 별표에 붙는 제외·제한 조건.", "why": "Knix처럼 큰 숫자 뒤에 조건이 있다. 우리 행사 문구를 점검할 때 본다."}, {"term": "앰버서더", "easy": "브랜드를 대표해 얼굴로 나서는 사람.", "why": "마리떼 언더웨어처럼 패션 브랜드가 속옷 라인에 쓰는 마케팅 방식이다."}], "glossaryHeadline": "흡수쇼츠·누수방지·흡수량·DWR·PFAS·별표 할인 조건 같은 오늘 용어를 쉽게 풀었습니다", "media": {"headline": "시장 감시라 행사 다시보기는 없어, 흡수 속옷 후기와 요실금팬티·원단 설명 영상을 붙였습니다 (존재 확인 11/26)", "videos": [{"title": "【ユニクロ吸水ショーツ】ついに出た！エアリズム生理用吸水ショーツ 開封レビュー", "url": "https://www.youtube.com/watch?v=rE2rHwSyfcc", "len": "길이 미확인", "note": "女性ホルモン大学 · 일본 기준 제품(유니클로) 흡수 쇼츠 개봉 후기"}, {"title": "話題の【サニタリー用吸水ショーツ】本音レビュー！「本当に吸うのか」「快適なのか」徹底検証", "url": "https://www.youtube.com/watch?v=a9IT5nJdPUs", "len": "길이 미확인", "note": "LALA*CHANNEL · 일본 흡수 쇼츠 실사용 검증"}, {"title": "DOES PERIOD UNDERWEAR WORK? KNIX LEAKPROOF UNDERWEAR REVIEW"
