캐미솔 거래액 증가 (1~10월)"]], "overviewNote": "이번 주는 흡수 쇼츠·생리팬티 신제품을 일본·미국·유럽에서 7일 안에 새로 찾지 못했고, 뉴욕주·EU PFAS 규제도 새 소식이 없었습니다. 대신 광고 처분·고객 불만·실적 숫자가 중심입니다. 국내 다회용 생리팬티·요실금팬티 가격은 이번 주 새로 확인한 것이 없어 가격표는 해외 위주입니다. 1장당 가격은 정리하며 직접 나눈 계산값이고, 통화가 달라 원화로 바꾸지 않았습니다.", "sectionLabel": "소식", "sections": [{"tm": "상 · 11.24", "name": "babysheep (宝贝羊)", "co": "중국 · 시장감독국 행정처분(11/13자)·텐센트뉴스·시나 · 11/22~25 보도", "title": "팬티형 생리대 광고 한 편에 벌금 45만 위안", "q": "AI로 만든 영상이라는 변명은 감경 사유가 되지 않았다.", "hl": ["감경", "사유가"], "pts": ["<b>무엇이 새로운가:<\/b> 8월 1일 광고에서 여성이 생리 냄새를 놀리는 대사가 나왔고, 취안저우시 펑쩌구 시장감독국이 '공공질서·사회 미풍 위배'로 처분을 확정했다. 처분 대상은 광고주 회사이고, 위법 광고 게시 중지 명령도 함께 나왔다.", "<b>숫자:<\/b> 벌금 45만 위안. 제작비 170위안(외주 제작사), 더우인 쪽 광고비 22,994.14위안. 보도는 벌금이 제작비의 약 2,647배라고 계산했다. 제품은 22~24매 한 팩 24.9~29.9위안, 월 5만 개 넘게·누적 100만 개 넘게 팔렸다(보도).", "<b>마케팅:<\/b> 더우인 광고에 값싼 AI 영상을 썼다. 회사는 8월 6일 사과문에서 영상 영구 삭제, 모든 채널 소재(AI 포함) 점검, 직원 교육을 약속했다.", "<b>고객 반응:<\/b> 직접 인용은 확보하지 못했다. 보도는 '소비자 의문 제기', '고객센터 답변이 불만을 키웠다' 수준으로 전했다.", "<b>한계:<\/b> 처분일 11/13은 텐센트뉴스 한 곳만 밝혔고 법 조항 번호와 결정서 원문은 확인하지 못했다.", "<b>우리에게:<\/b> 생리·요실금 비하 표현은 AI·외주 제작이어도 광고주 책임이다. 쇼츠·광고·AI 영상 소재를 외주분까지 공개 전 검수 관문에 넣고, 생리·요실금을 놀리는 표현을 금칙어로 정한다."], "nums": [["45만", "위안", "벌금 (위법 광고 게시 중지 명령 함께)", 1], ["170", "위안", "광고 한 편 제작비"], ["22,994", "위안", "더우인 쪽 광고비"], ["2,647", "배", "벌금 ÷ 제작비 (보도 계산)"]], "src": "텐센트뉴스 11/24 (처분 결정서 인용) · 시나 재경 11/23 · 계면신문 (8월 경위)", "grade": "확인"}, {"tm": "상 · 11.27", "name": "단색", "co": "한국 · 파이낸셜뉴스 (입력 11/27, 주소 날짜 11/23) · 업체 대표 발언", "title": "9월 생리팬티 매출 +25.4%, 요실금 '쉬펜드' 7층 구조 공개", "q": "정면 경쟁자가 생리팬티에서 요실금까지 한 줄로 묶는다.", "hl": ["요실금까지"], "pts": ["<b>무엇이 새로운가:<\/b> 생리팬티는 전기방사 기술 특허 흡수원단에 5층 구조, 일상용·수면용으로 나눴다. 요실금 관리용 '쉬펜드'는 더블메쉬 7층 구조. 경기 광명 공장에서 직접 만들어 흡수층 배치·봉제 사양을 관리한다고 밝혔다.", "<b>숫자:<\/b> 9월 생리팬티 매출 전년 같은 달보다 25.4% 증가, 회사 전체 매출 21.3% 증가. 판매 채널 판매액은 2분기에 전 분기보다 19.6%, 3분기에 11.6% 늘었다(3분기는 1분기보다 33.5% 많음). 가격·후기 수·평점은 기사에 없다.", "<b>마케팅:<\/b> 앞으로 초경 무렵 청소년용·수면용 강화, 생리팬티 전용 세정제, 오프라인 유통 확대, 일본 등 아시아 진출을 검토한다고 했다.", "<b>고객 반응:<\/b> 칭찬 \"얇아서 빨리 마르고 흡수가 잘돼서\"(2023년 후기) / 불만 \"결국 방수재질이라 추울 때는 괜찮은데 덥잖아\"(커뮤니티 댓글, 날짜 미상). 더운 날 답답함이 반복 불만이다. 오래된 후기라 참고용.", "<b>우리에게:<\/b> 요실금팬티 원단 시험에 흡수량만이 아니라 통기성·더운 날 착용감을 함께 넣는다. 경쟁자의 '층 수' 표현에 맞설 우리 구조 설명을 숫자로 준비한다."], "bars": {"t": "단색 매출·판매액 증가율 (업체 발표, 단위 %)", "u": "%", "rows": [["9월 생리팬티 (전년 같은 달 대비)", 25.4, "a"], ["회사 전체 매출", 21.3, "b"], ["판매 채널 2분기 (전 분기 대비)", 19.6, "c"], ["판매 채널 3분기 (전 분기 대비)", 11.6, "c"]]}, "nums": [["5", "층", "생리팬티 구조"], ["7", "층", "요실금용 '쉬펜드' 더블메쉬 구조", 1]], "src": "파이낸셜뉴스 (업체 대표 발언 기반) · 인스티즈 후기", "grade": "확인"}, {"tm": "중 · 11.26", "name": "유한킴벌리 × 미앤드", "co": "한국 · 헤럴드경제·SR타임스 11/26~27 · 시상식 11/25 · 업체 보도자료", "title": "'빨아쓰는 남성 요실금 속옷', CSR 필름 페스티벌 동반성장 대상", "q": "대기업이 흡수 기준을 세우고 사회적기업이 다회용 속옷을 만들었다.", "hl": ["흡수", "기준을"], "pts": ["<b>무엇이 새로운가:<\/b> '2026 CSR 필름 페스티벌 어워드' 동반성장부문 대상(동반성장위원장상). 유한킴벌리가 디펜드 노하우로 흡수력·샘 방지 성능 기준을 세우고, 사회적기업 미앤드가 소재 선정·패턴 설계·디자인으로 다회용 속옷을 만들었다. 경기도사회적경제원 지원사업이다.", "<b>숫자:<\/b> 2024년 조사(1,000명)에서 40~69세 남성의 44%가 최근 3개월 안에 요실금을 겪었고, 가벼운 요실금 경험률은 17%. 소재·흡수량·사이즈·가격·판매처는 기사에 없다.", "<b>마케팅:<\/b> 제품 광고보다 '상생·사회적경제' 이야기로 상을 받아 보도를 얻었다. 중앙일보 '디펜드, 30~40대 구매 비중 확대' 기사는 제목만 확인했다.", "<b>고객 반응:<\/b> 기사에 고객 후기는 없다.", "<b>우리에게:<\/b> '다회용 요실금 속옷' 시장에 대기업 기준이 들어왔다. 우리도 흡수 기준을 숫자로 공개할지, 어떤 시험 방식으로 낼지 정한다. 남성 고객 비중이 큰 통계는 남성용 제품 검토 근거로 쓴다."], "nums": [["44", "%", "40~69세 남성 최근 3개월 요실금 경험", 1], ["17", "%", "가벼운 요실금 경험률"], ["1,000", "명", "2024년 조사 대상"]], "src": "헤럴드경제 · SR타임스 (업체 보도자료 기반)", "grade": "확인"}, {"tm": "중 · 11.22", "name": "지그재그(카카오스타일) · 전통 속옷 회사", "co": "한국 · 이코노미스트 11/22 (주소 날짜 11/18) · 지표는 지그재그 제공", "title": "노와이어·심리스·얇은 끈이 크고, 전통사 매출은 줄었다", "q": "온라인 신생 쪽이 크고 전통 속옷 회사는 줄었다.", "hl": ["온라인", "신생"], "pts": ["<b>무엇이 새로운가:<\/b> 2026년 1~10월 지그재그 이너웨어 거래액이 전년 같은 기간보다 15% 늘었고, 노와이어·심리스·얇은 끈 브래지어·캐미솔이 성장을 이끌었다.", "<b>숫자:<\/b> 노와이어 +25%, 심리스 +34%, 얇은 끈 브래지어 +386%, 캐미솔 +720%. 전통사는 BYC 매출 1,632억 원(-1.2%), 신영와코루 1,852억 원(-5.9%, 영업이익 28억 → 13억 원), 비비안 1~9월 1,653억 원(-14.6%), 베리시 915억 원(+41%).", "<b>마케팅:<\/b> 입점 브랜드들은 체험단 후기와 라이브 방송으로 후기를 먼저 모은다.", "<b>고객 반응:<\/b> 기사에 직접 후기는 없다. 거래액 숫자가 선호를 보여 준다.", "<b>우리에게:<\/b> 노와이어·심리스·얇은 끈이 성장 낱말이다. 속옷은 후기와 사이즈 정보가 구매를 정하므로, 새 제품은 출시 초에 체험단 후기와 사이즈 안내를 먼저 갖춘다."], "bars": {"t": "전통 속옷 회사 매출 (단위 억 원, 비비안은 1~9월)", "u": "억 원", "rows": [["신영와코루", 1852, "c"], ["비비안 (1~9월)", 1653, "c"], ["BYC", 1632, "c"], ["베리시", 915, "a"]]}, "table": [["회사", "매출 증감"], ["베리시", "+41%"], ["BYC", "-1.2%"], ["신영와코루", "-5.9% (영업이익 28억 → 13억 원)"], ["비비안 (1~9월)", "-14.6%"]], "src": "이코노미스트 (지그재그 제공 지표)", "grade": "확인"}, {"tm": "중 · 11.24", "name": "그리티 '감탄'", "co": "한국 · 비욘드포스트 11/24·이코노미스트 11/22 · 지난 소식 후속", "title": "블프 앙코르 최대 75%(12/1까지), 봉제선 대신 '젤리 퓨징' 브라", "q": "홈쇼핑을 줄이고 자사몰로 수익성을 올렸다.", "hl": ["자사몰로"], "pts": ["<b>무엇이 새로운가:<\/b> 홀리데이 에디션 브라는 봉제선 대신 원단을 붙이는 '젤리 퓨징', 팬티는 반 하이웨스트 무봉제 퓨징, 소재는 모달+실크. 골프브라 '제철 속옷' 전략은 제목 요약만 봤다.", "<b>숫자:<\/b> 공식 온라인몰 12월 1일까지 블랙프라이데이 앙코르 할인 최대 75%(정가는 없음). 지난해 매출 2,017억 원(+3.6%), 2026년 2분기 매출 599억 원(-3.5%)·영업이익 37억 원(+56.3%), 상반기 자사몰 매출 +17.1%.", "<b>마케팅:<\/b> 블프 행사를 한 번 더 여는 '앙코르'로 기간을 늘렸다. 홈쇼핑 비중을 줄여 수수료를 아꼈다고 설명했다.", "<b>고객 반응:<\/b> 기사에 후기는 없다.", "<b>우리에게:<\/b> 12월 1일 마감 직후 고객의 가격 비교가 들어온다. 할인 2차 카드를 미리 정해 두고, 판매 채널 수수료 구조를 볼 때 자사몰 비중을 키운 이 사례를 참고한다."], "nums": [["75", "%", "블프 앙코르 최대 할인 (12/1까지)", 1], ["56.3", "%", "2분기 영업이익 증가 (37억 원)"], ["17.1", "%", "상반기 자사몰 매출 증가"]], "src": "비욘드포스트 · 이코노미스트 (업체 발표)", "grade": "확인"}, {"tm": "중 · 11.23", "name": "七度空间 (헝안)", "co": "중국 · 장난두스바오 11/23·펑황망 재게재 · 소비자 주장", "title": "팬티형 생리대 속 검은 이물 투소, 검사 결과 아직 없음", "q": "1위권 회사도 개별 이물 건 응대가 느리다.", "hl": ["응대가"], "pts": ["<b>무엇이 새로운가:<\/b> 사용 전 개봉했더니 제품 안쪽에 검은 덩어리가 붙어 있었고, 포장은 파손이 없었다는 소비자 투소가 보도됐다. 검사 결과는 아직 없다.", "<b>숫자:<\/b> 3매 8.5위안, 11/15 구매, 포장 표기 생산일 2026-08-28. 11/17 소비자와 회사가 검사 의뢰에 합의했고, 11/23까지 회사는 회신 시점을 밝히지 못했다.", "<b>마케팅:<\/b> 해당 없음(품질 투소).", "<b>고객 반응:<\/b> 같은 소비자: \"포장 봉투는 파손이 없었다.\" \"처음엔 피인 줄 알았는데 가까이 보니 새까만 이물이었다.\"(중국어 원문을 우리말로 옮김)", "<b>우리에게:<\/b> 출하 전 이물 점검과 불량 신고 처리 기한을 정해 두면 상세페이지에 '약속'으로 쓸 수 있다. 응대 지연이 보도로 번지는 것을 막는 고객센터 기준도 함께 정한다."], "nums": [["8.5", , "p": "검토", "d": "그리티는 블프를 '앙코르'로 12/1까지 늘렸고, VEIMIA는 잡지 게재에 세트 5%와 구매 금액별 쿠폰을 묶었다. 12월 초 경쟁사 가격을 다시 모으고, 세트·금액별 계단 할인 시안을 미리 만들어 둔다.", "r": "⑤ 그리티 · ⑩ VEIMIA", "who": "2본부 쇼핑몰팀"}, {"k": "[마케팅] 출하 전 이물 점검·불량 신고 처리 기한을 상세페이지 약속으로", "p": "검토", "d": "七度空间은 검사 합의 뒤에도 회신 시점을 밝히지 못해 보도가 났다. 출하 전 이물 점검 절차와 불량 신고 처리 기한을 정해 고객센터 기준으로 삼고, 지킬 수 있는 범위만 상세페이지에 적는다.", "r": "⑥ 七度空间", "who": "2본부 쇼핑몰팀 · 4본부 제품·출시팀"}, {"k": "[마케팅] 해외 쇼핑몰 입점 때 브랜드 등록 권한 먼저 확보", "p": "유지", "d": "Victoria's Secret은 재판매자 상품을 막고 브랜드 대리인 계정만 남겼다. 일본 등 해외 판매를 넓힐 때 브랜드 등록부터 해 두고, 국내 오픈마켓의 무단 재판매 대응 기준도 함께 정한다.", "r": "⑧ Victoria's Secret", "who": "2본부 쇼핑몰팀 · 일본 수출 담당"}], "glossary": [{"term": "팬티형 생리대 (중국 '안수이쿠')", "easy": "팬티처럼 입는 일회용 생리대. 주로 밤에 샘을 막으려고 쓴다.", "why": "오늘 중국 소식 두 건(광고 벌금·이물 투소)의 제품이다. 다회용 생리팬티와 값·쓰임을 비교하는 기준이 된다."}, {"term": "광고 미풍양속 위배", "easy": "사회의 좋은 풍속을 해치는 광고라는 처분 사유. 중국은 생리 냄새를 놀리는 광고를 이렇게 봤다.", "why": "생리·요실금 광고는 효능 과장뿐 아니라 '놀리는 표현'도 처분 대상이 될 수 있어 금칙어 관리가 필요하다."}, {"term": "PFAS", "easy": "물·기름을 튕기는 불소 화합물 수천 종의 묶음. 잘 분해되지 않아 '영원한 화학물질'이라 부른다.", "why": "방수·발수 가공에 써 왔고 생리팬티 소송·규제의 중심이라, 방수층 원단 성적서에서 꼭 확인한다.", "video": {"title": "Alternatives to PFAS in textiles", "url": "https://www.youtube.com/watch?v=XDzv25W902Q"}}, {"term": "흡수층과 방수층 (PUL·TPU)", "easy": "흡수층은 액체를 잡는 속층, 방수층은 새지 않게 막는 막. PUL은 폴리우레탄을 입힌 천, TPU는 얇은 필름이다.", "why": "요실금팬티 성능은 두 층의 조합으로 정해진다. 방수막이 PFAS 없는 재료인지 따로 확인한다.", "video": {"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=uzq4d-ks-G4"}}, {"term": "흡수량 mL(cc)와 '탐폰 몇 개분'", "easy": "1mL는 1cc와 같다. '탐폰 몇 개분'은 비교하기 쉽게 바꾼 마케팅 표현이다.", "why": "업체마다 표기 기준이 다를 수 있어 광고 문구 점검 대상이다. '가벼운 요실금' 같은 말은 mL 숫자와 함께 써야 한다.", "video": {"title": "성인용 기저귀, 제품 따라 흡수 성능 차이 커 / 연합뉴스TV", "url": "https://www.youtube.com/watch?v=TQ0aq2pFGHY"}}, {"term": "층 구조 (5층·7층)", "easy": "흡수·확산·방수 같은 역할을 하는 원단을 몇 겹 겹쳤는지 나타낸 말.", "why": "단색이 생리팬티 5층·요실금 7층을 내세운다. 층 수보다 흡수량·통기성 숫자로 비교되도록 설명을 준비한다."}, {"term": "심리스(무봉제) 편직", "easy": "봉제 없이 편직기에서 통째로 짜는 방식.", "why": "봉제선 마찰이 적어 착용감에 유리하고, 지그재그에서 심리스 거래액이 34% 늘었다."}, {"term": "퓨징·접착 구조", "easy": "실로 꿰매는 대신 원단끼리 붙여 이음선을 없애는 방식.", "why": "그리티 '젤리 퓨징', NUDEA×Etam 접착 구조처럼 이음선 없는 제품이 늘어, 우리 제품의 이음선 내구 시험과 비교 기준이 된다."}, {"term": "노와이어 브라", "easy": "철심(와이어) 없이 만든 브라.", "why": "지그재그에서 25% 늘어난 성장 낱말로, 상품명·검색어에 쓸 수 있다."}, {"term": "텐셀 모달", "easy": "나무 펄프로 만든 재생 섬유. 부드럽고 땀을 잘 빨아들인다.", "why": "피부에 닿는 안감 후보다. 흡수량은 안감이 아니라 흡수층이 정한다."}, {"term": "재생 폴리아미드", "easy": "버려진 나일론 등을 다시 써서 만든 나일론 계열 원단.", "why": "NUDEA×Etam이 74%를 썼다. 친환경 문구를 쓰려면 혼용률과 근거 서류가 필요하다."}, {"term": "GOTS·OEKO-TEX 100", "easy": "GOTS는 유기농 섬유 공급망 인증, OEKO-TEX 100은 완제품 유해물질 시험 인증이다.", "why": "둘 다 '안전' 근거로 쓰이지만 서로 다른 것이다. PFAS 무함유까지 보증하는지는 항목을 따로 확인한다."}, {"term": "의약외품 허가 (식약처)", "easy": "식약처에 의약외품으로 허가를 받아야 팔 수 있는 제도.", "why": "생리팬티 허가 준비와 직결된다. 다회용 생리팬티·요실금팬티의 구체 허가 기준은 이번에 확인하지 못해 인허가 쪽에서 따로 확인한다."}, {"term": "브랜드 등록과 제3자 판매자", "easy": "제3자 판매자는 브랜드가 아닌 사람이 그 브랜드 상품을 파는 것. 브랜드 등록은 쇼핑몰에 '이 브랜드 주인'임을 등록해 관리 권한을 받는 것이다.", "why": "Victoria's Secret은 재판매자를 막고 브랜드 대리인 계정만 남겼다. 해외 쇼핑몰에 들어갈 때 가격 붕괴를 막는 장치다."}], "glossaryHeadline": "팬티형 생리대·광고 처분 사유부터 흡수층·퓨징·브랜드 등록까지 오늘 소식에 나온 말을 쉽게 풀었습니다", "media": {"headline": "시장 감시라 행사 다시보기는 없어, 생리팬티 PFAS 논란·흡수 시험·누수방지 속옷 구조 영상을 붙였습니다 (존재 확인)", "videos": [{"title": "Deconstructing Leakproof Underwear", "url": "https://www.youtube.com/watch?v=uzq4d-ks-G4", "len": "길이 미확인", "note": "Little Onion Cloth · 누수방지 속옷을 뜯어 흡수층 구조를 보여 줌"}, {"title": "성인용 기저귀, 제품 따라 흡수 성능 차이 커 / 연합뉴스TV", "url": "https://www.youtube.com/watch?v=TQ0aq2pFGHY", "len": "길이 미확인", "note": "연합뉴스TV · 한국소비자원 흡수 성능 시험 보도 (일회용 기저귀지만 흡수 시험 방식 참고)"}, {"title": "Best & Worst Period Underwear Review + Which contain PFAS?", "url": "https://www.youtube.com/watch?v=9JXZ-ihgvl0", "len": "길이 미확인", "note": "My Green Closet · 경쟁 생리팬티 비교와 PFAS 포함 여부"}, {"title": "TESTING PFAS FREE PERIOD UNDERWEAR BRANDS | THINX CONTROVERSY", "url": "https://www.youtube.com/watch?v=rsSyqnSZMVg", "len": "길이 미확인", "note": "The Ginga Lifta · 생리팬티 PFAS 논란, 소비자 쪽 시각 (개인 유튜버라 독립 시험 근거로는 약함)"}, {"title": "Are Period Underwear *INCLUDING THINX* Really Unsafe?", "url": "https://www.youtube.com/watch?v=IzgCeqxMdFQ", "len": "길이 미확인", "note": "Dani Smith · 생리팬티 안전성 질문, 마케팅이 답해야 할 반대편 시각"}, {"title": "Alternatives to PFAS in textiles", "url": "https://www.youtube.com/watch?v=XDzv25W902Q", "len": "길이 미확인", "note": "Empa-TV (스위스 연구기관) · 발수 원단의 PFAS 대체 방법"}, {"title": "[디펜드] 써보면 아는 차이, 디펜드 스타일 라이너", "url": "https://www.youtube.com/watch?v=7qUqi4m3tr8", "len": "길이 미확인", "note": "디펜드 공식 채널 · 제조사 마케팅 표현 사례 (독립 시험 아님, 3번 소식 유한킴벌리 관련)"}], "checked": [["구글뉴스 RSS: 생리팬티·요실금 속옷·노와이어 브라·심리스 (국내)", "있음 — 오늘 소식 후보"], ["Bing 뉴스 RSS (낱말 하나씩)", "있음 — 원문 주소가 바로 나옴"], ["수유브라·시니어 속옷·와디즈 속옷/생리팬티·식약처 생리팬티/요실금·홈쇼핑·올리브영 속옷", "없음"], ["쿠팡", "건너뜀 (접속 차단 예상)"], ["매일경제·중앙일보·연합뉴스 원문", "막힘 — 제목·요약만 확인"], ["무신사 겨울 블프 속옷 실적", "없음 (방문객·일정만 보도)"], ["PR TIMES (VEIMIA·ウンナナクール·ピーチ・ジョン)", "열림"], ["일본 흡수 쇼츠·나이트 브라·요실금 팬티 7~14일", "있음, 새 소식 없음 (앞 회차에 수록)"], ["중국 생리팬티·방수 속옷 검색", "없음 / 팬티형 생리대·광고·이물 검색은 있음 (소식 1·6)"], ["미국·유럽 RSS (period underwear·leakproof·Victoria's Secret·Skims·Aerie·독일어·프랑스어)", "있음 (일부 429 오류)"], ["트러스트파일럿 영국 (Modibodi·WUKA·Cheeky Wipes)", "열림"], ["thinx.com·Knix·Saalt·Bambody 사이버먼데이", "없음 / 막힘"], ["뉴욕주 시행 전 안내·Thinx 소송 후속·캘리포니아·메인·콜로라도", "새 소식 없음"], ["Kickstarter·Indiegogo", "없음 (냉감 속옷 1건뿐)"], ["Makuake·라쿠텐·아마존 일본 순위·샤오훙수·더우인", "이번엔 못 봄 (시간·접근 한계)"], ["유튜브", "7편 존재 확인 (oEmbed). 길이·게시일은 확인 못 함, 은 항균 설명·국내 생리팬티 세탁 뒤 누수 시험 영상은 못 찾음"]], "docs": [["텐센트뉴스: babysheep 처분 결정서 인용", "https://news.qq.com/rain/a/20261124A0BPAV00"], ["파이낸셜뉴스: 단색 생리팬티·쉬펜드", "https://www.fnnews.com/news/202611231011135545"], ["PPC Land: 아마존 Victoria's Secret 판매자 차단", "https://ppc.land/amazon-blocks-third-party-victorias-secret-sellers-from-november-26/"], ["Retail Times: NUDEA × Etam PURE FIT", "https://retailtimes.co.uk/nudea-x-etam-pure-fit-to-launch-in-january-2027/"]]}, "sources": [["텐센트뉴스: babysheep 광고 벌금 45만 위안 (처분일 11/13)", "https://news.qq.com/rain/a/20261124A0BPAV00"], ["시나 재경: babysheep
