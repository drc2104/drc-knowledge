<script>
(function(){
const L=JSON.parse(document.getElementById("lib-data").textContent);
const $=id=>document.getElementById(id);

function render(){

  let rows=L.items.filter(i=>topic==="전체"||i.topic===topic);
  if(q)rows=rows.filter(i=>(i.title+i.subtitle+i.headline+i.summary.join(" ")+i.topic+i.type).includes(q));
  $("ttl").textContent=(topic==="전체"?"전체 자료":topic)+" "+rows.length+"건";
  $("list").innerHTML=rows.length?rows.map((i,k)=>{const tc=(L.topics.find(t=>t.name===i.topic)||{}).color||"";
